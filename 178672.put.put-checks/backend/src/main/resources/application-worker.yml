spring:
  config:
    activate:
      on-profile: worker

server:
  port: 8081

checks:
  scheduling:
    dispatcher-enabled: true
    partition-scheduler-enabled: true
    retention-pruner-enabled: true
  reports:
    delivery-enabled: true
  worker-mode: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
