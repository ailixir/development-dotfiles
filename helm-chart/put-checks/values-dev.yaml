backend:
  replicaCount: 1
  springProfile: api,dev

  ingress:
    host: checks-api.dev.citi.com

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  env:
    # STUDIO-OBS-009 AC-4 / A6: heap and core dumps off (the two negative flags, no HeapDumpPath);
    # asserted on every value set by dump-settings.test.ts.
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    CHECKS_CORS_ALLOWED_ORIGINS: "https://checks.dev.citi.com"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.dev.svc.cluster.local:8081"

  # application-dev.yml falls back to jdbc:postgresql://localhost:5432, which inside a pod is
  # nothing; SPRING_DATASOURCE_* outranks that profile file.
  envFromSecrets:
    - secretName: checks-db-credentials-dev
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "10"
    checks.sources.UI_TEST: "false"
    checks.scheduling.min-interval-seconds: "30"

  topologySpreadConstraints:
    enabled: false

# Vault-backed secrets are disabled throughout the production alpha. Tests alone select the fake.
studioVault:
  provider: none

# Development does not pretend to provide model translation unless a developer opts in with valid
# Vertex routing. The base chart is production-safe, so dev overrides that selection explicitly.
studioGateway:
  environment: local
  provider: disabled
  vertexConfigMap:
    name: ""

worker:
  replicaCount: 1
  springProfile: worker,dev

  podDisruptionBudget:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env:
    # STUDIO-OBS-009 AC-4 / A6: heap and core dumps off (the two negative flags, no HeapDumpPath);
    # asserted on every value set by dump-settings.test.ts.
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.dev.svc.cluster.local:8081"

  # application-dev.yml falls back to jdbc:postgresql://localhost:5432, which inside a pod is
  # nothing; SPRING_DATASOURCE_* outranks that profile file.
  envFromSecrets:
    - secretName: checks-db-credentials-dev
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "10"
    checks.executor.max-concurrency: "40"
    checks.executor.source-limits.HTTP: "30"
    checks.executor.source-limits.TCP: "30"
    checks.executor.source-limits.SPLUNK: "10"
    checks.executor.source-limits.GRAFANA: "10"
    checks.executor.source-limits.ITRS: "10"
    checks.executor.source-limits.APPDYNAMICS: "10"
    checks.executor.source-limits.UI_TEST: "5"
    checks.scheduling.batch-size: "50"
    checks.scheduling.poll-interval-ms: "30000"
    checks.scheduling.min-interval-seconds: "30"

  topologySpreadConstraints:
    enabled: false

frontend:
  replicaCount: 1

  ingress:
    host: checks.dev.citi.com

  env:
    REACT_APP_API_BASE_URL: "https://checks-api.dev.citi.com/api/v1"
    VITE_API_URL: "https://checks-api.dev.citi.com"
    VITE_API_BASE_URL: "/api/v1"
    VITE_DEBUG_MODE: "true"

  # What the bundle reads at run time (see values.yaml); the `env` above is not read by it.
  runtimeConfig:
    apiBaseUrl: "https://checks-api.dev.citi.com/api/v1"
    debugMode: true

# ---------------------------------------------------------------------------
# Studio runner (story 10.18a). Off in dev (ED-05's internal image is what staging deploys).
# Enabling it here is not enough for a working Studio run: also turn on
# `studioObserved.replayEnabled` and `studioObserved.validationEnabled` and supply
# `studioObserved.catalog` (the runner image's {profile, build} entry; a deploy-time input with no
# default), and keep `checks.sources.UI_TEST=true`. Without the catalog the backend's observed
# replay stays off and Studio runs are refused with 409 RUNTIME_INCOMPATIBLE.
# ---------------------------------------------------------------------------
studioRunner:
  enabled: false
  replicaCount: 2
  # Pod sizes (resources, /dev/shm, scratch) come from `values.yaml`: a pod runs two browsers.
  # STUDIO-OBS-009: the TLS listener's inputs. Secret NAMES are per environment; the fingerprint is
  # NOT here, deliberately: it is the SHA-256 of this environment's backend client certificate,
  # which this repository does not know. It is required, has no default, and the render fails
  # without it (`--set-string studioRunner.tls.controllerCertificateFingerprint256=<AA:BB:...>`).
  tls:
    secretName: checks-studio-runner-tls-dev
  backendTls:
    secretName: checks-studio-backend-runner-tls-dev
  # Guided mode is OFF here. Enabling it is a per-environment decision that also needs
  # `replicaCount: 1`, a `capacity` and the token issuer (register U21); its pod resources come from
  # `values.yaml` (STARTING VALUES, UNMEASURED, GA plan G-4).
  guided:
    enabled: false
    callbackToken:
      secretName: checks-studio-guided-callback-token-dev
    backendTokens:
      secretName: checks-studio-guided-controller-tokens-dev
  # SPK-04 has not ruled. `RuntimeDefault` is the starting value everywhere and the only
  # alternative is a Platform-approved `Localhost` profile — never `Unconfined`, and never a
  # disabled sandbox.
  seccompProfile:
    type: RuntimeDefault
