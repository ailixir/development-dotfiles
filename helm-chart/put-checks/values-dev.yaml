backend:
  replicaCount: 1
  springProfile: api,dev

  ingress:
    host: checks-api.dev.citi.com

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  env:
    # STUDIO-OBS-009 AC-4 / A6: heap and core dumps off (the two negative flags, no HeapDumpPath);
    # asserted on every value set by dump-settings.test.ts.
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    CHECKS_CORS_ALLOWED_ORIGINS: "https://checks.dev.citi.com"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.dev.svc.cluster.local:8081"

  # application-dev.yml falls back to jdbc:postgresql://localhost:5432, which inside a pod is
  # nothing; SPRING_DATASOURCE_* outranks that profile file.
  envFromSecrets:
    - secretName: checks-db-credentials-dev
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "10"
    # Studio is on in every environment (user decision 2026-11-02): the API advertises the UI_TEST
    # source exactly as UAT does. The worker inherits the application default (true).
    checks.sources.UI_TEST: "true"
    checks.scheduling.min-interval-seconds: "30"

  topologySpreadConstraints:
    enabled: false

# Vault-backed secrets are disabled throughout the production alpha. Tests alone select the fake.
studioVault:
  provider: none

# Studio plain-English authoring uses the real Vertex AI provider in dev, as in UAT and production
# (user decision 2026-11-02: every environment has the same Studio flexibility as local). Endpoint,
# project and location are environment-owned values in the `checks-studio-vertex-dev` ConfigMap, and
# workload identity supplies ADC. `environment` is only a chart label: `staging` is the label that
# goes with the real Vertex path, and the dev Spring profile is not one of the profiles the chart's
# deployed-profile guard keys on.
studioGateway:
  environment: staging
  provider: vertex
  model: gemini-3.8-flash
  vertexConfigMap:
    name: checks-studio-vertex-dev

worker:
  replicaCount: 1
  springProfile: worker,dev

  podDisruptionBudget:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env:
    # STUDIO-OBS-009 AC-4 / A6: heap and core dumps off (the two negative flags, no HeapDumpPath);
    # asserted on every value set by dump-settings.test.ts.
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.dev.svc.cluster.local:8081"

  # application-dev.yml falls back to jdbc:postgresql://localhost:5432, which inside a pod is
  # nothing; SPRING_DATASOURCE_* outranks that profile file.
  envFromSecrets:
    - secretName: checks-db-credentials-dev
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "10"
    checks.executor.max-concurrency: "40"
    checks.executor.source-limits.HTTP: "30"
    checks.executor.source-limits.TCP: "30"
    checks.executor.source-limits.SPLUNK: "10"
    checks.executor.source-limits.GRAFANA: "10"
    checks.executor.source-limits.ITRS: "10"
    checks.executor.source-limits.APPDYNAMICS: "10"
    checks.executor.source-limits.UI_TEST: "5"
    checks.scheduling.batch-size: "50"
    checks.scheduling.poll-interval-ms: "30000"
    checks.scheduling.min-interval-seconds: "30"

  topologySpreadConstraints:
    enabled: false

frontend:
  replicaCount: 1

  ingress:
    host: checks.dev.citi.com

  env:
    REACT_APP_API_BASE_URL: "https://checks-api.dev.citi.com/api/v1"
    VITE_API_URL: "https://checks-api.dev.citi.com"
    VITE_API_BASE_URL: "/api/v1"
    VITE_DEBUG_MODE: "true"

  # What the bundle reads at run time (see values.yaml); the `env` above is not read by it.
  runtimeConfig:
    apiBaseUrl: "https://checks-api.dev.citi.com/api/v1"
    debugMode: true

# ---------------------------------------------------------------------------
# Studio runner (story 10.18a). ON in dev, as in every environment (user decision 2026-11-02:
# "make sure all the environments have the same flexibility as we have local"); the shape is UAT's,
# with `-dev` resource names. Studio runs, guided learning and observed replay all work here.
#
# Installing needs the same deploy-time inputs as UAT, none of them committed, and the chart's
# `required` guards fail the render naming the key until each is supplied:
#   - `studioRunner.tls.controllerCertificateFingerprint256` (--set-string <AA:BB:...>)
#   - `studioRunner.guided.token.issuer` and `.controllerSubject` (--set-string), and
#     `.publicKey` (a PEM, `-f guided-public-key.dev.yaml`)
#   - `studioObserved.catalog` (`-f observed-catalog.<digest>.yaml`, generated by CI from the pushed
#     runner image)
# and these pre-provisioned objects: Secrets `checks-studio-runner-tls-dev`,
# `checks-studio-backend-runner-tls-dev`, `checks-studio-guided-callback-token-dev`,
# `checks-studio-guided-controller-tokens-dev`, `checks-studio-runner-identity-dev`,
# `checks-studio-runner-object-store-dev`, `checks-api-object-store-dev`, and the ConfigMap
# `checks-studio-vertex-dev`.
# ---------------------------------------------------------------------------
studioRunner:
  # The guided mTLS chain is mandatory here without any dev-specific value: the chart renders
  # `studio.guided-authoring.mtls-required: true` on the API in every environment, and
  # `application-dev.yml` sets the same, as `application-staging.yml` and `application-prod.yml` do.
  enabled: true
  # One pod: guided learning is on below and runs on exactly one runner pod (A2.6; per-pod routing for
  # several learning pods is deferred). Replay shares that pod: pool 2 (`runnerEnv`, the chart default).
  # Pod sizes (resources, /dev/shm, scratch) come from `values.yaml` (unmeasured starting values).
  replicaCount: 1
  # STUDIO-OBS-009: the TLS listener's inputs. Secret NAMES are per environment; the fingerprint is
  # NOT here, deliberately: it is the SHA-256 of this environment's backend client certificate,
  # which this repository does not know. It is required, has no default, and the render fails
  # without it (`--set-string studioRunner.tls.controllerCertificateFingerprint256=<AA:BB:...>`).
  tls:
    secretName: checks-studio-runner-tls-dev
  backendTls:
    secretName: checks-studio-backend-runner-tls-dev
  # Guided learning is ON (STUDIO-FLEX-001 item 5): one pod, three concurrent learning sessions
  # (`capacity`, rendered to the runner and to the backend's deployment-wide cap), beside a replay
  # pool of 2. The token inputs are NOT here, like the controller pin above: they come from the
  # external token issuer (register U21) at deploy time, and the render fails naming the key until
  # all three are supplied (never invented, never committed):
  #   --set-string studioRunner.guided.token.issuer=<iss>
  #   --set-string studioRunner.guided.token.controllerSubject=<sub>
  #   -f guided-public-key.dev.yaml   (`studioRunner.guided.token.publicKey`, a PEM)
  guided:
    enabled: true
    capacity: 3
    callbackToken:
      secretName: checks-studio-guided-callback-token-dev
    backendTokens:
      secretName: checks-studio-guided-controller-tokens-dev
  # SPK-04 has not ruled. `RuntimeDefault` is the starting value everywhere and the only
  # alternative is a Platform-approved `Localhost` profile — never `Unconfined`, and never a
  # disabled sandbox.
  seccompProfile:
    type: RuntimeDefault
  callbackBaseUrl: ""
  identity:
    secretName: checks-studio-runner-identity-dev
  objectStore:
    credentialsSecret: checks-studio-runner-object-store-dev
objectStore:
  credentialsSecret: checks-api-object-store-dev

# Observed replay is ON, as in UAT (STUDIO-OBS-009 residue, architect ruling OI-06 B5). `catalog` is
# NOT committed: the catalog entry is specific to one runner image. It comes at deploy time, and the
# render fails naming the key until it is supplied:
#   -f observed-catalog.<digest>.yaml   (generated by CI from the pushed runner image)
studioObserved:
  validationEnabled: true
  replayEnabled: true
