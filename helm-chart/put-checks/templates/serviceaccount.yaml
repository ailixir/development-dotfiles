{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "put-checks.serviceAccountName" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.studioRunner.enabled .Values.studioRunner.serviceAccount.create }}
---
# The runner's **dedicated** service account (ADR-001 §9: "should get its own service account when
# RBAC differs … decided in 10.18"; architecture §9.3 "restricted service-account access").
#
# Sharing the chart's account would give the process that opens untrusted pages whatever the API's
# account is granted next, silently and at the moment it is granted. The runner calls no Kubernetes
# API at all, so its token is not merely unnecessary — it is a credential §9.2 says it must not
# hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "put-checks.studioRunner.serviceAccountName" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.studioRunner.selectorLabels" . | nindent 4 }}
  {{- with .Values.studioRunner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.studioRunner.serviceAccount.automountServiceAccountToken }}
{{- end }}
