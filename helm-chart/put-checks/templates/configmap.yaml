{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.api.fullname" . }}-config
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.api.selectorLabels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.backend.service.port | quote }}
---
# Spring property names belong in configuration data, not environment-variable names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.api.fullname" . }}-properties
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
data:
  application.yaml: |
    {{- .Values.backend.configOverrides | toYaml | nindent 4 }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.worker.fullname" . }}-config
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.worker.selectorLabels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.worker.service.port | quote }}
---
# Spring property names belong in configuration data, not environment-variable names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.worker.fullname" . }}-properties
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
data:
  application.yaml: |
    {{- .Values.worker.configOverrides | toYaml | nindent 4 }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.frontend.fullname" . }}-config
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.frontend.selectorLabels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.frontend.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- if .Values.studioRunner.enabled }}
---
# The object-store lifecycle declaration (§6.2, ED-03 / SPK-03).
#
# **Logical expiry is what the API enforces**, at `videoExpiresAt`, and it renders from the same
# `objectStore.retention` key as the API's and worker's `STUDIO_EVIDENCE_RETENTION` — one key, two
# rendered values, compared to each other rather than each to a literal (AC-12).
#
# This ConfigMap declares the window the bucket's lifecycle rule must be set to; it does not apply
# it, and applying it is Platform/SRE's under ED-03. **No claim of exact-time physical deletion is
# made here or anywhere else in this chart**: whether lifecycle expiry is prompt, whether
# noncurrent versions and delete markers are collected, and whether a GET on an expired object
# still serves are all SPK-03's to measure (AC-11, blocked).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.fullname" . }}-studio-object-store
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
data:
  STUDIO_OBJECT_STORE_LIFECYCLE: {{ .Values.objectStore.retention | quote }}
  STUDIO_OBJECT_STORE_KEY_PREFIX: {{ .Values.studioRunner.objectStore.keyPrefix | quote }}
{{- end }}
