{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "put-checks.api.fullname" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "put-checks.api.selectorLabels" . | nindent 6 }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.backend.configOverrides | toYaml | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "put-checks.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.backend.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.backend.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.backend.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "put-checks.api.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.backend.springProfile | quote }}
            # The same single retention key as the worker and the object-store lifecycle
            # declaration (§6.2, AC-12).
            - name: STUDIO_EVIDENCE_RETENTION
              value: {{ .Values.objectStore.retention | quote }}
            # ── The kill switch and the dispatcher, on the API (story 10.18b, AC-23a) ─────
            #
            # The kill switch comes from its own values key. The dispatcher is `false` here as a
            # LITERAL and not a values key, because the API never dispatches in any configuration:
            # `StudioDispatcher` is a worker-profile bean, and a values key that appeared to turn
            # it on would be a control that does nothing — which is worse than no control, because
            # somebody would rely on it. Written explicitly rather than left to a default because
            # `application.yml` (`false`) and `Dispatcher.enabledOrDefault()` (`true`) disagree.
            - name: STUDIO_EXECUTION_ENABLED
              value: {{ .Values.studioExecution.enabled | quote }}
            - name: STUDIO_DISPATCHER_ENABLED
              value: "false"
            # ── The SSE bounds the edge is configured against (story 10.18b, AC-13a) ──────
            #
            # These two are the ONLY values SnapshotBroadcaster reads, and the streaming Ingress's
            # `proxy-read-timeout` is derived from `studioSse.lifetimeSeconds` — the same key that
            # renders `STUDIO_SSE_LIFETIME` here. A test compares the rendered annotation against
            # these rendered values in the SAME manifest, so the proxy bound and the application
            # bound cannot drift apart unobserved. Raising the heartbeat above the timeout is M11.
            - name: STUDIO_SSE_HEARTBEAT
              value: {{ printf "%ds" (int .Values.studioSse.heartbeatSeconds) | quote }}
            - name: STUDIO_SSE_LIFETIME
              value: {{ printf "%ds" (int .Values.studioSse.lifetimeSeconds) | quote }}
            # ── ED-02: the three identity bypasses, closed in the deployed profile (AC-19a) ─────
            #
            # ⚠ **THE CODE PATHS STILL EXIST. THEY ARE CLOSED HERE BY CONFIGURATION, NOT REMOVED.**
            # `BffSessionAuthenticationFilter` carries three ways to obtain an identity the
            # platform never vouched for: the hardcoded Core-service bypass, the client-supplied
            # `X-User-Id` header path (which is checked FIRST, so closing the bypass alone closes
            # nothing for a client that sends a header), and the `/api/v1/csi` read bypass that
            # appends `checks-admin`. All three now read a property whose default is `false`, and
            # all three are rendered `false` here so that the value is deliberate and visible in
            # the manifest rather than inherited from a default somebody may change.
            #
            # **No credentialed pilot may run until ED-02 has linked completed tickets.** ED-02's
            # owner reads "TBD — not assigned in sources"; @po could not name one and raised the
            # escalation to @pm. The real vault is ALSO still a stub: `SecretsService` returns
            # `REDACTED`. See `docs/runbooks/studio-runner.md` §9.
            - name: CHECKS_BYPASS_CORE_SERVICE
              value: {{ .Values.backend.identityBypass.coreService | quote }}
            - name: CHECKS_BYPASS_IDENTITY_HEADERS
              value: {{ .Values.backend.identityBypass.identityHeaders | quote }}
            - name: CHECKS_BYPASS_CSI_READ
              value: {{ .Values.backend.identityBypass.csiRead | quote }}
            {{- range $key, $val := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range .Values.backend.envFromSecrets }}
            {{- $secretName := .secretName }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "put-checks.api.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # **The read-only store principal**, and a *different* Kubernetes Secret from the
            # runner's write-only one (§6.2, ED-03): the runner writes only the `studio/` prefix
            # and holds no Get or List permission; the API and the recovery path read and never
            # write. Two principals, asserted unequal in the rendered manifest rather than each
            # matched against a literal (AC-10a).
            - name: object-store-credentials
              mountPath: {{ .Values.objectStore.mountPath }}
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: object-store-credentials
          secret:
            secretName: {{ .Values.objectStore.credentialsSecret }}
            items:
              {{- range .Values.objectStore.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "put-checks.worker.fullname" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.worker.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "put-checks.worker.selectorLabels" . | nindent 6 }}
  {{- with .Values.worker.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.worker.configOverrides | toYaml | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "put-checks.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 45 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.worker.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.worker.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.worker.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "put-checks.worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- with .Values.worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.worker.springProfile | quote }}
            {{- if .Values.studioRunner.enabled }}
            # **Derived from the runner's own Service, never restated.** `application.yml` has no
            # default for this (`STUDIO_RUNNER_BASE_URL` falls back to empty, and an empty base URL
            # closes every dispatch DISPATCH_FAILED), while `studio-runner/src/server/config.ts`
            # defaults its listener to 8080. The chart is therefore the single source of the
            # address: both the worker's URL and the runner's listener render from
            # `studioRunner.service.port` (AC-1).
            - name: STUDIO_RUNNER_BASE_URL
              value: "http://{{ include "put-checks.studioRunner.fullname" . }}:{{ .Values.studioRunner.service.port }}"
            # **The bearer the worker presents on POST /v1/runs (DEF-05, Studio v1 WP2).** Without
            # it `HttpRunnerDispatchClient` refuses every dispatch before sending. It is read from
            # the SAME Secret and key the runner reads its inbound `STUDIO_RUNNER_SERVICE_IDENTITY`
            # from (`studioRunner.identity.*`), so the two sides cannot be configured apart, and the
            # value never appears in values or in the manifest.
            - name: STUDIO_RUNNER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.serviceIdentityKey }}
            {{- end }}
            # ── The kill switch and the dispatcher, on the WORKER (story 10.18b, AC-23a) ──
            #
            # Two distinct values keys, because they are two distinct decisions. Engaging the kill
            # switch must NOT also stop the dispatcher: BRD §9 requires queued undispatched work to
            # be closed EXPLICITLY when the switch goes off, and `StudioDispatcher.dispatchOnce()`
            # is what closes it — a worker with the dispatcher off would leave that work queued
            # until its deadline, which is the opposite of what the switch promises.
            #
            # This is the ONLY component with the dispatcher enabled.
            - name: STUDIO_EXECUTION_ENABLED
              value: {{ .Values.studioExecution.enabled | quote }}
            - name: STUDIO_DISPATCHER_ENABLED
              value: {{ .Values.studioExecution.dispatcherEnabled | quote }}
            # Logical expiry, which is what the API enforces at `videoExpiresAt` (§6.2). The
            # object-store lifecycle window renders from this same key; physical deletion on the
            # store is asynchronous and nothing in this chart claims otherwise.
            - name: STUDIO_EVIDENCE_RETENTION
              value: {{ .Values.objectStore.retention | quote }}
            {{- range $key, $val := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range .Values.worker.envFromSecrets }}
            {{- $secretName := .secretName }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "put-checks.worker.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
