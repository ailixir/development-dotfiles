{{- /* Guided mode is a mode of the runner and needs its pod (A2.6): `guided.enabled` with the runner
       off must fail here, because nothing else would render and the values would be ignored. The
       same guard runs first in the runner Deployment for the replica, autoscaler and PID-1 rules. */ -}}
{{- $_ := include "put-checks.studioRunner.guidedGuard" . }}
{{- /* Observed replay (G-O1..G-O4) is checked here too, outside `backend.enabled`: `studioObserved`
       on with `studioRunner.enabled: false` would otherwise render nothing and be ignored. */ -}}
{{- $_ := include "put-checks.studioObserved.guard" . }}
{{- /* The domain whitelist feeds the API and worker properties whether or not a runner renders. */ -}}
{{- $_ := include "put-checks.studioNavigation.guard" . }}
{{- if .Values.backend.enabled }}
{{- include "put-checks.springConfig.validate" (index .Values "backend") }}
{{- $gatewayProvider := required "studioGateway.provider is required" .Values.studioGateway.provider -}}
{{- if not (has $gatewayProvider (list "disabled" "vertex")) -}}
{{- fail (printf "studioGateway.provider must be one of disabled, vertex; got %q" $gatewayProvider) -}}
{{- end -}}
{{- $gatewayEnvironment := required "studioGateway.environment is required" .Values.studioGateway.environment -}}
{{- if not (has $gatewayEnvironment (list "local" "ci" "staging" "production")) -}}
{{- fail (printf "studioGateway.environment must be one of local, ci, staging, production; got %q" $gatewayEnvironment) -}}
{{- end -}}
{{- $apiProfiles := splitList "," .Values.backend.springProfile -}}
{{- $isStagingProfile := has "staging" $apiProfiles -}}
{{- $isProductionProfile := has "prod" $apiProfiles -}}
{{- $isDeployedProfile := or $isStagingProfile $isProductionProfile -}}
{{- if and $isStagingProfile (ne $gatewayEnvironment "staging") -}}
{{- fail (printf "backend.springProfile=%q requires studioGateway.environment=staging; the environment label cannot weaken deployed Studio guards" .Values.backend.springProfile) -}}
{{- end -}}
{{- if and $isProductionProfile (ne $gatewayEnvironment "production") -}}
{{- fail (printf "backend.springProfile=%q requires studioGateway.environment=production; the environment label cannot weaken deployed Studio guards" .Values.backend.springProfile) -}}
{{- end -}}
{{- if and $isDeployedProfile (ne $gatewayProvider "vertex") -}}
{{- fail (printf "backend.springProfile=%q requires studioGateway.provider=vertex; disabled translation cannot serve an enabled Studio" .Values.backend.springProfile) -}}
{{- end -}}
{{- $uiTestOverride := index .Values.backend.configOverrides "checks.sources.UI_TEST" | default "false" | toString | lower -}}
{{- $uiTestEnv := index .Values.backend.env "CHECKS_SOURCES_UI_TEST" | default "false" | toString | lower -}}
{{- $uiTestEnabled := or (eq $uiTestOverride "true") (eq $uiTestEnv "true") -}}
{{- if and $isDeployedProfile (not $uiTestEnabled) -}}
{{- fail (printf "backend.springProfile=%q requires checks.sources.UI_TEST=true (backend.configOverrides) or CHECKS_SOURCES_UI_TEST=true (backend.env); Studio cannot be advertised with its source disabled" .Values.backend.springProfile) -}}
{{- end -}}
{{- $vertexConfigMapName := .Values.studioGateway.vertexConfigMap.name | default "" -}}
{{- if eq $gatewayProvider "vertex" -}}
{{- $_ := required "studioGateway.model is required for provider=vertex" .Values.studioGateway.model -}}
{{- if $vertexConfigMapName -}}
{{- $_ := required "studioGateway.vertexConfigMap.endpointKey is required for provider=vertex" .Values.studioGateway.vertexConfigMap.endpointKey -}}
{{- $_ := required "studioGateway.vertexConfigMap.projectKey is required for provider=vertex" .Values.studioGateway.vertexConfigMap.projectKey -}}
{{- $_ := required "studioGateway.vertexConfigMap.locationKey is required for provider=vertex" .Values.studioGateway.vertexConfigMap.locationKey -}}
{{- else -}}
{{- $_ := required "studioGateway.endpoint or studioGateway.vertexConfigMap.name is required for provider=vertex" .Values.studioGateway.endpoint -}}
{{- $_ := required "studioGateway.project or studioGateway.vertexConfigMap.name is required for provider=vertex" .Values.studioGateway.project -}}
{{- $_ := required "studioGateway.location or studioGateway.vertexConfigMap.name is required for provider=vertex" .Values.studioGateway.location -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "put-checks.api.fullname" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "put-checks.api.selectorLabels" . | nindent 6 }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "put-checks.backend.springProperties" (dict "root" . "role" "api") | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.studioAuditSiem.enabled }}
        # The studio audit stream is on stdout with "stream":"studio-audit"; these mark the pod for
        # the platform's log forwarder (AC-5). Platform-specific annotations come from values.
        put.citi.com/studio-audit-stream: "studio-audit"
        {{- with .Values.studioAuditSiem.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "put-checks.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.backend.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.backend.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.backend.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "put-checks.api.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
            {{- if include "put-checks.studioRunner.guidedEnabled" . }}
            # The guided TLS connector (clientAuth=need), exposed only through the dedicated
            # `<fullname>-api-guided-tls` Service and admitted from the runner by its NetworkPolicy.
            - name: guided-tls
              containerPort: {{ .Values.studioRunner.guided.tlsConnector.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/put-checks/config/application.yaml"
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.backend.springProfile | quote }}
            # The same single retention key as the worker and the object-store lifecycle
            # declaration (§6.2, AC-12).
            - name: STUDIO_EVIDENCE_RETENTION
              value: {{ .Values.objectStore.retention | quote }}
            - name: STUDIO_EVIDENCE_PROVIDER
              value: {{ .Values.objectStore.provider | quote }}
            - name: STUDIO_EVIDENCE_DIRECTORY
              value: {{ .Values.objectStore.localDirectory | quote }}
            - name: STUDIO_EVIDENCE_ENDPOINT
              value: {{ if eq .Values.objectStore.provider "s3" }}{{ required "objectStore.endpoint is required for provider=s3" .Values.objectStore.endpoint | quote }}{{ else }}{{ .Values.objectStore.endpoint | quote }}{{ end }}
            - name: STUDIO_EVIDENCE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: STUDIO_EVIDENCE_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: STUDIO_EVIDENCE_PATH_STYLE_ACCESS
              value: {{ .Values.objectStore.pathStyleAccess | quote }}
            - name: STUDIO_EVIDENCE_ACCESS_KEY_ID_FILE
              value: {{ printf "%s/accessKeyId" .Values.objectStore.mountPath | quote }}
            - name: STUDIO_EVIDENCE_SECRET_ACCESS_KEY_FILE
              value: {{ printf "%s/secretAccessKey" .Values.objectStore.mountPath | quote }}
            - name: STUDIO_EVIDENCE_CONNECT_TIMEOUT
              value: {{ .Values.objectStore.connectTimeout | quote }}
            - name: STUDIO_EVIDENCE_REQUEST_TIMEOUT
              value: {{ .Values.objectStore.requestTimeout | quote }}
            - name: STUDIO_VAULT_PROVIDER
              value: {{ .Values.studioVault.provider | quote }}
            - name: STUDIO_VAULT_ADDRESS
              value: {{ if eq .Values.studioVault.provider "hashicorp" }}{{ required "studioVault.address is required for provider=hashicorp" .Values.studioVault.address | quote }}{{ else }}{{ .Values.studioVault.address | quote }}{{ end }}
            - name: STUDIO_VAULT_NAMESPACE
              value: {{ .Values.studioVault.namespace | quote }}
            - name: STUDIO_VAULT_MOUNT
              value: {{ .Values.studioVault.mount | quote }}
            - name: STUDIO_VAULT_PATH_TEMPLATE
              value: {{ .Values.studioVault.pathTemplate | quote }}
            - name: STUDIO_VAULT_VALUE_KEY
              value: {{ .Values.studioVault.valueKey | quote }}
            - name: STUDIO_VAULT_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.studioVault.tokenMountPath .Values.studioVault.tokenKey | quote }}
            - name: STUDIO_VAULT_CONNECT_TIMEOUT
              value: {{ .Values.studioVault.connectTimeout | quote }}
            - name: STUDIO_VAULT_REQUEST_TIMEOUT
              value: {{ .Values.studioVault.requestTimeout | quote }}
            - name: STUDIO_VAULT_MAX_RESPONSE_BYTES
              value: {{ .Values.studioVault.maxResponseBytes | quote }}
            - name: STUDIO_GATEWAY_PROVIDER
              value: {{ $gatewayProvider | quote }}
            - name: STUDIO_GATEWAY_ENDPOINT
              {{- if and (eq $gatewayProvider "vertex") $vertexConfigMapName }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $vertexConfigMapName | quote }}
                  key: {{ .Values.studioGateway.vertexConfigMap.endpointKey | quote }}
              {{- else }}
              value: {{ .Values.studioGateway.endpoint | quote }}
              {{- end }}
            - name: STUDIO_GATEWAY_PROJECT
              {{- if and (eq $gatewayProvider "vertex") $vertexConfigMapName }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $vertexConfigMapName | quote }}
                  key: {{ .Values.studioGateway.vertexConfigMap.projectKey | quote }}
              {{- else }}
              value: {{ .Values.studioGateway.project | quote }}
              {{- end }}
            - name: STUDIO_GATEWAY_LOCATION
              {{- if and (eq $gatewayProvider "vertex") $vertexConfigMapName }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $vertexConfigMapName | quote }}
                  key: {{ .Values.studioGateway.vertexConfigMap.locationKey | quote }}
              {{- else }}
              value: {{ .Values.studioGateway.location | quote }}
              {{- end }}
            - name: STUDIO_GATEWAY_MODEL
              value: {{ .Values.studioGateway.model | quote }}
            - name: STUDIO_GATEWAY_CREDENTIALS_MODE
              value: {{ .Values.studioGateway.credentialsMode | quote }}
            - name: STUDIO_GATEWAY_CREDENTIALS_KEY_FILE
              value: {{ printf "%s/%s" .Values.studioGateway.credentialsMountPath .Values.studioGateway.credentialsKey | quote }}
            # ── The kill switch and the dispatcher, on the API (story 10.18b, AC-23a) ─────
            #
            # The kill switch comes from its own values key. The dispatcher is `false` here as a
            # LITERAL and not a values key, because the API never dispatches in any configuration:
            # `StudioDispatcher` is a worker-profile bean, and a values key that appeared to turn
            # it on would be a control that does nothing — which is worse than no control, because
            # somebody would rely on it. Written explicitly rather than left to a default because
            # `application.yml` (`false`) and `Dispatcher.enabledOrDefault()` (`true`) disagree.
            - name: STUDIO_EXECUTION_ENABLED
              value: {{ .Values.studioExecution.enabled | quote }}
            - name: STUDIO_DISPATCHER_ENABLED
              value: "false"
            # ── The SSE bounds the edge is configured against (story 10.18b, AC-13a) ──────
            #
            # These two are the ONLY values SnapshotBroadcaster reads, and the streaming Ingress's
            # `proxy-read-timeout` is derived from `studioSse.lifetimeSeconds` — the same key that
            # renders `STUDIO_SSE_LIFETIME` here. A test compares the rendered annotation against
            # these rendered values in the SAME manifest, so the proxy bound and the application
            # bound cannot drift apart unobserved. Raising the heartbeat above the timeout is M11.
            - name: STUDIO_SSE_HEARTBEAT
              value: {{ printf "%ds" (int .Values.studioSse.heartbeatSeconds) | quote }}
            - name: STUDIO_SSE_LIFETIME
              value: {{ printf "%ds" (int .Values.studioSse.lifetimeSeconds) | quote }}
            # ── ED-02: the three identity bypasses, closed in the deployed profile (AC-19a) ─────
            #
            # ⚠ **THE CODE PATHS STILL EXIST. THEY ARE CLOSED HERE BY CONFIGURATION, NOT REMOVED.**
            # `BffSessionAuthenticationFilter` carries three ways to obtain an identity the
            # platform never vouched for: the hardcoded Core-service bypass, the client-supplied
            # `X-User-Id` header path (which is checked FIRST, so closing the bypass alone closes
            # nothing for a client that sends a header), and the `/api/v1/csi` read bypass that
            # appends `checks-admin`. All three now read a property whose default is `false`, and
            # all three are rendered `false` here so that the value is deliberate and visible in
            # the manifest rather than inherited from a default somebody may change.
            #
            # **No credentialed pilot may run until ED-02 has linked completed tickets.** ED-02's
            # owner is the PUT Core platform (Core BFF), but no external ticket is linked and an
            # owner is not a delivery. The real vault is ALSO still a stub: `SecretsService`
            # returns `REDACTED`. See `docs/runbooks/studio-runner.md` §9.
            - name: CHECKS_BYPASS_CORE_SERVICE
              value: {{ .Values.backend.identityBypass.coreService | quote }}
            - name: CHECKS_BYPASS_IDENTITY_HEADERS
              value: {{ .Values.backend.identityBypass.identityHeaders | quote }}
            - name: CHECKS_BYPASS_CSI_READ
              value: {{ .Values.backend.identityBypass.csiRead | quote }}
            {{- if .Values.studioRunner.enabled }}
            # ── The API's two runner-facing identities (Studio v1 gaps) ─────────────────────────
            #
            # The API talks to the runner in both directions, and without these a chart-deployed
            # API refused every runner callback (the internal chain refuses all callers when its
            # token is empty) and reported VALIDATOR_UNAVAILABLE for every compile.
            #
            # 1. Inbound: the runner's admission/progress callbacks. The token the API accepts is
            #    the SAME Secret key the runner presents as STUDIO_RUNNER_CALLBACK_IDENTITY.
            - name: STUDIO_CALLBACK_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.callbackIdentityKey }}
            # 2. Outbound: POST /v1/validate from the compile pipeline, which runs on the API
            #    (StudioController is `!worker`). Same address and bearer as the worker's
            #    POST /v1/runs, from the same keys, so the three pods cannot be configured apart.
            - name: STUDIO_RUNNER_BASE_URL
              value: {{ include "put-checks.studioRunner.baseUrl" . | quote }}
            - name: STUDIO_RUNNER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.serviceIdentityKey }}
            {{- end }}
            {{- range $key, $val := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range .Values.backend.envFromSecrets }}
            {{- $secretName := .secretName }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "put-checks.api.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: spring-config
              mountPath: /etc/put-checks/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # **The read-only store principal**, and a *different* Kubernetes Secret from the
            # runner's write-only one (§6.2, ED-03): the runner writes only the `studio/` prefix
            # and holds no Get or List permission; the API and the recovery path read and never
            # write. Two principals, asserted unequal in the rendered manifest rather than each
            # matched against a literal (AC-10a).
            {{- if eq .Values.objectStore.provider "s3" }}
            - name: object-store-credentials
              mountPath: {{ .Values.objectStore.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.objectStore.provider "local" }}
            - name: local-object-store
              mountPath: {{ .Values.objectStore.localDirectory }}
            {{- end }}
            {{- if eq .Values.studioVault.provider "hashicorp" }}
            - name: studio-vault-token
              mountPath: {{ .Values.studioVault.tokenMountPath }}
              readOnly: true
            {{- end }}
            {{- if and (eq $gatewayProvider "vertex") (eq .Values.studioGateway.credentialsMode "service-account-file") }}
            - name: studio-gateway-credentials
              mountPath: {{ .Values.studioGateway.credentialsMountPath }}
              readOnly: true
            {{- end }}
            {{- with (include "put-checks.backend.runnerMounts" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: spring-config
          configMap:
            name: {{ include "put-checks.api.fullname" . }}-properties
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.objectStore.provider "s3" }}
        - name: object-store-credentials
          secret:
            secretName: {{ .Values.objectStore.credentialsSecret }}
            items:
              {{- range .Values.objectStore.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        {{- end }}
        {{- if eq .Values.objectStore.provider "local" }}
        - name: local-object-store
          persistentVolumeClaim:
            claimName: {{ include "put-checks.objectStore.localClaim" . }}
        {{- end }}
        {{- if eq .Values.studioVault.provider "hashicorp" }}
        - name: studio-vault-token
          secret:
            secretName: {{ .Values.studioVault.tokenSecret }}
            items:
              - key: {{ .Values.studioVault.tokenKey }}
                path: {{ .Values.studioVault.tokenKey }}
        {{- end }}
        {{- if and (eq $gatewayProvider "vertex") (eq .Values.studioGateway.credentialsMode "service-account-file") }}
        - name: studio-gateway-credentials
          secret:
            secretName: {{ required "studioGateway.credentialsSecret is required for service-account-file" .Values.studioGateway.credentialsSecret }}
            items:
              - key: {{ .Values.studioGateway.credentialsKey }}
                path: {{ .Values.studioGateway.credentialsKey }}
        {{- end }}
        {{- with (include "put-checks.backend.runnerVolumes" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
{{- include "put-checks.springConfig.validate" (index .Values "worker") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "put-checks.worker.fullname" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.worker.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "put-checks.worker.selectorLabels" . | nindent 6 }}
  {{- with .Values.worker.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "put-checks.backend.springProperties" (dict "root" . "role" "worker") | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.studioAuditSiem.enabled }}
        # See the API pod: the same audit stream, the same selector (AC-5).
        put.citi.com/studio-audit-stream: "studio-audit"
        {{- with .Values.studioAuditSiem.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "put-checks.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 45 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.worker.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.worker.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.worker.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "put-checks.worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- with .Values.worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.port }}
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/put-checks/config/application.yaml"
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.worker.springProfile | quote }}
            # **Actuator on the container port the probes use.** `application-worker.yml` sets
            # `management.server.port: 8081` while the ConfigMap's SERVER_PORT moves the main port
            # to `worker.service.port`; with the two apart, /actuator/health/* is served only on the
            # management port and the http-port probes (and the prometheus scrape) find nothing.
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.worker.service.port | quote }}
            {{- if .Values.studioRunner.enabled }}
            # **Derived from the runner's own Service, never restated.** `application.yml` has no
            # default for this (`STUDIO_RUNNER_BASE_URL` falls back to empty, and an empty base URL
            # closes every dispatch DISPATCH_FAILED), while `studio-runner/src/server/config.ts`
            # defaults its listener to 8080. The chart is therefore the single source of the
            # address: both the worker's URL and the runner's listener render from
            # `studioRunner.service.port` (AC-1).
            - name: STUDIO_RUNNER_BASE_URL
              value: {{ include "put-checks.studioRunner.baseUrl" . | quote }}
            # **The bearer the worker presents on POST /v1/runs (DEF-05, Studio v1 WP2).** Without
            # it `HttpRunnerDispatchClient` refuses every dispatch before sending. It is read from
            # the SAME Secret and key the runner reads its inbound `STUDIO_RUNNER_SERVICE_IDENTITY`
            # from (`studioRunner.identity.*`), so the two sides cannot be configured apart, and the
            # value never appears in values or in the manifest.
            - name: STUDIO_RUNNER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.serviceIdentityKey }}
            # **The runner's cancel-path bounds, from the runner's own values keys (Studio v1
            # WP16).** The running reaper here waits `RunnerCancelBudget.effectiveMargin()` before
            # closing a cancel the runner never finished, and that margin is derived from these
            # four bounds. Rendered from `studioRunner.runnerEnv` — the map the runner Deployment
            # renders its environment from — so the worker derives its margin from the values the
            # deployed runner actually runs with, never from defaults. A key the runner does not
            # receive is not rendered here either: both then fall back to the same default, which
            # `RunnerCancelBudgetTest` pins against the runner's `config.ts`.
            {{- $runnerEnv := .Values.studioRunner.runnerEnv | default dict }}
            {{- range $key := list "STUDIO_RUNNER_ADMISSION_TIMEOUT_MS" "STUDIO_RUNNER_BROWSER_STOP_TIMEOUT_MS" "STUDIO_RUNNER_OBJECT_STORE_WINDOW_MS" "STUDIO_RUNNER_TERMINAL_DELIVERY_WINDOW_MS" }}
            {{- if hasKey $runnerEnv $key }}
            - name: {{ $key }}
              value: {{ get $runnerEnv $key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # ── The kill switch and the dispatcher, on the WORKER (story 10.18b, AC-23a) ──
            #
            # Two distinct values keys, because they are two distinct decisions. Engaging the kill
            # switch must NOT also stop the dispatcher: BRD §9 requires queued undispatched work to
            # be closed EXPLICITLY when the switch goes off, and `StudioDispatcher.dispatchOnce()`
            # is what closes it — a worker with the dispatcher off would leave that work queued
            # until its deadline, which is the opposite of what the switch promises.
            #
            # This is the ONLY component with the dispatcher enabled.
            - name: STUDIO_EXECUTION_ENABLED
              value: {{ .Values.studioExecution.enabled | quote }}
            - name: STUDIO_DISPATCHER_ENABLED
              value: {{ .Values.studioExecution.dispatcherEnabled | quote }}
            # Logical expiry, which is what the API enforces at `videoExpiresAt` (§6.2). The
            # object-store lifecycle window renders from this same key; physical deletion on the
            # store is asynchronous and nothing in this chart claims otherwise.
            - name: STUDIO_EVIDENCE_RETENTION
              value: {{ .Values.objectStore.retention | quote }}
            - name: STUDIO_EVIDENCE_PROVIDER
              value: {{ .Values.objectStore.provider | quote }}
            - name: STUDIO_EVIDENCE_DIRECTORY
              value: {{ .Values.objectStore.localDirectory | quote }}
            - name: STUDIO_EVIDENCE_ENDPOINT
              value: {{ if eq .Values.objectStore.provider "s3" }}{{ required "objectStore.endpoint is required for provider=s3" .Values.objectStore.endpoint | quote }}{{ else }}{{ .Values.objectStore.endpoint | quote }}{{ end }}
            - name: STUDIO_EVIDENCE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: STUDIO_EVIDENCE_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: STUDIO_EVIDENCE_PATH_STYLE_ACCESS
              value: {{ .Values.objectStore.pathStyleAccess | quote }}
            - name: STUDIO_EVIDENCE_ACCESS_KEY_ID_FILE
              value: {{ printf "%s/accessKeyId" .Values.objectStore.mountPath | quote }}
            - name: STUDIO_EVIDENCE_SECRET_ACCESS_KEY_FILE
              value: {{ printf "%s/secretAccessKey" .Values.objectStore.mountPath | quote }}
            - name: STUDIO_EVIDENCE_CONNECT_TIMEOUT
              value: {{ .Values.objectStore.connectTimeout | quote }}
            - name: STUDIO_EVIDENCE_REQUEST_TIMEOUT
              value: {{ .Values.objectStore.requestTimeout | quote }}
            - name: STUDIO_VAULT_PROVIDER
              value: {{ .Values.studioVault.provider | quote }}
            - name: STUDIO_VAULT_ADDRESS
              value: {{ if eq .Values.studioVault.provider "hashicorp" }}{{ required "studioVault.address is required for provider=hashicorp" .Values.studioVault.address | quote }}{{ else }}{{ .Values.studioVault.address | quote }}{{ end }}
            - name: STUDIO_VAULT_NAMESPACE
              value: {{ .Values.studioVault.namespace | quote }}
            - name: STUDIO_VAULT_MOUNT
              value: {{ .Values.studioVault.mount | quote }}
            - name: STUDIO_VAULT_PATH_TEMPLATE
              value: {{ .Values.studioVault.pathTemplate | quote }}
            - name: STUDIO_VAULT_VALUE_KEY
              value: {{ .Values.studioVault.valueKey | quote }}
            - name: STUDIO_VAULT_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.studioVault.tokenMountPath .Values.studioVault.tokenKey | quote }}
            - name: STUDIO_VAULT_CONNECT_TIMEOUT
              value: {{ .Values.studioVault.connectTimeout | quote }}
            - name: STUDIO_VAULT_REQUEST_TIMEOUT
              value: {{ .Values.studioVault.requestTimeout | quote }}
            - name: STUDIO_VAULT_MAX_RESPONSE_BYTES
              value: {{ .Values.studioVault.maxResponseBytes | quote }}
            {{- range $key, $val := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range .Values.worker.envFromSecrets }}
            {{- $secretName := .secretName }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "put-checks.worker.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: spring-config
              mountPath: /etc/put-checks/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.objectStore.provider "s3" }}
            - name: object-store-credentials
              mountPath: {{ .Values.objectStore.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.objectStore.provider "local" }}
            - name: local-object-store
              mountPath: {{ .Values.objectStore.localDirectory }}
            {{- end }}
            {{- if eq .Values.studioVault.provider "hashicorp" }}
            - name: studio-vault-token
              mountPath: {{ .Values.studioVault.tokenMountPath }}
              readOnly: true
            {{- end }}
            {{- with (include "put-checks.backend.runnerMounts" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      volumes:
        - name: spring-config
          configMap:
            name: {{ include "put-checks.worker.fullname" . }}-properties
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.objectStore.provider "s3" }}
        - name: object-store-credentials
          secret:
            secretName: {{ .Values.objectStore.credentialsSecret }}
            items:
              {{- range .Values.objectStore.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        {{- end }}
        {{- if eq .Values.objectStore.provider "local" }}
        - name: local-object-store
          persistentVolumeClaim:
            claimName: {{ include "put-checks.objectStore.localClaim" . }}
        {{- end }}
        {{- if eq .Values.studioVault.provider "hashicorp" }}
        - name: studio-vault-token
          secret:
            secretName: {{ .Values.studioVault.tokenSecret }}
            items:
              - key: {{ .Values.studioVault.tokenKey }}
                path: {{ .Values.studioVault.tokenKey }}
        {{- end }}
        {{- with (include "put-checks.backend.runnerVolumes" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "put-checks.frontend.fullname" . }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.frontend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "put-checks.frontend.selectorLabels" . | nindent 6 }}
  {{- with .Values.frontend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.frontend.env | toYaml | sha256sum }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "put-checks.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "put-checks.frontend.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
