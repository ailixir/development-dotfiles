{{- if .Values.studioRunner.enabled }}
{{- $name := include "put-checks.studioRunner.fullname" . }}
{{- $scratch := include "put-checks.studioRunner.scratchDir" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.studioRunner.selectorLabels" . | nindent 4 }}
spec:
  # No CPU-based HorizontalPodAutoscaler anywhere for this component: a saturated runner answers
  # 429/503 and stays ready, so CPU-driven scaling would fight the capacity gate instead of
  # relieving it (§5.2, §8.4). The only scaler is the backlog-driven ScaledObject
  # (studio-runner-scaledobject.yaml), and while it is on it owns the count, so none renders here:
  # a rendered count would be reapplied by every upgrade and fight the scaler.
  {{- if not .Values.studioRunner.autoscaling.enabled }}
  replicas: {{ .Values.studioRunner.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "put-checks.studioRunner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/runner-env: {{ .Values.studioRunner.runnerEnv | toYaml | sha256sum }}
        {{- with .Values.studioRunner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "put-checks.labels" . | nindent 8 }}
        {{- include "put-checks.studioRunner.selectorLabels" . | nindent 8 }}
    spec:
      # **Process reaping (AC-5a, architecture §9.3, ADR-001 §1.1), and the mechanism is named
      # rather than blurred.**
      #
      # Node as PID 1 reaps only its own known children, so an orphaned grandchild — a Chromium
      # helper whose parent died — is re-parented to PID 1 and becomes a zombie. Observed against
      # the built image by reading `/proc/*/status`: with `node` as PID 1 a zombie `sh` accumulates
      # within three seconds; with an init as PID 1 none does.
      #
      # The alternative was an in-image init, and it is declined: the `Dockerfile`'s exec-form CMD
      # is what makes `SIGTERM` reach the process directly so the drain runs — proven here, and
      # falsified by substituting a shell form, after which `docker stop` waits out its full
      # timeout and neither `runner.draining` nor `runner.drained` is emitted — and adding an
      # ENTRYPOINT wrapper to the image ED-05 is going to replace would be work thrown away.
      #
      # `shareProcessNamespace` makes the infrastructure pause container PID 1, and the pause
      # container reaps. **This moves AC-5a's reaping half to AC-5b**, where SPK-04 question 6
      # already asks it in-cluster: a pause container exists only in a real pod, so the property
      # cannot be proven here. Stated, not blurred.
      shareProcessNamespace: {{ .Values.studioRunner.shareProcessNamespace }}
      serviceAccountName: {{ include "put-checks.studioRunner.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.studioRunner.serviceAccount.automountServiceAccountToken }}
      # One derivation (AC-6): the browser runtime cap plus the stop, upload and delivery margins
      # the pod itself is configured with, plus the preStop flip and the configured headroom.
      terminationGracePeriodSeconds: {{ include "put-checks.studioRunner.derivedGraceSeconds" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.studioRunner.podSecurityContext | nindent 8 }}
        seccompProfile:
          # SPK-04 / ADR-001 O-4. One key, never Unconfined, and never silently inherited: a
          # values file that omits it fails the render rather than picking up the backend's.
          type: {{ required "studioRunner.seccompProfile.type is required and is SPK-04's decision (ADR-001 O-4); it is never inherited and never Unconfined" .Values.studioRunner.seccompProfile.type }}
      containers:
        - name: studio-runner
          image: "{{ .Values.studioRunner.image.repository }}:{{ .Values.studioRunner.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.studioRunner.image.pullPolicy }}
          # No `command` and no `args`. The image's CMD is the bare `node dist/main.js` form so
          # SIGTERM reaches the process directly and the drain runs; overriding it here — in any
          # form, and with any flag — is how a sandbox-disabling argument would reach Chromium.
          securityContext:
            {{- toYaml .Values.studioRunner.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.studioRunner.service.port }}
              protocol: TCP
          env:
            # The Service port and the container port are the same single key, so the worker's
            # runner-base-url and the port the runner binds cannot drift apart (AC-1).
            - name: STUDIO_RUNNER_PORT
              value: {{ .Values.studioRunner.service.port | quote }}
            # The scratch path is the single source: this value and the volumeMount below are the
            # same key, compared to each other in the assertion rather than each to a literal.
            - name: STUDIO_RUNNER_SCRATCH_DIR
              value: {{ $scratch | quote }}
            - name: STUDIO_RUNNER_OBJECT_STORE_DIR
              value: {{ printf "%s/objects" $scratch | quote }}
            - name: STUDIO_RUNNER_CALLBACK_BASE_URL
              value: {{ .Values.studioRunner.callbackBaseUrl | quote }}
            - name: STUDIO_RUNNER_SERVICE_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.serviceIdentityKey }}
            - name: STUDIO_RUNNER_CALLBACK_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studioRunner.identity.secretName }}
                  key: {{ .Values.studioRunner.identity.callbackIdentityKey }}
            {{- include "put-checks.studioRunner.env" . | nindent 12 }}
          # **No envFrom.** A ConfigMap or Secret reference here injects whatever keys it carries,
          # which is precisely the open half SEC-2 exploits: the enumerated list above is the only
          # way a variable reaches this container.
          readinessProbe:
            httpGet:
              path: {{ .Values.studioRunner.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.studioRunner.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.studioRunner.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.studioRunner.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.studioRunner.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.studioRunner.probes.periodSeconds }}
          resources:
            {{- toYaml .Values.studioRunner.resources | nindent 12 }}
          volumeMounts:
            # Every writable mount is disjoint from the image's browser registry
            # (PLAYWRIGHT_BROWSERS_PATH) and from $HOME (/home/pwuser). That disjointness is what
            # makes readOnlyRootFilesystem a browser-integrity control rather than tidiness.
            - name: scratch
              # Mounted at the **parent** of the runner's scratch directory. Mounting at the
              # directory itself makes it a mount point, and the runner's start-up `clearAll()`
              # cannot remove a mount point whose parent is read-only — observed as
              # `EROFS … rmdir` against the built image, before the server ever listened.
              mountPath: {{ .Values.studioRunner.scratch.mountPath }}
            - name: dev-shm
              mountPath: /dev/shm
            - name: object-store-credentials
              mountPath: {{ .Values.studioRunner.objectStore.mountPath }}
              readOnly: true
          lifecycle:
            preStop:
              # Flip readiness before the drain: the endpoint leaves the Service while admitted
              # work finishes, rather than being killed with a browser open (§5.2, §8.4).
              exec:
                command: ["sleep", {{ .Values.studioRunner.drain.preStopSleepSeconds | quote }}]
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.studioRunner.scratch.sizeLimit }}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.studioRunner.devShm.sizeLimit }}
        - name: object-store-credentials
          # ⚠ Coupled to `shareProcessNamespace` above (QA MED-1). A second container in this pod
          # reads this Secret through /proc/1/root whatever its own mounts say, so the one-container
          # bound is what keeps the write-only store principal where §6.2 puts it. Asserted in
          # `test/deployment/chart.test.ts` and falsified against a chart copy carrying a sidecar.
          secret:
            secretName: {{ .Values.studioRunner.objectStore.credentialsSecret }}
            items:
              {{- range .Values.studioRunner.objectStore.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
      {{- with .Values.studioRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studioRunner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studioRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
