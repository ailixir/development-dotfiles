{{- if and .Values.backend.enabled .Values.backend.ingress.enabled .Values.studioSse.ingress.enabled }}
{{/*
The streaming route (story 10.18b, AC-13a; architecture §5.5; SSE assessment).

**A SEPARATE Ingress object, and the reason is the whole criterion.** `templates/ingress.yaml`
renders the API as one `path: / pathType: Prefix` rule. nginx annotations are per-Ingress, so
`proxy-buffering: "off"` placed there would unbuffer every REST call in the product in order to fix
two streaming routes. The two streaming paths therefore carry their own object, and the API Ingress
is asserted byte-identical between a render with this object and a render without it.

**The idle timeout is derived from the bounded stream lifetime**
(`put-checks.studioSse.idleTimeoutSeconds` = `lifetimeSeconds` + `idleTimeoutMarginSeconds`) and is
compared, in the rendered manifest, against the `STUDIO_SSE_HEARTBEAT` and `STUDIO_SSE_LIFETIME`
this same render puts on the API container. One derivation, two consumers, and an assertion joining
them — rather than a `proxy-read-timeout` annotation sitting beside a heartbeat env var with nothing
between them, which is the failure mode @po named and this epic's most-repeated defect.

⚠ **NOT VERIFIED THROUGH A REAL INGRESS.** Whether buffering is actually off on the wire, what the
platform's *effective* idle timeout and maximum stream lifetime are, and whether a second Ingress
for the same host has its location-scoped annotations honoured are all ED-06 / SPK-02 questions 3
and 4, both OPEN. This file configures the route; it does not prove the route works. No snippet
annotation is used, because clusters commonly run nginx with `allow-snippet-annotations: false` and
a route that silently fails to apply is worse than one that is plainly unproven.
*/}}
{{- $managed := splitList " " (include "put-checks.studioSse.managedAnnotations" .) -}}
{{- range $key, $value := .Values.studioSse.ingress.extraAnnotations }}
{{- if has $key $managed }}
{{- fail (printf "studioSse.ingress.extraAnnotations carries %q, which this chart derives from studioSse.lifetimeSeconds / heartbeatSeconds. The bound between the upstream idle timeout and the SSE heartbeat has one owner (story 10.18b AC-13a, architecture §5.5); a values key that overrides it is a second derivation of that bound." $key) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "put-checks.api.fullname" . }}-studio-stream
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.api.selectorLabels" . | nindent 4 }}
    put-checks.citi.com/route: studio-stream
  annotations:
    {{- with .Values.studioSse.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Regex paths: this Ingress must cover the two streaming routes and nothing else.
    nginx.ingress.kubernetes.io/use-regex: "true"
    # §5.5 and the SSE assessment: "disable buffering for this route throughout the proxy chain".
    # The controller also honours the `X-Accel-Buffering: no` header ExecutionEventsController
    # already sets, unless it is configured to ignore it — which is SPK-02's to establish.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Strictly greater than the heartbeat and not less than the bounded lifetime — derived from the
    # lifetime, asserted against the heartbeat in the same rendered manifest (AC-13a, M11).
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ include "put-checks.studioSse.idleTimeoutSeconds" . | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ include "put-checks.studioSse.idleTimeoutSeconds" . | quote }}
spec:
  {{- if .Values.backend.ingress.className }}
  ingressClassName: {{ .Values.backend.ingress.className }}
  {{- end }}
  {{- if .Values.backend.ingress.tls }}
  tls:
    {{- range .Values.backend.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    # The same host and the same Service as the API Ingress, read from the same values keys. A
    # second copy of the host is a second thing to get wrong, and a streaming route pointed at the
    # wrong backend fails in the least visible way there is: it works, buffered.
    - host: {{ .Values.backend.ingress.host | quote }}
      http:
        paths:
          - path: {{ include "put-checks.studioSse.eventsPath" . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "put-checks.api.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          # The media route is configured here and PROVEN elsewhere. `<video>` Range requests
          # through the real ingress were moved to story 10.19 by @po at wave-6 validation
          # (AC-17); the route implementation is story 10.15's. This chart owns the edge
          # configuration for it, which is why the path is here before the handler exists.
          - path: {{ include "put-checks.studioSse.videoPath" . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "put-checks.api.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
