nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  # - name: registry-creds

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# API — Spring Boot (profile: api) — serves REST endpoints
# ---------------------------------------------------------------------------
backend:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-backend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  springProfile: api,prod

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: nginx
    host: checks-api.dev.citi.com
    annotations: {}
    tls: []

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

  terminationGracePeriodSeconds: 30

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  env:
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
    CHECKS_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    CHECKS_CORE_SERVICE_URL: "http://checks-core:8081"

  envFromSecrets: []
  # - secretName: checks-db-credentials
  #   keys:
  #     - SPRING_DATASOURCE_URL
  #     - SPRING_DATASOURCE_USERNAME
  #     - SPRING_DATASOURCE_PASSWORD

  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "20"
    checks.scheduling.min-interval-seconds: "60"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# ---------------------------------------------------------------------------
# Worker — Spring Boot (profile: worker,prod) — runs schedulers + executors
# ---------------------------------------------------------------------------
worker:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-backend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  springProfile: worker,prod

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

  terminationGracePeriodSeconds: 45

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  env:
    JAVA_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
    CHECKS_CORE_SERVICE_URL: "http://checks-core:8081"

  envFromSecrets: []
  # - secretName: checks-db-credentials
  #   keys:
  #     - SPRING_DATASOURCE_URL
  #     - SPRING_DATASOURCE_USERNAME
  #     - SPRING_DATASOURCE_PASSWORD

  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "30"
    checks.executor.max-concurrency: "250"
    checks.executor.source-limits.HTTP: "150"
    checks.executor.source-limits.TCP: "150"
    checks.executor.source-limits.SPLUNK: "75"
    checks.executor.source-limits.GRAFANA: "75"
    checks.executor.source-limits.ITRS: "75"
    checks.executor.source-limits.APPDYNAMICS: "75"
    checks.executor.source-limits.UI_TEST: "25"
    checks.scheduling.batch-size: "500"
    checks.scheduling.poll-interval-ms: "10000"
    checks.scheduling.shutdown-timeout-sec: "30"
    checks.scheduling.min-interval-seconds: "60"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# ---------------------------------------------------------------------------
# Frontend — React MFE served via nginx
# ---------------------------------------------------------------------------
frontend:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-frontend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    host: checks.dev.citi.com
    annotations: {}
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  env:
    REACT_APP_API_BASE_URL: "http://checks-api.dev.citi.com/api/v1"
    VITE_API_URL: "http://checks-api.dev.citi.com"
    VITE_API_BASE_URL: "/api/v1"
    VITE_ENABLE_STUDIO: "true"
    VITE_ENABLE_REPORTS: "true"
    VITE_DEBUG_MODE: "false"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
