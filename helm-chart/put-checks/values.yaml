nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  # - name: registry-creds

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# API — Spring Boot (profile: api) — serves REST endpoints
# ---------------------------------------------------------------------------
backend:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-backend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  springProfile: api,prod

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: nginx
    host: checks-api.dev.citi.com
    annotations: {}
    tls: []

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

  terminationGracePeriodSeconds: 30

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  env:
    # STUDIO-OBS-009 AC-4 / A6 (crash artifacts): heap and core dumps are OFF, written as the two explicit
    # negative flags and with no HeapDumpPath. A dump of a pod that held a decrypted Studio secret
    # would be a plaintext copy of it on disk; the JVM default for both is already "off" for a plain
    # OOM kill, so the flags are here to keep an image-level or platform-level override from turning
    # them on without a diff in this file. `dump-settings.test.ts` asserts both on every value set.
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    # **Exact origins, never `*`, and the first entry is this chart's own frontend host**
    # (AC-16a). CORS here is credentialed — `SecurityConfig.buildCorsSource` sets
    # `allowCredentials(true)` — and a wildcard origin with credentials is both rejected by every
    # browser and a request-forgery surface. The value is asserted against the rendered
    # `frontend.ingress.host` in the same manifest: changing one without the other is M12's
    # second mutation and must go red.
    #
    # Base `values.yaml` deployed nothing before this story: its frontend host was
    # `checks.dev.citi.com` while this list held only `http://localhost:3000`, so the browser the
    # chart deploys could not have called the API it deploys. Corrected here rather than left for
    # a staging afternoon.
    #
    # ⚠ **FEDERATED MODE IS NOT COVERED BY THIS LIST AND CANNOT BE** — ED-06 / SPK-02 questions
    # 1-2, OPEN. When the MFE runs inside the PUT platform shell, the browser's origin is the
    # SHELL's, which no values file in this chart knows. Whether the session cookie reaches
    # `/events` and `/video` at all in that mode, and from which origin, is what SPK-02 must state
    # in writing before a pilot.
    CHECKS_CORS_ALLOWED_ORIGINS: "https://checks.dev.citi.com,http://localhost:3000"
    CHECKS_CORE_SERVICE_URL: "http://checks-core:8081"


  # ── ED-02: the three identity bypasses, and what this block does NOT do (AC-19a, AC-20) ──────
  #
  # ⚠ **THE BYPASS CODE PATHS STILL EXIST IN THE APPLICATION. Setting these to `false` closes
  # them; it does not remove them.** @po ruled at wave-6 validation that removing them as code is
  # out of scope — deleting the Core-service bypass moves identity resolution onto
  # `CoreServiceClient`, and the filter's own comment records why that is unavailable: "while the
  # target platform does not provide Core services". So the paths survive, default-closed, and
  # watched by a test pinned to the production symbol.
  #
  # **There are THREE of them, not one.** The epic's records — the manifest's `ED-02` description
  # and the run log's wave-1 baseline entry — have described `ED-02` as a single flag throughout.
  # That is wrong, and it matters: `BffSessionAuthenticationFilter.resolveIdentity` reads the
  # client-supplied `X-User-Id` header and returns **before** it ever reaches the Core-service
  # bypass. Closing `coreService` alone closes nothing at all for a client that sends a header.
  #
  #   coreService     — the hardcoded `return true`, now a property
  #   identityHeaders — X-User-Id / X-User-Email / X-User-Roles / X-User-Csi-Ownership taken off
  #                     the request. Architecture §9.1 requires a trusted gateway to strip these;
  #                     **this repository contains no such gateway**, so with this false the pod
  #                     refuses a direct caller its own identity rather than trusting it.
  #   csiRead         — `applyTemporaryCsiReadBypass`, which appends `checks-admin` to any
  #                     identity making a GET under /api/v1/csi.
  #
  # **The Studio Vault adapter is implemented but not connected**: `studioVault.provider` defaults
  # to `none`; the legacy `SecretsService` still returns `REDACTED`. The PUT Core platform owns
  # ED-02, but no linked delivery exists, and **no credentialed pilot may run until ED-02 has linked
  # completed tickets** (ED-02 gate_note, BRD §8). Default-closed everywhere, including this base
  # file: an environment with no Core service and no trusted gateway gets 401, which §9.1 calls
  # the correct failure direction. An environment that needs one of these open must set it here,
  # deliberately and visibly, and record why. See `docs/runbooks/studio-runner.md` §9 for what an
  # operator may and may not do with these.
  identityBypass:
    coreService: false
    identityHeaders: false
    csiRead: false
  # The database connection. `application.yml` carries no datasource URL for the deployed
  # profiles (prod/staging), so without these the pod cannot start; every value set names its own
  # Secret, and the values themselves never appear here.
  envFromSecrets:
    - secretName: checks-db-credentials
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD

  # Non-secret Spring properties, mounted as application.yaml; canonical Spring env values win.
  # Chart-managed controls are reserved. Do not duplicate a packaged ENV alias here.
  # Preserve canonical property names; do not convert dots or hyphens into env spelling.
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "20"
    # The API advertises Studio only when its source is enabled. Deployed profiles couple this
    # value to the Vertex provider in the chart so the application readiness guard cannot be
    # bypassed by an override that turns the source off (application.yml defaults it to `true`).
    checks.sources.UI_TEST: "true"
    checks.scheduling.min-interval-seconds: "60"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# ---------------------------------------------------------------------------
# Worker — Spring Boot (profile: worker,prod) — runs schedulers + executors
# ---------------------------------------------------------------------------
worker:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-backend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  springProfile: worker,prod

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

  terminationGracePeriodSeconds: 45

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  env:
    # STUDIO-OBS-009 AC-4 / A6: see the API block. Same two flags, same assertion.
    JAVA_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError -XX:-HeapDumpOnOutOfMemoryError -XX:-CreateCoredumpOnCrash"
    CHECKS_CORE_SERVICE_URL: "http://checks-core:8081"

  # The database connection. `application.yml` carries no datasource URL for the deployed
  # profiles (prod/staging), so without these the pod cannot start; every value set names its own
  # Secret, and the values themselves never appear here.
  envFromSecrets:
    - secretName: checks-db-credentials
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD

  # Non-secret Spring properties, mounted as application.yaml; canonical Spring env values win.
  # Chart-managed controls are reserved. Do not duplicate a packaged ENV alias here.
  # Preserve canonical property names; do not convert dots or hyphens into env spelling.
  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "30"
    checks.executor.max-concurrency: "250"
    checks.executor.source-limits.HTTP: "150"
    checks.executor.source-limits.TCP: "150"
    checks.executor.source-limits.SPLUNK: "75"
    checks.executor.source-limits.GRAFANA: "75"
    checks.executor.source-limits.ITRS: "75"
    checks.executor.source-limits.APPDYNAMICS: "75"
    checks.executor.source-limits.UI_TEST: "25"
    checks.scheduling.batch-size: "500"
    checks.scheduling.poll-interval-ms: "10000"
    checks.scheduling.shutdown-timeout-sec: "30"
    checks.scheduling.min-interval-seconds: "60"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# ---------------------------------------------------------------------------
# Frontend — React MFE served via nginx
# ---------------------------------------------------------------------------
frontend:
  enabled: true

  image:
    repository: registry.citi.com/put/checks-frontend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    host: checks.dev.citi.com
    annotations: {}
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  # Container environment only. The static bundle does NOT read these at run time (they are
  # build-time inputs); the API URL the browser uses comes from `runtimeConfig` below. Kept because
  # an image entrypoint may template from them. (VITE_ENABLE_STUDIO / VITE_ENABLE_REPORTS were
  # dropped: nothing in frontend/src reads them.)
  env:
    REACT_APP_API_BASE_URL: "http://checks-api.dev.citi.com/api/v1"
    VITE_API_URL: "http://checks-api.dev.citi.com"
    VITE_API_BASE_URL: "/api/v1"
    VITE_DEBUG_MODE: "false"

  # Run-time configuration of the bundle: `window.__CHECKS_CONFIG__` from `/config.js`
  # (`frontend/public/config.js`, loaded by `index.html`; resolved in `appConfig.ts`).
  # Rendered as a ConfigMap and mounted read-only at `mountPath` with a subPath.
  # ASSUMPTION: the frontend image is not built in this repository; `mountPath` assumes an nginx
  # image serving `/usr/share/nginx/html`. Change it if the image serves from elsewhere.
  runtimeConfig:
    enabled: true
    # Full API base URL including /api/v1, or "/api/v1" when the ingress proxies the API.
    apiBaseUrl: "http://checks-api.dev.citi.com/api/v1"
    # Unset (null) leaves the bundle's build default.
    debugMode: null
    mountPath: /usr/share/nginx/html/config.js

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Studio runner — Node/Playwright browser execution (story 10.18a)
#
# ADR-001 §3 and §9; architecture §8.4, §9.2, §9.3. A separate Deployment, never bundled into the
# backend container: it runs untrusted pages in a real browser and holds none of the platform's
# credentials.
#
# **Disabled by default in this base file, ON in every shipped environment file** (dev, uat, prod;
# user decision 2026-11-02: every environment has the same Studio flexibility as local). CI stage 8
# renders the base with `--set studioRunner.enabled=true`. An environment install therefore needs the
# deploy-time inputs and Secrets listed in its `values-<env>.yaml` (controller pin, guided token
# issuer/subject/public key, observed catalog) and fails the render naming the key without them.
# ---------------------------------------------------------------------------
studioRunner:
  # Off in this base file only: values-dev/uat/prod all set it to true (user decision 2026-11-02).
  # Turning it on also needs `studioObserved.replayEnabled`/`validationEnabled` plus
  # `studioObserved.catalog` (the runner image's catalog entry; no default) and
  # `checks.sources.UI_TEST=true`, else the catalog is empty and Studio runs get 409 RUNTIME_INCOMPATIBLE.
  enabled: false

  image:
    # ED-05: the internal Playwright/Chromium image pinned to the runner package version, running
    # non-root with the Chromium sandbox enabled. The public base image ADR-001 §8 permits is for
    # local development only and must never be what staging deploys.
    repository: registry.citi.com/put/checks-studio-runner
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  # Two browsers per pod (`runnerEnv.STUDIO_RUNNER_POOL_SIZE`, STUDIO-FLEX-001 item 4); scale PODS for
  # more. The resource sizes below are unmeasured starting values. No CPU-based HPA, ever: the runner
  # refuses work with 429/503 and stays ready, so CPU-based scaling would fight the capacity gate
  # rather than help it.
  #
  # Studio v1 decision D3: a static two pods for the pilot. Ignored while `autoscaling.enabled` is
  # true, when the ScaledObject owns the replica count and the Deployment renders none.
  replicaCount: 2

  # KEDA scaling on the dispatch backlog (Studio v1 WP7, decision D3). **Off by default**, because
  # whether KEDA is installed in the target cluster is not known. When on, the chart renders a
  # `keda.sh/v1alpha1` ScaledObject and nothing else: KEDA creates the HPA itself, driven by the
  # external metric below, never by CPU.
  autoscaling:
    enabled: false
    # Never 0. With no runner pod a dispatch is a connection failure, which the dispatcher treats
    # as ambiguous and leaves to the reapers, so scale-to-zero would turn idle into slow failure.
    minReplicaCount: 2
    maxReplicaCount: 4
    pollingIntervalSeconds: 15
    # Must be >= the runner's run deadline (`runnerEnv.STUDIO_RUNNER_MAX_TOTAL_RUNTIME_MS`); the
    # render fails otherwise. Rendered twice from this one key: as KEDA's `cooldownPeriod` (which
    # KEDA applies only to scale-to-zero) and as the HPA scale-down stabilization window (which is
    # what delays a scale-in while minReplicaCount > 0). A pod that is scaled in mid-run still gets
    # SIGTERM and drains within terminationGracePeriodSeconds.
    cooldownPeriodSeconds: 300
    # Target backlog per pod: about one queued run per runner pod.
    targetBacklogPerPod: "1"
    prometheus:
      # Required when enabled; no default, because the cluster's Prometheus address is not known.
      serverAddress: ""
      # The worker exports the backlog, and every worker replica exports the same global count,
      # so the replicas are collapsed with `max` per state before the states are summed. If the
      # Prometheus is shared between releases, add the scrape config's namespace/job label here.
      query: 'sum(max by (state) (studio_dispatch_backlog{state=~"QUEUED|CLAIMED"}))'

  # Voluntary evictions (node drains) take at most one runner pod at a time. `maxUnavailable`
  # rather than `minAvailable`, so that a single-replica override cannot block a drain outright.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  service:
    type: ClusterIP  # never an Ingress: §8.4's internal routes are not publicly exposed
    # **This port is the single source for the runner's address.** The worker's
    # `STUDIO_RUNNER_BASE_URL` is rendered from this same key, so the old 8080/8090 disagreement
    # (`application.yml` once defaulted the URL to 8090; it now has no default at all, and
    # `studio-runner/src/server/config.ts` listens on 8080) cannot be re-created here.
    port: 8090

  # Process reaping (AC-5a / AC-5b). The pause container becomes PID 1 and reaps orphaned
  # grandchildren; the runner keeps the exec-form CMD, so SIGTERM still reaches Node directly and
  # the drain still runs. Both halves are stated in the Deployment template.
  #
  # ⚠ **THIS FIELD COMES WITH A BOUND: THIS POD MUST HAVE EXACTLY ONE CONTAINER.**
  #
  # A shared PID namespace makes every container in the pod visible to every other through /proc,
  # including /proc/<pid>/root. This pod mounts the object-store Secret at
  # `objectStore.mountPath`, so **any second container would read
  # /proc/1/root/etc/studio/object-store/secretAccessKey regardless of its own volume mounts**, and
  # `readOnlyRootFilesystem` does not obstruct a read. The write-only store principal of §6.2 would
  # then be held by a log shipper or a mesh sidecar that has no business with it.
  #
  # Raised by @qa as MED-1: the bound was real but enforced *incidentally*, by a test helper that
  # throws on a second container. It is now asserted explicitly and falsified against a chart copy
  # with a sidecar injected. **Adding a container here is a security decision, not a convenience**;
  # if you need one, take the exposure to SPK-04 and ED-05 first.
  shareProcessNamespace: true

  serviceAccount:
    create: true
    name: ""
    # The runner calls no Kubernetes API. A mounted token is a credential it has no use for.
    automountServiceAccountToken: false

  # Two replay browsers per pod (pool 2). Unmeasured starting values (STUDIO-FLEX-001 item 4).
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi

  # **One key, and never `Unconfined`** (ADR-001 O-4, SPK-04 question 3).
  #
  # Deliberately NOT copied from the backend's `RuntimeDefault` by inheritance: whether
  # `RuntimeDefault` permits the namespace-creating clone/unshare calls Chromium's sandbox needs
  # without CAP_SYS_ADMIN is **SPK-04's open question**, and if it does not, the answer is a
  # Platform-approved `Localhost` profile — never a disabled sandbox. There is no fallback that
  # disables the sandbox.
  seccompProfile:
    type: RuntimeDefault

  podSecurityContext:
    runAsNonRoot: true
    # pwuser in the Playwright image (uid 1001). Stated rather than inherited so a base-image
    # change is a values change and not a silent root container.
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    # SEC-2's deployment control. With the root filesystem read-only and every writable mount
    # disjoint from the browser registry and from $HOME, there is no path on which a shim
    # `chrome-headless-shell` can be created.
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Per-run scratch. One key, two rendered values, compared to each other in the assertion.
  #
  # **The emptyDir is mounted at the PARENT, and the runner's scratch directory is a plain
  # directory inside it.** That is not cosmetic and it was found by running the built image, not
  # by reading code: `createFsScratchStore.clearAll()` does `rm(rootPath, { recursive: true })`
  # followed by `mkdir`, so if `STUDIO_RUNNER_SCRATCH_DIR` *is* the mount point, start-up tries to
  # remove a mount point whose parent is the read-only root filesystem and the runner dies with
  # `EROFS: read-only file system, rmdir '/scratch/studio-runner'` before it ever listens. A pod
  # that never starts would satisfy every "no shim can be written" assertion in this story
  # trivially — "a guard satisfied by a broken implementation" — so this is load-bearing.
  scratch:
    mountPath: /scratch
    # Rendered as `{mountPath}/studio-runner`; see `put-checks.studioRunner.scratchDir`.
    directory: studio-runner
    sizeLimit: 8Gi

  # Chromium needs a real /dev/shm; the container default of 64Mi crashes tabs under load.
  devShm:
    sizeLimit: 2Gi

  drain:
    # preStop flips readiness before the drain begins, so the endpoint is removed while admitted
    # work finishes (§5.2, §8.4).
    preStopSleepSeconds: 5
    # Headroom above the derived sum of the runner's own deadlines. Lowering this below the sum is
    # M7's mutation and must redden the grace-period assertion.
    extraGraceSeconds: 30

  probes:
    # The paths the runner serves for these two meanings, and this chart must not re-implement
    # what they mean: a saturated pod answers 503/429 and stays **ready**; a draining pod goes
    # **not ready**. Pointing readiness at /health is M-red.
    readinessPath: /ready
    livenessPath: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    # Consecutive liveness failures before the kubelet restarts the container. 3 is the Kubernetes
    # default, written down so it is a key and not an accident. A liveness restart destroys the
    # in-memory guided session, so a guided-enabled pod uses `guided.livenessFailureThreshold`
    # instead (the probe is a new Node process per exec plus a TLS handshake and three file reads,
    # on a pod where Chromium can saturate its CPU limit).
    livenessFailureThreshold: 3

  # The two identity secrets §9.2 permits, and nothing else. No database URL, no vault address,
  # no CSI endpoint, no LLM gateway key — the runner holds none of them, and only the deployment
  # can make that true.
  #
  # `serviceIdentityKey` is also what the WORKER reads its outbound bearer from
  # (`STUDIO_RUNNER_SERVICE_TOKEN`, templates/deployment.yaml): one Secret key for both ends of
  # POST /v1/runs. The worker is given that key only, never `callbackIdentityKey`.
  identity:
    secretName: checks-studio-runner-identity
    serviceIdentityKey: serviceIdentity
    callbackIdentityKey: callbackIdentity

  # Where the runner posts admission and progress. Deployment configuration, never job-supplied
  # (§8.4, §8.5). Empty means "this release's API Service" (`http://<release>-api:<port>`,
  # derived in _helpers.tpl); set it only when the runner must reach the API some other way.
  callbackBaseUrl: ""

  # ---------------------------------------------------------------------------------------------
  # The one TLS listener (STUDIO-OBS-009 AC-1/AC-3; ruling A3; launch contract section 2.3, 4).
  #
  # **Required in every deployment, guided or not.** There is no plaintext listener in any
  # configuration, so these four keys are rendered whenever the runner is. Rendered as
  # `STUDIO_RUNNER_TLS_KEY_FILE`, `_CERT_FILE`, `_CA_FILE` and
  # `STUDIO_RUNNER_CONTROLLER_CERTIFICATE_FINGERPRINT256`; all four are chart-managed, so a
  # `runnerEnv` entry for any of them fails the render.
  # ---------------------------------------------------------------------------------------------
  tls:
    # The runner's own certificate and key and the CA bundle. Provisioned by Platform/SRE; the chart
    # only names it. The certificate must carry `serverAuth` AND `clientAuth` (the exec probe
    # presents it as a client certificate) and SANs for `<fullname>-studio-runner`, `.<ns>` and
    # `.<ns>.svc`. The runner refuses an EKU extension that lacks either purpose (exit 78).
    secretName: checks-studio-runner-tls
    # A directory mount, never a `subPath`: Kubernetes does not propagate Secret updates to a
    # subPath mount, and the mode is the chart's constant `put-checks.studioRunner.secretFileMode`
    # (0440), not a knob.
    mountPath: /etc/studio/tls
    keyFile: tls.key
    certFile: tls.crt
    caFile: ca.crt
    # **One key, no default, and the render fails without it.** The SHA-256 fingerprint of the
    # backend's client certificate, in the form Node prints it: 32 upper-case hex pairs joined by
    # `:`. Any other form is refused by the runner without normalisation, and by the render here.
    # The same value pins the callback server (ruling part 1 1.5 c): the backend presents ONE
    # certificate in both roles. A renewed backend certificate with an unchanged value here means
    # every inbound call is refused, so a renewal is a Secret update, this key and a rollout in one
    # release (see `rotationRevision`).
    controllerCertificateFingerprint256: ""
    # Bump to force a rollout when only Secret contents changed. The runner reads key, certificate
    # and CA ONCE; the exec probe re-reads them on every run. Without a restart the probe would
    # present the new certificate while the process serves the old one, the pin fails, and liveness
    # restarts the container at an arbitrary moment (devops co-sign 3.5). Rendered as a pod
    # annotation, so a change here is a pod-template change.
    rotationRevision: ""

  # ---------------------------------------------------------------------------------------------
  # The BACKEND's side of the same chain (API and worker pods). A separate Secret from the runner's:
  # the runner pod holds its own private key and must never hold the backend's, and the test that
  # keeps the two principals apart (chart.test.ts AC-10a) compares the Secret names.
  #
  # PKCS12 key store with exactly one private-key entry (the backend certificate: `clientAuth`
  # toward the runner and, with guided on, `serverAuth` for the API's guided TLS connector) and a
  # trust store holding the issuer(s) of the runner certificate. Passwords are FILES on the same
  # mount (`StudioRunnerTls.Settings`), never values. Rendered into the mounted `application.yaml`
  # as `studio.runner.tls.*`.
  # ---------------------------------------------------------------------------------------------
  backendTls:
    secretName: checks-studio-backend-runner-tls
    mountPath: /etc/studio/runner-tls
    keyStoreKey: keystore.p12
    keyStorePasswordKey: keystore.password
    trustStoreKey: truststore.p12
    trustStorePasswordKey: truststore.password
    storeType: PKCS12

  # ---------------------------------------------------------------------------------------------
  # Guided authoring as a MODE of this one process (ruling A2; launch contract section 2.4).
  #
  # **Off in every shipped values file.** Enabling it is a deliberate per-environment decision, and
  # `put-checks.studioRunner.guidedGuard` fails the render unless the pod is the one-replica shape
  # A2.6 allows (more than one concurrent learning session on that one pod is `capacity` below;
  # several learning pods would need per-pod routing and are deferred). Guided mode does not exist
  # without these prerequisites:
  #   - a single replica and no autoscaler (A2.6): the worker holds sessions in memory and refuses
  #     calls it does not own, so a second pod would only produce fail-closed refusals;
  #   - `shareProcessNamespace: true` (PID-1 b): with it the pause container is PID 1 and node is
  #     not, so the launch-tree guard (`canEnumerateLaunchTree`, pid > 1) lets the start through;
  #   - an external token issuer (register U21): nothing in this repository mints the guided
  #     JWTs, which expire within 300 s. Until it exists a guided-enabled shared environment cannot
  #     work, and G-1 stays "unrun, owner Platform/SRE".
  # ---------------------------------------------------------------------------------------------
  guided:
    enabled: false
    # **One key, two consumers.** Rendered as the runner's `STUDIO_RUNNER_GUIDED_WORKER_ID` and as
    # the backend's `studio.guided-authoring.translation.worker-id`, because the backend assigns
    # every session to that one id and the runner refuses any other (IDENTITY_MISMATCH). The default
    # is the backend's own (`GuidedTranslationProperties`).
    workerId: worker-1
    # **One key, two consumers (STUDIO-FLEX-001 item 5).** How many learning sessions the one guided
    # pod runs at once, 1..8. Rendered as the runner's `STUDIO_RUNNER_GUIDED_CAPACITY` and as the
    # backend's deployment-wide cap `studio.guided-authoring.max-concurrent-sessions` (the
    # (capacity+1)th start gets 429 LEARNING_CAPACITY_EXHAUSTED; the runner's own CAPACITY refusal is
    # the backstop). Both are chart-managed: setting either elsewhere fails the render.
    # Each active learning session runs in its own Node child (E15, ADR-SC-008): about 100-150 MB
    # more per session (inferred, not measured), and after a slow recorded stop that child stays up
    # to 17 s past the slot release. Re-check the pod memory limit above capacity 3.
    capacity: 1
    # The pinned RSA public key and the issuer/subject of the external guided-token issuer.
    # **Rotation inputs for the OBS-010 runbook** (GuidedInternalSecurity: "rotate by draining
    # sessions, updating the configured key/issuer together and restarting"). Each is single-source:
    #   issuer        -> runner GUIDED_CONTROLLER_ISSUER and backend service-issuer
    #   publicKey     -> the runner's controller-public-key file (a ConfigMap this chart renders)
    #                    and the backend's service-public-key (PEM, at least 2048 bits)
    #   controllerSubject -> runner GUIDED_CONTROLLER_SUBJECT
    # The backend verifies both token roles against one key and issuer, so one external issuer signs
    # all three audience-scoped token files. No default: an empty value fails the render.
    token:
      issuer: ""
      controllerSubject: ""
      publicKey: ""
    # Empty means "this release's guided TLS Service" (`https://<fullname>-api-guided-tls:<port>`),
    # derived in _helpers.tpl and NOT from the replay `callbackBaseUrl` (A2.2: independent keys).
    # Must be https. Rendered as `STUDIO_RUNNER_GUIDED_CALLBACK_BASE_URL` and as the coordinator's
    # `studio.guided-authoring.translation.controller-origin`.
    callbackBaseUrl: ""
    # The runner's callback bearer: a Secret directory mount the external issuer refreshes (the file
    # is re-read on every callback; a static Secret would expire within 300 s). No subPath.
    callbackToken:
      secretName: checks-studio-guided-callback-token
      key: token
      mountPath: /etc/studio/guided-token
    # Where the public key ConfigMap is mounted on the runner (read once at start-up).
    controllerPublicKey:
      mountPath: /etc/studio/guided
      file: controller-public-key.pem
    # The two backend-to-runner bearer files (aud studio-guided-runner and studio-guided-controller),
    # mounted on the API and worker pods. Same external issuer as the runner's callback token.
    backendTokens:
      secretName: checks-studio-guided-controller-tokens
      runnerTokenKey: runner-controller-token
      translationTokenKey: translation-controller-token
      mountPath: /etc/studio/guided-controller-tokens
    # The API pod's guided TLS connector (clientAuth=need). The runner calls back here; the general
    # API Service and its HTTP port are untouched. Both ports are the connector's, and a separate
    # Service exposes only it.
    tlsConnector:
      port: 8443
      servicePort: 8443
    # The journal lives on an emptyDir (pod lifetime), NOT a PVC (ruling part 1 1.5 b): the backend
    # fence and lease are the sole cross-pod authority, so the `.owner` marker is in-process and
    # restart-scope defence. After a pod replacement the journal is gone; disclosed for OBS-010.
    # The path is a SUBDIRECTORY of the mount (a mount root cannot be created or renamed under a
    # read-only root filesystem) and is disjoint from the scratch directory, which is cleared at
    # start and at drain (loader rule, Q3).
    journal:
      mountPath: /var/lib/studio-guided
      directory: journal
      # Basis: one journal file plus a permanent `.owner` marker per session, both small and
      # data-free [I, journal.ts]. A starting value, not a measurement.
      sizeLimit: 256Mi
    # `/tmp` for the guided browser's profile and the recording scratch (`os.tmpdir()`; the chart
    # sets NO `TMPDIR`, ruling Q4). A disk-backed emptyDir: memory-backed would count against the
    # container memory limit next to Chromium and /dev/shm.
    # Basis: the recorder has no byte bound of its own (its bounds are attempts and windows). The
    # nominal video bound is `maxSessionSeconds` (600 s default, GuidedSessionProperties) times
    # Playwright's `-b:v 1M` (about 75 MB); the Chromium profile and disk cache are unmeasured.
    # 3Gi is a starting value, not a measurement (GA plan G-4).
    tmp:
      sizeLimit: 3Gi
    # Liveness tolerance for a guided-enabled pod. UNMEASURED [I]: the probe's cost on a pod with a
    # busy browser has not been measured in a cluster (owner @devops/@qa, G-4). Larger than the
    # default 3 because a liveness restart ends the live session.
    livenessFailureThreshold: 6
    # Pod resources for a guided-enabled pod: the replay pool PLUS `capacity` guided browsers
    # (A2.6 a, STUDIO-FLEX-001 item 5). They replace `studioRunner.resources` and
    # `studioRunner.devShm` when guided is on. Unmeasured starting values, sized for pool 2 and
    # capacity 3 (GA plan G-4).
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "6"
        memory: 10Gi
    devShm:
      sizeLimit: 4Gi

  objectStore:
    # **ED-03 / SPK-03.** A *different* Kubernetes Secret from the one the API and worker read
    # with: the runner principal is write-only under the `studio/` prefix and holds no Get or List
    # permission (§6.2). The two names are asserted unequal in the rendered manifest.
    #
    # Mounted files are consumed by the S3 writer and re-read when credentials rotate.
    # Add sessionToken to keys when using temporary credentials. Provision the write-only
    # principal later; the read-only API/worker principal is configured below.
    credentialsSecret: checks-studio-runner-object-store
    mountPath: /etc/studio/object-store
    # Write-only. A Get or List credential key appearing here is a scope violation, not a
    # convenience.
    keys:
      - accessKeyId
      - secretAccessKey
    # The `studio/{csiId}/{testId}/{executionId}/` prefix of §6.2, fixed deployment-wide and never
    # rendered per run or per job.
    keyPrefix: studio/

  networkPolicy:
    enabled: true
    # Default-deny egress plus exactly the three destination classes the runner declares in its
    # own PERMITTED_DESTINATIONS: callback-api, object-store, target-page. A fourth class here
    # without a fourth there is a divergence the assertion catches.
    #
    # `target-page` is OPEN (STUDIO-FLEX-001): any address and port. The user decided that firewalls
    # own reachability, and the runner no longer filters addresses itself; the only navigation
    # control is the domain whitelist (`studioNavigation.allowedDomains`). Accepted risk: the browser
    # can reach internal endpoints, including cloud metadata.
    dnsPort: 53
    objectStorePort: 443

  # ---------------------------------------------------------------------------
  # The enumerated environment. Every key here must be one of the runner's own ACCEPTED_KEYS;
  # anything else **fails the render** (see `put-checks.studioRunner.env`).
  #
  # Starting values under §8.5, tuned against staging measurements — not commitments.
  # ---------------------------------------------------------------------------
  runnerEnv:
    # Two browsers per pod (STUDIO-FLEX-001 item 4).
    STUDIO_RUNNER_POOL_SIZE: "2"
    # **One fact, three consumers:** the runner's run deadline, the termination grace period (derived,
    # `put-checks.studioRunner.derivedGraceSeconds`) and the backend's `studio.execution.total-runtime`
    # (rendered from this key into the mounted application.yaml). Raising it moves all three.
    STUDIO_RUNNER_MAX_TOTAL_RUNTIME_MS: "300000"
    # = the authoring maximum (timeoutSeconds ≤ 120); the runner refuses a lower value at startup (aria-g-ruling01)
    STUDIO_RUNNER_MAX_STEP_TIMEOUT_MS: "120000"
    # The ordered stop's grace: context close + webm finalization before the tree is killed. Raised
    # from the runner's 5 s fallback by Studio v1 WP11 (decision D3), on measurement (developer
    # laptop, 1280x720): closing a context whose navigation is still hung grows with how long it
    # has hung — ~1.2 s at 30 s, ~2.3 s at 60 s, 4.1-4.6 s at 115 s — and one 115 s sample overran
    # 5 s when the step's own timeout fired during the close. A navigation may hang for the whole
    # runtime cap, so 5 s is not enough. 15 s is about three times the laptop worst case, for a pod
    # limited to 2 CPUs; staging should confirm it (ADR-002 §29.3). A locator wait closes in <0.1 s.
    # terminationGracePeriodSeconds is derived from this value and follows it.
    STUDIO_RUNNER_BROWSER_STOP_TIMEOUT_MS: "15000"
    STUDIO_RUNNER_TERMINAL_DELIVERY_WINDOW_MS: "30000"
    STUDIO_RUNNER_OBJECT_STORE_WINDOW_MS: "15000"
    STUDIO_RUNNER_DRAIN_TIMEOUT_MS: "360000"
    STUDIO_RUNNER_RECORDING_WIDTH: "1280"
    STUDIO_RUNNER_RECORDING_HEIGHT: "720"
    # Uncalibrated (ADR-002 §26.3). NOT a measurement: a non-zero value comes only from SPK-06
    # phase B, measured per image and recorded in docs/qa/spikes/SPK-06/, under §26.3 item 4 and
    # ESC-3. Never a laptop value. No values-*.yaml overrides it.
    STUDIO_RUNNER_SEEK_ORIGIN_CALIBRATION_MS: "0"

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Observed replay (STUDIO-OBS-009 residue; architect ruling OI-06, B5).
#
# **One source of truth for both images.** The runner (`STUDIO_RUNNER_OBSERVED_*`) and the backend
# (`studio.observed-replay.catalog-json`) must hold the SAME catalog entry, so this one block feeds
# both; none of them is settable through `studioRunner.runnerEnv` or the backend's `configOverrides`
# / `env` while this is on (the render fails). Under the single
# path every Studio run is an observed run, so a runner with both flags off answers 503 to every run
# (routes.ts `OBSERVED_VALIDATION_DISABLED`, runCoordinator.ts `OBSERVED_REPLAY_DISABLED`) and a
# backend with an empty catalog answers 409 RUNTIME_INCOMPATIBLE to every publication.
#
# OFF by default in every values file; `values-uat.yaml` turns both on. While EITHER flag is on:
#   - `studioRunner.enabled` must be true and `catalog` must be supplied (the render fails naming the
#     key otherwise);
#   - the runner image is pinned by digest, `<repository>@sha256:<catalog.build.executableImageDigest>`,
#     and `studioRunner.image.tag` is ignored. The runner checks that digest against the catalog, so
#     pinning is what binds the catalog to the image that is actually pulled;
#   - the runner gets `catalog.json` from a ConfigMap this chart renders.
#
# **A runner image change ALWAYS comes with a new catalog values file**: the entry is specific to
# one image.
#
# Which domains a test may navigate to is not configured here: it is `studioNavigation.allowedDomains`
# below. The catalog is integrity-relevant, not secret: treat it as reviewed configuration under the
# same change control as `values-uat.yaml`, never as runtime input.
# ---------------------------------------------------------------------------
studioObserved:
  # Runner STUDIO_RUNNER_OBSERVED_VALIDATION_ENABLED (serves /v2/validate-observed) and
  # STUDIO_RUNNER_OBSERVED_REPLAY_ENABLED (serves /v2/runs). Real booleans: --set-string is refused.
  validationEnabled: false
  replayEnabled: false
  # The runner image's OWN {profile, build} catalog entry, produced by CI from the pushed image
  # (`build.executableImageDigest` is the 64-hex manifest digest, no "sha256:" prefix; the four
  # hashes are 64 lower-case hex and must be QUOTED strings). No default: this repository cannot
  # know it. Supply it per release with `-f observed-catalog.<digest>.yaml`.
  catalog: {}
  # Older builds the BACKEND may still accept (retained artifacts), same entry shape as `catalog`.
  # The runner never sees these. The backend's catalog is `[catalog] + additionalBackendCatalog`, the
  # runner's entry first, because the backend selects the first element.
  additionalBackendCatalog: []
  # Where the runner mounts the ConfigMap (catalog.json), read-only.
  mountPath: /etc/studio-observed

# ---------------------------------------------------------------------------
# Studio navigation: the domain whitelist (STUDIO-FLEX-001 item 1).
#
# **The only navigation control**, per-environment deployment configuration. Ships EMPTY, and an empty
# list denies every navigation, so no environment can reach a page until this is filled in (the
# bank's approved list, supplied at deploy time, e.g. `-f studio-navigation.<env>.yaml`).
#
# One source for both images: rendered to the backend's `studio.navigation.allowed-domains` (API and
# worker) and to the runner's `STUDIO_RUNNER_ALLOWED_DOMAINS`. Neither is settable anywhere else
# (`configOverrides`, `env`, `runnerEnv`): the render fails, so the two cannot diverge.
#
# Entries are lower-case ASCII (punycode for IDN) domain names, matched on label boundaries: a host
# matches an entry when it equals it or ends with `.<entry>`, so `citi.com` covers `www.citi.com`
# and not `evilciti.com`. Refused at render time, as the backend and the runner refuse them at
# start-up: wildcards, IP literals, schemes, ports, paths, trailing dots, upper case, more than 32
# entries, and overlapping entries (no entry may equal or be a subdomain of another).
#
# `allowAllDomains` (default `true` for now, user decision 2026-10-25; set `false` to enforce the list): when `true`, navigation may
# reach ANY http(s) URL whose host is a DNS name (still no userinfo, no IP literal, no other scheme),
# and `allowedDomains` is ignored (it is still validated, so a typo is not hidden). It is per
# environment like the list, and one value feeds both images: the backend's
# `studio.navigation.allow-all-domains` and the runner's `STUDIO_RUNNER_ALLOW_ALL_DOMAINS`, so the
# backend can never admit a navigation the runner refuses. Must be a YAML boolean (`true` or `false`;
# `--set-string` or a quoted value fails the render). Both images log one WARN line at start-up
# when it is on. The runner's NetworkPolicy does not depend on it (its page egress is already open).
# ---------------------------------------------------------------------------
studioNavigation:
  allowedDomains: []
  allowAllDomains: true

# ---------------------------------------------------------------------------
# The object-store principal the API and the recovery path read with — **read-only**, and a
# different Secret from the runner's write-only one (§6.2, ED-03).
# ---------------------------------------------------------------------------
objectStore:
  # `local` matches the runnable application default. Set `s3` when Sonic is connected; the S3
  # adapter and credentials are already fully wired. Cluster deployments should use S3 because
  # pod-local filesystems are not shared across runner/API replicas.
  provider: local
  endpoint: ""
  region: us-east-1
  bucket: put-checks-studio-evidence
  pathStyleAccess: true
  # In local mode every API, worker and runner pod mounts this one RWX claim at this path. Local
  # development uses studio-runner/scripts/dev.mjs instead and shares its local directory directly.
  localDirectory: /var/lib/studio-objects
  local:
    createClaim: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteMany
    size: 10Gi
  connectTimeout: 2s
  requestTimeout: 10s
  credentialsSecret: checks-api-object-store
  mountPath: /etc/studio/object-store
  keys:
    - accessKeyId
    - secretAccessKey
  # Logical expiry the API enforces at `videoExpiresAt` **and** the store's lifecycle window, from
  # one key. Physical deletion on the store is asynchronous and this chart claims no exact-time
  # deletion anywhere (§6.2).
  retention: 30d

# Real Vault KV v2 is implemented but explicitly off until the platform endpoint is connected.
# `pathTemplate` must contain {csiId}, {environment}, {testId}, {kind} and end with
# /{referenceName}: the api and worker refuse to start with `hashicorp` otherwise.
studioVault:
  provider: none
  address: ""
  namespace: ""
  mount: secret
  pathTemplate: "studio/{csiId}/{environment}/{testId}/{kind}/{referenceName}"
  valueKey: value
  tokenSecret: checks-studio-vault-token
  tokenKey: token
  tokenMountPath: /etc/studio/vault
  connectTimeout: 2s
  requestTimeout: 5s
  maxResponseBytes: 65536

# Plain-English compile provider. `vertex` uses the approved Vertex AI path; `disabled` reports
# compilation as unavailable and never returns a synthetic artifact.
# A Gemini developer API token is not consumed: use workload ADC or a mounted service-account JSON.
studioGateway:
  environment: production
  provider: vertex
  endpoint: ""
  project: ""
  location: ""
  model: gemini-3.8-flash
  # Staging and production deliberately obtain environment-owned, non-secret Vertex routing
  # values from a pre-provisioned ConfigMap. This keeps unknown project/location/endpoint values
  # out of source control while making a missing platform dependency fail the Helm render.
  vertexConfigMap:
    name: checks-studio-vertex
    endpointKey: endpoint
    projectKey: project
    locationKey: location
  credentialsMode: application-default
  credentialsSecret: ""
  credentialsKey: service-account.json
  credentialsMountPath: /etc/studio/gateway

# ---------------------------------------------------------------------------
# Studio SSE — the streaming route at the EDGE (story 10.18b, AC-13a)
# ---------------------------------------------------------------------------
#
# **Why this is a separate Ingress object and not two annotations on the API one.**
# `templates/ingress.yaml` renders the API as a single `path: / pathType: Prefix` rule. nginx
# annotations are per-Ingress, so a `proxy-buffering: "off"` written there would unbuffer **every
# REST call in the product** — every list, every create, every health probe — to fix two streaming
# routes. The streaming paths therefore carry their own Ingress object, and a test renders the
# chart with `studioSse.ingress.enabled` false and true and asserts the API Ingress document is
# **byte-identical** between the two. Ordinary REST is served exactly as it was.
#
# **One derivation, not two.** The epic's most-repeated defect is one fact written down twice —
# `application.yml` says 8090 and the runner's `config.ts` says 8080, and neither had ever been
# deployed. A `proxy-read-timeout` annotation sitting beside a `STUDIO_SSE_HEARTBEAT` env var with
# nothing joining them is the same defect in the one place where its failure is invisible until a
# stream dies in staging. So:
#
#   - `heartbeatSeconds` and `lifetimeSeconds` render into the API container's
#     `STUDIO_SSE_HEARTBEAT` / `STUDIO_SSE_LIFETIME`, which are the only values
#     `SnapshotBroadcaster` reads;
#   - the ingress idle timeout is **computed** as `lifetimeSeconds + idleTimeoutMarginSeconds`,
#     so it cannot be left behind when the lifetime moves;
#   - a test compares the rendered annotation against the rendered env values **in the same
#     manifest** — never against a constant written in the test, which would be a third copy.
#
# Raising `heartbeatSeconds` above the computed timeout is M11's mutation and must redden that
# comparison. The timeout is deliberately **not** derived from the heartbeat: a derivation that
# moved with it could never be observed to fail.
#
# §8.5 starting values, not commitments. `heartbeatSeconds` and `lifetimeSeconds` are tuned against
# the staging measurement SPK-02 question 4 makes — **and that measurement has not been taken**.
# The *effective* maximum stream lifetime through the real ingress and any platform proxy in front
# of it is unknown (ED-06). If it turns out to be below `lifetimeSeconds`, the configured value
# moves to match the measurement; that is the mechanism working.
studioSse:
  # Heartbeat cadence, seconds. Rendered as `{n}s` into STUDIO_SSE_HEARTBEAT.
  heartbeatSeconds: 15
  # Bounded stream lifetime, seconds. Rendered as `{n}s` into STUDIO_SSE_LIFETIME. The browser
  # reconnects with Last-Event-ID and the snapshot contract restores current state.
  lifetimeSeconds: 60
  # Headroom between the bounded lifetime and the upstream idle timeout. The timeout must be
  # comfortably longer than the lifetime so the *application* closes the stream, not the proxy:
  # a proxy-closed stream is indistinguishable at the browser from a network fault.
  idleTimeoutMarginSeconds: 60

  ingress:
    # Off makes this chart render exactly what it rendered before story 10.18b. That is not a
    # convenience switch — it is the control half of AC-13a's "ordinary REST is unchanged"
    # comparison, which renders both ways and diffs the API Ingress.
    enabled: true
    # The className, host and TLS come from `backend.ingress`: the streaming paths are the same
    # API on the same host, and a second copy of the host is a second thing to get wrong.
    #
    # ⚠ **UNVERIFIED THROUGH A REAL INGRESS — ED-06 / SPK-02 questions 3 and 4.** Two Ingress
    # objects for one host are merged by the nginx controller into a single server block;
    # `proxy-buffering` and the proxy timeouts are location-scoped and should apply only to the
    # paths below, but *this repository cannot establish that*, and no snippet annotation is used
    # here because clusters commonly run with `allow-snippet-annotations: false`. Whether
    # buffering is actually off on the wire is SPK-02's to measure.
    #
    # The buffering and timeout annotations are **not** values keys: they are rendered by
    # `templates/studio-sse-ingress.yaml` from the two duration keys above, so that the bound
    # between the timeout and the heartbeat has one owner. `extraAnnotations` is for the unrelated
    # things a cluster may need (auth, tracing); a key that collides with one of the managed
    # annotations fails the render rather than silently winning or losing.
    extraAnnotations: {}

# ---------------------------------------------------------------------------
# Studio audit stream -> the platform SIEM sink (STUDIO-OBS-009 AC-5; STUDIO-OBS-014 AC-10)
# ---------------------------------------------------------------------------
#
# The backend writes one JSON line per admitted guided action and per replay dispatch to the logger
# `com.citi.put.checks.audit.studio` on stdout, with `"stream":"studio-audit"` (logback-spring.xml
# AUDIT_JSON). Events carry IDs and closed codes only. The stream name and the logger are CONSTANTS
# of the application, not keys here: a values knob that renamed them would route nothing. The chart
# compares its rendered selector against logback-spring.xml (`backend-env.test.ts`, AC-5).
#
# What the chart can do is mark the API and worker pods so the platform's log forwarder selects the
# stream, and publish the selector and sink in a ConfigMap. It cannot provision the sink: that is
# Platform/SRE's, and it is recorded "unrun, owner Platform/SRE" until the sink exists. Retention in
# the SIEM is the sink's.
studioAuditSiem:
  # Off until Platform provides a sink. When on, `sink.name` is required (the render fails without
  # it), so a deployment cannot claim routing it did not name.
  enabled: false
  sink:
    # The platform's name for the sink (index, topic or pipeline). Opaque to the chart.
    name: ""
  # Pod annotations the platform's log forwarder reads to select and route the stream (for example
  # a parser, index or source-type annotation). Platform-specific, so there is no default; they are
  # rendered onto the API and worker pods only while `enabled` is true.
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Studio execution — the kill switch and the dispatcher (story 10.18b, AC-23a)
# ---------------------------------------------------------------------------
#
# **Two distinct keys, because they are two distinct decisions.** The kill switch answers "may new
# executions be accepted at all"; the dispatcher flag answers "does this component take queued work
# off the ledger". Rendering both from one key would mean an operator engaging the kill switch also
# silently stopped the closure pass that the kill switch exists to trigger — BRD §9 requires that
# queued undispatched work be **closed explicitly** when the switch goes off, and the dispatcher is
# what closes it.
#
# **The dispatcher is rendered on the worker and nowhere else**, and it is rendered EXPLICITLY on
# every component rather than left to a default, because the two defaults disagree:
# `application.yml` renders `${STUDIO_DISPATCHER_ENABLED:false}` while
# `StudioExecutionProperties.Dispatcher.enabledOrDefault()` returns **true** for an absent value.
# That divergence is a real finding (recorded in `StudioKillSwitchWiringTest`, owner @architect);
# a deployment that states the value cannot be caught by it either way.
studioExecution:
  # The kill switch (§8.5, BRD §9). TRUE is the running state: a kill switch that defaulted to
  # "off" would make a configuration mistake indistinguishable from an engaged kill switch, which
  # is the one failure an operator must be able to tell apart from an outage.
  enabled: true
  # Whether the WORKER dispatches queued executions. The API never does, in any configuration —
  # that is a property of the api profile, not a values choice, so the API's `false` is written in
  # the Deployment template rather than here.
  #
  # ⚠ A deployment with this false queues work and dispatches nothing, **which looks exactly like
  # an egress problem**. The runbook's stuck-runs section (§5) names it first for that reason.
  dispatcherEnabled: true
