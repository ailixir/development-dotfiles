backend:
  replicaCount: 3
  springProfile: api,prod

  ingress:
    host: checks-api.citi.com
    annotations:
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    tls:
      - secretName: checks-api-prod-tls
        hosts:
          - checks-api.citi.com

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    JAVA_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
    CHECKS_CORS_ALLOWED_ORIGINS: "https://checks.citi.com"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.prod.svc.cluster.local:8081"


  # ── ED-02: all three identity bypasses CLOSED in the PRODUCTION profile (AC-19a, AC-20) ─────────
  #
  # Restated here rather than inherited from `values.yaml`, so that the profile a pilot is run
  # against SAYS what it does instead of relying on a default somebody may change.
  #
  # ⚠ **THE CODE PATHS STILL EXIST. These flags close them; nothing removes them.** All three live
  # in `BffSessionAuthenticationFilter` and all three produce an identity the platform never
  # vouched for. The `X-User-Id` header path is checked FIRST, so closing `coreService` alone
  # closes nothing for a client that can reach the pod and send a header — architecture §9.1
  # requires a trusted gateway to strip those headers and this repository contains no such
  # gateway.
  #
  # ⚠ **THE VAULT IS STILL A STUB**: `SecretsService` returns `REDACTED`, and secret-use
  # authorization runs against a fake provider.
  #
  # ⚠ **NO CREDENTIALED PILOT MAY RUN UNTIL ED-02 HAS LINKED COMPLETED TICKETS.** ED-02's owner
  # reads "TBD — not assigned in sources". @po could not name one and said so; the escalation path
  # is @pm → Checks-squad engineering management (BRD §8 launch-exit row), with Security &
  # Compliance (BRD §11) accepting. Story 10.19 may not be drafted while that owner reads TBD.
  #
  # See `docs/runbooks/studio-runner.md` §9 for what an operator may and may not do with these.
  identityBypass:
    coreService: false
    identityHeaders: false
    csiRead: false
  envFromSecrets:
    - secretName: checks-db-credentials-prod
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD

  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "20"
    checks.scheduling.min-interval-seconds: "60"

worker:
  replicaCount: 2
  springProfile: worker,prod

  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 2Gi

  env:
    JAVA_OPTS: "-Xms768m -Xmx1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
    CHECKS_CORE_SERVICE_URL: "http://checks-core.prod.svc.cluster.local:8081"

  envFromSecrets:
    - secretName: checks-db-credentials-prod
      keys:
        - SPRING_DATASOURCE_URL
        - SPRING_DATASOURCE_USERNAME
        - SPRING_DATASOURCE_PASSWORD

  configOverrides:
    spring.datasource.hikari.maximum-pool-size: "30"
    checks.executor.max-concurrency: "250"
    checks.executor.source-limits.HTTP: "150"
    checks.executor.source-limits.TCP: "150"
    checks.executor.source-limits.SPLUNK: "75"
    checks.executor.source-limits.GRAFANA: "75"
    checks.executor.source-limits.ITRS: "75"
    checks.executor.source-limits.APPDYNAMICS: "75"
    checks.executor.source-limits.UI_TEST: "25"
    checks.scheduling.batch-size: "500"
    checks.scheduling.poll-interval-ms: "10000"
    checks.scheduling.shutdown-timeout-sec: "30"
    checks.scheduling.min-interval-seconds: "60"

frontend:
  replicaCount: 3

  ingress:
    host: checks.citi.com
    tls:
      - secretName: checks-frontend-prod-tls
        hosts:
          - checks.citi.com

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  env:
    REACT_APP_API_BASE_URL: "https://checks-api.citi.com/api/v1"
    VITE_API_URL: "https://checks-api.citi.com"
    VITE_API_BASE_URL: "/api/v1"
    VITE_ENABLE_STUDIO: "true"
    VITE_ENABLE_REPORTS: "true"
    VITE_DEBUG_MODE: "false"

# ---------------------------------------------------------------------------
# Studio runner (story 10.18a).
#
# **Off in production.** BRD §8 requires one runner pod proven in staging before production is
# templated at all, and every gate that proof depends on — ED-03, ED-04, ED-05, ED-06 — is open.
# The values are written so the production shape is reviewable now; turning it on is 10.19's
# pilot decision, not this story's.
# ---------------------------------------------------------------------------
studioRunner:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  devShm:
    sizeLimit: 2Gi
  scratch:
    sizeLimit: 8Gi
  seccompProfile:
    type: RuntimeDefault
  callbackBaseUrl: ""
  identity:
    secretName: checks-studio-runner-identity-prod
  objectStore:
    credentialsSecret: checks-studio-runner-object-store-prod
objectStore:
  credentialsSecret: checks-api-object-store-prod
