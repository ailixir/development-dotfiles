{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.frontend.fullname" . }}-config
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.frontend.selectorLabels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.frontend.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
