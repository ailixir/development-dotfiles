{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "put-checks.backend.fullname" . }}-config
  labels:
    {{- include "put-checks.labels" . | nindent 4 }}
    {{- include "put-checks.backend.selectorLabels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.backend.service.port | quote }}
  {{- range $key, $val := .Values.backend.configOverrides }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
