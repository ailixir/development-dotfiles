spring:
  config:
    activate:
      on-profile: staging

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: when-authorized

studio:
  gateway:
    provider: ${STUDIO_GATEWAY_PROVIDER:disabled}
    model: ${STUDIO_GATEWAY_MODEL:gemini-3.8-flash}
    credentials:
      mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}
  # (see application-prod.yml: the guided chain is mandatory wherever a guided hop is wired)
  guided-authoring:
    mtls-required: true
