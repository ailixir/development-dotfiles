spring:
  config:
    activate:
      on-profile: staging

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: when-authorized

studio:
  compile:
    gateway:
      provider: ${STUDIO_GATEWAY_PROVIDER:disabled}
      model: ${STUDIO_GATEWAY_MODEL:gemini-3.8-flash}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}
