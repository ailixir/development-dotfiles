spring:
  config:
    activate:
      on-profile: worker

server:
  port: 8081

checks:
  scheduling:
    dispatcher-enabled: true
    partition-scheduler-enabled: true
    retention-pruner-enabled: true
  reports:
    delivery-enabled: true
  worker-mode: true

# The dispatcher and the reapers run here and nowhere else (§5.4, AC-12). An API pod has no
# scheduler bean at all, so a queued row it can see is a queued row it never claims.
studio:
  execution:
    dispatcher:
      enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
