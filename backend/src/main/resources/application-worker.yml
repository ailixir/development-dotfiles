spring:
  config:
    activate:
      on-profile: worker

server:
  port: 8081

checks:
  scheduling:
    dispatcher-enabled: true
    partition-scheduler-enabled: true
    retention-pruner-enabled: true
  reports:
    delivery-enabled: true
  worker-mode: true

# The dispatcher and the reapers run here and nowhere else (§5.4, AC-12). An API pod has no
# scheduler bean at all, so a queued row it can see is a queued row it never claims.
studio:
  execution:
    dispatcher:
      enabled: true

# /actuator/prometheus is exposed here and only here: the worker has no Ingress, and it is where the
# Studio runner scaling signal (studio_dispatch_backlog, studio_dispatch_refusals_total) lives.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

# The worker role (STUDIO-OBS-009 AC-5) runs the guided expiry reaper and the translation
# coordinator (`@Profile("!api | worker")`). It has no internal guided chain and no TLS connector
# (those are `!worker`); it reaches the API's connector as a client with the backend's one
# certificate (studio.runner.tls, translation.controller-origin).
