spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checks}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed

checks:
  scheduling:
    dispatcher-enabled: true

logging:
  level:
    com.citi.put.checks: DEBUG
    org.flywaydb: INFO

# Studio secret resolution (§9.2, story 10.17 AC-9).
#
# Off by default. Connecting a Vault takes environment variables only (STUDIO_VAULT_PROVIDER,
# STUDIO_VAULT_ADDRESS, STUDIO_VAULT_TOKEN_FILE; see application.yml). The fake provider is
# selected by the test profile only.
studio:
  secrets:
    vault:
      provider: ${STUDIO_VAULT_PROVIDER:none}
  # STUDIO-OBS-009 AC-2: the guided chain is mandatory wherever a guided hop is wired.
  guided-authoring:
    mtls-required: true
