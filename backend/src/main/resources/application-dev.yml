spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checks}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed

checks:
  scheduling:
    dispatcher-enabled: true

logging:
  level:
    com.citi.put.checks: DEBUG
    org.flywaydb: INFO

# Studio secret resolution (§9.2, story 10.17 AC-9).
#
# Vault-backed secrets are unavailable in the production alpha. The fake provider is selected by
# the test profile only.
studio:
  secrets:
    vault:
      provider: none
