spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checks}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed

checks:
  scheduling:
    dispatcher-enabled: true

logging:
  level:
    com.citi.put.checks: DEBUG
    org.flywaydb: INFO
