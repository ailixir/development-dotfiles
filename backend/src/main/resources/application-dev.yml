spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checks}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed

checks:
  scheduling:
    dispatcher-enabled: true

logging:
  level:
    com.citi.put.checks: DEBUG
    org.flywaydb: INFO

# Studio secret resolution (§9.2, story 10.17 AC-9).
#
# `provider` has NO default anywhere — not here, not in application.yml, not in code. A deployed
# profile that does not name a provider refuses to start rather than falling back to anything, and
# `fake` is confined to the test/local/dev profiles. A silent fallback to a fake vault is the worst
# failure mode this path can have, and it is cheaper to make impossible than to detect.
studio:
  secrets:
    vault:
      provider: fake
