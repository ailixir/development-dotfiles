spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

checks:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:5173
  sources:
    UI_TEST: true
  scheduling:
    dispatcher-enabled: true
  reports:
    delivery-enabled: true
    mail:
      from: onboarding@resend.dev
  metrics:
    concurrent-refresh: false

management:
  endpoint:
    health:
      show-details: always

studio:
  compile:
    gateway:
      enabled: ${STUDIO_GATEWAY_ENABLED:false}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:api-key}
  pool:
    size: 1
