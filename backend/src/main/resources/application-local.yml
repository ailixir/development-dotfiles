spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Zonky's AutoConfigureEmbeddedDatabase bean-post-processor supplies the DataSource
    # in @SpringBootTest contexts. For bootRun locally, the embedded-postgres-spring-test
    # starter auto-registers an EmbeddedPostgres bean wired to spring.datasource.*
    # Override if another DB is wanted for experiments.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:${LOCAL_PG_PORT:5432}/checks}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: always
