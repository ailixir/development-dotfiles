spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

checks:
  scheduling:
    dispatcher-enabled: true
  reports:
    delivery-enabled: true
    mail:
      from: onboarding@resend.dev
  metrics:
    concurrent-refresh: false

management:
  endpoint:
    health:
      show-details: always

studio:
  # Studio secret resolution (§9.2, story 10.17 AC-9).
  #
  # `provider` has NO default anywhere — not here, not in application.yml, not in code. A
  # deployed profile that does not name a provider refuses to start rather than falling back
  # to anything, and `fake` is confined to the test/local/dev profiles. A silent fallback to a
  # fake vault is the worst failure mode this path can have.
  secrets:
    vault:
      provider: fake
  compile:
    gateway:
      # Local runs never hold R2D2 credentials; keep the gateway off unless a stub is wired in.
      enabled: ${STUDIO_GATEWAY_ENABLED:false}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:none}

logging:
  level:
    com.google.cloud.vertexai: ${STUDIO_GATEWAY_SDK_LOG_LEVEL:INFO}

