spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

checks:
  # ── ED-02 in the LOCAL profile — one of the three opened (story 10.18b, AC-19a) ───────────────
  #
  # `core-service` and `csi-read` stay at their new default of **false**. `identity-headers` is
  # true here because the local profile's identity mechanism IS a header: `LocalDevAuthFilter`
  # injects a fixed developer identity, and the integration tests that run under this profile turn
  # that filter off (`checks.local-dev-auth.enabled=false`) precisely so they can inject their own
  # caller with `X-User-Id` / `X-User-Roles` and assert authorization ordering. With this closed,
  # every one of those tests authenticates as nobody and the route under test answers 401 before it
  # is reached.
  #
  # **`local` is a developer profile and is never deployed.** The chart renders `api,dev`,
  # `api,staging` and `api,prod`, and the rendered manifest closes all three flags in every one of
  # the four value sets — asserted in `studio-runner/test/deployment/edge.test.ts`.
  security:
    bypass:
      identity-headers: true
  scheduling:
    dispatcher-enabled: true
  reports:
    delivery-enabled: true
    mail:
      from: onboarding@resend.dev
  metrics:
    concurrent-refresh: false

management:
  endpoint:
    health:
      show-details: always

studio:
  storage:
    provider: ${STUDIO_STORAGE_PROVIDER:filesystem}
  # Studio secret resolution (§9.2, story 10.17 AC-9).
  #
  # `provider` has NO default anywhere — not here, not in application.yml, not in code. A
  # deployed profile that does not name a provider refuses to start rather than falling back
  # to anything, and `fake` is confined to the test/local/dev profiles. A silent fallback to a
  # fake vault is the worst failure mode this path can have.
  secrets:
    vault:
      provider: fake
  compile:
    gateway:
      # Local runs never hold R2D2 credentials; keep the gateway off unless a stub is wired in.
      enabled: ${STUDIO_GATEWAY_ENABLED:false}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:none}

logging:
  level:
    com.google.cloud.vertexai: ${STUDIO_GATEWAY_SDK_LOG_LEVEL:INFO}

