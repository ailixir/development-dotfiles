spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

checks:
  # ── ED-02 in the LOCAL profile — one of the three opened (story 10.18b, AC-19a) ───────────────
  #
  # `core-service` and `csi-read` stay at their new default of **false**. `identity-headers` is
  # true here because the local profile's identity mechanism IS a header: `LocalDevAuthFilter`
  # injects a fixed developer identity, and the integration tests that run under this profile turn
  # that filter off (`checks.local-dev-auth.enabled=false`) precisely so they can inject their own
  # caller with `X-User-Id` / `X-User-Roles` and assert authorization ordering. With this closed,
  # every one of those tests authenticates as nobody and the route under test answers 401 before it
  # is reached.
  #
  # **`local` is a developer profile and is never deployed.** The chart renders `api,dev`,
  # `api,staging` and `api,prod`, and the rendered manifest closes all three flags in every one of
  # the four value sets — asserted in `studio-runner/test/deployment/edge.test.ts`.
  security:
    bypass:
      identity-headers: true
  scheduling:
    dispatcher-enabled: true
  reports:
    delivery-enabled: true
    mail:
      from: onboarding@resend.dev
  metrics:
    concurrent-refresh: false

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # `spring.mail.host` above defaults to a public SMTP host. Spring's MailHealthIndicator opens a
      # real SMTP connection on every /actuator/health call, and JavaMail sets no connect timeout, so
      # on a machine with no route to that host the health endpoint hangs instead of answering
      # (WorkerProfileIT, BffFilterHappyPathIT and GatewayHeadersTrustIT time out). Mail delivery is
      # not what `local` health is for; the deployed profiles keep the indicator.
      enabled: false

studio:
  # Local navigation allow-list (STUDIO-FLEX-001): the local fixtures, the guided example site and
  # the practice login site. `localhost` replaces IP-literal targets, which no entry can name. The
  # same list is in studio-runner/scripts/local-stack.mjs for the local runner.
  navigation:
    allowed-domains: ${STUDIO_ALLOWED_DOMAINS:localhost,example.com,practicetestautomation.com}
    # Allow-all is on by default for now: local Studio navigates to every domain and the list above is
    # ignored. To enforce the list, export STUDIO_ALLOW_ALL_DOMAINS=false before backend/dev.sh: this backend reads
    # it through application.yml (studio.navigation.allow-all-domains) and studio-runner/scripts/local-stack.mjs
    # hands the same value to the local runner, so the two sides agree.
  # The local e2e path (Studio v1 WP2): one bootRun is both the API and the worker, so the
  # dispatcher and the reapers run here (their schedulers are gated `worker` or `local & !api`).
  # The runner side is NOT configured here on purpose: `studio.runner.base-url` and
  # `studio.runner.service-identity-token` come from STUDIO_RUNNER_BASE_URL and
  # STUDIO_RUNNER_SERVICE_TOKEN (application.yml, no fallback), and the callback token from
  # STUDIO_CALLBACK_SERVICE_TOKEN. studio-runner/dev.sh writes all three to the shared
  # backend.env that backend/dev.sh sources, so both sides hold the same values. Without them a
  # run is closed ERROR/DISPATCH_FAILED naming the missing key, rather than left PENDING.
  #
  # STUDIO-OBS-009 AC-3: `local` and `test` are the only profiles that accept a plaintext
  # studio.runner.base-url and a context with no studio.runner.tls. Without tls settings the backend's
  # TLS identity is deny-all (StudioRunnerTls.unconfigured): http:// to a local double works, any
  # https:// hop fails closed. To run the guided bridge locally, set studio.runner.tls.* (see
  # application.yml) from a local CA.
  execution:
    dispatcher:
      enabled: ${STUDIO_DISPATCHER_ENABLED:true}
    # Local runs read the recordings and manifests the local runner writes to the shared directory.
    video-store:
      provider: ${STUDIO_EVIDENCE_PROVIDER:local}
  # Studio secret resolution (§9.2, story 10.17 AC-9).
  #
  # Off by default, including local development. Connecting a Vault takes environment variables
  # only (STUDIO_VAULT_PROVIDER, STUDIO_VAULT_ADDRESS, STUDIO_VAULT_TOKEN_FILE; see
  # application.yml). The fake provider is selected by the test profile only.
  secrets:
    vault:
      provider: ${STUDIO_VAULT_PROVIDER:none}
  gateway:
    # Local Studio has no model provider unless one is configured: guided learning answers
    # DISABLED. Set STUDIO_GATEWAY_PROVIDER=vertex (with endpoint, project and location) to exercise
    # the real path locally; a deployed profile refuses anything but vertex.
    provider: ${STUDIO_GATEWAY_PROVIDER:disabled}
    credentials:
      mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}

logging:
  level:
    com.google.genai: ${STUDIO_GATEWAY_SDK_LOG_LEVEL:INFO}
