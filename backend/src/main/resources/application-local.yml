spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

checks:
  # ── ED-02 in the LOCAL profile — one of the three opened (story 10.18b, AC-19a) ───────────────
  #
  # `core-service` and `csi-read` stay at their new default of **false**. `identity-headers` is
  # true here because the local profile's identity mechanism IS a header: `LocalDevAuthFilter`
  # injects a fixed developer identity, and the integration tests that run under this profile turn
  # that filter off (`checks.local-dev-auth.enabled=false`) precisely so they can inject their own
  # caller with `X-User-Id` / `X-User-Roles` and assert authorization ordering. With this closed,
  # every one of those tests authenticates as nobody and the route under test answers 401 before it
  # is reached.
  #
  # **`local` is a developer profile and is never deployed.** The chart renders `api,dev`,
  # `api,staging` and `api,prod`, and the rendered manifest closes all three flags in every one of
  # the four value sets — asserted in `studio-runner/test/deployment/edge.test.ts`.
  security:
    bypass:
      identity-headers: true
  # The Studio pages render "not available in this environment" while the UI_TEST source is off,
  # which it is by default everywhere (application.yml). `dev.sh` turns it on together with the
  # studio-runner so that "Run Test" is reachable locally (Studio v1 WP2).
  sources:
    UI_TEST: ${CHECKS_SOURCE_UI_TEST:false}
  scheduling:
    dispatcher-enabled: true
  reports:
    delivery-enabled: true
    mail:
      from: onboarding@resend.dev
  metrics:
    concurrent-refresh: false

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # `spring.mail.host` above defaults to a public SMTP host. Spring's MailHealthIndicator opens a
      # real SMTP connection on every /actuator/health call, and JavaMail sets no connect timeout, so
      # on a machine with no route to that host the health endpoint hangs instead of answering
      # (WorkerProfileIT, BffFilterHappyPathIT and GatewayHeadersTrustIT time out). Mail delivery is
      # not what `local` health is for; the deployed profiles keep the indicator.
      enabled: false

studio:
  # The local e2e path (Studio v1 WP2): one bootRun is both the API and the worker, so the
  # dispatcher and the reapers run here (their schedulers are gated `worker` or `local & !api`).
  # The runner side is NOT configured here on purpose: `studio.runner.base-url` and
  # `studio.runner.service-identity-token` come from STUDIO_RUNNER_BASE_URL and
  # STUDIO_RUNNER_SERVICE_TOKEN (application.yml, no fallback), and the callback token from
  # STUDIO_CALLBACK_SERVICE_TOKEN. `dev.sh` exports all three and hands the same
  # values to the runner. Without them a run is closed ERROR/DISPATCH_FAILED naming the missing
  # key, rather than left PENDING.
  execution:
    dispatcher:
      enabled: ${STUDIO_DISPATCHER_ENABLED:true}
    # Local runs read the recordings and manifests the local runner writes to the shared directory.
    video-store:
      provider: ${STUDIO_EVIDENCE_PROVIDER:local}
  # Studio secret resolution (§9.2, story 10.17 AC-9).
  #
  # Vault-backed secrets are unavailable in the production alpha, including local development.
  # The fake provider is selected by the test profile only.
  secrets:
    vault:
      provider: none
  compile:
    gateway:
      # Local Studio translates from a recorded fixture corpus so the authoring, validation,
      # dispatch, browser and evidence lifecycle can run without a gateway credential. It answers
      # only sources recorded verbatim, so it can never be read as evidence that free-form English
      # translates -- that proof belongs to the staging gate against the real provider. Set
      # STUDIO_GATEWAY_PROVIDER=vertex (with endpoint, project and location) to exercise the real
      # path locally; a deployed profile refuses anything but vertex.
      provider: ${STUDIO_GATEWAY_PROVIDER:recorded-fixture}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}

logging:
  level:
    com.google.genai: ${STUDIO_GATEWAY_SDK_LOG_LEVEL:INFO}
