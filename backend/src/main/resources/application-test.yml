spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Testcontainers-JDBC magic URL: spins up a real postgres:15-alpine on first request.
    # @Testcontainers(disabledWithoutDocker = true) on the IT classes guards against missing Docker.
    # Cached Spring contexts share this URL. Closing a transient/last connection must not
    # stop the database underneath another pool; Testcontainers cleans it up at JVM exit.
    url: jdbc:tc:postgresql:15-alpine:///checks?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    # Every cached Spring context keeps its own pool against this ONE container (max_connections
    # 100). Hikari's default of 10 per context exhausts it after ~10 distinct contexts and the next
    # context hangs on "too many clients". Small pools plus the context-cache cap in
    # src/test/resources/spring.properties keep the whole suite under the limit.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000

logging:
  level:
    root: INFO
    com.citi.put.checks: DEBUG
    org.flywaydb: INFO

# Studio secret resolution is disabled unless an individual test supplies a test-only provider.
#
# STUDIO-OBS-009 AC-3: `test` (like `local`) accepts a plaintext studio.runner.base-url and a
# context with no studio.runner.tls. A test that talks TLS to a runner double supplies
# studio.runner.tls.* from RunnerTestTls; the unconfigured identity is deny-all, never a JVM default.
studio:
  # STUDIO-FLEX-001: the fixtures' pages live on these domains (the .test, .example and .invalid
  # reserved names, example.com, localhost). A test that needs a refusal names a host outside them
  # or overrides the property; the shipped value is empty (deny all).
  navigation:
    allowed-domains: test,example,invalid,example.com,localhost,practicetestautomation.com
  guided-authoring:
    # Tests share one database across sessions that are never ended, so the deployment cap is
    # lifted here; the capacity cap is exercised with an explicit value.
    max-concurrent-sessions: 1000
  gateway:
    # Tests that exercise Vertex opt in explicitly with test credentials.
    provider: disabled
  secrets:
    vault:
      provider: none

# ── ED-02 in the TEST profile — one of the three opened, deliberately (story 10.18b, AC-19a) ────
#
# `core-service` and `csi-read` are left at their new default of **false**, so the suite observes
# the closure rather than being insulated from it. That is the point of the change: with the
# hardcoded `return true` gone, a request with no session cookie now gets a 401, which is what the
# epic's ED-02 failing tests have been asserting all along.
#
# `identity-headers` is **true here and nowhere else**. Twelve integration-test files inject their
# caller with `X-User-Id` / `X-User-Roles`; that is the suite's identity-injection mechanism, not a
# production behaviour, and closing it inside a Studio story would conflate ED-02's closure with a
# suite-wide test-harness migration that no story owns.
#
# **This profile is never deployed.** What the deployed profiles do is asserted over the *rendered*
# manifest (all three false in every one of the four value sets), and the closure itself is driven
# against the production filter under both values of each property in
# `BffSessionBypassClosureTest` — refusals with a permit companion each, so a flag that stopped
# discriminating cannot hide behind a passing test.
checks:
  security:
    bypass:
      identity-headers: true
