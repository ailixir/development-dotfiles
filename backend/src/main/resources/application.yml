spring:
  application:
    name: checks-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # No prometheus here. This is what the API pods serve, on the port the public Ingress routes
        # to, and SecurityConfig permits /actuator/** without a session. The scrape endpoint is a
        # worker-only exposure (application-worker.yml), on a ClusterIP Service with no Ingress.
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

spring.datasource.hikari:
  maximum-pool-size: 30

checks:
  sources:
    HTTP: true
    TCP: true
    SPLUNK: false
    GRAFANA: false
    ITRS: false
    APPDYNAMICS: false
    UI_TEST: true
  executor:
    max-concurrency: 250
    source-limits:
      HTTP: 150
      TCP: 150
      SPLUNK: 75
      GRAFANA: 75
      ITRS: 75
      APPDYNAMICS: 75
      UI_TEST: 25
  features:
    SCHEDULING: true
    REPORTS: true
    BULK_OPERATIONS: true
    TEMPLATES: true
    STUDIO: true
    DASHBOARD: true
  scheduling:
    dispatcher-enabled: true
    poll-interval-ms: 10000
    batch-size: 500
    min-interval-seconds: 60
  partitioning:
    retention-months: 12
  csi:
    provider: ${CHECKS_CSI_PROVIDER:local}
    base-url: ${CHECKS_CSI_API_URL:http://localhost:9090}
    timeout:
      connect-ms: 2000
      read-ms: 5000
  core-service:
    base-url: ${CHECKS_CORE_SERVICE_URL:http://localhost:8081}
    timeout:
      connect-ms: 2000
      read-ms: 3000
  dc:
    enabled: ${CHECKS_DC_ENABLED:true}
    base-url: ${CHECKS_DC_BASE_URL:http://localhost:9091}
    execute-path: ${CHECKS_DC_EXECUTE_PATH:/api/v1/execute}
    auth:
      mode: ${CHECKS_DC_AUTH_MODE:none}
      username: ${CHECKS_DC_AUTH_USERNAME:}
      password: ${CHECKS_DC_AUTH_PASSWORD:}
      token: ${CHECKS_DC_AUTH_TOKEN:}
      header-name: ${CHECKS_DC_AUTH_HEADER_NAME:X-Api-Key}
      header-value: ${CHECKS_DC_AUTH_HEADER_VALUE:}
    timeout:
      connect-ms: 3000
      read-ms: 60000
  reports:
    delivery-enabled: true
    poll-interval-ms: 60000
    batch-size: 50
    mail:
      from: ${CHECKS_REPORT_MAIL_FROM:put-checks-noreply@citi.com}
  cors:
    allowed-origins: ${CHECKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}
  security:
    # ── ED-02: the three identity bypasses, ALL DEFAULT-CLOSED (story 10.18b, AC-19a) ──────────
    #
    # ⚠ **THE CODE PATHS STILL EXIST. These close them; nothing here removes them.** @po ruled at
    # wave-6 validation that removal is out of scope — deleting the Core-service bypass moves
    # identity resolution onto CoreServiceClient, and the filter's own comment records why that is
    # unavailable: "while the target platform does not provide Core services". So the paths
    # survive, default-closed, and watched by a test pinned to the production symbol.
    #
    # **There are three, and the order among them decides whether closing achieves anything.**
    # `BffSessionAuthenticationFilter.resolveIdentity` reads the client-supplied `X-User-Id` header
    # and returns BEFORE it reaches the Core-service bypass, so closing `core-service` alone closes
    # nothing for a caller that can reach the pod and send a header. Architecture §9.1 assigns
    # stripping those headers to a trusted gateway; this repository contains no such gateway.
    #
    # ⚠ **The Studio vault adapter is implemented but default-off** (`studio.secrets.vault.provider:
    # none`), and **no credentialed pilot may run until ED-02 has linked completed tickets**. The
    # ED-02 pilot gate is unchanged by the adapter existing. ED-02's owner reads
    # "TBD — not assigned in sources"; the escalation path is @pm → Checks-squad engineering
    # management (BRD §8), with Security & Compliance accepting.
    bypass:
      core-service: ${CHECKS_BYPASS_CORE_SERVICE:false}
      identity-headers: ${CHECKS_BYPASS_IDENTITY_HEADERS:false}
      csi-read: ${CHECKS_BYPASS_CSI_READ:false}
  rate-limit:
    read-per-min: 600
    write-per-min: 120
    execute-per-min: 60
    send-per-min: 10
    bulk-per-min: 20
    admin-multiplier: 10
    max-buckets: 10000

resilience4j:
  circuitbreaker:
    instances:
      core-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      csi-api:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dailychecks:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      core-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 5
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.citi.put.checks.security.CoreServiceUnauthorizedException
      csi-api:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
      dailychecks:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# Studio execution — the one configuration source for dispatch, callbacks, recovery and SSE
# (Story 10.7, architecture §8.5). Every value here is a §8.5 STARTING value tuned against staging
# measurements (§10), not a commitment, and every bound AC-38 inventories has its name here.
studio:
  # The domain allow-list: the only control on where Studio navigates (STUDIO-FLEX-001). A comma-separated
  # list of lowercase punycode host suffixes with no spaces, at most 32, none a suffix of another; a page may
  # be any http(s) URL whose host is an entry or ends with "." + entry. Empty (the shipped value) denies
  # everything. An invalid value stops startup. The runner reads STUDIO_RUNNER_ALLOWED_DOMAINS, which the
  # chart renders from the same value.
  #
  # allow-all-domains (ON by default for now, user decision 2026-10-25): when true, navigation may reach ANY http(s) URL whose host is a
  # DNS name (still no userinfo, no IP literal) and the list above is ignored (it is still validated).
  # Only exactly true or false is accepted; anything else stops startup. The runner reads
  # STUDIO_RUNNER_ALLOW_ALL_DOMAINS, which the chart renders from the same value, so the two sides can
  # never disagree. A WARN line is logged at startup when it is on.
  navigation:
    allowed-domains: ${STUDIO_ALLOWED_DOMAINS:}
    allow-all-domains: ${STUDIO_ALLOW_ALL_DOMAINS:true}
  guided-authoring:
    # Deployment-wide cap on concurrent learning sessions, whichever CSI started them. It equals the
    # capacity of the one guided runner pod; the chart renders both from studioRunner.guided.capacity.
    # The 429 refusal is BUDGET_EXCEEDED / LEARNING_CAPACITY_EXHAUSTED.
    max-concurrent-sessions: 1
    # Distinct receivers require distinct textual JWT audiences; no credential is stored in session data.
    controller-token-file: ${STUDIO_GUIDED_RUNNER_CONTROLLER_TOKEN_FILE:}
    # The mutual-TLS chain of the guided bridge (STUDIO-OBS-009 AC-2). The API pod checks every call
    # to /internal/v2/studio/guided-sessions/** against these three together (GuidedInternalSecurity)
    # and answers 401 when any is missing. The deployed profiles set mtls-required, and a deployment
    # that wires a guided hop does not start without the rest (GuidedSessionConfiguration.MtlsChain).
    #   service-public-key  the pinned RSA public key (PEM, SPKI) that verifies the controller JWTs
    #   service-issuer      the `iss` those JWTs must carry
    # Rotate by draining sessions, changing key and issuer together and restarting every pod.
    mtls-required: ${STUDIO_GUIDED_MTLS_REQUIRED:false}
    service-public-key: ${STUDIO_GUIDED_SERVICE_PUBLIC_KEY:}
    service-issuer: ${STUDIO_GUIDED_SERVICE_ISSUER:}
    # The API pod's guided TLS connector: clientAuth=need, trust from studio.runner.tls, serving the
    # backend's one certificate. 0 = no connector (workers; local; test). The runner's
    # GUIDED_CALLBACK_BASE_URL and translation.controller-origin name this port.
    connector:
      port: ${STUDIO_GUIDED_CONNECTOR_PORT:0}
    # The origins have no placeholder on purpose. runner-origin switches a bean on by being present
    # (@ConditionalOnProperty), and an empty but present property would switch it on. Set them as
    # environment variables STUDIO_GUIDED_AUTHORING_RUNNER_ORIGIN and
    # STUDIO_GUIDED_AUTHORING_TRANSLATION_CONTROLLER_ORIGIN (https only).
    translation:
      controller-token-file: ${STUDIO_GUIDED_CONTROLLER_TOKEN_FILE:${studio.guided-authoring.controller-token-file:}}
      # Base delay before a definite-transient provider retry (connection refused/reset, HTTP 429/503,
      # or a pre-response stall). The retry is a new persisted, charged attempt in the same
      # three-proposal pool; the delay before attempt n is base << (n-2). 0..30000.
      transient-backoff-millis: ${STUDIO_GUIDED_TRANSIENT_BACKOFF_MILLIS:2000}
      # Longest one provider send may wait for its response (a total-call cap), 1..600. The cap only
      # takes effect while it is shorter than the call budget left after authentication
      # (call-seconds, default 60). A send that receives no response headers within the cap is
      # abandoned as a TRANSPORT_STALL and retried as a new charged attempt.
      # Start-up refuses call-seconds below send-timeout-seconds + 10, so raise both together.
      send-timeout-seconds: ${STUDIO_GUIDED_SEND_TIMEOUT_SECONDS:20}
    # STUDIO-OBS-014 AC-3 (ruling AR-2 b): sanitized observations, model output and the publication
    # copies of never-published sessions are pruned this long after a terminal session's expiry.
    # Same default as studio.execution.evidence-retention, so video and observations age out
    # together. Start-up refuses a window under 24h.
    retention:
      observation-window: ${STUDIO_GUIDED_OBSERVATION_RETENTION:30d}
      pruner-delay-ms: 3600000
      batch-size: 100
    # STUDIO-OBS-014 AC-8 (ruling AR-2 c): per-CSI limits on top of the per-session ceilings above.
    # Daily model tokens are unlimited by default (0 = no gate, no cap; user decision 2026-10-23, access
    # control is left to the future RBAC). Set the env var to a positive number to cap one environment;
    # a cap must hold one full per-session ceiling. max-concurrent-sessions is a load limit, unchanged.
    csi-budget:
      max-concurrent-sessions: ${STUDIO_GUIDED_CSI_MAX_CONCURRENT:3}
      daily-model-input-tokens: ${STUDIO_GUIDED_CSI_DAILY_INPUT_TOKENS:0}
      daily-model-output-tokens: ${STUDIO_GUIDED_CSI_DAILY_OUTPUT_TOKENS:0}
  guided:
    publication:
      enabled: ${STUDIO_OBSERVED_PUBLICATION_ENABLED:true}
      max-validation-attempts: 3
      validation-timeout-ms: 15000
      authorization-ttl-ms: 5000
      max-validation-bytes: 8388608
  observed-replay:
    enabled: ${STUDIO_OBSERVED_REPLAY_ENABLED:true}
    authorization-ttl-ms: 30000
    max-artifact-bytes: 1048576
    max-job-bytes: 4194304
    max-execute-frame-bytes: 2097152
    catalog-json: '${STUDIO_OBSERVED_CATALOG_JSON:[]}'
    recording-width: ${STUDIO_OBSERVED_RECORDING_WIDTH:1280}
    recording-height: ${STUDIO_OBSERVED_RECORDING_HEIGHT:720}
  # Save-time authoring bounds: over-limit drafts are refused 400 before anything is written.
  authoring:
    max-steps: ${STUDIO_AUTHORING_MAX_STEPS:100}
  secrets:
    vault:
      # Vault KV v2 is the only Studio secret store, and it is off by default (`none`: saving or
      # listing a secret answers 503 VAULT_NOT_CONFIGURED; nothing falls back to another store).
      # Connecting needs environment variables only:
      #   required  STUDIO_VAULT_PROVIDER=hashicorp, STUDIO_VAULT_ADDRESS (https, or loopback
      #             http), STUDIO_VAULT_TOKEN_FILE (a readable mounted token file)
      #   optional  STUDIO_VAULT_NAMESPACE, STUDIO_VAULT_MOUNT, STUDIO_VAULT_PATH_TEMPLATE,
      #             STUDIO_VAULT_VALUE_KEY
      # The default path template is studio/{csiId}/{environment}/{testId}/{kind}/{referenceName}.
      # Any template must contain those five placeholders and end with /{referenceName}, or the
      # context refuses to start. Tests override the provider with the fake.
      provider: ${STUDIO_VAULT_PROVIDER:none}
      hashicorp:
        address: ${STUDIO_VAULT_ADDRESS:}
        namespace: ${STUDIO_VAULT_NAMESPACE:}
        mount: ${STUDIO_VAULT_MOUNT:secret}
        path-template: ${STUDIO_VAULT_PATH_TEMPLATE:}
        value-key: ${STUDIO_VAULT_VALUE_KEY:value}
        token-file: ${STUDIO_VAULT_TOKEN_FILE:}
        connect-timeout: ${STUDIO_VAULT_CONNECT_TIMEOUT:2s}
        request-timeout: ${STUDIO_VAULT_REQUEST_TIMEOUT:5s}
        max-response-bytes: ${STUDIO_VAULT_MAX_RESPONSE_BYTES:65536}
  execution:
    # The kill switch (§8.5). When false: new executes are 503 DISPATCH_DISABLED, queued and
    # claimed work is closed explicitly, admitted work finishes, and reads, callbacks and
    # recovery all stay active.
    enabled: ${STUDIO_EXECUTION_ENABLED:true}
    # Queue time and browser runtime are separate budgets and must stay separate columns.
    pending-sla: ${STUDIO_PENDING_SLA:600s}
    start-deadline: ${STUDIO_START_DEADLINE:30s}
    run-deadline: ${STUDIO_RUN_DEADLINE:600s}
    # The total browser runtime every job carries as deadlines.totalRuntimeMs (300 seconds since
    # STUDIO-FLEX-001; the runner's STUDIO_RUNNER_MAX_TOTAL_RUNTIME_MS default matches). Server configuration, NOT the per-test timeoutSeconds, which
    # is the per-step timeout and stays on the job's configuration. Must be strictly shorter than
    # run-deadline (refused at startup otherwise); the runner clamps it to its own
    # STUDIO_RUNNER_MAX_TOTAL_RUNTIME_MS.
    total-runtime: ${STUDIO_TOTAL_RUNTIME:300s}
    admission-timeout: ${STUDIO_ADMISSION_TIMEOUT:10s}
    evidence-retention: ${STUDIO_EVIDENCE_RETENTION:30d}
    # Deployment configuration, never job-supplied (§8.4, §8.5).
    callback-base-url: ${STUDIO_CALLBACK_BASE_URL:http://put-checks-api:8080}
    # Where the recordings live (§6.2). Deployment configuration, and never a response value:
    # the API stores object keys only and hands the browser the protected API path.
    # No retention value here — `evidence-retention` above is the single source (§8.5).
    video-store:
      bucket: ${STUDIO_EVIDENCE_BUCKET:put-checks-studio-evidence}
      endpoint: ${STUDIO_EVIDENCE_ENDPOINT:}
      # Storage is off unless an environment explicitly selects the real local filesystem or the
      # Sonic-compatible S3 implementation. Missing configuration is visible as unavailable proof.
      provider: ${STUDIO_EVIDENCE_PROVIDER:none}
      directory: ${STUDIO_EVIDENCE_DIRECTORY:/tmp/studio-runner-objects}
      region: ${STUDIO_EVIDENCE_REGION:us-east-1}
      path-style-access: ${STUDIO_EVIDENCE_PATH_STYLE_ACCESS:true}
      access-key-id-file: ${STUDIO_EVIDENCE_ACCESS_KEY_ID_FILE:}
      secret-access-key-file: ${STUDIO_EVIDENCE_SECRET_ACCESS_KEY_FILE:}
      max-manifest-bytes: ${STUDIO_EVIDENCE_MAX_MANIFEST_BYTES:524288}
      connect-timeout: ${STUDIO_EVIDENCE_CONNECT_TIMEOUT:2s}
      request-timeout: ${STUDIO_EVIDENCE_REQUEST_TIMEOUT:10s}
    quotas:
      per-csi: ${STUDIO_QUOTA_PER_CSI:20}
      global: ${STUDIO_QUOTA_GLOBAL:200}
      max-steps-per-test: ${STUDIO_MAX_STEPS:100}
    recovery:
      # Both reapers and finalization reconciliation, worker profile only (§5.4).
      poll-interval-ms: ${STUDIO_RECOVERY_POLL_MS:5000}
    # How long the running reaper waits before closing a cancel the runner never finished (Studio
    # v1 WP16, ADR-002 §29). Each value mirrors a runner bound and reads the runner's OWN env name,
    # so rendering the runner's values into this process configures both sides from one fact. The
    # margin is derived as poll + 2 x report-timeout + stop-grace + report-timeout + evidence-window
    # + delivery-window + slack (92s with these values) unless STUDIO_CANCEL_MARGIN is set, and a
    # margin shorter than that worst case is refused at startup: it would close rows under a live
    # runner and refuse its FINAL. Bare numbers are milliseconds.
    cancel:
      # The runner's CONTROL_POLL_INTERVAL_MS, a constant in runCoordinator.ts, not a setting.
      control-poll-interval: 2s
      report-timeout: ${STUDIO_RUNNER_ADMISSION_TIMEOUT_MS:10000}
      stop-grace: ${STUDIO_RUNNER_BROWSER_STOP_TIMEOUT_MS:5000}
      evidence-window: ${STUDIO_RUNNER_OBJECT_STORE_WINDOW_MS:15000}
      delivery-window: ${STUDIO_RUNNER_TERMINAL_DELIVERY_WINDOW_MS:30000}
      slack: ${STUDIO_CANCEL_MARGIN_SLACK:10s}
      margin: ${STUDIO_CANCEL_MARGIN:}
    dispatcher:
      enabled: ${STUDIO_DISPATCHER_ENABLED:false}
      threads: ${STUDIO_DISPATCHER_THREADS:4}
      batch-size: ${STUDIO_DISPATCHER_BATCH:20}
      lease: ${STUDIO_DISPATCHER_LEASE:60s}
      poll-interval-ms: ${STUDIO_DISPATCHER_POLL_MS:2000}
    callback:
      max-body-bytes: ${STUDIO_CALLBACK_MAX_BODY:262144}
      max-steps: ${STUDIO_CALLBACK_MAX_STEPS:500}
      max-log-entries: ${STUDIO_CALLBACK_MAX_LOGS:500}
      max-log-entry-chars: ${STUDIO_CALLBACK_MAX_LOG_CHARS:2000}
      # The restricted service identity of §8.4/§9.1. No default: a deployment that does not set
      # it gets a chain that refuses every caller, which is the correct failure direction.
      service-token: ${STUDIO_CALLBACK_SERVICE_TOKEN:}
    sse:
      heartbeat: ${STUDIO_SSE_HEARTBEAT:15s}
      lifetime: ${STUDIO_SSE_LIFETIME:60s}
      # The same 500-1000 ms budget, as a plain millis value for the scheduler annotation.
      read-interval-ms: ${STUDIO_SSE_READ_INTERVAL_MS:750}
      authorization-refresh: ${STUDIO_SSE_AUTH_REFRESH:30s}
      max-streams-per-user: ${STUDIO_SSE_MAX_PER_USER:5}
      max-streams-per-pod: ${STUDIO_SSE_MAX_PER_POD:200}
      max-watched-executions: ${STUDIO_SSE_MAX_WATCHED:200}
      sender-threads: ${STUDIO_SSE_SENDER_THREADS:4}
  # Guided-authoring model transport. Vertex AI is the only provider; anything else answers
  # DISABLED and never invents a proposal. Guided authoring owns per-attempt budgets and wire bounds.
  gateway:
    provider: ${STUDIO_GATEWAY_PROVIDER:disabled}
    endpoint: ${STUDIO_GATEWAY_ENDPOINT:}
    project: ${STUDIO_GATEWAY_PROJECT:}
    location: ${STUDIO_GATEWAY_LOCATION:}
    model: ${STUDIO_GATEWAY_MODEL:gemini-3.8-flash}
    credentials:
      mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}
      service-account-key-file: ${STUDIO_GATEWAY_CREDENTIALS_KEY_FILE:}
    request-timeout: ${STUDIO_GATEWAY_REQUEST_TIMEOUT:150s}
    max-concurrency: ${STUDIO_GATEWAY_MAX_CONCURRENCY:8}
    max-input-bytes: ${STUDIO_GATEWAY_MAX_INPUT_BYTES:262144}
    max-output-bytes: ${STUDIO_GATEWAY_MAX_OUTPUT_BYTES:262144}
    max-output-tokens: ${STUDIO_GATEWAY_MAX_OUTPUT_TOKENS:32768}
    # VAL-007 (2026-10-04): LOW measured >= MEDIUM >= HIGH on quality and 3-6x faster
    # (docs/stories/UI-STUDIO-VALIDATION-20261004/benchmark/report.md). LOW | MEDIUM | HIGH;
    # MINIMAL fails binding.
    thinking-level: ${STUDIO_GATEWAY_THINKING_LEVEL:LOW}
  # The studio-runner Service. The base URL is deployment configuration and never job- or
  # user-supplied (§8.4, §8.5). Both observed runner routes (POST /v2/validate-observed and the
  # worker's POST/DELETE /v2/runs) read this one block and present the same bearer; without
  # base-url or service-identity-token the dispatcher sends nothing and closes the execution
  # DISPATCH_FAILED (DEF-05).
  #
  # TLS (STUDIO-OBS-009 AC-3). The runner has no plaintext listener, so outside the local and test
  # profiles base-url must be https and the four runner-facing clients (dispatch, validation, the
  # guided bridge and the translation controller hop) all take their TLS from `tls` below, built by
  # StudioRunnerTls. No javax.net.ssl.* property and no cacerts is read. The key store holds the
  # backend's one certificate: its client certificate toward the runner and the server certificate
  # of the guided connector (serverAuth and clientAuth). The trust store holds the issuer of the
  # runner certificate and of the connector certificate. Passwords are files, never values.
  runner:
    base-url: ${STUDIO_RUNNER_BASE_URL:}
    service-identity-token: ${STUDIO_RUNNER_SERVICE_TOKEN:}
    connect-timeout: ${STUDIO_RUNNER_CONNECT_TIMEOUT:2s}
    tls:
      key-store: ${STUDIO_RUNNER_TLS_KEY_STORE:}
      key-store-password-file: ${STUDIO_RUNNER_TLS_KEY_STORE_PASSWORD_FILE:}
      key-store-type: ${STUDIO_RUNNER_TLS_KEY_STORE_TYPE:PKCS12}
      trust-store: ${STUDIO_RUNNER_TLS_TRUST_STORE:}
      trust-store-password-file: ${STUDIO_RUNNER_TLS_TRUST_STORE_PASSWORD_FILE:}
      trust-store-type: ${STUDIO_RUNNER_TLS_TRUST_STORE_TYPE:PKCS12}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # The internal callbacks are never part of the public surface (§8.4, AC-6a). The contract test
  # still covers them; springdoc does not publish them.
  paths-to-exclude:
    - /internal/**

logging:
  config: classpath:logback-spring.xml
  level:
    # Google Gen AI SDK debug logging stays off outside the local profile (Story 10.5).
    com.google.genai: WARN
    com.google.api: WARN
    io.grpc: WARN
    # STUDIO-OBS-015 ruling E: json-schema-validator logs every validated instance and its whole
    # root document at DEBUG (BaseJsonValidator.debug). SecretMasker does not cover document
    # values, so DEBUG here is a content sink. It has no INFO output; WARN keeps its schema/pattern
    # errors (no instance values) and closes the sink under any root level.
    com.networknt: WARN
