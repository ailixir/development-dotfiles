spring:
  application:
    name: checks-backend
  profiles:
    active: local
    group:
      dev: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

checks:
  scheduling:
    dispatcher-enabled: true
    poll-interval-ms: 30000
  partitioning:
    retention-months: 12
  core-service:
    base-url: ${CHECKS_CORE_SERVICE_URL:http://localhost:8081}
    timeout:
      connect-ms: 2000
      read-ms: 3000
  cors:
    allowed-origins: ${CHECKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}
  rate-limit:
    read-per-min: 600
    write-per-min: 120
    execute-per-min: 60
    send-per-min: 10
    bulk-per-min: 20
    admin-multiplier: 10
    max-buckets: 10000

resilience4j:
  circuitbreaker:
    instances:
      core-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      core-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 5
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.citi.put.checks.security.CoreServiceUnauthorizedException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:logback-spring.xml
