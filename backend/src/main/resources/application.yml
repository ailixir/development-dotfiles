spring:
  application:
    name: checks-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

spring.datasource.hikari:
  maximum-pool-size: 30

checks:
  sources:
    HTTP: true
    TCP: true
    SPLUNK: false
    GRAFANA: false
    ITRS: false
    APPDYNAMICS: false
    UI_TEST: false
  executor:
    max-concurrency: 250
    source-limits:
      HTTP: 150
      TCP: 150
      SPLUNK: 75
      GRAFANA: 75
      ITRS: 75
      APPDYNAMICS: 75
      UI_TEST: 25
  features:
    SCHEDULING: true
    REPORTS: true
    BULK_OPERATIONS: true
    TEMPLATES: true
    STUDIO: true
    DASHBOARD: true
  scheduling:
    dispatcher-enabled: true
    poll-interval-ms: 10000
    batch-size: 500
    min-interval-seconds: 60
  partitioning:
    retention-months: 12
  csi:
    provider: ${CHECKS_CSI_PROVIDER:local}
    base-url: ${CHECKS_CSI_API_URL:http://localhost:9090}
    timeout:
      connect-ms: 2000
      read-ms: 5000
  core-service:
    base-url: ${CHECKS_CORE_SERVICE_URL:http://localhost:8081}
    timeout:
      connect-ms: 2000
      read-ms: 3000
  dc:
    enabled: ${CHECKS_DC_ENABLED:true}
    base-url: ${CHECKS_DC_BASE_URL:http://localhost:9091}
    execute-path: ${CHECKS_DC_EXECUTE_PATH:/api/v1/execute}
    auth:
      mode: ${CHECKS_DC_AUTH_MODE:none}
      username: ${CHECKS_DC_AUTH_USERNAME:}
      password: ${CHECKS_DC_AUTH_PASSWORD:}
      token: ${CHECKS_DC_AUTH_TOKEN:}
      header-name: ${CHECKS_DC_AUTH_HEADER_NAME:X-Api-Key}
      header-value: ${CHECKS_DC_AUTH_HEADER_VALUE:}
    timeout:
      connect-ms: 3000
      read-ms: 60000
  reports:
    delivery-enabled: true
    poll-interval-ms: 60000
    batch-size: 50
    mail:
      from: ${CHECKS_REPORT_MAIL_FROM:put-checks-noreply@citi.com}
  cors:
    allowed-origins: ${CHECKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}
  rate-limit:
    read-per-min: 600
    write-per-min: 120
    execute-per-min: 60
    send-per-min: 10
    bulk-per-min: 20
    admin-multiplier: 10
    max-buckets: 10000

resilience4j:
  circuitbreaker:
    instances:
      core-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      csi-api:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dailychecks:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      core-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 5
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.citi.put.checks.security.CoreServiceUnauthorizedException
      csi-api:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
      dailychecks:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:logback-spring.xml
