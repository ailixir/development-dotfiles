spring:
  application:
    name: checks-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

spring.datasource.hikari:
  maximum-pool-size: 30

checks:
  sources:
    HTTP: true
    TCP: true
    SPLUNK: false
    GRAFANA: false
    ITRS: false
    APPDYNAMICS: false
    UI_TEST: false
  executor:
    max-concurrency: 250
    source-limits:
      HTTP: 150
      TCP: 150
      SPLUNK: 75
      GRAFANA: 75
      ITRS: 75
      APPDYNAMICS: 75
      UI_TEST: 25
  features:
    SCHEDULING: true
    REPORTS: true
    BULK_OPERATIONS: true
    TEMPLATES: true
    STUDIO: true
    DASHBOARD: true
  scheduling:
    dispatcher-enabled: true
    poll-interval-ms: 10000
    batch-size: 500
    min-interval-seconds: 60
  partitioning:
    retention-months: 12
  csi:
    provider: ${CHECKS_CSI_PROVIDER:local}
    base-url: ${CHECKS_CSI_API_URL:http://localhost:9090}
    timeout:
      connect-ms: 2000
      read-ms: 5000
  core-service:
    base-url: ${CHECKS_CORE_SERVICE_URL:http://localhost:8081}
    timeout:
      connect-ms: 2000
      read-ms: 3000
  dc:
    enabled: ${CHECKS_DC_ENABLED:true}
    base-url: ${CHECKS_DC_BASE_URL:http://localhost:9091}
    execute-path: ${CHECKS_DC_EXECUTE_PATH:/api/v1/execute}
    auth:
      mode: ${CHECKS_DC_AUTH_MODE:none}
      username: ${CHECKS_DC_AUTH_USERNAME:}
      password: ${CHECKS_DC_AUTH_PASSWORD:}
      token: ${CHECKS_DC_AUTH_TOKEN:}
      header-name: ${CHECKS_DC_AUTH_HEADER_NAME:X-Api-Key}
      header-value: ${CHECKS_DC_AUTH_HEADER_VALUE:}
    timeout:
      connect-ms: 3000
      read-ms: 60000
  reports:
    delivery-enabled: true
    poll-interval-ms: 60000
    batch-size: 50
    mail:
      from: ${CHECKS_REPORT_MAIL_FROM:put-checks-noreply@citi.com}
  cors:
    allowed-origins: ${CHECKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}
  rate-limit:
    read-per-min: 600
    write-per-min: 120
    execute-per-min: 60
    send-per-min: 10
    bulk-per-min: 20
    admin-multiplier: 10
    max-buckets: 10000

resilience4j:
  circuitbreaker:
    instances:
      core-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      csi-api:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dailychecks:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      core-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 5
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.citi.put.checks.security.CoreServiceUnauthorizedException
      csi-api:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
      dailychecks:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# Studio execution — the one configuration source for dispatch, callbacks, recovery and SSE
# (Story 10.7, architecture §8.5). Every value here is a §8.5 STARTING value tuned against staging
# measurements (§10), not a commitment, and every bound AC-38 inventories has its name here.
studio:
  execution:
    # The kill switch (§8.5). When false: new executes are 503 DISPATCH_DISABLED, queued and
    # claimed work is closed explicitly, admitted work finishes, and reads, callbacks and
    # recovery all stay active.
    enabled: ${STUDIO_EXECUTION_ENABLED:true}
    # Queue time and browser runtime are separate budgets and must stay separate columns.
    pending-sla: ${STUDIO_PENDING_SLA:600s}
    start-deadline: ${STUDIO_START_DEADLINE:30s}
    run-deadline: ${STUDIO_RUN_DEADLINE:600s}
    admission-timeout: ${STUDIO_ADMISSION_TIMEOUT:10s}
    evidence-retention: ${STUDIO_EVIDENCE_RETENTION:30d}
    runner-base-url: ${STUDIO_RUNNER_BASE_URL:http://put-checks-studio-runner:8090}
    # Deployment configuration, never job-supplied (§8.4, §8.5).
    callback-base-url: ${STUDIO_CALLBACK_BASE_URL:http://put-checks-api:8080}
    quotas:
      per-csi: ${STUDIO_QUOTA_PER_CSI:20}
      global: ${STUDIO_QUOTA_GLOBAL:200}
      max-steps-per-test: ${STUDIO_MAX_STEPS:200}
    recovery:
      # Both reapers and finalization reconciliation, worker profile only (§5.4).
      poll-interval-ms: ${STUDIO_RECOVERY_POLL_MS:5000}
    dispatcher:
      enabled: ${STUDIO_DISPATCHER_ENABLED:false}
      threads: ${STUDIO_DISPATCHER_THREADS:4}
      batch-size: ${STUDIO_DISPATCHER_BATCH:20}
      lease: ${STUDIO_DISPATCHER_LEASE:60s}
      poll-interval-ms: ${STUDIO_DISPATCHER_POLL_MS:2000}
    callback:
      max-body-bytes: ${STUDIO_CALLBACK_MAX_BODY:262144}
      max-steps: ${STUDIO_CALLBACK_MAX_STEPS:500}
      max-log-entries: ${STUDIO_CALLBACK_MAX_LOGS:500}
      max-log-entry-chars: ${STUDIO_CALLBACK_MAX_LOG_CHARS:2000}
      # The restricted service identity of §8.4/§9.1. No default: a deployment that does not set
      # it gets a chain that refuses every caller, which is the correct failure direction.
      service-token: ${STUDIO_CALLBACK_SERVICE_TOKEN:}
    sse:
      heartbeat: ${STUDIO_SSE_HEARTBEAT:15s}
      lifetime: ${STUDIO_SSE_LIFETIME:60s}
      read-interval: ${STUDIO_SSE_READ_INTERVAL:750ms}
      authorization-refresh: ${STUDIO_SSE_AUTH_REFRESH:30s}
      max-streams-per-user: ${STUDIO_SSE_MAX_PER_USER:5}
      max-streams-per-pod: ${STUDIO_SSE_MAX_PER_POD:200}
      max-watched-executions: ${STUDIO_SSE_MAX_WATCHED:200}
      sender-threads: ${STUDIO_SSE_SENDER_THREADS:4}
  # Studio compile — Citi/R2D2 LLM gateway (Story 10.5, architecture §4.1/§8.5).
  # Off by default: a stock build never reaches an LLM. Endpoint/project/location/model/
  # credentials are deployment configuration and carry no default value.
  compile:
    gateway:
      enabled: ${STUDIO_GATEWAY_ENABLED:false}
      endpoint: ${STUDIO_GATEWAY_ENDPOINT:}
      project: ${STUDIO_GATEWAY_PROJECT:}
      location: ${STUDIO_GATEWAY_LOCATION:}
      model: ${STUDIO_GATEWAY_MODEL:}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}
        service-account-key-file: ${STUDIO_GATEWAY_CREDENTIALS_KEY_FILE:}
      request-timeout: ${STUDIO_GATEWAY_REQUEST_TIMEOUT:60s}
      max-concurrency: ${STUDIO_GATEWAY_MAX_CONCURRENCY:4}
      max-input-bytes: ${STUDIO_GATEWAY_MAX_INPUT_BYTES:262144}
      max-output-bytes: ${STUDIO_GATEWAY_MAX_OUTPUT_BYTES:262144}
      structured-output: ${STUDIO_GATEWAY_STRUCTURED_OUTPUT:true}
      temperature: ${STUDIO_GATEWAY_TEMPERATURE:0}
      retry:
        max-retries: 2
        initial-backoff: 250ms
        backoff-multiplier: 2.0
        jitter-factor: 0.5
      # FIXTURE COPY pending story 10.1a; see the $comment in the schema file.
      artifact-schema: ${STUDIO_GATEWAY_ARTIFACT_SCHEMA:classpath:studio/artifact.schema.json}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # The internal callbacks are never part of the public surface (§8.4, AC-6a). The contract test
  # still covers them; springdoc does not publish them.
  paths-to-exclude:
    - /internal/**

logging:
  config: classpath:logback-spring.xml
  level:
    # Vertex AI SDK debug logging stays off outside the local profile (Story 10.5).
    com.google.cloud.vertexai: WARN
    com.google.api: WARN
    io.grpc: WARN
