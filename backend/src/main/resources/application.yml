spring:
  application:
    name: checks-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

spring.datasource.hikari:
  maximum-pool-size: 30

checks:
  sources:
    HTTP: true
    TCP: true
    SPLUNK: false
    GRAFANA: false
    ITRS: false
    APPDYNAMICS: false
    UI_TEST: false
  executor:
    max-concurrency: 250
    source-limits:
      HTTP: 150
      TCP: 150
      SPLUNK: 75
      GRAFANA: 75
      ITRS: 75
      APPDYNAMICS: 75
      UI_TEST: 25
  features:
    SCHEDULING: true
    REPORTS: true
    BULK_OPERATIONS: true
    TEMPLATES: true
    STUDIO: true
    DASHBOARD: true
  scheduling:
    dispatcher-enabled: true
    poll-interval-ms: 10000
    batch-size: 500
    min-interval-seconds: 60
  partitioning:
    retention-months: 12
  csi:
    provider: ${CHECKS_CSI_PROVIDER:local}
    base-url: ${CHECKS_CSI_API_URL:http://localhost:9090}
    timeout:
      connect-ms: 2000
      read-ms: 5000
  core-service:
    base-url: ${CHECKS_CORE_SERVICE_URL:http://localhost:8081}
    timeout:
      connect-ms: 2000
      read-ms: 3000
  dc:
    enabled: ${CHECKS_DC_ENABLED:true}
    base-url: ${CHECKS_DC_BASE_URL:http://localhost:9091}
    execute-path: ${CHECKS_DC_EXECUTE_PATH:/api/v1/execute}
    auth:
      mode: ${CHECKS_DC_AUTH_MODE:none}
      username: ${CHECKS_DC_AUTH_USERNAME:}
      password: ${CHECKS_DC_AUTH_PASSWORD:}
      token: ${CHECKS_DC_AUTH_TOKEN:}
      header-name: ${CHECKS_DC_AUTH_HEADER_NAME:X-Api-Key}
      header-value: ${CHECKS_DC_AUTH_HEADER_VALUE:}
    timeout:
      connect-ms: 3000
      read-ms: 60000
  reports:
    delivery-enabled: true
    poll-interval-ms: 60000
    batch-size: 50
    mail:
      from: ${CHECKS_REPORT_MAIL_FROM:put-checks-noreply@citi.com}
  cors:
    allowed-origins: ${CHECKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}
  rate-limit:
    read-per-min: 600
    write-per-min: 120
    execute-per-min: 60
    send-per-min: 10
    bulk-per-min: 20
    admin-multiplier: 10
    max-buckets: 10000

resilience4j:
  circuitbreaker:
    instances:
      core-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      csi-api:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dailychecks:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      core-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 5
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.citi.put.checks.security.CoreServiceUnauthorizedException
      csi-api:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
      dailychecks:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# Studio compile — Citi/R2D2 LLM gateway (Story 10.5, architecture §4.1/§8.5).
# Off by default: a stock build never reaches an LLM. Endpoint/project/location/model/credentials
# are deployment configuration and carry no default value.
studio:
  compile:
    gateway:
      enabled: ${STUDIO_GATEWAY_ENABLED:false}
      endpoint: ${STUDIO_GATEWAY_ENDPOINT:}
      project: ${STUDIO_GATEWAY_PROJECT:}
      location: ${STUDIO_GATEWAY_LOCATION:}
      model: ${STUDIO_GATEWAY_MODEL:}
      credentials:
        mode: ${STUDIO_GATEWAY_CREDENTIALS_MODE:application-default}
        service-account-key-file: ${STUDIO_GATEWAY_CREDENTIALS_KEY_FILE:}
      request-timeout: ${STUDIO_GATEWAY_REQUEST_TIMEOUT:60s}
      max-concurrency: ${STUDIO_GATEWAY_MAX_CONCURRENCY:4}
      max-input-bytes: ${STUDIO_GATEWAY_MAX_INPUT_BYTES:262144}
      max-output-bytes: ${STUDIO_GATEWAY_MAX_OUTPUT_BYTES:262144}
      structured-output: ${STUDIO_GATEWAY_STRUCTURED_OUTPUT:true}
      temperature: ${STUDIO_GATEWAY_TEMPERATURE:0}
      retry:
        max-retries: 2
        initial-backoff: 250ms
        backoff-multiplier: 2.0
        jitter-factor: 0.5
      # FIXTURE COPY pending story 10.1a; see the $comment in the schema file.
      artifact-schema: ${STUDIO_GATEWAY_ARTIFACT_SCHEMA:classpath:studio/artifact.schema.json}

    # Bounded compile work (Story 10.8, AC-17/AC-18/AC-19). Every value below is a starting value
    # to be tuned against staging measurements (§8.5), and every one has a defined behaviour at the
    # bound with a test that drives the input past it.
    pipeline:
      # Fixed pool, NO queue: attempt concurrency+1 is refused, not parked.
      concurrency: ${STUDIO_COMPILE_CONCURRENCY:4}
      # Total wall-clock per attempt. Must be strictly greater than gateway.request-timeout above,
      # or a slow gateway call would be abandoned by this budget before the gateway gave up and the
      # recorded code would name the wrong bound. Startup fails if it is not.
      attempt-budget: ${STUDIO_COMPILE_ATTEMPT_BUDGET:180s}
    # Enforced before beginCompile: over-limit is a 400 and no compile state changes (AC-6).
    authoring:
      # Must never be looser than the runner's DEFAULT_BOUNDS.maxSteps, or a draft could be
      # authorable and structurally uncompilable. RunnerBoundsAlignmentTest enforces that.
      max-steps: ${STUDIO_COMPILE_MAX_STEPS:100}
      max-line-chars: ${STUDIO_COMPILE_MAX_LINE_CHARS:1024}
      max-source-bytes: ${STUDIO_COMPILE_MAX_SOURCE_BYTES:65536}
    # Applied before publishInvalid; truncation is explicit in the stored structure (AC-15).
    diagnostics:
      max-per-step: ${STUDIO_COMPILE_MAX_DIAGNOSTICS_PER_STEP:10}
      max-message-chars: ${STUDIO_COMPILE_MAX_DIAGNOSTIC_MESSAGE:400}
      max-excerpt-chars: ${STUDIO_COMPILE_MAX_DIAGNOSTIC_EXCERPT:120}
      max-total-bytes: ${STUDIO_COMPILE_MAX_DIAGNOSTICS_BYTES:65536}
  # The studio-runner Service. The base URL is deployment configuration and never job- or
  # user-supplied (§8.4, §8.5). Empty by default: without it the pipeline reports
  # VALIDATOR_UNAVAILABLE and the draft stays retryable, rather than publishing an unvalidated
  # candidate.
  runner:
    base-url: ${STUDIO_RUNNER_BASE_URL:}
    service-identity-token: ${STUDIO_RUNNER_SERVICE_TOKEN:}
    validate-timeout: ${STUDIO_RUNNER_VALIDATE_TIMEOUT:10s}
    connect-timeout: ${STUDIO_RUNNER_CONNECT_TIMEOUT:2s}
  # The exact-match half of the §4.6 compatibility rule. The ranged Playwright/executor terms stay
  # with the runner's own isCompatible, which revalidates before any browser launch — one rule, one
  # owner, no drift. executor-version and playwright-version below are RECORDED on revision
  # provenance and never compared by this backend.
  runtime:
    pin:
      artifact-schema-version: 1
      validator-schema-version: ${STUDIO_RUNTIME_VALIDATOR_SCHEMA_VERSION:1.0.0}
      syntax-reference-version: ${STUDIO_RUNTIME_SYNTAX_REFERENCE_VERSION:1.0.0}
      executor-version: ${STUDIO_RUNTIME_EXECUTOR_VERSION:1.0.0}
      playwright-version: ${STUDIO_RUNTIME_PLAYWRIGHT_VERSION:1.63.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:logback-spring.xml
  level:
    # Vertex AI SDK debug logging stays off outside the local profile (Story 10.5).
    com.google.cloud.vertexai: WARN
    com.google.api: WARN
    io.grpc: WARN
