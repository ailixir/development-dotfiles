<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Order</title></head>
<body><main>
<h1>Order summary</h1>
<p>Order status: <strong id="ostatus">Shipped</strong></p>
<label>Quantity <input id="qty" value="3"></label><br>
<label><input type="checkbox" id="gift" checked> Gift wrap</label><br>
<label>Delivery <select id="deliv"><option>Standard</option><option selected>Express</option></select></label><br>
<p>Total: <span id="total">$42.00</span></p>
<p id="stockwarn" style="display:none">Out of stock</p>
<label><input type="checkbox" id="terms"> Terms</label><br>
<a href="/track">Track parcel</a><br>
<button id="apply">Apply code</button> <button id="addnote">Add note</button> <button id="confirm">Confirm order</button>
<p id="dmsg" role="status"></p>
<div id="notebox" style="display:none"><label>Note <textarea id="note"></textarea></label></div>
</main>
<script>
document.getElementById('apply').addEventListener('click',function(){document.getElementById('dmsg').textContent='Discount applied';});
document.getElementById('addnote').addEventListener('click',function(){document.getElementById('notebox').style.display='block';});
</script>
</body></html>
