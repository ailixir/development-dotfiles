<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Settings</title></head>
<body><main>
<h1>Account closed</h1>
<p id="status">Status: Suspended</p>
<label>Display name <input id="name" value="Bob"></label><br>
<label><input type="checkbox" id="notify"> Email notifications</label><br>
<label>Language <select id="lang"><option>English</option><option selected>French</option><option>German</option></select></label><br>
<button id="save">Save</button> <button id="cancel">Cancel</button>
<p id="msg" role="status"></p>
</main>
<script>document.getElementById('save').addEventListener('click',function(){document.getElementById('msg').textContent='Error: please try again';});</script>
</body></html>
