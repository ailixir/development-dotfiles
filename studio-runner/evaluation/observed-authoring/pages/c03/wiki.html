<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wiki search</title></head>
<body>
<main><h1>Wiki</h1><form id="s"><label>Search Wikipedia <input name="q" type="search"></label><button type="submit">Search</button></form><p id="r" role="status"></p></main>
<script>
const rec=(type,fields)=>fetch('__event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,...fields}),keepalive:true});
const q=new URLSearchParams(location.search).get('q');if(q!==null)document.getElementById('r').textContent='Results for '+q;
document.getElementById('s').addEventListener('submit',async(e)=>{e.preventDefault();await rec('search.submit',{term:e.target.q.value});location.search='?q='+encodeURIComponent(e.target.q.value);});
</script>
</body>
</html>
