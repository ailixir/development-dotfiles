<!doctype html>
<!-- Controlled fixture page for the fixture-corpus tier. See home.html for the conventions. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checks — Sign in</title>
  </head>
  <body>
    <h1 role="heading" aria-level="1">Sign in</h1>
    <!--
      POST, not GET. Under the fake adapter of story 10.3 the method was invisible; under a real
      browser a GET form puts every field in the query string, so `flow-login`'s
      `toHaveURL('.../dashboard')` would never hold and the declared secret would be written into
      a URL — the one place architecture §9.2 is most emphatic it must not appear. The page is a
      controlled fixture for exactly this story (ADR-001 §3); the corpus is pinned and untouched.
    -->
    <form action="/dashboard" method="post">
      <p>
        <label for="username">Username</label>
        <input id="username" name="username" role="textbox" type="text" value="alice" />
      </p>
      <p>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          data-testid="password"
          role="textbox"
          type="password"
        />
      </p>
      <button role="button" type="submit">Sign in</button>
    </form>
  </body>
</html>
