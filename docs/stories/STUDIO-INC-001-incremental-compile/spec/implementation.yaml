# Implementation plan — STUDIO-INC-001-incremental-compile
# Spec Pipeline Phase 6 (Plan). Task: .aiox-core/development/tasks/plan-create-implementation.md
# Output path is spec/implementation.yaml per the lead's mission (overrides the task default plan/).

gate:
  result: APPROVED
  checkedAt: "2026-09-23"
  checkedBy: "@architect (Aria)"
  basis: >-
    critique-round2.json (NEEDS_REVISION, 3.98) listed three required fixes: CRIT-16, CRIT-17, CRIT-18.
    I checked spec.md iteration 3 (§3.2.1, §3.2.3, §3.2.4 rule 4a, §3.2.5, §5.2, §6.2, §6.3, §9) against
    the worktree code at 1f3c56a59. All three hold.
  checks:
    CRIT-16:
      verdict: HOLDS
      evidence: >-
        §3.2.5 step 2 is now in this order: (a) lock + idempotency, (b) non-throwing predicates, (c) exactly
        ONE Q1 outcome (ESCALATED_FULL or DISCARDED), (d) Q2 only in the ESCALATED_FULL branch. That matches
        the code fact that makes write order matter: recordOutcome is INSERT ... ON CONFLICT(request_id) DO
        NOTHING (CompileStateService.java:793-812). The spec also forbids throwing guards inside the
        transaction (requireCompilable :685 would roll back the DISCARDED row). EscalationCreationIT (1)(2) and
        AC-8/AC-8b assert "exactly one outcome row".
    CRIT-17:
      verdict: HOLDS
      evidence: >-
        Q2 gets a forced plan via persist(forcedPlan) and never reaches CompilationPlanner.plan (called
        unconditionally today at InferenceCaptureStore.java:135). Rule 4a is limited to
        escalated_from_request_id IS NULL. The transaction boundary is verified: captureForCompilation is
        REQUIRES_NEW (CompileStateService.java:94), capture is @Transactional (:122), and CompilePipeline.java
        has no @Transactional. escalateToFull (REQUIRED) is entered through the proxy from the executor thread,
        which has no transaction, and it self-invokes a private capture core, so everything is one
        transaction. The reason label changed from the critique's suggestion (ESCALATED_FULL + reasonDetail
        PREFIX_IMPACT instead of reason PREFIX_IMPACT). That is a recorded AUTO-DECISION traced to DEC-OQ2.4,
        and it still separates source MODEL from PRIOR_ESCALATION, which was the substance of the finding.
        It goes to GATE-C0 for sign-off.
    CRIT-18:
      verdict: HOLDS
      evidence: >-
        §3.2.3, §5.2, §9 B1 and AC-B1-1 now name both publish paths. Code confirms the gap the spec closes:
        CompilePipeline.java:266 -> publishAcceptedCandidate (:262) -> insertOrReuseRevision (:273), then the
        self-confirm UPDATE (:283). publishCandidate (:202) branches on requestIdentityAvailable() (:218), and
        insertCapturedRevision handles only ON CONFLICT (compile_request_id) (:873). The spec also closes the
        consequence it found: V24's uq_ui_test_revisions_identity would reject a byte-identical recompile, so
        the shared captured insert uses an untargeted ON CONFLICT DO NOTHING with request-id then identity
        reselect (INSERT_REVISION :58 already does this). V19's trg_ui_test_revision_require_request
        (db/cutover/V19:33-44) only rejects compile_request_id IS NULL, so B1 publications cannot trip it.
  nonBlockingFindings:
    - id: PLAN-N1
      note: >-
        Today's live compile does NOT capture. CompilePipeline.compile calls beginCompile directly (:157) and
        writes no ui_test_compile_requests row. Capture-for-all therefore changes compile() itself.
        StudioService.compileTest is @Transactional(NOT_SUPPORTED) (:609), so calling the REQUIRES_NEW
        captureForCompilation there cannot deadlock on the draft row lock. Subtask 2.6 records this.
    - id: PLAN-N2
      note: >-
        Capture writes deadline_at, so v1 compiles gain a real request deadline. boundPublicationStatements
        then stops taking its "historical pre-capture" early return (:829-831, "Historical pre-capture state-service callers") for v1 requests, and
        the sweeper and publishCandidate deadline predicates start to apply. The capture duration must equal
        the executor's attempt budget so v1 timing does not change. Covered by subtask 2.6 and AC-B1-1.
    - id: PLAN-N3
      note: >-
        CompileExecutor uses a SynchronousQueue with abort policy, so a thread is the "slot". An after-commit
        callback that runs on Q1's worker thread still holds Q1's slot, so submitting Q2 there can be refused
        (COMPILE_POOL_SATURATED) on a busy or 1-thread pool. §3.2.5 step 1 requires the slot to be released
        first. Q2 must be handed off after runAttempt returns (subtask 4.9, EscalationCreationIT (4)).
    - id: PLAN-N4
      note: >-
        Versioned (v2) capture throws INFERENCE_CUTOVER_REQUIRED until V19 is applied
        (CompileStateService.java:155-159). So B2's versioned ITs must apply V19 in the test schema (as
        InferenceMigrationIT already does). The 10.26 live harness (it calls /api/v2/studio) cannot produce
        evidence until B2 is deployed AND the V19 runbook is done. That puts V19 on the critical path to
        enablement.
    - id: PLAN-N5
      note: >-
        ESCALATED_FULL is now both a request OUTCOME (Q1) and a plan REASON (Q2). This is a vocabulary
        overload to confirm explicitly at GATE-C0 (C0-A2 iii).
    - id: PLAN-N6
      note: >-
        B2 changes the static prefix again: output-contract.md documents PREFIX_IMPACT, and the captured
        layout adds READ-ONLY locked steps. So PROMPT_VERSION advances a second time. That is harmless: no
        eligible v2 baseline can exist before B2 is enabled, and legacy revisions are never eligible
        (CON-7). OQ-10's "one invalidation" intent still holds in effect.

