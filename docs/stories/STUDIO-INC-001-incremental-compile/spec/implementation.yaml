stories:
  - key: A
    title: "Inference efficiency (ships without incremental)"
    phase: phase-1
    liveAffecting: true
    effort: "~3 person-days"
    valueStatement: >-
      Story A is worth shipping even if incremental compilation never ships. It restructures the one live
      model request every compile makes today. The request stops sending the global context once per step
      and sends it once. It puts the static contract and syntax reference first, in systemInstruction, so
      the prefix is byte-stable across tests. The response schema is built with a deterministic key order,
      so its bytes match across JVMs and replicas. The thinking level is sent explicitly and recorded in the
      fingerprint, instead of silently following the provider default. Usage is recorded completely:
      thoughts, cached, total and finish reason, with null (not 0) when a field is absent. That makes the
      cost paid today visible for the first time. Repair also carries the bounded, redacted rejected
      proposal instead of repairing blind. SAVINGS ARE UNMEASURED. No saving is claimed until SPK-01 shows
      what the R2D2 proxy forwards and returns, and the live 10.26 evaluation measures it. Implicit caching
      is not expected at all, because the static prefix (~2.3-2.7K tokens, inferred) is below the
      4,096-token minimum. MEDIUM is inferred, not verified, to equal today's default behaviour.
    dependsOn: [GATE-WORKTREE (soft; A touches no migration)]
    ships: "Before any v2 baseline exists (OQ-10). It advances PROMPT_VERSION once."
  - key: B1
    title: "Capture and data integrity"
    phase: phase-2
    liveAffecting: true
    label: "LIVE-AFFECTING, not dark"
    effort: "~5 person-days (Dara ~1.5, Dex ~2.5, Quinn ~1)"
    dependsOn: [A, GATE-WORKTREE]
    acceptance: [AC-B1-1, AC-B1-2, AC-B1-3, AC-B1-4, AC-B1-5, AC-13, AC-14 (unversioned + confirmVersioned rebase)]
  - key: RB-V19
    title: "V19 cutover runbook step"
    phase: phase-3
    liveAffecting: true
    effort: "~1 person-day plus an observation window for the before/after comparison"
    dependsOn: [B1 deployed on all replicas, GATE-V19-GO]
    note: "Forward-only. Can run in parallel with B2/C. Required before any v2 compile works and before the 10.26 harness can run (PLAN-N4)."
  - key: B2
    title: "Incremental planning and escalation (dark)"
    phase: phase-4
    liveAffecting: false
    effort: "~8 person-days"
    dependsOn: [B1 merged, GATE-C0]
    flags: {studio.compile.incremental.enabled: false, studio.authoring.v2-enabled: false}
  - key: C
    title: "v2 stack restore UX + InferenceStudio mount"
    phase: phase-5
    liveAffecting: false
    effort: "~5 person-days"
    dependsOn: ["B2 OpenAPI frozen (subtask 4.11); C can build on MSW once the contract merges"]
    flags: {studioAuthoringV2: false}

