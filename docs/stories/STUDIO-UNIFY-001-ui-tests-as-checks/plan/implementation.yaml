storySplit:
  recommendation: >-
    Four @sm stories, one per increment, each QA-gated and shippable on its own. Ids are suggestions; @sm owns
    them. No story files are created by this plan.
  stories:
    - {id: STUDIO-UNIFY-001.1, title: "Editor route, load by id, autorun once, Create Check UI Test, increment-1 removals", phase: phase-1}
    - {id: STUDIO-UNIFY-001.2, title: "UI test detail page; Runs page removed", phase: phase-2, dependsOn: [STUDIO-UNIFY-001.1]}
    - {id: STUDIO-UNIFY-001.3, title: "All Checks lists UI tests; Tests page and Studio nav removed", phase: phase-3, dependsOn: [STUDIO-UNIFY-001.2]}
    - {id: STUDIO-UNIFY-001.4, title: "D5 docs and leftovers", phase: phase-4, dependsOn: [STUDIO-UNIFY-001.3]}

phases:
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  - id: phase-1
    name: Increment 1 - editor by id, autorun once, Create Check UI Test, increment-1 removals
    description: >-
      - The editor moves to ui-tests/:id/studio and always loads by route id.
      - The no-id fallback, studio/:id, the bare studio route, navigationConfig, CreateTestDialog and the
        legacy picker are removed.
      - Every bare editor mount, including WCAG surfaces 3-7, moves to a route-id mount.
      - Autorun is consumed once at a bounded settle.
      - Create Check gains the UI Test form.
      - Dashboard and palette go to the Tests page, gated.
      FR-01-FR-06, FR-07 (breadcrumb, CSI), FR-08 (inc 1), FR-13 (editor), FR-24 (card, routes, entries),
      FR-25 (editor), FR-27 (inc 1), FR-28 (re-mount).
    stories: [STUDIO-UNIFY-001.1]
    linkWalkAtExit:
      - "Create Check UI Test -> ui-tests/{newId}/studio (replace)"
      - "Tests page row -> ui-tests/{id}/studio; Tests page and Runs page 'Create Test' -> /checks/create?type=UI_TEST"
      - "Runs page test link and drawer testHref -> ui-tests/{id}/studio"
      - "Schedule dialog run links (hosts: editor, Tests page) -> /checks/studio/runs/{executionId} (exists until phase 2)"
      - "Editor back and 'Open Tests' -> /checks/studio/tests; breadcrumb 'All Checks' -> /checks/all"
      - "Dashboard 'Open Checks Studio' and palette 'Studio' -> /checks/studio/tests, only when availability is 'on'"
      - "Sidebar Studio group -> Tests and Runs (both exist)"
      - "studio and studio/{id} -> catch-all to module home"
    risks:
      - "R1: load-by-id breaks the stream-closing switch (L654-690) or the SCEN-1 change detector (L705-717). Re-mounting the suites first (1.5-1.10) keeps them as the safety net before the fallback is removed (1.11)"
      - "R2: autorun consumption disturbs 'Run again' (L1667). A separate autorunRequest prop and its tests (1.12-1.13)"
      - "R14: earlier removals break links or tests mid-story. Link walk above, route test 1.21, gate 1.33"
    rollback: Revert the phase-1 commits. Frontend only, with no data or contract change.
    subtasks:
      - id: "1.1"
        description: Capture the pre-change baseline (initial bundle size, WCAG guard state) for later comparisons
        service: infra
        files: [docs/stories/STUDIO-UNIFY-001-ui-tests-as-checks/implementation/baseline.json]
        verification:
          type: command
          command: pnpm run build && pnpm exec vitest run src/test/a11y/studioWcagAudit.test.tsx && git diff --exit-code -- ../docs/qa/accessibility/axe-results.json
        status: pending
        dependencies: []
        coverage: [NFR-02, FR-28]
        notes: >-
          Record the entry-asset byte sizes from the production build and the axe-results.json sha256. If
          axe-results.json already differs from HEAD, stop and report the pre-existing drift.

      - id: "1.2"
