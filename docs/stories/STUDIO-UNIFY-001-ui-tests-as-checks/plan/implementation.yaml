verificationConventions:
  workingDirectory: frontend/
  packageManager: pnpm only (never npm or yarn)
  narrowest: >-
    pnpm exec vitest run <files>, pnpm exec eslint <files>, pnpm run type-check (tsc has no narrower mode), and
    the specific Playwright spec with --project=msw where E2E entry points change. pnpm run lint (whole src)
    runs only at phase gates.
  wcagGuard: >-
    pnpm exec vitest run src/test/a11y/studioWcagAudit.test.tsx rewrites docs/qa/accessibility/axe-results.json
    in afterAll (L243-260). The file has no timestamp, so git diff on it shows whether the baseline moved.
    A moved baseline is never committed silently. Its reason is recorded in
    docs/qa/accessibility/studio-wcag-audit.md in the same increment (ADR-SC-006,
    .claude/rules/accessibility-scope.md). No surface is ever added.
  e2eMsw: pnpm exec playwright test --project=msw <spec>
  e2eRealBackend: >-
    CHECKS_E2E_REAL_BACKEND=1 pnpm exec playwright test --project=real-backend e2e/studio-authoring-real-backend.spec.ts
    (needs a running backend; manual, conditional).
  removedRouteScans:
    principle: >-
      The scans match route strings only, never module import paths. Imports such as
      '@/components/studio/runs/RunRow' contain "/studio/runs" (CRIT-19), so a bare substring scan can never
      pass. Every scan is anchored on one of three things:
      - "/checks/studio" (no import path contains "/checks/");
      - a quote, backtick or "}" directly before "/studio/..." (a route literal or a template-built path);
      - App.tsx's path="studio...".
      API client strings ('/studio/tests', '/studio/executions/...') are never matched, because the scans only
      look for /checks/studio, /studio/runs (the API has no such path), the test-local /studio/tests/:id route
      shape and path="studio". Line-level exclusion: guidedNarratives.ts L59 cites the Java package path
      backend/.../com/citi/put/checks/studio and is filtered by "citi/put/checks/studio".
    S1:
      usedBy: "1.33"
      purpose: No bare /checks/studio, /checks/studio/:id, /checks/studio/{id}, test-local /studio/tests/:id or no-id '/studio' route, and no path="studio" or path="studio/:id"
      command: >-
        ! (grep -rn "/checks/studio" src e2e | grep -v "citi/put/checks/studio" | grep -vE "/checks/studio/(tests|runs)([^A-Za-z0-9_]|$)")
        && ! grep -rnE "['\"\`]/studio/tests/:id|path: '/studio'|path=\"studio(/:id)?\"" src e2e
      dryRun2026-10-23: >-
        Dry-run on 2026-10-23: 25 lines. The command exits 1, which is expected before phase 1. Every line is owned by a phase-1 subtask:
        - navigationConfig.ts L28 (1.22)
        - navigationSetup.ts L75 (1.23)
        - CommandPalette.tsx L16 and DashboardPage.tsx L753 (1.24)
        - testListPresentation.ts L69 (1.16)
        - ChecksLayout.tsx L85 (1.22)
        - LayoutProvider.tsx L70, made explicit in 1.22
        - ChecksStudioPage.tsx L694 comment (1.11, CRIT-20)
        - StudioRunsPage.test.tsx L107, L274 (1.19)
        - StudioTestsPage.test.tsx L228, L273, L422 (1.17)
        - studio-variables.spec.ts L104, L174, L233, L234 and studio-guided.spec.ts L185 (1.31)
        - App.tsx L110, L114, L139, L143 (1.21)
        - pageGuidedRun.test.tsx L1015 (1.8)
        - studioRunTransport.node.test.tsx L170, L174 (1.9)
        Lines that hold an allowed /checks/studio/tests or /checks/studio/runs reference pass.
    S2:
      usedBy: "2.18"
      purpose: No studio/runs route string remains (federated, standalone, template-built, or App path)
      command: >-
        ! grep -rnE "/checks/studio/runs|[}'\"\`]/studio/runs|path=\"studio/runs" src e2e
      dryRun2026-10-23: >-
        Dry-run on 2026-10-23: 24 lines, none of them an import (checked: 0 lines starting with 'import'). The command exits 1, which is expected before phase 2. Every line is owned:
        - App.tsx L112-113, L141-142 (2.9)
        - navigationSetup.ts L30, L73 and ChecksLayout.tsx L87 (2.14)
        - StudioScheduleDialog.test.tsx L145, L234, L252 (2.11)
        - scheduleProvenance.test.tsx L20-21 (2.16)
        - StudioScheduleDialog.tsx L28 (1.14)
        - runSnapshots.test.ts L49-51 (2.15) and L52-53 (1.18)
        - runLinks.ts L9 and the L12 comment (2.15)
        - StudioRunsPage.test.tsx L28, L105-106, L175 (deleted in 2.13)
        It matches none of the 17 '@/components/studio/runs/...' import lines that the revision-2 pattern hit.
    S3:
      usedBy: ["3.20", "4.7"]
      purpose: No /checks/studio reference of any kind, no studio/runs literal, no test-local old route shape, and no path="studio..." in App.tsx
      command: >-
        ! (grep -rn "/checks/studio" src e2e | grep -v "citi/put/checks/studio")
        && ! grep -rnE "path=\"studio|[}'\"\`]/studio/runs|['\"\`]/studio/tests/:id|path: '/studio'" src e2e
      dryRun2026-10-23: >-
        Dry-run on 2026-10-23: the first half matches 50 lines in 18 files, the second half 21 lines; 0 import lines; the command exits 1, which is expected before phase 3. All of them are
        owned by phases 1-3: the S1 and S2 lines, plus the allowed tests/runs references that phase 3 removes
        (ChecksLayout L86, LayoutProvider L70, navigationSetup L19-33 and L74, ChecksStudioPage L1061 and
        L1194, harness.spec.ts L57, L94, L142, ChecksLayout.a11y.test.tsx L45, StudioScheduleDialog.test.tsx
        L27 and L233, real-backend spec L128). The second half matches the App.tsx route lines and the S1/S2
        test-local lines. All are expected before phase 3.
    S4:
      usedBy: "4.1"
      purpose: Leftover scan (S3 plus the names of every removed module)
      command: >-
        ! (grep -rnE "/checks/studio|path=\"studio|[}'\"\`]/studio/runs|['\"\`]/studio/tests/:id|path: '/studio'|CreateTestDialog|StudioTestsPage|StudioRunsPage|StudioListLayout|useUrlListState|useStudioTests|navigationConfig|UiTestConfig|LAST_RUN_FILTER_LABELS" src e2e
        | grep -v "citi/put/checks/studio")
      dryRun2026-10-23: >-
        Dry-run on 2026-10-23: hits in 40 files (the S3 files plus the module-name files); 0 import lines; the command exits 1, which is expected before phase 4. Each module-name file is deleted or edited in phases 1-3: App.tsx, ReviewStep, the UiTestConfig trio, the StudioListLayout pair,
