# ─────────────────────────────────────────────────────────────
# Drafting order for @sm (respects depends_on DAG)
# ─────────────────────────────────────────────────────────────
sm_draft_queue:
  - wave: 0
    parallel: ["2.1", "2.2"]
    rationale: "Schedules context + TCP executor are independent — run in parallel."

  - wave: 1
    parallel: ["2.3"]
    after: ["2.1"]
    rationale: "Cron dispatcher depends on schedules context."

  - wave: 2
    parallel: ["2.4"]
    after: ["2.3"]
    rationale: "ShedLock wraps the cron dispatcher."

  - wave: 3
    parallel: ["2.5"]
    after: ["2.4"]
    rationale: "Partition scheduler uses ShedLock."

  - wave: 4
    parallel: ["2.6"]
    after: ["2.5"]
    rationale: "Retention pruning depends on partition scheduler."

  - wave: 5
    parallel: ["2.7", "2.8"]
    after: ["2.6"]
    rationale: "Worker profile depends on all schedulers being in place. Drift fix is independent but same wave for batching."

