epic_id: EPIC-02
milestone: M2
title: "Scheduling + TCP executor + app-managed partitions"
status: planning                  # planning | in_progress | completed | paused
created_at: "2026-04-18"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  Checks can be scheduled to run on a cron cadence with timezone awareness.
  TCP port checks are supported alongside HTTP. Execution result partitions
  are self-maintaining — the app creates future monthly partitions and prunes
  old ones. ShedLock prevents multi-pod DDL races from M2 onward.

definition_of_done:
  - "All 8 stories reach Done via SDC cycle."
  - "`./gradlew check` green — all M1 + M2 tests passing."
  - "Scheduled HTTP + TCP checks run and persist execution results."
  - "`/actuator/health/partitions` returns DOWN if the +3-day partition is missing."
  - "ShedLock prevents partition DDL races in 2-replica staging."
  - "Retention pruning (DETACH CONCURRENTLY + DROP) tested with old partitions."
  - "OpenAPI snapshot updated with /schedules endpoints."
  - "Frontend `VITE_DISABLE_MSW_DOMAINS` extended to include `schedules`."

