epic_id: EPIC-01
milestone: M1
title: "Walking skeleton — CSI + Checks CRUD + HTTP executor + BFF auth"
status: completed               # planning | in_progress | completed | paused
created_at: "2026-04-17"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  End-to-end vertical slice FE→BE proving the full stack works together.
  Frontend points VITE_API_URL at http://localhost:8080, disables MSW for
  /csi, /checks, and HTTP check execution, and the application works against
  the real backend. Every architectural layer is exercised: controller →
  service → JPA → Postgres → Flyway → BFF session auth (Core introspection)
  → observability.

definition_of_done:
  - "All 17 stories reach Done via SDC cycle (@sm → @po → @dev → @qa → @devops)."
  - "`./gradlew check` green on a clean checkout (Spotless + Checkstyle + SpotBugs + JaCoCo 80%)."
  - "Zonky embedded PG (local) and Testcontainers-PG (CI) both green."
  - "Frontend standalone + federated modes work against localhost:8080 with the relevant MSW handlers disabled."
  - "RDS-parity lint active in CI and blocks any migration using SUPERUSER/ALTER SYSTEM/non-allowlisted extensions."
  - "OpenAPI snapshot committed at docs/specs/backend/openapi.yaml; diff test green."
  - "Two external contracts signed: (1) BFF identity with Core team (story 1.4), (2) JWT claim stub schema for dev [not applicable — superseded by DEBT-04]."
  - "R-08 risk retired (BFF identity contract) and R-06 retired (RDS-parity lint)."

