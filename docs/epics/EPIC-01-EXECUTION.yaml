# ─────────────────────────────────────────────────────────────
# Drafting order for @sm (respects depends_on DAG, prioritizes unblocking)
# ─────────────────────────────────────────────────────────────
sm_draft_queue:
  # Wave 0 — parallel external-touchpoint kickoff (no code deps)
  - wave: 0
    parallel: ["1.1", "1.4"]
    rationale: "1.1 scaffold + 1.4 Core team engagement run in parallel; neither blocks the other and 1.4 is an async platform-team touchpoint that benefits from starting first."

  # Wave 1 — DB + lint (can run once 1.1 lands)
  - wave: 1
    parallel: ["1.2"]
    after: ["1.1"]

  - wave: 2
    parallel: ["1.3"]
    after: ["1.2"]
    rationale: "RDS-parity lint should land immediately after V1 migration so no future migration slips past it."

  # Wave 3 — security foundation (requires 1.1 scaffold + 1.4 contract)
  - wave: 3
    parallel: ["1.5"]
    after: ["1.1", "1.4"]
    rationale: "Security is the critical-path gate for most downstream work."

  # Wave 4 — foundational contexts (parallel after 1.5 + 1.2)
  - wave: 4
    parallel: ["1.6", "1.7", "1.8", "1.15"]
    after: ["1.5", "1.2"]
    rationale: "users, csi, async infra, rate limiting are independent — run 4-wide if staffing allows."

  # Wave 5 — checks context (largest story; may split)
  - wave: 5
    parallel: ["1.9"]
    after: ["1.2", "1.5", "1.7"]

  # Wave 6 — executor + persistence + execute endpoint
  - wave: 6
    parallel: ["1.10"]
    after: ["1.9"]

  - wave: 7
    parallel: ["1.11"]
    after: ["1.2", "1.10"]

  - wave: 8
    parallel: ["1.12"]
    after: ["1.10", "1.11"]

  # Wave 9 — idempotency + bulk (sequential)
  - wave: 9
    parallel: ["1.13"]
    after: ["1.12"]

  - wave: 10
    parallel: ["1.14"]
    after: ["1.13"]

  # Wave 11 — epic-integration (OpenAPI diff + FE cutover)
  - wave: 11
    parallel: ["1.16", "1.17"]
    after: ["1.7", "1.9", "1.10", "1.12", "1.14", "1.15"]
    rationale: "Last two stories prove the epic end-to-end: 1.16 locks the contract, 1.17 proves FE-BE integration."

