# ─────────────────────────────────────────────────────────────
# SDC cycle reference (per story)
# ─────────────────────────────────────────────────────────────
sdc_cycle_per_story:
  - phase: draft
    owner: "@sm (River)"
    command: "*draft {story_id}"
    input: "This epic's story entry + spec.md sections + implementation.yaml story"
    output: "docs/stories/{story_id}.story.md (status: Draft)"

  - phase: validate
    owner: "@po (Pax)"
    command: "*validate-story-draft {story_id}"
    input: "Draft story"
    output: "Validation verdict (GO >=7 or NO-GO with required fixes)"
    decision: "GO → status: Ready. NO-GO → @sm revises."

  - phase: implement
    owner: "@dev (Dex)"
    command: "*develop-story {story_id}"
    modes: ["Interactive", "YOLO", "Pre-Flight"]
    coderabbit: "Self-healing max 2 iterations"
    output: "Code + tests + updated File List in story"
    decision: "status: InProgress → InReview"

  - phase: qa_gate
    owner: "@qa (Quinn)"
    command: "*qa-gate {story_id}"
    checks: 7
    output: "PASS / CONCERNS / FAIL / WAIVED"
    decision: "PASS → status: Done. CONCERNS/FAIL → back to @dev."

  - phase: push
    owner: "@devops (Gage)"
    command: "*push"
    output: "commit + branch + PR (if user approves)"
    note: "Push is EXCLUSIVE to @devops — other agents cannot push to remote."

