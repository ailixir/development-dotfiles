    rationale: "Health indicators depend on retry mechanism existing to report on."

# ─────────────────────────────────────────────────────────────
# Risk tracking
# ─────────────────────────────────────────────────────────────
risks:
  - risk_id: R-06
    description: "Converting existing non-partitioned tables to partitioned requires data migration"
    status: open
    mitigation: "Story 6.2 handles empty-table case (no production data yet). If data exists, use pg_dump/restore."

  - risk_id: R-07
    description: "Parallel dispatch in CronDispatcher may change execution ordering semantics"
    status: mitigated_by_design
    mitigation: "Ordering within a batch was never guaranteed. ShedLock + semaphore preserve correctness."

