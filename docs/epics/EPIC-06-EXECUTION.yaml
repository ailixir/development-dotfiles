epic_id: EPIC-06
milestone: M4
title: "Processing reliability & scalability hardening"
status: planning
created_at: "2026-05-12"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  Close all critical and high-priority gaps in the processing and scalability
  architecture identified by the Spec Pipeline review. After this epic:
  — Failed scheduled executions and report deliveries are retried with backoff.
  — All three execution tables are range-partitioned with DEFAULT safety nets.
  — CronDispatcher dispatches in parallel within a batch.
  — applicationTaskExecutor is bounded to prevent resource exhaustion.
  — Resilience4j circuit breaker and report email delivery are integration-tested.
  — Dispatch failures surface via health indicators and alerting-ready metrics.

definition_of_done:
  - "All 6 stories reach Done via SDC cycle."
  - "`./gradlew check` green — all M1-M4 tests passing."
  - "Failed scheduled dispatches retry up to 3 times with exponential backoff."
  - "Report delivery retries on transient failure instead of advancing past it."
  - "`ui_test_executions` and `report_executions` are range-partitioned."
  - "DEFAULT partitions exist as safety nets on all 3 partitioned tables."
  - "CronDispatcher dispatches batch items in parallel within semaphore bounds."
  - "`applicationTaskExecutor` is semaphore-bounded."
  - "Circuit breaker behavior integration-tested with WireMock."
  - "Report email delivery integration-tested with GreenMail."
  - "Dispatcher health indicator reports UP/DOWN for consecutive failures."

