epic_id: EPIC-03
milestone: M3
title: "Mock-to-API Migration — replace MSW mock layer with real backend endpoints"
status: planning                  # planning | in_progress | completed | paused
created_at: "2026-04-27"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  Every frontend API call currently intercepted by MSW mock handlers is replaced
  with a real call to the Spring Boot backend at /api/v1. Missing backend endpoints
  are built. The MSW layer is removed once all domains are wired. The app runs
  end-to-end with real data flowing through PostgreSQL.

definition_of_done:
  - "All 14 stories reach Done via SDC cycle."
  - "`VITE_ENABLE_MSW=false` — app boots and all features work against real backend."
  - "No MSW handler, mockData, or inlineMockAdapter files remain in the codebase."
  - "Frontend type-checks clean (`npm run type-check`)."
  - "`./gradlew check` green — all M1 + M2 + M3 tests passing."
  - "Dev proxy configured: `npm run dev` forwards /api/v1 to localhost:8080."
  - "Pagination, auth, and error handling work end-to-end in browser."

# ─────────────────────────────────────────────────────────────
# Complexity assessment (Spec Pipeline Phase 2)
# ─────────────────────────────────────────────────────────────
complexity:
  scope: 5          # 50+ files across FE services, stores, components; 8 mock domains; 6+ new BE controllers
  integration: 4    # Auth model (BFF cookie), async execution polling, pagination format change
  infrastructure: 3 # API base URL migration, env vars, dev proxy
  knowledge: 3      # Deep understanding of both FE mock contracts and BE DTOs
  risk: 4           # Breaking all FE functionality if migration not incremental
  total: 19         # COMPLEX — phased execution with revision cycle
  class: COMPLEX

# ─────────────────────────────────────────────────────────────
# Key technical decisions
# ─────────────────────────────────────────────────────────────
decisions:
  - id: D-01
    decision: "Change FE apiBaseUrl from /api to /api/v1; update all MSW handler paths to /api/v1/* for transparent cutover"
    rationale: "Single URL space eliminates dual-path bugs. MSW intercepts /api/v1/... while enabled; real backend serves same paths when MSW domain is disabled."

  - id: D-02
    decision: "Add response normalization adapter: Spring Page envelope (page/size/totalElements) → FE ApiResponse (page/limit/total)"
    rationale: "FE expects 1-based page + 'total' + 'limit'. BE returns 0-based page + 'totalElements' + 'size'. Adapter in apiClient keeps all slices unchanged."

  - id: D-03
    decision: "Vite dev proxy for /api/v1 → http://localhost:8080/api/v1; Webpack proxy for same"
    rationale: "Enables same-origin dev calls. No CORS issues. MSW domain-disable falls through to proxy transparently."

  - id: D-04
    decision: "Incremental migration via VITE_DISABLE_MSW_DOMAINS — enable per-domain as each story completes"
    rationale: "Existing mockMode.ts already supports this. Comment in .env.development documents cutover sequence: M3.1=foundation, then domain-by-domain."

  - id: D-05
    decision: "Execution polling: FE implements exponential-backoff poll after 202 Accepted (replace synchronous mock)"
    rationale: "Backend returns 202 + executionId. FE polls GET /checks/{checkId}/history until terminal status."

