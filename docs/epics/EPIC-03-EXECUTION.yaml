# ─────────────────────────────────────────────────────────────
# Risk tracking
# ─────────────────────────────────────────────────────────────
risks:
  - risk_id: R-10
    description: "Pagination format mismatch breaks existing FE components"
    status: mitigated_by_design
    mitigation: "Response normalization adapter in story 3.1 translates Spring Page → FE ApiResponse transparently."

  - risk_id: R-11
    description: "Async execution (202) breaks FE components expecting synchronous result"
    status: mitigated_by_design
    mitigation: "Story 3.2 introduces polling utility. checksSlice executeCheck thunk wraps the poll loop."

  - risk_id: R-12
    description: "Missing BE endpoints block FE features"
    status: accepted
    mitigation: "MSW remains enabled per-domain until BE endpoints built. Domain-disable toggles allow incremental cutover."

  - risk_id: R-13
    description: "Cookie auth requires BFF session — local dev needs proxy to Core service mock"
    status: open
    mitigation: "Story 3.5 addresses: dev profile skips Core introspection with a static UserIdentity."

