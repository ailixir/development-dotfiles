# ─────────────────────────────────────────────────────────────
# Drafting order for @sm (respects depends_on DAG)
# ─────────────────────────────────────────────────────────────
sm_draft_queue:
  - wave: 1
    parallel: ["4.4a", "4.4b", "4.4e"]
    rationale: "Schema migration, resolver, and mail sender are independent foundations."

  - wave: 2
    parallel: ["4.4c"]
    after: ["4.4a", "4.4b"]
    rationale: "Lifecycle hooks depend on column + resolver."

  - wave: 3
    parallel: ["4.4d", "4.4f"]
    after: ["4.4c", "4.4e"]
    rationale: "Dispatcher and delivery service can be developed in parallel once dependencies are met."

  - wave: 4
    parallel: ["4.4g"]
    after: ["4.4d", "4.4e", "4.4f"]
    rationale: "Integration tests require all components."

# ─────────────────────────────────────────────────────────────
# Risk tracking
# ─────────────────────────────────────────────────────────────
risks:
  - risk_id: R-10
    description: "Enterprise SMTP relay unavailable or rate-limited"
    status: open
    mitigation: "@ConditionalOnProperty on ReportMailSender — graceful degradation when SMTP not configured. Rate limiting via batch-size + poll interval."

  - risk_id: R-11
    description: "Large report rendering causes OOM or timeout"
    status: open
    mitigation: "Batch size limited to 50. Individual report rendering timeout should be capped (future story). lockAtMostFor=10m gives headroom."

