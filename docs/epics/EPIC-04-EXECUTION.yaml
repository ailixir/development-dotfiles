epic_id: EPIC-04
milestone: M4
title: "Report scheduled delivery via SMTP"
status: completed                 # planning | in_progress | completed | paused
created_at: "2026-04-28"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  Reports are automatically delivered to recipients at their configured
  schedule (daily, weekly, custom cron) via the enterprise SMTP relay.
  The delivery pipeline resolves check data, renders HTML, sends email,
  and persists a full audit trail per delivery attempt. Maria's UC
  (PRD §6) completes end-to-end.

definition_of_done:
  - "All 7 stories reach Done via SDC cycle."
  - "`./gradlew check` green — all M1 + M2 + M3 + M4 tests passing."
  - "A report with status=active and a daily schedule receives an email on the next poll tick."
  - "`report_executions` table tracks every delivery with status, duration, recipient count, and rendered HTML."
  - "Paused reports are NOT delivered (nextDeliveryAt = null)."
  - "GreenMail IT proves end-to-end: poll → resolve → render → SMTP → audit."
  - "Worker profile loads ReportDeliveryDispatcher; API profile does not."

