  - id: "7.2"
    title: "Non-blocking dispatch — fire-and-forget with backpressure"
    size: L
    wave: 2
    depends_on: ["7.1"]
    blocks: ["7.3"]

  - id: "7.3"
    title: "Graceful shutdown + transaction ordering + operational fixes"
