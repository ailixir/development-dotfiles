epic_id: EPIC-07
milestone: M4
title: "Capacity hardening — dispatch throughput, execution concurrency, resilience"
status: planning
created_at: "2026-05-13"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  The scheduling and execution pipeline handles the documented peak workload
  (1,500 executions/minute, ~100 concurrent, 250 with headroom) with 2× safety
  margin. Dispatch throughput reaches 3,000/min, execution slots are decoupled
  from the DB connection pool, per-source concurrency caps prevent starvation,
  and the system shuts down gracefully during rolling deployments.

definition_of_done:
  - "All stories reach Done via SDC cycle."
  - "`./gradlew check` green — all existing + new tests passing."
  - "CronDispatcher achieves 3,000 dispatches/min with batch=500, poll=10s."
  - "Execution concurrency decoupled from Hikari pool — configurable independently."
  - "Per-source concurrency caps prevent slow integrations from starving fast checks."
  - "Graceful shutdown drains in-flight executions within 30s."
  - "E2E integration test covers full dispatch→execute→persist→trigger pipeline."

# ─────────────────────────────────────────────────────────────
# Stories
# ─────────────────────────────────────────────────────────────
stories:
