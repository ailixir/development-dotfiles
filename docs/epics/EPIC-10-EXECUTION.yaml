# ─────────────────────────────────────────────────────────────
# File-ownership conflicts (wave planning must serialize or single-own)
# ─────────────────────────────────────────────────────────────
file_ownership_conflicts:
  - id: FOC-01
    path: "backend/src/main/resources/db/migration"
    stories: ["10.1", "10.4"]
    wave: 1
    conflict: "Both stories add forward-only Flyway migrations in the same directory in the same wave; parallel work collides on version ordering."
    mandated_ordering: "10.4 creates ui_test_revisions; the 10.1 migration that adds the immutable revision reference to execution history must be versioned after it."
    source: "Epic 10 §10.1 closing note — 'Revision table integration follows 10.4; preserve a migration dependency between the two where required.' Architecture §8.1 (forward-only migrations; execution history carries an immutable revision reference)."
    resolution_options:
      - "Serialize inside W1: 10.4 lands its migration first; 10.1 lands its revision-reference migration after. 10.1's non-migration work (OpenAPI/JSON-schema contract, DTOs, MSW fixtures) proceeds in parallel."
      - "Assign one owner to both stories for this directory."
    resolution: "TBD at wave-1 planning. Story-level depends_on left as the epic index states (both: none)."

  - id: FOC-02
    path: "studio-runner/ package root (package.json, package-lock.json, Dockerfile, vitest.fixtures.config.ts) and fixtures/reference/"
    stories: ["10.2", "10.3"]
    wave: 1
    conflict: "10.2 creates the studio-runner/ scaffold (task T-10.2.0, per ADR-001); 10.3 adds the pin check, fixture-tier config and reference manifest to the same root files and fixtures directory."
    mandated_ordering: "10.2 T-10.2.0 (scaffold) lands before any 10.3 change; 10.3 unit-tier work may proceed on top of the scaffold branch."
    source: "ADR-001 §3, §7; story drafts 10.2 (T-10.2.0) and 10.3 (Implementation Notes). Recorded by @po 2026-09-10 as epic context tracking."
    resolution_options:
      - "Serialize inside W1: land T-10.2.0 as the first 10.2 PR, then start 10.3."
      - "Assign one owner to both runner stories."
    resolution: "TBD at wave-1 planning. Story-level depends_on left as the epic index states (both: none)."

  - id: FOC-03
    path: "backend/src/main/java/com/citi/put/checks/studio/StudioService.java (382 lines) and StudioController.java (150 lines)"
    stories: ["10.7", "10.8"]
    wave: 3
    conflict: >-
      Both stories rewrite the execute acceptance path in the same wave. 10.7 replaces
      StudioService.executeTest wholesale (its own javadoc defers to 10.7) and adds CSI
      permission enforcement plus the events route to every method on StudioController;
      10.8 adds POST /tests/{id}/compile to the same controller and, in the same service,
      commit-then-enqueue on create/update plus the ExecutionReadinessService consultation
      before acceptance. Parallel work collides textually on both files, and — the reason
      this matters beyond merge noise — if 10.8 lands first, 10.7 deletes its readiness
      wiring and restores it by hand. 10.8 AC-26 requires the gate to be unconditional and
      unskippable; a hand-restored merge is exactly how such a gate goes missing without
      anyone noticing.
    mandated_ordering: >-
      10.7a (durable dispatch, 10.7 AC-1..AC-27) lands on both files first, because it
      carries the acceptance transaction and declares the ExecutionReadiness seam. 10.8
      then lands T-10.8.1 (compile route, commit-then-enqueue) and T-10.8.7 (readiness
      injection) on top. 10.7b (recovery) and 10.7c (SSE) touch neither file and may land
      in any order after 10.7a. Every other 10.8 task starts immediately and in parallel:
      the compile package, prompt assembly, authoring limits, credential screen,
      canonicalizer, diagnostics bounder, the /v1/validate client,
      ExecutionReadinessService itself and the no-runtime-LLM gate share no file with 10.7.
      Seam shape is fixed so the two stories cannot produce two readiness types: 10.7a
      declares the interface ExecutionReadiness with a provisional confirmed_revision_id
      implementation; 10.8 supplies ExecutionReadinessService against that same interface
      and deletes the provisional one; the acceptance path is wired to the interface.
    source: >-
      Story 10.8 draft, Implementation Notes "Seams to watch" and Open question 1, which
      flagged that the manifest recorded no wave-3 conflict. Story 10.7 AC-8a (the seam
      10.8 replaces) and AC-4a (permission enforcement on every StudioController route).
      Story 10.7 draft Split hint (10.7a/b/c at the snapshot_revision seam). Verified on
      branch epic/EPIC-10 2026-09-11: StudioService 382 lines, StudioController 150 lines,
      zero @PreAuthorize annotations on the controller. Ruled and recorded by @po
      2026-09-11 during wave-3 story validation.
    resolution_options:
      - "Serialize on the two shared files: 10.7a first, then 10.8's controller/service wiring. 10.8's compile package proceeds in parallel from day one."
      - "Assign one owner to both stories for the execute path."
      - "Fold 10.8's readiness gate into 10.7 and reduce 10.8 to the compile pipeline."
    resolution: >-
      SERIALIZE (option 1), and 10.7's three-way split is MANDATED rather than hinted so
      that 10.7a is a nameable landing point. Single ownership (option 2) was rejected:
      10.7 is the largest story in the epic at 47 criteria and 13 tasks and is itself
      being split, so merging the two would build one unreviewable change out of two
      reviewable ones. Option 3 was rejected because 10.8 AC-22/AC-23 — the predicate that
      settles 10.4 ISSUE-003 and the three de-ready cases that defend it — is the reason
      10.8 exists; moving it into 10.7 would separate the predicate from the pipeline whose
      failures produce the de-ready state, and 10.8's own split hint records that AC-23 is
      only provable when both land together. Without the mandated split, serialization
      would queue 10.8's gate behind 10.7's SSE and reapers for no reason, which is what
      makes the split a prerequisite of this resolution rather than a separate decision.
    note: >-
      Story 10.12 is runner-only and shares nothing with either. Checked, not assumed:
      10.12 touches only studio-runner/**; 10.7 names "any change to studio-runner/" in its
      Out-of-scope and its File List states no runner change is expected. The one file that
      would have collided was docs/specs/studio/openapi.yaml — 10.7 AC-1 closes
      AdmissionResponse and the callback response bodies (ADR-002 O-4) and removes three
      x-not-yet-implemented markers, and 10.12's draft AC-13 proposed adding
      recordingOriginMs to RunnerReport. ADR-002 section 11 rejected that field on
      2026-09-11, so 10.12 now makes no contract edit and the overlap is gone. Two
      read-only couplings remain and need no serialization: 10.7 AC-40 requires the runner
      suite to stay green against the amended document, and 10.12 AC-17 reads the API's
      ExecutionErrorCode enumeration for its disjointness test — 10.12 AC-17 has been
      corrected to read that enumeration rather than a hardcoded list, because 10.7 AC-13a
      adds AUTHORIZATION_REVOKED and REFERENCE_UNAVAILABLE in this same wave.

  - id: FOC-04
    path: "docs/specs/studio/openapi.yaml — and studio-runner/test/run/confinement.test.ts, which pins its SHA-256"
    stories: ["10.9", "10.13"]
    wave: 4
    conflict: >-
      The two wave-4 stories are otherwise genuinely disjoint — 10.9 is backend Java, SQL and
      application.yml; 10.13 is studio-runner TypeScript — and that was checked file by file
      rather than assumed. One artefact is shared and it is not a merge-noise conflict, it is a
      false red. 10.9 AC-2 removes x-not-yet-implemented from confirmCompile, the single edit it
      makes to openapi.yaml. 10.13 AC-18 asserts that document byte-unchanged by pinning its
      SHA-256 in a literal constant, BASE_SHA256, in test/run/confinement.test.ts. Any 10.9 edit
      therefore turns a 10.13 test red in a story that made no contract edit, and the failure
      accuses the wrong story. The pin is ALSO already red on the branch before either story
      starts: verified 2026-09-11, the constant holds 6a20513c496208ffbc0d9c886b013861ae953d2aa
      50d14b529092a9a24f7157a from base commit a8a8eeb44, while the document now hashes to
      815aae9b0068335e8d5ab5270dccecac4d1fd6f472306ca3dc04292187dd0d80 after the ADR-002 §14,
      §15, §16 and §17 amendments. Those amendments landed as architect rulings rather than in a
      story PR, so the re-anchor the test's own comment calls for was never owned by anyone.
    mandated_ordering: >-
      10.9 lands its openapi.yaml marker removal FIRST. 10.13 then re-anchors BASE_SHA256
      against the resulting document, in its own PR, as a deliberate act, with a comment naming
      the four ADR-002 amendments and 10.9's removal as what the new digest covers — and it
      re-reads the digest from the file rather than transcribing one from a story or from this
      manifest. The reverse order is forbidden: it would force a backend PR whose subject is the
      confirm route to re-anchor a runner test, which is exactly what confinement.test.ts's own
      comment rules out ("It must never be re-anchored in a PR whose subject is something
      else"). No other serialization is needed — every other file in both stories is disjoint,
      and 10.13's re-anchor is one constant, so 10.9's marker removal is the only wave-4 landing
      point 10.13 has to wait behind. Both stories start in parallel on day one; only
      T-10.13.10 waits.
    source: >-
      Story 10.9 AC-2 and its File List; story 10.13 AC-18 and its "Must remain unchanged"
      table; studio-runner/test/run/confinement.test.ts lines 114-131 (BASE_SHA256 and the
      comment governing re-anchoring); ADR-002 §12 (Class A marker housekeeping), §13 amendment
      log, §16.8 (no marker moved, no route added) and §17.5. Verified on branch epic/EPIC-10 at
      0152ebbe3 by comparing the pinned constant against shasum -a 256 of the document. Ruled
      and recorded by @po 2026-09-11 during wave-4 story validation.
    resolution_options:
      - "Serialize on the one artefact: 10.9's marker removal lands first, 10.13 re-anchors after. Everything else in both stories proceeds in parallel from day one."
      - "Have 10.13 re-anchor first against the current document, and 10.9 re-anchor again in its own PR."
      - "Replace the SHA-256 pin with a structural assertion (the operations, bodies and required lists 10.13 must not change) so it is insensitive to unrelated edits."
    resolution: >-
      SERIALIZE (option 1). Option 2 was rejected because it puts a runner-test edit in a
      backend PR, which is the one thing the pin's own comment forbids and the manoeuvre that
      turns a deliberate re-anchor into a laundered one — the second re-anchor would be made by
      someone whose subject is the confirm route and who has no reason to check what else moved.
      Option 3 is attractive and is NOT taken now: the pin's strength is that it is
      indiscriminate, which is why it caught four architect amendments that no structural
      assertion would have flagged, and replacing it inside a story about deadlines would be
      scope creep on an L. Recorded instead as a candidate for whichever wave-5+ story next
      touches confinement.test.ts, if the re-anchoring becomes recurrent rather than twice.
    note: >-
      Checked, not assumed: apart from the artefact above the two stories share no file. 10.9
      touches backend/src/main/java/com/citi/put/checks/studio/** (controller, service, compile
      package, dto), one new Flyway migration in backend/src/main/resources/db/migration,
      application.yml, the compile package README and one ADR-002 §13 log row. 10.13 touches
      studio-runner/src/{run,server,reporting,main.ts}, studio-runner/test/**, and
      studio-runner's README.md and ci/stages.md. The two README files are different files in
      different trees. 10.9 adds the epic's next migration and 10.13 adds no SQL at all, so
      FOC-01's wave-1 failure mode does not recur. FOC-03's two hot files, StudioService.java
      and StudioController.java, are touched by 10.9 alone in this wave — 10.7 and 10.8 have
      both merged — so FOC-03 does not extend into wave 4. One read-only coupling remains and
      needs no serialization: 10.9 implements against the ADR-002 §16 schemas and 10.13 against
      the §17 optional partial, both already landed on the branch, and neither story edits what
      the other reads. Note for wave 5: ADR-002 O-13 assigns story 10.14 the API-side half of
      partial, in the same RunnerReportProjection that 10.13 leaves reporting a truth the API
      discards — that is a story dependency, already carried by 10.13 blocks: ["10.14", ...],
      not a file conflict.

