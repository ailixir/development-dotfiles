      TEXT (where a stray `/*`, a wrapped assertion or a third mention of MEDIAN_TOLERANCE_MS stops
      webm.test.ts from loading) — a real risk for one sentence of prose. A closed body is not conformed
      halfway. It is NOT a merge condition on 10.32 and it does not re-open 10.16b.
    routing: >-
      The 10.16b gate's own F-4 remedy already names the vehicle: "@po rules on a comment-only amendment
      before 10.19, stated in FOC-06 form, for example in the 10.19 conformance pass." That is where it
      goes. If 10.19's criteria cannot absorb a comment-only edit, it lands as a standalone follow-up after
      the epic. Whoever takes it obeys AC-7's F-7 constraints verbatim, because the file is text-parsed.
      Carried alongside it, same owner, same vehicle: ECHO-1's BEHAVIOUR half from the 10.32 gate — whether
      parseChildMessage should ignore a malformed ready-echo instead of dropping the whole message and
      costing the launch. (Its DOCUMENTATION half is corrected before 10.32 merges; see
      stories[10.32].story_context.po_post_qa_ratification.)

# ─────────────────────────────────────────────────────────────
# Post-epic backlog owned by @pm
#
# Items routed to @pm at the close that are NOT Epic 10 defects and that deliberately carry NO
# integration_defects id. That block is this epic's record of what ITS OWN gates found in code IT
# OWNS, and story 10.19's AC-10 register reads it by name; putting a pre-existing gap there would
# make it look like Epic 10's to fix, which is a second false claim added by the very commit that
# exists to remove false claims. The precedent is DEF-03/DEF-04, which went to the open-items
# register rather than into a story for the same reason.
#
# These items are NOT conditions on this closure. Each has an owner, a first action and a reason
# for its sequencing, so that "routed to @pm" is a destination and not the place findings go to die.
# ─────────────────────────────────────────────────────────────
post_epic_backlog:
  - id: PB-1
    title: "Ten failing tests in checks.* / reports.*, masked for the epic's whole duration"
    owner: "@pm (Morgan), by user decision 2026-09-17 (EPIC-10-RUN-LOG.md, 'routed to @pm, by user decision')"
    status: open
    severity: "UNDETERMINED — see `ownership`. Severity cannot be set before the owner is, and I will not guess it."
    measured: >-
      On the clean tip of epic/EPIC-10-w7, with no co-run file present, and reproduced identically
      by two agents: "89 tests completed, 10 failed" — CheckCrudIT x2, ReportsCrudIT x2,
      ReportsExecutionIT x2, ReportsPreviewIT x2, ReportsDuplicateIT, and
      ReportDeliveryDispatcherIT (initializationError). RECORDED, not re-run for this entry: no
      suite was executed to write this manifest.
    ownership: >-
      UNDETERMINED, and recorded as undetermined rather than guessed — ours, the parallel program's,
      or older than both. Those files are ` M` in the other program's tree, so investigating them
      here risks duplicating work in flight, and Article IV forbids asserting a cause I have not
      established. Note the one thing that IS established: an earlier claim that they were
      pre-existing was argued from `git diff` rather than measured; the measurement above exonerated
      the track that made it, but exoneration is not attribution.
    why_it_was_invisible: >-
      Every run in this epic was scoped --tests 'com.citi.put.checks.studio.*', a mitigation adopted
      for MED-2's hanging `check` task. That narrowing is why ten failing tests outside the studio
      package went unreported for the epic's entire duration, and they surfaced only because a
      harness happened to run a wider suite once. THE MITIGATION FOR ONE BLIND SPOT MANUFACTURED
      ANOTHER.
    disposition: >-
      @pm 2026-09-18. NOT reopened inside Epic 10 and NOT a condition on this closure: the tests are
      outside the epic's scope and they predate the scoping decision that hid them. SEQUENCED AFTER
      THE FOLD, for the same reason the fold blocks everything else — the files are dirty there, and
      "whose are they" is answerable only against a committed tree. FIRST ACTION when the fold
      lands: run the same set on the merged tree and diff the failing set against the one above.
      Identical means they are older than both programs and become a standalone remediation story
      outside Epic 10. Smaller means they were the other program's and are already fixed. LARGER
      MEANS THE MERGE CAUSED THEM, and that is a stop under closure-plan step 2.8, not a note.
    epic_lesson_not_backlog_item: >-
      Recorded here so it is not lost with the item, but it belongs to the epic and to the
      framework, not to @pm's backlog: a test-scope narrowing adopted as a workaround must carry an
      expiry or a compensating wide run. This epic had neither for nine waves, and no gate asked.

  - id: PB-2
    title: "A dispatch failure and a compile failure are indistinguishable to an operator (OBS-1 + OBS-2)"
    owner: "@pm (Morgan), routed by @po 2026-09-17 at the 10.35 validation (docs/stories/10.35.story.md, Open questions item 3)"
    status: open
    severity: MEDIUM
    one_item_not_two: >-
      @po ruled that OBS-1 and OBS-2 are ONE item and not two — same defect class, same remedy
      shape, adjacent code — and deliberately gave them NO integration_defects id. @pm 2026-09-18:
      I ACCEPT BOTH HALVES OF THAT RULING and I record why, rather than only that. On the merge: the
      remedy is a single change of habit — carry the cause through to what the operator actually
      sees — applied at two call sites. Splitting it yields two changes, neither of which fixes the
      operator's real problem, which is that a 401 and a 400 look the same from the outside. On the
      absence of a DEF-* id: these are pre-existing observability gaps in code that NO Epic 10 story
      owns, and integration_defects is read by name by 10.19's AC-10 register as the epic's final
      open-items record. A DEF-* id would misattribute both their origin and their ownership. I
      considered and rejected the counter-argument that an id is the only thing that makes a finding
      survivable — this entry, with an owner and a sequencing rule, is that survivability, and it
      does not have to be bought by falsifying where the defect came from.
    obs_1: >-
      StudioDispatcher.applyOutcome discards DispatchOutcome.detail() on a terminal
      DEFINITE_REFUSAL. When the refusal is not retryable within the pending deadline it calls
      close(executionId, ExecutionErrorCode.DISPATCH_FAILED, now) with no warning log and no detail
      passed through, and closeWithError(UUID, String, Instant) takes exactly three arguments, none
      of which is detail(). The operator sees DISPATCH_FAILED whether the runner refused the
      credential or refused the body. Read directly by @sm at drafting and confirmed by @po.
    obs_2: >-
      CompilePipeline.java:268 maps every runner-side validate refusal to
      CompileErrorCode.VALIDATOR_UNAVAILABLE, collapsing a credential refusal and a body refusal
      into one compile_error on the validate route. StudioCoRunIT's own leg-1 comment (:338-342)
      spells out the distinction the code throws away: validator calls = 1 with the runner recording
      an identity refusal means the credential is wrong; validator calls = 1 with the runner
      recording nothing means the runner was reached and objected to the body.
    why_it_matters_now: >-
      DEF-05 is the live demonstration, and it is the reason I am not filing this as cosmetic. The
      dispatch route refuses on identity before the body is parsed, and the ONLY reason anyone can
      tell the two causes apart today is that the co-run harness reads the RUNNER's log rather than
      the API's error code. In staging there will be no runner log to read, and the compound first
      failure that EPIC-10-CLOSURE-PLAN.md section 7 predicts will present to whoever is on call as
      a single undifferentiated DISPATCH_FAILED.
    disposition: >-
      @pm 2026-09-18. Post-Epic-10 backlog, SEQUENCED WITH O-19 / ADR-003 — the backend-wide API
      error envelope, already placed outside Epic 10 by @pm and @po — because they share a subject:
      whether the error envelope can carry a cause at all. Deciding PB-2 first would hard-code a
      shape ADR-003 may overturn, and would do it in the error surface ADR-003 exists to unify. Held
      from getting worse in the meantime by story 10.35's AC-7, which @po gave a failing condition
      at validation precisely so that it can go red rather than merely record a value.
    refs: ['docs/stories/10.35.story.md — Open questions item 3, and the "Routed, not this story scope" section',
           'backend/src/main/java/com/citi/put/checks/studio/dispatch/StudioDispatcher.java (applyOutcome, closeWithError)',
           'backend/src/main/java/com/citi/put/checks/studio/compile/CompilePipeline.java:268',
           'backend/src/test/java/com/citi/put/checks/corun/StudioCoRunIT.java:338-342']

