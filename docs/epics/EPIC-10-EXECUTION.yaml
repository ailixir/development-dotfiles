# ─────────────────────────────────────────────────────────────
# Closure — what this epic's closure claims, and what it refuses to claim
#
# @pm (Morgan), 2026-09-18, on the project owner's decision: Epic 10 closes for its LOCAL half,
# with its EXTERNAL half explicitly CARRIED. This block is the manifest's answer to "is this done?"
# and it is written so the answer cannot be read more favourably than it is. Article IV: every
# claim below either names the source I read it in, or is labelled as my decision with its reason.
# NOTHING HERE WAS MEASURED BY RE-RUNNING A SUITE — by instruction, and because another agent may
# hold Gradle on this host. Figures are RECORDED figures with their provenance named; the git
# measurements are mine and are stamped.
# ─────────────────────────────────────────────────────────────
closure:
  decided_by: "user (project owner) — closed for the local half, external half explicitly carried"
  recorded_by: "@pm (Morgan), 2026-09-18 EDT, worktree wt/pm-close on branch chore/pm-epic-close"
  head: "epic/EPIC-10-w7 — 50 commits ahead of epic/EPIC-10, 0 behind (measured 2026-09-18 00:01 EDT)"

  what_this_closure_claims:
    - >-
      BUILT AND MERGED. Every branch in this repository is already an ancestor of epic/EPIC-10-w7:
      `git branch --no-merged epic/EPIC-10-w7` is empty across 46 local branches (measured
      2026-09-18 00:01 EDT; the run log's "43 branches" was correct when written and has drifted
      upward with the closure branches themselves). There was never any outstanding branch work —
      the integration branch IS the merge. Only the fold remains.
    - >-
      GATED. Every implemented story carries a QA gate file under docs/qa/gates/ and merged on that
      gate's verdict — 26 story ids across 27 files, counted 2026-09-18. The three stories with no
      gate file (10.33, 10.34, 10.35) are acceptance specs with no implementation, which is their
      designed shape and not a missing gate. Two stories are deliberately NOT Done — 10.16 on AC-19
      and 10.19 on AC-1…AC-7 — because a Blocked criterion is never ticked. See
      definition_of_done_disposition.
    - >-
      MEASURED AT REST, ON THE FULLY MERGED TIP. Backend studio package: 716 tests, 709 passed,
      0 failed, 0 errors, 7 skipped, aggregated from 94 JUnit XML files with none zero-length, at
      host load 2.42 (EPIC-10-RUN-LOG.md, "Epic 10 — the local half closes"). This is the figure
      this closure stands on, and it stands on it as a RECORDED figure, not one I re-took.
    - >-
      RECORDS TRUED, IN BOTH DIRECTIONS. DEF-01 and DEF-02 read `fixed` with the SHAs that fixed
      them, after nine waves of reading `open` while the code was already correct; DEF-05 reads
      `open` and its `open` is LITERAL rather than stale; the retracted gateway-breakage claim is
      out of the staging-acceptance register; story statuses match what their gates actually ruled;
      and the fold is decided file by file in tools/epic10-fold/RULINGS.md rather than left as a
      pending investigation.

  what_this_closure_does_not_claim:
    - >-
      NOT SHIPPABLE. What would ship is the merged tree, and the merged tree does not exist. The
      --ff-only fold into epic/EPIC-10 is blocked on 17 paths that are dirty in a parallel
      program's UNCOMMITTED tree (recomputed by @pm 2026-09-18 00:01 EDT against both live trees;
      this manifest is not among them). The per-file reconciliation is decided — 11 auto-mergeable,
      4 mechanical, 2 needing a named authority (@architect) — and is unexecutable until that
      program's work is on a branch with a SHA.
    - >-
      NOT VALIDATED. The capability has NEVER run end to end against real infrastructure, because
      that infrastructure does not exist. All twelve external gates are open. ED-01 has no owner at
      all — its field reads `TBD — not assigned in sources`, verbatim — and ED-02's external ticket
      is still unlinked. No work in this repository can change either fact.
    - >-
      NOT PROVEN TO DISPATCH. DEF-05, HIGH and open: the API's dispatch path presents no service
      identity, and the runner refuses every dispatch with IDENTITY_MISSING. It was found by the
      co-run harness on its FIRST run, after nine waves and 709 green studio tests had not found
      it, because until that harness existed nothing in this repository had ever run the API and
      the runner together. A fix exists in the other program's UNCOMMITTED tree and is unverified
      against a real runner. Story 10.35 is its acceptance spec. The consequence recorded under
      integration_defects.DEF-05 must travel with any quotation of DEF-01's `fixed`: the identity
      refusal happens BEFORE the dispatch body is parsed, so DEF-01's whole defect class is
      currently unobservable on that route. `fixed` there means "the merged source has the shape
      the defect said it lacked". It has never meant "the dispatch succeeds".
    - >-
      NOT LINTED. `npm run lint` HAS NEVER RUN in this epic (ENV-1). The frontend .eslintrc.json has
      been unexecutable since the monorepo reorganisation in 0539d2f1f; correcting the one-line
      typo was tested in wave 1 and REJECTED for this run because it surfaces 191 errors and 333
      warnings across pre-existing code. Every frontend story in this epic passed a gate from which
      linting was absent, and that is a gap in the evidence, not a property of the code.
    - >-
      NOT VALIDATED WITH A SCREEN READER AND NOT TRIED BY A NONTECHNICAL USER. Neither was
      performed. Both are recorded as NOT DONE rather than waived, and the story artefacts state
      their own emptiness in plain words ("NO SCREEN READER WAS RUN"; "Screen reader used | none —
      not run"), which @qa verified in both directions at the 10.19 gate. For a capability whose
      stated philosophy is "from checklist to reality" for nontechnical operators, an untried
      product is the largest unmeasured risk in this closure and I am naming it as such rather than
      as a deferred task.
    - >-
      NOT A CLEAN BILL FOR THE REST OF THE BACKEND. Ten tests outside the studio package fail on
      the merged tip and were hidden for the epic's entire duration by studio-only test scoping.
      They are not Epic 10 defects and they are not dismissed: see post_epic_backlog.PB-1.

  # The carrying relationship. A reader of this manifest ALONE must be able to see that Epic 10's
  # unfinished work has named successors rather than being abandoned. That is what this is for.
  succession:
    rule: >-
      Epic 10's unfinished work is CARRIED, not abandoned, and the carriers are named by id below.
      This is the mechanism the epic's own stories name for their own closure, quoted verbatim from
      10.19.story.md:247 in the Status row of 10.5, 10.6, 10.7, 10.8, 10.9, 10.11, 10.12, 10.13,
      10.15, 10.16 and 10.18: "The story is Done only when every criterion is either executed and
      passed, or superseded by a named follow-up story (10.34+, @pm's call) that carries it." This
      entry is that call, made. A criterion carried here is one that a named story will one day
      tick; it is not a criterion quietly dropped.
    carriers:
      - id: "10.34"
        title: "Staging acceptance execution"
        carries: >-
          EVERY externally-blocked Epic 10 acceptance criterion: 33 criteria inherited by name from
          12 prior stories, Groups A-L, each carrying its origin id, its blocking gate and its
          recording location in docs/qa/staging-acceptance-register.md. Group A is 10.19 AC-1…AC-7
          and Group B is 10.16 AC-19 — precisely the criteria on which those two stories are held
          not-Done. Group L is 10.18's further blocked criteria, added after @po counted them
          directly and found fifteen where the story's own row said six.
        status_at_closure: >-
          Ready (@po GO 8/10, 2026-09-17). `Ready` here means the registration is complete and
          correct, NOT that the story is dispatchable: every one of its criteria is Blocked and the
          story cannot start.
        blocked_on: "the fold; all twelve external gates; and story 10.35 (see below)"
      - id: "10.35"
        title: "Dispatch service identity (DEF-05) — acceptance spec"
        carries: >-
          DEF-05, as an ACCEPTANCE SPEC ONLY — this repository specifies what correct means and
          gates what lands; it does not author a second fix in a file another program has open.
          Blocks 10.34, because 10.34's Group A criteria each require a run that was actually
          dispatched and admitted, and while DEF-05 stands the API cannot dispatch at all.
        status_at_closure: >-
          Ready (@po GO 9/10, 2026-09-17). Blocked on another program's COMMIT, not on its working
          tree — a distinction this manifest holds deliberately, because that tree changed shape
          three times on 2026-09-17 alone.
    not_carried_by_a_story: >-
      Two items routed to @pm have NO carrier story, by design, and are recorded as post-epic
      backlog rather than as Epic 10 work: see post_epic_backlog (PB-1, PB-2). Neither is a
      condition on this closure and neither is abandoned; each has an owner, a first action and a
      sequencing reason.

  definition_of_done_disposition:
    item_1: >-
      "All stories reach Done via SDC cycle" is satisfied by SUCCESSION, not by execution. Two
      stories do not reach Done and are not forced to: 10.16 (AC-19, blocked on SPK-06 phase B) and
      10.19 (AC-1…AC-7, blocked on ED-01…ED-06). Both are carried by 10.34 by name. Without 10.34
      this item is unsatisfiable and the epic would stay open forever on a technicality —
      EPIC-10-CLOSURE-PLAN.md section 3(a).
    items_2_to_6: >-
      NOT MET, and not meetable in this repository. Items 2 through 6 all describe behaviour in
      staging or against the integrated stack; item 2 is 10.34's Group A almost verbatim. They are
      carried by 10.34, and they are the reason `status` is not `completed`.
    conflict_with_the_framework_default: >-
      PRESERVED, AND EPIC 10'S OWN RULE GOVERNS. .claude/rules/story-lifecycle.md states, as a
      CRITICAL rule, that "PASS, CONCERNS, and WAIVED move the story to Done". Story 10.19's own
      Definition of done is STRICTER: "A Blocked criterion is never ticked, and the story is never
      closed around it." 10.19's gate verdict was CONCERNS — merge safe — so under the framework
      default it would have moved to Done with AC-1…AC-7 still recorded skipped, never passed. @po
      documented this conflict at the close; @pm RATIFIES the stricter rule for Epic 10, with the
      reason rather than only the ruling: the framework default was written for stories whose
      criteria are all executable, and a Done resting on seven never-executed criteria is exactly
      the false claim this closure exists to prevent. This is a deliberate, recorded deviation from
      .claude/rules/story-lifecycle.md, scoped to Epic 10, and it is why this epic's story statuses
      will not match a naive lifecycle audit. Anyone auditing against the framework default should
      read this entry before filing the mismatch as a process violation.


# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  A CSI-authorized support engineer writes an English checklist, reviews the
  proposed actions and Playwright source, confirms an immutable revision, and
  runs it on demand in an isolated Chromium runner. Studio shows live progress
  over SSE current-state snapshots (GET fallback) and private, step-linked
  video evidence with authorized download. Compilation happens only at
  authoring time through the R2D2 LLM gateway; confirmed artifacts replay
  without an LLM. Accepted work and results are durable across API/worker/
  runner restarts with explicit recovery, ambiguous attempts are never
  replayed automatically, check outcome is kept separate from evidence state,
  and bounded Studio workloads never exhaust ordinary check/REST capacity.

# Traces to Epic 10 "MVP done when" paragraph. First item is the SDC process
# gate carried from the EPIC-07 format; it operationalizes the paragraph's
# "pass the acceptance cases below".
definition_of_done:
  - "All stories reach Done via SDC cycle (each story's acceptance cases are the gate)."
  - "In staging, a CSI-authorized user writes steps, reviews generated actions/source, confirms the exact revision, runs it, observes SSE progress, and views/downloads private step-linked video."
  - "A failed step stops execution; later steps are reported SKIPPED."
  - "Infrastructure/evidence failure is reported honestly."
  - "API restart, stale confirmation, duplicate delivery and wrong-CSI access pass the epic's per-story acceptance cases."
  - "No runtime LLM call during execution; no Chromium on API/worker pods."

