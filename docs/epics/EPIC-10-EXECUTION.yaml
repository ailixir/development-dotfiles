  - id: DOC-1
    severity: LOW
    status: open (carried; @po's call, deliberately not taken inside 10.32)
    found_by: "@dev at 10.32 implementation, flagged to @po; confirmed by @qa at the 10.32 gate as DOC-1"
    owner: "@po (Pax)"
    summary: >-
      studio-runner/test/fixtures-tier/seek-measurement.test.ts still says "Tightening further would start
      to bet against the detector" in the outlier-bound paragraph (about :88). ADR-002 §26.5 ruled that the
      cause is a systematic lead past the helper's SLACK, not a detector limitation, and story 10.32 landed
