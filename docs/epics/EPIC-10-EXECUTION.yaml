      another program has open. Same shape as the 10.33/PROD-1 and F-3 deferrals.
    found_by: >-
      The co-run harness (tools/corun.sh plus backend/src/test/java/com/citi/put/checks/corun/StudioCoRunIT.java,
      merged at 97e25f3ed on feat/p1-corun), on its first run against a real studio-runner process,
      2026-09-17. Independently re-verified by the orchestrator and again by @sm while drafting 10.35,
      each time by reading the three sources named in refs, not by transcription.
    owner: "@po (Pax) — routing and acceptance only. Implementation is external; see fix_owner_external."
    summary: >-
      The dispatch path presents no service identity. docs/specs/studio/openapi.yaml declares
      security: [serviceIdentity] on BOTH runner-served routes — runnerValidateArtifact (operationId :849,
      security :861-862) and runnerAdmitRun (operationId :903, security :927-928). RunnerValidationClient
