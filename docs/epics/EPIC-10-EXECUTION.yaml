external_dependencies:
  - id: ED-01
    name: "LLM gateway access (R2D2, Vertex-compatible proxy)"
    description: "Service credentials plus endpoint/project/location for the Studio compile workload; verified Vertex SDK version, reachable model identifiers, structured-output/temperature behavior and quotas."
    source: "Architecture §4.1, §8.5, §10; Epic 10 §10.5 acceptance; BRD §3.3."
    gates: ["10.5", "10.8", "10.19"]
    gate_note: "10.5 stub tests and 10.8 fixture-only compile can proceed; 10.5 pilot-use acceptance and any real compile path are blocked."
    fallback: "Stub gateway tests; drafts persist during outage (Architecture §4.7)."
    owner: "TBD — not assigned in sources"
    status: open

  - id: ED-02
    name: "Real trusted identity + vault (replacing stubs)"
    description: "Production-capable identity through the trusted gateway (strips/replaces identity headers, fails closed when absent, documented CSRF control for cookie-authenticated mutations) and real vault integration with secret-use authorization. The current BffSessionAuthenticationFilter admin bypass and SecretsService REDACTED/plaintext stub cannot satisfy staging acceptance."
    source: "Architecture §9.1–9.2; Review P1-4; Epic 10 release ordering, §10.7 and §10.17 acceptance."
    gates: ["10.7", "10.17", "10.18", "10.19"]
    gate_note: "May be delivered outside Epic 10 but must have linked completed tickets before a credentialed pilot. 10.7 acceptance requires production auth bypass absent before pilot; 10.17 credentialed staging acceptance cannot pass on stubs."
    fallback: "Development identities confined to local/mock operation; fixture-only runs without secrets."
    owner: "TBD — not assigned in sources"
    status: open

  - id: ED-03
    name: "Sonic write/read credentials and lifecycle behavior"
    description: "Sonic endpoint/bucket/path-style access; runner write-only credentials scoped to the studio/ prefix; API/recovery read-only credentials; verified 30-day lifecycle rules including versioning/noncurrent-object and incomplete-upload cleanup."
    source: "Architecture §6.2, §8.5, §10; Epic 10 §10.14 and §10.18 acceptance."
    gates: ["10.14", "10.15", "10.18", "10.19"]
    gate_note: "10.14 development uses a local fake/compatible store; real Sonic integration and lifecycle acceptance are blocked."
    fallback: "Local fake/compatible store (Epic 10 §10.14; 10.7 uses a fake store until 10.14 integration)."
    owner: "Platform/SRE (storage controls — BRD §4)"
    status: open

  - id: ED-04
    name: "Approved target and auth-provider destinations"
    description: "Approved origins per CSI/environment for the pilot application, including required authentication providers and subresources, plus the platform network/proxy mechanism for domain/egress controls and DNS (standard NetworkPolicy is not URL filtering)."
    source: "Architecture §9.3; Review P1-6; Epic 10 §10.18 acceptance, §10.19 acceptance."
    gates: ["10.17", "10.18", "10.19"]
    gate_note: "10.17 destination-misuse negative tests, 10.18 egress enforcement and the 10.19 approved single-page workflow are blocked."
    fallback: "Controlled local page fixtures (Epic 10 §10.12, §10.13)."
    owner: "Platform/SRE (egress/DNS mechanism — BRD §4); application/auth-provider approval owner not named in sources"
    status: open

  - id: ED-05
    name: "Internal Playwright image"
    description: "Internal Playwright/Chromium image pinned to the runner package version, running non-root with the Chromium sandbox enabled and compatible seccomp; sandbox must be proven in staging, never silently disabled."
    source: "Architecture §4.3, §9.3; Review P1-6; Epic 10 §10.3 and §10.18 acceptance."
    gates: ["10.3", "10.18", "10.19"]
    gate_note: "10.3 CI mismatch check needs the pinned image; 10.12/10.13 can run on a developer machine (BRD milestone 'Real browser, real video (dev)')."
    fallback: "Developer-machine runs; do not disable the sandbox to make an image run (Architecture §9.3)."
    owner: "Platform/SRE (cluster/sandbox — BRD §4)"
    status: open

  - id: ED-06
    name: "Real ingress SSE + media route"
    description: "Authenticated same-origin session-cookie (or header-capable) route through the actual ingress for EventSource and <video>/download requests, with buffering disabled and idle timeouts above the 15 s heartbeat; validated by the staging streaming spike (two timed snapshots, heartbeat idle, cross-replica reconnect)."
    source: "Architecture §5.5, §6.3, §10; SSE assessment (Validation); Epic 10 §10.11, §10.15 and §10.18 acceptance."
    gates: ["10.11", "10.15", "10.18", "10.19"]
    gate_note: "10.11 verified cookie route and 10.15 media-route prerequisite are blocked; a demonstrated gateway incompatibility uses GET fallback without changing the execution contract."
    fallback: "Mocked transport scenario in the frontend dev path; bounded GET snapshot polling fallback (SSE assessment; Architecture §5.5)."
    owner: "Platform/SRE (ingress — BRD §4)"
    status: open
