  # ── Wave 8 (added by @po 2026-09-17) ── PROD-1, from @qa's carry-forward gate ──
  - id: "10.33"
    title: "Refuse malformed store-bootstrap payloads (PROD-1)"
    size: S
    wave: 8
    # No unmerged prerequisite. The two reducers and their thunks are pre-Epic-10 frontend code that
    # Epic 10's Studio page reads. Wave 8 so that it lands with 10.30-10.32, ahead of 10.19's pilot.
    depends_on: []
    blocks: ["10.19"]
    story_context:
      # Routed by @po 2026-09-17, from docs/qa/gates/carry-forward-2026-09-16.yml ("New, not this
      # branch's: PROD-1 (low)"). Ids: 10.33 is the next free id in the decade block. Before claiming it,
      # @po checked that no story file with that id exists in any wt/* worktree, that no branch carries it,
      # and that this manifest does not mention it.
      finding: >-
        VERIFIED BY READING at 7357082e3. fetchSources returns `response.sources` and fetchFeatures returns
        the response object, and neither checks the shape. The fulfilled reducers then assign the payload
        as it is: sourcesSlice.ts:34 `state.data = action.payload`, and featuresSlice.ts:56-57
        `state.sources = …; state.features = …`. A 200 whose body is not the expected JSON (for example an
        HTML page) therefore leaves those arrays undefined, and the Studio page's selectors throw
        `reading 'find'`. MEASURED, in the test harness only: @dev and @qa reproduced exactly that crash
        against a local stand-in that answers every path with 307 → /login, and /login with 200 text/html
        (docs/qa/carry-forward-2026-09-16.md, ENV-2 table). INFERRED, NOT TESTED: an expired session behind
        the real gateway, redirected to an HTML login page, produces the same shape in production.
      severity_and_order: >-
        Low severity, but it must land BEFORE THE CREDENTIALED PILOT, and it blocks 10.19. Real sessions
        can first expire in 10.19's pilot. 10.19 AC-2 requires every failure state to be "visible in the
        UI and truthful", and a white-screen crash is neither.
      target_behaviour: >-
        A fulfilled response whose shape is wrong is handled as a FAILURE. It ends in the same state the
        rejected path reaches today: the fail-open defaults, error set, fetched true, loading false. It
        must never leave an array undefined. A well-formed 200 is stored as it is today. Where the check
        lives (the thunk or the reducer) is @dev's choice. The outcome is not.
      red_first: >-
        @qa writes the failing tests first, split into two states (the wave-8 rule).
        REFUSALS, red against today's code: a 200 text/html body on /checks/sources and on /features,
        each asserting the slice ends on its defaults with error set, and the Studio page renders without
        throwing. CONTROLS, green today: a well-formed 200 is stored unchanged, and a 404 still fails open.
        A red control means a broken fixture, not a finding.
      harness_constraint: >-
        SEE FOC-08. frontend/src/test/setup.ts waits up to 10 s for BOTH bootstrap fetches to settle, with
        fetched true and loading false. This story edits exactly the code that wait observes. Any outcome
        that leaves fetched false fails every jsdom test file after 10 s. src/test/bootstrapIsolation.test.ts
        must stay green unchanged, unless setup.ts changes in the same commit.
      out_of_scope: >-
        Session-expiry UX (re-authentication, a redirect to login). That belongs with the Core BFF /
        ED-02, not here. The other pre-Epic-10 slices are not audited either. If @dev finds the same
        pattern elsewhere, it is reported and not widened into this story.
      executor: "@dev (Dex) after @qa's failing tests; quality gate @qa. Frontend only; npm (frontend's package-lock.json convention)."

