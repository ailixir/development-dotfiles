integration_defects:
  - id: DEF-01
    severity: HIGH
    # @po 2026-09-17 (closure plan step 0.2). Was `open`. It has been fixed in code since wave 5 and
    # the field never moved; story 10.19's AC-10 register reads this block by name, so a stale
    # `open` here propagates into the epic's final open-items record.
    status: fixed
    fixed_by: >-
      Story 10.17. The general conformance control landed first and RED, in its own commit, exactly
      as control_timing_ruling below required: `4c7abee4c` (T-10.17.2a,
      "test(studio): assert every internal body against its frozen schema — RED"). The fix followed
      at `e72724eed` (T-10.17.2b, "feat(studio): typed references, a conforming job body and
      authorized secret use"); the story merged at `c54df7934`. All three are reachable from
      `epic/EPIC-10-w7` (verified `git merge-base --is-ancestor`).
    fix_verification: >-
      Verified four times, independently, by reading the merged code rather than by re-running a
      suite: by @dev and by @qa during story 10.19, by the orchestrator at the wave-9 close
      ("Also confirmed" in the run log), and by @po on 2026-09-17 at closure-plan step 0.2.
      @po read three things in this worktree: (1)
      `backend/src/main/java/com/citi/put/checks/studio/dispatch/HttpRunnerDispatchClient.java`
      `body()` now writes every one of the fourteen contract keys — executionId, attemptId,
      revisionId, artifactHash, artifact, source, configuration, csi, references, resolvedVars,
      resolvedSecrets, deadlines, videoKey, manifestKey — and writes neither `testId`, `csiId`,
      `environment` nor `callbackBaseUrl`, the four keys the closed body refused; (2) `RunJob.java`
      is a fourteen-component record whose Javadoc describes the defect in the past tense
      ("Until story 10.17 this record carried eight fields of which four … were not properties of
      the closed body at all"); (3)
      `backend/src/test/java/com/citi/put/checks/studio/dispatch/InternalBodyContractConformanceTest.java`
      exists. CORRECTION to the closure plan's own figure: RunJob is **fourteen** components, not
      twelve — counted in the record declaration.
    # NOT verified by @po: no test was executed. The backend suite was deliberately not run
    # (another agent holds Gradle on this host and concurrent Gradle manufactures failures here —
    # see the backend host-contention rule). The claim above is "the merged source has the shape the
    # defect says it lacked", which is what the defect was about; it is not "the dispatch succeeds
    # end to end". Nothing in this repository has ever run the API and the runner together.
    found_by: "@sm (River) while drafting 10.17, 2026-09-11; every element re-verified by @po at validation"
    owner: "10.17 (ruled by @po 2026-09-11)"
    summary: >-
      The API has never been able to dispatch a run. HttpRunnerDispatchClient.body() writes eight
      keys — executionId, attemptId, testId, csiId, revisionId, environment, references,
      callbackBaseUrl. The frozen RunJob is additionalProperties:false over fourteen required
      names: four of the eight are not properties at all and ten required fields are missing,
      including artifact, artifactHash, source, configuration, resolvedVars, resolvedSecrets,
      deadlines, videoKey and manifestKey. The runner's validateEnvelope is default-deny on keys
      and is step 1 of runCoordinator.submit — before artifact validation and before
      pool.tryAcquire() — so every real dispatch returns 400 JOB_INVALID, classify maps it to
      refusedTerminal, and the run ends ERROR / DISPATCH_FAILED. callbackBaseUrl is refused by its
      own dedicated code, JOB_CALLBACK_NOT_PERMITTED: the API's dispatcher trips the one control
      the closed key set exists to enforce, which the schema's own description calls "a security
      control rather than tidiness". Separately, StudioDispatcher:218 opens
      try (Resolved resolved = references.resolve(...)) and never reads resolved — no secret or
      variable has ever reached the runner.
    why_nothing_caught_it: >-
      HttpRunnerDispatchClientTest asserts status classification, redirect policy and request
      counts, never the body's keys. StudioContractTest asserts that POST /v1/runs is declared,
      never that what this API sends conforms to it. grep -rn callbackBaseUrl backend/src/test/
      returns nothing at all. 10.7's QA round attacked sixteen forged requests at the internal
      chain and did not look here.
    ownership_ruling: >-
      @po 2026-09-11 — stays with 10.17, and it is not a scope violation. (1) A closed body cannot
      be conformed halfway: additionalProperties:false plus fourteen required means the runner
      accepts the body or refuses it, so splitting the fields across two stories yields two PRs of
      which neither can assert conformance — and the assertion is the criterion. (2) Half the
      missing fields are definitionally 10.17's: resolvedVars/resolvedSecrets are the values it
      exists to plumb and typed references is its AC-1, while 10.7 shipped dispatch WITHOUT
      resolved values deliberately and deferred that half here by name in its own AC-10b. (3) The
      epic's acceptance bullet for 10.17 — "unauthorized or missing reference prevents browser
      launch" — is unprovable on a branch where every job is refused before the reference check is
      reached. Reassignment to 10.7 is also unavailable in practice: it is InReview with its gate
      already run, and reopening it to add a body its own scope excluded would be a scope violation
      in the other direction.
    control_timing_ruling: >-
      @po 2026-09-11 — the missing conformance test does NOT wait for the fix. It lands first, red,
      in its own commit (10.17 T-10.17.2a), on the ADR-002 §12 "leave it red" precedent and the
      ExecutionErrorCodeContractEscalationTest pattern this epic has used twice. It is written in
      its GENERAL form — for every internal body this API produces, the serialized bytes validate
      against the schema the frozen document declares for it — so it is a control rather than a
      patch; RunJob is simply its first member and the one that is red today. A test naming only
      RunJob's fourteen fields would be a fifteenth hand-maintained copy of one vocabulary, which
      is ADR-002 §15.6's arrangement for the fifth time.
    carried_by: "Story 10.17 AC-2, tasks T-10.17.2a (red first) and T-10.17.2b (the fix)."

  - id: DEF-02
    severity: HIGH
    # @po 2026-09-17 (closure plan step 0.2). Was `open`, for the same reason as DEF-01 above.
    status: fixed
    fixed_by: >-
      Story 10.14 AC-10, as its own standalone commit at the head of wave 5 exactly as
      mandated_ordering below required: `00b9e105d` ("fix(studio): accept evidence.partial on the
      internal progress callback"); the story merged at `ba9e56064`. Both reachable from
      `epic/EPIC-10-w7` (verified `git merge-base --is-ancestor`).
    fix_verification: >-
      Verified four times, independently, by reading the merged code: by @dev and by @qa during
      story 10.19, by the orchestrator at the wave-9 close, and by @po on 2026-09-17. @po read
      `backend/src/main/java/com/citi/put/checks/studio/internal/dto/RunnerEvidence.java`: it is
      `record RunnerEvidence(String videoKey, String manifestKey, String state, Boolean partial)`,
      four components, still `@JsonIgnoreProperties(ignoreUnknown = false)` — so the strictness that
      caused the refusal is intact and it is the record that widened, which is the correct fix. Its
      Javadoc states the defect in the past tense and names DEF-02.
    # NOT verified by @po: no test was executed, for the reason recorded on DEF-01. The
    # correction_to_adr below (ADR-002 §17.7 describes behaviour the code does not have) is a
    # separate item and is NOT closed by this status change — ADR-002 is dirty in the parallel
    # tree and must not be edited from this line.
    found_by: "@sm (River) while drafting 10.14, 2026-09-11 (raised as its open question 1); both halves verified by @po at validation"
    owner: "10.14 (AC-10), landed at the head of wave 5"
    summary: >-
      The integrated branch is broken, not degraded: every FINAL the merged runner sends is refused
      by the merged API. Story 10.13 landed the partial producer and emits it on every FINAL —
      verified: runCoordinator declares
      let evidence: EvidenceState = { ...evidenceKeys, state: 'UNAVAILABLE', partial: false }
      before the try, and sendFinal(outcome: RunOutcome, evidence: EvidenceState) takes it
      non-optionally, so no exit path including the catch can omit it. The API's RunnerEvidence.java
      is a three-component record annotated @JsonIgnoreProperties(ignoreUnknown = false), and
      StrictInternalBodyReader.java:29 builds its mapper with
      .enable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES) — deliberately, so that a field the
      contract does not name is a 400 rather than a silent divergence. The result is
      400 INVALID_REPORT on every terminal report, terminal delivery retrying until abandoned, and
      the run reconciled by a reaper instead of by its own result.
    correction_to_adr: >-
      ADR-002 §17.7 item 4 states "the runner reports the truth and the API discards it — which is
      visible, bounded and strictly better than today." On the verified code nothing is discarded;
      the report is refused. @architect is asked for a one-line §17.7 correction, since the ADR
      currently describes behaviour the code does not have and a future reader will trust it. Not
      gating — the fix proceeds without waiting for the correction.
    why_nothing_caught_it: >-
      The runner suite validates against the document, which permits partial; the backend suites use
      their own fixtures. StudioContractTest.assertSchemaMatchesRecord covers nine public DTOs and
      no internal record at all, which is why ADR-002 §17 could add partial to RunnerEvidence in the
      document, leave the Java record three-wide, and turn nothing red. That gap is story 10.14's
      AC-24.
    mandated_ordering: >-
      @po 2026-09-11 — 10.14's AC-10 (one nullable Boolean on one record) lands as a standalone
      commit at the HEAD of wave 5, before any other wave-5 work merges, with the 400 shown red
      before the change and the 200 after. Until it lands the integrated path is broken rather than
      degraded, and no wave-5 story should be measured against a branch in that state.
    carried_by: "Story 10.14 AC-10, AC-11, AC-24; task T-10.14.1."

  - id: DEF-03
    severity: LOW
    status: open (backlog, NOT scheduled in Epic 10)
    found_by: "@qa (Quinn) at the 10.30 review, 2026-09-17, as DELETE-RACE-1 — by probe, not by reading; re-confirmed on 63811e4a3"
    owner: >-
      @po (Pax) owns the ROUTING and this record. The FIX belongs to the first story after Epic 10 that
      re-opens StudioService's write paths; @dev implements it, @qa writes the interleaving proof FIRST
      (the epic's standing rule since 10.4: a sequential happy-path test does not count), and @architect
      rules the primitive if the two disagree — a lock (visible findById -> requireWrite ->
      findByIdForUpdate, empty -> 403, then set deleted_at) versus a targeted UPDATE guarded by the
      visibility predicate. Recorded here, in a block story 10.19's AC-10 register reads by name, so it
      cannot be closed by silence.
    summary: >-
      softDeleteTest(id, auth) takes NO lock, and Hibernate writes every column (no @DynamicUpdate, no
      @Version). A save that commits between the delete's read and its flush is overwritten from the
      delete's stale snapshot, and BOTH callers are told success. Measured (@qa probe R3, the natural
      order): a save committed name "Probe draft" / steps ["Saved"] / source_revision 2 while holding the
      lock; the delete queued behind it; after both committed the row read source_revision=1, the original
      steps, and deleted_at set — the save reverted, the delete reporting success. By reading only, the
      same full-row write would also clear a concurrent quarantined_at.
    not_introduced_by_10_30: >-
      PRE-EXISTING SHAPE. softDeleteTest(UUID) has always had it; 10.30 put it on an authorized HTTP
      route. It is not a 10.30 acceptance criterion, and 10.30 is NOT re-opened for it (the standing rule
      applied to O-17, 10.14 and 10.16a).
    before_the_credentialed_pilot: >-
      NO — ruled by @po 2026-09-17. It does NOT block story 10.19 and it is not a wave-8 or wave-9 item.
      Grounds, in order: (1) the harm is bounded to a draft that is concurrently BEING DELETED, and the
      row is hidden the moment deleted_at is set, so the reverted content is invisible to everyone
      afterwards; (2) no authorization property is weakened — the delete is now authorized, which is what
      10.30 was for, and the race changes content, not who may act; (3) clearing a concurrent
      quarantined_at on a row that is simultaneously soft-deleted does not resurrect it; (4) the window
      needs two credentialed sessions on ONE draft inside one transaction, which a small pilot makes
      unlikely; and (5) the fix is production backend code that needs a real red-first interleaving proof,
      which is a story's worth of work and not a merge-window patch — and buying it during the pilot
      window would trade a low, bounded, invisible content loss for an unproven change on the write path
      the pilot depends on. CONDITIONS ON THIS RULING, both of which are part of it: (a) the pilot's
      operating note says that a delete concurrent with a save is NOT atomic, so if the pilot observes a
      draft's content reverting, that is DEF-03 and not a new defect — report it against this id; and
      (b) it is fixed before GA or before any credentialed use beyond the pilot, whichever comes first.
      If the pilot actually observes it, this severity is re-opened rather than confirmed.
    refs: ['backend/src/main/java/com/citi/put/checks/studio/StudioService.java (softDeleteTest)', 'docs/qa/gates/10.30-csi-write-authorization-create-save-delete.yml (DELETE-RACE-1, probes P1/P2 at bbeb89288, R3 at 63811e4a3)']

  - id: DEF-04
    severity: MEDIUM
    status: open (backlog, NOT scheduled in Epic 10)
    found_by: "@qa (Quinn) at the 10.30 review, 2026-09-17, as DIRTY-CALLER-STALE-1 — by a
      parameterized throwaway probe (StudioFlushProbeTempIT on e3bfb7b59, no production change), not by
      reading"
    owner: "@po (Pax) owns the ROUTING and this record. The FIX belongs with DEF-03's: the first story
      after Epic 10 that re-opens StudioService's write paths, @dev implementing, @qa writing the
      interleaving proof FIRST (the epic's standing rule since 10.4 — a sequential happy-path test does
      not count), @architect ruling the primitive if the two disagree. SAME ROOT CAUSE FAMILY AS DEF-03:
      both are full-row writes from a stale in-memory snapshot on an entity with neither @Version nor
      @DynamicUpdate, and @qa's suggested remedy (@Version on UITest, or @DynamicUpdate plus a
      revision-guarded UPDATE) closes BOTH. They are therefore routed together and should be fixed
      together; splitting them would buy two unproven changes on the same write path instead of one."
    summary: 'A caller holding a DIRTY managed reference to the draft across the save defeats the
      STALE_REVISION check outright: a save that committed in between is silently overwritten and no 409
      is raised. UITest has neither @Version nor @DynamicUpdate, so flushing that dirty reference writes
      EVERY column from the caller''s pre-lock snapshot — including source_revision — and the refresh
      that follows then reads back this transaction''s own uncommitted write instead of the winner''s.
      The revision comparison therefore compares the request against the copy the caller was already
      holding, which is exactly the lost update findByIdForUpdate + refresh exist to prevent. Both
      callers are told they succeeded. Measured: one transaction does findById (unlocked, managed) ->
      writes schedule on the held reference -> a competing updateTest commits on another connection and
      thread -> updateTest(..., owner) on this thread. AUTO, COMMIT and MANUAL all gave
      outcome=[no exception] and the loser''s row. 10.30''s own case (a) does not catch it (its caller''s
      reference is clean) and case (b) does not (there is no competing save).'
    not_introduced_by_10_30: >-
      PRE-EXISTING UNDER PRODUCTION'S MODE, and @qa measured that rather than arguing it, which is why
      this record states it as fact. With 10.30's new flush removed (the shape at 303c17cf6): AUTO still
      loses the save, while COMMIT and MANUAL answered a correct 409 STALE_REVISION. Production runs
      AUTO — the locking JPQL query's implicit flush already did the same damage one line earlier — so
      the hazard predates BOTH of 10.30's fixes. What 10.30 changed is that COMMIT and MANUAL now behave
      like AUTO. @po: THAT WAS THE RIGHT TRADE and 10.30 is NOT re-opened for it (the standing rule
      applied to O-17, 10.14 and 10.16a). The two modes that were accidentally correct were correct at
      the price of silently dropping the caller's write, which is REFRESH-FLUSH-1; uniformity with
      production is worth more than an accidental 409. The cost is that the hole is now uniform and
      nothing in the suite covers it.
    reachability: >-
      NOT REACHABLE OVER HTTP TODAY, measured. The request's persistence context holds only what the
      save itself loaded, all clean, so the new flush() emits nothing there — all 24 StudioAuthorizationIT
      cases and OptimisticSaveIT 3/3 green, package count moved by exactly the +3 new cases. It needs an
      in-process caller in the SAME transaction that writes to the draft BEFORE calling the save. Nothing
      in backend/src/main does that, and the inference tree's StudioAuthoringService.update writes only
      after the save (read at wt/epic, read-only). @po: latent, not live — and recorded rather than left
      implicit precisely because 10.30's own case (b) establishes "write before the save" as a SUPPORTED
      shape, so the first caller to use it inherits this silently.
    before_the_credentialed_pilot: >-
      NO — ruled by @po 2026-09-17, on the same grounds as DEF-03 and one of its own. The pilot drives
      the HTTP route, where exposure is nil by measurement; there is no in-process caller in the tree to
      reach it; no authorization property is weakened (the race changes content, not who may act); and
      the fix is production write-path code needing a real red-first interleaving proof, which is a
      story's worth of work and not a merge-window patch. CONDITIONS, both part of the ruling: (a) the
      pilot's operating note already carries DEF-03's "a delete concurrent with a save is NOT atomic"
      line — it is extended to say a SAVE concurrent with a save can also lose one, so an observed
      content reversion is reported against DEF-03/DEF-04 and not as a new defect; and (b) it is fixed
      before GA or before any credentialed use beyond the pilot, whichever comes first. If the fix for
      DEF-03 lands as @Version on UITest, this closes with it and the record says so.
    refs: ['backend/src/main/java/com/citi/put/checks/studio/StudioService.java:300-325',
           'backend/src/main/java/com/citi/put/checks/studio/entity/UITest.java',
           'docs/qa/gates/10.30-csi-write-authorization-create-save-delete.yml (DIRTY-CALLER-STALE-1, StudioFlushProbeTempIT on e3bfb7b59; attribution probe with F1 applied)']

  - id: DEF-05
    severity: HIGH
