      file. Two paragraphs one screen apart now describe the same phenomenon with different causes.
    why_not_fixed_in_10_32: >-
      @po 2026-09-17. AC-8.4 is a CLOSED instrument: it enumerates the only lines the story may touch, and
      @qa's condition-4 evidence is `git diff -U0` showing exactly five hunks. Widening it after
