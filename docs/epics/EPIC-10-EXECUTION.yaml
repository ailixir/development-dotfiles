epic_id: EPIC-10
milestone: M5
title: "Checks Studio Execution (MVP) — exact-revision confirmation, isolated Chromium execution, SSE progress, private video evidence"
status: planning
created_at: "2026-09-10"
created_by: "@pm (Morgan)"

# ─────────────────────────────────────────────────────────────
# Epic goal + definition of done
# ─────────────────────────────────────────────────────────────
goal: |
  A CSI-authorized support engineer writes an English checklist, reviews the
  proposed actions and Playwright source, confirms an immutable revision, and
  runs it on demand in an isolated Chromium runner. Studio shows live progress
  over SSE current-state snapshots (GET fallback) and private, step-linked
  video evidence with authorized download. Compilation happens only at
  authoring time through the R2D2 LLM gateway; confirmed artifacts replay
  without an LLM. Accepted work and results are durable across API/worker/
  runner restarts with explicit recovery, ambiguous attempts are never
  replayed automatically, check outcome is kept separate from evidence state,
  and bounded Studio workloads never exhaust ordinary check/REST capacity.

# Traces to Epic 10 "MVP done when" paragraph. First item is the SDC process
# gate carried from the EPIC-07 format; it operationalizes the paragraph's
# "pass the acceptance cases below".
definition_of_done:
  - "All stories reach Done via SDC cycle (each story's acceptance cases are the gate)."
  - "In staging, a CSI-authorized user writes steps, reviews generated actions/source, confirms the exact revision, runs it, observes SSE progress, and views/downloads private step-linked video."
  - "A failed step stops execution; later steps are reported SKIPPED."
  - "Infrastructure/evidence failure is reported honestly."
  - "API restart, stale confirmation, duplicate delivery and wrong-CSI access pass the epic's per-story acceptance cases."
  - "No runtime LLM call during execution; no Chromium on API/worker pods."

