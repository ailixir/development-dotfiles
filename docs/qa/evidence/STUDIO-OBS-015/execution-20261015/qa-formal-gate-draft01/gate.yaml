top_issues:
  - id: "REL-001"
    severity: medium
    finding: "CONTEXT_LOST is thrown for any exception in GuidedRuntime.start() with nothing logged: ownership.ts:139 'catch{await this.stopEntry(entry,CONTEXT_LOST);throw new Error(CONTEXT_LOST)}' and the launch catch in runtime.ts:157-160 drop the inner error. attempt03 P1 therefore has an unprovable cause (launch, recorder, blank-document, callback or a Chromium event, inside about 2.4 s after the journal consume). The final-gates03 review reads the 4000 output tokens as a possible cap or truncation; the test-lane cohort's declaredOutputCeiling for that profile is 4000, so that figure is most likely the per-proposal ceiling charge and carries no signal (inference, not run)."
    suggested_action: "Schedule a value-free diagnostic (error class and step, never message) at those catch sites; it is a runner change that reopens the runner, image and deployment gates, so it needs a user scope decision. Until then, a recurrence in attempt04 triggers the stop-loss in verdict_logic."
  - id: "TEST-001"
    severity: medium
    finding: "No single full check run has been green on f071984a; attempt01-03 each failed on different causes, and JaCoCo verification and requireFreshGuidedPartitions never ran. Three consecutive different transient failures in a 1.5 h lane suggest the lane is flaky at a rate I cannot estimate."
    suggested_action: "Issue the verdict only on the attempt04 receipt. Run attempt04 with the host idle (no concurrent Chromium, agents or Spotlight indexing on the worktree, which attempt03-diagnosis01 flags as circumstantial). Do not edit tests to chase the flakes unless attempt04 fails again, because any edit moves the digest."
  - id: "REQ-001"
    severity: medium
    finding: "ED-05: in-image check-pins --require-image fails (Node v24.20.0 in the pinned Playwright image vs .nvmrc 22). External (Platform/SRE internal Playwright image), open since 10.3/10.18/10.19. Every other pin, the image build and the 322-case deployment tier pass."
    suggested_action: "Carry in the gate record as EXTERNAL-OPEN; user or PO acknowledges it as an accepted external item. OBS-010 release readiness owns closure. QA does not waive it."
  - id: "TEST-002"
    severity: low
    finding: "Order-dependent JOIN suite: class-scoped state plus a cleanup-unconfirmed latch turns one failure into many, and the two P7 tests fail when run alone."
    suggested_action: "Track as test-hygiene debt for OBS-011 or OBS-009; never accept single-test reruns of ReplayIT as evidence."
  - id: "MNT-001"
    severity: low
    finding: "Post-review windows w6/w7/w8 have no QA review record (see quality_checks.1_code_review.observations)."
    suggested_action: "QA read the highest-risk pieces for this draft. If the user wants a record, QA reviews the w6-w8 diffs from the manifests before issue; this does not need a build."
  - id: "DOC-001"
    severity: low
    finding: "F4 exception note for R4 not appended to the inference contract doc; stale VariableReferenceValidator Javadoc and dead private isBlank."
    suggested_action: "Aria appends the note where F4 lives now; Dex removes the dead method and fixes the Javadoc in the next source window (not before attempt04; it moves the digest)."
  - id: "MNT-002"
    severity: low
    finding: "Unlisted framework edit in the working tree: .aiox-core/core/permissions/dispatch-governance.js (+20/-4, statusesForTask) is an L1 path outside 015's File List."
    suggested_action: "@devops separates it from the 015 commit; it is not a 015 AC and QA has not reviewed it."
  - id: "TEST-003"
    severity: low
    finding: "Advisories carried from earlier reviews: ledger 47 positive F01-retention assertion absent, fix01 A1/A2, final02 A1, RaceTest branch vacuity, H8 starvation and expire() skip."
    suggested_action: "Track in OBS-009 / OBS-011 where already placed; none blocks."

