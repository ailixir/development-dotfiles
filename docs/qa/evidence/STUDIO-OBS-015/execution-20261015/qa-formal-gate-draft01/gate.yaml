verdict_logic:
  precondition_for_any_issue: >-
    attempt04 capture-before sourceDigest == f071984a... and distDigest == 80d1ba1d..., before == after, fresh label,
    taskCollectionComplete true. If the digest moved, every carried-forward gate and every attempt03 green is void.
  if_attempt04_green:
    definition: >-
      test lane 2412 / 2387 / 0 / 25 with the skip multiset equal to final-gates01/approved-historical-skips.json,
      guidedIncrementalTest 62/62, crossReplicaTest 2/2, SQL55 55/55, jacocoTestCoverageVerification executed and passed,
      requireFreshGuidedPartitions executed and passed, all static tasks passed.
    issue: CONCERNS
    why_not_pass: >-
      Three standing items are not defects and not fixable in 015 but keep the gate from being a clean PASS: ED-05
      (the in-image pin check is red for an external reason), the user waiver on ledger row 85 (clause only), and the
      carried known limitations. I-2 (CONTEXT_LOST swallow) is a non-blocking diagnosability concern to schedule.
      CONCERNS and PASS both move the story InReview to Done, so this is a labelling decision, not a delay.
    pass_variant: >-
      PASS is available only if the user or PO records that ED-05 is an accepted external item. That is their call, not QA's.
  if_attempt04_red:
    rerun_rule: >-
      One more full attempt (attempt05) is allowed only if every failure is (a) absent from attempt01-03, (b) green in a
      same-digest run, and (c) classified as infrastructure by a diagnosis that names a mechanism or at least a
      non-product cause. Two consecutive red full runs end the rerun loop and go to the user.
    stop_loss_context_lost: >-
      If CONTEXT_LOST at the context push recurs in any test or lane, do not rerun. That is the same unexplained
      product-path failure twice (attempt03 P1 and this one). Verdict FAIL (Status InReview to InProgress) until the user
      decides on the value-free logging change in the runner (I-2), which reopens the runner and image gates.
    deterministic_failure: >-
      Any failure that is not intermittent, or that touches a test which passed in attempt03 for a code reason: FAIL, back to Dex.
    jacoco_or_requirefresh_failure: >-
      FAIL. QA's offline estimate says JaCoCo has wide margin (see coverage_scope), so a JaCoCo failure would point to
      a configuration or exec problem; a requireFreshGuidedPartitions failure means a JOIN identity did not run exactly once and passed.
  never: "approve with a failing test, with taskCollectionComplete false, or on a digest other than f071984a"

