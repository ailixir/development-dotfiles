top_issues:
  - id: SEC-001
    severity: high
    owner: '@dev B14 (T2), signal choice ruled by @architect'
    where: 'backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedActionGuard.java:104-113; studio-runner/src/run/observationCollector.ts:365,431'
    finding: 'GuidedActionGuard.sideEffecting treats a click as side-effecting only when elementType is "link", or "button" with a formId. The collector emits <input type=submit|image|button|reset> as role "button", elementType "input" and controlType "other". A click on a form''s submit input is therefore not side-effecting, so DENY does not refuse it and CLARIFY_FIRST does not ask first. role=button custom controls (elementType "other") inside a form are missed too. The policy owner cannot see this gap. Found by reading the code; not run.'
    suggested_action: 'Classify by role (button/link) plus formId, or by elementType in {button, input} with role button. Add guard unit cases for input[type=submit] and input[type=image] under DENY and CLARIFY_FIRST. If the signal changes, re-run the S-9 calibration.'
  - id: TEST-001
    severity: high
    owner: '@dev B14 (T2) / root S4'
    where: 'backend/src/test/java/com/citi/put/checks/studio/guided/translation/GuidedActionGuardTest.java (pure unit only); backend/src/test/java/com/citi/put/checks/studio/support/ObservedPublicationFixture.java:677,814 (every joined IT seeds "ALLOW")'
    finding: 'AC-4, AC-5 and AC-6 name session-level oracles: "rejected, no dispatch", "nothing dispatched", "the submit click is refused and the session fails with the stated code", and CLARIFY_FIRST "raises one clarification ... before the first side-effecting dispatch". The only evidence is the pure GuidedActionGuard decision. The service wiring has no IT: GuidedTranslationService.guardAction (:1215) -> terminal POLICY_DENIED, the SIDE_EFFECT_CONFIRMATION question and the clarify() confirmation branch. Every joined IT seeds ALLOW, so the production default CLARIFY_FIRST (application default and normalization default) never runs end to end. A grep of backend/src/test finds no sideEffectConfirmation, CONFIRM_ACTION or SIDE_EFFECT_DENIED outside the unit tests.'
    suggested_action: 'Add ITs: (a) a planted ungrounded or destructive proposal leads to no prepare and no admission row, the session ends FAILED POLICY_DENIED, and a GUIDED_ACTION_REFUSED audit event is emitted; (b) a login submit under DENY leads to FAILED with the stated code; (c) under CLARIFY_FIRST, one AUTHORED-label question is asked before the first side-effecting dispatch, confirming continues, and no second question is asked.'
  - id: SEC-002
    severity: medium
    owner: '@dev B14 (T2)'
    where: 'backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:1224-1232; GuidedActionGuard.java:70-73,105'
    finding: 'If the model''s target nodeId is not in progress.observation.nodes, node stays null. Grounding then falls back to the locator name or value, which GuidedProposalValidator.action already forces to equal the model''s own targetIntent. sideEffecting also returns false for a null node. For this case the guard fails open on model-chosen text. The runner prepare check (validateInvocation -> TARGET_CHANGED, runtime.ts:180-184) probably refuses an unknown node, but QA inferred this and did not trace it.'
    suggested_action: 'For an element target (one with a nodeId), refuse UNGROUNDED_TARGET when the node is not in the frozen observation, and add a unit or IT case.'
  - id: TEST-002
    severity: medium
    owner: '@dev B14 (AC-8)'
    where: 'backend/src/main/java/com/citi/put/checks/studio/guided/session/GuidedSessionService.java:233-240; backend/src/test/java/com/citi/put/checks/studio/guided/session/GuidedCsiBudgetIT.java (4 cases)'
    finding: 'AC-8 oracle 3, "daily budget exhausted => next model call refused and the session ends BUDGET_EXCEEDED", has no dedicated assertion. GuidedCsiBudgetIT covers the two-replica concurrency refusal, the start refusal on an exhausted day, the conditional charge verdict and the start-up invariant. The mid-session path was seen only by accident in a failing root ReplayIT run (b14 s3bTriage).'
    suggested_action: 'Add one IT: exhaust the CSI day after start, then the next reservation ends the session FAILED BUDGET_EXCEEDED and charges nothing.'
  - id: REQ-001
    severity: medium
    owner: 'R14 / B14 / root S4'
    where: 'docs/stories/STUDIO-OBSERVED/STUDIO-OBS-014.story.md:254; docs/qa/evidence/STUDIO-OBS-014/b14/ledger.json t2.openNotDone, s3Applied.stillOpenFromS3'
    finding: 'Three AC-1 items are self-declared open. The first is the "runner accepts only v2" oracle; the runner refuses hash mismatches in general (policyHash.ts:23-36), but no case uses an approved v1 to v2 change. The second is the bootstrap-path definite-refusal IT. The third is the timeout negative control (ar-2-r14-stops ruling 2). The prepareAndAdmit path is covered by GuidedDispatchContextRefusalTest (ledger claim).'
    suggested_action: 'Land the three items in S4 or record a named @architect ruling that defers them.'
  - id: REQ-002
    severity: medium
    owner: '@dev B14 / @po'
    where: 'docs/qa/evidence/STUDIO-OBS-014/b14/ledger.json t2.testsWritten[0]'
    finding: 'AC-4 requires "the OBS-005/006 fixture corpus still passes (no regression in grounded cases, counted)". The evidence is a 5-target calibration corpus taken from joined-IT click targets (5/5 eligible), not a count over the OBS-005/006 fixture corpus. QA found no ruling that substitutes it.'
    suggested_action: 'Count grounding over the OBS-005/006 fixtures, or get a recorded @po/@architect acceptance of the substitute corpus.'
  - id: REL-001
    severity: medium
    owner: 'root (S4) / STUDIO-OBS-009 AC-12 observation'
    where: 'backend/src/test/java/com/citi/put/checks/studio/guided/publication/GuidedPublicationReplayIT.java:4491 (actualPublishedReportsWithoutLoginStepsAnnotatesExpiredProtection); studio-runner/src/server/runCoordinator.ts:26'
    finding: 'One intermediate S3b run hit a runner 503 on an ordinary dispatch, and the execution stayed PENDING. It did not recur in the next three full-class runs (ledger claim), and no root cause was found. Risk judgment: the outcome was fail-closed (no false pass, no secret). runCoordinator answers 503 when the API admission reply is non-200 or ambiguous. One plausible cause, inferred and unverified, is an API-side refusal while the same triage was rotating CSI and Core identity (BFF identity cache). It may also be a real admission race in the re-pointed claimObserved path (P1 deletion, refusal-code changes 2.1-2.3). QA rates this as not blocking alone, but it is open.'
    suggested_action: 'In S4, record runner coordinator codes for every dispatch. Any unattributed recurrence voids that run''s credit and escalates to @architect, as in 012A REL-001.'
  - id: OPS-001
    severity: medium
    owner: 'STUDIO-OBS-009 (tuning) / @pm'
    where: 'backend/src/main/resources/application.yml:211-216; GuidedCsiBudget.java:85-100'
    finding: 'The defaults 3 / 5,242,880 / 640,000 are unchanged and correctly kept. Charging each call at its ceiling with no refund caps output at 160 model calls per CSI per UTC day. Measured in ReplayIT, that is about 30k output tokens per learning session, so about 21 sessions per CSI per day. The ReplayIT exhaustion is product behaviour as ruled (AR-2 c), not a defect, but it is a capacity risk for teams that learn many tests. The config comment calls it an estimate.'
    suggested_action: 'OBS-009 sizes the defaults from the D-C benchmark. The runbook names the Retry-After-to-UTC-midnight behaviour.'
  - id: ARCH-001
    severity: low
    owner: '@architect (ratify)'
    where: 'GuidedActionGuard.java:19-20,82-93; b14 ledger t2.designDecisions[0]'
    finding: 'The guard order destructive -> grounding -> stance is a dev [AUTO-DECISION]. QA found no ratification in the AR-2 rulings it reviewed. The effect is that the planted "Delete account" for "Open reports" is refused as DESTRUCTIVE_VERB, not UNGROUNDED_TARGET. Both are closed refusals with no dispatch, so AC-4 holds, and the rationale (AC-5 stays reachable) is sound. A Cyrillic homoglyph label skips the vocabulary check but is still refused as ungrounded.'
    suggested_action: 'The architect ratifies the order in a dated note.'
  - id: TEST-003
    severity: low
    owner: '@dev B14'
    where: 'studio-runner/src/guided/transport.ts:103-107; studio-runner/src/guided/ownership.ts:123; studio-runner/test/guided/transport.test.ts:137'
    finding: 'Verified: a same-key replay of a refused context returns IDENTITY_MISMATCH whatever the original code was (SCHEMA or CONTEXT_LOST). The replay branch calls getRuntime(envelope), and no runtime exists. The test accepts either IDENTITY_MISMATCH or SCHEMA. The backend cannot reach this: every context send uses a fresh UUID key (GuidedRunnerClient.java:71-72), and both codes are definite (RUNTIME_INCOMPATIBLE). Fail-closed.'
