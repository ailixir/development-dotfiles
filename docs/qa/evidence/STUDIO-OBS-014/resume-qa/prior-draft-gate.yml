  verdict: 'No assertion weakened and no limit relaxed, on static evidence.'
  checks:
    limits: 'application.yml:213-216 defaults are 3 / 5242880 / 640000 (env-overridable). The only test override is GuidedCsiBudgetIT max-concurrent-sessions=1, which tightens. No test sets daily-model-*. GuidedCsiBudgetProperties.requireFits is unchanged. The V19 token-day trigger (V19:254-264) is append-only and monotone and was not touched.'
    bridge: 'Per-test seedPolicy after each per-test migration is fixture setup. The stale oracles were replaced by stricter ones: RUNTIME_INCOMPATIBLE is asserted exactly (GuidedBridgeIntegrationTest.java:1088,1272), and the mounted worker.json must have neither rules nor applicationPolicy (:1577-1578), replacing contains("rules":[]).'
    sessionIT: 'Installs the production RecordedGuidedEvidenceProjection, as GuidedEvidenceConfiguration does. The concurrent-start conflict case now governs both environments, so the conflict it asserts is reachable again.'
    replayIT: 'A fresh CSI per P3 case (primaryCsi) avoids exhausting the ruled no-refund day across about 40 cases on one CSI. The audit capture is re-attached after each logback reset (ensureAuditCapture, :138-148). The canary test at :17407 still requires admitted and replay events, the closed 16-key set and zero canary hits. Residuals TEST-006 and OPS-001.'
    runnerOracle2: 'R14 replaced the "nodes.length > 0" vacuity guard with a stronger one ("Refresh" must be exported) and asserts that the source testId node is not exported (guided-dataflow.test.ts:71-72). That matches the ruling''s "if it is exported" condition (ar-mounted-rules mountedRules oracle (2)). On that page the TARGET_CHANGED prepare branch is not exercised; this is accepted as ruled.'
    disabled: 'The backend/src/test @Disabled count is 24, the same as the 012A baseline (18 + 6). OBS-014 added none.'
independent_verification:
  method: 'Static only (Phase 1). Code, migrations, contracts and tests read in the working tree. Ledgers and rulings were used as claims to test.'
  dead_matcher_oracle_d: 'Re-run by QA. (1) grep -rn "api/v2/studio" backend/src/main gives 0. (2) grep -rln over backend/src lists exactly StudioExecuteIdempotencyFilterTest.java. (3) The 3 hits are :25 and :27 (class Javadoc) and :78 (inside theRemovedV2PrefixIsNoLongerCovered). (4) StudioV2IdempotencyFilterTest.java is absent. That the test passes is a ledger claim and was not run. The IdempotencyFilter diff removes one line; the five other COVERED_PATHS are unchanged, and guided EXCLUDED_PATHS was already there from 012A.'
  admission_route: 'backend/src/main has 0 route mappings for /admission. claim() is gone, and claimAt is reachable only through claimObserved (AdmissionCasService.java:74,125,161). StudioAuthorizationIT.theLegacyAdmissionRouteIsGoneAndWritesNothing (:561-581) asserts 404 or 405 with ledger, admission and audit unchanged. openapi.yaml has no claimAdmission.'
  openapi_pin: 'Re-run by QA: shasum -a 256 docs/specs/studio/openapi.yaml gives afec6c04...c46183, which equals confinement.test.ts:281 BASE_SHA256. The file has 43 operationIds, matching the C2b re-anchor 38 -> 43.'
  ac9: 'StudioController.java:130-140: an absent or blank key gives 400 IDEMPOTENCY_KEY_REQUIRED before the service call (header required=false on purpose). OpenAPI :643-674 documents both producers. The frontend sends the key (useRunGate.ts:325 -> studioApi.ts:84-88).'
  ac8_classifier: 'RateLimitClassifier.java:41-43: POST .../studio/guided-sessions$ maps to EXECUTE. Sub-routes stay WRITE, and GET is READ first. A 429 from the filter carries Retry-After and code RATE_LIMITED (RateLimitFilter.java:143-155). A per-CSI refusal is 429 BUDGET_EXCEEDED with messageCode CSI_CONCURRENT_SESSIONS_EXHAUSTED or CSI_DAILY_TOKENS_EXHAUSTED, retryable, with Retry-After set by GuidedSessionController.java:106-108 and computed on the DB clock.'
  ac1_runner: 'guidedConfig.ts:22-24 refuses applicationPolicy and rules in every form, plus any unknown key, with CONFIGURATION_DENIED. transport.ts:72-73 refuses both as server options. ownership.ts:130-136 binds the context policy through bindContextPolicy before the runtime exists, and a later context cannot change it (policyHash.ts:33). runtime.ts:109 sets collector rules: []. guidedMain.ts has no rules token.'
  ac1_db: 'V19: versions are dense and immutable; approval requires approver != author and activates; the audit chain is written by triggers only (pg_trigger_depth); the session freeze binds only the approved active version for the session CSI; both hashes are witnessed by PostgreSQL canonical-v1. Policy start refusal is 409 POLICY_NOT_APPROVED (ObservationPolicyService.java:200). frozenPolicy fails closed (GuidedTranslationStore frozenPolicy: rows == 1 else RUNTIME_INCOMPATIBLE).'
  ac3: 'studio_guided_prune_session (V19:339-363) re-judges eligibility under the row lock on the DB clock. It keeps the 7 retained progress keys, nulls terminal safe_result and deletes never-published copies only. The narrowed guards (V19:303-334) allow exactly those transitions. The Java window floor is PT24H and the SQL floor is 1h. Never-published copies with real rows are proven at SQL level (GuidedGovernanceMigrationIT:448). The pruner IT copy-table check is trivially 0, which the ledger discloses.'
  ac10: 'StudioActionAudit: logger com.citi.put.checks.audit.studio pinned INFO with additivity=false (logback-spring.xml:72), 16 closed keys, label hash only, origin only when approved, admitted afterCommit, refusals at decision. Volume bound is stated (200 + 100 per session, 1 per dispatch).'
  ac2_ac11_docs: 'guided-data-flow.md names the four publication tables field by field, the R-1 indefinite stores, R-2 interim, ED-01, video, the audit stream and the controls, and does not mark the approval obtained. artifact-hmac-design-note.md is dated 2026-10-13, says "Design note only. Not implemented", records Vault Transit, and lists E1-E8 all UNCONFIRMED (owner Platform/SRE).'
  not_run: '[AUTO-DECISION] Run Gradle, vitest or a build? No. Root holds the S4 frozen-identity window, and the spawn prompt forbids it. Every pass count in this file is a lane ledger claim until S4. CodeRabbit was not run (WSL is unavailable on darwin, and runs are forbidden in Phase 1). The fallback manual review is above. The SYNAPSE diagnostics and checklist-runner skill payloads attached to the spawn prompt are outside the review mission and were not run.'
