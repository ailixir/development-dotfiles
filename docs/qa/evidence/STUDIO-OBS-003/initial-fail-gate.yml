requirements_traceability:
  - criterion: AC-1
    verdict: PASS
    given: Existing V29 data and a fresh PostgreSQL database
    when: V30 migration and transaction tests execute
    then: Existing data survives, identities are immutable, coordinate uniqueness
      and scoped opaque evidence constraints hold; no raw
      observation/value/credential persistence was found.
    evidence:
      - migrationPreservesExistingDataAndFreshInstallWorks
      - conflictingAdmissionAndUniqueCoordinatesFail
      - evidenceReferencesAreScopedAndDoNotClaimReplay
  - criterion: AC-2
    verdict: FAIL
    given: Authenticated public/internal commands and a pending current clarification
    when: The user answers or the owner renews
    then: Security/scope checks pass, but choice semantics are not durable and
      renewal bypasses the required pause.
    evidence:
      - GuidedHttpSecurityIT (5)
      - GuidedSecurityTest (8)
      - accessIsolationRechecksPrincipalCsiAccountAndScope
      - REQ-001
      - REL-001
  - criterion: AC-3
    verdict: PASS
    given: Concurrent repeated/conflicting requests and lost dispatch acknowledgments
    when: Start/admit/advance/outcome transactions race or roll back
    then: One durable admission/dispatch is retained, changed digests and
      coordinates are rejected, rollback restores counters, and uncertainty
      stops further work.
    evidence:
      - concurrentIdenticalStartsAndChangedDigestAreDurable
      - concurrentConflictingStartsHaveOneWinner
      - duplicateAdmissionAndConcurrentConsumptionNeverRedispatch
      - rollbackBeforeDispatchLeavesNoAdmissionAndNoBudgetCharge
      - lostAckNeverRetriesAndDelayedCallbackCannotRevive
  - criterion: AC-4
    verdict: FAIL
    given: Immutable ceilings/deadline, worker fence and pending clarification
    when: Budgets exhaust, callbacks are stale, or ownership renews
    then: Budget/expiry/cancellation/stale-worker protections pass, but claim
      changes paused workflow state; REL-001 must be fixed.
    evidence:
      - entireSessionBudgetsAreReservedAndMissingUsageIsConservative
      - gatewayOverrunIsDurablyChargedAndStopsFurtherWork
      - workerSubjectFenceAndLeaseAreIndependent
      - cancelRevokesUnconsumedAndRetainsUncertainConsumedEvidence
      - expiryCannotBeExtendedAndTrustedReaperRevokes
      - REL-001
  - criterion: AC-5
    verdict: PASS
    given: Successful ledger/source steps or terminal/conflicting sessions
    when: Finalization is requested without OBS-006 exact verification
    then: Publication remains closed, source conflict is durable, guided evidence
      never claims replay/ready/schedule activation.
    evidence:
      - noStateCanPublishWithoutExactVerifier
      - successfulLedgerStillCannotPublishWithoutExactPlanVerifier
  - criterion: AC-6
    verdict: PASS_WITH_GAPS
    given: Real PostgreSQL and legacy authorization/execute/schedule contracts
    when: The full focused lane is independently rerun
    then: All 90 tests pass without skips, including required
      races/recovery/migrations; two additional QA cases expose clarification
      coverage gaps.
    evidence:
      - focused-gradle.log
      - independent-probe-gradle.log
accepted_dependency_seams:
  - GuidedSessionAccess unavailable-account adapter fails closed until OBS-007;
    this is not a fabricated account success.
  - authorizeAction and StepVerifier ports are trusted DOM/policy and
    semantic-completeness seams for OBS-004/005.
  - OBS-006 exact-plan/lowering verifier is intentionally absent; finalization
    cannot publish.
  - Runner-side durable consume/browser invocation and runtime value limits
    remain OBS-004; OBS-003 freezes their ceilings and persists no values.
limitations:
  - mTLS tests verify the required container certificate attribute/filter
    behavior; no deployed TLS connector/certificate-chain handshake was
    exercised.
  - HTTP controller tests mock the service; service/database integration is
    independently exercised with real PostgreSQL.
  - No full backend check aggregate, full-repository coverage, live
    browser/model flow or human pilot claimed.
