schema: 1
story: STUDIO-OBS-003
gate: FAIL
status_reason: The durable ledger, security isolation and focused regressions
  pass, but clarification answers are discarded and lease renewal bypasses the
  mandatory user-answer pause. Two independent real-PostgreSQL probes reproduce
  these AC-2/AC-4 failures.
reviewer: Quinn (@qa), independent agent /root/sdc_obs003_qa
reviewed_revision: sha256:472044d3e2f354922ee4a87876ec0203e063dcc231a1efb970ba6d316d85e3ce
updated: 2026-10-08T03:41:00.619986+00:00
top_issues:
  - id: REQ-001
    severity: high
    finding: "Accepted clarification choices are discarded: clarify removes the
      question and persists OBSERVING without the chosen choice or a durable
      resolved-choice handoff. The command table contains only the request
      digest and public response. A restart/downstream planner cannot consume
      the user answer, so the advertised clarify command has no durable semantic
      effect."
    location: backend/src/main/java/com/citi/put/checks/studio/guided/session/GuidedSessionService.java:206
    suggested_action: Persist a safe scoped selection (question, chosen
      identity/mapping, coordinate, document and generation) atomically before
      removing the pending question; expose a trusted consumption seam for
      OBS-005 and prove restart/idempotent answer recovery without persisting
      runtime values.
    test: GuidedIndependentQAProbeIT.acceptedClarificationMustPersistSelectedChoiceForRecovery
  - id: REL-001
    severity: high
    finding: A same-owner lease renewal unconditionally overwrites
      AWAITING_CLARIFICATION with OBSERVING. The worker can then submit a new
      observation without a user answer, while the pending answer is rejected as
      STALE_GENERATION because its required session state disappeared. Ownership
      maintenance bypasses the frozen clarification state-machine guard.
    location: backend/src/main/java/com/citi/put/checks/studio/guided/session/GuidedSessionService.java:307
    suggested_action: Separate lease/fence maintenance from workflow transitions.
      Preserve clarification/auth/finalizing pauses or explicitly
      invalidate/reissue them through their guarded transition; do not use claim
      as an unconditional OBSERVING reset. Cover renewal and recoverable
      takeover during each pause and after finalizing.
    test: GuidedIndependentQAProbeIT.leaseRenewalMustNotBypassPendingClarification
  - id: DOC-001
    severity: medium
    finding: Frozen OpenAPI and normative README describe public PlatformBearer JWT
      authentication, while the public implementation deliberately preserves
      existing BFF authentication and rejects bearer-only identity. Package
      README documents the mismatch, but generated consumers still receive an
      inaccurate contract. No authentication widening was found.
    location: docs/specs/studio-observed-authoring/openapi.yaml:1173
    suggested_action: Have the contract owner reconcile the public authentication
      wording/scheme with the established BFF transport before client
      integration; preserve the current isolation and do not add JWT auth merely
      to satisfy the stale wording.
