apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-put-checks-api
  labels:
    helm.sh/chart: put-checks-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: put-platform
