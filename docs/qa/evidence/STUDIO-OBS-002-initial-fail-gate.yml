top_issues:
  - id: SEC-001
    severity: high
    finding: Referenced text bypasses source sensitivity. External
      aria-labelledby/native-label relationships export text from data-sensitive
      or aria-hidden ancestors; a label associated with a password is exported
      through another button. The traversal denied flag protects the source
      node, but name extraction checks only the referenced element itself. Four
      independent payload-byte canaries leak.
    source: studio-runner/src/run/observationCollector.ts:33,106,120-135,152
    suggested_action: Apply the same ancestor/field/region/label sensitivity
      eligibility to every name source, including ARIA references, native
      labels, inline children and DOM fallback. Refuse unsafe references and
      scrub all exported names/hints. Add the four exact browser regressions
      without requiring control mappings.
    evidence:
      - sensitive-ancestor-aria-label
      - sensitive-ancestor-native-label
      - password-label-aliased
      - aria-hidden-ancestor-label
  - id: SEC-002
    severity: high
    finding: Known/input-value redaction compares raw secrets against already
      whitespace-normalized names. An input with value CUSTOMER  CANARY and a
      matching button text exports CUSTOMER CANARY in name and role hint. This
      is ordinary input data transformed by the collector, not unknown PII.
    source: studio-runner/src/run/observationCollector.ts:52,77,101,131,212-216
    suggested_action: Preserve raw name-source taint or scrub all transformations
      used by export, including normalized known secrets and input values,
      before serialization. Add whitespace/newline/Unicode whitespace canaries
      and positive nonsecret-name cases.
    evidence:
      - normalized-input-echo
  - id: REL-001
    severity: high
    finding: The closed resolver returns true where actual exact Playwright locators
      are ambiguous or resolve zero elements. It misses default-submit and
      title-only button names, treats repeated aria-labelledby IDs as repeated
      names, excludes non-input aria-label targets from label matching, and
      ignores open-shadow matches even after marking unsupportedSurface. Five
      independent false accepts violate unique durable-locator equivalence.
    source: studio-runner/src/run/observationCollector.ts:121-129,138-173,236-250
    suggested_action: Use a reviewed bounded semantic subset that fails closed for
      every unmodeled competitor and unsupported surface; ensure every positive
      proof agrees with actual Playwright semantics and strict Element identity.
      Handle/refuse repeated ARIA IDs, default/title names, non-input label
      matches and shadow competitors. Keep isolated-world secrecy, no DOM
      markers/private APIs, and generic no-control-mapping discovery. Add
      differential browser regressions for each case.
    evidence:
      - default-submit-duplicate
      - title-button-duplicate
      - duplicate-aria-references
      - label-noninput-duplicate
      - shadow-button-duplicate
