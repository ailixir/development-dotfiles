requirements_traceability:
  - criterion: AC-1
    verdict: PASS
    given: One trusted application policy and zero field mappings
    when: Production observation runs against ordinary DOM controls and hostile
      main-world patches
    then: Fixed collector discovers structural controls in a dedicated CDP isolated
      world with private Element handles; main-world prototype interception
      cannot steal secrets. Existing real-browser cases pass.
  - criterion: AC-2
    verdict: PASS
    given: Current evidence and configured lower traversal limits
    when: Navigation, document/element replacement, CSSOM mutation, input property
      changes and Unicode/count/depth/byte bounds occur
    then: Existing Chromium cases reject stale targets and bound exports; generation
      advances session-wide, canonical hash is immutable, and incomplete
      traversal clears nodes.
  - criterion: AC-3
    verdict: FAIL
    given: Sensitive labels referenced outside denied regions or
      whitespace-normalized input echoes
    when: Generic structural observation exports canonical JSON
    then: Five planted canaries leak; SEC-001 and SEC-002 block acceptance.
  - criterion: AC-4
    verdict: PASS
    given: Semantic data is insufficient for adjacent dt/dd and th/td values
    when: Generic collector observes the current page
    then: Bounded DOM fallback exports safe structural terms and local identities,
      explicitly empty relational hints, and unsupported/budget coverage. Future
      dialog content is absent until observed; privacy edge defects are
      separately AC-3.
  - criterion: AC-5
    verdict: FAIL
    given: Supported exact hints with title/default names, repeated ARIA IDs,
      non-input labels or shadow competitors
    when: Collector proof is compared to actual Playwright locator count
    then: Five positive proofs are false; live Element retention alone does not
      establish durable-selector equivalence (REL-001).
  - criterion: AC-6
    verdict: FAIL
    given: Twelve supplied Chromium tests and independent adversarial variants
    when: Final exported bytes and actual exact locator behavior are checked
    then: Supplied tests pass but miss the blocking privacy and equivalence
      variants. Preserve baseline tests and add the independent failures as
      regressions.
architecture_assessment:
  approved: Dedicated isolated world, no universal access, fixed function source,
    no DOM markers/event bridge/private Playwright API, generic application
    structural policy and no model traversal. Browser imports remain confined.
    Unsupported relational hints are honestly empty.
  blocking: Hand-implemented accessibility semantics are not sufficiently
    conservative to support claimed locator equivalence, and privacy source
    eligibility differs between traversal and relationship resolution.
limitations:
