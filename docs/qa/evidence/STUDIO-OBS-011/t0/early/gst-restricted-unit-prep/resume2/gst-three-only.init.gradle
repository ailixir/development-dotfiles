// One-off GS-T target override. No formatter-step/build-source change.
import java.nio.file.Files

gradle.projectsEvaluated {
    def p = gradle.rootProject
    def expectedProject = new File('/Users/brunobuger/orca/workspaces/put-checks/ui-studio/backend').canonicalFile
    // Only the observed exact buildSrc child may bypass this main-build formatter hook.
    def expectedAuxiliary = new File(expectedProject, 'buildSrc')
    if (p.projectDir.canonicalFile == expectedAuxiliary && gradle.parent != null) return
    if (p.projectDir.canonicalFile != expectedProject) throw new GradleException('GST_HOLD_PROJECT')
    def relative = [
        'src/test/java/com/citi/put/checks/studio/guided/session/GuidedSessionIT.java',
        'src/test/java/com/citi/put/checks/studio/guided/session/GuidedLifecycleReasonIT.java',
        'src/test/java/com/citi/put/checks/studio/guided/session/GuidedServiceTransportFaultIT.java'
    ] as Set
    def exactFiles = p.files(relative.collect { p.file(it) })
    def expected = exactFiles.files.collect { it.canonicalFile } as Set
    if (expected.size() != 3 || exactFiles.files.any { !it.isFile() || Files.isSymbolicLink(it.toPath()) })
        throw new GradleException('GST_HOLD_INPUTS')
    // target() and setTarget() are replacement assignments in cached Spotless6.25.0.
    p.extensions.getByName('spotless').java { target(exactFiles) }
    def javaTask = p.tasks.named('spotlessJava').get()
    javaTask.setTarget(exactFiles)
    def checkTarget = {
        if ((javaTask.getTarget().files.collect { it.canonicalFile } as Set) != expected)
            throw new GradleException('GST_HOLD_TARGET')
    }
    checkTarget()
    javaTask.doFirst { checkTarget() }
    p.tasks.named('spotlessJavaApply').get().doFirst {
        checkTarget()
        // Apply copies every staged relative output: reject old/broad outputs before any copy.
        def out = javaTask.getOutputDirectory()
        p.fileTree(out).visit { item ->
            if (Files.isSymbolicLink(item.file.toPath())) throw new GradleException('GST_HOLD_OUTPUT_LINK')
            if (!item.directory && !relative.contains(item.relativePath.pathString.replace('\\', '/')))
                throw new GradleException('GST_HOLD_STAGED_OUTPUT')
        }
    }
    gradle.taskGraph.whenReady { graph ->
        checkTarget()
        def allowed = ['spotlessJava', 'spotlessJavaApply', 'spotlessInternalRegisterDependencies'] as Set
        if (graph.allTasks.any { it.name.startsWith('spotless') && (it.project != p || !allowed.contains(it.name)) })
            throw new GradleException('GST_HOLD_GRAPH')
    }
}
