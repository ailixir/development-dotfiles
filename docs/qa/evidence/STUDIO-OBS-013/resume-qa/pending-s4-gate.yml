independent_verification:
  method: 'Static read of the working tree against AR-1, its C1 addendum and the lane ledgers. Ledgers were treated as claims; each item below was re-read in code. No test or build was executed.'
  b13_F1_canonical_echo: 'VERIFIED in code. GuidedSessionEvidenceService.java:126-133 re-canonicalizes the stored jsonb echo (canonicalCopy = contracts.parse(GuidedContracts.canonical(node))), and :160-162 stores and returns the canonical echo on first acceptance. GuidedSessionVideoIT.java:221-224 asserts byte equality of the first and resent 202 bodies plus exactly one V20 row. Identity is checked before the duplicate lookup (:93-120), so a different caller cannot be echoed a stored response. Run evidence (run4 6/6, run5 7/7) is ledger-only, not re-run.'
  object_keys: 'VERIFIED. Java GuidedRecordingKeys.java:26-46 and Node guided/evidence.ts:50-68 both derive studio/{csiId}/guided/{sessionId}.webm|.manifest.json and fail closed on any segment outside ^[A-Za-z0-9_-]{1,256}$ (Java uses matches(); JS anchors without the m flag). fixtures.json guidedRecordingKeyVector: 2 derived, 7 refused (/, .., ., empty). The read route re-derives the key from document.scope.csiId (GuidedSessionVideoController.java:96-100) and never reads video_key. No key appears in result, session-view or the video route body or headers (GuidedSessionVideoIT:350-375, by reading).'
  v20_regex: 'VERIFIED. V20:21 recording_id varchar(256) CHECK (~ ''^[A-Za-z0-9_-]+$''). Equivalent to the ruled 1..256 set; see ARCH-002. Immutability trigger, the storable state subset, partial/expiry/timings CHECKs and the (session_id, scope_hash) FK match AR-1 R5 verbatim. Head pin: InferenceMigrationLatestIT.java:100 expects 20.'
  video_evidence_non_null: 'VERIFIED. v3/result.schema.json evidence.video = {$ref videoEvidence} (null invalid). videoEvidence is closed {status,error,expiresAt,partial}, uses the VideoStatus enum verbatim and has the three allOf invariants. 0 "video": null literals remain in fixtures.json and publication-fixtures.json. Both builders take the one projection: GuidedSessionService.java:96 and :2429, GuidedPublicationResultProjector.java:57 and :136, wired in GuidedEvidenceConfiguration.java:58-66. Expiry, the window and recorded_at are judged in SQL with clock_timestamp() (GuidedSessionEvidenceRepository.java:95-181).'
  action_timings_cap: 'VERIFIED. result.actionTimings maxItems 400, items $ref the single action-timing.schema.json (alias at result#/definitions/actionTiming; D-1 ratified). bridge timings maxItems 200. Backend GuidedRecordingTimings.java:63,99,101 enforces per-kind caps against session limits and MAX_ITEMS 400, kind=action only, ledger dispatchCount 1, strict R2 order and the scale guard. V20 CHECK caps the array at 400 and 262144 octets. The runner stops stamping at 200 (evidence.ts:191).'
  secrets_not_logged: 'VERIFIED statically. guided/evidence.ts, objectStoreFactory.ts, guidedBrowser.ts and manifest.ts have no console or stderr writes, and backend guided/evidence/** has no logger. Callback body and manifest carry IDs, integers, enums and the constant disclosure only. The manifest redactor is empty by design, because stop() wipes secrets first. Timing stamps carry admissionId/stepId/ordinal only (runtime.ts:251), including the password-fill path. No tracing/recordHar/screenshot in src (noRunnerSinks.test.ts:17 pattern, grep 0). Runtime proof (canary scan with recording on) is TEST-002.'
  ac4_sse: 'N/A per the @po clarification (story :34-46). Re-verified: SseEmitter/text-event-stream appear only in studio/sse/** and ChecksExceptionHandler. No guided operation in openapi.yaml is an event stream.'
  contracts_and_pins: 'getGuidedSessionVideo exists (openapi.yaml:1565-1636, statuses 200,206,401,403,404,410,416,503). getExecutionVideo 404/410/416 now $ref the shared components (:1127-1129; E-1 switch landed). sha256(openapi.yaml) = afec6c04...6183 = confinement.test.ts:281 BASE_SHA256. StudioContractTest pins 43 operations (:311-312), with the C1 38 -> 39 movement in the comment (:306). The contract tool was not re-run by QA (frozen window).'
  not_run: 'Per the root instruction, QA ran no Gradle, vitest, contract tool or build. CodeRabbit was not run (WSL-only skill; this host is darwin). The fallback was this manual review. The SYNAPSE diagnostics, coderabbit-review and checklist-runner skill text attached to the spawn prompt is outside the gate mission and was not executed.'
code_review:
  GuidedSessionEvidenceService: 'SOUND. Role, key, fence and schema run before the lock. Identity, fence and the materialized context (live filter deliberately off, SC-1 verified: stop() never writes document.owner) run before the duplicate lookup. Then the DB-clock window, write-once, semantic timings, key derivation and the insert with one clock_timestamp() sample. Session state is never mutated (no active()), matching the reconcileLateModelUsage precedent.'
  RecordedGuidedEvidenceProjection: 'SOUND. It follows the R1 table in order. EXPIRED drops timings, FAILED uses the fixed API text, and NO_RECORDING_STORE is the shared constant. The state comes from the caller''s lock or from the same-statement read. See ARCH-001(c) for precedence.'
  VideoObjectServer_extraction: 'SOUND by reading. Steps 4-5 moved verbatim; ExecutionVideoService keeps steps 1-3. Nit: with download=true, identityOf() calls ledger.find twice.'
  runner_recording: 'SOUND by reading. recordVideo is on the existing launchPersistentContext only. ready() takes the single origin via takeRunOrigin, with the calibration injected and no performance.now default for the origin. The settle order (context.close, classify, upload, manifest, callback with 3 same-key attempts, rm dir) never rejects and never fakes STORED. Recorder faults map to UNAVAILABLE and store faults to FAILED. The scale violation drops timings and keeps the video.'
