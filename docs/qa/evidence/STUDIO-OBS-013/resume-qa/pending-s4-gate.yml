top_issues:
  - id: TEST-001
    severity: high
    category: tests / requirements
    owner: 'root S3/S4 joined-proof lane (@dev)'
    location: 'backend/src/test/java/com/citi/put/checks/studio/guided/publication/GuidedPublicationReplayIT.java:16029-16036'
    finding: 'AC-6 joined proof is missing. AC-6 requires a test with real backend + PostgreSQL + runner guided mode + Chromium, where a guided learn run on the OBS-007 login fixture yields: video AVAILABLE; an authenticated 206 on GET /guided-sessions/{id}/video; one offset per step and per dispatched action; a canary-free manifest; and UNAVAILABLE plus a terminal session after a recorder fault. No backend test does this. Grep: no test requests the guided /video route except GuidedSessionVideoIT, which seeds V20 rows and synthetic bytes (its Javadoc :50 says it proves the backend half only). The only joined assertion is GuidedPublicationReplayIT:16036 `isIn("UNAVAILABLE","PROCESSING")`, with the comment "never AVAILABLE here". That assertion also passes when recording is entirely broken. The recorder-fault and parity cases exist only runner-side, in fixtures-tier/guided-recording.test.ts.'
    suggested_action: 'Add the AC-6 joined case (AVAILABLE, a 206 range read on the guided route, timings count = dispatched actions + derived steps, manifest canary scan, a recorder-fault session ending UNAVAILABLE and terminal). Run it in S4 with the replay-video regression in the same class. Do not count the isIn(...) assertion as AC-6 evidence.'
