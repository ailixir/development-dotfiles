    severity: medium
    category: docs / traceability
    owner: 'root / @dev (File List and Dev Agent Record)'
    location: 'docs/stories/STUDIO-OBSERVED/STUDIO-OBS-013.story.md:105-117 (File List), :127-143 (Dev Agent Record)'
    finding: 'The story is not reconciled. The File List is still "proposed". These files are actually touched and are not listed: objectStoreFactory.ts, childRuntime.ts, server/config.ts, server/application.ts, guidedMain.ts, and R14''s transport.ts/ownership.ts hunks; ContractDocument.java, ExecutionVideoEvidenceIT.java, ExecutionSnapshotMapper.java, GuidedInternalSecurity.java and the GuidedSessionService hunk; V20, GuidedRecordingMigrationIT, action-timing.schema.json and the checker. The Dev Agent Record covers B13 only, with no R13, R14, C1 or D entries. T0-T4 are unchecked. AC-3 requires "old/new quoted" for the pins, but the story quotes neither. The C1 ledger has BASE_SHA256 f502160e...e823e6 -> d40c744d...608e and op count 38 -> 39. The current values afec6c04...6183 and 43 come from OBS-014 C2a/C2b.'
    suggested_action: 'Reconcile before InReview. Quote the C1 pin movement and name the later OBS-014 moves.'
  - id: TEST-003
    severity: low
    category: tests / security
    owner: 'B13 (@dev)'
    location: 'backend/src/test/java/com/citi/put/checks/studio/guided/evidence/GuidedSessionVideoIT.java:331-375'
    finding: 'AR-1 negativeTestExpectations asks for no public body, header or log line at INFO or above containing video_key, manifest_key, a bucket or an endpoint. The IT sweeps bodies and headers only and captures no log. A static read shows no new log statement in guided/evidence/** or runner guided/evidence.ts. The one WARN at VideoObjectServer.java:120-121 logs the store cause, which by design names bucket and endpoint. That is the execution precedent, but it contradicts the AR-1 log clause as written.'
    suggested_action: 'Add an OutputCapture sweep, or have @architect restate the log clause to match the "logged, never sent" precedent.'
  - id: ARCH-001
    severity: low
    category: code / performance
    owner: '@architect (ratify) / B13'
    location: 'GuidedSessionVideoController.java:84; GuidedSessionEvidenceService.java:89-128; RecordedGuidedEvidenceProjection.java:73-77'
    finding: 'Three B13 auto-decisions are flagged "for @architect" and no ratification exists in STUDIO-OBSERVED-NEXT/. (a) The video route authorizes through GuidedSessionController.read instead of the ruled GuidedSessionService.read. That is stronger for published sessions, but every range request now runs a full session read (row lock, and a Core call on the publication branch), and video players issue many range requests. (b) Identity is checked before the idempotent duplicate lookup, which reverses AR-1 steps 5/6. QA agrees with this order. (c) AVAILABLE with no store and expired answers UNAVAILABLE; executions check EXPIRED first.'
    suggested_action: '@architect ratifies or amends all three. Measure (a) under range-request load in OBS-008.'
  - id: ARCH-002
    severity: low
    category: docs
    owner: '@architect'
    location: 'docs/qa/evidence/STUDIO-OBSERVED-NEXT/ar-1-obs013.json R5 ddl_normative; backend/src/main/resources/db/migration/V20__guided_session_recording.sql:21'
    finding: 'AR-1 R5 still states the CHECK as ^[A-Za-z0-9_-]{1,256}$, which PostgreSQL rejects (bound max 255). V20 uses ^[A-Za-z0-9_-]+$ with varchar(256). QA verified the equivalence by reasoning (the class is ASCII-only, so character count = length, 1..256) and by the IT cases at GuidedRecordingMigrationIT.java:203-209 (a/b and "" refused, 256 accepted, 257 too long; not run by QA). The bridge schema, Java and Node keep {1,256}, which is valid in those engines.'
    suggested_action: 'Amend the AR-1 R5 text so the ruling and the migration agree.'
