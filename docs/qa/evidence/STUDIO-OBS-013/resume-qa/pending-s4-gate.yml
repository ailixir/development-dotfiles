  - id: SEC-001
    severity: medium
    category: security / privacy
    owner: '@architect (ruling, AR-1 R4 x SC-3) then R13 (@dev) to implement'
    location: 'studio-runner/src/run/browser.ts:544-546 (recording ready() before verifyBrowserPreferences) and :58-68 (chrome://version, chrome://prefs-internals)'
    finding: '[AUTO-DECISION] Is the ~0.6 s of chrome:// frames at the start of each guided video a finding? Yes, MEDIUM. Reason: the recording starts at launchPersistentContext, and verifyBrowserPreferences then navigates the recorded page to chrome://version (profile path, executable path, command line, Chromium version) and to chrome://prefs-internals (the effective preference JSON) before about:blank. Every CSI reader can stream or download that runtime-internals footage. Replay closed this deliberately: browser.ts:155-160 deletes the startup video and opens a fresh app page. The guided path therefore regresses an established control. The frames show no secret and no user data (fresh profile, pre-written Preferences). For that reason this is not high. Duration: R13 R-1 says ~0.6 s; the probe log corroborates it indirectly (first action startMs 582). QA did not decode a video.'
    suggested_action: '@architect rules. Option 1: run the preference probe before the recorded app page exists, as replay does (record, verify, close, delete the startup video, open a fresh page, then take the origin at the new page''s readiness). Option 2: an explicit waiver with a disclosure line. Fix or waiver before PASS.'
