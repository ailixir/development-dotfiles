    location: 'studio-runner/test/fixtures-tier/guided-recording.test.ts:108-147; docs/qa/evidence/STUDIO-OBS-013/r13/ledger.json fixturesTier'
    finding: 'The AC-1 adapter-parity proof, the recorder-fault UNAVAILABLE case and the canary scan with recording on have run only as a scratch-root probe: an in-process import with no fixtures config and no globalSetup, 4/4. They have not run in the real fixtures tier, and the R13 ledger records "fixturesTier: NOT RUN". Backend lane runs run1-run6 were per-class holds on moving trees; the last ones (run5 28/0, run6 21/0) predate the frozen identity. GuidedSessionIT, GuidedBridgeIntegrationTest, GuidedPlanningIntegrationTest, GuidedPublicationReplayIT, ExecutionVideoEvidenceIT (full), ExecutionVideoAuthorizationIT, GuidedRecordingMigrationIT, InferenceMigrationLatestIT and StudioContractTest have no QA-visible run with the projection installed and V20 at head.'
