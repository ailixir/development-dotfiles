top_issues:
  - id: REL-002
    severity: medium
    owner: "@dev runner owner + @architect"
    story_placement: STUDIO-OBS-009 P3 startup/termination reliability
    finding: One tightened-oracle launch failed CONTEXT_LOST before any oracle under reported load about 20; 80
      diagnostics did not reproduce it. Subsequent runs and S4c passed, but the cause remains unknown.
    suggested_action: Preserve launch diagnostics and establish the failure cause and startup bound under
      representative load before the deployed integrated gate; do not count the failed attempt as passed.
  - id: REL-001
    severity: low
    owner: "@dev runner owner"
    story_placement: STUDIO-OBS-009 startup cleanup
    finding: A SIGKILL can leave TMPDIR/checks-recording-* WebM files; normal settlement deletes them, but no
      startup sweep exists.
    suggested_action: Add a bounded startup sweep and prove crash-residue cleanup in the folded runner.
  - id: ARCH-001
    severity: low
    owner: "@architect; @dev playback owner"
    story_placement: STUDIO-OBS-013 ruling addendum; STUDIO-OBS-008 range-read performance
    finding: "Three tested implementation choices still lack explicit architect ratification: controller-read
      authorization on every range request, identity-before-idempotent-echo, and no-store-before-expired
      projection. Range authorization performs a full session read and can call Core."
    suggested_action: Ratify the choices and measure repeated range reads under playback load in OBS-008.
  - id: TEST-003
    severity: low
    owner: "@architect + @dev evidence owner"
    story_placement: STUDIO-OBS-010 evidence access/logging review; OBS-013 AR-1 addendum
    finding: "Body/header secrecy is tested, but the AR-1 INFO+ log prohibition is not: the reused
      VideoObjectServer WARN logs a store cause that can name bucket/endpoint, following the execution
      precedent. No secret-value leak was identified."
    suggested_action: Reconcile the architect log clause with the shared logging precedent and add the agreed
      log-capture assertion if required.
  - id: ARCH-002
    severity: low
    owner: "@architect"
    story_placement: STUDIO-OBS-013 AR-1 normative DDL documentation
    finding: AR-1 still quotes PostgreSQL-invalid {1,256}; the implemented varchar(256) plus ASCII + regex is
      equivalent and all eight migration tests passed.
    suggested_action: Amend AR-1 to state the verified equivalent PostgreSQL expression; no source migration
      change is required.
  - id: DOC-002
    severity: low
    owner: "@po"
    story_placement: STUDIO-OBS-013 applicability clarification
    finding: The AC names retired recording-coverage.test.ts; final executor inventory and current
      guided-recording.test.ts provide the replacement, with all four real-browser cases passing.
    suggested_action: Record the equivalent fixture-file substitution in the PO applicability notes. No guided
      coverage is waived.
  - id: MNT-001
    severity: low
    owner: "@dev playback owner"
    story_placement: STUDIO-OBS-008 error copy; STUDIO-OBS-010 runbook
    finding: Shared unavailable/expired messages say execution when used for a guided session; status and
      error-code contracts are correct.
    suggested_action: Use neutral recording wording when refining playback error copy.
