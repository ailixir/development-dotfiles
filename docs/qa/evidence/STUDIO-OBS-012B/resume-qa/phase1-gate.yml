  useRunGate_runEnablement: 'PASS. Readiness comes only from GET /tests/{id}. RUN_ACTION is total over the four states and throws on a fifth. Run re-reads after the save and dispatches only on READY, with no compile call and no retry. A 409 LEARN_REQUIRED maps to a non-retryable narrative. One idempotency key per activation; the in-flight latch is unchanged.'
  RunControl: 'PASS. The interim sentence renders as visible text tied by aria-describedby (merged with the 10.48 not-permitted id). The learned chip renders only for execute. All compile alert, refusal-link and elapsed UI is removed.'
  mocks: 'PASS. The execute handler answers 409 LEARN_REQUIRED for non-READY drafts, after the 403 permission check. validate-variables answers 403 for an unreadable id (same as read), reads only whether a value is present and echoes no value. authoringHandlers set UNLEARNED on a source/config change.'
  security: 'PASS (static). No secret value in fixtures (secretRef/vault:// references only). No direct fetch, no any/ts-ignore/eslint-disable added, no skipped or focused tests added in the diff.'
  fixtures_import: 'Note only. fixtures.ts:19 imports contracts/v3/publication-fixtures.json from docs/specs. The studio mocks are node-only (msw server.ts; no setupWorker in src), so this does not enter the shipped bundle. Build OK is dev-reported (GATE-001).'
