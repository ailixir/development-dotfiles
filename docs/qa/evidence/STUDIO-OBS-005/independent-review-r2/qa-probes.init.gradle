allprojects {
  afterEvaluate { p ->
    if (p.plugins.hasPlugin('java')) {
      p.sourceSets.test.java.srcDir(rootProject.file('../docs/qa/evidence/STUDIO-OBS-005/independent-review-r2'))
      p.tasks.register('independentQaProbe', Test) {
        testClassesDirs=p.sourceSets.test.output.classesDirs
        classpath=p.sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        setIncludes(['**/GuidedIndependentQAProbeR2Test.class', '**/GuidedBootstrapCallbackQAProbeR2Test.class'])
        forkEvery=1
        filter {
          if(p.findProperty('qaProbe')) includeTestsMatching(p.findProperty('qaProbe'))
          else {
            includeTestsMatching('*.GuidedIndependentQAProbeR2Test.*')
            includeTestsMatching('*.GuidedBootstrapCallbackQAProbeR2Test.delayedOldBootstrapDoesNotAttestLaterAllocationsWithoutMetadataDelivery')
            includeTestsMatching('*.GuidedBootstrapCallbackQAProbeR2Test.currentAuthorityMismatchAfterRealMetadataAckCannotGrantReady')
          }
        }
        reports.junitXml.outputLocation=p.layout.projectDirectory.dir('../docs/qa/evidence/STUDIO-OBS-005/independent-review-r2/' + (p.findProperty('qaRun') ?: 'results'))
        reports.html.outputLocation=p.layout.projectDirectory.dir('../docs/qa/evidence/STUDIO-OBS-005/independent-review-r2/' + (p.findProperty('qaRun') ?: 'results') + '-html')
      }
    }
  }
}
