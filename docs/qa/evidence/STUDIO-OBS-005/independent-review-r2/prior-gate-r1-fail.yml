resolved_findings:
  - id: SEC-001
    status: RESOLVED
    verification: Ported original malicious source reply passes the current closed
      model schema and ordinary admitPlan before exact-choice validation rejects
      it. Both real public source choices navigate to their independent selected
      destination, with no other destination receipt. Closed need/reference
      meaning fixes step/occurrence/operation/slot and source provenance;
      initial plan, replan and action paths enforce it. Later-step/nonzero
      questions display their actual coordinate without advancing stepIndex;
      changed-need re-question at the same coordinate refuses.
      Strict/context/source-selection/provider/output pins are checked on
      bootstrap-only and direct routes; public answer DTO unchanged.
  - id: REL-002
    status: RESOLVED
    verification: Original entry-to-reservation late-overage probe now blocks the
      next actual SDK request. Independent rerun also passes reserve-to-claim
      and settlement-to-repair timing, under-ceiling late delta followed by
      input/output/proposal capacity refusal, exactly-once committed accounting,
      pin failure and terminal cancellation without revival. Source guards
      remain current and a fresh accounting transaction preserves pending deltas
      after source/pin refusal. Locked reconciliation plus return-and-commit
      refusal occurs at every reservation and committed send claim; no network
      I/O is held in an ambient transaction.
  - id: TEST-001
    status: RESOLVED
    verification: Frozen corpus now includes four hostile current-page NEXT_ACTION
      cases shared by controlled tests and the opt-in provider harness,
      alongside four source cases. Unsafe operation/target/value/assertion
      replies explicitly pass strict parsing and fail independent
      expected-result oracles and production validation, while baselines pass.
      Four real hostile-page cases rerun with independent submit/field receipts.
      Live provider remains explicitly unavailable; no model-accuracy claim.
top_issues:
  - id: REL-001
    severity: high
    finding: A genuine delayed bootstrap callback from an earlier context with zero
      allocations can arrive after CONTEXT_PENDING captures one later
      allocation. Because hadEvidenceBeforeDelivery was false when the marker
      was written, finishBootstrap accepts that old callback and marks READY
      without any delivery/acknowledgement of the current allocation metadata.
      The callback only binds context identity, not materialization revision or
      allocations.
    suggested_action: Bind READY to proof of delivery of the exact pending
      materialization/allocation snapshot, not to whether callback evidence was
      already present when CONTEXT_PENDING was written. Persist sufficient
      context-send provenance or require a successful same-context metadata
      acknowledgement whenever the callback cannot be tied to that snapshot.
      Preserve recovery of a lost response for the exact original snapshot,
      avoid requiring a second bootstrap callback, and never create a new
      context or dispatch right. Add the real delayed-callback race probe
      alongside the already-passing prior-callback/lost-response tests.
    suggested_owner: dev
    refs:
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:266
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:299
      - backend/src/main/java/com/citi/put/checks/studio/guided/session/GuidedSessionService.java:1462
    evidence:
      - docs/qa/evidence/STUDIO-OBS-005/independent-review-r1/GuidedBootstrapCallbackQAProbeR1Test.java
      - docs/qa/evidence/STUDIO-OBS-005/independent-review-r1/callback-confirmed-results/TEST-com.citi.put.checks.studio.guided.session.GuidedBootstrapCallbackQAProbeR1Test.xml
      - docs/qa/evidence/STUDIO-OBS-005/independent-review-r1/delayed-callback-observation.json
    limits: Reproduces premature READY and missing metadata delivery, not duplicate
      browser effects or a bypass of the later OBS-004 prepare/admit checks.
      This retains the original REL-001 readiness/recovery finding under
      mandatory REL-R1-2/4, rather than adding scope.
