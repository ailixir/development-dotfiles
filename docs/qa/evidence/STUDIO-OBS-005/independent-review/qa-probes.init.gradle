allprojects {
  afterEvaluate { p ->
    if (p.plugins.hasPlugin('java')) {
      p.sourceSets.test.java.srcDir(rootProject.file('../docs/qa/evidence/STUDIO-OBS-005/independent-review'))
      p.tasks.register('independentQaProbe', Test) {
        testClassesDirs=p.sourceSets.test.output.classesDirs
        classpath=p.sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        filter { includeTestsMatching(p.findProperty('qaProbe') ?: '*.GuidedIndependentQAProbeTest.*') }
        reports.junitXml.outputLocation=p.layout.projectDirectory.dir('../docs/qa/evidence/STUDIO-OBS-005/independent-review/' + (p.findProperty('qaRun') ?: 'results'))
        reports.html.outputLocation=p.layout.projectDirectory.dir('../docs/qa/evidence/STUDIO-OBS-005/independent-review/' + (p.findProperty('qaRun') ?: 'results') + '-html')
      }
    }
  }
}
