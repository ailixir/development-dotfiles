schema: 1
story: STUDIO-OBS-005
story_title: Grounded translation and implicit dependency planning
gate: FAIL
status_reason: Independent probes reproduce source-choice substitution, failed
  pre-materialization coordinator recovery and a late-usage race permitting
  another provider send beyond the fixed budget. Required prompt-injection
  corpus coverage is also missing.
reviewer: Quinn (@qa /root/obs005_peer; independent from all OBS-005 implementers)
