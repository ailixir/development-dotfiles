top_issues:
  - id: SEC-001
    severity: high
    finding: An accepted source clarification is checked only for membership in
      sourceReferences. The provider can include the chosen destination as an
      unused reference and bind navigation to the rejected destination; that
      plan is accepted and materialized.
    suggested_action: Persist the disputed semantic input/occurrence and slot with
      each source question. Bind the accepted choice to that exact
      obligation/reference use during plan admission and action validation;
      reject unused-choice or alternative-reference substitution. Test both
      source choices through actual navigation and independent destination
      receipts, including an adversarial plan containing both references.
    suggested_owner: dev
    refs:
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:104
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:858
    evidence:
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/GuidedIndependentQAProbeTest.java:43
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/results/TEST-com.citi.put.checks.studio.guided.session.GuidedIndependentQAProbeTest.xml
  - id: REL-001
    severity: high
    finding: The actual coordinator chooses proposals whenever a plan exists,
      ignoring MATERIALIZE continuation. A restart after source-plan acceptance
      and before materialization sends another provider request with no runner
      context, leaving materialization absent. The adjacent
      NEXT-before-first-pushContext window also has no recovery path by source
      inspection.
    suggested_action: Dispatch from durable continuation/bootstrap state rather than
      plan existence alone. Recover materialization, dependency allocation and
      acknowledged context/bootstrap stages idempotently before next-action
      inference. Add actual continueRuns probes after plan acceptance, after
      materialization, and after NEXT commits but before first context delivery.
      Do not recreate a lost post-effect browser or resend an action.
    suggested_owner: dev
    refs:
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationCoordinator.java:79
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:112
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:142
    evidence:
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/GuidedIndependentQAProbeTest.java:66
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/results/TEST-com.citi.put.checks.studio.guided.session.GuidedIndependentQAProbeTest.xml
  - id: REL-002
    severity: high
    finding: Late usage reconciliation occurs only at route entry in a separate
      transaction. A known 200000-input-token receipt committed after that check
      but before fresh reservation/send is ignored until another route
      invocation; the next actual SDK HTTP request is sent despite the fixed
      128000 ceiling. Repairs inside call() also do not rerun reconciliation.
    suggested_action: Reconcile immutable late usage under the same session lock as
      each attempt reservation and committed send claim, including
      repairs/recovery. Commit overage and terminal refusal before allowing
      another send, charge each receipt once, and retain accounting without
      reviving terminal sessions. Test receipt arrival between entry
      reconciliation and reservation/claim.
    suggested_owner: dev
    refs:
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:154
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:439
      - backend/src/main/java/com/citi/put/checks/studio/guided/translation/GuidedTranslationService.java:490
    evidence:
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/GuidedIndependentQAProbeTest.java:87
      - docs/qa/evidence/STUDIO-OBS-005/independent-review/late-race-results/TEST-com.citi.put.checks.studio.guided.session.GuidedIndependentQAProbeTest.xml
  - id: TEST-001
    severity: high
    finding: AC-6 prompt-injection coverage is absent from the semantic corpus. The
      approved-provider harness contains four SOURCE_PLAN cases and no hostile
      observed-page/context instruction case or NEXT_ACTION malicious
      permitted-action substitution oracle. HTTP error-text and duplicate-JSON
      tests do not exercise this semantic boundary.
    suggested_action: Add frozen synthetic prompt-injection and malicious
      permitted-action/target/value/assertion substitutions to controlled
      fixtures and the opt-in approved-provider harness. Include sanitized
      current-page evidence and independent expected outcomes/receipts; prove
      the oracle rejects the unsafe typed reply. Keep unavailable live execution
      explicit; no live benchmark, arbitrary-English proof or OBS-009/010 work
      is required.
    suggested_owner: dev
    refs:
      - backend/src/test/java/com/citi/put/checks/studio/guided/translation/GuidedProviderEvaluationTest.java:28
      - backend/src/test/java/com/citi/put/checks/studio/guided/translation/GuidedProviderEvaluationTest.java:198
      - docs/stories/STUDIO-OBSERVED/STUDIO-OBS-005.story.md:27
    evidence:
      - Source inspection of translation tests, planning fixtures and the
        four-case evaluation corpus
