top_issues:
  - id: S-1
    status: RESOLVED (0d93a9bf1, re-review 2026-10-06)
    severity: medium
    category: security
    finding: >-
      requireSecretOrigin runs once at playwrightAdapter.ts:835, before resolveActionTarget. Resolution
      polls for up to the action timeout before locator.fill (:836-845), and a Playwright locator re-resolves
      in whatever document is current. If the page navigates or redirects in that window, the secret is
      typed on an origin that was never checked. This is inferred from reading the code; it was not
      reproduced. The adapter tests only cover a page that is already on the wrong origin.
    impact: >-
      Weakens the AC-6 guarantee ("only while the page origin is one of the allowed origins"). A page
      whose author can trigger a delayed redirect could receive the secret.
    suggested_action: >-
      Re-check the origin inside act() immediately before fill, or resolve to an element handle and verify
      its frame's origin. Add a real-Chromium regression in which the page navigates to a second origin
      during the wait.
    ac_refs: [AC-6]
  - id: S-2
    status: RESOLVED (4fcb5a2cb, ADR-002 §13 row added retroactively)
    severity: low
    category: docs
    finding: >-
      The openapi edits (ReferencePolicy replacing ExpectedIntent on closed bodies, RunJob.secretOrigins,
      URL_SCHEME_NOT_PERMITTED and SECRET_ORIGIN_NOT_ALLOWED in x-runner-error-codes at openapi.yaml:4081-4082)
      have no ADR-002 §13 amendment-log row. ADR-SC-003 §5 rules the two fields as Class B but does not
      mention the error-code widening.
    impact: The contract audit trail is incomplete. No runtime effect.
    suggested_action: '@architect ratifies the code additions and adds the §13 row(s).'
    ac_refs: [AC-2, AC-5, AC-6]
  - id: S-3
    severity: low
    category: docs
    finding: The story has no Dev Agent Record. Its verification counts date from 2026-09-22 and the File List is grouped and approximate.
    impact: Documentation only.
    suggested_action: No code change.
    ac_refs: []

  - id: S-4
    status: OPEN (accepted residual)
    severity: low
    category: security
    finding: >-
      Inside Playwright 1.63.0's ElementHandle.fill (verified in node_modules/playwright-core/lib/coreBundle.js:20394-20406),
      the injected script focuses and selects the element in the pinned document. Then, for text-like inputs
      ('needsinput', which includes type=password), the value is sent with page.keyboard.insertText. That call is
      page-scoped, not element-scoped. If a navigation commits between those two protocol calls, the text goes to
      whatever editable element has focus in the new document, for example an autofocus field. The adapter cannot
      observe that window. It was not reproduced.
    impact: >-
      The window is one CDP round trip, typically a few milliseconds. To exploit it, the bound (trusted) origin must
      start a navigation that commits inside that window, and the new document must already have an editable element
      focused. A party that controls script on the bound origin can already read the value from the field, so the
      practical exposure is an accidental or open-redirect race, not a designed attack.
    suggested_action: >-
      Advisory only, not blocking. (a) Detect it: after the fill, re-check that the handle's ownerFrame() is still attached
      and that the page origin is unchanged. If either fails, fail the step with a fixed code that flags possible secret
      exposure, so the secret can be rotated. This adds no fidelity cost. It can only detect, not prevent.
      (b) Prevent it: set the value in one evaluate on the handle (native value setter plus input/change events). This is
      atomic per document, but it gives up keyboard-event fidelity for widgets that listen to key events. Recommend (a) now
      and (b) only if a threat model requires prevention.
    ac_refs: [AC-6]

