  - date: '2026-10-06'
    head_sha: 0d93a9bf1
    gate: PASS
    reviewer: Aria (@architect)
    summary: >-
      S-1 resolved: the target is pinned to an element handle, the origin is re-checked on its owner frame and the page,
      and the fill goes to that handle. No secret can reach a log or error on the new path. requireSecretOrigin names
      only the secret id. act() maps Playwright errors to fixed phrases (describeActionFailure) and never echoes the
      message. The ownerFrame() and dispose() calls carry no value. S-2 resolved by 4fcb5a2cb. S-4 low residual is
      accepted (Playwright focus and insertText are two separate calls).
    evidence:
