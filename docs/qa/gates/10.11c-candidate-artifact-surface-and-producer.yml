  **Every backend assertion in this gate was run with `--rerun-tasks`, and the reason was
  reproduced rather than assumed.** Document-reading test classes resolve the contract through
  `Path.of("..", "docs", "specs", "studio", "openapi.yaml")`, outside the source set, so Gradle does
  not know the file is an input. Demonstrated directly here: with `TestDto.currentCandidateArtifactHash`
  renamed in the document — a change that must redden the set-equality test — a plain
  `./gradlew test --tests StudioContractTest` reports `> Task :test UP-TO-DATE` and **BUILD
  SUCCESSFUL in 4s**; the **identical tree state** with `--rerun-tasks` reports **BUILD FAILED**
  with `theFrozenSchemasAndTheJavaTypesShareTheSameFieldNames` red. A plain green against a contract
  edit means nothing. Declaring the contract a task input belongs to neither this story nor 10.15;
  it stays with @devops alongside MED-2.

