  probes_run: 4
  shapes_cleared:
    - probe: 'The fixture matrix''s title scanner (`storyTestFiles`) — a control scoped by a naming allowlist, shape #20''s signature'
      result: >-
        **Cleared.** `STORY_TEST_DIRECTORIES` reads whole directories with `readdirSync` rather than
        naming files, so this story's new test files were discovered automatically. The matrix test
        also carries an explicit anti-vacuity guard (`length >= 20`, `titles > 40`, plus a literal
        title) with the comment *"Without this, both assertions below could pass by finding
        nothing to check."* Anticipated and closed.
    - probe: 'Drop `!hashBlocked` from `confirmEnabled` in `CompileReviewPanel`'
      result: '**Cleared — falsifiable.** 1 red: `confirmHash.test.tsx` "sends nothing at all when the body came back without a hash [FX-ARTIFACT-ABSENT]", 134 green.'
    - probe: '`assertThat(pendingOperations()).isEmpty()` — an emptiness assertion over a derived collection cannot distinguish "nothing is marked" from "the scanner stopped working"'
      result: >-
        **Cleared.** The concern is explicitly anticipated in the assertion's own `.as(...)` text —
        *"an isEmpty() assertion is otherwise satisfied by a helper that has stopped working"* — and
        mitigated by `ExecutionVideoContractTest` pointing the same reader at a scratch copy
        carrying a marker on a different operation. 10.15's work, and it is sound.
  twenty_first_shape:
    id: M-Q1
    name: 'A defensive invariant documented as closed, with no test able to distinguish it from its absence'
    location: 'backend/src/main/java/com/citi/put/checks/studio/dto/UITestDto.java — the `from(entity, candidate, withDiagnostics)` factory'
    the_guard: >-
      `String candidateArtifactHash = candidateArtifact == null ? null : candidate.getArtifactHash();`
      — the "both or neither" rule. Its four-line comment states the stake plainly: *"A hash
      published without the artifact it names would invite a caller to confirm a revision it has no
      way to review, which is the one thing the confirmation step exists to prevent; the
      unparseable-column defence below is the only path that can produce that asymmetry, and this
      is where it is closed."*
    mutation: 'Rewrite as `candidate == null ? null : candidate.getArtifactHash()` — publish the hash even when the artifact column failed to parse, producing exactly the asymmetry the comment forbids'
    observed: '**91 files / 692 tests / 6 failures — the identical 6 failures, in the identical 4 classes, as the unmutated HEAD. Zero tests reddened**, across the whole `com.citi.put.checks.studio.*` package, with `--rerun-tasks`.'
    why_it_is_a_new_shape: >-
      It is not shape #5 (AC-29's React `disabled` prop), where an assertion existed but could not
      reach the code. Here **no assertion exists at all**, while the source comment asserts in prose
      that the asymmetry "is closed" — so the comment is the only evidence the guard works. And it
      is the mirror of @dev's own `artifactDivergence` disclosure, which is *falsifiable over a
      state the producer cannot emit*: this one is *unfalsifiable over a state the producer cannot
      emit*, and only the first of those two was disclosed.
    severity: low
    is_a_shipped_defect: false
    assessment: >-
      Defence-in-depth only. The artifact column is written solely by this application, so the
      unparseable state is not currently reachable — which is precisely why @dev's four-line comment
      calls it *"a defence against a future writer"*. That future writer is the threat model, and
      the defence has nothing watching it. Not a merge blocker; it belongs in the epic's catalogue
      as shape **#21** and wants one IT that persists a revision with a blank artifact column and
      asserts both fields come back null.
    scope_of_claim: >-
      Verified across `com.citi.put.checks.studio.*` only. `UITestDto` is a studio type, so coverage
      from outside that package is implausible, but it was not exhaustively excluded.

findings_adjudicated:
  - id: F-1
    claim: '§21.7''s premise is false against the merged producer'
    verdict: '**UPHELD — @dev is right.** For @architect.'
    verification: >-
      Both legs verified in the merged code. **(1)** `CompileStateService.publishInvalid` is the
      **only** writer of `NEEDS_REVISION` in `backend/src/main/java` (grep returns one assignment,
      at `:168`), and the same `UPDATE` sets `current_candidate_revision_id = NULL` at `:172`. That
      state therefore never carries a candidate at all. **(2)** Where a candidate does exist,
      `publishCandidate`'s conditional `UPDATE` is guarded on `source_revision` being unchanged, and
      `StudioService.updateTest` sets `setCurrentCandidateRevisionId(null)` whenever
      `change.anyChanged()`; `ConfigurationChangeClassifier` computes
      `sourceChanged = !storedSteps.equals(request.steps())`, so **any** step-text edit nulls the
      candidate. `originalText` and `steps[i]` cannot diverge on a body this backend emits.
    consequence: >-
      AC-28's literal fixture — a `needsRevision` draft whose steps and artifact diverge visibly —
      **is a body this backend cannot produce**. @dev shipped the rendering anyway, labelled it
      *defensive, not live* in its own source, and carried the criterion's purpose with
      `translatedTargetDraft`, a fixture that **is** producible and that makes the hazard occur. That
      is the correct handling: raised, not worked around, and not silently satisfied. The ruling is
      @architect's; ADR-002 §21.7's sentence needs amending, not the code.
  - id: F-2
    claim: 'The stale video-route assertion was fixed by @qa on the integration branch; this story must not re-fix it'
    verdict: '**CONFIRMED ABSENT from this story''s diff.**'
    verification: >-
      `backend/src/test/java/com/citi/put/checks/studio/compile/CompileRouteContractDivergenceTest.java`
      is **byte-identical** between `f868c31df` and HEAD — `git diff --stat` over that path is
      empty, and the file is not in `git diff --name-only f868c31df..HEAD`. Not touched, not
      re-fixed. Noted for completeness: the fix is **not present at this story's base**, so
      `theOperationIsNoLongerMarkedAsNotYetImplementedAndNoOtherMarkerMoved` is red at both base and
      HEAD here; it lands via `23c1973e4` on the epic branch, which the merge takes cleanly.
  - id: F-3
    claim: 'The review briefing''s inherited-failure count is wrong for `studio`'
    verdict: '**UPHELD — @dev''s baseline is adopted over the briefing''s.** See `f3_baseline_adjudication`.'
  - id: F-4
    claim: '`npm run lint` still cannot start (ENV-1)'
    verdict: '**CONFIRMED.** Reproduced verbatim. Correctly reported FAILED and never as passed.'

