what_must_not_be_undone:
  - 'The `BASE_SHA256` re-anchor and the document edit must stay in the **same commit**. FOC-06''s whole value is that the pin cannot drift from the document silently.'
  - '`studioEscalation.test.ts`''s assertion region must stay byte-identical. It is the epic''s standing example of a red that resolved by the gap closing rather than by the test moving, and its evidential value is the hash.'
  - 'AC-32''s escalation stays **red and unedited** until @architect rules. It must not be converted to `it.fails()` — that inverts an escalation into a tripwire, which is the trap §21 already documents.'
  - 'The AC-29 obligation-1 assertion must stay **at the hook**. Moving it back to the control re-creates a guard that cannot fail.'
  - '`FX-ARTIFACT-AGREEING-CONTROL` must stay. Without it, M-F3''s 7 reds cannot be distinguished from a mutation that reddens everything.'
  - 'The §21.7 divergence rendering keeps its *defensive, not live* label until F-1 is ruled. Deleting the label would turn a disclosed limitation into a silent false claim of coverage.'

final_decision: >-
  **CONCERNS — merge safe.** This is the most thoroughly self-audited record in the epic and it
  survived adversarial re-measurement: both contract hashes, the same-commit re-anchor, the
  assertion-region equality, the set-equality coupling, the escalation's red-and-self-resolution
  under a name @dev never saw, the repaired guard **and** the proof that its predecessor could not
  fail, and the negative control that genuinely does not co-redden. Eight mutations re-applied, all
  restored byte-identically and hash-verified, tree clean at the end. Zero new backend failures
  against a baseline I measured myself in a separate worktree rather than inheriting — and that
  measurement **overturns the briefing this review was given** in @dev's favour.
  It is not a PASS for four reasons, none of which is a defect in shipped behaviour: `npm run lint`
  has never executed anywhere in this epic; ADR-002 §21.7's premise is false and the criterion
  resting on it is unresolved; this story's own producer carries a documented invariant that **no
  test can distinguish from its absence** (shape #21, found here, not disclosed); and the record
  carries three off-by-one under-counts. The first, second and fourth are owned elsewhere or are
  clerical. The third is this story's, is low severity and unreachable today, and is the kind of
  thing this epic exists to catalogue rather than to block on.
  FOC-06 closes here, correctly, with the pin green on arrival and re-anchored in the same commit
  as the edit it covers — three for three across the wave.
