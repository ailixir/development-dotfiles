status_reason: >-
  **Every load-bearing claim in this record reproduced under measurement, and the two that were
  hardest to fake are the two that held up best.** The escalation test's assertion region
  (`const SPEC_DIR` → EOF) hashes
  `a3e77163af217dd032ce631c0589b208a6ef69b9f3c78517c83c1b10eb9f68f0` on **both** sides — computed
  here, on both revisions, not read from the record. The whole-file hashes are `f7a8f98adc…` before
  and `0010e625bcd…` after, and the diff is confined to the header comment plus one deleted blank
  line; the three `import` lines above the region are untouched (the hunk opens at line 4). A
  comment-only edit is exactly the shape that can hide a moved assertion, and this one does not.
  **FOC-06 step 3 closes correctly.** `docs/specs/studio/openapi.yaml` is
  `310d3c984b77104898440cae450795cdd56c11ef926f75209fb6d4198dcc0cf7` at `f868c31df` — identical to
  the `BASE_SHA256` the pin carried on arrival, so the pin was green on arrival and there is **no
  FOC-06 violation to raise** — and
  `51850b016cd8a697899a944eab12ddce5456967beecf4f3e011720498bc02efa` at HEAD. `git log` over each
  path shows `docs/specs/studio/openapi.yaml` and `studio-runner/test/run/confinement.test.ts`
  were each touched by **exactly one commit, `4157d7f62`** — the same-commit re-anchor property
  holds, as it did for steps 1 and 2. The pin runs **18/18** at HEAD.
  **The set-equality coupling is real, and the producer did ship in the same commit.** Dropping
  `currentCandidateArtifact` from the `UITestDto` record reddens exactly
  `theFrozenSchemasAndTheJavaTypesShareTheSameFieldNames` with **13 siblings green**, and
  `4157d7f62` carries the document, the producer, the re-anchor and the escalation comment
  together. This edit could not have been document-only.
  **AC-32 is genuinely red now and genuinely self-resolving.** Two independent full frontend runs
  give the identical 2 failures, both AC-32's. Injecting the confirmed revision's two properties
  into the document turns the file **4/4 green with the test byte-unchanged** — and it does so
  under **two different spellings**: @dev's `confirmedArtifact*` and a second,
  `ratifiedRevisionArtifact*`, invented here specifically to test the claim. The rule counts
  qualified forms, not a spelling, as recorded.
  **The non-falsifiable guard @dev found and repaired is exactly as described.** Deleting the
  in-flight ref from `useCompileReview` reddens 1 test with 134 green against the repaired
  assertion; restoring the **pre-repair** test files from `ba949777a` with the same mutation still
  applied leaves the review suite **134/134 green**. @dev's self-reported defect is confirmed
  independently, and so is the repair.
  **The negative control genuinely discriminates.** Under the `steps`-derived summary mutation, 7
  tests redden — all three `FX-ARTIFACT-TRANSLATED-TARGET` cases among them — while
  `FX-ARTIFACT-AGREEING-CONTROL` is observed **green in the verbose run, by name**. A control that
  co-reddens proves nothing; this one does not co-redden.
  **Four concerns hold the gate at CONCERNS rather than PASS.** (1) `npm run lint` **cannot start**
  — ENV-1, epic-wide, correctly never claimed as passed here. (2) **F-1's premise is correct**:
  ADR-002 §21.7's "in `needsRevision` those disagree by design" is false against the merged
  producer, verified in the code, and the criterion it grounds is @architect's to re-rule. (3) A
  **twenty-first vacuous-guard shape** was found here, in this story's own new producer: the
  "both or neither" defence in `UITestDto.from` can be deleted and **nothing in the entire
  `com.citi.put.checks.studio.*` package reddens**. (4) Three **off-by-one under-counts** in the
  Dev Agent Record's totals, all in the safe direction. None is a defect in shipped behaviour and
  none blocks the merge.

