    - id: Q2
      mutation: >-
        Register BODY prose: "**All six read `status: open`.**" -> "**All six are now RESOLVED and no
        longer gate this epic.**"
      expected_if_guard_complete: RED
      result: GREEN — SURVIVED
      why_it_matters: A false green stated in words, in the document the guard is named for.
      restore: all 7 files OK
    - id: Q3
      mutation: all six `gate_owner` anchors reduced to a single space `" "`.
      expected_if_guard_complete: RED
      result: GREEN — SURVIVED
      why_it_matters: >-
        The owner check is a case-insensitive substring test with no strength floor, so the very
        check the developer added to catch the ED-02 ownership gap can be reduced to a tautology by
        shortening its anchors, and nothing notices. The check works today (see Q-control v1) but
        nothing keeps it working.
      restore: all 7 files OK
    - id: Q4
      mutation: >-
        delete the `AC-5: [ED-02]` line from `blocked_criteria` entirely.
      expected_if_guard_complete: RED
      result: GREEN — SURVIVED
      why_it_matters: >-
        The guard checks that every id a criterion names is a declared gate, but never that
        AC-1..AC-7 are all registered. A blocked criterion can silently stop being registered — which
        is the "closing by silence" failure AC-15 exists to prevent, one level up.
      restore: all 7 files OK
    - id: Q5
      mutation: >-
        studio-staging-spikes.md's own summary table and header line -> CLOSED for all six, leaving
        each `## SPK-0N` section's `**Result.** OPEN.` untouched.
      expected_if_guard_complete: RED
      result: GREEN — SURVIVED
      why_it_matters: >-
        The source of truth can contradict itself. The guard deliberately reads the section and not
        the summary table (a documented choice), but nothing checks that the two agree, and a human
        scanning the register reads the table first.
      restore: all 7 files OK
    - id: Q6
      mutation: >-
        `AC-7: [ED-02]` -> `AC-7: [ED-01]` in `blocked_criteria`. Both are declared gates; the story
        blocks AC-7 on ED-02.
      expected_if_guard_complete: RED
      result: GREEN — SURVIVED
      why_it_matters: >-
        Membership is checked; correctness is not. The register can mis-attribute which gate blocks
        which criterion, so when ED-01 opens the wrong criterion becomes executable.
      restore: all 7 files OK
    - id: Q7
      mutation: >-
        CONTROL. `## SPK-02` section `**Result.** OPEN.` -> `CLOSED — ingress verified 2026-09-17.`
      expected_if_guard_complete: RED
      result: >-
        RED — "[register-sync] SPK-02: the register says BLOCKED, but its source of truth now reads
        \"CLOSED — ingress verified 2026-09-17.\"". Exactly one failure line.
      why_it_matters: Proves the harness and the guard's primary direction both work.
      restore: all 7 files OK
  developer_rows_reproduced:
    - id: v1
      mutation: manifest ED-02 owner -> "Checks squad (reassigned)"
      result: RED — exact OWNER MISMATCH message as quoted in the Dev Agent Record
    - id: v2
      mutation: register declares ED-07
      result: RED — "no such id exists in docs/epics/EPIC-10-EXECUTION.yaml"
    - id: v3
      mutation: both copies of the GA disclaimer sentence deleted
