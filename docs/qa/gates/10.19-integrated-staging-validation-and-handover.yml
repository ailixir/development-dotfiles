  summary: >-
    6 of my 7 probes survived; the 1 control reddened; all 4 developer rows I re-ran reproduced
    verbatim. The guard is sound in the direction it was built for and blind in three others: the
    register's own body, the completeness of its criteria list, and the strength of its own anchors.

