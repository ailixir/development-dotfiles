completeness_of_epic_10:
  can_10_19_be_considered_complete_as_far_as_possible: >-
    YES for the half that does not need a staging cluster, and the story is correctly NOT marked
    Done. Eight criteria (AC-8, AC-9, AC-10, AC-11, AC-15, AC-16, AC-17, AC-18) are delivered and
    independently verified here. The story's own Definition of done forbids Done while any criterion
    is blocked or unexecuted, and it has correctly stopped at Ready for Review.
  precisely_what_remains:
    blocked_on_parties_outside_this_epic:
      - AC-1, AC-2 — all twelve ids.
      - AC-3 — ED-04, ED-05, SPK-04, SPK-05 (Platform/SRE).
      - AC-4 — ED-06, SPK-02, SPK-06 (Platform/SRE ingress; @architect).
      - AC-5, AC-7 — ED-02 (PUT Core platform; external ticket does not exist yet).
      - AC-6 — ED-02, ED-03, ED-05.
    not_blocked_merely_unfinished:
      - AC-12(b) — the screen-reader pass. Unstaffed, not gated.
      - AC-13 — the user trial. Unstaffed, not gated. The weakest criterion, named as such in advance.
      - AC-14 — the first-Tab assertion. Blocked on ENV-1(a), which is @devops's, not Platform/SRE's.
      - AC-19(a) — the post-merge repeat, outstanding by construction until this story merges.
      - AC-19(c) — red. F-3 is open on the epic line.
  epic_level: >-
    Epic 10 is complete as far as it can be without a staging cluster, an identity integration and
    six spikes it does not own. What this story adds that the epic did not have is the thing that
    makes that statement checkable by someone who was not here: a register that names every open
    item with an owner, a rollback procedure, five evidence hooks, and a guard that fails when the
    register drifts from the manifest — with the six blind spots this gate documents.

evidence_limits:
  - >-
    AC-1..AC-7 cannot be positively verified by anyone, here or elsewhere, while their gates are
    open. This gate verifies only that they were not faked — which is the whole of what is
    verifiable today.
  - >-
    AC-13's structure check is a PRESENCE check and the script says so in its own output. It would
    pass just as happily over invented content. Only a human reading the file can tell. I read it:
    it is empty and says so.
  - >-
    The screen-reader pass cannot be verified as absent beyond confirming that no transcript exists
    and the document says none was run.
  - >-
    I could not prove F-3's true natural failure rate. Pooling both agents' samples gives 3 reds in
    60 natural runs (2/20 file-alone by me, 0/20 file-alone by @dev, 0/15 full-tier by me, 1/5
    full-tier by @dev). That is enough to establish the protocol is underpowered and NOT enough to
    say which natural route is the better reproducer. The squeeze is the only instrument I would
    trust.
  - >-
    I did not re-verify the runbook's §1-§6, §8, §10, §11 "found NOT drifted" claims line by line
    against the merged system. I verified the five corrections that were made, and independently
    verified the AC-9 novelty claim. The negative claim is the developer's.
  - >-
    I did not read the contents of wt/epic's uncommitted backend work beyond ChecksLayout.tsx and the
    a11y test file, and I confirmed only its shape: 241 dirty paths and an untracked
    V18__studio_inference_capture.sql, exactly as the developer's correction to the run log states
    (the run log's 263 paths and V19 are stale). Whether the compile breakage still holds there is
    undetermined, as the developer also says.
  - >-
    `./gradlew check` was not run, by design. MED-2 hangs it and a hang is never a pass.

recommended_status: >-
  CONCERNS — merge safe. The local half is genuinely delivered, nothing blocked was faked, and every
  suite matches baseline exactly. The concerns are one HIGH finding that belongs to 10.18b
  (DISCLOSURE-PIN-1), six documented blind spots in this story's own guard, and a defective
  acceptance-criterion protocol — all routed, none requiring rework in this story before merge.

before_merge:
  - >-
    None blocking. Optionally correct the register's F-3 section (6.1) and the story's AC-19(c)
    narrative, both of which state that the 20-run recipe "does not reproduce this race" and that the
    full tier does. This gate's evidence is the other way round in both halves; the honest statement
    is that neither natural protocol is a reliable detector and only the squeeze is.

