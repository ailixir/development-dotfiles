  - id: 8
    item: the PASSED-line counting discrepancy
    verdict: RESOLVED — both agents were right, the flag differed
    mechanism: >-
      backend/build.gradle.kts:161 declares `testLogging { events("passed", "skipped", "failed") }`.
      In Gradle that configures the LIFECYCLE-level TestLoggingContainer only. Running with `-i`
      selects the INFO-level container, whose Gradle default event set is [FAILED, SKIPPED] — PASSED
      is not in it — and the build script never configures a `testLogging.info` block (verified: the
      only two testLogging occurrences in the file are the top-level one at 161 and one at 329, with
      no per-log-level sub-blocks). So `-i` silently drops every PASSED line while changing nothing
      about what ran.
    controlled_experiment: >-
      Same test class, same `--rerun-tasks`, only the flag differing.
      `./gradlew test --rerun-tasks --tests com.citi.put.checks.studio.ArtifactSchemaDriftTest`
      emitted 3 PASSED lines. The identical command with `-i` emitted 0 PASSED lines across a 589-line
      log, with the tests demonstrably executing. That is the whole discrepancy.
    corroboration: >-
      This reviewer's own full package run, WITHOUT `-i`, emitted exactly 709 ` PASSED$` lines, 0
      ` SKIPPED$`… (7 skipped appear in XML; the LIFECYCLE skipped events were emitted as the run
      progressed and totalled 7). Independent XML aggregation of the same run gave 94 suite files,
      none zero-length, tests=716 failures=0 errors=0 skipped=7, i.e. 709 passed. The developer's 94
      XML files and 709 figure match exactly. Three counting methods, one answer.
    standard_this_epic_should_adopt: >-
      Aggregate `backend/build/test-results/test/*.xml` and assert the suite-file count is non-zero
      and no file is zero-length. It is invariant to log level, invariant to `-i`, and independent of
      Gradle's habit of printing "N tests completed" only on failure. Console-event counting must be
      corroboration only, because it is silently log-level dependent — as this item proves. Exit code
      must never be the instrument: ruling 1 shows a single-file run returning 1 on every green run
      because of coverage thresholds, and `grep -E 'FAILED$'` additionally matches
      "> Task :test FAILED", which this reviewer hit live while probing a mistyped class name.

