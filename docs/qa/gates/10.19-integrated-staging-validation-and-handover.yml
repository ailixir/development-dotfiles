rulings:
  - id: 1
    item: F-3, and whether AC-19(c)'s protocol can see it
    verdict: CONFIRMED IN PART, REFUTED IN PART — the most important item in this gate
    confirmed:
      - >-
        The reverted base is what landed. `git log` for
        studio-runner/test/reporting/httpClient.test.ts ends at 7357082e3 (the revert), and the file
        is clean at sha256 444a785d450cf0c44ba331f9f9f91fe5b0dd00672794f3e2f1f6afc5092ae5a0 —
        byte-identical to the developer's quoted digest. The inference program's fix has not landed.
      - >-
        F-3 is genuinely open. The deterministic squeeze reproduces it 3 times out of 3, each run
        exactly `Tests 1 failed | 5 passed (6)`, each failing exactly
        "reports a timeout as ambiguous, not as a failure to send" with
        `expected [] to have a length of 1`. Note this also settles the reading of the developer's
        "1 failed / 5 passed": it is the test counts within one run, not one red in five runs.
      - >-
        The mechanism, read from the source rather than inferred: the responder's `hits.push` fires
        on the server's `request.on('end')` event, while the client deadline is 25 ms. The assertion
        therefore depends on the server's event loop draining the request inside 25 ms. It is
        in-process event-loop latency that reddens it, not CPU starvation.
    refuted:
      - >-
        "AC-19(c)'s prescribed 20-run-under-load protocol returned 20/20 green" does not generalise.
        This reviewer ran that protocol verbatim — the file alone, 20 runs, 8 node CPU spinners,
        1-minute load 9.66 to 18.39 — and got 18 green / 2 RED. Runs 13 and 18 both failed on
        exactly the F-3 test with exactly `expected [] to have a length of 1`. The protocol is NOT
        blind to the defect it exists to find; it is UNDERPOWERED (~10% per run here, ~5% pooled
        across both agents' 40 runs). The developer's 20/20 was a sample, not a property.
      - >-
        "What reproduces it is the full suite's own parallelism" is not supported. This reviewer ran
        the full default tier 15 times at loads from 4.94 up to 26.42 and got 0 reds — 984 passed /
        29 skipped (1013) on all fifteen. The developer's 1-in-5 and this reviewer's 0-in-15 pool to
        1 in 20, statistically indistinguishable from the file-alone route. Neither natural protocol
        is the strong reproducer the story and the register both claim the full tier to be.
    also_found: >-
      The prescribed protocol has a second trap the story does not mention and that the developer
      avoided only by care. Running that single file returns EXIT CODE 1 on EVERY run — all 20 of
      mine, including the 18 green ones — because running one file alone fails the suite's global v8
      coverage thresholds ("Coverage for lines (0.42%) does not meet global threshold (85%)"). Anyone
      scripting this protocol on `$?` would read 20 failures; anyone scripting it on "did it exit 0"
      would never see a green. The developer's note that "each run's count was read, not inferred
      from a silent exit" is exactly the right care, and it is load-bearing.
    ruling_on_what_the_protocol_should_be: >-
      AC-19(c) must stop using "N runs green" as its instrument. A pass criterion that is satisfied
      ~90-95% of the time per run when the defect is present is not a detector; it manufactures false
      greens at scale, which is the failure mode this epic has spent nine waves eliminating. The
      protocol should be: (1) the deterministic squeeze is the pass/fail instrument — it is 100%
      reproducible in the present direction and would go green only when the race is actually
      closed; (2) counts are read from the reporter's own summary line, never from the exit code,
      which for a single-file run is dominated by coverage thresholds; (3) the N-run loop is retained
      as corroboration only, with the explicit statement that a green N-run sweep is NOT evidence of
      a fix. This is an edit to an acceptance criterion and therefore @po's — routed, not applied.
    f3_itself: >-
      Correctly NOT re-fixed here. This story would be a third writer on that file. F-3 returns to
      @po as an open finding against the epic line, not as 10.19's regression.

