findings:
  - id: DISCLOSURE-PIN-1
    severity: HIGH
    owner: '@po'
    summary: >-
      studio-runner/test/disclosure.test.ts pins "ED-02's owner is TBD", retracted 2026-09-16. It now
      passes only because the runbook's correction quotes the wording it retracts. Proven by
      mutation: making the runbook strictly more accurate turns the test red. A guard that penalises
      a correction. Both needle sets in that test are affected, and the test's own name asserts the
      opposite of the user's decision. Re-scoping 10.18b's AC-20 is @po's call.
  - id: AC15-BLIND-BODY
    severity: MEDIUM
    owner: '@po (criterion) / @dev (implementation, follow-up story)'
    summary: >-
      AC-15's guard reads only the register's front matter, so the register's own status table and
      prose can contradict the manifest with the guard green (Q1, Q2). Recommend the guard parse the
      section-1 table's Status column and require it to agree with `gate_registration`.
  - id: AC15-NO-ANCHOR-FLOOR
    severity: MEDIUM
    owner: '@dev (follow-up)'
    summary: >-
      The owner check is a substring test with no minimum anchor (Q3: all six reducible to " ").
      Recommend a minimum anchor length and a rule that the anchor must not be a substring of every
      owner string.
