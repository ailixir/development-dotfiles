status_reason: 'canExecute guard restored at the top of StudioService.executeTest, before acceptance, readiness, quota and the idempotency race; refusal is status/header/body-identical to an unknown id and the guard-removal mutation turns 10 tests red. Only low, advisory findings remain (pre-existing IdempotencyFilter replay, a11y nuance, header equality not pinned).'
