top_issues:
  - id: 'SEC-001'
    severity: low
    finding: >-
      IdempotencyFilter (config/IdempotencyFilter.java:98-105) replays a cached 2xx keyed on
      userId + Idempotency-Key (Caffeine, expireAfterWrite 5 min, per replica, SecurityConfig.java:62-66)
      before the controller. A demoted owner replaying their own key on the same replica within 5 min
      gets the cached 202. The replay never calls chain.doFilter, so it creates no execution, no
      ledger row and re-triggers nothing; it only returns bytes (an executionId) the caller already
      received. On another replica or after expiry the request reaches requireExecute and gets 403.
      Pre-existing, outside AC-12 confinement; AC-5b holds at the service where the AC places it.
    suggested_action: >-
      Track as a follow-up (owner @architect/@dev): either exclude POST /tests/{id}/execute from the
      in-memory filter (the service already has durable principal-scoped idempotency) or re-authorize
      before replay; also consider adding method+path to the filter cache key.
  - id: 'TEST-001'
    severity: low
    finding: >-
      Committed tests assert status and body identity for the refusal vs an unknown id, not headers.
      QA verified headers with a temporary test (removed): identical apart from Date for all four
      refused callers.
    suggested_action: 'Optionally add a header-equality assertion (excluding Date) to aRefusedExecuteIsByteIdenticalToAnUnknownIdAndWritesNothing.'
  - id: 'MNT-001'
    severity: low
    finding: >-
      Run uses native disabled, so the button leaves the tab order; its aria-describedby reason is
      reachable by screen readers in browse mode and is visible on page, but not on keyboard focus.
      Consistent with the other disabled Run states in RunControl (dev AUTO-DECISION).
    suggested_action: 'Consider aria-disabled + focusable for all disabled Run states in a UX pass; not specific to this story.'

