top_issues:
  - id: 'TEST-001'
    severity: medium
    category: tests
    finding: >-
      VertexLlmGatewayClientTest held the suite's only tests of three bounds that the production
      GenAiLlmGatewayClient also enforces: (1) oversizedInputIsRejectedBeforeAnyNetworkCall
      (COMPILE_INPUT_TOO_LARGE with zero WireMock serve events; prod GenAiLlmGatewayClient.java:190-198),
      which bounds what can leave the host; (2) saturatedConcurrencyFailsFast (GATEWAY_BUSY on
      tryAcquire failure; prod :199-207); (3) oversizedResponseIsDiscarded (GATEWAY_OUTPUT_TOO_LARGE;
      prod :393-401). GenAiLlmGatewayClientTest (17 tests) and GenAiGatewayAuditTest (3) exercise none
      of them. The BUSY and TOO_LARGE references in CompilePipelineTest and RepairBoundsTest use fake
      clients, so they test how the pipeline handles those outcomes, not how the client enforces them.
      The deleted tests ran against a src/test-only class, so no assertion on production code was
      lost; the production gap already existed. Even so, these are security and bounds invariants
      (seam doc §4 row 2; current-state.md CS-12) and the suite no longer covers them anywhere.
      @dev recorded the gap honestly (seam doc §4 note, later-story candidates). AC-7 authorised the
      deletion, so the AC is met.
    suggested_action: >-
      Follow-up story (owner @sm to draft, @dev to implement): add three GenAiLlmGatewayClientTest
      cases against WireMock: maxInputBytes below the payload gives TOO_LARGE/COMPILE_INPUT_TOO_LARGE
      with server.getAllServeEvents() empty and provenance null; maxConcurrency=1 with a delayed
      in-flight call gives the second propose BUSY/GATEWAY_BUSY and the first OK; maxOutputBytes below
      the stub output gives TOO_LARGE/GATEWAY_OUTPUT_TOO_LARGE with outputBytes greater than the cap.
    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: >-
      These lesser assertions from the deleted suite now have no direct GenAiLlmGatewayClient test:
      response.retries() == 2 after two 503s followed by success, and errorCode GATEWAY_TRANSPORT plus
      retries == 2 on exhaustion (retriesAreBoundedWithoutSdkAmplification asserts only 3 wire calls
      and TRANSPORT); the wire body omitting temperature/topP/topK/candidateCount (the prod javadoc at
      :293 says no temperature is sent, but nothing asserts it); an empty candidates array giving
      PARSE_FAILURE with no secret in the reason (redaction is still covered for malformed, transport
      and finish-reason paths in GenAiGatewayAuditTest and GatewayAuditTest). Covered elsewhere:
      parse paths (GatewayResponseParserTest), timeout not retried
      (activeCallUsesRemainingDeadlineAndDoesNotRetryTimeout), OK path and provenance fields.
    suggested_action: 'Fold into the TEST-001 follow-up as optional cases.'
    suggested_owner: dev
  - id: 'TEST-003'
    severity: low
    category: tests
    finding: >-
      Neither migrated assertion is weakened. GatewayAuditTest's 400 case changed from
      startsWith("ClientException (status=400)") to isEqualTo("gateway transport failed"). Exact
      equality is stricter, and it pins the fact that the provider body is never quoted. The
      doesNotContain(SECRET_PLACEHOLDER) checks on reason, diagnostic stream and audit stream,
      outcome=TRANSPORT and verify(1) are all unchanged. One thing is lost: the HTTP status is no
      longer visible in the reason, but that is production behaviour, not test slack.
      StudioGatewayConfigTest's IllegalStateException changed to NoSuchFileException containing
      "/nonexistent/key.json", now thrown by the production credential path. The dropped "not
      readable" text came from the deleted test-only factory, and grep finds no src/main emitter. The
      test's subject (a missing key reported by its path) is kept.
    suggested_action: 'None. Recorded for traceability.'
    suggested_owner: dev
  - id: 'LANEA-001'
    severity: low
    category: requirements
    finding: >-
      @dev read "Python IR types" as the step IR only. ACCEPTED. StepIRBase, the five *StepIR types,
      StepIR and StepActionType were used only by the two deleted modules and TestIR.steps (re-grepped
      at bcd03dd45). TestIR must stay for toConfiguration (@po clarification). Once its element type
      is gone it cannot keep steps. SecretRef/VariableValue/VariableDefinition describe legacy-draft
      variables, which is not Python IR. Side effect: TestIR no longer describes the full legacy
      persisted shape. It is a compile-time type with one consumer (toConfiguration's Pick of
      configuration) and no runtime parse, so there is no behaviour impact.
    suggested_action: 'None. Include TestIR/variable types in the toConfiguration later-story candidate (already recorded).'
    suggested_owner: po
  - id: 'DOC-001'
    severity: low
    category: docs
    finding: >-
      tools/epic10-fold/RULINGS.md still names the deleted scripts at :11, :39, :44-45, :49, under a
      dated 2026-10-07 "Historical" note at :3-5. Ruling: ACCEPTABLE as history. AC-8 keeps RULINGS.md
      and the Dev Notes forbid rewriting dated records. The note makes it plain that the procedure is
      a past record, and no script or CI path calls the deleted files. This is the "historical,
      listed" case of AC-12, which happens to sit in tools/ instead of docs/. @po may confirm.
      Unlisted by @dev: docs/architecture/ADR-002-fold-ruling-video-503-envelope.md:528 and
      docs/epics/EPIC-10-RUN-LOG.md:2455-2459 also name the scripts. Both are dated historical records.
    suggested_action: 'None for code. @po to confirm the AC-12 reading for tools/epic10-fold/RULINGS.md.'
    suggested_owner: po
  - id: 'DOC-002'
    severity: low
    category: docs
    finding: >-
      docs/specs/studio-context/current-state.md:26 (CS-12) cites
      backend/src/main/.../VertexLlmGatewayClient.java:74-115, a path that was already wrong before
      this story and now names a deleted class. CS-08 (:22) cites the deleted parseSteps.ts and
      pythonGenerator.ts the same way. The document is headed "Assessed 2026-09-18" as a static
      snapshot, so this is stale history, not a live contract. CS-12's subject (byte caps, bounded
      concurrency, output caps) is exactly what TEST-001 shows is untested on the production client.
    suggested_action: 'Optional: add a dated "superseded paths" note to current-state.md in the TEST-001 follow-up; do not rewrite the assessment.'
    suggested_owner: sm
  - id: 'MNT-001'
    severity: low
    category: code
    finding: >-
      In runGate.test.tsx "renders no generator-derived text for any fixture", the loop now runs
      drafts.length times without using the draft: CodeTab is rendered with no props, so every
      iteration is the same. This was already true before the change, because the draft fed only the
      generator. The guard is still sound: 7 static lines, each > 12 chars, and @dev's red-once
      mutation is recorded.
    suggested_action: 'None required. A later tidy could render once.'
    suggested_owner: dev

