status_reason: >-
  AC-1..AC-15 are implemented and independently verified; AC-16 is an honest deferral on ED-01.
  The SDK deviation is sound and gax auto-retries are provably off, so there is no double-retry
  against the gateway. No credentials anywhere and the gateway is off by default in every profile.
  CONCERNS is driven by the unpinned transitive dependency footprint the Vertex pin drags in, by
  three inert canary assertions behind AC-10, and by the JaCoCo gate not actually executing under
  `check` while ED-02 keeps `:test` red.
