nfr_validation:
  security:
    status: PASS
    notes: >-
      No credential, endpoint, project or location anywhere in code, config, tests or fixtures.
      Gateway defaults to false in all 8 profiles. Credentials are mode-based — a raw key or user
      token is not accepted as a property value; MODE_NONE is documented as stub-only. Audit
      fields are a closed allow-list built from metadata the logger is structurally incapable of
      receiving prompt or response text through. Error bodies are redacted against the request's
      own source lines, syntax reference and output contract, then SecretMasker'd, then truncated
      to 200 chars — asserted by gatewayErrorBodyEchoingTheRequestIsScrubbedBeforeLogging.
      Hostile LLM output is rejected: additionalProperties:false plus a balanced-brace scan that
      is string- and escape-aware, with oversized responses discarded before parsing or logging.
  reliability:
    status: PASS
    notes: >-
      SDK auto-retries provably off; exactly one bounded jittered retry layer. Timeouts and
      ambiguous 5xx never retried. Bulkhead with maxWaitDuration ZERO fails fast on saturation.
      Input rejected pre-flight, output post-flight. Every failure mode is a CompileResponse
      value rather than a thrown exception, so §4.7 draft persistence cannot be coupled to the
      gateway — enforced by GatewayDisabledIT swapping in a bean that throws.
  maintainability:
    status: PASS
    notes: >-
      LlmGatewayClient carries no SDK type; VertexLlmGatewayClient is the single class that knows
      the SDK. Package line coverage 94.76%.
  performance:
    status: CONCERNS
    notes: >-
      Deadline comes from gax RetrySettings logical/total timeout rather than a resilience4j
      TimeLimiter (Dev Decision 5) — a defensible SDK-native choice, proved to fire by
      timeoutIsNotRetried. It bounds one attempt, not the whole propose() call: worst case is
      (maxRetries+1) x requestTimeout plus backoff, 3 x 60s by default. 10.8 should apply its own
      wall-clock budget rather than assume requestTimeout bounds the call.

