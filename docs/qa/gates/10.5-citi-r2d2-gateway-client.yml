    - id: AC-16
      reason: >-
        Pilot-use record. EPIC-10 ED-01 is status `open` and its gate_note reads "10.5 stub tests
        and 10.8 fixture-only compile can proceed; 10.5 pilot-use acceptance and any real compile
        path are blocked." docs/qa/spikes/SPK-01/README.md exists, is headed "Status: OPEN.
        Nothing here is verified against R2D2 yet", lists 10 assumptions A1-A10 each mapped to a
        spike question, and leaves every Findings row blank. Nothing unverified is asserted as
        fact. This is an honest deferral, not a faked one.
  unmet: []
  notes:
    AC-3: >-
      Pin present and commented `unverified-against-R2D2`. Version 1.52.0 resolves for real.
    AC-4: >-
      Verified twice over. Explicitly: VertexAiClientFactory.disableSdkRetries clears the
      retryable code set and sets maxAttempts(1) plus a logical/total timeout on
      generateContentSettings, which is the exact UnaryCallSettings the SDK path uses.
      Empirically: SDK defaults alone already yield 1 attempt on a permanent 503, and the story's
      own threeUnavailableResponsesExhaustTheBoundedRetry sees exactly 3 serve events for
      maxRetries=2. There is NO double-retry. Client-side backoff is
      IntervalFunction.ofExponentialRandomBackoff(250ms, 2.0, jitter 0.5) capped at maxRetries+1
      attempts — bounded and jittered as claimed. Retry-After deviation accepted (see evidence).
    AC-7: >-
      Structured and plain-text answers take the identical extraction+validation path. Extraction
      is a string- and escape-aware balanced-brace scan, so a brace inside originalText cannot
      truncate the document; unterminated objects, prose without JSON, unknown fields and a wrong
      version are all rejected. The schema is a fixture copy, which the story's Depends-on row and
      Implementation Notes explicitly permit, and it is marked with a `$comment` naming story
      10.1a plus a FIXTURE COPY comment in application.yml. Marking is clear and temporary.
    AC-15: >-
      Package coverage verified at 94.76%. The "check green" half of the AC is unreachable while
      ED-02 holds; see MED-003.

