top_issues:
  - id: MED-001
    severity: medium
    category: supply-chain
    finding: >-
      The single exact pin com.google.cloud:google-cloud-vertexai:1.52.0 pulls roughly 45
      previously-absent artifacts onto runtimeClasspath, none of them pinned and with no BOM
      (`platform("com.google.cloud:libraries-bom")`) and no Gradle dependency locking. The set
      includes the entire gRPC stack (grpc-netty-shaded, grpc-xds, grpc-alts, grpc-grpclb,
      grpc-services 1.76.3), org.conscrypt:conscrypt-openjdk-uber:2.5.2, protobuf-java:4.33.2,
      guava:33.5.0-jre and re2j. The client is httpjson/REST only, so none of the gRPC, Netty or
      Conscrypt code is on any executed path — it is pure supply-chain surface in a Citi backend.
      Separately, com.google.genai:google-genai:1.47.0 — the artifact Dev Decision 3 says was
      deliberately NOT adopted — arrives transitively and unpinned anyway, and its requested
      gson 2.12.1 is silently downgraded to 2.10.1 by the Spring Boot BOM.
    suggested_owner: dev
    suggested_action: >-
      Before ED-01 closes and the flag is ever set true: add the Google libraries BOM or explicit
      pins, exclude io.grpc/netty/conscrypt from the vertexai dependency since the transport is
      httpjson, and enable dependency locking so the resolved set is reviewable. Record the final
      artifact list in SPK-01 alongside A1.
    refs: ["backend/build.gradle.kts"]
    blocks_merge: false
    resolution: >-
      RESOLVED 2026-09-11 by @dev. 27 artifacts excluded from the Vertex pin — the gRPC runtime,
      shaded Netty, xDS/ALTS/grpclb/services/googleapis, Conscrypt, perfmark, re2j, the gRPC
      service stubs, and com.google.genai:google-genai with its okhttp/okio/kotlin/Java-WebSocket
      transport. runtimeClasspath 186 -> 159, measured both ways, nothing added. io.grpc:grpc-api
      and com.google.api:gax-grpc are KEPT because PredictionServiceStubSettings.createStub()
      evaluates `instanceof GrpcTransportChannel` before reaching the httpjson branch — excluding
      them was tried and every gateway test failed with NoClassDefFoundError. The 31 surviving
      Google/gRPC/protobuf/threeten transitives now carry explicit `constraints` at the tested
      versions; resolution is byte-identical with and without them. Note honestly: these are
      `require` constraints, so they hold the floor but a higher version requested by a future
      Vertex pin still wins conflict resolution — Gradle dependency locking was NOT enabled, as it
      would rewrite every configuration in the repo and is out of scope for a story fix round.
      google-genai contradiction closed by exclusion: a constant-pool scan of the 1.52.0 jar shows
      every com.google.genai reference is confined to the unused com.google.cloud.vertexai.genai.*
      package, so Dev Decision 3 and SPK-01 A3 are now literally true. Decision 3 corrected in the
      story and the full before/after artifact list recorded in SPK-01 alongside A1.
  - id: MED-002
    severity: medium
    category: test-quality
    finding: >-
      AC-10's canary assertions cannot fail. GatewayTestSupport.CANARY is never placed into any
      CompileRequest, so the three doesNotContain(CANARY) assertions in
      GatewayAuditTest.auditLineNeverCarriesPromptOrResponseContent and
      placeholderReachesTheWireButTheResolvedValueNeverDoes are vacuously true. I probed the
      substantive property by hand — canary inside fencedSourceLines — and it holds: audit and
      diagnostic output both exclude it. So this is a test-strength gap, not a live defect. The
      non-vacuous coverage of AC-10 rests entirely on the doesNotContain("Go to "),
      doesNotContain("await page.goto") and doesNotContain("PLAYWRIGHT SYNTAX REFERENCE")
      assertions in the same test.
    note: >-
      AC-10 as written is self-contradictory — source-line text necessarily reaches the wire, so
      "a CompileRequest whose source lines contain a canary ... produces a captured HTTP request
      ... not any resolved canary value" cannot both hold. Dev Decision 8's reading is the
      coherent one and is accepted; the test should still assert something falsifiable.
    suggested_owner: dev
    suggested_action: >-
      Put the canary into fencedSourceLines and assert the audit line and diagnostic logger
      exclude it while the wire carries it. That version passes today and would fail if audit
      fields ever started echoing source.
    refs: ["backend/src/test/java/com/citi/put/checks/studio/compile/gateway/GatewayAuditTest.java"]
    blocks_merge: false
    resolution: >-
      RESOLVED 2026-09-11 by @dev. The canary now travels inside fencedSourceLines via
      GatewayTestSupport.requestWithCanaryInSource(), and every canary test first asserts the
      canary really is in the request, so no doesNotContain can pass vacuously. Coverage is the
      four escape routes named in the finding: the audit line, the diagnostic logger, a returned
      failureReason, and the serialized wire request (which must CONTAIN it — asserted, since a
      silent non-send would be the other way to pass for free). Two new cases carry it: a 400 body
      echoing the canary, and a 200 whose model text parrots it into an unparseable response.
      Falsifiability proved by mutation, not by argument — GatewayAuditLogger was made to echo
      fencedSourceLines, GatewayErrorScrubber.redactFragment was made a no-op, and the parser was
      made to quote the offending payload; all six canary assertions went red, each on the canary
      itself, and the mutations were reverted. Gateway suite 48 -> 51 tests, all passing.
  - id: MED-003
    severity: medium
    category: process
    finding: >-
      The AC-15 JaCoCo package rule is declared but never executes. Under `./gradlew check`,
      :jacocoTestReport and :jacocoTestCoverageVerification are skipped because :test fails first
      (the 23 ED-02 failures), even with --continue. CI therefore does not enforce the 80% gate
      this story introduced. Verified manually at 94.76%, and the bundle-wide 0.70 rule currently
      reports 0.69 for the same reason.
    suggested_owner: devops
    suggested_action: >-
      Re-run the gate once ED-02 and story 10.4's spotless repair land; no action inside 10.5.
    refs: ["backend/build.gradle.kts"]
    blocks_merge: false
    resolution: >-
      PRE-EXISTING, not changed — @dev determination 2026-09-11. `git diff fda4ca5f8~1 HEAD --
      backend/build.gradle.kts` shows story 10.5 only ADDED a PACKAGE rule inside the existing
      jacocoTestCoverageVerification block. The wiring that makes the gate unreachable —
      `tasks.check { dependsOn(tasks.jacocoTestCoverageVerification) }` and
      `tasks.jacocoTestReport { dependsOn(tasks.test) }` — predates the story, and the trigger is
      ED-02's 23 failing ITs. Confirmed by task list: under `./gradlew check --continue` neither
      :jacocoTestReport nor :jacocoTestCoverageVerification is scheduled at all. Build wiring is
      therefore left alone; this needs its own story alongside ED-02. The AC-15 number is
      unaffected — package LINE coverage re-measured at 380/401 = 94.76% after the fix round.
  - id: LOW-001
    severity: low
    category: correctness
    finding: >-
      GatewayFailureClassifier.isTimeout walks the whole cause chain applying a
      message.toLowerCase().contains("timed out") substring heuristic. A gateway error body that
      echoes that phrase would be classified TIMEOUT and, by AC-4, made non-retryable —
      attacker- or proxy-influenced classification.
    suggested_owner: dev
    blocks_merge: false
  - id: LOW-002
    severity: low
    category: observability
    finding: >-
      HTTP 400 / INVALID_ARGUMENT is audited as outcome=TRANSPORT with errorCode
      GATEWAY_TRANSPORT, conflating a permanent request error with a transport fault. Within the
      letter of AC-9's fixed vocabulary, but it will mislead triage.
    suggested_owner: dev
    blocks_merge: false
  - id: LOW-003
    severity: low
    category: sdk-fidelity
    finding: >-
      Injecting PredictionServiceClient through the supplier bypasses VertexAI's own header
      provider, so the SDK's 'model-builder/{version}' user-agent is not sent. Request and
      response bodies are unaffected. If R2D2 keys on that header the pilot will fail in a way
      the stub cannot reveal.
    suggested_owner: architect
    suggested_action: "Add as an eleventh assumption under SPK-01 question 1."
    blocks_merge: false
  - id: LOW-004
    severity: low
    category: resource
    finding: >-
      VertexAiClientFactory eagerly creates an LlmUtilityServiceClient that this story never uses,
      and unlike the prediction client it gets no deadline. I probed its defaults —
      countTokensSettings().getRetryableCodes() is already empty — so there is no double-retry
      risk today, but a future countTokens() call would run with no configured timeout.
    suggested_owner: dev
    blocks_merge: false
  - id: LOW-005
    severity: low
    category: supply-chain
    finding: >-
      com.google.code.gson resolves 2.12.1 -> 2.10.1 under the Spring Boot BOM for the
      transitively-added google-genai. Unused today; a latent NoSuchMethodError if that surface
      is ever adopted.
    suggested_owner: dev
    blocks_merge: false

