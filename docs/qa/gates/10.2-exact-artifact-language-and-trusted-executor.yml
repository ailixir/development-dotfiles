security_probe:
  attempts: 31
  escapes_found: 0
  method: >-
    Independent probe harness (not the developer's fixtures) invoking validateArtifact from the built
    dist/, plus an executeSteps run with a canary secret through a throwing fake adapter.
  blocked:
    dynamic_evaluation:
      - "await new Function('return 1')() -> RECEIVER_NOT_PERMITTED"
      - "await require('child_process').exec('ls') -> METHOD_NOT_PERMITTED"
      - "await import('node:fs') -> RECEIVER_NOT_PERMITTED"
      - "await page.evaluate('1+1') -> METHOD_NOT_PERMITTED"
      - "await page.addInitScript('x') / setContent / route / on -> METHOD_NOT_PERMITTED"
      - "await (async () => { ... })() -> STATEMENT_NOT_AWAITED"
    prototype_chain:
      - "page.locator('div').constructor('return process')().exit() -> METHOD_NOT_PERMITTED"
      - "page.locator('div').__proto__.click() -> PROTOTYPE_ACCESS"
      - "page['__proto__'].click() -> EXPRESSION_COMPUTED_MEMBER"
      - "{ '__proto__': true } option key -> PROTOTYPE_ACCESS"
      - "{ ['time'+'out']: 1000 } -> OPTION_COMPUTED_KEY"
      - "{ get exact(){...} } -> OPTION_ACCESSOR; { ...spread } -> EXPRESSION_SPREAD"
    computed_and_dynamic_member:
      - "page.locator('div')['click']() -> EXPRESSION_COMPUTED_MEMBER"
      - "page?.goto(...) / page.goto?.(...) -> EXPRESSION_OPTIONAL_CHAIN"
      - "page.#x() -> METHOD_NOT_PERMITTED"
    expression_smuggling:
      - "template literal with substitution -> EXPRESSION_TEMPLATE_SUBSTITUTION"
      - "String.raw`...` -> EXPRESSION_TEMPLATE_SUBSTITUTION"
      - "'a'+'b' / 'a'.toUpperCase() / ternary / logical / typeof / yield / identifier -> ARGUMENT_TYPE"
      - "await page.goto(await page.title()) -> ARGUMENT_TYPE"
      - "comma sequence, parenthesised await, non-null assertion, as/satisfies/angle cast -> rejected"
      - "expect(...).not.toBeVisible() -> RECEIVER_NOT_PERMITTED"
    secret_smuggling:
      - "vars.secret in goto URL -> REFERENCE_POSITION_NOT_PERMITTED"
      - "vars.secret in locator() selector -> REFERENCE_POSITION_NOT_PERMITTED"
      - "vars.secret in getByLabel / getByTestId -> REFERENCE_POSITION_NOT_PERMITTED"
      - "vars.secret in press() key -> REFERENCE_POSITION_NOT_PERMITTED"
      - "vars.secret in selectOption() -> REFERENCE_POSITION_NOT_PERMITTED"
