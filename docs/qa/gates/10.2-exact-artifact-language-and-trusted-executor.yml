# ─────────────────────────────────────────────────────────────────────────────
# Issues
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: SR-001
    severity: medium
    finding: >-
      TypeScript type arguments are rejected on the outer call (readCall checks call.typeArguments ->
      UNSUPPORTED_TYPESCRIPT) but are not checked on locator-chain calls in collectSegments nor on the
      expect(...) receiver in readAssertion. Verified accepted: `await page.locator<string>('div').click();`
      and `await expect<string>(page).toHaveTitle('t');`
    impact: >-
      No capability gain — type arguments are erased and the emitted operation is byte-identical to the
      untyped form. The defect is that the default-deny surface is inconsistent: AC-6 lists "unsupported
      TypeScript syntax" as a rejected class and two positions do not enforce it, and no adversarial
      fixture covers the shape, so the gap is invisible to the corpus.
    file: studio-runner/src/validator/ast.ts (collectSegments, readAssertion)
    suggested_action: >-
      Check `node.typeArguments !== undefined` in collectSegments and on the expect receiver, emitting
      UNSUPPORTED_TYPESCRIPT; add adversarial fixtures for both shapes.
    ac_refs: [AC-6, AC-18]

  - id: SR-002
    severity: low
    finding: >-
      Unicode-escaped identifiers in method names are accepted, e.g. `await page.\u0067oto('http://a.com');`
      validates to the same goto operation, because the validator compares Identifier.text (the cooked
      name).
    impact: >-
      Capability-equivalent, so not an escape. It does mean the accepted language admits obfuscated forms
      the 10.3 syntax reference will never emit and that a human reading the source shown by the UI
      (architecture §4.7) would not recognise.
    file: studio-runner/src/validator/ast.ts
    suggested_action: Consider requiring the identifier's raw text to equal its cooked text; decide in 10.3
      alongside the syntax reference.
    ac_refs: [AC-6, AC-7]

  - id: SR-003
    severity: low
    finding: >-
      resolvePolicy spreads caller bounds over the defaults, and Partial<ValidationBounds> permits an
      explicit undefined. `{ bounds: { maxAstDepth: undefined } }` silently disables that bound — verified:
      a 40-segment chain that normally yields AST_DEPTH_EXCEEDED validates.
    impact: Caller-side misconfiguration only (the artifact cannot influence the policy), but the type
      signature currently allows a bound to be turned off by accident.
    file: studio-runner/src/validator/bounds.ts (resolvePolicy)
    suggested_action: >-
      Filter undefined values when merging, or type the override so that exactOptionalPropertyTypes
      semantics apply to each bound rather than allowing an explicit undefined.
    ac_refs: [AC-10]

  - id: SR-004
    severity: low
    finding: >-
      test/no-dynamic-evaluation.test.ts rebuilds dist/ only when dist/index.js is absent, so a local run
      against a stale dist/ can pass while src/ carries a new violation.
    impact: CI is unaffected (fresh checkout has no dist) and the ESLint rules catch the same constructs,
      so defence in depth holds. Local false-green only.
    file: studio-runner/test/no-dynamic-evaluation.test.ts
    suggested_action: Always emit into a temporary directory, or compare dist mtimes against src.
    ac_refs: [AC-12]

  - id: SR-005
    severity: low
    finding: >-
      test/lint-boundary.test.ts constructs its own ESLint flat config from eslint.boundary-rules.js
      rather than exercising eslint.config.js. Removing `...executionBoundaryRules` from the real config
      would not fail the test; only the "fixtures/lint/** is ignored" assertion reads the real file.
    impact: The shared-module design already prevents rule drift; the residual gap is wiring drift.
    file: studio-runner/test/lint-boundary.test.ts
    suggested_action: Add one assertion that eslint.config.js spreads executionBoundaryRules, or lint a
      fixture through the package config with the ignore temporarily lifted.
    ac_refs: [AC-2]

  - id: SR-006
    severity: low
    finding: >-
      .gitignore entry `studio-runner/runtime-versions.json` points at a path the build never writes; the
      artefact is emitted to studio-runner/dist/runtime-versions.json, already covered by the dist/ entry.
    impact: Cosmetic.
    file: .gitignore
    suggested_action: Drop the stale line or correct it to dist/runtime-versions.json.
    ac_refs: [AC-4]

  - id: SR-007
    severity: low
    finding: >-
      engines.node is `>=22.11.0 <25.0.0` rather than ADR-001 §4.1's literal `<major>.x`.
    impact: Deviation is deliberate and recorded in the story Change Log with a rationale; .nvmrc still
      pins 22 and 10.3's CI check asserts the image's Node against .nvmrc. Flagged so 10.3 does not treat
      the range as the image contract.
    file: studio-runner/package.json
    suggested_action: Confirm with @architect during 10.3 that the ADR text should be amended.
    ac_refs: [AC-1]

carried_risks:
  - id: CR-001
    owner: '10.13 / 10.18'
    note: >-
      Destination policy is explicitly out of scope here, so the validator accepts any absolute http/https
      URL — `page.goto('http://169.254.169.254/latest/meta-data/')` validates. Architecture §9.3 requires
      approved origins, link-local/metadata rejection and redirect-time enforcement. This is correct for
      10.2 but must not be assumed already covered by downstream stories.
  - id: CR-002
    owner: '10.3'
    note: >-
      The denial-class completeness test is keyed on DIAGNOSTIC_CODES, and the permitted-surface
      completeness test is a textual `method(` search over the reference corpus. Both hold today. Widening
      the language by permitting a new *node kind* (rather than a new method or a new denial code) would
      not force a fixture.
  - id: CR-003
    owner: '10.12'
    note: >-
      `playwright@1.63.0` is declared but nothing imports it yet; the pin exists so the four copies can
      agree. `import/no-extraneous-dependencies` does not detect an unused dependency, so the pin's
      correctness rests entirely on 10.3's check:pins and 10.12's first real adapter.

foc_02_handoff:
  verdict: READY
  note: >-
    The scaffold is complete and stable for 10.3 to build on. src/ folder boundaries match ADR-001 §3
    one-to-one, the accepted language is already modelled as data in src/validator/language.ts (so the
    reference corpus and the backend syntax reference can be generated from it), the fixture tier config
    exists and reports "no test files" rather than passing silently, and runtime-versions.json already
    emits the fields check:pins needs to compare. None of the findings above require reshaping the
    package.

recommendations:
  immediate:
    - Close SR-001 before 10.3 consumes the language schema, since 10.3 generates the syntax reference
      from it and the gap would be inherited.
  future:
    - SR-002..SR-007 are suitable for 10.3's scaffold-hardening pass.

