judgements:
  ac18_shipped_red:
    ruling: "CORRECT, and @po's ruling is NOT needed — @po already ruled by writing the criterion."
    basis: >-
      AC-18's own text: "it is **left red and escalated** with the exact list and a named
      owner ... grandfathering them into an exception list would produce a guard that cannot
      fail", sourced to ADR-002 §12's "Leave it red and escalate" rule. @dev's refusal of the
      allowlist is what the criterion demands, not a judgement call @dev made against it.
      Naming @devops (owner) and @architect (mechanism) discharges "a named owner"; neither is
      arbitrary — @devops owns the chart, and env-name conversion vs. a mounted config file vs.
      SPRING_APPLICATION_JSON is a configuration-architecture choice.
    caveat: 'The DECISION is right; the GUARD that carries it is defective — see TEST-001.'
    inference_accepted: >-
      @dev labels Kubernetes' envFrom key-skipping as documented behaviour, not observed on a
      cluster, while the RENDERING of the invalid keys is measured. I confirmed the rendering
      (15 violating keys per value set, 13 distinct) and agree the label is placed correctly.
  ac23a_scope:
    ruling: 'CORRECT — and it was never out of scope.'
    basis: >-
      The story's @po-MANDATED split hint states: "**AC-23 – AC-28** (kill switch, runbook,
      contract, falsification record, deferral bookkeeping) go with **whichever half lands
      second**". 10.18b landed second. The spawn brief's narrower list (AC-13a–AC-16b,
      AC-18–AC-22) is out of date with the story, not the other way round. @dev's supporting
      argument (M16 is the kill switch and was assigned to this half; T-10.18.19 carries it)
      also holds. No scope overrun.
  escalated_not_fixed:
    - finding: "the dispatcher's yaml default disagrees with `Dispatcher.enabledOrDefault()`"
      verified: >-
        application.yml:216 `enabled: ${STUDIO_DISPATCHER_ENABLED:false}`;
        StudioExecutionProperties.Dispatcher.enabledOrDefault() returns `enabled == null ||
