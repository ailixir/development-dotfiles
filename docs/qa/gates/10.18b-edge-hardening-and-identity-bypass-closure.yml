# ─────────────────────────────────────────────────────────────────────────────
# THE TWENTIETH SHAPE
# ─────────────────────────────────────────────────────────────────────────────
twentieth_shape:
  found: true
  name: >-
    A discrimination control scoped by a NAMING ALLOWLIST rather than by a baseline diff — it
    absorbs any new defect that does not happen to carry the owner's naming prefix, and the
    pass/fail totals do not move.
  where: "studio-runner/test/deployment/envfrom-keys.test.ts — the \"this story's OWN rendered keys are all valid\" control"
  measured: >-
    The control filters violations by `/^(STUDIO_SSE_|CHECKS_BYPASS_|STUDIO_RUNNER_|
    STUDIO_OBJECT_STORE_|STUDIO_EVIDENCE_)/`. @dev's M15 adds `STUDIO_SSE_HEARTBEAT.seconds`,
    which matches, so M15 reddens it — a favourable mutation. I ran the UNfavourable one: I
    added `checks.studio.qa-probe-7255: "x"` to `backend.configOverrides` and re-ran the file.
    Result: 4 failed / 3 passed — BYTE-IDENTICAL to the unmutated baseline. The OWN-keys control
    stayed GREEN, the four expected reds simply each gained one more violating key, and nothing
    in the totals moved.
  consequence: >-
    AC-18's stated protection — "so 'it was already broken' cannot absorb a new mistake" — holds
    only for keys named like this story's own. A future story adding
    `checks.studio.anything` is absorbed silently. AC-18's own falsification clause ("add a
    dotted key to this story's own values → red") is satisfied only in the narrow case.
  cheap_fix: >-
    Freeze the violation COUNT (or the exact violating key SET) per value set and assert against
    it, so any new violating key moves the number regardless of its name. That is the
    falsifiable form of "left red and escalated".
  relation_to_ops001: >-
    The two compound. The count is the only signal a permanently-red stage can carry, and this
    guard does not carry it.

top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: >-
      AC-18's discrimination control is a naming allowlist, not a baseline diff. MEASURED: a new
      invalid dotted key outside the five story prefixes (`checks.studio.qa-probe-7255`) is
      absorbed with the file reporting exactly the baseline 4 failed / 3 passed. The claim that
      the intentional red "cannot absorb a new mistake" is true only for prefix-matching keys.
    suggested_action: >-
      Freeze the per-value-set violating-key SET (13 distinct keys) and assert equality, so any
      new invalid key reddens the OWN-keys control regardless of its name. One-line change to
      the existing helper; no new mechanism. Owner @dev, before 10.19.
  - id: 'OPS-001'
    severity: medium
    finding: >-
      `ci/stages.md` stage 9 is now PERMANENTLY non-zero by design. Its exit code can therefore
      no longer report a new red, and the distinguishing instruction ("every other test in this
      stage must be green") is prose a pipeline cannot read. No CI configuration exists in the
      repository today (`.github/workflows` absent, no Jenkinsfile, no .gitlab-ci.yml), so
      nothing is miscalibrated yet — but when @devops wires the pipeline, the natural
      accommodation for an always-failing stage is to make it non-blocking, which disarms the
      entire fail-closed tier that 10.18a's HIGH-1 was raised to create. This also becomes the
      sole enforcement point for AC-13a's heartbeat/timeout bound, since the template carries no
      `fail` guard.
    suggested_action: >-
      Before stage 9 is wired: either fix the envFrom keys (removing the permanent red), or
      split AC-18's escalation into its own non-blocking stage 9b so stage 9 can return to a
      green/red signal. Owner @devops, with @architect on the key mechanism. Do NOT resolve it
      by marking stage 9 `continue-on-error`.
  - id: 'SEC-003'
    severity: low
    finding: >-
      `application.yml` declares `spring.profiles.active: local` as the built-in default, and
      `local` now carries `identity-headers: true` plus `LocalDevAuthFilter`
      (`@Profile("local")` with `matchIfMissing = true`). A backend process started with no
      SPRING_PROFILES_ACTIVE therefore runs with a header-trusting filter and an injected
      developer identity. NOT REACHABLE THROUGH THIS CHART — deployment.yaml sets
      SPRING_PROFILES_ACTIVE unconditionally on both the API (:63) and the worker (:244) from
      `.Values.{backend,worker}.springProfile`, and all four value sets name a deployed profile.
      It is also strictly BETTER than the pre-10.18b state, where the hardcoded `return true`
      made every profile equally open. Recorded because it is the story's own principle ("a
      configuration key whose default is open is a bypass with a longer name") applying one
      layer beneath the story, and because runbook §9 states "it cannot load in any deployed
      profile — the chart renders api,dev / api,staging / api,prod" without saying what happens
      when the variable is unset.
    suggested_action: >-
      Add one sentence to runbook §9 stating that the application's default profile is `local`
      and that every deployment path must set SPRING_PROFILES_ACTIVE explicitly. Consider making
      the default profile a non-permissive one in a later story. Owner @dev (doc) / @architect
      (default-profile choice).
  - id: 'TEST-002'
    severity: low
    finding: >-
      The rendered-half bypass assertion (`bypassViolations`) reads only the `-api` Deployment.
      The worker renders NO `CHECKS_BYPASS_*` keys at all — verified: exactly 3 occurrences per
      value set, all on the API container. The story's own principle that "present matters as
      much as false" is therefore not applied to the worker. No exposure: the worker has no
      Ingress in any value set and falls back to the application default of false.
    suggested_action: >-
      Render the three keys on the worker too and extend `bypassViolations` to every Spring
      Boot component, so the audit-from-the-manifest property is uniform.
  - id: 'TEST-003'
    severity: low
    finding: >-
      In edge.test.ts the credential-in-URL scan shares one module-level `CREDENTIAL_QUERY`
      constant between the assertion and its canary — correct. The `@RequestParam` controller
      scan does not: the canary declares
      `/@RequestParam[^)]*(token|key|session|auth)/iu` as a second literal, so a misspelling of
      the ASSERTION's copy would leave the canary green. This is the catalogued "pinned copy
      whose provenance nothing checks" shape, cosmetic here because
      ExecutionEventsController takes no `@RequestParam` at all.
    suggested_action: 'Hoist the pattern to a module-level constant, as CREDENTIAL_QUERY already is.'
  - id: 'DOC-001'
    severity: low
    finding: >-
      Two off-by-one baselines in the Dev Agent Record's mutation preamble: `BffSession*` is
      **17 passed**, not 18 (3 + 14, counted from the JUnit XML), and `StudioKillSwitchWiring*`
      is **6 passed**, not 7. Every mutation ROW is internally correct against 17 and 6
      (11+6=17, 3+14=17, 2+15=17, 2+4=6), so no conclusion changes — but the tier-baseline line
      a reviewer reconciles against is wrong by one in two places.
    suggested_action: 'Correct the two figures in the record. No re-measurement needed.'

