# ─────────────────────────────────────────────────────────────────────────────
# INGRESS DERIVATION — the two design choices judged
# ─────────────────────────────────────────────────────────────────────────────
ingress_derivation:
  choice_1:
    decision: 'the timeout derives from the LIFETIME, never from the heartbeat'
    ruling: 'SOUND, and necessary rather than merely defensible.'
    reasoning: >-
      If the timeout were `heartbeat + margin`, then M11a (heartbeat 15 → 600) would raise the
      timeout to 630 and `timeout <= heartbeat` could never fire — the guard would be
      structurally incapable of failing, which is the epic's own catalogued failure. I
      measured the alternative implicitly: with the lifetime derivation, M11a produces 10 red.
      The operational requirement (timeout > heartbeat) holds because lifetime 60 + margin 60 =
      120 >> heartbeat 15, and the comparison is asserted rather than assumed.
  choice_2:
    decision: 'deliberately NO template `fail` for heartbeat >= timeout'
    ruling: 'ACCEPTED, with one recorded residual (OPS-001).'
    reasoning: >-
      The argument holds on its own terms: a `fail` would make `render({set:{heartbeatSeconds:
      600}})` throw, `sseBoundViolations` would never run, and M11a would degrade from "the
      annotation and the env disagree" to "the template refused" — catalogued shape 8. What the
      argument does not address is that the SOLE enforcement then lives in stage 9, which this
      story deliberately leaves permanently red (OPS-001). A template `fail` would make the
      misconfiguration unshippable regardless of whether the tier ever runs.
  joining_verified: >-
    `sseBoundViolations(outcome)` reads `proxy-read-timeout`/`proxy-send-timeout` off the
    rendered Ingress and `STUDIO_SSE_HEARTBEAT`/`STUDIO_SSE_LIFETIME` off the rendered API
    container from the SAME `RenderOutcome`. No expected value is written in the test. `--set
    studioSse.lifetimeSeconds=300` is asserted to move the annotation to 360. No values key for
    the timeout exists; `extraAnnotations` naming one of the five managed annotations fails the
    render (asserted via `outcome.ok === false` and an error containing "one owner").
  ordinary_rest_unchanged:
    verdict: 'VERIFIED INDEPENDENTLY of the test.'
    method: >-
      I rendered values-prod.yaml with `studioSse.ingress.enabled=false` and true and diffed the
      raw output: document count 15 → 16 (delta exactly one) and the textual diff contains only
      additions — no `<` line, so no pre-existing document changed in any byte. The test's own
      form (per-document JSON fingerprint over every document except the streaming Ingress, plus
      `documents.length === without.length + 1`) is correct and non-vacuous.
  ac15_no_affinity:
    verdict: 'VERIFIED. AC-15 was not made passable by session affinity.'
    method: >-
      `helm template` for all four value sets, case-insensitive grep for
      affinity|sticky|upstream-hash-by|session-cookie: 0 hits in each. Same grep over
      helm-chart/put-checks/templates/: no matches. AC-15 remains an `it.skip` in
      test/deferred.test.ts.

