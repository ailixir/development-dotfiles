# ─────────────────────────────────────────────────────────────────────────────
# THE CENTRAL QUESTION — the `application-local.yml` opening
# ─────────────────────────────────────────────────────────────────────────────
central_question:
  question: >-
    A story whose subject is closing authentication bypasses opened one in a test profile and
    reports that many tests now pass. Correct scoping, or green-because-auth-is-off?
  ruling: 'CORRECT SCOPING — and the opposite of the feared shape.'
  verified:
    - id: 'which property, which profile'
      finding: >-
        `identity-headers` ONLY, in `application-local.yml` and `application-test.yml`.
        `core-service` and `csi-read` are left at the new default of `false` in both, so the
        suite OBSERVES the closure rather than being insulated from it. Read from the diff of
        all three yml files; no other profile file was touched.
    - id: 'the profile is not deployed'
      finding: >-
        All four Helm value sets render an explicit profile and none is `local` or `test` —
        values.yaml `api,prod`/`worker,prod`, values-dev `api,dev`/`worker,dev`, values-uat
        `api,staging`/`worker,staging`, values-prod `api,prod`/`worker,prod`. Both Deployments
        set SPRING_PROFILES_ACTIVE unconditionally (deployment.yaml:63 and :244). No Dockerfile
        or script sets it elsewhere.
    - id: 'the rendered manifests close all three'
      finding: >-
        `helm template` for each of the four value sets renders exactly 3 `CHECKS_BYPASS_*`
        keys, all on the API container, all `false`. Counted on the rendered output, not the
        values source.
    - id: 'no authorization assertion rides on the open flag — MEASURED, not argued'
      finding: >-
        PROBE B. I set `identity-headers: false` in application-local.yml and re-ran
        ConfirmCompileRouteTest: 8 of 10 tests FAILED, including
        `aReaderOfTheCsiIsForbiddenRatherThanToldAboutTheCandidate()` (a 403 assertion) which
        degrades to 401. Closing the flag turns identified callers into anonymous ones and
        breaks authorization assertions in the FAIL direction. The open flag is therefore the
        ENABLING condition for a non-vacuous authorization test, never a masking one. The
        feared shape would require the reverse.
    - id: 'the watch is immune to the profile'
      finding: >-
        `BffSessionBypassClosureTest` is a plain JUnit test with no `@ActiveProfiles` and no
        Spring context. It constructs the real `BffSessionAuthenticationFilter` with explicit
        `IdentityBypassProperties` values, so no profile file can reach it.
  residual: 'SEC-003 below — the application default profile is `local`.'

