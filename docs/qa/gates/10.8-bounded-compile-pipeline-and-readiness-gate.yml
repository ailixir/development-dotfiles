status_reason: >-
  The load-bearing claim of this story holds, and the reviewer proved it rather than read it. The
  readiness predicate in ExecutionReadinessService carries all seven AC-22 terms including term 5's
  originalText re-hash, and READINESS_QUERY selects no compile-state column. The reviewer re-ran the
  falsification independently — t.compile_status added to the query and a `compile_status = 'READY'`
  term added to the predicate — and the readiness suite went from 30/0 to 30/7 with all three AC-23
  cases red, plus falsificationTheThreeCasesGoRedWhenThePredicateReadsCompileStatus,
  noValueOfCompileStatusChangesTheVerdict and theGateOwnQueryNamesNoCompileStateColumn. The mutant
  was reverted from a byte copy and the suite is green again. The fixture repair is the direction the
  developer claims: StudioExecutionFixtures now derives source_hash and artifact_hash through
  ArtifactCanonicalizer — the same helper the gate re-derives them with — and records provenance under
  CompilePins and the configured pin. No term of the predicate was dropped, widened or made
  conditional; the phase-2 diff of ExecutionReadinessService is an `implements` clause and a thin
  adaptor and nothing else. The contract test keeps TEST_DELETED and TEST_QUARANTINED as separate
  answers on the wire in one test that would not notice if they were split apart,
  theFrozenCompileOperationDeclaresNoConflictResponse is replaced by produced-set ==
  x-conflict-codes failing in both directions, §14.4 ordering is proven by two tests, and the four
  declared 400 codes are answered with the draft's compile state asserted unmoved. Scope is clean:
  no Flyway migration, neither artifact.schema.json copy touched, and the openapi.yaml edit is one
  deleted line — `x-not-yet-implemented: true` on compileTest — with the architect's §14 amendment
  arriving through the epic merge, not from this story. FOC-03 held: the three phase-1 commits touch
  neither shared file, phase 2 is additive at both, and exactly one ExecutionReadiness bean exists in
  the running context with ProvisionalExecutionReadiness deleted.
  What keeps this off PASS is arithmetic and honesty rather than a defect. `./gradlew check` is not
  green and AC-30 is therefore unmet on its own words: the reviewer ran the full suite twice and got
  661 tests / 24 failures / 1 skipped and then 661 / 25 / 1, the difference being DispatcherIT alone.
  Both runs are the same 23-class ED-02 baseline plus 10.7a's deliberate
  ExecutionErrorCodeContractEscalationTest. There is no 26th failure and no studio failure this story
  owns. The DispatcherIT attribution was confirmed independently: at merge base 43e28f063, extracted
  to a scratch tree with none of this story's code present, AcceptanceIT and DispatcherIT run together
  reproduce asecondDispatchPassDoesNotPickUpADispatchingRow FAILED, while DispatcherIT alone passes
  there. Four criteria are carried rather than met — AC-11b (ED-01), AC-12b (ED-05/10.18), AC-24's
  target-policy case, which has no field on the frozen contract and is the tree's one remaining
  @Disabled, and AC-30 — each named rather than ticked.

