top_issues:
  - id: BUILD-1
    severity: medium
    finding: >-
      `./gradlew check` fails, so AC-30 is unmet as written. 23 of the failures are the ED-02
      auth/BFF/rate-limit baseline this story did not create and did not change; 2 belong to story
      10.7a — ExecutionErrorCodeContractEscalationTest, which is red on purpose pending a Class C
      ruling, and DispatcherIT, which is an ordering-sensitive assertion in 10.7's file.
    suggested_action: >-
      None for this story. DispatcherIT's one-line repair — scope the assertion to the row under
      test, or seed from an empty ledger — belongs to story 10.7 and is already reported to its
      owner. Do not let it be re-run until green; it passes in isolation, which is exactly the
      property that would get it dismissed as a flake.
  - id: QUAL-1
    severity: medium
    finding: >-
      AC-29 asks for the assertion to be made on the bytes handed to the log sink. The log-site
      assertion, noLogSiteInTheCompilePackageCarriesSourceArtifactOrResolvedValues, is a source-text
      scan of every LOGGER./AUDIT. line in studio/compile and its subpackages (so it does cover
      10.5's GatewayAuditLogger) matching forbidden identifiers and throwable handoffs. The
      byte-level assertion exists only for the HTTP client side, in PromptAssemblyTest and
      RunnerValidationClientTest.noResolvedValueTravelsOnTheValidationRequest. A log site that built
      the same string through a local variable named something else would pass the scan.
    suggested_action: >-
      Add one test that installs a capturing appender and asserts the emitted bytes across a full
      compile, including the error paths. Not blocking: the scan is strict about throwables and the
      forbidden-identifier list covers the real carriers.
    status: RESOLVED
    resolution: >-
      Six tests in CompilePipelineTest now assert on captured output — a logback OutputStreamAppender
      on the root logger encoding %msg (every argument through its own toString) and %ex{full} (the
      throwable chain) into a byte buffer, with the two compile loggers lowered to TRACE — across the
      success, gateway-failure, thrown-exception, validator-rejection and failed-enqueue paths, with
      canaries planted in a source line, an artifact fragment, a resolved variable value, an
      exception message and a nested diagnostic excerpt. Falsified three ways, each red naming the
      leaked value while the source scan stayed green at 11/0: a leak through an innocently named
      local, a throwable appended on a continuation line, and the nested ValidationOutcome record
      logged by its own toString. CompilePipeline.java restored byte-identical (md5
      6adc759c6ca21b8dcd0bf5516c6669e1).
  - id: QUAL-2
    severity: low
    finding: >-
      AC-19 asks for a test at each bound and one past it. The diagnostics excerpt cap and the
      diagnostics total-byte cap are asserted only as <= inside the hostile-response test; there is
      no discrete at-the-bound case for those two rows as there is for the step, line, source-byte,
      per-step and message rows.
    suggested_action: Two small cases in CompileBoundsTest. Cosmetic relative to the coverage present.
  - id: QUAL-3
    severity: low
    finding: >-
      AC-27's negative cases are driven through readiness.requireReady rather than through
      POST /execute; the wire assertion is on the counting WireMock runner, which is what the
      criterion actually demands. Route-level 409 COMPILE_REQUIRED is covered separately by
      StudioApiIT and StudioIdempotencyIT, and the single-bean test closes the gap between the two,
      so nothing is unproven — it is proven across three files rather than one.
    suggested_action: None required.
  - id: QUAL-4
    severity: low
    finding: >-
      StudioExecutionFixtures.pinnedProvenance hardcodes "1.0.0" for syntaxReferenceVersion and
      validatorSchemaVersion rather than reading RuntimePinProperties, while correctly deriving the
      hashes and the artifact schema version from CompilePins. Changing the pin in application.yml
      would turn the fixture red rather than following it.
    suggested_action: >-
      Read the two strings from RuntimePinProperties. Low because a red fixture is the safe failure
      direction and the test that would fail says exactly which field disagrees.

required_before_merge: []

recommended_not_blocking:
  - QUAL-1 — a capturing-appender assertion for AC-29's log sink half.
  - QUAL-2 — at-the-bound cases for the excerpt and total-byte diagnostics rows.
  - QUAL-4 — bind the fixture's provenance versions to RuntimePinProperties.

do_not_do:
  - Do not relax any term of the readiness predicate to make a fixture green. The 78-test episode
    this story records is the correct behaviour of the gate and the fix direction is already
    established.
  - Do not collapse TEST_DELETED and TEST_QUARANTINED into one code. ADR-002 §14 and BRD §9 both
    forbid it and the contract test is built so a collapse cannot pass.
  - Do not re-run DispatcherIT until it goes green. It is order-dependent, it reproduces at the
    merge base, and the repair belongs to story 10.7.
  - Do not add a compile_status term to the predicate under any framing, including as an
    optimisation or a fast path.

final_decision:
  gate: CONCERNS
  merge: SAFE
  rationale: >-
    No readiness term was dropped or weakened, the status-column mutation is red on all three AC-23
    cases under the reviewer's own hand, the two withheld codes stay separate on the wire, there is
    no 26th failure, and the only contract edit is the one line ADR-002 §14 authorises. What remains
    is one unmet criterion whose causes are owned by other stories and four honest carries, each
    named in the story rather than ticked.
