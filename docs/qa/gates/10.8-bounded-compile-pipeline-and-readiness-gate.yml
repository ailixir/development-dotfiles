readiness_predicate:
  terms_present_and_unweakened: true
  detail: >-
    All seven AC-22 terms are in ExecutionReadinessService.evaluate and each refuses with its own
    message. Term 1 lifecycle (TEST_DELETED / TEST_QUARANTINED, their own codes, not
    COMPILE_REQUIRED). Term 2 confirmed_revision_id resolving to a revision of this test and CSI,
    with a separate branch for a dangling pointer. Term 3 confirmed_by and confirmed_at both
    non-null. Term 4 source_revision AND configuration_revision both compared. Term 5 both halves —
    ArtifactCanonicalizer.sourceHash over the draft's ordered originalText parsed by
    LegacyStudioAdapter.parseSteps, and ArtifactCanonicalizer.hash over the stored artifact. Term 6
    artifact_schema_version == CompilePins.SUPPORTED_ARTIFACT_VERSION, refusing RUNTIME_INCOMPATIBLE.
    Term 7 provenance validatorSchemaVersion and syntaxReferenceVersion against RuntimePinProperties,
    naming both values, with the ranged Playwright/executor terms deliberately left to the runner.
  term_5_survives: >-
    AC-22's fifth term — the one @po warned is the only term surviving a counter bug — is present in
    both halves and is exercised by ExecutionReadinessTest.editedTextUnderAnUnmovedCounterIsCaught
    OnlyByTheReHash (the counter is held fixed and the text edited) and aTamperedArtifactIsCaught
    ByItsOwnHash. It is also the term that turned 78 of 10.7a's fixture-seeded tests red, which is
    independent evidence that it is load-bearing rather than decorative.
  compile_status_absent: >-
    READINESS_QUERY names no compile-state column. The one place current_candidate_revision_id is
    read is neverConfirmedMessage, a second query that runs only after the verdict is already
    decided, which is a structural choice documented in the method's javadoc.
  standing_counterfactual: >-
    DeReadyCarryForwardTest.falsificationTheThreeCasesGoRedWhenThePredicateReadsCompileStatus writes
    the rejected predicate out in SQL and asserts it refuses the same three rows the shipped one
    accepts, per case. Without it the three AC-23 tests could become vacuous if a fixture changed.
    The reviewer confirmed the assertion is per-case and not a single aggregate.

contract_test:
  codes_separate_on_the_wire: true
  detail: >-
    compilingADeletedTestAnswersTheDeclaredStatusCode drives deleted_at then quarantined_at through
    the same route and asserts 409 TEST_DELETED then 409 TEST_QUARANTINED, deliberately as one test
    so a pair that both passed while the route collapsed them could not hide. The assertion message
    names BRD §9. theServiceGuardReallyDoesThrowAConflictForADeletedOrQuarantinedTest asserts the
    same two codes at the service layer independently of the route.
  produced_set_assertion: >-
    theProducedConflictCodesEqualTheOperationsDeclaredSet collects the codes the route actually
    answers from the wire and asserts containsExactlyInAnyOrderElementsOf against the operation's
    x-conflict-codes, so it fails both for a code answered but not declared and for one declared but
    not producible. The replaced test, theFrozenCompileOperationDeclaresNoConflictResponse, is gone
    and its replacement carries the reason on it.
  ordering_proven: >-
    authorizationIsEvaluatedBeforeTheLifecycleGuard compares a withheld-draft 403 byte for byte
    against an absent-draft 403 and asserts neither body contains TEST_DELETED or the id.
    theLifecycleGuardIsEvaluatedBeforeTheAuthoringBounds seeds a draft that is both quarantined and
    101 steps and asserts 409 TEST_QUARANTINED. beginCompile last is proven by the 400 test's
    compile-state comparison.
  four_400_codes_no_state_moved: >-
    theDeclaredBadRequestCodesAreAnsweredWithNoCompileStateMoved covers SOURCE_TOO_MANY_STEPS,
    SOURCE_LINE_TOO_LONG, SOURCE_TOO_LARGE and INLINE_CREDENTIAL, asserts the body never contains
    the matched secret, and asserts compileState(id) is equal before and after each refusal.
  requireCompilable_untouched: >-
    CompileStateService.requireCompilable was made public in phase 1 and not otherwise edited. The
    method body is unchanged; the diff is the modifier. It is a read, so AC-3 is unaffected.
  marker_removal_scoped: >-
    theOperationIsNoLongerMarkedAsNotYetImplementedAndNoOtherMarkerMoved asserts the flag is null on
    compileTest and still set on confirmCompile, which is 10.9's.
  siblings_kept: >-
    Four siblings survive — theTwoOperationsThatAlreadyCarryTheSameConflictShowHowSmallTheAmendment
    Is, theServiceGuardReallyDoesThrowAConflictForADeletedOrQuarantinedTest,
    theOperationIsNoLongerMarkedAsNotYetImplementedAndNoOtherMarkerMoved, and the two ordering
    tests — two of them now asserting the opposite fact with the reason written on them.

bounds:
  configuration_single_source: >-
    application.yml studio.compile.pipeline.* / .authoring.* / .diagnostics.* and studio.runner.*,
    bound by StudioCompileProperties and StudioRunnerProperties and validated at startup by
    StudioCompileConfig. No bound is enforced only by a comment.
  values_confirmed:
    steps: 100 (STUDIO_COMPILE_MAX_STEPS)
    line_chars: 1024 (STUDIO_COMPILE_MAX_LINE_CHARS)
    source_bytes: 65536 (STUDIO_COMPILE_MAX_SOURCE_BYTES)
    pipeline_concurrency: 4 (STUDIO_COMPILE_CONCURRENCY)
    attempt_budget: 180s (STUDIO_COMPILE_ATTEMPT_BUDGET)
    validate_timeout: 10s (STUDIO_RUNNER_VALIDATE_TIMEOUT)
    diagnostics: 10 per step / 400 message chars / 120 excerpt chars / 65536 total bytes
  at_and_past_the_bound:
    steps: exactlyTheStepCapIsAcceptedAndOneMoreIsRejected
    line_chars: exactlyTheLineCapIsAcceptedAndOneMoreIsRejected (+ the no-echo sibling)
    source_bytes: exactlyTheSourceByteCapIsAcceptedAndOneMoreByteIsRejected (+ UTF-8 counting)
    diagnostics_per_step: exactlyThePerStepCapIsKeptAndTheEleventhIsDroppedWithAMarker
    diagnostic_message: aMessageExactlyAtTheCapIsKeptWholeAndOneCharacterMoreIsMarked
    diagnostics_excerpt_and_total_bytes: >-
      covered past the bound by aHostileValidatorResponseIsBoundedAndSaysThatItWasTruncated, which
      asserts <= maxExcerptChars and <= maxTotalBytes with the truncation marker set. No discrete
      at-the-bound case for these two rows. See QUAL-2.
    budget_vs_gateway_timeout: theAttemptBudgetMustBeStrictlyGreaterThanTheGatewayRequestTimeout
  saturation_non_blocking: >-
    CompileExecutor is a ThreadPoolExecutor over a SynchronousQueue with AbortPolicy — no queue at
    all, not a bounded one. saturationRefusesTheNextAttemptRatherThanQueueingIt fills a size-2 pool
    with blocked attempts, asserts the third submit returns false, and asserts the submitting thread
    returned in under 1 s. CompilePipelineIT.aSaturatedPoolRefusesTheNextCompileWhileOrdinaryReads
    StayResponsive covers the read-starvation half against the live context.
  budget_and_late_result: >-
    theBudgetExpiresTheAttemptAndTheLateResultPublishesNothing and
    exactlyOneOfTheBudgetAndTheWorkerEverSettlesAnAttempt prove single-claim settlement by releasing
    a blocked stub after expiry.

version_pinning:
  rejected: >-
    CompilePipelineTest.aSchemaValidVersionTwoArtifactIsNeverValidatedOrPersisted stubs the gateway to
    return the same fixture with "version":2, and asserts compile_status STALE, compile_error exactly
    GATEWAY_PARSE_FAILURE, runner.verify(0, postRequestedFor("/v1/validate")) — never sent to the
    validator — and revisionCount(testId) zero — never persisted as a candidate.
  premise_asserted: >-
    ArtifactVersionPinTest.theFrozenSchemaDeliberatelyAcceptsAVersionTwoArtifact validates the
    version:2 document against the real schema and asserts it is schema-valid, so the criterion's
    premise is a measured fact rather than an assumption.
  single_literal: >-
    thePinIsOneConstantReadByEveryConsumer asserts CompilePins.SUPPORTED_ARTIFACT_VERSION == 1, that
    GatewayResponseParser's constant is the same object, and scans the tree for a second file
    assigning a literal to that name.
  gate_reasserts: Term 6 of the predicate, refusing RUNTIME_INCOMPATIBLE and naming both versions.

scope:
