top_issues:
  - id: REF-DANGLE-1
    severity: medium
    status: open
    route: backlog (epic-wide, not this story)
    finding: >-
      No test in any of the three trees resolves a $ref against components. Pointing both sides of
      AC-5's comparison at a nonexistent component leaves the backend window, the frontend mock
      suite and the runner contract test all green. The same hole covers every other $ref in the
      document, so it is not specific to 10.31 — but 10.31 is the story that adds a guard whose
      whole mechanism is $ref equality, which makes it visible.
    recommendation: >-
      One assertion, anywhere a contract test already loads the document: every $ref string under
      paths resolves to an existing node under components. One line, catches the whole class.
  - id: EXAMPLE-UNGUARDED-1
    severity: medium
    status: open
    route: "backlog (and worth @po's attention on §18.5)"
    finding: >-
      ADR-002 §18.5 requires every example this epic adds to be validated against its schema. The
      new sessionRequired example was validated once by hand by @dev before any suite ran, and by
      nothing since: Q6 breaks it against its own PlatformErrorResponse and every suite stays green.
      This is the shape the run log catalogues as PIN-1 ("a pinned copy whose provenance nothing
      checks"), one step further along — here the copy is not even compared.
    recommendation: >-
      A standing test that walks every `examples` node in the document and validates each `value`
      against the schema declared beside it. The networknt/Ajv machinery for it already exists in
      both ExecutionVideoEvidenceIT and studioContract.test.ts.
  - id: EXAMPLE-DRIFT-1
    severity: medium
    status: open
    route: backlog
    finding: >-
      ExecutionVideoEvidenceIT:596-598 asserts `isEqualTo("VIDEO_STORE_UNAVAILABLE")` — a hand-typed
      copy — under an .as(...) message reading "the declared storeUnavailable example's code,
      ADR-002 §24.6". The document's example can be changed to any code and any message with the
      whole window green (Q7). The guard catches production drifting from the test; it cannot catch
      the document drifting from production, which is what its message promises. The codebase
      already does this correctly for the sibling codes: studioContract.test.ts reads 404/410/416's
      expected code out of `examples[...].value.error`.
    recommendation: >-
      Read the expected code from ContractDocument rather than transcribing it, exactly as the
      frontend does for the other three, or change the .as(...) message so it stops claiming
      provenance it does not have.
  - id: MOCK-MESSAGE-1
    severity: low
    status: open
    route: backlog
    finding: >-
      AC-8 requires the mock's 403 body to be the backend's byte for byte. The `error` code is
      asserted (studioContract.test.ts's expectedCode map); the `message` is asserted by nothing and
      can be any string (Q8). Low because the UI branches on status and reads no refusal body
      (10.16a AC-11), so nothing downstream depends on it — but the AC says byte-for-byte.
    recommendation: One assertion on the message in studioVideoHandler.test.ts's 403 case.
  - id: PHANTOM-1
    severity: low
    status: closed
    finding: >-
      Dev Agent Record finding 6 records an unexplained mass failure (13 of 15
      ExecutionVideoEvidenceIT tests, ResourceAccessException, including the 200s) from mutating
      ExecutionVideoException.STORE_UNAVAILABLE's value, and speculates about an undocumented
      startup-time consumer.
    resolution: >-
      Does not reproduce. Q4 applies the identical mutation at rest and gets 14 passed / 1 failed
      with zero ResourceAccessException, the single failure being the code assertion M8 also
      reaches. The constant has exactly two references in the repository (its declaration and its
      one use). There is no reflective or startup-time consumer. Closed as a host-load artifact of
      the same class as today's false CompilePipelineIT alarm.
    recommendation: >-
      The Dev Agent Record should be corrected so the observation is not inherited as an open
      mystery by a later story. @dev owns that section; this gate records the disposition.
  - id: NAMES-1
    severity: low
    status: open
    route: backlog
    finding: >-
      theVideoOperationsStatusSetIsUnchanged is contradicted by its own behaviour and
      noOperationsStatusSetOrMarkerMovedWhileTestDtoGainedTwoProperties names 10.11c's subject.
      Deliberately not renamed, correctly, because AC-4 authorizes only the literal and the
      .as(...) message — both of which were corrected and are now accurate.
    recommendation: Rename in whichever story next owns those two files. Not a rework of 10.31.
  - id: DOC-STALE-1
    severity: low
    status: open
    route: backlog
    finding: >-
      ExecutionVideoException.java:30-32's Javadoc on STORE_UNAVAILABLE still reads "Undeclared in
      the frozen contract — ESC-2, escalated to an architect rather than invented (ADR-002 §12 Class
      C)". ESC-2 is ruled and the status IS declared as of this story. It is production source, so
      AC-12 correctly forbade touching it here.
    recommendation: One-line comment correction in the next story that opens backend/src/main.
  - id: SHA-DRIFT-1
    severity: low
    status: open
    route: '@dev (Dev Agent Record only)'
    finding: >-
      The story's Commits table names `850ac422b` for the second commit; the commit on the branch is
      `18126d029` (the first, `113948325`, matches). The ADR §13 rows cite `113948325` and are
      correct.

routed_to_po:
  - id: PO-1
    severity: medium
    ask: >-
      AC-2's falsification (a) and (b) each say the mutation "reddens the public-side comparison and
      the pinned list". Measured twice, by @dev and independently by this reviewer with a
      pinned-list-only probe, it does not touch the pinned list. Drop that clause from both. AC-2(c)
      is correct as written and both of its catchers were shown to work independently.
  - id: PO-2
    severity: medium
    ask: >-
      Ratify @dev's totality assertion as an accepted addition to AC-2. It is the only guard that
      catches an operation tagged `internal` and nothing else, proved here by adding one (Q9) rather
      than by retagging an existing one. Recommend ratification, no rework.
  - id: PO-3
    severity: low
    ask: 'AC-8 names two mock call sites. There is one, and there has only ever been one. Correct the AC.'
  - id: PO-4
    severity: low
    ask: >-
      AC-6's third falsification says a PlatformErrorResponse-shaped body "reddens the
      schema-validity assertion alone". Measured (Q10), a nested body reddens the pre-existing
      code-differs assertion first and never reaches the schema check. The case the schema assertion
      actually discriminates is a shape change that PRESERVES the code — e.g. a dropped `message`
      (Q11). The AC should name that case instead.
  - id: PO-5
    severity: low
    ask: >-
      Open Question 2 is now a three-file pattern, not two: docs/qa/gates/10.15-*.yml:20,128 and
      docs/qa/gates/10.16a-*.yml:133 all carry a status set that is false about the current
      document. @po declined a standing rule at validation. Worth revisiting once, at epic level,
      since every future grep for this literal will keep finding them.

