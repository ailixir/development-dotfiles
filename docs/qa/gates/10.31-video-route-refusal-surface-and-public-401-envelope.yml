flagged_items_ruling:
  item_1_ac2_falsification_predictions:
    ruling: '@dev IS RIGHT. Re-derived independently, by a different method.'
    detail: >-
      Rather than re-running @dev's deletion variant, this reviewer built a throwaway class
      (QaPinProbeTest, created and deleted in-session, tree verified clean afterwards) holding ONLY
      the four pinned-list assertions and a private copy of unauthenticatedRefs — no value
      comparisons, no counts, no totality check. Control: probe 1/1 green, ExecutionVideoContractTest
      17/17 green. Q5a (getTest's 401 -> Unauthorized): the real guard reddens at
      ExecutionVideoContractTest.java:430, the `publicRefs.values()` comparison; the probe stays
      GREEN. Q5b (claimAdmission -> SessionUnauthorized): the real guard reddens at :436, the
      callback comparison; the probe stays GREEN. The pin is over operationIds and a repointed $ref
      moves no key, exactly as @dev said. Note one nuance @dev did not state: AC-2(b) also predicts
      the "no internal operation" assertion reddens — it would, but AssertJ aborts at :436 first, so
      that prediction is unreached rather than false.
    routing: '@po — AC-2(a) and AC-2(b) must drop "and the pinned list". The guard needs no change.'
  item_2_totality_assertion_beyond_the_five_bullets:
    ruling: 'IN SCOPE, LOAD-BEARING, NOT REDUNDANT — and more so than @dev showed.'
    detail: >-
      @dev's M4 retagged runnerHealth to [internal], which moves it out of both the public and the
      runner bucket, so the 12-count and the 4-count would have caught it too; M4 therefore does not
      prove non-redundancy, only that the assertion fires first. Q9 does prove it: this reviewer
      ADDED a new path /qa-probe/internal-only with tags [internal], operationId
      qaInternalOnlyProbe and a 401. Counts stay 12/2/4 and both pinned lists stay green by
      construction, because the new operation belongs to no bucket. The ONLY red is
      ExecutionVideoContractTest.java:424 — the totality assertion. Without it this shape is a
      silent bypass of all three rules. It is a strengthening of a guard, adds no declaration to the
      document and changes no AC; it sits inside §12's test-coverage space, not its contract space.
    routing: '@po — ratify as an accepted addition to AC-2 (recommended), with no rework.'
  item_3_ac8_two_call_sites:
    ruling: '@dev IS RIGHT on the substance; its stated command is misquoted.'
    detail: >-
      One call site, at handlers.ts:442 (429 at 82322e084), plus the function declaration. The
      material claim — readable() applied before the find, so an unknown id and an unreadable CSI
      both arrive undefined — holds at that one site and was read here directly. But `git diff
      82322e084 HEAD -- handlers.ts` is NOT empty; it contains this story's own 20/7 edit. The diff
      that is empty is 82322e084..72e95cbbd. The conclusion survives; the evidence sentence is wrong.
    routing: '@po — AC-8 must say one call site. Backlog — Dev Agent Record finding 2 misquotes its own command.'
  item_4_search_inventory_differences:
    ruling: 'BOTH CONFIRMED. @po ruling 2 covers both, and nothing load-bearing was left stale.'
    detail: >-
      Re-run here. docs/qa/gates/10.16a-evidence-state-playback-and-step-seek.yml:133 is a real hit
      the draft did not name; it is a closed gate report, same class as the two 10.15 hits, and @po
      ruling 2 ("a QA gate file is a record of a closed gate ... never re-opened") applies to it word
      for word. docs/architecture/studio-execution.md:213 is genuinely not a hit: its §6.3 prose
      names 200, 206 and 416 and neither 404 nor 410, so the loose regex cannot match. Neither is
      executable and neither is load-bearing. NOTE for the epic, not for this story: three closed
      gate files now carry a status set that is false about the current document. That is the policy
      @sm's Open Question 2 raised and @po declined to make a standing rule for; it is now a
      three-file pattern rather than a two-file one.
  item_5_ac4_absence_claim:
    ruling: 'ENOUGH — on evidence beyond what @dev offered.'
    detail: >-
      M5a/M5b establish that each named copy is live, but they say nothing about a third copy, so
      they are not the corroboration the AC needs; @dev's framing ("if a third copy existed and were
      load-bearing, the document edit alone would have reddened it") is sound but rests on the full
      package having been green, which is a weak instrument for a copy in an untouched file. This
      reviewer searched by a property no formatting choice can hide: every file that mentions both
      410 and 416 in any form, and separately the symbolic HttpStatus spellings. Seven files and two
      files respectively, all known. The absence claim is now supported by a search the AC's own
      greps could have missed a copy under.
  item_6_stale_method_names:
    ruling: 'ACCEPTABLE HERE — a finding, not a defect of this story.'
    detail: >-
      theVideoOperationsStatusSetIsUnchanged is now contradicted by its own behaviour, and
      noOperationsStatusSetOrMarkerMovedWhileTestDtoGainedTwoProperties names 10.11c's subject. But
      AC-4 authorizes the literal and the .as(...) message only, both of which WERE corrected, and
      both corrected messages are accurate and specific (this reviewer read them). A method name is
      not what a reader sees when a test fails — the .as(...) message is, and that is now right. The
      right judgement is the one @dev made: rename in whichever story next owns those files, rather
      than exceed the AC. Recorded as backlog NAMES-1.
  item_7_store_unavailable_constant_mystery:
    ruling: 'CLOSED — ENVIRONMENT ARTIFACT. It does not reproduce. There is no hidden consumer.'
    detail: >-
      This was the highest-value item and it is a false alarm. Static: STORE_UNAVAILABLE has exactly
      two references in the whole repository's source — its declaration at
      ExecutionVideoException.java:33 and its single use at :92 inside storeUnavailable(). No
      reflective scan, no startup registry, no @Value, nothing. Mutating the constant's VALUE is
      therefore behaviourally identical to mutating the argument at the call site, which is M8.
      Empirical (Q4): this reviewer applied the exact mutation (STORE_UNAVAILABLE =
      "VIDEO_STORE_DOWN") and ran ExecutionVideoEvidenceIT alone at rest (load average 5.6). Result
      14 passed / 1 failed — anUnreachableStoreAndAnAbsentObjectAreDifferentAnswers at line 598, the
      code assertion, exactly as M8 predicts — and `grep -c ResourceAccessException` over the run
      log is ZERO. The 13-of-15 mass failure with "Unexpected end of file from server", including
      the 200s, did not recur in any form. It is the host-load signature the epic already knows:
      concurrent Gradle runs manufacture connection-level failures, which is what produced today's
      false 13-failure alarm on CompilePipelineIT. Restored, sha256 f23cad8c… matching pre-mutation.
    severity_as_raised: low
    why_not_higher: >-
      A finding that a constant with one reference breaks request handling would be HIGH if true. It
      is not true. The residual risk is documentary: leaving it in the Dev Agent Record as an
      unexplained observation would make it a phantom that a later story re-investigates. That is
      the reason it gets a finding at all.
  item_8_ac6_third_falsification_by_substitution:
    ruling: 'A SOUND PROXY, but the AC states the wrong catcher — and this reviewer ran the real one.'
    detail: >-
      M9 plus the in-test control are logically sufficient: the control (ErrorResponse must reject
      PLATFORM_ENVELOPE_BODY) is a standing assertion, not a one-off, so a schema loosened into
      permissiveness reddens every build, and with it the positive assertion becomes meaningful.
      That composition is valid. But it is still a proxy, so the direct version was run. Q10 makes
      the PRODUCER emit a nested body: the method reddens at :588, the pre-existing
      code-differs assertion, NOT at :601-606. AC-6's "reddens the schema-validity assertion alone"
      is false as worded. Q11 then makes the producer drop `message` while keeping the code string:
      reddens ONLY at :606. So the new schema assertion is load-bearing, and its discriminating case
      is a shape change that preserves the code — not the nested-body case the AC names.
    routing: '@po — AC-6''s third falsification should name the shape-preserving-code case.'

