fixed_during_review:
  - id: 'REL-F1'
    finding: 'Runs page past-the-end fallback and CSI-change reset pushed history entries, so Back returned to the empty page, which redirected again (back-button trap, AC1).'
    fix: 'useUrlListState.setPage(page, { replace }) added; StudioRunsPage uses replace for both corrective moves.'
    test: 'StudioRunsPage.test.tsx "falls back from a page past the end without leaving a history entry Back would bounce on (QA 10.46)". Fails without the fix.'
  - id: 'REL-F2'
    finding: 'The MSW durationMs sort ordered null-duration runs by id only. The backend orders them acceptedAt desc, then id (as openapi documents).'
    fix: 'sortBy in services/mocks/studio/handlers.ts takes an optional order for rows where both keys are null; the executions route passes acceptedAt desc.'
    test: 'studioContract.test.ts "executions: unfinished runs order newest accepted first in both duration directions (QA 10.46)". Fails without the fix.'
  - id: 'REL-F3'
    finding: 'Found by the orchestrator in the browser check: the debounced search used a stale update closure, so a sort or filter changed during the 300 ms debounce was overwritten.'
    fix: 'updateRef in hooks/useUrlListState.ts (fixed by the orchestrator; not re-edited by QA).'
    test: 'useUrlListState.test.tsx "a pending search keeps a sort or filter changed while it was debouncing"'
