review_notes:
  sql_safety: 'Both custom repositories build JPQL from fixed fragments. Sort comes from enums, every value is a bound parameter, and LIKE escapes %, _ and ! with ESCAPE.'
  csi_scope: 'readableCsiIds is applied in the same statement before paging, csiId only adds an equality, and an empty scope returns an empty page. Not widened.'
  n_plus_1: 'List testName is one batch query per page (findNamesByIdIn). Single read adds one query. SSE adds one per frame (PERF-001).'
  fe_races: 'Tests: AbortController plus sequence guard. Runs: abort-previous plus sequence; silent polls do not dim the list or surface errors. Merge by revision; dedupe by id in studioApi.'
  polling: 'Polls only while a visible row is PENDING or RUNNING and no error. Paused on visibilitychange hidden, with an immediate read on return. Cleared on unmount.'
  drawer: 'The subscription is keyed by executionId, closed on unmount or run change, and opened only for non-terminal runs. Off-page runs are loaded through getExecution with a cancel guard.'
