    severity: low
    finding: 'MSW vs backend: mock GET /executions/:id answers 400 for an unknown id (handlers.ts:600), backend 404, so the standalone drawer shows "could not be loaded" instead of "Run not found". Mock lastRun/status filters are case-sensitive (handlers.ts:288, 619); backend and openapi text are case-insensitive, while openapi also declares an uppercase enum.'
