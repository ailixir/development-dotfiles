          timeouts, and supplies neither `spawner` nor `childModulePath`.
      - attempt: Carry it in on an option object / a spread
        result: >-
          FAILED. The reviewer called playwrightBrowserFactory.launch against the built dist with
          `chromiumSandbox: false`, `args: ['--no-sandbox','--disable-setuid-sandbox']`,
