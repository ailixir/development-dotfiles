# ─────────────────────────────────────────────────────────────────────────────
# The timeline invariant (ADR-002 §11) — all four claims
# ─────────────────────────────────────────────────────────────────────────────
timeline:
  claim_1_origin_taken_in_the_child_from_one_sample:
    finding: TRUE
    proof: >-
      src/run/timeline.ts takeRunOrigin calls source.monotonicNow() once and derives both the zero
      and startedAtMs from that single sample; the clock closes over the same value.
      src/run/childRuntime.ts calls it after the recording context and page are ready, in the
      child, and assigns the resulting clock to the run state.
  claim_2_browserStartedAt_read_adjacently_and_shipped_in_the_ready_message:
    finding: TRUE
    proof: >-
      takeRunOrigin takes the wall-clock read immediately after the monotonic one, from the same
      call; childRuntime puts browserStartedAt.toISOString() and startedAtMs into the same `ready`
      message. RunSnapshot.markBrowserStarted now *takes* the instant instead of reading a clock,
      so there is no second origin at the reporting layer.
  claim_3_executeSteps_default_deleted_and_refused_at_run_time:
    finding: TRUE
    proof: >-
      `const defaultClock: Clock = { now: () => performance.now() }` is deleted from
      src/executor/executor.ts, `ExecuteOptions.clock` is required, and executeSteps throws when
      the emitted JavaScript receives undefined.
  claim_4_null_browserStartedAt_strips_every_reading:
    finding: TRUE
    proof: >-
      RunSnapshot.build enforces it at the producer: when browserStartedAt is null it emits
      `steps: []` and maps every log entry through withoutReading, so no atMs survives. Observed on
      the wire by the real launch-failure test, which asserts empty steps and every atMs null.
  process_origin_fallback_search:
    command: grep -rn "performance.now" src/
    finding: NONE ON THE REPORT TIMELINE
    detail: >-
      Three sites remain. src/run/timeline.ts systemOriginSource is the intended one and its origin
      is subtracted away. src/server/application.ts:102 feeds runCoordinator's `now`, used only at
      lines 318 and 530 for admission-elapsed and deadline arithmetic — never for a reading placed
      in a report. src/run/playwrightAdapter.ts:169 feeds a polling deadline inside the adapter and
      is never read into a step or log entry. No report reading can reach a process origin. The
      coordinator's `session.run?.origin ?? takeRunOrigin(...)` fallback exists only for 10.6's
      in-process fakes and is itself a properly zeroed origin, not a process one.
  falsification:
    method: >-
      Temporarily replaced the body of takeRunOrigin with the process-origin arrangement
      (monotonicZero 0, startedAtMs = monotonicNow(), clock = monotonicNow()) and ran
      test/run/timeline.test.ts and test/server/timeline.test.ts.
    result: >-
      RED, exit 1 — 7 failed / 6 passed, including "samples the monotonic clock exactly once",
      "takes the wall-clock instant adjacently to the monotonic one", "computes the first reading
      from the sample that defined the zero", "is zeroed against the real monotonic source too" and
      both scale bounds. Restored.
  verdict: REPAIRED AND FALSIFIABLE

# ─────────────────────────────────────────────────────────────────────────────
# AC-12a — the seek measurement, judged rather than accepted
# ─────────────────────────────────────────────────────────────────────────────
seek_measurement:
  reviewer_run:
    run_1: [-1.0, -34.1, -33.2, +650.4, +376.4]
    run_2: [-1.3, -34.5, -30.3, -24.4, -21.0]
    median_absolute_error_ms: ~30
    within_42ms: 8 of 10
    outliers: 2, at +650 ms and +376 ms, both in run 1
  developer_run_for_comparison:
    outliers: 2, both at ~+370 ms, both at step 4
  judgement: INSTRUMENT LIMITATION, NOT REAL SEEK ERROR
  reasoning: >-
    Three independent lines point the same way. (1) The two runs execute an identical, deterministic
    step sequence and the *runner's* readings agree to within 5 ms — run 1 step 3 reported 2189.6 ms
    and run 2 reported 2184.4 ms — yet the detector's answer for that step moved by 680 ms, from
    2840.0 ms to 2160.0 ms. A real seek error cannot be present in one run and absent in the next
    while the reading barely moves; a detector that sometimes misses a repaint can. (2) The
    mis-attributed values are not arbitrary: they land on the *next* scene change in the ~720 ms
    step cadence, which is the signature of a missed match rather than of a timing offset. The
    detector's threshold is `peak * 0.12`, so a full-viewport repaint split across two encoded
    frames falls below it and the match slides to the following change. (3) The error is strictly
    one-directional and quantized to roughly the inter-step spacing. The developer's attribution is
    sound and their refusal to claim the 500 ms target is correct.
  tolerance_not_widened:
    finding: CONFIRMED
    detail: >-
      MEDIAN_TOLERANCE_MS is 100 against a measured median of ~30, and the reported figure is the
      measured one. The reviewer widened nothing and recommends nothing be widened.
  residuals:
    - >-
      OUTLIER_BOUND_MS is 2500 — five times the §6.4 target — so the per-step assertion carries no
      evidence about that target. The story says so explicitly. Recorded as MED-1 for flake risk
      only: a mis-attribution that skipped two steps rather than one would exceed it.
    - >-
      firstChangeAtOrAfter matches forward with 60 ms of backward slack, so the measurement is
      one-sided: a reading systematically late by up to 60 ms would score as near-zero error rather
      than as negative error. Recorded as LOW-2.

