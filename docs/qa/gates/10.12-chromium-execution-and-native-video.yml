top_issues_recheck:
  - id: SEC-2
    severity: medium
    title: PLAYWRIGHT_BROWSERS_PATH and HOME redirect the browser registry, and nothing verifies the binary that launches
    ac: 'AC-6b (in-cluster), architecture §9.3, ADR-001 §4.2'
    owner: '@dev / 10.18 under AC-6b'
    blocking: false
    finding: >-
      Both variables are on INHERITED_ENV_KEYS and neither matches the code-loading class guard.
      The reviewer built a registry that symlinks every real file except chrome-headless-shell,
      replaced that one with a shim exec'ing the real binary with --no-sandbox prepended, and
      pointed each variable at it in turn. Both launched the shim. The run reported ready normally
      and no gate noticed: `chromiumBuild` is recorded by scripts/write-runtime-versions.mjs at
      *build* time from PLAYWRIGHT_BROWSERS_PATH, and nothing anywhere reads the running browser's
      identity — `grep -rn '\.version()\|executablePath' src/` returns nothing.
    why_medium_and_not_high: >-
      Stated plainly so it can be overridden. (1) It does not set `chromiumSandbox` to `false`.
      AC-6a's criterion — the launch option, and no key, variable, field or code path that unsets
      it — now genuinely holds; both code-injection channels into the runner's own process are
      closed. What this defeats is browser-image *integrity*, a different property. (2) Unlike
      NODE_OPTIONS these variables cannot be dropped: ADR-001 §4.2 makes PLAYWRIGHT_BROWSERS_PATH
      the mechanism by which the pinned image tells the library where its browsers live, and HOME
      is the same thing by default. So this is not a residual of the SEC-1 fix; it needs a
      different control. (3) That control already has an owner: **AC-6b**, which is open and
      deferred to ED-05/SPK-04/10.18, and which is precisely where the sandbox is proven to start
      under the cluster's PodSecurity level with readOnlyRootFilesystem — an immutable browser path
      is the same property, established by the platform rather than by launch code. (4) The
      runner-side check that would help is only meaningful in the image, because `chromiumBuild` is
      null outside it, so it would land with 10.18 regardless.
      **If the reading is instead "any environment-borne path to an unsandboxed Chromium is HIGH",
      this qualifies and the gate should be read as blocked.** The reviewer's judgement is that it
      is not, for the four reasons above.
    required_of_ac_6b: >-
      AC-6b's in-cluster criterion must state browser-path immutability explicitly — the browser
      resolves from the read-only image and neither PLAYWRIGHT_BROWSERS_PATH nor HOME can be
      pointed at a writable volume — rather than leaving it implied by readOnlyRootFilesystem.
    suggested_hardening: >-
      Cheap and in the right place: at launch, when `chromiumBuild` is asserted, compare the
      resolved executable path and the browser's reported version against it and refuse on
      disagreement. The runner already records the value for exactly this purpose and today only
      compares it against itself.

