# ─────────────────────────────────────────────────────────────────────────────
# Issues
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: SEC-1
    severity: high
    title: NODE_OPTIONS is forwarded into the browser child, and a preload delivered through it unsets the sandbox
    ac: AC-6a
    owner: '@dev / 10.12'
    blocking: true
    finding: >-
      src/run/launcher.ts INHERITED_ENV_KEYS lists NODE_OPTIONS among the variables the browser
      child inherits from the runner process. Node accepts --require and --import inside
      NODE_OPTIONS, so a file reachable by the runner is executed inside the browser child before
      src/run/child.js runs. The reviewer wrote such a preload, had it replace
      chromium.launchPersistentContext with a wrapper spreading the caller's options and overriding
      chromiumSandbox to false with args ['--no-sandbox'], and drove the *real*
      createChildBrowserLauncher against the built dist. The preload logged two pids — the parent
      and the forked browser child — then "INTERCEPTED chromiumSandbox=true", and the launch
      completed normally, reporting ready with startedAtMs 0. Nothing in the repository changed, so
      the eslint no-restricted-syntax rule, the repo-wide scan in test/run/sandbox.test.ts and every
      fixtures-tier launch all stay green.
    why_it_matters: >-
      Architecture §9.3 forbids disabling the sandbox *silently* to make the image run. This is
      precisely that pathway: a NODE_OPTIONS entry plus a mounted file is a Deployment-manifest
      change with no source diff and no gate to fail, which is the shape an expedient fix takes
      under deadline. The same channel also runs arbitrary code next to the page that holds the
      run's resolved secrets, which bears on AC-3's "no generated source crosses into the browser
      process" and AC-21's canary confinement, both of which were otherwise verified.
    honest_caveat: >-
      This is code injection, not a configuration toggle: it needs both the environment variable and
      a readable file. It does not make the sandbox optional for an ordinary operator, and it is not
      a defect in the launch code itself. It is nonetheless a real environment-borne path to an
      unsandboxed launch, delivered through an allowlist this story authored, and AC-6a's wording
      admits no such path.
    suggested_fix: >-
      Remove NODE_OPTIONS from INHERITED_ENV_KEYS. The child needs PATH, HOME and
      PLAYWRIGHT_BROWSERS_PATH to run; it does not need NODE_OPTIONS, and dropping it is the only
      entry on that list that grants arbitrary code execution in the browser process. Add an
      assertion over childEnvironment that the constructed child env contains no key capable of
      preloading code, so the allowlist cannot silently regrow one.
    dev_resolution:
      status: RESOLVED
      by: '@dev / 10.12'
      note: >-
        NODE_OPTIONS removed from INHERITED_ENV_KEYS and the rule restated as a class —
        assertNoCodeLoadingKeys refuses NODE_*, LD_*, DYLD_* and OPENSSL_* in the constructed child
        environment on every launch — plus execArgv: [] on the fork, which closed a second channel
        of the same kind (fork replays the parent's interpreter flags); the reviewer's attack and
        the execArgv variant were both re-run and no longer preload the child, the five in-repo
        attacks still fail, and re-adding NODE_OPTIONS turns three launcher.test.ts tests red.
  - id: MED-1
    severity: medium
    title: The per-step seek bound is five times the §6.4 target, so it protects against nothing but a process origin
    ac: AC-12a
    owner: '@dev / SPK-06 phase B'
    blocking: false
    finding: >-
      OUTLIER_BOUND_MS is 2500 ms. It exists to tolerate the detector's ~1-in-10 mis-attribution and
      it does that, but it means the only per-step regression it can catch is one on the scale of a
      process uptime. The reviewer's own run produced a +650 ms outlier, larger than either of the
      developer's, so the headroom is being used. A mis-attribution that skipped two steps in the
      ~720 ms cadence would exceed the bound and make this test flaky rather than strict.
    note: >-
      The story states this limitation plainly and does not claim the target. Do NOT widen the bound
      in response; the right closure is AC-12b in staging with a decoder available.
    dev_resolution:
      status: RESOLVED
      by: '@dev / 10.12'
      note: >-
        Lowered, not widened: OUTLIER_BOUND_MS is 1500 ms, chosen against fifty recorded per-step
        errors (eight fresh runs plus this review's two) whose worst mis-attribution is 657.7 ms, a
        clean one-step skip — 1500 clears that plus a further full ~720 ms cadence with 122 ms to
        spare, so a miss one step worse than any observed still passes, while a per-step regression
        is now caught at 1.5 s rather than 2.5 s. MEDIAN_TOLERANCE_MS untouched at 100 ms.
  - id: MED-2
    severity: medium
    title: childModulePath and spawner are production-reachable seams with no guard that production leaves them unset
    ac: AC-5
    owner: '@dev / 10.13'
    blocking: false
    finding: >-
      ChildLauncherOptions carries `spawner` and `childModulePath`, both optional and both honoured
      by createChildBrowserLauncher. Today src/main.ts createConfiguredLauncher passes neither, so
      production always forks DEFAULT_CHILD_MODULE_PATH, and no configuration key exposes either.
      Nothing asserts that, however, and 10.13 is about to touch this constructor. A test over
      createConfiguredLauncher asserting the constructed launcher carries no spawner and no module
      override would make the property hold across that change rather than by current habit.
    dev_resolution:
      status: RESOLVED
      by: '@dev / 10.12'
      note: >-
        createConfiguredLauncher now builds a literal typed
        Omit<ChildLauncherOptions, 'spawner' | 'childModulePath' | 'parentEnv'>, so supplying a seam
        is a compile error (verified: TS2353), and test/run/production-seams.test.ts asserts the
        constructed options key for key so a seam wired in by 10.13 fails there rather than shipping.
  - id: LOW-1
    severity: low
    title: A source comment overstates where performance.now() appears
    ac: AC-11
    owner: '@dev'
    blocking: false
    finding: >-
      src/run/timeline.ts states that performance.now() "appears here and nowhere else on the
      production path". It also appears in src/server/application.ts:102 and
      src/run/playwrightAdapter.ts:169. Both are deadline and polling clocks whose values never
      reach a report, so the invariant the comment is defending genuinely holds — but the sentence
      as written is checkable and false, and a future reader grepping to confirm it will be
      misled into thinking the invariant broke.
  - id: LOW-2
    severity: low
    title: The seek matcher is one-sided
    ac: AC-12a
    owner: '@dev / SPK-06 phase B'
    blocking: false
    finding: >-
      firstChangeAtOrAfter searches forward with 60 ms of backward slack, so a reading that ran
      systematically late by up to 60 ms would be scored as near-zero error rather than as negative
      error. Harmless at today's magnitudes and the slack is documented, but the measurement cannot
      distinguish "accurate" from "late by less than a frame interval and a half".
  - id: LOW-3
    severity: low
    title: AC-20's measurable-gap bound is weaker than the property it stands for
    ac: AC-20
    owner: '@dev'
    blocking: false
    finding: >-
      `observedStart - dispatchedAt > 20 ms` would also be satisfied by an instant taken at child
      start rather than at browser start, since a fork plus a Node bootstrap alone exceeds it. The
      stronger property is carried elsewhere (AC-11.2's single-sample assertion, which the reviewer
      falsified), so the closure stands; the bound itself simply proves less than it appears to.

