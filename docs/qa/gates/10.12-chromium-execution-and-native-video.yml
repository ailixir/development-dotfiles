status_reason: >-
  Twenty-three of the twenty-eight criteria are met and were verified by running them, four are
  honestly deferred as live `it.skip`s naming their owners, and one — AC-6a — is defeated. Every
  gate reproduces from a clean `rm -rf node_modules dist coverage`: npm ci, build, type-check,
  lint, test (760 passed / 2 skipped, 34 files), test:fixtures against real pinned Chromium
  (73 passed / 3 skipped) and check:pins all exit 0, and `check:pins --require-image` fails by
  design on the unasserted chromiumBuild/image (ED-05 O-2a) with `.nvmrc` still reading 22 and
  `engines.node` unchanged. No coverage threshold was lowered; `src/run/**` was added to `include`
  and pinned at the same 85/85/80/80 as its neighbours. Both inherited deferrals genuinely close:
  10.3's and 10.6's `it.skip`s are deleted from the tree, and the reviewer re-ran the replacement
  assertions and falsified each — breaking the CSS target in fixtures/pages/forms.html turns the
  28-example corpus red on a real locator timeout, and making the coordinator stamp a browser start
  on the launch-failure path turns "sends no STARTED at all when the launch fails" red. The
  timeline invariant is repaired on all four counts and the repair is falsifiable: substituting a
  process-origin clock inside takeRunOrigin turns 7 tests red across test/run/timeline.test.ts and
  test/server/timeline.test.ts. `recordingOriginMs` appears in no source, test or fixture, and
  docs/specs/studio/openapi.yaml and both artifact.schema.json copies are byte-untouched by this
  story's five commits. The diff is runner-only. What blocks the gate is one finding: the browser
  child's inherited-environment allowlist carries `NODE_OPTIONS`, and a `--import`/`--require`
  preload delivered through it rewrites `chromiumSandbox: true` to `false` and adds `--no-sandbox`.
  The reviewer demonstrated this end to end through the real `createChildBrowserLauncher`, the
  launch succeeded, and no lint rule, repo-wide scan or test noticed, because nothing in the
  repository changed. AC-6a's stated property — "no configuration key, environment variable, job
  field or code path that can set it to false" — is therefore false as written, and §9.3's
  "do not disable it silently to make the image run" is exactly the pathway this opens. The fix is
  one line.

