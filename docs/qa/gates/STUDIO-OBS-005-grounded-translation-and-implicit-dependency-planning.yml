resolved_findings:
  - id: SEC-001
    status: RESOLVED
    verification: R1 exact chosen-use fix remains unchanged and passes again. The
      independently ported include-chosen-unused attack is valid under the
      current model schema and ordinary plan admission, then rejects on exact
      selected meaning. Both source choices produce only their selected
      independent navigation receipt; future/nonzero coordinate and changed-need
      re-question guards remain. Initial plan/replan/action selected-use and
      immutable pin enforcement retain passing current evidence.
  - id: REL-001
    status: RESOLVED
    verification: The original genuine mTLS worker callback race now requires one
      actual final same-context metadata delivery. The stored acknowledgement
      hash matches the exact pending context/materialization/input/allocation
      snapshot, with stable context and binding identity, one SOURCE_PLAN and
      one initial bootstrap callback. The 50-case independent run also passes
      before/after callback timing with/without lost response, all six scanner
      restart windows, retry-cap committed failure, old unproved READY refusal
      before/after effects, harmless proved READY repeats, and rejection when
      metadata changes after acknowledgement. Six additional after-ACK
      source/configuration/pin/fence/lease/cancel mutations cannot grant READY
      or add model/browser/action effects. No worker evidence or dispatch right
      was manufactured.
  - id: REL-002
    status: RESOLVED
    verification: Locked reconciliation at reservation and committed send claim
      remains unchanged and passes again, including original entry race,
      reserve-to-claim, settlement-to-repair, under-ceiling delta plus
      input/output/proposal refusal, persisted exactly-once accounting, pin
      failure and terminal cancellation. Thought/tool/cache usage cases retain
      current passing evidence. No provider/runner I/O is held in an ambient
      transaction.
  - id: TEST-001
    status: RESOLVED
    verification: Frozen hostile current-page operation/target/value/assertion
      substitutions and independent oracles remain in both controlled tests and
      the opt-in provider harness. Schema-valid unsafe replies refuse through
      production validation; baselines and independent effect/field receipts
      pass. Live evaluation remains explicitly unavailable; no real-model
      quality claim.
