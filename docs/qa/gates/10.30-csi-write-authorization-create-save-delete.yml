    severity: low
    status: open (carried, re-measured)
    finding: >-
      The epic head keeps moving. The rebase-equivalence argument still holds for every file this
      story touches.
    evidence: >-
      `epic/EPIC-10` is now ff0513385 (was 7357082e3 at the previous gate, 1a5ed2822 in @dev's
      argument). `git diff --stat eb4505a04 epic/EPIC-10` is 15 files / +2590 / -44, and
      restricted to `backend/ docs/specs/ docs/architecture/` it is **empty**. `git merge-tree
