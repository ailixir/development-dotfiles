top_issues:
  - id: DETACH-1
    severity: medium
    finding: >-
      `updateTest(…, auth)` detaches whatever `findById` returns. In a caller's transaction that
      is the caller's own managed instance, so the caller's reference goes stale and everything
      it writes afterwards is silently lost.
    evidence: >-
      Throwaway probe P4, on this branch with no production change. Inside one
      TransactionTemplate, the probe called `findByIdForUpdate` (the shape of
      `StudioAuthoringService.lock`), then `updateTest(id, …, admin)`, then `held.setDescription(…)`
      and `flush`. Result: `em.contains(held) = false`, `held.name` still read "Original" after the
      save, and the row's description stayed null, so the caller's write was lost. No caller on
      this branch does this: OSIV is off, and `CompilePipelineIT`/`GatewayDisabledIT` are not
      transactional. The inference tree's `StudioAuthoringService.update` (wt/epic, uncommitted,
      read only) does exactly this: `lock` → `studio.updateTest(id, …, auth, false, true)` →
      `setAuthoring(test, …)` → `test.getSourceRevision() > source` on the same reference.
    suggested_fix: >-
      Drop the detach. After the locked read, when `auth != null`, call
      `entityManager.refresh(test)`. The row lock is already held, so the refresh reads the
      latest committed row and keeps the entity's identity. Measured as a temporary mutation
      (restored, sha256-verified): P3 still `409 STALE_REVISION`, P4 caller entity stays managed
      and its write persists, `OptimisticSaveIT` 3/3 and `StudioAuthorizationIT` 24/24 (one run;
      the race is probabilistic and P3 is its deterministic half). The unit case
      `theVisibleCopyIsDetachedBeforeTheLockedRead` must change with it.
    owner: '@dev (a 10.30 follow-up before merge), or as a mandatory FOC-07 reconciliation step'
    refs: [backend/src/main/java/com/citi/put/checks/studio/StudioService.java:286-289]
  - id: DELETE-RACE-1
    severity: low
    finding: >-
      `softDeleteTest(id, auth)` takes no lock, and Hibernate writes every column (there is no
      `@DynamicUpdate` or `@Version`). A save that commits between the delete's read and its
      flush is overwritten from the delete's stale snapshot. Both callers get a success
      response.
    evidence: >-
      Probe P1 (a widened window): the delete read the row, a save committed name "Saved",
      steps "Saved step" and source_revision 2, then the delete committed. The row ended as name
      "Original", source_revision 1 and deleted_at set. Probe P2 (the natural order): the save
      held the lock, the delete blocked behind it ("done while save holds lock? false") and then
      overwrote the save the same way. It was not introduced here: `softDeleteTest(UUID)` has the
      same shape, and the story's Implementation Notes prescribe "no second query". It is now
      the shape of the authorized HTTP route. The row is hidden once deleted, so the impact is
      content silently reverted in a draft nobody can read. By reading only (not probed): the
      same full-row write would also clear a concurrent `quarantined_at`.
    suggested_fix: >-
      Lock the delete: visible `findById` → `requireWrite` → `findByIdForUpdate` (empty → 403) →
      set `deleted_at`. Alternatively, write `deleted_at` with a targeted UPDATE guarded by the
      visibility predicate.
    owner: '@po to backlog (not a 10.30 AC)'
  - id: RECON-1
    severity: medium
    finding: >-
      The FOC-07 reconciliation with the inference tree has zero textual conflicts. Only a
      compile error stops it.
    evidence: >-
      `git merge-file` of wt/epic's uncommitted StudioService.java onto this branch, with the
      common base blob d8c6dc0c5, reported 0 conflicts. The merged file calls both checks:
      `requireCompile(auth, request.csiId())` BEFORE `requireRegisteredCsi` and `requireWrite`
      after it in `createTest`, and a `findCsiIdIncludingWithheld` authorization BEFORE the
      revisions check plus this branch's visible read in `updateTest`. `requireCompile` no longer
      exists, so it does not compile. The obvious "fix" of that error (rename it to
      `requireWrite`) would compile. By this branch's mutations, it would redden AC-9 (M6
      shape) and AC-7 (M9 shape). The withheld read (M7 shape) would redden only
      `StudioServiceWriteAuthorizationTest`, and no HTTP test.
    owner: FOC-07 reconciliation (run log; @architect, @po, @pm)
  - id: REBASE-1
    severity: low
    finding: >-
      The epic head moved after @dev's rebase-equivalence argument. The argument still holds
      for every file this story touches.
    evidence: >-
      `epic/EPIC-10` is now 7357082e3 (the carry-forward), not 1a5ed2822. `git diff --stat
      eb4505a04 epic/EPIC-10` touches only docs/qa, 10.31/10.32 stories, four frontend test files
