    owner: whoever merges

# ─────────────────────────────────────────────────────────────────────────────
# Rulings the orchestrator and @dev asked for
# ─────────────────────────────────────────────────────────────────────────────
rulings:
  detach:
    verdict: >-
      Correct on this branch and necessary, but the wrong primitive for the long term (see
      DETACH-1).
    concurrency: >-
      Save versus save: after the detach, `findByIdForUpdate` is a fresh `SELECT … FOR UPDATE`.
      Under READ COMMITTED, the second saver blocks and then reads the committed revision, so it
      gets 409. Measured two ways. M10 (no detach) gave `OptimisticSaveIT` `[200, 200]`. Probe
      P3, where the context already held a revision-1 copy and another save committed revision 2,
      answered `409 STALE_REVISION` with the detach and succeeded, overwriting, without it (M10
      run). A request that lands between the detach and the lock is exactly the case the lock
      read handles: a concurrent save gives a fresh revision (409), and a concurrent delete or
      quarantine gives an empty restricted read (403, AC-8 step 4). The CSI cannot change in
      that window because no application path writes `csi_id` after create. Note that this is
      API-enforced, not a DB trigger (V12 only has the CHECK).
    symptom_or_fix: >-
      It is a symptom of §27.2's mandated double read (visible, then locked). The double read is
      the ruling, so the fix belongs at the second read. Refreshing after the lock treats the
      symptom without releasing the caller's instance, which the detach does.
  ac6_same_draft:
    verdict: >-
      "Same fixture" is accepted. It is the only reading that satisfies both AC-1 and AC-6:
      AC-1 requires AC-6 green before the fix, and before the fix AC-2's rows are already mutated,
      so the owner's DELETE on them answers 400. The rows are seeded by the same
      `seedWritableDraft`, on the same CSI, with the same path and id shape. An optional
      tightening after this story: running the owner on AC-2's own rows is now possible, because
      they stay unchanged.
  ac18a_read_path:
    verdict: >-
      Read and confirmed. `updateTest(…, auth)` makes exactly two ui_tests reads, `findById`
      (visible) and `findByIdForUpdate` (JPQL on the `@SQLRestriction` entity). It makes no
      native or scalar CSI read, and `project()` reads the revision by candidate id and test
      id. `softDeleteTest(id, auth)` makes one read, `findById`. That `findById` honours the
      restriction is proven over HTTP, not assumed. Under M4, AC-4 went red for the soft-deleted
      and quarantined cases too, so the visible read returned empty for them. If it had not, the
      restricted locked read would have kept them 403. AC-5 is green on the unmutated code, and
      `findById` is the delete path's only read.
  internal_overloads:
    verdict: >-
      Unchanged, and proven. `main` has no caller of `updateTest(UUID, UITestRequest)` or
      `softDeleteTest(UUID)`: the only callers are in tests, and the controller now calls the
      authenticated forms. `git diff --stat eb4505a04 HEAD -- backend/src/test` shows only
      StudioAuthorizationIT and the new unit test. All the AC-10 callers are inside the green
      package run. Unit cases (c) pin the exception type and message.
    note: >-
      Probe P3b (informational, pre-existing): the internal overload also returns a stale managed
      copy to the lock when its caller already holds the row. No caller does that today.

