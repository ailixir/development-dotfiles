status_reason: >-
  O-18 is closed. The mutations prove it, not the green run: M2, M3, M4, M7, M9 and M10, applied by
  this reviewer to the committed StudioService, each went red exactly where the story predicts, and
  everything the story says must stay green stayed green. The whole studio package reproduces
  @dev's 707 = 698 passed + 2 failed + 7 skipped, and the two failures are ESC-1 and ESC-2. §27.6's
  four blocks are byte-verbatim in the contract, the parsed status sets are unchanged, and the pin
  equals the file. The verdict is CONCERNS rather than PASS because of the `EntityManager.detach`
  that @dev added outside the story. It is correct on this branch: measured, it is what makes
  concurrent saves serialize. But it unmanages any entity a transactional caller already holds.
  The studio-inference tree's `StudioAuthoringService.update` has exactly that shape, and a textual
  merge of the two trees has zero conflicts. A probe on this branch showed that caller's
  later writes being silently dropped. A refresh after the lock keeps every property the detach
  buys without that hazard, also measured. A second, pre-existing lost update on
  delete-versus-save is now on the authorized HTTP path.

