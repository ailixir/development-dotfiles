# ─────────────────────────────────────────────────────────────────────────────
# FOC-07 reconciliation constraints (for the run log; read-only observation of wt/epic)
# ─────────────────────────────────────────────────────────────────────────────
reconciliation_constraints:
  - '`createTest` (all overloads): `requireRegisteredCsi` first, then exactly one `requireWrite`. Drop the inference tree''s `requireCompile(auth, csiId)` before it; its inline blank check may stay ahead of both (AC-9).'
  - '`updateTest` (every overload with a caller): revisions check first, then the visible read and `requireWrite` on that draft''s CSI, then the locked read with empty → 403. Never `findCsiIdIncludingWithheld` (AC-7, AC-8). Delete the inference tree''s leading withheld-read authorization.'
  - '`updateTest` with a caller must keep `entityManager.refresh(test)` immediately AFTER `findByIdForUpdate`, and must **never detach**. Both halves are load-bearing and each is measured: a detach unmanages the caller''s instance and drops its writes (D1), no refresh loses the concurrent save (D2), and a refresh before the lock reopens the same lost-update window and turns a concurrent delete into a 500 (D3). `StudioAuthoringService.update` calls the save inside its own transaction on an entity it holds, so this is what keeps its authoring metadata.'
  - '**(Superseded at e3bfb7b59, and reversed.)** The old constraint — "a caller that writes to the draft before the save must flush first" — is now discharged by the callee: `updateTest` flushes immediately before the refresh, so the write survives in every flush mode (REFRESH-FLUSH-1, closed). The constraint that replaces it is the opposite one: **a caller must not hold dirty state on the draft across the save at all.** The flush that preserves the write also makes the refresh read this transaction''s own full-row UPDATE — `UITest` has no `@Version` and no `@DynamicUpdate` — so the revision comparison misses a concurrently committed save and overwrites it silently, in all three flush modes (DIRTY-CALLER-STALE-1, measured). The inference tree''s `StudioAuthoringService.update` is still safe as written because it writes only *after* the save; if `setAuthoring` is ever moved ahead of `studio.updateTest`, adding a flush is **not** the remedy — the write must go through a separate unit of work, or `UITest` must gain a `@Version`.'
  - '`entityManager.flush()` at StudioService.java:312 is context-wide, not entity-scoped: after the merge, a caller''s unrelated pending writes are issued while the `ui_tests` row lock is held. Keep the flush after the locked read (never before it) so the window stays as narrow as it can be, and do not move any of the 403 decisions after it — all of them currently run before the flush, which is what keeps a throwing flush from being mistaken for an authorization or conflict answer (FLUSH-SCOPE-1).'
  - '`softDeleteTest`: keep this branch''s `softDeleteTest(id, auth)` and the controller''s `Authentication` parameter; the inference tree leaves delete unchecked.'
  - '`StudioAuthoringService.compile` authorizes through `findCsiIdIncludingWithheld`, which is the compile/confirm precedent and allowed. Its `create` authorizes itself and then calls `createTest(…, auth, …)`, so after the merge it is checked twice. That is harmless, but it is a second check, which FOC-07 says not to add.'
  - 'After the merge, re-run StudioAuthorizationIT, StudioServiceWriteAuthorizationTest, OptimisticSaveIT, StudioSaveInCallerTransactionIT and the inference tree''s own authoring suites on the merged tree. None of them can see the merge from its own branch.'

before_merge:
  - '**Nothing blocks the merge, and nothing blocks merging 10.30 ahead of 10.31.** DETACH-1 and REFRESH-FLUSH-1 are both closed and both re-falsified by this reviewer, F1/F4 exactly as @dev reported and F5/F6 additionally.'
  - 'Backlog DIRTY-CALLER-STALE-1 with DELETE-RACE-1 — same root (`UITest` has no `@Version` and no `@DynamicUpdate`), and one change closes both. Neither is a 10.30 AC and neither is reachable over HTTP.'
  - 'FOC-07 must carry the reversed caller-side constraint above. The old "flush first" advice is now wrong and must not be copied into the merged tree.'
  - 'Merge 10.30 before 10.31 (FOC-07 step 1 of 2), then re-run the package and `npm test` on the merged epic tree, carrying the reconciliation constraints above.'

