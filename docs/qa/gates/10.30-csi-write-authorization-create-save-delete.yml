  - id: REFRESH-FLUSH-1
    severity: low
    status: closed
    closed_at: e3bfb7b59
    resolution: >-
      `entityManager.flush()` at StudioService.java:312, immediately before `refresh(test)` at :313,
      inside the existing `if (auth != null)` block and after `findByIdForUpdate` — so the caller's
      pending write goes out while this transaction already holds the row lock. The property no
      longer depends on the caller's flush mode. The false comment sentence ("Its own earlier writes
      were flushed by the locking query") is gone. Case (b) is now `@ParameterizedTest
      @EnumSource(CallerFlush.class)` over AUTO / COMMIT / Hibernate MANUAL and records
      `Session.isDirty()` immediately before the call.
    verification: >-
      Re-run by this reviewer on e3bfb7b59 against the committed `StudioService.java`, harness in
      `$HOME` (outside the shared scratchpad), anchor-count assertion per edit, sha256 compare on
      restore (6cf33f0a… every time, equal to `git show HEAD:…`). Class set per row:
      `StudioSaveInCallerTransactionIT` + `StudioServiceWriteAuthorizationTest` + `OptimisticSaveIT`
      = 15 tests, read from the `> … PASSED|FAILED` console lines.
      Unmutated: 15/15 pass.
      F1 (flush removed, refresh kept): 12 passed, 3 failed — case (b) `COMMIT`, case (b) `MANUAL`
      and the unit order case. **Case (b) `AUTO` green**, case (a) green, `OptimisticSaveIT` 3/3.
      The JUnit XML gives exactly one soft failure per red parameter,
      `[the caller's write before the save] Expecting actual: "null" to contain: "before the save"`
      — so the `isDirty()` precondition passed and only the row assertion failed. That is @dev's
      claim, reproduced, and it is the reason an AUTO-only case (b) was never a guard here.
      F4 (refresh removed, flush kept): 12 passed, 3 failed — case (a), `OptimisticSaveIT >
      twoConcurrentSavesWithTheSameRevisionsLeaveExactlyOneWinner` and the unit order case. Case (b)
      green in all three modes. The converse, as claimed.
      F5, this reviewer's own (flush hoisted above the `if (auth != null)` block, still after the
      locked read): only `(c) the internal save touches the persistence context not at all` goes
      red. So the new unit case is falsifiable for exactly the leak it claims to guard, even though
      it was green before the fix. The order case correctly stays green — F5 does not move the flush
      relative to the lock or the refresh.
      F6, this reviewer's own (flush and refresh swapped): only the order case goes red. The order
      guard pins the order, not merely the presence of a `flush()`.
      Not a new failure mode — see DIRTY-CALLER-STALE-1 for what the flush does and does not change.
    previous_finding: >-
      `EntityManager.refresh` discards any *unflushed* change the caller has made to the draft.
      The service relies on Hibernate's default AUTO flush mode, where the JPQL locking query
      flushes the dirty `UITest` before the refresh reads it. Under `FlushModeType.COMMIT` or
      Hibernate's `MANUAL`, the caller's pre-save write is silently lost — the entity stays
      managed, the save succeeds, and nothing reports the loss. `StudioSaveInCallerTransactionIT`
      case (b) therefore passes for a narrower reason than its wording suggests: the write is
      dirty when `updateTest` is called (measured: `session.isDirty() = true`), but the locking
      query flushes it.
    previous_evidence: >-
      Throwaway `ZzQa1030RefreshProbeTempIT` on 63811e4a3 with no production change. Same body
      three times, differing only in flush mode, each writing `schedule` on a locked, held draft
      and then calling `updateTest(…, owner)`:
      U1 AUTO → `heldScheduleAfterSave={"written":"before the save"}`, row keeps it;
      U2 `FlushModeType.COMMIT` → `heldScheduleAfterSave=null`, row `schedule=null`;
      U3 Hibernate `MANUAL` (explicit flush at the end) → same, `schedule=null`.
      In all three the entity stayed managed and the *post*-save write landed. Isolation: with D2
      applied (refresh removed), the identical U2 and U3 runs keep the write, so the refresh is
      the thing that drops it.
      Exposure today: nothing in `backend/src/main` sets a non-AUTO flush mode (grep), and the
      inference tree's `StudioAuthoringService.update` writes nothing to the entity before calling
      the save (read at `wt/epic`, read-only: `lock` → `requireCutover` → `validate` →
      `studio.updateTest(…)` → `setAuthoring`). So this is latent, not live.
    fix_chosen: >-
      @dev took the first option (the flush) rather than the comment narrowing, and narrowed the
      comment as well. This reviewer agrees with that ordering of the two: the comment version would
      have left case (b) green for a reason its own name does not state, which this epic treats as a
      defect in its own right.
    refs: ['backend/src/main/java/com/citi/put/checks/studio/StudioService.java:300-314']
  - id: DIRTY-CALLER-STALE-1
    severity: medium
    status: open (new; pre-existing under AUTO, not introduced by e3bfb7b59)
    finding: >-
      A caller that holds a **dirty** managed reference to the draft across the save defeats the
      `STALE_REVISION` check outright: a save that committed in between is silently overwritten and
      no 409 is raised. `UITest` has neither `@Version` nor `@DynamicUpdate`, so the flush of that
      dirty reference writes **every** column from the caller's pre-lock snapshot — including
      `source_revision` — and the `refresh` that follows then reads back this transaction's own
      uncommitted write instead of the winner's. The revision comparison therefore compares the
      request against the copy the caller was already holding, which is exactly the lost update
      `findByIdForUpdate` + refresh exist to prevent. Case (a) does not catch it because its caller's
      reference is clean; case (b) does not catch it because there is no competing save.
    evidence: >-
      Throwaway `StudioFlushProbeTempIT` on e3bfb7b59, no production change, parameterized over the
      same three flush modes. One transaction: `findById` (unlocked, managed) → write `schedule` on
      the held reference → a competing `updateTest` commits on another connection and thread → then
      `updateTest(…, owner)` on this thread. Printed from the JUnit XML:
      AUTO, COMMIT and MANUAL all → `outcome=[no exception]`,
      `row={source_revision=2, description=loser, steps=["Losing step"],
      schedule={"written": "before the save"}}`. The winner's save is gone; both callers were told
      they succeeded.
      Attribution, measured rather than argued — the identical probe with F1 applied (the new flush
      removed, i.e. the shape at 303c17cf6): AUTO → `outcome=[no exception]`, same loser's row;
      COMMIT and MANUAL → `outcome=[StudioConflictException STALE_REVISION]`,
      `row={source_revision=2, description=winner, steps=["Winning step"], schedule=null}`.
      So under **production's AUTO mode the hazard predates both of this story's fixes** — the
      locking JPQL query's implicit flush already did the same damage one line earlier. What the new
      flush changes is that COMMIT and MANUAL, which previously answered a correct 409 at the price
      of dropping the caller's write (REFRESH-FLUSH-1), now behave like AUTO. That is the right
      trade — uniformity with production — but it removes the two modes that happened to be correct,
      so the hole is now uniform and nothing in the suite covers it.
      Exposure today is nil on the HTTP route: the request's persistence context holds only what the
      save itself loaded, all clean, so the new `flush()` emits nothing there (all 24
      `StudioAuthorizationIT` cases and `OptimisticSaveIT` 3/3 are green, and the package count moved
      by exactly the +3 new test cases). It needs an in-process caller in the same transaction that
      writes to the draft *before* calling the save. Nothing in `backend/src/main` does that, and the
      inference tree's `StudioAuthoringService.update` writes only after the save. But this fix's own
      case (b) now establishes "write before the save" as a supported shape, which is why this is
      recorded rather than left implicit.
    suggested_fix: >-
      Add `@Version` (or `@DynamicUpdate` plus an explicit revision-guarded UPDATE) to `UITest`, so a
      stale full-row write cannot win; that would also close DELETE-RACE-1, which has the same root.
      Failing that, compare the request's revisions against a value read with a new query after the
      lock (e.g. a projection by id) rather than against the refreshed entity, so this transaction's
      own pending write cannot satisfy the check.
    owner: '@po to backlog with DELETE-RACE-1 (same root cause; not a 10.30 AC), and FOC-07 must
      carry the caller-side constraint in the meantime'
    refs: ['backend/src/main/java/com/citi/put/checks/studio/StudioService.java:300-325',
           'backend/src/main/java/com/citi/put/checks/studio/entity/UITest.java']
  - id: FLUSH-SCOPE-1
    severity: low
    status: open (informational)
    finding: >-
      `entityManager.flush()` is context-wide, not entity-scoped. For a caller sharing the
      transaction, every pending write in its persistence context — including writes to unrelated
      tables — is now issued while the `ui_tests` row lock is held, which widens the lock window and
      creates a lock-ordering dependency that did not exist for a `COMMIT`/`MANUAL` caller.
      A flush that throws is likewise moved: a constraint violation from the caller's own pending
      write now surfaces as a `DataIntegrityViolationException` out of `updateTest` rather than at
      the caller's commit.
    determination: >-
      Not misleading, and not a new answer. `ChecksExceptionHandler` has no handler for
      `DataIntegrityViolationException` or `ObjectOptimisticLockingFailureException`, so either would
      be a 500 — the same status the caller's own commit would have produced, thrown one step
      earlier. It cannot masquerade as a 403 or a 409: every 403 decision (`findById` through the
      visibility restriction, `requireWrite`, the empty locked read) runs **before** the flush, and
      the 409s are decided after the refresh, so a throwing flush aborts the transaction instead of
      substituting a code. An `OptimisticLockException` specifically is impossible here: `UITest`
      carries no `@Version` (read). On the HTTP route the flush is a no-op, because the context holds
      only the clean entities the save itself loaded. For an `AUTO` caller nothing moves at all — the
      locking JPQL query one line earlier already flushed the same work, which the F1/probe pair
      confirms (AUTO's outcome is identical with and without the explicit flush).
    owner: 'none — recorded so the FOC-07 reconciliation knows the flush is context-wide'
  - id: DELETE-RACE-1
    severity: low
    status: open (carried)
    finding: >-
      `softDeleteTest(id, auth)` takes no lock, and Hibernate writes every column (there is no
      `@DynamicUpdate` or `@Version`). A save that commits between the delete's read and its
      flush is overwritten from the delete's stale snapshot. Both callers get a success
      response.
    evidence: >-
      Re-confirmed on 63811e4a3 (probe R3, the natural order): the save committed name "Probe
      draft"/steps ["Saved"]/source_revision 2 while holding the lock, the delete queued behind it
      (`deleteDoneWhileLockHeld=false`), and after both committed the row read
      `source_revision=1`, `steps=["Go to the home page"]`, `deleted_at` set — the save reverted,
      the delete reporting success. Unchanged by the DETACH-1 fix. Originally probes P1/P2 at
      bbeb89288. Not introduced here: `softDeleteTest(UUID)` has the same shape; it is now on the
      authorized HTTP route. The row is hidden once deleted, so the impact is content silently
      reverted in a draft nobody can read. By reading only: the same full-row write would also
      clear a concurrent `quarantined_at`.
    suggested_fix: >-
      Lock the delete: visible `findById` → `requireWrite` → `findByIdForUpdate` (empty → 403) →
      set `deleted_at`. Alternatively, write `deleted_at` with a targeted UPDATE guarded by the
      visibility predicate.
    owner: '@po to backlog (not a 10.30 AC)'
    carried_at: >-
      Still open at e3bfb7b59, and not re-probed here — the fix touches `updateTest` only and
      `softDeleteTest` is byte-identical, so the 63811e4a3 measurement stands. The orchestrator
      states this is now **DEF-03** in the manifest; this reviewer could **not** confirm that:
      `docs/epics/EPIC-10-EXECUTION.yaml` in this worktree contains no `DEF-03`, and the only
      `DEF-03` in `docs/epics/EPIC-10-RUN-LOG.md` (line 459) is "a clean timeout reported itself
      partial", a different item. Recorded as unverified rather than repeated. Note that
      DIRTY-CALLER-STALE-1 above has the same root (no `@Version`, no `@DynamicUpdate` on `UITest`)
      and should be backlogged with it.
  - id: RECON-1
    severity: medium
    status: open (carried)
    finding: >-
      The FOC-07 reconciliation with the inference tree has zero textual conflicts. Only a
      compile error stops it.
    evidence: >-
      `git merge-file` of wt/epic's uncommitted StudioService.java onto this branch, with the
      common base blob d8c6dc0c5, reported 0 conflicts (measured at bbeb89288; the DETACH-1 fix
      does not change that, it changes what the merged body must contain — see the constraints
      below). The merged file calls both checks: `requireCompile(auth, request.csiId())` BEFORE
      `requireRegisteredCsi` and `requireWrite` after it in `createTest`, and a
      `findCsiIdIncludingWithheld` authorization BEFORE the revisions check plus this branch's
      visible read in `updateTest`. `requireCompile` no longer exists, so it does not compile. The
      obvious "fix" of that error (rename it to `requireWrite`) would compile. By this branch's
      mutations, it would redden AC-9 (M6 shape) and AC-7 (M9 shape). The withheld read (M7 shape)
      would redden only `StudioServiceWriteAuthorizationTest`, and no HTTP test.
    updated_at_e3bfb7b59: >-
      Unchanged in substance — the flush is one added line inside a block the inference tree does not
      touch, so the zero-conflict measurement still stands. What changed is the **caller-side
      constraint**. The previous wording ("a caller that writes to the draft before calling the save
      must flush first, or the refresh discards the write") is now **discharged by the callee**: the
      save flushes for it, in every flush mode. It is replaced by a stronger and opposite
      constraint, measured in DIRTY-CALLER-STALE-1: a caller must **not** hold dirty state on the
      draft across the save at all, because the flush that now preserves that write also makes the
      revision check read this transaction's own write and miss a concurrently committed save. The
      inference tree's `StudioAuthoringService.update` is still safe as written — it writes only
      after the save — but "add a flush and reorder" is now the wrong remedy, and the reconciliation
      constraint below says so.
    owner: FOC-07 reconciliation (run log; @architect, @po, @pm)
  - id: REBASE-1
    severity: low
    status: open (carried, re-measured)
    finding: >-
      The epic head keeps moving. The rebase-equivalence argument still holds for every file this
