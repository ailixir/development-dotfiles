# ─────────────────────────────────────────────────────────────────────────────
# Rulings the orchestrator and @dev asked for
# ─────────────────────────────────────────────────────────────────────────────
rulings:
  detach:
    verdict: >-
      Superseded by the fix at 63811e4a3: refresh-after-lock, never detach. The ruling that the
      double read of §27.2 needs its second read made current still stands; the primitive changed.
    concurrency: >-
      Save versus save: `findByIdForUpdate` is a `SELECT … FOR UPDATE`, and the refresh that
      follows it reads the row's latest committed state while that lock is held, so there is no
      window between the read and the check. Measured on 63811e4a3 (probe R2): with the first
      save's transaction still open, a second save on another connection did not finish
      (`otherDoneWhileLockHeld=false`), and after the first committed it answered
      `STALE_REVISION` at sourceRevision 2. Under D3 (refresh before the lock) the same order
      answered `other=SUCCEEDED`, which is exactly the window the fix avoids by refreshing after.
      A concurrent delete or quarantine committing before the save's locked read gives an empty
      restricted read: probe R4 (context already holding the visible copy, delete committed on
      another connection) threw `StudioAccessDeniedException` → 403, with the row's other columns
      unchanged. Under D3 that same order threw `EntityNotFoundException` instead (a 500 shape),
      another reason the refresh belongs after the lock. The CSI cannot change in the window
      because no application path writes `csi_id` after create (API-enforced; V12 has only the
      CHECK).
    symptom_or_fix: >-
      Unchanged in substance: §27.2's mandated double read is the ruling, so the fix belongs at
      the second read. Refreshing there treats it without releasing the caller's instance.
    residual: 'See REFRESH-FLUSH-1: refresh is current-state, so it also discards unflushed caller writes.'
  ac6_same_draft:
    verdict: >-
      "Same fixture" is accepted. It is the only reading that satisfies both AC-1 and AC-6:
      AC-1 requires AC-6 green before the fix, and before the fix AC-2's rows are already mutated,
      so the owner's DELETE on them answers 400. The rows are seeded by the same
      `seedWritableDraft`, on the same CSI, with the same path and id shape. An optional
      tightening after this story: running the owner on AC-2's own rows is now possible, because
      they stay unchanged.
  ac18a_read_path:
    verdict: >-
      Read and confirmed, and unchanged by the fix (the refresh is a load by id on the entity the
      lock already returned, not a new query shape). `updateTest(…, auth)` makes exactly two
      `ui_tests` queries, `findById` (visible) and `findByIdForUpdate` (JPQL on the
      `@SQLRestriction` entity), plus the refresh's load of that same row. It makes no native or
      scalar CSI read, and `project()` reads the revision by candidate id and test id.
      `softDeleteTest(id, auth)` makes one read, `findById`. That `findById` honours the
      restriction is proven over HTTP, not assumed. Under M4, AC-4 went red for the soft-deleted
      and quarantined cases too, so the visible read returned empty for them. AC-5 is green on the
      unmutated code, and `findById` is the delete path's only read.
  internal_overloads:
    verdict: >-
      Unchanged, and proven. The fix is inside `if (auth != null)`, so the no-caller path is
      byte-identical in behaviour. `main` has no caller of `updateTest(UUID, UITestRequest)` or
      `softDeleteTest(UUID)`: the only callers are in tests, and the controller calls the
      authenticated forms. All the AC-10 callers are inside the green package run. Unit cases (c)
      pin the exception type and message.
    note: >-
      Probe P3b (informational, pre-existing): the internal overload still returns a stale managed
      copy to the lock when its caller already holds the row. No caller does that today.

