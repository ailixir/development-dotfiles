status_reason: >-
  REFRESH-FLUSH-1 is closed. @dev's fix (e3bfb7b59) flushes immediately before the refresh, inside
  the existing `if (auth != null)` block and after `findByIdForUpdate`, and this reviewer re-ran the
  pair that matters: F1 (flush removed, refresh kept) reddens case (b) `COMMIT` and `MANUAL` on the
  named assertion and leaves case (b) `AUTO`, case (a) and `OptimisticSaveIT` green — the finding,
  reproduced; F4 (refresh removed, flush kept) reddens case (a) and `OptimisticSaveIT`'s concurrent
  save and leaves case (b) green in all three modes. Two lines, two different properties, neither
  redundant. Two further mutations of this reviewer's own show the new unit guards are not vacuous:
  F5 (flush hoisted out of the `auth != null` block) reddens only the new `(c)` internal-path case,
  and F6 (flush and refresh swapped) reddens only the order case. Every mutation restored
  byte-identically (sha256 6cf33f0a… after each). The studio package is 712 = 703 passed + 2 failed
  + 7 skipped, the two failures ESC-1 and ESC-2 as before; `spotlessCheck checkstyleTest
  checkstyleMain --rerun-tasks` is BUILD SUCCESSFUL. The gate stays CONCERNS for RECON-1 (the FOC-07
  merge still has zero textual conflicts) and for one finding this review measured while probing the
  flush's failure modes — DIRTY-CALLER-STALE-1: a caller holding a *dirty* reference to the draft
  defeats the `STALE_REVISION` check outright and overwrites a concurrently committed save, in all
  three flush modes. That is **not** introduced by this fix — it already held under `AUTO`, which is
  production's mode — but the fix removes the two modes that happened to answer 409, so it is now
  uniform. Nothing on 10.30's own surface blocks the merge, and nothing blocks merging it ahead of
  10.31.

