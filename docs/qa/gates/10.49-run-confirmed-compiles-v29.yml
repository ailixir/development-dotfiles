top_issues:
  - id: 'REQ-001'
    severity: low
    finding: >-
      ui_test_compile_requests."trigger" is nullable for new rows (V29:30-32). QA checked whether NULL is
      reachable for a new V1 compile: the only INSERT is InferenceCaptureStore.persist (:208), and its
      only src/main caller with a non-null trigger is beginCompile(UUID, CompileInputs, String, Duration)
      (CompileStateService:237-243, RUN). The null-trigger caller is capture()/captureForCompilation
      (CompileStateService:104,166-177), which has no src/main caller. So NULL is not reachable for any
      V1 compile today, and NULL fails closed (runConfirms:378 requires RUN, so it publishes
      AWAITING_CONFIRMATION). The developer's argument against a DEFAULT is sound. The argument against
      NOT NULL only covers pre-V29 rows; PostgreSQL can enforce new rows only, with
      CHECK ("trigger" IS NOT NULL) NOT VALID (existing rows are not scanned, and V18's immutability
      trigger means they can never be updated into violation).
    suggested_action: >-
      Follow-up (owner @data-engineer, before any v2 caller of capture() exists): V30 adding
      CHECK ("trigger" IS NOT NULL) NOT VALID, and make capture() take a required trigger so that v2
      flows have to state their own (ADR-002 §35.3). Not blocking, because the system fails closed.
  - id: 'REL-001'
    severity: low
    finding: >-
      On the V1 Run path a publication refused by the deadline (requirePublicationBudget or the final
      CAS, CompileStateService:301-357) throws CancellationException after settlement.claim()
      (CompilePipeline:375-382). The executor expiry callback then cannot publish STALE, so the draft
      stays COMPILING until CompileAbandonmentSweeper runs. RunConfirmationTest:142 pins COMPILING. This
      pattern already existed for publishCandidate, and this story makes it reachable on the V1 path.
      deadline_at is taken at NOW() in beginCompile's transaction, a few ms before the executor budget
      starts, so the window is narrow.
    suggested_action: >-
      Consider publishError(COMPILE_BUDGET_EXCEEDED) when publication is cancelled after the claim, or
      give the executor budget a small margin below deadline_at. Track it as a follow-up.
  - id: 'DOC-001'
    severity: low
    finding: >-
      docs/runbooks/studio-inference-rollout.md:80 still says the ordinary Flyway path runs "V20–V28"
      and states the floor against "head schema (V28)". It does not say that V29 does not raise the
      rollback floor. By inference from V29 it does not: both columns are nullable, there is no default
      and no new NOT NULL, and pre-10.49 INSERT/UPDATE statements satisfy both CHECKs.
    suggested_action: 'Add a V29 bullet next to the V27/V28 note: additive, nullable, and the floor is unchanged.'
  - id: 'DOC-002'
    severity: low
    finding: >-
      The V29 rollback note (V29:24-27) has the right order: restore V27's function body before dropping
      the columns, because plpgsql resolves NEW.confirmation_source at runtime. It does not say two
      things: (a) a 10.49+ binary fails after the rollback, because its INSERT names "trigger" and its
      UPDATEs set confirmation_source; (b) the rollback erases the RUN/MANUAL audit data.
    suggested_action: 'Append both caveats to the rollback comment in a later doc-only change, or record them in the runbook. Do not edit the applied migration file if checksums are validated.'
  - id: 'TEST-001'
    severity: low
    finding: >-
      NoAutoConfirmTest pins only the presence of the runConfirms( gate, not its RUN term. Mutation B is
      caught only by the behavioural RunConfirmationTest. This is disclosed in the Dev Agent Record, and
      AC-16 accepts "or".
    suggested_action: 'Optional: assert in NoAutoConfirmTest that the runConfirms body contains RUN_TRIGGER.equals and created_by.'

