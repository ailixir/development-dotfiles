    MET. V18 tables/columns plus V27 (V27__studio_revision_immutability_restore.sql:19-43) restore the
    deny-by-default revision guard. Verified by
    InferenceMigrationLatestIT.everyRevisionColumnExceptFirstConfirmationIsImmutableOnTheHeadSchema (:290-326),
    which reads the column list from information_schema.
  AC-2: >-
    MET. uq_ui_test_revisions_compile_request (V18:83). insertCapturedRevision uses ON CONFLICT(compile_request_id)
    DO NOTHING (CompileStateService.java:878-912). Verified by mixedWriterCutoverOnHeadSchema (:655-723): distinct
    requests confirm independently and a same-request publication is a no-op.
  AC-3: >-
    MET locally. Query at InferenceCaptureStore.java:68-98 is scoped by test, CSI and fingerprint, requires
    PASSED + FULL and an exact snapshot/runtime match, and orders by (created_at, id). The indexes are
