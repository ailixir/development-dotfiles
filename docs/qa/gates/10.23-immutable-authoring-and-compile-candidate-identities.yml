challenges:
  a_v27_deny_by_default: >-
    Confirmed. The only permitted change is NULL -> value on confirmed_by/confirmed_at
    (V27:21-28 jsonb diff minus the pair). V12's CHECK ((confirmed_by IS NULL) = (confirmed_at IS NULL)) forces
    both to be set together. Overwriting or clearing an existing confirmation is rejected by V27:30-38.
    TEST gap: the head schema has no overwrite test. That case is asserted only at V12
    (RevisionMigrationIT:217-235) and V18 (InferenceMigrationIT:191).
  b_v28_update_paths: >-
    None break. Every native UPDATE of ui_test_executions (StudioDispatchLedgerStatements.java:358, 422, 509,
    600, 676, 834, 901, 959; StudioDispatcher.java:608; V14) omits execution_scope. JPA maps the column
    updatable=false (UITestExecution.java:69), FULL is set only before the first save
    (StudioAcceptanceService.java:319), and V19 does not write the column. Partitions:
    scopeGuardCoversExistingAndFuturePartitions proves the trigger on month, DEFAULT and post-migration
    partitions. PartitionManager's DEFAULT -> month move is DELETE+INSERT and keeps the value. Requires PG13+ in
    every environment (tests use 15; prod version not verified).
  c_d3_writer_parity: >-
    Parity holds for the shared value columns. Both writers now bind candidate.referencePolicy() and
    intentDerivationVersion(), and both leave expected_intent NULL. The rows are intentionally not
    byte-identical: the captured writer copies source/configuration/references/csi from the request (enforced by
    the V18 capture trigger), writes the six capture columns plus compile_request_id, and patches
    provenance.originalRevisionId. reference_policy is not part of the capture-equality trigger, the same as the
    legacy writer.
  d_rollback_floor: >-
    The floor rule still holds, but the text is wrong after the fixes. V27/V28 do not raise it: no released binary
    UPDATEs those columns, and Flyway ignores future migrations by default. The runbook (lines 78-87, 104-114)
    still says "Head (V26)", "HEAD is not yet a valid post-V19 floor", "do not apply V19", and that D1-D3 remain
    open. It also never names 571e779e1 as the new post-V19 floor: binaries from 51ade0f1f up to that commit
    break context-aware publication after V19. The V28 header rollback (DROP TRIGGER on the parent, which cascades
    to the clones, then DROP FUNCTION) is mechanically safe but re-opens D2 against the architect ruling. V27 has
    no rollback note.
  e_external_items: >-
    The sub-item is correctly unticked (story line 34). However, the AC-5 parent box (line 28) is ticked
    "(local scope)" while that sub-item is blocked. Per the Epic 10 rule it must not be ticked.

