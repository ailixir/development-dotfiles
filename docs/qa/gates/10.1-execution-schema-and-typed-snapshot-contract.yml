issues:
  - id: ISSUE-001
    severity: high
    category: correctness
    ac: ["AC-10", "AC-7", "AC-9", "AC-11"]
    finding: >-
      V14 section 6 runs `UPDATE ui_tests SET browser = 'chromium' WHERE browser = 'chrome'`
      (line 191) and `UPDATE ui_tests SET browser = 'chromium' WHERE browser <> 'chromium'`
      (line 194) BEFORE the DO block at lines 203-220 drops V1's inline
      ui_tests_browser_check, which is `CHECK (browser IN ('chrome','firefox','safari','edge'))`
      and does not permit 'chromium'. The first UPDATE therefore violates the constraint it exists
      to supersede, and Flyway aborts V14 with SQLSTATE 23514. Reproduced on a pristine
      postgres:15-alpine migrated to V12, seeded with one ordinary legacy draft
      (browser 'chrome', registered CSI, no constraint tampering) and then migrated toward V14:
      flyway_schema_history stops at 13.
    why_ci_is_green: >-
      Every existing test builds the schema from scratch through Flyway, so ui_tests is empty when
      section 6 runs and both UPDATEs match zero rows. A CHECK constraint cannot fire on zero rows.
      Story 10.4's RevisionMigrationIT is the one two-stage test in the repo and it stops at
      target 12, so it never reaches V14.
    impact: >-
      Blocking for deployment. V14 cannot be applied to staging or production, or to any restored
      dump, that contains even a single ui_tests row — which is every real environment. Because
      Flyway runs a migration in one transaction, the abort also rolls back sections 1-5, so
      AC-7, AC-9 and AC-11 never take effect either. No data is corrupted: the rollback is clean
      and the database simply stays at V13.
    suggested_fix: >-
      Move the existing DO block that drops the browser CHECK (V14 lines 203-220) above the two
      UPDATEs at lines 191/194. Nothing else needs to change — the new ck_ui_tests_browser is
      already added after both. The same ordering hazard does not exist in section 3: the status
      UPDATEs only ever write PASSED and ERROR, which the old V7 CHECK already permitted.
    suggested_owner: dev
    status: resolved
    resolution: >-
      The constraint-drop DO block now runs before both UPDATEs in V14 section 6, so the old
      ui_tests_browser_check is gone before any row is rewritten to 'chromium'.
  - id: ISSUE-002
    severity: medium
    category: security
    ac: ["AC-16"]
    finding: >-
      MswGate is mounted inside ChecksModule.tsx, the Module Federation entry used by the
      production webpack build, and reaches the mocks through a statically analysable
      `import('@/services/mocks/studio/browser')`. webpack emits that as an async chunk regardless
      of the flag. An isolated production-mode build of MswGate alone produced a 279 KiB minified
      chunk containing msw/lib (535 KiB raw) and the Studio handlers and fixtures (26.4 KiB raw),
      next to a 3 KiB entry. `frontend/public/mockServiceWorker.js` is also committed and will be
      served by any host that serves the public directory.
    impact: >-
      Not a runtime leak: under webpack `import.meta.env` is undefined, the gate evaluates false,
      the chunk is never requested and the service worker is never registered. The initial-bundle
      budget is unaffected because the chunk is async. What does ship is roughly a quarter of a
      megabyte of dead mock code and synthetic fixture data in the deployed artifact.
    suggested_fix: >-
      Make the dynamic import unreachable in production builds — e.g. wrap it in a
      DefinePlugin/import.meta.env-replaced constant that webpack can fold to false so the chunk is
      tree-shaken, or expose the mock entry only from the Vite standalone entry rather than from
      ChecksModule. Also confirm mockServiceWorker.js is excluded from the production asset copy.
    suggested_owner: dev
    status: resolved
    resolution: >-
      A build-time constant (process.env.MSW_BUNDLED, folded to 'false' by DefinePlugin in the
      production webpack build) makes the dynamic import unreachable: the 292.2 KiB msw chunk is no
      longer emitted and mockServiceWorker.js is no longer copied; dev and Vite are unchanged.
  - id: ISSUE-003
    severity: medium
    category: test-quality
    ac: ["AC-17", "AC-9", "AC-10", "AC-11"]
    finding: >-
      No test applies V13/V14 to a database that already holds rows. StudioMigrationIT builds the
      schema from scratch and then inserts, which proves the DDL but cannot prove any of the four
      data-transformation paths V14 owns: the chrome/other-engine conversion, the executions CSI
      backfill, the quarantine count, the logs TEXT -> JSONB USING conversion and the partition
      locator INSERT. 10.4's RevisionMigrationIT has exactly the right two-stage Flyway harness but
      targets 12.
    impact: >-
      This is the gap that hid ISSUE-001 behind a green build, and it would equally hide a silent
      data-loss bug in the logs conversion or the backfill.
    suggested_fix: >-
      Extend StudioMigrationIT (or add a sibling modelled on RevisionMigrationIT) with a two-stage
      Flyway run: target 12, seed a legacy chrome draft, a non-chrome draft, an execution with
      free-text logs and an execution whose parent has no CSI, then target 14 and assert the
      converted browsers, the backfilled and quarantined csi_id counts, the preserved log text as a
      single INFO entry, the NULL revision_id/runtime_versions, and that a locator row exists for
      exactly the CSI-bearing executions. Note for whoever writes it: V12 adds
      ck_ui_tests_csi_registered, so the no-CSI draft must also set quarantined_at.
    suggested_owner: dev
    status: resolved
    resolution: >-
      LegacyDataMigrationIT runs Flyway to target 12, seeds legacy drafts and executions, then
      migrates to 14; it fails with ui_tests_browser_check / SQLSTATE 23514 against the old
      ordering, which was verified before the fix was restored.
  - id: ISSUE-004
    severity: medium
    category: test-quality
    ac: ["AC-18"]
    finding: >-
      AC-18 asked for two Spring contexts against one database. The substitute constructs a second
      StudioService from the same autowired repository beans inside a fresh TransactionTemplate.
      It genuinely proves the property that matters most — the service holds no per-instance
      idempotency state, so the retry resolves from the committed ledger row — and the companion
      method proves the database itself refuses a second row for the same
      (principal, idempotency_key) by constraint name. What it cannot prove is anything that
      depends on a second JVM or a cold persistence context; here that is a small residue, because
      Hibernate's second-level cache is not enabled and the retry runs in its own transaction, so
      the ledger lookup does reach the database. Net: slightly weaker than asked, and the
      difference is not load-bearing for this story.
    secondary: >-
      The class javadoc still reads "The second Spring context here is the point of the test: it is
      a genuinely separate application instance" — which is no longer what the test does. That
      sentence should be corrected to match the AUTO-DECISION recorded in the story, or a future
      reader will trust a guarantee the test does not provide.
    suggested_fix: >-
      Fix the javadoc. Optionally revisit the real two-context test in 10.7, which owns the
      acceptance transaction anyway.
    suggested_owner: dev
    status: resolved
    resolution: >-
      The StudioIdempotencyIT class javadoc now states that the test runs in a single Spring
      context and names the two properties it does prove; the acceptance criterion text is
      untouched and a real two-context test stays with 10.7.
  - id: ISSUE-005
    severity: low
    category: correctness
    ac: ["AC-18"]
    finding: >-
      StudioService.executeTest does a read-then-insert on (principal, idempotency_key). Two
      replicas racing on the same key both find no ledger row and both insert; one wins and the
      other surfaces a DataIntegrityViolationException rather than the idempotent 200 AC-18
      describes. The unique constraint still prevents a duplicate execution, so the invariant
      holds; only the response is wrong.
    impact: "Contained — the acceptance transaction is explicitly 10.7's scope and out of scope here."
    suggested_fix: "In 10.7, catch the constraint violation and re-resolve the existing ledger row."
    suggested_owner: dev
    status: deferred-to-10.7
  - id: ISSUE-006
    severity: low
    category: correctness
