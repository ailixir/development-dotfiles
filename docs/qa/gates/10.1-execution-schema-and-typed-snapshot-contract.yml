  - id: ISSUE-008
    severity: medium
    category: correctness
    ac: ["AC-16"]
    finding: >-
      The MSW browser worker cannot start in any running application, so the standalone
      stakeholder-demo path @po named in AC-16 has no request-level mocking. Two independent
      reasons, both verified from emitted bundles and from the import graph. (1) MswGate's runtime
      gate reads import.meta.env.VITE_ENABLE_MSW, but MswGate is mounted only in ChecksModule.tsx,
      reachable only from the webpack entry src/index.tsx — and webpack compiles import.meta.env to
      `null` in the development bundle and to `{}` in the production bundle, so mswEnabled() is
      unconditionally false there. (2) The Vite standalone entry, which does have a real
      import.meta.env, is index.html -> src/main.tsx -> bootstrap.tsx -> App and never mounts
      MswGate at all; no Vite build in any mode contains the mocks.
    pre_existing: >-
      Present at 90daabacf; not introduced by the ISSUE-002 fix, which correctly strips the mocks
      from production and correctly leaves the development webpack bundle intact.
    impact: >-
      No runtime, security or data risk, and no effect on AC-21: the handlers and fixtures are real
      and are exercised by Vitest through setupServer in mocks/studio/server.ts, which never goes
      through MswGate. What is lost is only the browser demo AC-16 describes.
    suggested_fix: >-
      Mount MswGate in bootstrap.tsx (or main.tsx) so it is part of the Vite standalone tree where
      import.meta.env is real. If the mock is also wanted under `npm run dev` on :3002, give the
      runtime flag a webpack-visible source as well — e.g. read the already-defined
      process.env.MSW_BUNDLED constant, or add VITE_ENABLE_MSW to the DefinePlugin list.
    suggested_owner: dev
    status: open

