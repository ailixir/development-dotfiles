status_reason: >-
  The blocking migration defect is fixed and the fix was independently re-falsified, not taken on
  report. V14 section 6 now drops V1's ui_tests_browser_check before the two backfill UPDATEs,
  ck_ui_tests_browser still lands after both, and no V15 was added. LegacyDataMigrationIT passes
  7/7 against the fix and — restoring the old ordering by hand and running it again — fails in
  @BeforeAll with SQLSTATE 23514 on ui_tests_browser_check. The ordering was then restored and the
  tree left clean. That test is a real guard, not a decorative one. The backend is at 387 tests
  with 23 failures, class for class the ED-02 baseline, none in studio, all static gates green.
  The production webpack bundle no longer contains any msw library code, any mocks/studio module or
  mockServiceWorker.js, while the development webpack build still emits both; the AC-18 javadoc now
  describes the test that actually exists.
  What keeps this at CONCERNS rather than PASS is one thing the first review under-called and the
  fix did not touch: MswGate is mounted only in ChecksModule.tsx, which is reachable only from the
  webpack entry, where import.meta.env compiles to null — so the VITE_ENABLE_MSW runtime gate can
  never open there — while the Vite standalone entry that does have a real import.meta.env never
  mounts MswGate at all. The mock worker therefore cannot start in any running application. The
  handlers and fixtures are real and are exercised by Vitest, so AC-21 stands, but the
  stakeholder-demo path @po named in AC-16 is inert. That is a small wiring fix, not a
  merge blocker, and it is booked as ISSUE-008.
reviewer: "Quinn (Guardian) — @qa"
