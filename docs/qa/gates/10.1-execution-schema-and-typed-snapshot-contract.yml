gate: FAIL
status_reason: >-
  The contract, the typed DTOs, the partition-safe repositories, the CSI scoping and the frontend
  are all real and verified, and the backend failure count is back to exactly the 23 ED-02 baseline
  after the authorised one-word seed correction in RevisionRetentionIT — which now passes on its own
  revision-retention assertions. But V14 cannot be applied to any database that holds a single
  pre-existing ui_tests row. Section 6 issues
  `UPDATE ui_tests SET browser = 'chromium'` *before* dropping V1's inline
  `ui_tests_browser_check`, which permits only chrome/firefox/safari/edge. The update violates the
  constraint it is meant to replace and Flyway aborts V14. Every test in the suite builds the schema
  from scratch, so the UPDATE matches zero rows and the defect is invisible to a green build.
  Reproduced on a pristine V1..V12 postgres:15-alpine container carrying one ordinary legacy draft.
  AC-10 is unmet and AC-7/9/11 are unreachable on any non-empty database. The fix is to move the
  existing constraint-drop DO block above the two UPDATEs; no production code was changed here.
