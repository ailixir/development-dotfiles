    suggested_action: >-
      Unchanged from 10.14/10.17/10.18a. Detect on the pair — a thread named "HikariPool-N
      connection adder" with a JdbcDatabaseContainer.createConnection frame AND a
      "locked <…ContainerDatabaseDriver>" line — never on the Test worker's thread state.
