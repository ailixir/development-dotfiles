    HUNTED, NO NEW SHAPE FOUND. (A #20 was catalogued the same day from 10.18b's gate,
    independently of this review; its companion OPS note is cross-checked here as LOW-5.)
  detail: >-
    Three fresh INSTANCES of catalogued shapes, all found by probing rather than reading, and all
    measured: two of shape 18 (MED-1, the AC-7 and AC-1 matrices) and one of shape 16's sub-form
    (LOW-1, AC-7's drift message). Nothing here is a mechanism the catalogue does not already
    describe. Two things checked and cleared that would have been candidates: the document's prose
    mention of x-not-yet-implemented at line 54 is shape 14's trap and the story closes it properly
    (key-position regex plus a control that asserts the prose is still there); and
    ExecutionVideoContractEscalationTest's premise assertions ("the sibling routes really do declare
    both", "the three statuses that are NOT this case are declared") are real non-vacuity controls,
    not decoration.
  worth_adding_to_the_catalogue_as_a_diagnostic: >-
    A story can ship the remedy for a catalogued shape on one artefact and not on its siblings, and
    a mutation table cannot see the gap — every mutation reddens through the surviving rows, so the
    table reads "19 of 19, none survived" while two matrices remain unguarded. When a story applies
    a named remedy once, ask where else the same construct occurs in the same story. This is the
    second time the epic has recorded that pattern (10.14's shape 14 was "the author already knew
    the hazard and applied the remedy one assertion too narrowly").

