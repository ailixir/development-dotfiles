top_issues:

  - id: MED-1
    severity: medium
    title: >-
      Two of the story's three case matrices would not notice a row being deleted — including the
      one carrying AC-1's wrong-CSI denial. The epic's eighteenth shape, measured, in a story that
      applied its remedy to the third matrix
    detail: >-
      Measured in both directions rather than reasoned. Removing Arguments.of("UNAVAILABLE", 404)
      from ExecutionVideoEvidenceIT.evidenceStates() leaves the class BUILD SUCCESSFUL at 13 passed;
      the only observable change is the test count. Removing the "a principal on a different CSI"
      row from ExecutionVideoAuthorizationIT.identities() leaves that class BUILD SUCCESSFUL at
      12 passed — and that row is the wrong-CSI denial, the single most load-bearing identity in
      AC-1. theMatrixContainsBothAnswers does not catch it, because the surviving
      no-ownership-at-all row still produces the 403 it looks for. By contrast, removing a row from
      ExecutionVideoRangeIT.cases() turns theFixtureIsLargerThanEveryBoundaryTheCaseTableUses RED,
      because that matrix carries hasSize(6) plus a computed max. So the author knew the hazard and
      applied the remedy to one matrix of three. No mutation in the story's table would have found
      this: every one of them reddens through the surviving rows.
      This is not a defect in what ships — all rows are present today and AC-1 and AC-7 are
      correctly implemented. It is a defect in what would notice a future subtraction, which is
      exactly what this epic's catalogue exists for.
    suggested_owner: dev
    suggested_action: >-
      One assertion per matrix. For AC-7 the remedy is free and points at a production carrier:
      com.citi.put.checks.studio.dto.VideoEvidence declares PROCESSING, AVAILABLE, FAILED,
      UNAVAILABLE and EXPIRED as public constants, so assert set equality between the matrix's state
      column and those five — both directions, not a floor. For AC-1 there is no such carrier, so
      the analogue is hasSize(6) plus a named assertion that the wrong-CSI row and the null-CSI row
      are present and each produced a denial.
    refs: [ExecutionVideoEvidenceIT.evidenceStates, ExecutionVideoAuthorizationIT.identities]

  - id: LOW-1
    severity: low
    title: >-
      AC-7's "the two surfaces are compared in the same test" is not implemented as a comparison,
      and its failure message misdescribes what failed
    detail: >-
      everyEvidenceStateIsAnsweredAndBothSurfacesAgree asserts the snapshot route's video.status
      against the case-row literal, then asserts the video route's status code against a second
      case-row literal. No assertion relates the two surfaces to each other. Measured under M8, the
      printed failure was "[the snapshot route and this route must not drift apart about evidence
      state] expected: \"EXPIRED\" but was: \"AVAILABLE\"" — a single-surface mismatch wearing a
      cross-surface message, which is this epic's sixteenth shape in its documented sub-form. The
      conjunction is not vacuous, because both expectations are pinned in one row, so a genuine
      drift does surface through the status assertion. The cost is diagnostic, and the claim in
      AC-7 is stronger than the code.
    suggested_owner: dev
    suggested_action: >-
      Derive the expected status from the snapshot's published state rather than from the case-row
      literal, so the assertion genuinely relates the two surfaces; keep the per-state table for
      coverage.
    refs: [ExecutionVideoEvidenceIT.everyEvidenceStateIsAnsweredAndBothSurfacesAgree]

  - id: LOW-2
    severity: low
    title: >-
      The story's PASSED evidence is environment-conditional while its BLOCKED halves are
      unconditional — 10.18a's direction again, mitigated but not closed
    detail: >-
      Four of nine test classes carry @Testcontainers(disabledWithoutDocker = true):
      ExecutionVideoAuthorizationIT (13), ExecutionVideoEvidenceIT (14), ExecutionVideoRangeIT (9),
      ExecutionVideoStoreBindingIT (2) — 38 tests, and EVERY byte, Range, authorization,
      evidence-state, partiality and store-instrument assertion in the story lives in them. With
      Docker absent they skip silently. Two things keep this off medium, both measured: the five
      non-Spring classes carry no conditional-skip mechanism at all, and
      ExecutionVideoContractEscalationTest fails unconditionally, so the tier can never report
      BUILD SUCCESSFUL by skipping. And the annotation is inherited repo convention — 30 of 112 IT
      classes use it — not this story's invention. Recorded so the epic can see that the direction
      10.18a's HIGH finding named is still the default on the backend side.
    suggested_owner: devops
    suggested_action: >-
      Epic-level: make absent Docker FAIL the backend test task unless an explicit documented
      opt-out is set, or report the skip count against a floor in CI. Not this story's to fix.
    refs: [ExecutionVideoRangeIT, ExecutionVideoEvidenceIT, ExecutionVideoAuthorizationIT]

  - id: LOW-3
    severity: low
    title: FakeVideoObjectStore is an unguarded @Component in src/main/java
    detail: >-
      The ED-03 stand-in is annotated @Component with no @Profile and no
      @ConditionalOnMissingBean, so it is the VideoObjectStore bean in every profile including
      production — where the shipped route would answer 404 for every execution. This is deliberate
      and declared (AC-18a), and ExecutionVideoStoreBindingIT asserts it is the injected bean, which
      is the right guard for today. It becomes a hazard at 10.18: a real client added alongside it
      collides or is shadowed depending on bean ordering.
    suggested_owner: dev
    suggested_action: >-
      Flag in 10.18's scope. A @Profile("!prod") or @ConditionalOnMissingBean on the fake makes the
      replacement mechanical and keeps AC-20's binding assertion meaningful.
    refs: [FakeVideoObjectStore]

  - id: LOW-4
    severity: low
    title: >-
      runnerEvidenceStillRequiresEveryComponentTheJavaRecordDeclares asserts a stronger invariant
      than AC-23 states, over a record this story does not own — FOC-04's shape again
    detail: >-
      AC-23 says "RunnerEvidence.required is still [videoKey, manifestKey, state]" (superseded by
      10.18a's O-14 landing to the four-key form). What the test asserts is that `required` equals
      the FULL set of Java record components. Those coincide today. A later story that adds an
      OPTIONAL component to RunnerEvidence reddens this story's test without touching its subject —
