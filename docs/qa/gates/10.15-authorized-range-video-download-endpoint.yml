status_reason: >-
  Everything load-bearing in this story reproduced under measurement, and several of the developer's
  own numbers came back byte-for-byte. Both contract digests were re-read from the files rather than
  accepted: the pre-edit document at the merge base 39939a213 hashes
  d1a987663b25d7240fc460f923289aaf22a07145df7d6913114f9f3c1d627c18, which is exactly the
  BASE_SHA256 the runner pin carried at that commit (confinement.test.ts:159) — so the pin really
  was green on arrival at 10.18a's step-1 anchor and nothing unowned is folded in. The document at
  HEAD hashes 310d3c984b77104898440cae450795cdd56c11ef926f75209fb6d4198dcc0cf7, which is the value
  now at confinement.test.ts:176. The re-anchor is in the SAME commit as the contract edit —
  761a88830 touches openapi.yaml and confinement.test.ts together, and nothing else in the runner
  tree — which is what FOC-04's rule and FOC-06 step 2 require. The contract diff is four edits on
  getExecutionVideo and on nothing else, with the status set still exactly {200,206,404,410,416}.
  The last x-not-yet-implemented marker is gone: a SnakeYAML walk over every operation returns zero
  markers, and the one remaining textual occurrence is the document's own prose at line 54, which
  the test handles deliberately — the scan matches only at YAML key positions and asserts the prose
  is still present as its control, which is the epic's fourteenth shape closed rather than tripped.
  ADR-002 §13's row is measured, not predicted, and this reviewer measured all three of its suites
  on both sides by restoring the pre-edit document with the final test files: ExecutionVideoContractTest
  6/15 → 15/15, StudioContractTest 9/13 → 13/13, ExecutionVideoContractEscalationTest 0/2 → 0/2.
  The developer's deviation from @po's wording is correct and should not be worked around. @po asked
  for "no shipped operation carries no attribution". Parsing the document: 18 operations, 10 carry
  x-implemented-by, and EXACTLY THE EIGHT the developer named carry none — listTests, createTest,
  getTest, updateTest, deleteTest, executeTest, listExecutions, getExecution. The universal is false
  on this document, and attributing eight pre-Epic-10 routes would have been invention. The
  implemented backward half — set equality over the ten that do carry one, with the pinned set a
  deliberate second copy — catches the defect @po named (an attribution silently dropped reddens
  theSetOfOperationsCarryingAnAttributionIsPinnedBothWays) and is true. The AC wording needs @po,
  not a workaround.
  Eight mutations were re-applied and all eight reproduced, four of them with the recorded failure
  message verbatim. M12: the right length at the wrong offset reddens on BYTES — "first byte: the
  bytes returned are not the bytes requested, expected [-55] but was [-67]", at
  ExecutionVideoRangeIT:186, the byte assertion, with the status, Content-Range and Content-Length
  assertions at :177/:180/:183 all passing first. That is the shape asserting a 206 without
  asserting the bytes, and it cannot live here. M15: read-the-whole-object-then-slice reddens ONE
  test on the instrumented count — "the store was asked for 65536 bytes of a 1200000-byte object:
  expected 65536L but was 1200000L" — with the other eight tests in the file green, so the bytes
  really were identical either way. M8: "the refusal carried the recording: the answer was 200 with
  1310721 bytes, and the object at the derived key is 1310721 bytes" — verbatim, and the criterion's
  whole point is that the red is a 200 carrying the object, not a missing-object error. M17: the
  gate-still-shut assertion's failure message tells the reader in capitals that a manifest edit,
  not a code change, reddened it, and that it is a FOC-class finding to raise rather than a test to
  adjust. M13, M16, M18a and M19 also reproduced, M19 with the pin alone red and 17 siblings green.
  Five shipped-file digests in the mutation table were confirmed independently after restore.
  The backend hung for this reviewer too, 1 of 1, making it 7 of 7 across the epic. The run reached
  413 passed / 22 failed / 1 skipped across 126 classes, went silent, and a thread dump shows MED-2
  exactly: "Test worker" BLOCKED waiting to lock <0x00000007c2ce78c8> inside
  ContainerDatabaseDriver.connect, and a daemon "HikariPool-4 connection adder" TIMED_WAITING in
  JdbcDatabaseContainer.createConnection holding that same monitor. Same HikariPool-4 ordinal, same
  class boundary — the last result is StudioOverloadIT. The failing set is the developer's list
  class by class and count by count: 13 classes, 22 failures, ZERO in com.citi.put.checks.studio.
  Per @po's MED-2 clause this is recorded as HUNG, NOT GREEN AND NOT RED, and the developer's
  reading of the 184-vs-126 class-count difference as an artefact of fork partitioning is supported
  — this reviewer's independent run reached 126, the same as the retry, with the identical failing
  set.
  What keeps this off PASS is not a defect in what ships. It is two case matrices that would not
  notice a row being deleted, measured in both directions. Removing Arguments.of("UNAVAILABLE", 404)
  from AC-7's evidenceStates() leaves ExecutionVideoEvidenceIT BUILD SUCCESSFUL at 13 passed; only
  the test count drops. Removing the wrong-CSI identity — the single most load-bearing row in AC-1 —
  from identities() leaves ExecutionVideoAuthorizationIT BUILD SUCCESSFUL at 12 passed, because
  theMatrixContainsBothAnswers is satisfied by the surviving no-ownership row. That is the epic's
  catalogued eighteenth shape, and the contrast is sharp: the third matrix in the same story,
  AC-13's cases(), carries the remedy, and deleting a row from it turns
  theFixtureIsLargerThanEveryBoundaryTheCaseTableUses RED. The author knew the hazard and applied it
  one matrix too narrowly — the same diagnosis this epic recorded against 10.14's fourteenth shape.
  The remedy for AC-7 is one assertion against a production carrier: VideoEvidence already declares
  all five states as public constants.

