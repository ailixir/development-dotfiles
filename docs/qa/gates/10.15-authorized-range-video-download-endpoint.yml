      names. The same applies to videoEvidenceStillRequiresExactlyItsNonNullableProperties, which
      asserts required ⟺ not-nullable rather than the literal [status, partial]. Both weaker forms
      are defensible as diagnostics — the byte pin is what actually holds "nothing else moved", and
      M19 proves the pin — but the criterion's words and the code's claim differ.
    suggested_owner: dev
    suggested_action: >-
      Give both assertions the treatment the manifest reader already has: name the file, the schema
      and both sets in the failure message, so a red is diagnosable as "a neighbour changed the
      record" rather than "this story broke the contract".
    refs: [ExecutionVideoContractTest]

  - id: INFO-1
    severity: low
    title: >-
      theSetOfOperationsCarryingAnAttributionIsPinnedBothWays's second assertion says "the total,
      read from the document" and reads the pin's own size
    detail: >-
      hasSize(OPERATIONS_CARRYING_ATTRIBUTION.size()) is redundant with the isEqualTo above it and
      the as() message is false — nothing there reads a total from the document. Harmless. Related:
      OPERATIONS_CARRYING_ATTRIBUTION is a deliberate second copy whose provenance nothing enforces,
      which is the epic's thirteenth shape; the javadoc cites the remedy but a future DRY refactor
      deriving the set from the document would silently convert the guard into a tautology, exactly
      as it did on 10.10 round 2. One import assertion closes it.
    suggested_owner: dev
    suggested_action: Correct the message; consider the import assertion 10.10 round 2 concluded with.
    refs: [ExecutionVideoContractTest]

  - id: LOW-5
    severity: low
    title: >-
      The permanent reds that keep this tier off a false green also make its exit code
      informationless — the anti-shape-19 argument cuts both ways
    detail: >-
      Cross-checked against the twentieth shape's companion OPS note, landed the same day by
      10.18b's gate. ExecutionVideoContractEscalationTest is red by design and permanently, which is
      correct (ESC-1 and ESC-2 are Class C and must not be taken here) and which this reviewer used
      as the measured mitigation for LOW-2: two unconditional non-Spring reds mean this tier can
      never report BUILD SUCCESSFUL by skipping. The same fact means the :test task's exit code
      carries no information for this story's packages — a NEW red is invisible to a pipeline that
      reads exit codes — and the natural accommodation, continue-on-error, reinstates shape 19
      through the front door. Nobody has stated what CI is supposed to read instead. This is not
      this story's invention; it is the epic's deliberate escalation convention meeting a pipeline
      that only has one bit.
    suggested_owner: devops
    suggested_action: >-
      For any package carrying a deliberate red, have CI compare a per-class passed/failed/skipped
      count against a frozen baseline rather than reading the task's exit code — that also closes
      LOW-2's skip half in the same instrument.
    refs: [ExecutionVideoContractEscalationTest]

  - id: BUILD-1
    severity: medium
    title: The backend gate hangs — 7 of 7 across the epic, and coverage is therefore unverified
    detail: >-
      Reproduced by this reviewer 1 of 1 at 413/22/1, same class boundary, MED-2 thread-dump pair on
      the same monitor. Carried, not owned by this story: the baseline hung on this branch before
      the first commit, the story touches no file that could move it, and its own packages run to
      completion at 125/2/2. Consequence to state plainly: jacoco coverage on this story's new
