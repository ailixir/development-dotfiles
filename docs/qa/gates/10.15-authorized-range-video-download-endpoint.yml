do_not_do:
  - >-
    Do not "fix" the x-implemented-by guard by attributing the eight pre-Epic-10 operations. The
    developer's refusal is correct and the count was independently verified.
  - >-
    Do not report the backend as green. It is HUNG. A run short of its baseline count is a hang.
  - >-
    Do not re-anchor BASE_SHA256 anywhere but in the PR that edits the document. 10.11c is FOC-06
    step 3 and inherits 310d3c984b… as its green-on-arrival value.
  - >-
    Do not adjust the gate-still-shut assertions if they redden. Read the failure message: it tells
    you whether @pm moved the manifest or the gate moved, and the former is a FOC-class finding.
  - >-
    Do not widen MEDIAN_TOLERANCE_MS for the seek-measurement flake. It is 10.16's with @po's three
    constraints and this story correctly absorbed nothing.

final_decision: >-
  CONCERNS — merge. The route is correct, the contract edit is exactly the four declared edits and
  nothing else, FOC-06 step 2 is executed properly with the pin green on arrival and re-anchored in
  the same commit, ADR-002 §13's row is measured on both sides and reproduces, and every one of the
  eight mutations this reviewer re-applied reddened the named test — four of them with the recorded
  failure message verbatim. The developer's honesty is the strongest thing in this record: it
  refused a wording it could not make true and said so, labelled an incomplete experiment as
  inferred rather than claiming it, recorded a mutation that reddens more than its criterion
  predicts rather than trimming the report, and reported a hung gate as hung.
  What holds it at CONCERNS is MED-1: two case matrices behind AC-1 and AC-7 that would not notice
  a row disappearing, proved by deleting one from each and watching the build stay green — while
  the third matrix in the same story catches exactly that. Nothing ships broken; what is missing is
  the thing that would notice if it later did. BUILD-1 is the epic's, not this story's, and it
  leaves the backend effect and the coverage numbers unverified — which is the honest outcome, not
  a pass.
