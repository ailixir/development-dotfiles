prior_findings:
  QF1:
    source: docs/qa/studio-inference-implementation-review.md (QF1, re-review table)
    verdict: CONFIRMED FIXED
    detail: >-
      pollUntil computes one deadline, caps each read by the remaining time, re-runs guard() after the
      read and accepts a match only while now() < deadline; sleep is capped by the remaining time
      (playwrightAdapter.ts:727-763, accept condition at :754). The 150 ms / 500 ms detached-element
      companions passed on this rerun.

ac_coverage:
  total: 4
  verified: 4
  unmet: 0
  detail:
    AC-1: >-
      PASS - normalizeWhitespace (playwrightAdapter.ts:239-241) matches the installed Playwright
      normalizeWhiteSpace byte for byte (node_modules/playwright-core/lib/coreBundle.js:518: strip
      U+200B/U+00AD, trim, collapse \s+). matches() (:243-267) normalizes both sides only for strings;
      regexes are tested raw, ignoreCase true adds i, false strips i, absence keeps the flags (:253-255).
      Applied to toContainText (:943-947) and toHaveTitle (:1004-1014); toHaveValue stays literal; URL
      strings are canonicalized through new URL() with no inferred base (:986-991). Oracle cases at
      assertion-semantics.test.ts:51-79 cover both override directions for text and URL.
    AC-2: >-
      PASS - trial was removed from every action schema (language.ts:161-196). Any trial key, true or
      false, is OPTION_UNKNOWN_KEY with the actionable message "Remove trial to perform the reviewed
      action" (arguments.ts:629-638). language-surface.test.ts:189-204 checks all 7 actions with both
      booleans. The adapter also has its own defensive refusal (playwrightAdapter.ts:1051-1055, called at
      :809/:859/:874/:889), and actionOf forwards only force/timeout (:1040-1045).
    AC-3: >-
      PASS - 29 real-Chromium cases compare the Studio adapter verdict to the independent playwright/test
      verdict. Each fixed false positive or false negative has a negative or positive companion (for
      example, text collapse vs differing words, regex raw whitespace vs \s+, value literal vs normalized,
      relative URL with no base, late read). The trial case confirms the validator refuses the artifact
      and that the page effect stays unchanged until a real accepted click.
    AC-4: >-
      PASS (with record drift, see SR-003) - the syntax reference documents trial rejection and the
      normalization/ignoreCase rules (backend syntax-reference.md:79, :94-97). Runner pins
      (versions.ts: validator 2.0.0, executor 2.1.0, syntax 2.1.0, artifact 1) agree with
      RuntimePinProperties.java:36-38 and CompilePins.java:27. Executor/syntax 2.1.0 came from the later
      Story 10.44 bump, not this story. type-check, scoped lint, pins, unit and browser checks were
      rerun as listed above.

top_issues:
  - id: SR-001
    severity: low
    finding: >-
      Dead trial-era schema branch. OptionValueSchema still declares { type: 'false' }
      (language.ts:35), and readOptionValue handles it with a trial-specific message
      (arguments.ts:660-668). No schema uses the type any more, so the branch is unreachable.
    impact: None at runtime. It does leave a misleading path if someone reintroduces a false-only option.
    suggested_action: Remove the 'false' variant and its case, or give the message a generic wording.
    ac_refs: [AC-2]
  - id: SR-002
    severity: low
    finding: >-
      The adapter's defensive refuseTrial rejects only trial === true (playwrightAdapter.ts:1052).
      The frozen C0 §6 rule is "reject the trial key even when false".
    impact: >-
      Not exploitable: the validator rejects both values, and actionOf never forwards trial. The only
      issue is that the defence-in-depth layer is weaker than the contract it documents.
    suggested_action: Refuse when the key is present (`'trial' in options`), and extend adapter.test.ts:183-189 to cover trial:false.
    ac_refs: [AC-2]
  - id: SR-003
    severity: low
    finding: >-
      Story record drift. The pre-gate QA Results held an unattributed paragraph with run-on
      counts ("971 unit +118 browser"). Dev Notes still describe the wt/epic checkout and pins "at
      2.0.0", but executor and syntax are now 2.1.0 after Story 10.44.
    impact: Documentation only. Neither the code nor the pins are inconsistent.
    suggested_action: '@po/@sm may annotate the Dev Notes pin statement as superseded by 10.44; no code change.'
    ac_refs: [AC-4]

