status_reason: >-
  Every criterion 10.18a claims is met, and the reviewer proved the load-bearing ones by running
  them rather than by reading them. The contract hash was re-read from the file, not accepted:
  `shasum -a 256 docs/specs/studio/openapi.yaml` returns
  d1a987663b25d7240fc460f923289aaf22a07145df7d6913114f9f3c1d627c18, the base at 78cc634b2 returns
  cbf07c99de363d18783690e99cdf115242e8b7c1387da7c433658ad27b6f412e, and the diff between them is
  18 insertions / 9 deletions in exactly two hunks. All three `confinement.test.ts` repairs are
  verified and all three can fail: reverting `required` to the three-key form on the production
  document gives 2 red / 16 green, exactly the developer's F-29, and the substring reasoning is
  correct — measured in node, neither form contains the other. The `not.toContain` at :189 is not
  decoration either: planting the three-key literal inside the assertion window while leaving the
  four-key `required` in place turns that specific assertion red. FOC-06 step 1 is confirmed
  landed first by inspection of the trees, not the log: at each of dc0c30089, 3430a898b, d7f527dc3
  and d43615dc5, `git ls-tree` finds zero studio-runner chart templates and an empty
  test/deployment/ — 10.15 and 10.11c are unblocked.
  §23.3's obligation is discharged and the reviewer spot-checked five of its six rows, not three.
  `test/contract.test.ts` is 14/14 at the base file and 15/15 at HEAD; `StudioContractTest` is
  12 PASSED, `ArtifactSchemaDriftTest` 3, `CompileRouteContractDivergenceTest` 9, and re-running
  those three against the pre-edit contract gives the same 24 — so "unchanged" reproduces on both
  sides of the edit. The 12-not-9 finding is confirmed: it is suite growth, correctly reported
  rather than matched.
  SEC-2 was re-run by this reviewer in both directions against put-checks-studio-runner:10.18a-local
  as pwuser. Without the control the attack SUCCEEDS — both mkdirs succeed, the shim is written and
  execs the real binary, and the renderer runs at Seccomp=0 while the control launch four seconds
  earlier in the same container ran at Seccomp=2. With `--read-only` plus the two tmpfs both writes
  are refused `Read-only file system`, the parents stat as drwxrwxrwx root:root /ms-playwright and
  drwxr-x--- pwuser:pwuser /home/pwuser, and the mount line reads `ro,relatime` — so neither write
  failed for a permissions reason and the discriminator is the read-only root alone. The developer's
  unexpected finding is right and it is the stronger claim. The control also does not break the
  browser: inside the same read-only run the legitimate launch still reaches Seccomp=2.
  Seven mutations were re-applied by this reviewer and every one reproduced with the reported
  sibling count and a hash-verified restore, including both sides of O-15 — F-31b renames videoKey
  on the document with the key count still fourteen and reddens the one named test, which is the
  whole argument for replacing a count with a derived comparison.
  What keeps this off PASS is not a defect in what was measured; it is that almost none of it can
  be measured again. The chart harness and the SEC-2 gate both discover their prerequisite at
  import time and convert absence into `skip`. With helm broken on PATH, chart.test.ts reports
  **1 passed | 89 skipped** and the file is GREEN. With STUDIO_RUNNER_IMAGE pointed at a tag that
  does not exist, sec2.test.ts reports **1 passed | 3 skipped in 1 ms** and the file is GREEN. The
  surviving test in each case asserts a tautology and carries the disclosure in its *name*, which
  is not what a pipeline reads. `studio-runner/ci/stages.md` is untouched by this story: stage 4 is
  where `npm test` runs and is documented as NOT needing the image, stage 7 builds it and stage 8 is
  where helm appears, and `STUDIO_RUNNER_IMAGE` occurs nowhere but `test/deployment/image.ts`. As
  documented, in CI today, AC-1 – AC-12 and AC-4a part 3 have no executable enforcement at all.
  And one security coupling nobody has stated: the rendered prod pod carries
  `shareProcessNamespace: true` **and** mounts checks-studio-runner-object-store-prod at
  /etc/studio/object-store. A shared PID namespace hands any other container in that pod
  /proc/1/root/etc/studio/object-store/secretAccessKey. It is bounded today only because the pod
  renders exactly one container — and that bound is enforced incidentally, by a test helper
  throwing, not by a named assertion. The field was adopted as a *reaping* control; its reaping half
  is correctly recorded as not falsifiable, but this other half is falsifiable chart-side right now.
  Backend: no result, and that is the honest outcome. Two full `./gradlew --no-daemon test --rerun`
  attempts by this reviewer both stalled at **435 results** of a ~874 baseline, at the same class
  boundary the developer reported twice. MED-2 is 4 of 4 on this branch. The story touches zero
  backend files, so it has no mechanism to move the baseline, and the static gates and the three
  contract classes are green — but the backend effect of this half is unverified, and that is a
  finding about the epic's infrastructure, not about this story.

