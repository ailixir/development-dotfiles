final_decision: >-
  CONCERNS — mergeable. Every 10.18a criterion is met and the reviewer verified the load-bearing
  ones by execution: the contract hash both ends, all three confinement repairs plus an independent
  falsification of the one the developer could only argue for, the FOC-06 ordering from the trees,
  five of six §23.3 rows on both sides of the edit, the SEC-2 attack in both directions against the
  built image, seven mutations with matching sibling counts and hash-verified restores, and the
  rendered prod manifest field by field. No acceptance criterion is unmet, no deferral is faked, no
  spike is falsely closed, and the scope is clean with zero backend and zero frontend files touched.
  CONCERNS rather than PASS for three reasons, in order. HIGH-1: the entire evidence tier for the
  chart criteria and for SEC-2 fails open, measured — helm off PATH gives a green 89-skip file, a
  wrong image tag gives a green 3-skip file in one millisecond, and ci/stages.md wires neither
  prerequisite into the stage that runs them, so in CI today the story's strongest criterion has no
  enforcement. That is a nineteenth vacuous-guard shape and it belongs in the catalogue. MED-1: the
  rendered pod carries shareProcessNamespace beside a mounted store credential, safe today only by
  a bound nothing names. MED-2: there is no backend result at all — 4 of 4 hangs at the same class
  boundary — so this half's backend effect is unverified, which is a statement about the epic's
  infrastructure and not about this story.
  The record itself is unusually honest and it held up under checking. Where it differs from
  measurement it differs in the safe direction, twice, and it volunteered the two findings this
  review would otherwise have had to discover.
