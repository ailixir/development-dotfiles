# ─────────────────────────────────────────────────────────────────────────────
top_issues:

  - id: HIGH-1
    severity: high
    title: >-
      The whole deployment-evidence tier fails OPEN — with helm absent the chart suite is
      1 passed / 89 skipped and GREEN; with a wrong image tag SEC-2 is 1 passed / 3 skipped and
      GREEN; and ci/stages.md wires neither prerequisite into the stage that runs them
    detail: >-
      Measured, not reasoned. `PATH=<dir with a helm that exits 127>:$PATH npx vitest run
      test/deployment/chart.test.ts` → **Test Files 1 passed | Tests 1 passed | 89 skipped (90)**.
      `STUDIO_RUNNER_IMAGE=put-checks-studio-runner:tag-that-does-not-exist npx vitest run
      test/deployment/sec2.test.ts` → **1 passed | 3 skipped (4), in 1 ms**. In each case the single
      surviving test asserts a tautology (`expect(typeof DOCKER).toBe('boolean')`) and the
      disclosure lives in the test's NAME, which changes to "helm is ABSENT: every chart criterion
      is SKIPPED, never passed" / "the image … is ABSENT: SEC-2 is SKIPPED, never passed". A name is
      not a signal a pipeline reads; a green file is. This matters because
      `studio-runner/ci/stages.md` is UNTOUCHED by this story: the deployment suite runs in stage 4
      (`npm test`), which the stage table marks "Needs the pinned image: **no**"; the image is built
      in stage 7 and helm appears only in stage 8; and `STUDIO_RUNNER_IMAGE` occurs nowhere in the
      repository except `test/deployment/image.ts:13`, defaulting to a local-only tag
      `put-checks-studio-runner:10.18a-local`. As documented today, in CI, AC-1 – AC-12 and
      **AC-4a part 3 — the criterion @po named this story's weakest and the reason the story
      exists** — have no executable enforcement at all, and the pipeline is green.
      This does NOT invalidate the evidence: this reviewer reproduced the attack and the renders
      by hand. It invalidates their durability.
      **This is a nineteenth vacuous-guard shape** and it is distinct from the eighteen catalogued.
      It is not the epic's a/b deferral convention, where the criterion is DECLARED blocked with a
      named gate, spike and owner; here the criteria are declared PASSED while their evidence tier
      is environment-conditional and fails open. It is not #3 (a hardcoded list that deletes its own
      coverage) — nothing is hardcoded; the coverage is deleted by the environment. It is not #16 —
      the body does not assert over a stand-in, it asserts nothing at all.
      Probe shape to add to the catalogue: **break the prerequisite (point the image tag at nothing,
      take the external tool off PATH) and re-run; if the file is green, the tier proves nothing
      where it will actually run.**
      Remedy, small: make absence FAIL by default with a documented, explicit opt-out — e.g. the
      announcement test becomes `expect(DOCKER || process.env.STUDIO_RUNNER_SEC2_OPTOUT ===
      'acknowledged').toBe(true)` — and add helm plus `STUDIO_RUNNER_IMAGE` to `ci/stages.md`'s
      stage for the deployment tier, or move that tier into a stage that has both.
    suggested_owner: '@dev, story 10.18b (it assembles ci/stages.md and the runbook anyway)'

  - id: MED-1
    severity: medium
    title: >-
      shareProcessNamespace: true is rendered on a pod that mounts the object-store Secret, and the
      one-container bound that makes it safe is enforced only by a test helper throwing
    detail: >-
      Read off the rendered prod manifest: the runner Deployment carries
      `shareProcessNamespace: true` AND a volume `object-store-credentials` from Secret
      `checks-studio-runner-object-store-prod` (keys accessKeyId, secretAccessKey) mounted readOnly
      at /etc/studio/object-store. A shared PID namespace makes every container in the pod visible to
      every other through /proc, including `/proc/<pid>/root` — so any second container in that pod
      reads /proc/1/root/etc/studio/object-store/secretAccessKey regardless of its own volume mounts,
      and readOnlyRootFilesystem does not obstruct a read. Today the pod renders exactly ONE
      container and zero initContainers, so nothing is exposed — but that bound is enforced
      incidentally: `soleContainer()` calls `one(containers, 'container')`, which throws. Adding a
      log shipper or a mesh sidecar would break several tests for the wrong reason while silently
      handing that sidecar the store credential, and nothing in the chart or the tests names the
      coupling.
      Two things follow for the record. First, the developer's "not falsifiable" entry is CORRECT
      for the property it names — reaping needs a pause container and cannot be observed outside a
      pod, and the mechanism-class falsification with `docker --init` is the right substitute
      (reproduced here: `PID1=1 zombies=[15 (sleep)]` vs `PID1=7 zombies=[]`). Second, the field was
      nevertheless ADOPTED as a reaping control without its other consequence being assessed, and
      THAT consequence is falsifiable chart-side right now. So: "not a control" is the right label
      for the reaping half, and "not only a control" is the half that is missing.
      Remedy, one assertion: assert the runner Deployment renders exactly one container and no
      initContainers, named as the bound on shareProcessNamespace, so a sidecar announces itself as
      a security decision rather than as a helper throwing.
      Checked and NOT a problem: the browser child inherits only the seven keys in
      INHERITED_ENV_KEYS, so /proc/<pid>/environ carries no resolved value; and no credential is
      rendered into the container environment at all.
    suggested_owner: '@dev, story 10.18b / raise to SPK-04 and ED-05'

  - id: MED-2
    severity: medium
    title: The backend gate is unobtainable on this branch — 4 of 4 hangs, so this half's backend effect is unverified
    detail: >-
      Two attempts by this reviewer, both stalled at 435 of ~874 at the same class boundary as the
      developer's two. This is an EPIC finding, not this story's: the story touches zero backend
      files, static gates are green with --rerun-tasks, and the three contract classes are 24 PASSED
      against both the old and the new contract. But it must be said plainly rather than in a
      caveat — **there is no backend `check` result for 10.18a, and this gate does not claim one.**
      The developer's disposition (report the hang, do not report a number) is exactly right and is
      endorsed. Ownership is already @devops per the 10.9 gate and @po's wave-6 assignment; nothing
      about this story changes that. See `med2_thread_dumps` for the detector refinement.
    suggested_owner: '@devops — epic-level, already assigned, deadline before 10.19 is drafted'

  - id: LOW-1
    severity: low
    title: >-
      The comment at confinement.test.ts says a revert of §20 "turns both of these red rather than
      one"; measured, only the first is ever evaluated
    detail: >-
      Under F-29 the file reports 2 failed tests, and the second is the BASE_SHA256 pin, not the
      `not.toContain`. `:188` throws before `:189` is reached — which the developer states correctly
      elsewhere in the record. The assertion is NOT vacuous (P-1 falsifies it independently), so this
      is a wording fix, not a guard fix. Worth correcting because the sentence is the kind a later
      reader treats as a measurement.
    suggested_owner: '@dev'

  - id: LOW-2
    severity: low
    title: F-31c's row overstates what the mutation produces — 0 red and 15 skipped, not a red file
    detail: >-
      Detailed under `mutation_F31c_the_row_that_proves_too_much`. The record's judgement is right;
      only the observation is imprecise, and it is imprecise in the safe direction.
    suggested_owner: '@dev'

  - id: LOW-3
    severity: low
    title: The "render mutation MN turns the named test red" tests assert the render, not the named test's failure
    detail: >-
      e.g. "render mutation M3: seccompProfile.type set to Unconfined turns the named test red"
      asserts `profile?.type === 'Unconfined'`. Sound TODAY, because the guard at the same describe
      reads the identical rendered value, so the guard's failure follows. But the claim in the name
      is never executed, and it would stop corresponding silently if a guard changed its read path
      (say, scanning `outcome.raw` instead of the parsed securityContext). Catalogued shape #16
      applied to a mutation row rather than to a guard. Note, not a defect.
    suggested_owner: '@dev'

  - id: INFO-1
    severity: info
    title: '/ms-playwright being world-writable does not weaken SEC-2''s control — it is what establishes it'
    detail: >-
      Assessed as asked. `drwxrwxrwx root:root` means the blocked run cannot be explained by file
      permissions, so the experiment isolates `--read-only` as the sole discriminator — without the
      world-writable directory the blocked result would be ambiguous and the control would be
      unproven. What it does establish is that the control is SINGLE-LAYERED: the read-only root
      filesystem is the only thing between a non-root process and the browser registry, and there is
      no defence in depth behind it. Raising it for ED-05 is the right call and the framing in the
      story is accurate.
    suggested_owner: 'ED-05 / Platform-SRE'

