recommended_not_blocking:
  - HIGH-1 — make the chart and SEC-2 tiers fail rather than skip when their prerequisite is absent,
    and wire helm + STUDIO_RUNNER_IMAGE into ci/stages.md. 10.18b assembles that file already.
  - MED-1 — one assertion binding shareProcessNamespace to a single-container pod; raise the
