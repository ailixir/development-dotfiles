do_not_do:
  - Do not reopen @po's declination of a runtime browser-identity check. The reasoning holds and
    this review found nothing that changes it.
  - Do not close SPK-04 on the strength of this evidence. The attack ran against the PUBLIC base
    image in a container, not against ED-05's image in a pod, and the developer says so.
  - Do not absorb MED-2 or the deadline-cleanup type error into this story. Both were correctly
    refused; the type error is proven to pre-exist at 78cc634b2.
  - Do not let a future half claim AC-4a part 3 or the chart criteria on a green run whose
