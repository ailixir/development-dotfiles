escalation_test_disposition:
  test: ExecutionErrorCodeContractEscalationTest
  verdict: RESOLVED LEGITIMATELY — NOT DEFUSED
  evidence: >-
    `git log -S'AUTHORIZATION_REVOKED' -- docs/specs/studio/openapi.yaml` returns exactly one
    commit: `dd8932d7f`, *"docs(architecture): declare the execution error code vocabulary
    (ADR-002)"*. It is an @architect amendment, not a story commit, and its message opens *"Story
    10.7 escalated the last deliberately-red test on the branch under ADR-002 §12 rather than
    widening a public enum itself. §15 rules on it."* ADR-002 line 334 carries the §13 log row:
    Class C, *"@architect, this amendment"*, evidence *"`ExecutionErrorCodeContractEscalationTest`
    1/2 -> **2/2** with no change to the test"*, with the full record in §15.10 and the ratification
    reasoning (including the rejected `PERMISSION_REVOKED` alternative) at §15. The enum is eight
    values; the test still contains no hardcoded list and still reads both sides. Nobody widened
    the thing it measured; the architect closed the gap the test was holding open, which is the
    design.
  consequence_for_the_epic: >-
    This is the reference disposition for story 10.10's currently-open deliberately-red escalation:
    green is acceptable **only** when a §13 amendment row names the architect, the class and the
    before/after measurement, and the test itself is unchanged. All three hold here.

