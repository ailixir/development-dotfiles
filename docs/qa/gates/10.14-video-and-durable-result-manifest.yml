    suggested_action: >-
      Capture the sentinel where it happens — the harness's report client already records the
      terminal POST — or delete the test and let the `toEqual` carry it. Follow-up.
  - id: QA-3
    severity: low
    finding: >-
      Two of six md5s in the AC-22 table correspond to no delivered state:
      `RunnerReportProjection.java` recorded `4ce07638c5a2c201136fad175893c578` (actual
      `5f9926c4046a12a2656c650d4265397b`) and `ErrorCodeConstraintMigrationIT.java` recorded
      `7c7186b80c697f3594c08205e207904e` (actual `12a5bf62aa8e0b3fe3efe95065841cd5`).
    impact: >-
      The *restoration* claim holds and is independently provable: both files are byte-identical at
      `5e72fdf2b`, `b98a5ba85` and `HEAD`, with an empty working-tree diff. What fails is the
      recorded evidence — most likely hashes taken mid-implementation and carried forward past a
      later `spotlessApply`. AC-22 asks for the hash *after restore*; for these two rows it is not.
    suggested_action: Re-take the two hashes on the delivered tree and correct the table. Documentation fix.
  - id: QA-4
    severity: low
    finding: >-
      The surviving row-22 mutant is unfalsifiable by the **current field set**, not by
      construction. Pass 1 redacts string leaves and keys; `schemaVersion` and `durationMs` are
      numeric leaves it never touches, and `stringValues` is the only thing keeping
      `runtimeVersions` out of that category.
    impact: >-
      None today — I verified the survival and the pass-1 asymmetry myself, and @dev's reasoning is
      correct for the manifest as shipped. The hazard is that a future numeric field sourced from
      resolved input silently makes pass 2 load-bearing, with no test and no type to notice.
    suggested_action: >-
      Either add a canary whose value is the digits of a numeric field (which kills the mutant and
      makes pass 2 a counted guard), or assert that every `ResultManifestBody` field sourced from
      `ResultManifestInput` is a string. Cheap either way. Follow-up.
  - id: QA-5
    severity: low
    finding: >-
      AC-20's `theDispatchCounterCanReachTwoAndTheReconciledLedgerStateIsWhatStopsIt` neutralises
      **two** terms before the counter moves: it resets `studio_dispatch_ledger` to `QUEUED` and
      separately resets `ui_test_executions.status` to `PENDING`.
    impact: >-
      @po's actual requirement — *"the count must be shown capable of reaching two"* — is met, and
      the epic's canonical vacuous shape is genuinely closed. What is over-claimed is the
      attribution in the assertion message: the experiment does not isolate which of the two terms
      was holding the counter at one.
    suggested_action: Reset one term at a time, or soften the message. Follow-up.
  - id: LOW-1
    severity: low
    finding: >-
      `studio-runner/test/reporting/httpClient.test.ts > 'reports a timeout as ambiguous'` bounds a
      real localhost socket at `timeoutMs: 25` and additionally asserts `responder.hits` is exactly
      1. It is environmentally timing-sensitive and will recur on a loaded box.
    impact: >-
      Not this story's surface — the file and the client are story 10.6's and are untouched here. I
