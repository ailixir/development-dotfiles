status_reason: >-
  Everything load-bearing in this story is proven, and I proved most of it myself rather than
  accepting it. AC-10 **did** land alone — `00b9e105d` contains exactly one production file,
  `RunnerEvidence.java`, and its diff is the one nullable component. I reproduced the `DEF-02`
  defect by making `partial` an undeclared JSON property again and got the developer's exact
  message, `expected: 200 but was: 400`, on the AC-10 guard; the third test in that commit,
  `anUndeclaredEvidencePropertyIsStillRefused`, stayed green under that mutation and is therefore
  genuinely a **control** and not a guard for AC-10 — @dev's characterisation is correct, and in
  fact conservative, because the same test is the *only* one that goes red when the record is
  reopened with `ignoreUnknown = true`. **The PostgreSQL 15 question I re-settled independently**
  on my own `postgres:15-alpine` container (PostgreSQL 15.19): `ADD CONSTRAINT … NOT VALID` on the
  partitioned parent is accepted, produces one `pg_constraint` row per relation (parent + both
  partitions) all `convalidated = f`, is enforced on new writes immediately with the failing row
  in `DETAIL`, and `VALIDATE` fails loudly naming the **relation** — `ui_test_executions_default`
  — not the row, then succeeds after repair and flips all three to `t`. All four of @dev's claims
  and the relation-not-row correction reproduce verbatim. Every gate number reproduces to the
  unit: backend 827 / 23 / 3 with the failing set identical class-by-class to the @po baseline and
  zero in `com.citi.put.checks.studio`; runner 44 / 884 / 2; fixtures 5 / 84 / 10; static gates
  SUCCESSFUL with `--rerun-tasks` (14 executed); coverage SUCCESSFUL with `-x test` and
  `backend/build.gradle.kts` byte-unchanged against `50f770ed2`. I re-applied **twelve** mutations
  across AC-3 (both falsifications), AC-6 (both passes), AC-9, AC-10, AC-11, AC-12, AC-15/16,
  AC-16's seed and AC-17, restored every file byte-identically and watched both suites return to
  44 / 884 / 2 and 16 / 16.
  ---
  **Two guards in this story cannot fail, and I demonstrated both rather than reasoning about
  them.** QA-1: `ErrorCodeVocabularyTest.theConstraintIsAddedNotValidAndValidatedSeparately`
  greps the migration's **whole file text**, and the migration's own operator-remedy comment quotes
  `ALTER TABLE ui_test_executions VALIDATE CONSTRAINT ck_ui_test_executions_error_code;` verbatim —
  so with the real `VALIDATE` statement deleted the test stays **green** (the container IT catches
  it, red ×2). That is a thirteenth vacuous-guard shape for this epic: *a source-text scan over an
  artefact that quotes itself*. QA-2: `terminal-order.test.ts > 'writes the manifest before the
  result is delivered'` is named for AC-3 falsification (a) and stays **green** under exactly that
  mutation, because its `sendFinal` sentinel is `journal.push`ed by the test after the run has
  completed and is last by construction. Both are redundantly covered by sibling assertions in the
  same files, so nothing is actually unproven — but two named falsifications are carried by tests
  other than the ones that name them.
  ---
  **Three smaller findings.** Two md5s in the AC-22 table do not correspond to any delivered state
  (`RunnerReportProjection.java` recorded `4ce07638…`, actual `5f9926c4…` at all three commits and
  in the working tree; `ErrorCodeConstraintMigrationIT.java` recorded `7c7186b8…`, actual
  `12a5bf62…`) — the *restoration* is provable from git, the *recorded evidence* for those two rows
  is not. AC-20's "capable of two" neutralises two terms, not the one it names. And the surviving
  row-22 mutant is unfalsifiable **by the current field set** rather than by construction: I
  confirmed both halves (pass-2 dropped survives all 44 files; pass-1 dropped goes red ×1 on the
  JSON-escaping case), and pass 1 does not touch numeric leaves, so a future numeric field sourced
  from resolved input would make pass 2 load-bearing with nothing to notice.
  ---
  **The deliberately-red escalation test went green legitimately.** `dd8932d7f` is an @architect
  `docs(architecture)` amendment answering story 10.7's §12 escalation, with an ADR-002 §13 Class C
  log row that records `ExecutionErrorCodeContractEscalationTest 1/2 → 2/2 **with no change to the
  test**` and a full §15.10 record. The gap closed; nobody widened the thing it measured. That is
  the designed path, and it is the answer story 10.10's own open escalation should be held to.
  Nothing blocks the merge.
