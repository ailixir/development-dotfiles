# ─────────────────────────────────────────────────────────────────────────────
# The thirteenth vacuous-guard shape, and a second instance of the same family
# ─────────────────────────────────────────────────────────────────────────────
thirteenth_vacuous_guard:
  shape: >-
    **A source-text scan over an artefact that quotes itself.** The assertion greps a file for the
    statement it is asserting the presence and ordering of, and the same file contains a prose copy
    of that statement — here an operator-remedy comment written, correctly and helpfully, inside
    the migration. The scan is then satisfied with the statement deleted. It is a relative of the
    epic's first shape (source-text greps instead of captured output) but is not the same thing:
    the artefact under test is the one being read, and the false evidence is *inside* it rather
    than in a neighbouring source file.
  instance: backend/src/test/java/com/citi/put/checks/studio/ErrorCodeVocabularyTest.java
  test: theConstraintIsAddedNotValidAndValidatedSeparately
  demonstration: >-
    All three of its assertions — `containsIgnoringCase("NOT VALID")`,
    `containsIgnoringCase("ALTER TABLE ui_test_executions VALIDATE CONSTRAINT
    ck_ui_test_executions_error_code")` and the `indexOf` ordering check — are satisfied by the
    comment block alone. I ran QM-F (the `VALIDATE` statement deleted) and the test passed; I also
    checked analytically that it passes with **both** DDL statements removed and only the comments
    left. The docstring calls it *"not a style assertion: it is the difference between a deploy and
    an outage"*, which is exactly the claim it cannot support.
  why_it_matters_here_and_not_more: >-
    The same file has a **control** — `theMigrationParserReadsTheStatementAndNotTheCommentThatRepeatsIt`
    — written for precisely this hazard, but only for the *value list*, not for the *form*
    assertions. The form is genuinely proven by `ErrorCodeConstraintMigrationIT` against a live
    container. So nothing about AC-15 is actually unproven; the named guard is decoration standing
    beside a real one.
  second_instance_same_family:
    id: QA-2
    file: studio-runner/test/server/terminal-order.test.ts
    test: "'writes the manifest before the result is delivered'"
    shape: >-
      **An ordering assertion against a sentinel the test appends after the fact.** Five of the six
      journal entries are captured at their own seams; the sixth, `'sendFinal'`, is
      `journal.push`ed by the test body after `await until(() => coordinator.inFlight === 0)`, so it
      is last **by construction**. Any assertion of the form `indexOf(X) < indexOf('sendFinal')` is
      unfalsifiable, and only the accompanying `toBeGreaterThanOrEqual(0)` presence check can move.
    demonstration: >-
      Under QM-A — AC-3's own falsification (a), *"move the manifest write after `sendFinal` -> the
      named test red"* — this test **passed** while eight others in the file failed.
    also: >-
      The file's docstring states the mechanism as *"one from the HTTP client"*. It is not from the
      HTTP client; it is a literal appended by the test. That is the epic's ninth shape (a stated
      discriminating mechanism that is not the live one) recurring in a new place.

