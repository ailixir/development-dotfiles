story: '10.16b'
story_title: Evidence state, playback and step seek — runner test-helper half (seek-measurement flake)
epic: EPIC-10
wave: 7

gate: PASS

status_reason: >-
  RE-REVIEW at 4ffc4020c (2026-09-16): PASS. F-1 is closed, and this reviewer verified that by mutation.
  The new boundary test places each of the 10 transcribed steps at repaint + tolerance - 0.1 ms and
  requires the default slack to match that repaint, while a slack 0.2 ms narrower must not. Slack 90
  and slack 99 each turn exactly that test red. T3 (moving the report onto the effect) turns its contrast
  assertion red, so the step really does sit at the boundary. The tolerance is now read as text from
  seek-measurement.test.ts. Sixteen probes, run in place and restored byte-identically, show that the read
  is not a vacuous guard. It fails closed (a loud collection error) on every change of declaration form
  tried, and on any second column-0 declaration, including one inside the skipped AC-12b describe. It
  follows a change of value (120 turns the test red; 80 turns check (b) red, which is honest). It ignores
  prose. Its residual weakness (F-7) is that it binds to the declaration, not to the value the median
  assertion actually uses. A documented literal has that weakness too, plus it misses every change of
  value. So the read is strictly better than the literal it replaced. Suites at 4ffc4020c: 947 passed / 29
  skipped; fixtures 89 / 10; lint 0. Type-check has the one pre-existing error, outside this diff. F-2
  through F-6 carry unchanged and none blocks the merge.
  ORIGINAL REVIEW at 594a3252e: CONCERNS, for the reasons below.
  The fix is a correction, not a loosening, and this reviewer established that by measurement rather
  than by reading the developer's argument. It also reproduced the defect independently. With the
  helper temporarily set back to slack 60, 2 of 8 fixtures-tier runs failed, both on the MEDIAN
  assertion ("median seek error was 284.9ms", "…453.8ms"). 13 of 75 steps were above 100 ms, and every
  one of the 13 had its repaint stamped 60.7–75.1 ms before the reported start: above the old slack,
  below the new one. That is the developer's mechanism (14 of 90, 60.0–85.3 ms) seen by a second
  observer. Replaying slack 100 on these recordings, which the developer never saw, puts every step
  within 75.1 ms and drops the two failing medians to 62.3 and 66.2 ms.
  Correction vs loosening, settled on real frames. Every inner-run recording (2 of the developer's, 17
  of this reviewer's) was run again with each reported offset shifted by d = -600..+600 ms, which
  simulates a runner that reports late or early. Each shift was scored against the verdict the true
  error gives. Slack 60 wrongly fails every recording somewhere in d ≈ -6..+81 ms; slack 100 wrongly
  fails none of them anywhere. Both slacks wrongly pass a runner about one step cadence late
  (d ≥ ~546 ms), where each step aliases onto the next step's repaint. That hazard is built into
  matching by time and was not introduced here; slack 100 extends it by 3–8 ms in 2 of 19
  recordings. One early-shift band (qb-6/2, d -127..-119) is identical under both values. So no
  runner whose median error is ≥ 100 ms (shifts below one cadence) passes under 100 and failed under
  60. What 60 enforced beyond the documented tolerance was an undeclared one-sided bound, applied at
  random. MEDIAN_TOLERANCE_MS and OUTLIER_BOUND_MS are untouched, and seek-measurement.test.ts is
  byte-identical to the base (a0d3561d…28c9 at both).
  Why 100 and not another value in (85.3, 320.7): the data does not pick it, but the property does.
  Slack ≥ tolerance is exactly the condition under which no in-tolerance step can be mis-attributed,
  and 100 is the smallest value that satisfies it. Anything larger only widens the window for a
  backwards match to a spurious change (bounded by (c) at 320.7, confirmed: 320 green, 321 red).
  Provenance is verified, not merely asserted. Both recordings cited in webm.test.ts still exist in
  the developer's capture directory. They hash to the cited sha256 values, they are real VP8 WebM
  files written by Playwright's muxer (Lavf61.1.100), and readWebmFrames over each returns a list
  identical to the transcribed literal (140 and 141 frames). The run logs beside them print the
  cited SEEK rows and the cited failure message verbatim.
  What keeps this off PASS is one instance of catalogued shape #21: the property the fix rests on,
  "slack equals tolerance, so an in-tolerance step can never be mis-attributed", lives only in the
  doc comment. Setting the default to 90 leaves webm.test.ts green (5/5), and every other test in
  the repository would stay green too, because no captured lead exceeds 85.3 ms. The flake would
  come back for leads in (90, 100) and nothing would say so.

