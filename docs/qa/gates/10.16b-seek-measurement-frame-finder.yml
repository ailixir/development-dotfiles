findings:
  - id: F-1
    severity: medium
    shape: '#21 (a documented invariant only prose protects)'
    title: '"slack equals tolerance" is the fix''s whole justification and nothing asserts it'
    detail: >-
      The doc comment says the 100 ms default equals MEDIAN_TOLERANCE_MS, "so the helper can no
      longer turn an in-tolerance step into an out-of-tolerance number". Q1 (default 90) leaves
      webm.test.ts green, because the widest captured lead is 85.3 ms. The flake would come back for
      leads in (90, 100) with every test green. webm.test.ts's own MEDIAN_TOLERANCE_MS is a copy with
      no provenance check ("copied, not imported"; the real one cannot be imported without editing
      the AC-16 file).
    remedy: >-
      Add one test in webm.test.ts on a real transcribed recording. Place a reported offset just
      under one tolerance after a known effect (for example AC15_RUN7 effect 1400, report 1499.9),
      and assert that the default-slack match is that effect. Q1 then turns red, and M3/Q3 still
      guard the upper side. Optionally also read MEDIAN_TOLERANCE_MS out of seek-measurement.test.ts
      as text and compare it with the local copy. That is a read, not an edit, so AC-16 still holds.
    owner: '@dev'
    blocking: false
    status: CLOSED at 4ffc4020c (Q1 and Q1b red, T3 red; see rereview_4ffc4020c)
  - id: F-2
    severity: low
    title: The transcribed recordings live only in an ephemeral scratchpad
    detail: >-
      Verified today (see provenance_of_transcribed_frames). Once /private/tmp is cleaned, the sha256
      values in the provenance strings can no longer be checked by anyone.
    remedy: >-
      Keep the two files (about 3.2 MB in total) somewhere durable outside the tree, and record where,
      or accept this gate's verification as the durable record. @po decides.
    owner: '@po'
    blocking: false
  - id: F-3
    severity: low
    title: E-4, httpClient timeout race, owner unassigned
    detail: See e4_httpclient_timeout. Not caused by this diff as far as can be measured; a
      default-tier flake with no owner.
    remedy: >-
      Assign it to the owner of test/reporting (10.6's surface). Two candidate fixes: have the server
      acknowledge that it received the request before the client's deadline starts, or widen the
      client deadline together with a server-side hold. @po or @sm decides.
    owner: '@po'
    blocking: false
  - id: F-4
    severity: low
    title: E-1, seek-measurement.test.ts comments now contradict measured evidence
    detail: >-
      Lines 43-48 and 72-75 attribute mis-attribution to a missed or split repaint. In 27 of 27
      mis-attributions across two observers, the repaint was found and the slack was the cause. A
      maintainer who believes the comment would reach for groupWithinMs, which M4 shows is the
      harmful direction. AC-16 correctly forbids the edit in this half.
    remedy: >-
      @po rules on a comment-only amendment before 10.19, stated in FOC-06 form, for example in the
      10.19 conformance pass.
    owner: '@po'
    blocking: false
  - id: F-5
    severity: low
    title: E-3, the median margin is real and narrower than the old numbers suggested
    detail: >-
      With attribution correct, the median is up to 62.8 ms (this reviewer) and 70 ms (developer);
      the widest single lead is 75.1 ms and 85.3 ms respectively. On a slower host (the pinned CI
      image, ED-05) the lead can grow past 100 ms and the assertion will then fail correctly. That
      does not threaten the no-widening rule in principle: the designed remedy is the AC-12c
      runner-side calibration in src/run/timeline.ts, owned by SPK-06 phase B, not a wider constant.
      In practice it will create pressure to widen. A lead past 100 ms also shows up as a +400–650 ms
      "mis-attribution" number rather than the true about -110 ms, which misleads diagnosis.
    remedy: >-
      @architect notes it against AC-12c/SPK-06 before 10.19. Anyone who meets a legitimate red
      reports the lead (SEEK table plus capture) and does not touch MEDIAN_TOLERANCE_MS.
    owner: '@architect'
    blocking: false
  - id: F-6
    severity: low
    title: Story-file conflict between the two halves
    detail: See split_merge_hazard.
    remedy: The second half to merge resolves docs/stories/10.16.story.md by keeping both halves' sections.
    owner: '@devops / orchestrator'
    blocking: false

  - id: F-7
    severity: low
    title: The tolerance text read binds to the declaration, not to the value the median assertion uses
    detail: >-
      S7 (the assertion becomes MEDIAN_TOLERANCE_MS + 50) and S8 (an indented shadowing const 150 in the
      AC-12a describe) both leave webm.test.ts green while the measurement asserts 150. S10 (a reformat
      plus a column-0 comment decoy) also survives, but it is contrived. A documented literal would
      miss all three as well, so this is a residual, not a regression.
    remedy: >-
      Optional, small. In readMedianTolerance, also require exactly one occurrence of
      `.toBeLessThan(MEDIAN_TOLERANCE_MS);` and exactly one match of
      /^\s*(?:export\s+)?(?:const|let|var)\s+MEDIAN_TOLERANCE_MS\b/gm (any indentation, any
      form). By inference (not run), that would catch S7, S8 and S10. Otherwise accept the gap: any such edit to
      seek-measurement.test.ts is itself a widening that the epic's no-widening rule polices in review.
    owner: '@dev (optional)'
    blocking: false

acceptance_criteria:
