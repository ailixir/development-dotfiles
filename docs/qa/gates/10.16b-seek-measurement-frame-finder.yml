rereview_4ffc4020c:
  scope: >-
    Commit 4ffc4020c only (webm.test.ts plus the story record). webm.ts is 771d98448cd1… and
    seek-measurement.test.ts is a0d3561d…28c9 at HEAD, identical to the base a02f1d505.
  harness: >-
    Python in a private mktemp directory under $TMPDIR, not the shared scratchpad. Each run checks that
    its anchor occurs exactly once, applies the edit, runs `npx vitest run test/helpers/webm.test.ts
    --coverage.enabled=false`, restores the file from a copy, and asserts its sha256 against the base
    hash. Every row printed RESTORED-OK. Baseline before the rows: 6 passed.
  f1_closure:
    - id: Q1
      mutation: webm.ts slackMs 100 -> 90
      observed: '1 failed / 5 passed: the new test, "run 7 step 0, reported 99.9: expected 720 to be +0"'
    - id: Q1b
      mutation: slackMs -> 99
      observed: 1 failed / 5 passed, the new test, same message
    - id: T3
      mutation: webm.test.ts reportedMs = step.effectMs (boundary removed)
      observed: '1 failed: the contrast assertion, "reported 0: expected +0 not to be +0"'
    - note: >-
        Not re-run by this reviewer: Q1c (slack 99.95, which survives by design below the 0.1 ms print
        resolution). The developer's record and the arithmetic agree on it. The orchestrator
        independently saw 90 and 99 red and 100 green.
  text_read_probes:
    target: test/fixtures-tier/seek-measurement.test.ts, mutated in place and restored (AC-16 forbids a committed change, not a probe)
    rows:
      - {id: S1, mutation: 'value 100 -> 120', observed: 'RED: new test, "reported 119.9"', reading: follows a widening}
      - {id: S2, mutation: 'value 100 -> 80', observed: 'RED: (b), "expected 85.3 to be less than 80"', reading: 'follows a tightening; the red is honest, because run 3 step 3 really is out of an 80 ms tolerance'}
      - {id: S3, mutation: 'const MEDIAN_TOLERANCE_MS: number = 120;', observed: 'collection error, "found 0"', reading: fails closed}
      - {id: S4, mutation: 'export const … = 120;', observed: 'collection error, "found 0"', reading: fails closed}
      - {id: S5, mutation: 'value 1_20', observed: RED (reads 120), reading: separators handled}
      - {id: S6, mutation: 'value 120.0', observed: 'collection error, "found 0"', reading: fails closed}
      - {id: S13, mutation: 'const WIDER = 150; const MEDIAN_TOLERANCE_MS = WIDER;', observed: 'collection error, "found 0"', reading: fails closed}
      - {id: S9, mutation: 'column-0 declaration of 500 inside the skipped AC-12b describe', observed: 'collection error, "found 2"', reading: cannot bind to the skipped describe}
      - {id: S11, mutation: 'real declaration kept, plus a column-0 copy inside a template string', observed: 'collection error, "found 2"', reading: cannot bind to a string}
      - {id: S12, mutation: '// const MEDIAN_TOLERANCE_MS = 150; line comment added', observed: GREEN, reading: 'correct; prose is ignored and the real value is still 100'}
      - {id: S7, mutation: 'median assertion changed to toBeLessThan(MEDIAN_TOLERANCE_MS + 50)', observed: GREEN, reading: 'SURVIVES; the read binds to the declaration, not to the assertion (F-7)'}
      - {id: S8, mutation: 'indented const MEDIAN_TOLERANCE_MS = 150 shadowing it inside the AC-12a describe', observed: GREEN, reading: 'SURVIVES; the measurement asserts 150 and the read returns 100 (F-7)'}
      - {id: S10, mutation: 'real declaration retyped to 150, plus a column-0 copy of the old one inside a block comment', observed: GREEN, reading: 'SURVIVES; binds to the decoy. Contrived, because it needs a reformat and a decoy together (F-7)'}
    ruling: >-
      Not shape #1 and not #14, because the read is a parameter lookup, not evidence of behaviour. The
      anchored, column-0, exactly-one regex excludes the file's own prose mention (line 52), strings,
      comments and the skipped describe, and it fails loudly on every refactor tried. It can silently
      give a wrong answer only when the median assertion stops using the top-level declaration (S7, S8)
      or when a reformat and a column-0 decoy happen together (S10). A documented literal is blind in all
