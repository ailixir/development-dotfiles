top_issues:
  - id: MERGE-1
    severity: medium
    owner: '@po / the epic lead (not @dev)'
    finding: >-
      `git merge-tree` of `story/10.11a` and `story/10.11b` produces **7 conflict markers** across
      three files that changed in both: `docs/stories/10.11.story.md`,
      `frontend/src/pages/ChecksStudioPage/ChecksStudioPage.tsx` and
      `frontend/src/services/mocks/studio/studioContract.test.ts`. The dangerous one is the page.
      **10.11a deliberately retains the 700 ms poller** (`pollingRef`, `stopPolling`,
      `setInterval(…, 700)` at `ChecksStudioPage.tsx:266-327` on that branch, with a comment saying
      removing it is *"explicitly not this story's"*), while 10.11b's whole AC-8 is its removal. Both
      halves are internally correct. A conflict resolution that takes 10.11a's `handleRunTest`
      wholesale reinstates the poller and defeats AC-8 — and AC-8's guard lives in 10.11b's file, so
      it would only be caught if the merged tree is re-run.
    suggested_action: >-
      Merge with a stated resolution rule recorded in the merge commit: **10.11a owns the enablement
      predicate of `handleRunTest`; 10.11b owns its body and the subscription lifecycle.** After the
      merge, re-run `studioRunTransport.node.test.tsx` and `studioTransport.node.test.ts` **and**
      10.11a's `pageRunGate.test.tsx` / `runGate.test.tsx` on the merged tree before either half is
      considered landed, and confirm `pollingRef` and `setInterval(…, 700)` appear nowhere in
      `ChecksStudioPage.tsx`.
  - id: SCEN-1
    severity: medium
    owner: '@dev (10.11b), or whoever resolves MERGE-1'
    finding: >-
      The four-line route-`:id` effect added to make `handleScenarioSelect` reachable (AC-13's
      mid-stream switch) introduces a behaviour regression in an unrelated flow.
      `handleCreateNewScenario` calls `reloadScenarios()` then `setSelectedScenario(created.id)`. The
      effect's deps are `[params.id, scenarios, selectedScenario]`, so it re-runs, sees
      `params.id !== selectedScenario`, finds `params.id` in the reloaded list, and calls
      `handleScenarioSelect(params.id)` — **reselecting the previous draft and overwriting
      `testSteps` with its steps.** Reachable whenever the page is at `/checks/studio/:id`
      (`App.tsx:114`) and the user creates a new scenario. The change itself is otherwise minimal and
      correct: it calls the **existing** handler, it is guarded against unknown ids and against
      re-entry, and `handleScenarioSelect` contains no `navigate()`, so there is no loop.
    suggested_action: >-
      One line. Either navigate to the created id (`navigate(\`/checks/studio/${created.id}\`)`, which
      is what the route is for and makes the effect a no-op), or track the last route id the effect
      acted on in a ref and skip when `params.id` has not itself changed. Also correct the effect's
      docstring: it names the route as `/checks/studio/tests/:id`, but `studio/tests` is
      `StudioTestsPage` (`App.tsx:112`) — the studio page's parameterised route is
      `/checks/studio/:id`.
  - id: ENV-1
    severity: medium
    owner: unowned, epic-wide — explicitly NOT this story's
    finding: >-
      `npm run lint` lints **zero files** (ESLint 8.57.1 cannot load `.eslintrc.json`'s
      `"@typescript-eslint/recommended"` shorthand) and `npm run type-check` carries two
      pre-existing `TS2307 @put/core-components` errors, with `ChecksLayout.a11y.test.tsx` failing
      behind the same unresolved import. All three are identical at base and at HEAD.
    suggested_action: >-
      Keep reporting the lint gate as **FAILED**, never as passed — @po's standing rule, and @dev
      applied it correctly. Do not fix any of the three inside a transport story. Note for the
      record: `@put/core-components` resolves in the main checkout and dangles only from a worktree,
      and behind the import there is a genuinely missing skip link — both accounts remain true.
  - id: REC-1
    severity: low
    owner: '@dev (record accuracy)'
    finding: >-
      The falsification table's **NC** row records *"(none — the test stays GREEN with the ordering
      rule gone)"*. It does not. With M2 applied and the fixture swapped to
      `REVISION_ORDERING_SEQUENCE_FLATTENED`, `SCN-REVISION-OUT-OF-ORDER` is **RED**:
      `expected [ 5, 7, 6, 7 ] to deeply equal [ 5, 7 ]`. The shipped test asserts the *applied
      revision list* as well as the surface, which is stronger than AC-10's wording (*"the rendered
      state after the whole sequence equals rev 7's, field by field on the surface"*). Dropping that
      one assertion — the criterion-literal form — makes the flattened fixture **green**, which is
      the negative control the criterion actually describes and which I reproduced.
    suggested_action: >-
      Amend the NC row to say which assertion set it refers to. The substance is fine and the guard
      is stronger than required; the row as written is not reproducible and AC-23 makes the record a
      deliverable.
  - id: REC-2
    severity: low
    owner: '@dev (record accuracy)'
    finding: >-
      *"M3 restored a 700 ms poller inside the component and **nothing** went red"* is imprecise.
      Re-running M3 with the dwell reduced back to 400 ms, AC-7's `SCN-DEV-TRANSPORT` is green — the
      vacuity is real and is exactly as diagnosed — but **AC-8's test still reddens**, because its
      full run exceeds 700 ms in this environment. The repair and its reasoning are correct; only
      the scope of "nothing" is wrong.
    suggested_action: 'Narrow the sentence to AC-7''s test. No code change.'
  - id: VAC-OBS
    severity: low
    owner: informational — no action required
    finding: >-
      Two instances of **already-catalogued** shapes, both benign. (a) Shape #15 (*an ordering
      assertion against a sentinel the test appends after the fact*): AC-9's
      `expect(order.indexOf('wrote:2')).toBeGreaterThan(order.indexOf('surfaced:2'))` is
      unfalsifiable by the test's own control flow — `order.push('wrote:2')` executes after
      `await until(() => surfaced.length === 1)` — and both `wrote:*` elements are written by the
      test body, not by a seam. (b) Shape #9 (*a stated discriminating mechanism pre-empted by a
      different guard*): when I injected the wave-5 drift (P3), the test went red by the `until`
      **timing out**, not by the `order` assertion. **Neither makes AC-9 vacuous.** The
      `expect(order).toEqual([...])` equality does guard the test's construction against exactly that
      drift, and the load-bearing discrimination is the `until` plus
      `expect(open.finished).toBe(false)` read from `res.writableEnded` — which M1 reddens. Recorded
      so the next reader does not mistake the `indexOf` line for the guard.
    suggested_action: >-
      None. If AC-9 is ever edited, keep the `toEqual` and the `until`; the `indexOf` line is
      redundant and may be dropped without loss.
  - id: T17-1
    severity: low
    owner: '@po'
    finding: >-
      `T-10.11.17` sits in the **10.11b** task block but covers AC-18 and AC-19, which the *Split
      hint* table assigns to **10.11a** (`10.11b` is `AC-7 – AC-17, AC-20`). @dev left it unticked,
      unimplemented, and raised it rather than absorbing two of 10.11a's criteria. **Verified against
      the Split hint table and confirmed as the correct call** — implementing it here would have put
      two developers in the same files in the same wave, which is the very thing MERGE-1 shows is
      already tight enough.
    suggested_action: >-
      Re-file `T-10.11.17` under the 10.11a task block. 10.11b already ships the `logsTruncated`
      frames those criteria need (AC-17's scenario), so 10.11a inherits fixtures, not work.
  - id: FLAKE-1
    severity: low
    owner: unowned, epic-wide — not this story's
    finding: >-
      This suite's pass/fail set is load-sensitive. Measuring the baseline in a detached worktree on
      a loaded machine (81.44 s against @dev's 40.89 s) produced three **timeout** failures that are
      not assertion failures: `SplunkPrototypePage.test.tsx > combines thresholds across columns`,
      `review/accessibility.test.tsx > the confirm control is a button with a name` and
      `review/confirmFlow.test.tsx > enumerating the document union`. The two review files pass in
      isolation; `SplunkPrototypePage.test.tsx` alone takes **110.64 s**. 10.11b's own suites are
      also timing-shaped — `until()` defaults to 5 000 ms and the AC-9 file's tests use vitest's
      5 000 ms default — so on a slow machine a real failure and a timeout look identical.
    suggested_action: >-
      Not 10.11b's to fix, and the after-state was clean at 305/304 on two independent runs in the
      unloaded worktree. Worth raising to @po as an epic-level item: give
      `SplunkPrototypePage.test.tsx` an explicit budget, and treat any run **short of its baseline
      count** as a hang rather than a pass, per the epic's own rule.

