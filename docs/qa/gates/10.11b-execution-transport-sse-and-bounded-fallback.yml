gate: CONCERNS
rounds: 1

status_reason: >-
  **The load-bearing claim is real and was reproduced, not read.** AC-9's streaming proof is a
  genuine `node:http` server writing a genuinely chunked `text/event-stream`, with the **production**
  transport module as the client and `StreamConnection.finished` implemented as `res.writableEnded`
  on the server's own response object — verified by reading the harness and by running the
  falsification. Applying **M1** myself (replacing `createStudioEventSource` with a reader that
  awaits the whole body through `fetch` before parsing) turns `studioSseStreaming.node.test.ts` to
  **4 failed | 3 passed (7)**, red on exactly `SCN-STREAM-TWO-FRAMES` and
  `SCN-IDLE-SURVIVES-CLIENT-TIMEOUT`, by timing out waiting for frame 1 to be surfaced. That is the
  criterion behaving as written: a buffering client cannot surface frame 1 before the response
  closes. This is not a buffered mock.
  **Every gate number in the Dev Agent Record reproduced.** `npm run type-check` exit 2 with exactly
  the two pre-existing `TS2307 @put/core-components` errors at `ChecksLayout.tsx(6,33)` and
  `navigationSetup.ts(1,36)`. `npm run lint` fails before linting any file — *"ESLint couldn't find
  the config @typescript-eslint/recommended"* — and is reported **FAILED**, per @po's standing rule.
  `vitest run` **Test Files 2 failed | 23 passed (25); Tests 1 failed | 304 passed (305)**, run
  twice (before and after the mutation pass) with identical results. The baseline was **measured, not
  adopted**: a detached worktree at `78cc634b2` sharing this worktree's `node_modules` returned
  **21 files / 276 tests**, matching the record's totals exactly, and the +4 files / +29 tests delta
  is fully accounted by the per-suite table (7 + 12 + 4 + 4 new, plus `studioContract.test.ts`
  25 → 27).
  **Ten mutations were re-applied here** — M1, M2, the negative control, M3, M6, M7, M8, M9, M10,
  M13, M15 — plus three probes of my own. Each reddened the named test; sibling green counts matched
  the record in every case; every file was restored from a byte copy and compared by SHA-256, all
  six matching, with `git status --short` empty afterwards. **M13's discrimination is correct and I
  judge it correct**: moving the ordering rule into the streaming implementation leaves
  `SCN-REVISION-OUT-OF-ORDER` **green** and reddens `SCN-FALLBACK-AS-PRIMARY`, which is precisely the
  asymmetry AC-16 exists to detect. **M9 and M10 each redden exactly one of AC-13's two count tests
  and leave the other green** — AC-13, which story 10.16 depends on, is verified.
  **All three self-caught repairs hold, and I re-derived the defect each closed.** (1) With M3 applied
  and the dwell reduced back to 400 ms, AC-7's `SCN-DEV-TRANSPORT` goes **green** — the restored
  poller's tick falls outside the window, exactly as @dev diagnosed — and at the shipped 1600 ms it is
  **red**. (2) M6 reddens `SCN-DENY-401-STREAM` because of the two request-count assertions
  (`streamRequests().length === 1`, `snapshotRequests().length === 1`) that stop the fallback's own
  denial branch from satisfying the stream's guard. (3) M15 reddens the AC-17 frame test, which now
  locates all five named frames by index and asserts them strictly increasing.
  **The `EventSource` approach is sound and is option (a), not option (b).** Measured here: Node
  v23.10.0 exposes no `globalThis.EventSource`; `--experimental-eventsource` makes it a `function`;
  `process.allowedNodeEnvironmentFlags.has('--experimental-eventsource')` is `true`. No dependency,
  no polyfill, no second implementation. The guard is an ordinary `it()` asserting
  `'EventSource' in globalThis` and `typeof === 'function'` — **it fails, it does not skip**, which is
  the property that stops every streaming test going vacuous on a machine without the flag.
  **AC-14(ii)'s wording claims only what it proves.** The test sets the shared client's timeout to
  120 ms, idles ~480 ms behind heartbeat comments and delivers a later snapshot with
  `streamsOpened === 1` and zero snapshot reads. Both the criterion and the record say plainly that
  the literal 30 s is never exercised and that the ceiling that matters is the ingress's. That is
  honest; the criterion is weak, and it says so.
  **What holds this at CONCERNS rather than PASS** is one behaviour regression this half introduced
  and one measured merge hazard. `SCEN-1`: the four-line route-`:id` effect that makes
  `handleScenarioSelect` reachable also makes `handleCreateNewScenario` snap back to the previous
  draft. `MERGE-1`: `git merge-tree` of `story/10.11a` and `story/10.11b` produces **7 conflict
  markers** across three files, and 10.11a **deliberately retains the 700 ms poller** — so a
  resolution that takes 10.11a's `ChecksStudioPage.tsx` wholesale silently defeats AC-8. Neither is a
  defect in the transport; both are actionable and must not close by silence.

