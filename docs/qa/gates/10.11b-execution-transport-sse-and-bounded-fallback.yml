final_decision:
  gate: CONCERNS
  merge: 'SAFE, with the MERGE-1 resolution rule stated in the merge commit'
  rationale: >-
    The transport is real work, honestly measured, and the one claim that could most easily have been
    faked was not: AC-9's streaming proof survives the falsification the SSE assessment named in
    advance, and I ran that falsification rather than reading about it. Ten mutations reproduce, all
    six restores are byte-identical, all three self-caught repairs hold against the mutations they
    originally missed, and both blocked criteria are genuinely unreachable — SPK-02 is OPEN and its
    closing directory does not exist. The `EventSource` decision is option (a) as @po ruled it, adds
    no dependency, and its guard fails rather than skips, which is what keeps every streaming test
    from going vacuous elsewhere. AC-14(ii) is weak and its own wording says so, accurately; that is
    the correct way to carry a weak criterion. @dev finding three of its own guards unfalsifiable and
    **repairing rather than counting them** is the single best thing in this record.
    It is CONCERNS rather than PASS for two reasons, neither of them in the transport. **SCEN-1** is a
    real behaviour regression this half introduced into a shared file — making `handleScenarioSelect`
    reachable was necessary and minimal, but the effect as written also fires on the create-scenario
    path and snaps the selection back. **MERGE-1** is measured, not speculative: seven conflict
    markers, and a resolution taking 10.11a's page wholesale reinstates the 700 ms poller that
    10.11a deliberately kept, silently defeating AC-8 with the guard that would catch it sitting in
    the other half's file. Both have concrete one-step remedies and both must be closed before the
    two halves land, not after.
    Three low findings are record accuracy rather than behaviour (**REC-1**, **REC-2**, **VAC-OBS**),
    one is @po's filing (**T17-1**, and @dev's refusal to absorb it was right), and two are unowned
    epic conditions reported rather than absorbed (**ENV-1**, **FLAKE-1**). **No seventeenth vacuous
    shape was found** — two instances of catalogued shapes #15 and #9 in AC-9's ordering assertion,
    both benign, both recorded so the next reader does not mistake the redundant line for the guard.
