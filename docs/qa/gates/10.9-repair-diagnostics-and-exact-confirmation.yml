status_reason: >-
  The route Epic 10 exists to guarantee is here, and the reviewer proved the load-bearing claims by
  mutating the shipped code rather than by reading it. Six mutations were applied to production
  source by this reviewer, each run against its named test and each restored from a byte copy with
  `git status --short` empty afterwards. Neutralising `artifact_hash = ?` in confirm's revision
  statement turned exactly one test red — aWrongArtifactHashIsStaleCandidateAndWritesNothing, 1 of
  12. Neutralising `confirmed_by IS NULL AND confirmed_at IS NULL` turned three of four
  ConfirmationWriteOnceIT tests red and every one of them answered 500, not 409, with V12's
  write-once trigger raising: the developer's reading of that result is correct and the shipped
  route answers 409 (that class is 4/4 green in the reviewer's own full run). Deleting
  `compile_request_id = NULL` from the sweep's SET turned alatePublishArrivingAfterTheSweepIs
  DiscardedOutOfOrder red. Reverting the sweep's CTE to the `WHERE id IN (SELECT ... LIMIT ?)` form
  the developer reports as a defect turned theSweepStopsAtItsBatchSizeAndTheNextRunContinues red
  with "expected 2 but was 5" — the batch bound is real only in the shipped form, measured here and
  not argued. Dropping `validateTimeoutMs` from the startup formula — a stronger mutation than the
  developer's `if (false)` — turned theBudgetMustStrictlyExceedTheRepairArithmeticAtExactlyThat
  Boundary red alone, which settles @po's first weak-criterion question: the test computes the
  boundary from the three bound values and discriminates the exact formula, and it carries no
  literal 210 or 240. Turning `isCoreServiceBypassed()` to false turned the live ED-02 sibling red
  alone, so that holder genuinely fires.
  Scope is clean. The only `openapi.yaml` edit is one deleted line, `x-not-yet-implemented: true`
  on confirmCompile, with `x-implemented-by: '10.9'` kept and one ADR-002 §13 row added; the
  document's SHA-256 moves 815aae9b0068…dd80 → cbf07c99de36…f412 exactly as FOC-04 plans, and
  `git diff --name-only HEAD~1 HEAD -- studio-runner/` is empty, as is the frontend. The 23 test
  failures in the reviewer's own `check` are the ED-02 set name for name with zero studio-package
  failures — and the baseline behind that claim was re-measured rather than accepted: the same 14
  classes at 34138201f, in a detached worktree holding none of this story's code, fail 23 times with
  identical per-class counts, while the two contract classes are 18 PASSED / 0 FAILED there. The
  delta is zero by measurement at both ends. The lead's brief about pre-existing spotless violations
  does not reproduce either: `spotlessCheck` at the base commit is BUILD SUCCESSFUL.
  What keeps this off PASS is one guard that cannot fail and one criterion that is unmet as
  written. AC-21's theConfirmTransitionHasExactlyOneProductionCaller and AC-12's noClassOnThe
  CompilePathReferencesTheConfirmTransition both match the receiver's *variable name* —
  `compileStateService.confirm(` and `states.confirm(` — and their non-vacuity guards pin only the
  method's spelling. The reviewer added a production `@Component` to the compile package that calls
  `stateService.confirm(..., "system")` with no principal at all, and both tests stayed green. That
  is the ninth guard this epic has found that could not fail for the change it exists to catch. And
  AC-23's "green from clean" clause is false while ED-02 is open; leaving its checkbox unticked was
  the right call and is endorsed here, but the criterion now needs @po rather than another attempt.

