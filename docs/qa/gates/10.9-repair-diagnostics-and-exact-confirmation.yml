ac13_inputs:
  question: '@po: AC-13''s 210 s inputs were unstated. Are they derived or chosen?'
  answer: DERIVED, AND THE TEST DRIVES THE DERIVATION RATHER THAN THE NUMBER
  detail: >-
    theBudgetMustStrictlyExceedTheRepairArithmeticAtExactlyThatBoundary binds all three inputs from
    the records' own @DefaultValue declarations through `new Binder(new
    MapConfigurationPropertySource(Map.of())).bindOrCreate(...)` — an empty property source, so the
    values are the shipped defaults and nothing else — computes worstCaseMs from them, and asserts
    that exactly worstCaseMs fails startup and worstCaseMs + 1 passes. There is no literal 210 or
    240 anywhere in the test body. The reviewer's formula mutation proves it discriminates the
    arithmetic and not merely the existence of a check. A second test,
    theConfiguredDeploymentSatisfiesTheSameArithmetic, repeats it against the autowired beans, so a
    divergence between record defaults and application.yml fails too. This criterion is met on the
    strength @po asked for.

ac10a_stub_bound:
  question: '@po: AC-10a''s call counts are only ever proven against a scripted stub.'
  answer: HONEST SCOPING IS SUFFICIENT HERE — NO CONCERNS ITEM RAISED
  detail: >-
    The Dev Agent Record states, unprompted and in the right place, exactly what the counting stub
    establishes (properties of the pipeline: at most 1 + max-attempts proposals, numbered 1..3 and
    never repeated, a repair carrying the previous attempt's bounded diagnostics, only an ok:false
    verdict spending an attempt) and exactly what it does not (nothing about a real model, nothing
    about repair improving an artifact, nothing about R2D2 accepting this shape). Two details make
    the scoping more than a disclaimer. The /v1/validate half of every count is measured on the wire
    through WireMock, so that number is not a stub's self-report; and the validator script is a
    WireMock *scenario*, so a fourth call receives no stubbed answer rather than silently reusing
    the third. The unprovable half is AC-10b, gated on ED-01 and owned by 10.19, and it is recorded
    unticked. A CONCERNS item here would be a complaint about ED-01, not about this story.

ac23_checkbox:
  question: 'Was leaving AC-23 unticked right, or does the AC need @po?'
  answer: BOTH — THE CALL WAS RIGHT AND THE CRITERION NOW NEEDS @po
  detail: >-
    Leaving it unticked is endorsed. `./gradlew check` is not green from clean and this reviewer
    reproduced that independently; ticking the box would assert something false, and the story says
    so in the same breath as its numbers rather than in a footnote. Every other clause of AC-23 is
    satisfied and was verified here: Testcontainers ITs cover the migration (two-stage), the sweep
    and the confirmation transaction; every concurrency case holds a transaction open and
    interleaves with latches rather than calling sequentially; four falsifications were required and
    eleven were recorded, six re-run here; AC-10b and AC-15b are recorded skipped rather than
    passed. But the criterion as written is unsatisfiable on this branch for a reason no story in
    this epic owns, and a criterion that no correct implementation can meet stops being a gate. The
    recommendation to @po is to amend the first clause for the rest of Epic 10 — "green apart from
    the enumerated ED-02 set, with zero new failures and zero failures in the story's own packages"
    — which is the property every gate in this epic has actually been measuring.

