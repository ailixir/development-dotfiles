top_issues:
  - id: SCAN-1
    severity: medium
    finding: >-
      The two structural guards that forbid an auto-confirm path match the *receiver's variable
      name*, not the type or the call. NoAutoConfirmTest.theConfirmTransitionHasExactlyOneProduction
      Caller and RepairLoopTest.noClassOnTheCompilePathReferencesTheConfirmTransition both scan for
      the literals `compileStateService.confirm(` and `states.confirm(`. Their non-vacuity guards
      assert that `public UUID confirm(` exists in CompileStateService — which pins the *method*
      name and reads reassuringly — but nothing pins the receiver names the scans depend on. This
      reviewer added a production @Component to com.citi.put.checks.studio.compile holding a
      `CompileStateService stateService` field and calling `stateService.confirm(..., "system")`,
      i.e. a production auto-confirmation with no authenticated principal in the package the second
      scan exists to police, and both tests stayed green. No such caller exists today — that was
      verified by reading the package as well as by the scans' correct result on today's source — so
      this is not a behavioural defect. It is a guard that cannot fail for the class of change it
      was written to catch, which is what AC-21 says it is for ("the failure mode is a *new* one
      that no behavioural test can anticipate"). Ninth of its kind in this epic, and a new shape:
      *a structural scan keyed to a variable name, with a non-vacuity guard that only proves the
      method name exists.*
    suggested_action: >-
      Match the call rather than the spelling of the field. Scan for `\.confirm\s*\(` in any file
      that declares or receives a CompileStateService, or resolve callers by type. One line in each
      test; the exclusion list (CompileStateService itself, and StudioService as the one legitimate
      caller) stays as it is. Owner: @dev, in a follow-up — not blocking, because the property is
      true today.
  - id: BUILD-1
    severity: medium
    finding: >-
      `./gradlew check` is not green, so AC-23 is unmet as written. All 23 failures are the ED-02
      auth/BFF/rate-limit baseline, reproduced here name for name, none of them in a package this
      story touches and none of them created by it — the filter that causes them is not in the diff.
    suggested_action: >-
      None for this story. The criterion, not the implementation, is what needs changing; see
      ac23_checkbox. Do not let AC-23 be ticked to close the bookkeeping.
  - id: AUTH-1
    severity: low
    finding: >-
      With the ED-02 bypass turned off, neither the held test nor its live sibling behaves the way
      their javadoc predicts. The sibling goes red — which is the property that matters and the
      reason the holder cannot be forgotten — but it fails with
      `ResourceAccessException: cannot retry due to server authentication, in streaming mode` rather
      than by observing a 401. Enabling anIdentitylessCallerIsUnauthorized under the same condition
      fails identically. The RestTemplate this test class uses cannot follow a real authentication
      challenge in streaming mode, so whoever lands ED-02 will need a client-side fix in both tests
      before either can assert what it says it asserts.
    suggested_action: >-
      Note it on ED-02 rather than fixing it here — the fix belongs with the story that removes the
      bypass, and the alarm already sounds. A line in the sibling's javadoc saying the red may
      arrive as a transport error would save the next reader ten minutes.
  - id: COV-1
    severity: low
    finding: >-
      No package-level jacoco rule was added for com.citi.put.checks.studio.compile, this story's
      principal new surface. Story 10.5 (AC-15) added one for .compile.gateway at 0.80 and story
      10.7 (AC-40) added four more at 0.75 precisely so "the new surface cannot hide inside the
      bundle figure". The repair loop, the sweep and the confirmation transaction are covered only
      by the global 70% rule. The measured figure is 90.6%, so the bar is met in fact; it is simply
      not enforced, and a regression there would have to drag the whole repository below 70% before
      anything failed.
    suggested_action: >-
      Add one rule for com.citi.put.checks.studio.compile at 0.80, matching the gateway precedent.
      Not blocking and not required by AC-23, which asks for thresholds met rather than thresholds
      added.
  - id: SCOPE-1
    severity: low
    finding: >-
      AC-7 says each of the seven §4.2 execution-affecting fields "is driven by its own perturbation
      and each must advance configurationRevision", with target policy named as the one unreachable
      case. In fact there are two. Browser is also not perturbable: since 10.1 the only legal engine
      is chromium, enforced by a CHECK constraint and the controller boundary, so a browser change
      is a rejected request rather than a configuration revision. The story handles this honestly —
      theOnlyLegalBrowserIsTheCanonicalOneSoABrowserChangeIsARefusalRatherThanARevision states it in
      its name, asserts CANONICAL_BROWSER is chromium and asserts that resubmitting it advances
      nothing — so the substance of AC-7 is upheld more strongly than by a revision bump. But it is
      a second reachability limit that the criterion does not declare, and @po ruled only one.
    suggested_action: >-
      @po to record browser alongside target policy as a stated non-perturbation in AC-7, or to
      accept the test's own statement of it. No code change.

required_before_merge: []

recommended_not_blocking:
  - SCAN-1 — make the two auto-confirm scans match the call, not the field name. This is the one
    finding that would change a future review's verdict if left.
  - COV-1 — a package rule for studio.compile at 0.80.
  - AUTH-1 — a line of javadoc, and a note carried to ED-02's owner.
  - SCOPE-1 — @po to declare browser as AC-7's second non-perturbation.

do_not_do:
  - Do not tick AC-23. Its "green from clean" clause is false and the right repair is @po's, not
    another build.
  - Do not re-anchor studio-runner/test/run/confinement.test.ts here. The SHA break is FOC-04,
    it is expected, and 10.13 re-anchors under its own T-10.13.10.
  - Do not add a status term to any publish guard to help the sweep. Clearing compile_request_id is
    what makes the existing guard do the work, and the falsification for it is red under this
    reviewer's own hand.
  - Do not multiply 409 conflict codes for the exactness failures. @po ruled one code on ADR-002
    §14.3's remedy axis and the route's produced set is asserted equal to x-conflict-codes in both
    directions.
  - Do not "fix" the ED-02 failures inside an Epic 10 story.

final_decision:
  gate: CONCERNS
  merge: SAFE
  rationale: >-
    Every claim this story makes about its own surface was reproduced by executing it. The four
    exactness terms, the write-once guard, the sweep's age predicate and request-identity clear, the
    repair arithmetic and the batch bound are all falsifiable and were falsified here; the
    confirmation route answers the frozen contract's codes and nothing else; the migration is proven
    two-stage against a seeded database; the contract edit is one line and the runner tree is
    untouched. What remains is a guard that cannot fail for the change it polices (SCAN-1, a new
    shape, not a live defect), a criterion that no implementation can meet while ED-02 is open
    (BUILD-1, correctly left unticked), and three low-severity notes. None of them is a reason to
    hold the story, and two of them are @po's rather than @dev's.
