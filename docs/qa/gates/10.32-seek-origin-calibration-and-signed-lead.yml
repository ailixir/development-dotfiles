status_reason: >-
  Every guard AC is falsifiable and every falsification reproduces. Six of the developer's rows were
  re-run by this reviewer (M3, M4, M5, M7, M8, M10) and all six reddened with the predicted tests;
  M7 reddened through real Chromium ("expected 5 to be +0"), which also proves the ready echo is
  live end to end. The F-7 text-read constraint this story had to obey still holds and still fails
  loudly: outside comments `MEDIAN_TOLERANCE_MS` occurs exactly twice, the assertion occurs once,
  the block-comment count is identical to the base (6/6), and S7 applied to the real file, the name
  interpolated into the new message, a `/*` inside the new message and a trailing space on the
  declaration each stop `webm.test.ts` from loading with the expected message. The declaration and
  `OUTLIER_BOUND_MS` line hashes are byte-identical to the base. Tiers reproduce: 984/29 twice,
  90/10 twice, 184 passed / 4 AC-18 EXPECTED RED, lint clean, one pre-existing type error.
  CONCERNS rather than PASS for two reasons, neither a defect in the code: (1) the `ready`-echo
  design is sound and leak-free but it is an unratified scope extension touching five files, not the
  one the Dev Agent Record enumerates, and @po has not ruled; (2) the `_helpers.tpl` line cannot be
  merged from either side's gate, and the merged key-count comment must read "thirty-six", which
  neither side currently writes. Both are pre-merge actions, not rework.

