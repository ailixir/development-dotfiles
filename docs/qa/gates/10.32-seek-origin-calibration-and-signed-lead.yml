ready_echo_ruling:
  question: >-
    Is the child's `ready` echo sound; can a child report a value it did not apply; is it validated
    on the parent; does it reach any report or API payload?
  ruling: SOUND, with one documentation inaccuracy and one unratified scope extension.
  can_a_child_report_what_it_did_not_apply:
    answer: >-
      The echo is the value `takeRunOrigin` received, not an independent measurement of the shift, so
      it is honest exactly when `takeRunOrigin` is correct — and that is pinned at the unit tier.
      Three mutations were written to make the echo lie; all three are caught:
    probes:
      - 'E1: `RunOrigin` echoes 0 while applying N → 2 red (timeline property (2), childRuntime).'
      - 'E2: the child drops the argument but echoes the received value → childRuntime red, "expected 300 to be 250" (the reading, not the echo, is what catches it).'
      - 'E3: the child echoes a literal 0 → childRuntime red.'
    residual: >-
      At the pinned value of 0 the fixtures-tier assertion alone cannot distinguish "applied 0" from
      "echoed 0 regardless" — E3 is caught by the unit test, not by the real run. That is acceptable:
      the two tiers together close it, and property (1) makes 0 byte-identical to uncalibrated anyway.
  parent_validation:
    answer: >-
      Shape-checked only: `parseChildMessage` accepts the `ready` message when `calibrationOffsetMs`
      is absent or `typeof === 'number'`. The parent never compares the echo to the value it sent, so
      a divergent-but-numeric echo is carried silently onto `SessionOrigin`. Harmless today (nothing
      but the fixtures harness reads it), and noted as ECHO-1.
  does_it_leave_the_process:
    answer: NO — verified at runtime, not inferred.
    evidence: >-
      A throwaway coordinator test (created and deleted in one command) drove a real run through the
      harness with `origin.calibrationOffsetMs = 7314159265` and scanned every outbound HTTP request
      body, every log sink line and every run event. Control case first: a marker planted in a step
      failure message IS found by the same scanner, so the scan is not blind. With the marker only in
      the origin, neither the number nor the string "calibration" appears anywhere. Reading agrees:
      `runCoordinator.asSessionOrigin` copies three named fields, `reporter.browserStarted` reads only
      `browserStartedAt` and `startedAtMs`, and the runner exposes no GET route that serializes a
      session. ADR-002 §26.3 item 2's "never on the wire" holds — the developer inferred this; it is
      now measured.

