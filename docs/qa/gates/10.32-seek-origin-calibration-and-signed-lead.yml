findings:
  SCOPE-1:
    severity: medium
    title: The `ready` echo is an unratified scope extension across five files, not one.
    detail: >-
      The Dev Agent Record escalates `src/server/adapters.ts` and names three files as out of scope.
      The echo mechanism actually touches five: `childRuntime.ts` (sends it), `protocol.ts`
      (`ReadyMessage.calibrationOffsetMs` plus its parse check — the Scope bullet for that file lists
      only `LaunchMessage`, `ACCEPTED_LAUNCH_KEYS`, `parseLaunchMessage`, `isNonNegativeNumber`),
      `launcher.ts` (`ReadyOutcome`, the inbox mapping, the session origin — the Scope bullet lists
      only the options field and the launch message), `adapters.ts` (escalated) and `realRunner.ts`.
      The design is sound and nothing leaks, so this is a Scope-list ruling, not rework.
    action: '@po ratifies AC-4 and the Scope list, naming all five files, before merge.'
  ECHO-1:
    severity: low
    title: The parent shape-checks the echo but never compares it to the value it sent, and a mistyped echo costs the launch.
    detail: >-
      `parseChildMessage` accepts any number, including a negative one, and drops the whole `ready`
      message when the field is present but not a number — which on the production path is a launch
      that times out. `ReadyMessage`'s own JSDoc says the field is "optional so a parent never
      refuses a start over it", and that is true only for an absent field, not a malformed one.
      No impact today: nothing but the fixtures harness reads the value, and the child that sends it
      is the runner's own.
    action: 'Correct the JSDoc, or have the parent ignore a malformed echo rather than dropping the message. Not a merge blocker.'
  DOC-1:
    severity: low
    title: '"Tightening further would start to bet against the detector" survives outside AC-8.4''s permitted ranges.'
    detail: >-
      The developer flagged this. The sentence sits in the outlier-bound paragraph (now ~:88), which
      AC-8.4 forbids editing, so §26.5's "name the slack, not the detector" fact is stated in the
      :72-75 block only. The two paragraphs now describe the same phenomenon with different causes
      one screen apart.
    action: '@po decides whether to widen AC-8.4 by one paragraph in a follow-up. Do not widen it inside this story.'
  CFG-1:
    severity: low
    title: The calibration key has no upper bound, and the chart renders any value.
    detail: >-
      `KeySpec` has `min` but no `max`, for every key — so this matches house style rather than
      departing from it. The chart validates key names only: `--set-string ...=-50` and `...=90` both
      render. The loader is the fail-closed layer and does refuse "-50" by name. But a mistaken
      99999999999999999999 is accepted by both the loader and `parseLaunchMessage`, and would make
      every reading hugely negative.
    action: 'Feed to ESC-3 as evidence: whatever @architect rules about negative readings should also say whether the key needs a sane ceiling. No change in this story.'
  MERGE-1:
    severity: medium
    title: The `_helpers.tpl` key line cannot be merged from either side's gate, and the merged count comment must read "thirty-six".
    detail: >-
      Measured, read-only, in wt/epic at review time. Base: 27 chart entries, 31 loader keys, comment
      "thirty-one". This story: 28 entries, 32 loader keys, comment "thirty-two" — correct for this
      branch. The inference tree: 31 entries (base plus 4 OBJECT_STORE_*), 35 loader keys, comment
      still "thirty-one" — already stale on that side. After both land the line must carry 32 entries
      (27 + 4 + 1) and the loader will hold 36 keys, so the comment must read "thirty-six". Neither
      side's gate can observe this, because neither tree contains both changes.
    action: >-
      Whoever lands second re-reads the merged line, keeps all five additions (FOC-07), and sets the
      count comment to the number of KEY_SPECS rows in the merged `config.ts`, counted after merging
      rather than copied from either branch. Re-run `npm run test:deployment` after the merge.

