observations:
  seek_margin: >-
    In this reviewer's fixtures run 1, inner run 1, one step was mis-attributed at +615.5 ms
    (reported 2264.5 ms matched to a change at 2880.0 ms) and the median |error| was 97.5 ms against
    the 100 ms bound — 2.5 ms of margin, at load 27. The other three inner runs were 65.1, 60.5 and
    57.9 ms. This is not a regression and not this story's doing; it is exactly the §26.3 item 6
    situation the calibration exists for, and it is the first recorded margin that small. Feed it to
    SPK-06 phase B. It also means a future red here is plausible on a loaded host — and, with AC-7
    landed, that red will now print the true negative leads instead of a fictitious +615 ms.
  measured_medians: >-
    Run 1: inner 1 median |error| 97.5 ms (steps -1.6, -85.8, -97.5, +615.5, -99.7); inner 2
    31.4 ms (-1.2, -57.5, -31.4, -65.1, -24.6). Run 2: inner 1 60.5 ms (-1.9, -61.4, -65.1, -60.5,
