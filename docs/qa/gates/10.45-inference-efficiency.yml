status_reason: >-
  Iteration 1 (commit 4d127fc52): ISSUE-1, ISSUE-4 and ISSUE-5 are resolved, each with a test or a
  written definition, and the compile package is green in the reviewer's run (348 tests, 0 failures).
  The verdict stays CONCERNS for two reasons. ISSUE-2 (harness before live, medium) is still open and
  is carried forward by agreement. The new ISSUE-6 is a required one-line fix: the static prefix
  pinned as 2.2.0 still names itself "prompt version 2.1.0". See iteration_1 below. The text that
  follows is the initial review.
  Initial review: All ten acceptance criteria are implemented and each has a test that would turn red if its
  behaviour regressed (mutation reasoning per AC below; no source was mutated, because this review
  is read-only). The studio compile package is green in the reviewer's own run. Four things keep
  this off PASS. (1) The global context is sent once, but as a sibling key of step 0's envelope.
  Before this story it sat inside `untrustedContext`. Now it has no untrusted label of its own and no
  statement that it applies to every step. The spec lays it out as its own part (a), ahead of the
  steps. (2) AC-11.2 says the 10.26 harness must cover the change "before enablement". This story
  has no flag, so merging and deploying it is the enablement. (3) `compilationFingerprint` has no
  production caller, so for now the thinking level reaches the fingerprint only in unit tests.
  (4) Redaction of the rejected proposal reuses detection regexes, which catch the shape of a
  credential but may not cover all of it. None of these is a defect in shipped behaviour that a
  test shows to be wrong, so the verdict is CONCERNS, not FAIL.

