# ─────────────────────────────────────────────────────────────────────────────
# Cross-replica re-falsification, performed by the reviewer
# ─────────────────────────────────────────────────────────────────────────────
cross_replica_refalsification:
  what_was_neutralised: >-
    A per-context in-memory publication path with no database route. A temporary
    ProgressReportService.ReportCommitHook bean recorded each applied execution id in an instance
    (never static) set, and SnapshotBroadcaster.deliver was changed to treat a changed revision as
    unchanged unless that id had been published locally. Authorization refresh, lifetime and
    heartbeat paths were left intact deliberately, so the only property removed is cross-pod
    visibility of a revision change — nothing else.
  cross_replica_result: RED
  same_pod_result: GREEN
  detail: >-
    aCallbackCommittedOnReplicaAReachesASubscriberOnReplicaB FAILED under the neutralisation while
    theTwoContextsAreGenuinelyDistinctAndShareOnlyTheDatabase still passed, and all twelve
    SseStreamingIT tests passed unchanged — including the revocation, lifetime, heartbeat and
    Last-Event-ID cases. That is the discrimination @po required: the in-memory design fails this
    test and only this test.
  neutralisation_that_stayed_green: none found
  structural_corroboration: >-
    SseCrossReplicaIT is @SpringBootTest with the default MOCK web environment, so context A
    serves no HTTP at all. The subscription therefore cannot be opened against anything but
    replica B's own port, and the mechanism connecting the callback on A to the subscriber on B
    cannot be anything but committed rows. SnapshotBroadcaster contains no publish entry point;
    WatchedExecutionRegistry is package-local and nothing writes into it from outside the package.
  restored:
    file: backend/src/main/java/com/citi/put/checks/studio/sse/SnapshotBroadcaster.java
    sha256_before_and_after: 368f69e0864246f7495b3926cfdc4edc0f2fd5b6d19b4424ea92d7aef40fcdd3
    temporary_files_removed: true
    git_status: clean

# ─────────────────────────────────────────────────────────────────────────────
# Security — attacks against /internal/**, executed
# ─────────────────────────────────────────────────────────────────────────────
security_attacks:
  method: >-
    A throwaway integration test opened a raw socket to the running application and wrote each
    request line verbatim, so no HTTP client normalised the path before Tomcat saw it. The service
    token was set to a known value so a control could be compared against the attacks. The test
    file was deleted afterwards and the tree verified clean.
  results:
    - attack: POST /internal/.../admission with no credential
      status: 401
    - attack: the same with forged X-User-Id / X-User-Email / X-User-Roles ADMIN,SUPER_ADMIN / X-User-Csi-Ownership
      status: 401
      note: the platform identity path grants nothing on the internal chain
    - attack: Authorization Bearer wrong-token
      status: 403
    - attack: lowercase 'bearer' scheme with the correct token
      status: 401
    - attack: control, Authorization Bearer <correct token>
      status: 409
      note: reached the handler — ATTEMPT_SUPERSEDED — which is what makes the refusals meaningful
    - attack: POST /api/v1/studio/internal/studio/... (through the public prefix)
      status: 404
    - attack: leading double slash //internal/...
      status: 400
    - attack: inner double slash /internal//studio/...
      status: 400
    - attack: dot-segment /x/../internal/...
      status: 400
    - attack: encoded dot-segment /x/%2e%2e/internal/...
      status: 400
    - attack: uppercase /INTERNAL/...
      status: 404
    - attack: trailing slash /internal/.../admission/
      status: 401
    - attack: matrix parameter /internal/.../admission;a=b
      status: 400
    - attack: percent-encoded initial letter /%69nternal/...
      status: 401
      note: the security matcher matches the decoded path — encoding is not a way around the chain
    - attack: trailing %20
      status: 401
    - attack: POST /internal/.../progress with no credential
      status: 401
  verdict: >-
    No attack reached the handler. Nothing answered 2xx and nothing but the control answered 409.
  defence_in_depth_confirmed: >-
    StudioInternalSecurityConfig declares its own @Order(1) chain on securityMatcher("/internal/**")
    requiring ROLE_STUDIO_RUNNER_CALLBACK, and SecurityConfig adds requestMatchers("/internal/**")
    .denyAll() ahead of its permissive tail, so removing or narrowing the ordered chain closes the
    route rather than opening it. ServiceIdentityAuthenticationFilter compares through
    MessageDigest.isEqual, fails closed when no token is configured, reads only the Authorization
    header, and its rejection body carries a code and no execution detail. Both it and the body
    limit filter are registered with setEnabled(false) so Spring Boot's automatic /* mapping does
    not put the service-identity check in front of the public surface.
  existence_disclosure: >-
    Closed. StudioService answers StudioAccessDeniedException for both "you may not" and "it is not
    there" — canRead/canExecute failures and findById misses reach the same handler, which
    ChecksExceptionHandler renders 403 with one code. SseStreamingIT asserts the events route and
    the GET snapshot route return the same 403 for a stranger, and 403 for a random execution id.

# ─────────────────────────────────────────────────────────────────────────────
# Developer claims checked one by one
# ─────────────────────────────────────────────────────────────────────────────
developer_claims_verified:
  failure_arithmetic:
    claim: 24 failures = the identical 23 ED-02 plus one deliberate escalation
    verdict: CONFIRMED
    detail: >-
      Reproduced exactly in two of three full runs, class by class and count by count. None of the
      23 ED-02 classes is touched by this story's file list.
  ac_38_concurrency:
    claim: quiet and loaded measurements in one run, not a sequential smoke test
    verdict: CONFIRMED
    detail: >-
      ordinaryRestTrafficContinuesWhileEveryStudioBoundIsUnderPressure measures 40 ordinary
      /api/v1/checks requests quiet, then fills the pending quota to refusal, opens the pod's full
      stream budget with four consumers that never read their sockets, starts two CompletableFuture
      loops saturating the dispatcher and delivering callbacks, and measures the same 40 requests
      while those loops are still running — the loops are stopped only after the second
      measurement returns. Budget asserted as zero errors and mean inside
      max(4 x baseline, 250 ms). The bounds are compressed by @SpringBootTest properties so the
      pressure is reachable, which is stated in the test's own header.
  ac_39_falsifications:
    claim: six interleaves, six falsifications, three of them needing every guard removed
    verdict: CONFIRMED_AS_HONEST
    detail: >-
      The interleaves are real: AcceptanceIT, DispatcherIT and AdmissionCasIT hold an acceptance or
      CAS transaction open across a second actor running in a second application context against
      the same database, gated on CountDownLatches; RecoveryIT runs the report-versus-reaper race
      in both orders with the transaction held open each way. The reviewer reproduced the sixth
      falsification independently (above). The admission that three recovery falsifications were
      green on a single-guard neutralisation is honest redundancy rather than a weak test: AC-29's
      rule is guarded both by findReclaimable not selecting DISPATCHING and by releaseClaim's own
      attempt_id IS NULL predicate, and defence in depth is the design. Recording the first green
      result rather than quietly re-running is the right disclosure.
  sse_content_type:
    claim: a 403 and a 429 reached with Accept text/event-stream rendered as 500; both fixed
    verdict: CONFIRMED
    detail: >-
      handleStudioAccessDenied and handleStreamLimit now set contentType(APPLICATION_JSON)
      explicitly, and the events mapping declares no produces. AC-37a bites as a result:
      anUnauthorizedOrForbiddenEventsRequestAnswersAsTheGetSnapshotRouteWould asserts the stream's
      status equals the GET route's and equals 403, with SseTestClient sending
      Accept text/event-stream. It passes in the full suite.
  no_calibration:
    claim: at = browserStartedAt + atMs, 0 is a position, rounding only at persistence
    verdict: CONFIRMED
    detail: >-
      RunnerReportProjection derives at as origin.plusMillis(Math.round(entry.atMs())) and from
      nothing else; every optionality test is an explicit != null so 0.0 survives; round() is
      applied once, at persistence, and returns null for null. A report with browserStartedAt null
      that carries any step or log reading is rejected as INVALID_REPORT rather than partially
      derived. No re-basing against a first or lowest reading appears anywhere in the class.
  ac_5_not_closed:
    claim: the production auth bypass is neither removed nor relied upon
    verdict: CONFIRMED
    detail: >-
      BffSessionAuthenticationFilter.isCoreServiceBypassed() still returns a hardcoded true and the
      file is untouched by this story — the only addition under security/ is the new
      ServiceIdentityAuthenticationFilter. applyTemporaryCsiReadBypass is scoped to GET /api/v1/csi
      and /api/v1/csi/** only, so it cannot widen roles on any Studio route. The attack matrix
      confirms the bypass grants nothing on /internal/**.
  adr_002_divergence:
    claim: the ExecutionErrorCode widening is Class C and is left red
    verdict: CONFIRMED
    detail: >-
      openapi.yaml still enumerates TIMEOUT, DISPATCH_FAILED, DISPATCH_UNKNOWN, START_TIMEOUT,
      STALE, DISPATCH_DISABLED and null. The escalation test fails and its message names what an
      architect is being asked for. No workaround was found: the enum is not widened, the test is
      not disabled, excluded or annotated, and ExecutionErrorCode.java carries both ratified values.
  contract_edits_authorised:
    claim: only ADR-002 O-4's amendment was made
    verdict: CONFIRMED_WITH_A_GAP
    detail: >-
      The openapi.yaml diff is exactly O-4's scope — AdmissionResponse closed with
      additionalProperties false and every field named, a new closed ProgressAck for the progress
      route's previously content-less 200, the duplicate-delivery 200 documented, and the two
      internal x-not-yet-implemented markers plus streamExecution's removed. ADR-002 §9 assigns
      O-4 to story 10.7 by name, so the amendment is architect-authorised. The three remaining
      x-not-yet-implemented markers belong to 10.8, 10.9 and 10.16. Both copies of
      artifact.schema.json are byte-unchanged. The gap is §12's third binding rule — see QA-2.
  build_change_is_not_a_hiding_place:
    claim: SseCrossReplicaIT moved to its own forked task, not weakened
    verdict: CONFIRMED
    detail: >-
      The test file is new in this story and contains two real assertions, both of which pass in
      the isolated task. check --dry-run shows :crossReplicaTest in the graph, so the class is
      still gated. The task sets forkEvery = 1 and clears the configureEach exclude; running it
      confirms it executes exactly that class.

