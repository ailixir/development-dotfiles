# ─────────────────────────────────────────────────────────────────────────────
# Findings
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: QA-1
    severity: medium
    title: A new test asserts an empty global dispatch queue and is therefore order-dependent
    ac: AC-14 / AC-39
    owner: '@dev'
    blocking: false
    finding: >-
      DispatcherIT.asecondDispatchPassDoesNotPickUpADispatchingRow asserts dispatcher.dispatchOnce()
      returns 0, but dispatchOnce() is deployment-global by design while DispatcherIT.setUp clears
      only its own CSI's ledger rows. Every Studio IT shares one Postgres container, and
      StudioOverloadIT deliberately leaves queued rows behind under a different CSI. In the
      reviewer's first full run the assertion failed with "expected 0 but was 20"; in runs 2 and 3
      the class ordering differed and it passed. The property under test is sound and the
      production behaviour is correct — the test's assumption about the rest of the database is
      not. Scoping the assertion to the ledger rows of this test's own CSI would fix it without
      weakening it.
  - id: QA-2
    severity: medium
    title: ADR-002 §13 carries no entry for the amendment this story landed
    ac: AC-1
    owner: '@dev / @architect'
    blocking: false
    finding: >-
      ADR-002 §12's third binding rule is "every amendment is recorded", and it specifies what the
      entry must name — the divergence, the source it traces to, the consuming stories re-checked,
      and the contract-test result before and after. openapi.yaml was amended under O-4 and §13's
      last row is still the §11 clock amendment; O-4 is also not struck through in §9. The edit
      itself is authorised, so this is a bookkeeping omission rather than an unauthorised change,
      but §13 is the mechanism that makes "frozen means changes are recorded" true, and the next
      story to read O-4 will find it open.
  - id: QA-3
    severity: medium
    title: One cached application context died mid-suite and took fifteen tests with it
    ac: AC-40
    owner: '@dev'
    blocking: false
    finding: >-
      In the reviewer's first full run, StudioApiIT (7), StudioCsiScopingIT (6) and
      StudioContractTest (2) all failed with "Unexpected end of file from server" against one
      port, 50713 — one dead embedded server, not fifteen defects. The Change Log credits
      TC_DAEMON=true with fixing exactly this class of failure, but TC_DAEMON appears nowhere:
      application-test.yml's URL is a plain jdbc:tc:postgresql:15-alpine:///checks and what
      actually landed is spring.test.context.cache.maxSize = 64 in build.gradle.kts. The run
      recovered in runs 2 and 3, so the mitigation mostly works, but the story's own account of
      the fix does not match the fix, and a gate that fails one run in three is a gate people
      learn to re-run.
  - id: QA-4
    severity: low
    title: The migration test's seeded states do not span every branch of V13's partial indexes
    ac: AC-2
    owner: '@dev'
    blocking: false
    finding: >-
      LedgerStateMachineMigrationIT seeds QUEUED, DONE and ADMITTED. That covers the CHECK adoption
      and both sides of the two "state <> 'DONE'" predicates, but CLAIMED and DISPATCHING — the
      other two members of idx_studio_dispatch_ledger_queued's IN list — carry no row, and
      v13PartialIndexesStillMatchTheVocabularyTheyWereWrittenFor asserts on the text of indexdef
      rather than on data. The story's own justification is that only QUEUED and DONE were ever
      produced by a pre-10.7 writer, which is correct, so nothing is unproven that could have been
      proven — but the index assertion is textual and should not be read as a data assertion.
  - id: QA-5
    severity: low
    title: A dead local in the overload test's stalled-consumer helper
    ac: AC-38
    owner: '@dev'
    blocking: false
    finding: >-
      StudioOverloadIT.openAndNeverRead builds an HttpRequest into a local named request and then
      builds a second one, withIdentity, which is the one actually sent. The first is never used.
      Harmless — the sent request does carry the identity headers — but it reads as though the
      unauthenticated variant were being sent.

