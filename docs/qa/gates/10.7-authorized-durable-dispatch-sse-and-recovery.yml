status_reason: >-
  All 40 non-deferred criteria are implemented and were verified by running commands rather than by
  reading the Dev Agent Record. Two of three independent full runs of ./gradlew test --continue
  reproduce the developer's arithmetic exactly — 580 tests, 24 failures, the identical 23 ED-02
  auth/BFF/rate-limit classes class-by-class and count-by-count, plus
  ExecutionErrorCodeContractEscalationTest, which is the single deliberate one. Zero Studio
  failures. The cross-replica proof was re-falsified independently and survives: making the
  broadcast source a per-context in-memory set that the callback publishes into, with no database
  path, turns aCallbackCommittedOnReplicaAReachesASubscriberOnReplicaB red while all twelve
  same-pod SseStreamingIT tests stay green — the exact discrimination AC-33 asks for, and no
  neutralisation was found that left it green. Sixteen attacks against /internal/**, sent as
  verbatim request lines over a raw socket so no client library normalised the path, were all
  refused; a forged platform identity buys nothing there and the control with a valid service
  token reached the handler. V15 is proven against a database holding rows by a genuine two-stage
  Flyway run. AC-38 measures ordinary REST latency quiet and then under simultaneous pressure in
  one test method, with the pressure threads running across the measurement — it is concurrent,
  not sequential. Three medium findings keep this off PASS, none of them a behaviour defect: one
  new test is order-dependent and did fail in the first full run, the ADR-002 §13 amendment log
  carries no entry for the openapi.yaml amendment this story landed, and one cached application
  context died mid-suite in that same run, taking fifteen tests with it.

