status_reason: >-
  The studio-inference program's slices guard, landed at 51ade0f1f and folded at ec94e9585/b22055dda,
  meets AC-1 to AC-5 when run. @qa wrote the red-first tests the story specifies. They were observed RED
  in a throwaway worktree with both guard hunks reverted: 20 failed / 15 passed across the two slice
  files and the page test. The page-level reproduction in that tree threw the exact PROD-1 crash strings,
  `Cannot read properties of undefined (reading 'find')` and `(reading 'length')`. The same tests are
  GREEN against HEAD. FOC-08 holds with no setup.ts edit: two full frontend runs gave
  `5 failed | 940 passed (945)`, which is exactly the five known pre-existing failures, with zero
  "did not settle" lines, and bootstrapIsolation.test.ts stayed green with zero edits. F-3 was verified
  with the squeeze instrument. On the reverted base (444a785d) it reads `1 failed | 5 passed (6)` 3/3.
  On the landed file (5bbb147e) under the same squeeze it reads `6 passed (6)` 3/3. The 20-run sweep was
  not used.

