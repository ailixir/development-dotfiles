acceptance_criteria:
  AC1: "PASS. Contract §1, §4 and §6 cover the FULL/PATCH envelope, its closed variants and the outcome table (with the VAL-019 amendment), plus the strict ValidateResponse. Runner artifact.version stays 1."
  AC2: "PASS. §2 covers server-allocated step UUIDs, the scope {policyVersion 1.0.0, UNKNOWN|STEP_SCOPED}, reaffirmation/revocation and the rule that unknown/stale/global/forward scope selects FULL."
  AC3: "PASS. §2 covers compileRequestId vs revisionId, the immutable authoring snapshot and hash, publication guards and V18 expand / V19 staged cutover (backend/db/cutover). §3 covers the baseline query."
  AC4: "PASS. §5 covers the shared CompileBudget (monotonic deadline plus cancellation), the 3 proposals / 3 transports per proposal / 9 total transports caps, maxOutputTokens and the repair interface."
  AC5: "PASS. Eval spec §2 defines the independent oracle and the M1-M7 controls, which must all be detected before any T3 score. §7 targets are labelled proposed pending Pax/Aria."

