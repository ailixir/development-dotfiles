issues:
  - id: ISSUE-1
    severity: medium
    category: requirements
    description: >-
      backend/src/main/java/com/citi/put/checks/studio/compile/incremental/CompilationPlanner.java:62-79
      returns LEGACY_MAPPING, FINGERPRINT_CHANGE or STRUCTURAL_CHANGE before INCREMENTAL_DISABLED
      while the incremental flag is off. Contract §3 makes INCREMENTAL_DISABLED the second applicable
      reason, right after EXPLICIT_FULL. The selected mode is FULL either way. Plan.reason (API) and the
      eval fallback telemetry differ from the contract. A grep of backend/src/test finds no test that
      asserts INCREMENTAL_DISABLED.
    recommendation: >-
      Story 10.24 owner: move the disabled-flag check ahead of the mapping, fingerprint and structural
      checks. Keep REUSE reachable while the flag is off, as §3 allows, and add planner tests. Alternatively,
      Aria records a contract amendment that adopts the implemented order.
  - id: ISSUE-2
    severity: low
    category: docs
    description: >-
      Contract §6 coordinates executor, syntax reference and prompt at 2.0.0. The code has executor
      2.1.0 (studio-runner/src/versions.ts:17), syntax 2.1.0 (versions.ts:29 = CompilePins.java:27)
      and prompt 2.3.0 (CompilePins.java:42). The only amendment in the contract is VAL-019.
    recommendation: "Aria: add a dated amendment listing the pin progression and its rationale, or reword §6 as the C0 baseline pins."
  - id: ISSUE-3
    severity: low
    category: docs
    description: >-
      The contract header says "New routes are explicitly unimplemented", and the C0 evidence paragraph
      says "53 OpenAPI references ... six operation IDs ... marked unimplemented". The OpenAPI now has
      48 refs and marks all six operations x-not-yet-implemented:false.
    recommendation: "Aria: label these statements as point-in-time 2026-09-16, or update them."
  - id: ISSUE-4
    severity: low
    category: requirements
    description: >-
      The Plan.reason enum includes GLOBAL_OR_FORWARD_SCOPE, but the scope declaration has only
      UNKNOWN and STEP_SCOPED, so no input can produce it. The backend never emits it; only a
      frontend label exists (InferenceStudio.tsx:18).
    recommendation: "Aria: mark it reserved for a future declaration kind, or remove it from the §3 vocabulary and the OpenAPI."

required_changes:
