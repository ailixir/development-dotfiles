status_reason: >-
  All five ACs are met by docs/architecture/studio-inference-contract-v1.md,
  docs/qa/studio-inference-evaluation-spec.md, docs/specs/studio/inference.openapi.yaml and
  docs/specs/studio/inference-proposal.schema.json. The machine-readable contracts pass the
  reviewer's own re-validation. A spot-check of 10.21-10.26 code found it consistent with the frozen
  contract, with one exception: the planner's reason precedence while the incremental flag is off
  (ISSUE-1, medium). The selected mode is still correct, so safety is not affected, but the API and
  telemetry report the wrong reason. Three low documentation-currency items remain. The
  verdict is CONCERNS, not FAIL, because no safety invariant is contradicted. This gate is not release readiness, live
  evidence or approval of the eval spec's §7 numerical targets.

