top_issues:
  - id: "REL-001"
    severity: medium
    finding: >-
      The attempt03 CONTEXT_LOST at the guided context push has no proven root cause: it was not reproduced in 2303 stress starts
      (runner/rel001-rootcause01/repro/results/verdict.md). Shipped: patch A (cause preserved, one value-free GUIDED_START_FAILED line
      naming the phase), patch B (versionProbe readiness wait), D4 (12 s start deadline; a separate, proven launch hang that does not
      explain attempt03). No recurrence in final-gates05, 06 or 07 (max elapsedMs 64, no TIMEOUT cause, none at 15 s or more).
      STUDIO-OBS-009 RUNNER-LAUNCH covers CONTEXT_LOST launch reliability from OBS-013/014 but does not name this occurrence.
    suggested_action: >-
      @po adds a pointer in 009 RUNNER-LAUNCH: a CONTEXT_LOST whose GUIDED_START_FAILED cause is not TIMEOUT is read as a REL-001
      recurrence, not accepted as noise. Not a Done blocker.
  - id: "REQ-001"
    severity: low
    finding: "Ledger row 85 clause (positive equal full-key timing tie observed end to end in an actual run) is a user waiver, Option C, 2026-10-15, recorded by @po. Retained conjuncts passed."
    suggested_action: "None. Reported as a waiver, never PASS or N/A."
  - id: "REQ-002"
    severity: low
    finding: "ED-05 remainder (internal Playwright image, non-root user, seccomp, CA bundle) stays with Platform/SRE. The Node pin sub-item is FIXED and proven in the image."
    suggested_action: "OBS-010 release readiness owns closure. @po drops the pending-re-verification marker on the six Node 22 doc rows."
  - id: "TEST-001"
    severity: low
    finding: "GuidedPublicationReplayIT is class-scoped and order-dependent; one failure reads as several and the two P7 tests cannot pass alone."
    suggested_action: "Test-hygiene debt for OBS-011 or OBS-009. Never accept single-test ReplayIT reruns as evidence."
  - id: "TEST-002"
    severity: low
    finding: >-
      The raw W11 mutation output (C-1 reverted turns 20 cases red) is scratch only and not archived, so QA could not re-read it.
      The hard-expiry race closure rests on the mechanism and the unit tests, not on the single fixtures pass in final-gates07.
    suggested_action: "Archive mutation outputs next time. No action for Done."
  - id: "MNT-001"
    severity: low
    finding: >-
      W10-6: if every kill marker is unusable (only possible with TMPDIR set to the root directory), killLaunchTree returns [] over a
      readable table and the teardown reports success. Also a private VariableReferenceValidator.isBlank(String) has no caller.
    suggested_action: "Next source window: treat zero usable markers as an unreadable table; delete the dead method. Moves the digest, so not before Done."
  - id: "MNT-002"
    severity: low
    finding: ".aiox-core/core/permissions/dispatch-governance.js (+20/-4) is an L1 edit in the working tree outside the 015 File List. QA did not review it."
    suggested_action: "@devops keeps it out of the 015 commit."
  - id: "DOC-001"
    severity: low
    finding: >-
      Aria's F4 note for R4 is not in docs/architecture/studio-inference-contract-v1.md (the diff shows only the superseded banner).
      Tasks T0 reconciliation, T1, T3, T4, T5, T6 and the three Quality Gates are unticked and Status is InProgress (Dex or root, not QA).
    suggested_action: "Aria appends the note where F4 lives now. Dex or root sets InReview and ticks only where the final-gates07 receipt is the evidence."

