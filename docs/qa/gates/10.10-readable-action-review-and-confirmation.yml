    gate: AC-15's @architect ruling (Class C, open)
    holder: blockedConfirm.test.tsx — four tests, nothing mocked
    verdict: >-
      CANNOT TURN GREEN WITHOUT ITS GATE MOVING. `readArtifactHash` has exactly one implementation
      and it returns `{ available: false }` for every fixture; the control is disabled and names the
      blocker with "AC-15" on screen; zero confirm requests are observed by the MSW handler on a
      direct `dispatchEvent`. A behavioural — not source-grep — test feeds a draft whose fields *look
