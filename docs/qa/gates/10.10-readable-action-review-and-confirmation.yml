  - id: PIN-1
    severity: low
    status: NEW IN ROUND 2 — LATENT, NOT A LIVE DEFECT
    finding: >-
      **The epic's twelfth vacuous-guard shape: a deliberate second copy whose independence is
      protected only by a comment.** `pinnedNarratives.ts` is the right fix for VAC-11 and its header
      says, correctly, that a future edit must not "remove the duplication" by importing
