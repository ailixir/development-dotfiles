auto_decisions_judged:
  - id: AD-1
    decision: >-
      `vi.mock` substitutes `readArtifactHash` in `confirmFlow.test.tsx` only; unmocked production
      behaviour asserted in `blockedConfirm.test.tsx`.
    verdict: SOUND — THE MOCK LEAVES A REAL ASSERTION BEHIND
    detail: >-
      The substitution replaces one accessor and nothing else. Everything AC-11(a) and AC-13 actually
      assert runs unmocked: the single held `GET` value, the four-field construction, the in-flight
      ref, the `409` branching, the enablement predicate. The assertions are on captured MSW request
      bodies and on `ConfirmCompileRequest.required` read from the document — and both of this
      reviewer's mutations in that file went red, which is the proof that the mock has not hollowed
      the file out. AC-10's behavioural five-state enumeration also runs *inside* the mocked graph
      and still finds `['AWAITING_CONFIRMATION']` alone, so the mock does not widen enablement
      either; its unmocked counterpart (control blocked everywhere) is the separate file. The
      rejected alternatives were correctly rejected: a permissive prop default is precisely AC-10's
      named hazard, and a fixture carrying `currentCandidateArtifactHash` would put an undeclared
      field in the corpus, which AC-20 forbids. No @po involvement needed.
  - id: AD-2
    decision: >-
      The confirm control is deliberately **not** disabled while a confirmation is in flight, because
      disabling it made `userEvent` refuse the second click and AC-13's measurement impossible.
    verdict: DEFENSIBLE OUTCOME, WRONG STATED REASON, AND THE SUBSTITUTE IS UNGUARDED — see AD2-1
    detail: >-
      The outcome is not harmful: the ref guard closes in the same synchronous turn, no second
      request leaves, and this reviewer reddened that by removing the guard with the handler still
      held open. But AC-13 says a `disabled` prop *proves nothing*, which is not the same as *must
      not be present* — a third option, `aria-disabled="true"` on a still-focusable button plus the
      ref guard, satisfies both the criterion and the affordance, and `userEvent` delivers clicks to
      `aria-disabled` elements. That option was not considered in the record. What makes this a gate
      item rather than a note is that the compensating feedback offered in its place — `aria-busy`
      and the "Sending your confirmation…" line — is asserted by **no test in the story**: deleting
      both leaves the suite entirely green. A product-visible behaviour was changed and the thing it
      was traded for has no guard. **This does need @po** (and @ux), because it is a product-visible
      decision taken for a test-harness reason; it does not need to block the merge.
  - id: AD-3
    decision: >-
