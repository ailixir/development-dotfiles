    verdict: CORRECT READING, AND THE PREDICATE ENFORCES IT
    detail: >-
      The only reading under which the criterion is satisfiable, and the matrix predicate re-checks
      both pre-clamp lengths against `DIAGNOSTICS_CAPS` and both post-clamp strings for exact cap
