# Round-1 findings, each stamped with its round-2 resolution.
top_issues:
  - id: VAC-11
    severity: medium
    resolution: >-
      **FIXED AND VERIFIED AGAINST ITS OWN PROBE (round 2).** The identical round-1 mutation — seven
      AC-2 facts blanked to `'x'` — now reddens seven named tests where it previously reddened none.
      The fifteen `(state, slot)` pairs are fifteen named cases reading per-fact `data-testid` slots;
      the expected text is a second copy in `pinnedNarratives.ts`; and `assertFactRendered` closes the
      `toContain('')` degenerate case with three guards, **all three of which this reviewer disabled
      in turn and all three of which fire**. Collapsing two slots reddens ten cases by name. Closed.
      **The eleventh vacuous-guard shape this epic has found: an assertion whose expected value is
      imported from the module under test.** AC-2's principal test is
      `it.each(DECLARED_STATES)('%s renders its three facts and its own name')`, and its body does
      `const narrative = narrativeFor(state)` — from `compileStateNarratives.ts`, the very module
      `CompileReviewPanel` renders from — then `expect(text).toContain(narrative.whatIsTrue)` and the
      same for `whatYouCanDo` and `whatIsBlocked`. That is true for any content the module happens to
      hold, including a single character, and `toContain('')` is vacuously true for an empty one. The
      four hand-written literal-regex tests rescue `AWAITING_CONFIRMATION`, `NEEDS_REVISION` and
      `STALE`, and `recompile.test.tsx` incidentally pins `COMPILING`'s *title* — but **eight of the
      fifteen facts AC-2's table requires are pinned by nothing**. Measured, not argued: replacing
      `COMPILING`'s three facts with `'x'` leaves the full suite at its usual `1 failed | 256 passed
      (257)`; replacing `READY`'s three and `NEEDS_REVISION`'s `whatIsTrue` with `'x'` leaves both
      studio directories at `1 failed | 185 passed (186)`. AC-2's table names specific obligations —
      `COMPILING` must say the draft is saved, that a compile is in flight for the source shown, and
      that nothing is confirmable yet; `READY` must say the confirmed revision is runnable — and none
      of the three `COMPILING` sentences, nor any of `READY`'s three, is asserted to say anything at
      all. This is exactly the risk @po named for a UI story (a substring assertion passing on text
      that is present and unreadable), in its purest form: the substring is imported from the thing
      being checked. It is not a live defect — the copy is careful and correct today, and it is some
      of the best writing in this epic — but AC-2 is ticked and has no row among AC-21's twenty-two,
