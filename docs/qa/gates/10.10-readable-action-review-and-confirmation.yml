recommended_not_blocking:
  - VAC-11 — pin AC-2's facts with literal assertions and add the rows to the falsification table.
    This is the one finding that would change a future review's verdict if left.
  - AD2-1 — assert the in-flight affordance, and put the aria-disabled question to @po/@ux.
  - ESC-1 — pin the specific field name when the AC-15 ruling lands; @po to narrow the ratified
    property to the tags it actually holds for, before 10.11 extends it.
  - ENV-1 — record on the epic that the dependency resolves in the main checkout, that a real missing
    skip link sits behind the resolution failure, and assign both alongside the malformed eslint
    config.
  - MATRIX-1, IMPORT-1 — small, whenever those files are next open.

do_not_do:
  - Do not "fix" `@put/core-components` resolution, `.eslintrc.json`, or the `ChecksLayout` skip link
    inside this story. None is @dev's and the baseline is the honest thing to preserve.
  - Do not make AC-15's escalation an `it.fails()` or an `it.skip()`. The developer's reasoning is
    right — an `it.fails()` is green today and red on the amendment, which inverts the escalation.
    Leave it red.
  - Do not widen the reachability rule further to make a future amendment pass. When the ruling lands,
    *narrow* it to the declared field name.
  - Do not tick AC-11(b), AC-16(b), AC-18(b) or AC-19(b), and do not claim the epic's first
    acceptance bullet. Author → save → review works; confirm does not, and the story says so.
  - Do not hand-widen the frontend error-code union for ADR-002 O-12. That is 10.11's, and its
    instruction is "generate or assert, not hand-widen".

final_decision:
  gate: CONCERNS
  merge: SAFE
  rationale: >-
    This is a careful story and most of it holds up under a hostile hand. The baseline was measured at
    the base commit rather than adopted from the document and matches to the digit; the after numbers
    match to the digit; the delta is +158 passing, +11 suites and one deliberate red. Eight
    falsifications were re-applied here across seven criteria and every one reddened exactly the named
    test, including both halves of AC-20 — the criterion @po promoted precisely because a vacuous
    AC-20 would silently defeat AC-7, and it is not vacuous. AC-15 is red for the right reason and was
    shown, not asserted, to go green on candidate A's amendment with no edit to itself. The four
    deferrals cannot arm themselves, and the story refuses the epic's first acceptance bullet in
    writing. No repository file was touched to get any of it running.
    What holds it at CONCERNS is one new vacuity shape and one unguarded product change. AC-2's
    per-state facts are asserted against the module they are rendered from, so eight of fifteen
    required sentences can be reduced to a single character with the suite green — the eleventh shape
    this epic has found, and the one @po predicted for a UI story. And the `aria-busy` plus
    "Sending your confirmation…" that the second [AUTO-DECISION] traded the disabled control for can
    be deleted without a red test, which makes a product-visible decision, taken for a test-harness
    reason, invisible to the suite. Both are guard defects rather than behavioural ones; neither is a
    reason to hold the story, and the second needs @po rather than @dev.
