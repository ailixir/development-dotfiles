status_reason: >-
  Every number this story reports about itself was reproduced by running it, at both ends. The
  baseline was measured — not transcribed, and not taken from the story — in a detached worktree at
  the epic base `50f770ed2` sharing this worktree's `node_modules`: `Test Files 1 failed | 9 passed
  (10); Tests 98 passed (98)`, type-check exit 2 with the same two `TS2307` errors at
  `ChecksLayout.tsx:6` and `navigationSetup.ts:1`, and `npm run lint` exit 2 having linted **zero
  files** because ESLint 8 cannot load the `.eslintrc.json` shorthand. After the story:
  `Test Files 2 failed | 19 passed (21); Tests 1 failed | 256 passed (257)`, the same two
  type-check errors, the same dead lint. **+158 passing, +11 suites, one new failure and it is the
  intended one.** The developer's whole gate table is reproduced to the digit.
  AC-15's escalation is red for the right reason and self-resolves for real. The recorded failure is
  exactly `confirmCompile.artifactHash` and nothing else, and this reviewer settled the property the
  developer's note only claims: adding `currentCandidateArtifactHash` to `TestDto` in the document —
  candidate A's shape — turns the file **3 passed (3)** with **no edit to the test**, and the
  document was restored byte-identically (SHA-256 cbf07c99…f412 both sides). The choice of a plain
  `it()` over `it.fails()` is correct and the reasoning behind it is correct: `it.fails()` is green
  today and red on the amendment, which is a tripwire, not an escalation.
  Eight mutations were re-applied here across seven criteria, each run against its named test, each
  restored and verified byte-identical by SHA-256, with `git status --short` empty afterwards. All
  eight were red on exactly the test the developer's table names — including **both halves of
  AC-20**, @po's promoted weakest criterion: reducing `FX-TRUNC-STEP` to a hand-set boolean on a
  short list reddens `FX-TRUNC-STEP resolves to a fixture that carries the property it exists for`,
  and adding a required shape nobody names reddens `FX-NOBODY-CONSUMES-ME is named by the title of
  at least one test`. AC-20 is not vacuous, and neither is the chain that hangs off it.
  What keeps this off PASS is an eleventh vacuous-guard shape, found by probe and not by reading.
  **AC-2's per-state fact assertions compare the rendered text against the same module the component
  renders from.** `it.each(DECLARED_STATES)` imports `narrativeFor(state)` from
  `compileStateNarratives.ts` and asserts `toContain(narrative.whatIsTrue)` — true for any content,
  including none. Replacing `COMPILING`'s three AC-2 facts with the single character `'x'` leaves
  **the entire suite green at its usual 1 failed / 256 passed**; replacing `READY`'s three and
  `NEEDS_REVISION`'s `whatIsTrue` likewise. Eight of AC-2's fifteen required facts cannot fail. The
  copy is excellent today and nothing would notice if it stopped being. AC-2 is ticked and has no row
  in AC-21's twenty-two.
  Two further mediums, both measured rather than argued. The `aria-busy` attribute and the "Sending
  your confirmation…" line the second [AUTO-DECISION] traded the disabled state for are asserted by
  **no test at all** — deleting both leaves the suite green. And the widened reachability rule,
  though uniformly applied and genuinely guarded, has an aperture wider than the answer it produced:
  adding `supersededRevisionArtifactHash` — the hash of a revision that is not the candidate — also
  turns the escalation green.
  One correction to the record that belongs to neither @dev nor this story. The
  `@put/core-components` failure is **not** a property of the repository: `file:../../put-core-
  components` resolves from the main checkout at `/Users/brunobuger/workspace/citi/put/put-checks/
  frontend` and its `node_modules` symlink is live there. It dangles only from a worktree under
  `orca/workspaces/put-checks/wt/`. And with the import resolved, `ChecksLayout.a11y` still fails —
  on a genuinely missing skip link. Both earlier accounts are true; the import failure masks the
  a11y defect behind it.

