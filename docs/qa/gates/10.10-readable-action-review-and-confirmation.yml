required_before_merge: []

recommended_not_blocking:
  - PIN-1 — one assertion forbidding `pinnedNarratives.ts` from importing `./compileStateNarratives`,
    added to the AC-16(a) scanner that already walks the directory and reads every specifier form.
    This is the one finding that would change a future review's verdict if left, and it is one line.
  - MATRIX-1 residue — the `400` step-index check is `/\d/`, which any incidental digit satisfies.
    Tighten to a step index or a declared bound whenever that file is next open.
  - Record the shared-scratchpad hazard in the epic's operating notes — two agents running mutation
    harnesses out of one directory are a way for a falsification result to be wrong without either
    noticing. Neither was bitten here — both checked — but that was the design of the harnesses, not
    luck that can be relied on twice.

open_and_not_this_story_s:
  - AD2-1, ESC-1 and ENV-1 — see `open_for_po`. None is @dev's, none blocks the merge, and none may
    close by silence.

do_not_do:
  - Do not "remove the duplication" in `pinnedNarratives.ts`. Deriving its phrases from
    `COMPILE_STATE_NARRATIVES` turns the pin back into a tautology and **no test notices** — measured
    in round 2. The header says so, and PIN-1 asks for a guard that says so too.
  - Do not delete the `state-fact-{slot}` testids to "tidy" the markup. Per-fact slots are what make
    a missing fact name itself; collapsing two reddens ten tests precisely because they exist.
  - Do not relax `MIN_PHRASE_LENGTH` or `MIN_RENDERED_FACT_LENGTH` to accommodate a short phrase.
    Those two guards are what keep blanking detectable even if the pin is ever compromised.
  - Do not "fix" `@put/core-components`, `.eslintrc.json`, or the `ChecksLayout` skip link inside this
    story. None is @dev's and the baseline is the honest thing to preserve.
  - Do not make AC-15's escalation an `it.fails()` or an `it.skip()`. Leave it red.
  - Do not widen the reachability rule further to make a future amendment pass. When the ruling lands,
    **narrow** it to the declared field name.
  - Do not tick AC-11(b), AC-16(b), AC-18(b) or AC-19(b), and do not claim the epic's first
    acceptance bullet. Author → save → review works; confirm does not, and the story says so.
  - Do not hand-widen the frontend error-code union for ADR-002 **O-12**. That is 10.11's, and its
    instruction is "generate or assert, not hand-widen".

final_decision:
  gate: PASS
  merge: SAFE
  rationale: >-
    Round 1 raised six findings. The three that were @dev's are fixed, and each fix was verified by
    mutation rather than by reading. **VAC-11 is closed against its own probe** — the identical
    mutation that left the whole suite green now reddens seven named tests, one per blanked fact —
    and the harness that makes those fifteen able to fail is itself falsifiable, with all three of its
    guards reddening the negative control when disabled in turn. **MATRIX-1's fix found a real fixture
    defect** and the correction is in the fixture, not in a loosened predicate: reverting only the
    message reddens that entry today. **IMPORT-1's planted-forms guard genuinely fails.** The +18 test
    delta is accounted in full by per-file arithmetic with no drift, the gate numbers reproduce to the
    digit, and AC-15 is still red on exactly one field.
    Two corrections belong in this record, one in each direction. This reviewer's MATRIX-1 note
    implied a discrepancy with the story over "25 fixture shapes"; there was none — AC-20 carries no
    count and 23 is correct — and that half is withdrawn. And @dev's "no test file references
    `narrativeFor` any more" is false: `studioContract.test.ts` retains three uses, all of which were
    read line by line and none of which asserts rendered content against the module, so the hole is
    closed and only the sentence is wrong.
    What remains open is not this story's. `AD2-1` and `ESC-1` were routed to @po by this reviewer in
    round 1 and @dev was told not to touch them — it did not, verifiably, and holding the gate for
    compliance with that instruction would be perverse. `ENV-1` is unowned environment, and @dev
    adopted both corrections to its own record without argument. The one new finding, `PIN-1`, is
    latent: it is the regression path back into VAC-11 rather than VAC-11 itself, the blanking case
    stays caught by guards independent of the pin, and the remedy is a single assertion in a scanner
    that already exists. **PASS**, with three items carried to @po that must not close by silence.
