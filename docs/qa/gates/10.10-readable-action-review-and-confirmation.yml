# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: VAC-11
    severity: medium
    finding: >-
      **The eleventh vacuous-guard shape this epic has found: an assertion whose expected value is
      imported from the module under test.** AC-2's principal test is
      `it.each(DECLARED_STATES)('%s renders its three facts and its own name')`, and its body does
      `const narrative = narrativeFor(state)` — from `compileStateNarratives.ts`, the very module
      `CompileReviewPanel` renders from — then `expect(text).toContain(narrative.whatIsTrue)` and the
      same for `whatYouCanDo` and `whatIsBlocked`. That is true for any content the module happens to
      hold, including a single character, and `toContain('')` is vacuously true for an empty one. The
      four hand-written literal-regex tests rescue `AWAITING_CONFIRMATION`, `NEEDS_REVISION` and
      `STALE`, and `recompile.test.tsx` incidentally pins `COMPILING`'s *title* — but **eight of the
      fifteen facts AC-2's table requires are pinned by nothing**. Measured, not argued: replacing
      `COMPILING`'s three facts with `'x'` leaves the full suite at its usual `1 failed | 256 passed
      (257)`; replacing `READY`'s three and `NEEDS_REVISION`'s `whatIsTrue` with `'x'` leaves both
      studio directories at `1 failed | 185 passed (186)`. AC-2's table names specific obligations —
      `COMPILING` must say the draft is saved, that a compile is in flight for the source shown, and
      that nothing is confirmable yet; `READY` must say the confirmed revision is runnable — and none
      of the three `COMPILING` sentences, nor any of `READY`'s three, is asserted to say anything at
      all. This is exactly the risk @po named for a UI story (a substring assertion passing on text
      that is present and unreadable), in its purest form: the substring is imported from the thing
      being checked. It is not a live defect — the copy is careful and correct today, and it is some
      of the best writing in this epic — but AC-2 is ticked and has no row among AC-21's twenty-two,
      and "an assertion nobody has seen fail has not been shown to assert anything" is this story's
      own standard.
    suggested_action: >-
      Give each state one literal assertion per required fact, as `STALE` already has: four regexes
      against the rendered region, written in the test and not imported. `COMPILING` and `READY` need
      three each, `NEEDS_REVISION` two more. Then add the AC-2 rows to the falsification table:
      reduce one fact per state to `'x'` and confirm the named test reddens. Roughly twenty lines in
      `compileStates.test.tsx`, no production change. Owner: @dev, follow-up — not blocking, because
      the rendered copy is correct today and every *other* AC-2 obligation (distinct accessible names,
      the four AC-3 origins, the AC-9 honesty sweep) is genuinely guarded.
  - id: AD2-1
    severity: medium
    finding: >-
      A product-visible behaviour was changed for a test-harness reason, and the affordance offered in
      its place is guarded by nothing. The confirm control stays enabled while a confirmation is in
      flight (`disabled={!confirmEnabled}`, deliberately not `&& !confirmInFlight`, with the reason in
      a source comment). The compensations are `aria-busy={review.confirmInFlight}` and a
      `data-testid="confirm-in-flight"` line reading "Sending your confirmation…". Deleting **both**
      leaves the entire studio suite green — verified — and no test file in
      `components/studio/review/` mentions `aria-busy`, `confirmInFlight` or that string. So a screen
      reader user could be given a live, named, apparently-actionable button that silently does
      nothing, with every announcement of its busy state removable without a red test. The stated
      justification is also weaker than the record implies: AC-13 forbids a `disabled` prop *standing
      in for* the guard, not a `disabled` attribute existing; `aria-disabled="true"` on a focusable
      button would announce the state to assistive technology, still deliver `userEvent` clicks, and
      leave the ref guard as the thing actually measured.
    suggested_action: >-
      Two items. **@dev, now or in the next story:** assert the in-flight affordance — one test that
      holds the confirm handler open, asserts `aria-busy="true"` on the control and the visible line,
      resolves, and asserts both clear. Three lines inside the existing held-open handler in
      `confirmFlow.test.tsx`. **@po with @ux:** rule on `aria-disabled` versus a live button plus
      `aria-busy` while a confirmation is in flight. This is a product decision that was taken to make
      a test possible, and it should be ratified or reversed by its owner rather than inherited by
      10.19's conformance pass.
  - id: ESC-1
    severity: medium
    finding: >-
      Two defects in the escalation's asserted property, neither of which makes it red-for-the-wrong-
      reason today. **(a)** The widened `isReachable` accepts any response property whose name ends
      with the field name capitalized. Adding `supersededRevisionArtifactHash` — the hash of a
      superseded revision, not the candidate — turns the escalation green, verified. When the ruling
      lands, the test will report "resolved" for any amendment that merely sounds right. **(b)** @po's
      ratification — "it is true of every other route in the document" — is false: the property fails
      for `internal` (25 required fields), `runner` (16) and `api-callback` (12) under both matching
      rules. The test is scoped to `TAG = 'tests'` and is therefore not lying about what it checks,
      but the ratification's generalisation is the stated reason the property "is a control rather
      than a TODO", and 10.11 extending it to another tag on that basis would explode.
    suggested_action: >-
      **(a)** Whoever implements @architect's ruling must pin the *specific declared field name* in
      this test rather than relying on the suffix rule — one added assertion, and the escalation then
      resolves only on the field that actually resolves it. Record it now against AC-15 so it is not
      lost between stories. **(b)** @po to narrow the ratified property to the tags it holds for
      (`tests`, `executions`), or to record that the `internal`/`runner`/`api-callback` tags are
      out of scope for it and why. Note this before 10.11, which is told to extend this assertion.
  - id: ENV-1
    severity: medium
    finding: >-
      Not this story's and not to be fixed here, but the epic's record of it is wrong in a way that
      will cost the next reviewer time. `frontend/package.json` declares
      `"@put/core-components": "file:../../put-core-components"`, which **resolves** from the main
      checkout — the directory exists and `node_modules/@put/core-components ->
      ../../../../put-core-components` is a live symlink there — and dangles only from a worktree
      under `orca/workspaces/put-checks/wt/`, because the same relative path lands one level short.
      So the failure is a worktree-layout consequence, not a repository defect, and the Dev Agent
      Record's "neither exists" and "that dangling symlink is the pre-existing failure" are wrong
      about the main checkout. Separately, and this settles the contested question: with the import
      resolved the a11y suite collects and its one test **still fails**, on
      `/Skip to main content/i`. That string exists nowhere in `frontend/src` except the assertion
      and nowhere in `put-core-components`; `ChecksLayout.tsx` renders no skip link. **Both earlier
      accounts are true, and the import failure masks the a11y defect.**
    suggested_action: >-
      Do not fix either here. Record on the epic that (i) the dependency resolves in the main checkout
      and the worktree layout is what breaks it — a `file:` path relative to the frontend, or a
      worktree-local link, would fix it for everyone; and (ii) `ChecksLayout` has a real missing skip
      link behind the resolution failure, which belongs to whoever owns the layout, and which 10.19's
      conformance pass will find the hard way if nobody writes it down now. The malformed
      `.eslintrc.json` (`"@typescript-eslint/recommended"` needing `"plugin:"`) is the third unowned
      item in the same bucket and should be assigned with them.
  - id: MATRIX-1
    severity: low
    finding: >-
      `COMPILE_FIXTURE_MATRIX` holds **23** entries, not the 25 the review brief describes. The count
      is right for what AC-20 enumerates and both halves are falsifiable, so nothing is missing — but
      seven of the 23 predicates are near-tautological: the three `FX-CONFLICT-*` and four
      `FX-REJECTION-*` entries assert `conflictResponse(code).error === code`, which checks a helper
      returns the argument it was given. That is the "hand-set boolean" shape AC-20's own amendment
      forbids for the truncation fixtures. It matters less here because each of those seven codes has
      a real behavioural test driving a `409`/`400` through the panel, which the matrix's second half
      pins by title.
    suggested_action: >-
      Optional. Point those predicates at the *document* — assert each code is a member of
      `x-conflict-codes` / the declared `400` set read from `openapi.yaml` — so the entry proves the
      fixture is a real code rather than proving an identity. Owner: @dev, whenever the file is next
      open.
  - id: IMPORT-1
    severity: low
    finding: >-
      AC-16(a)'s non-import assertion scans only non-test modules in
      `frontend/src/components/studio/review/`. Two modules this story also adds —
      `services/mocks/studio/compileFixtures.ts` and `diagnosticsBounds.ts` — are outside the scan,
      and the regex `/from\s+'([^']+)'/g` matches neither a double-quoted specifier nor a dynamic
      `import()`. The property holds today (verified by reading), and the criterion's load-bearing
      half is the behavioural one, which is genuinely red under mutation.
    suggested_action: >-
      Widen the scan to both story directories and accept either quote style. Two lines. Not blocking.

