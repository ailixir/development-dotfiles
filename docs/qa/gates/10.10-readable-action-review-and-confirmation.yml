# ─────────────────────────────────────────────────────────────────────────────
reachability_rule_judged:
  question: >-
    Is the widened *reachable* rule (same name, or a property ending with the field name
    capitalized) principled, or fitted to produce exactly one divergence?
  answer: PRINCIPLED IN FORM, GUARDED IN PRACTICE, AND WIDER THAN THE ANSWER IT PRODUCED
  detail: >-
    Three things are true at once and all three were measured. **(1) It is a rule, not an exemption.**
    It is applied to all twelve required fields across the three `tests` operations with no special
    case; on today's document eight of them match exactly, so the widened half changes the verdict
    for exactly one field — `revisionId` — and that is a fact about the document, not about the rule.
    The semantic correspondence behind it is real and checkable: `TestDto.currentCandidateRevisionId`
    *is* the revision the caller confirms and `TestDto.confirmedRevisionId` *is* the one already
    confirmed. **(2) The non-vacuity guard genuinely fires.** Degrading `isReachable` to exact match
    turns `the qualified-name half of the reachability rule is live, not dead code` red, verified
    here; and its first assertion (`readable.has('revisionId') === false`) is a deliberate tripwire
    with a message telling the next reader to re-check the guard. So the rule cannot silently decay.
    **(3) But its aperture is wider than intended.** `endsWith(Capitalized)` is syntactic. Adding
    `supersededRevisionArtifactHash` to a `tests` response — a field that hands the client the hash of
    a revision it is *not* confirming — turns the escalation green, verified. Some of that is
    inherent: @po's property is name-based by construction, so even an exact `artifactHash` on the
    wrong schema would defuse it; the widening enlarges an aperture that already existed by one
    degree rather than opening a new one. That tempers the severity but does not remove it, because
    the whole billing of this test is that its *green* is the signal.
    One thing the developer did not flag and should have: @po's ratification says the property "is
    true of every other route in the document", and it is not. It fails for `internal`, `runner` and
    `api-callback` under both rules. The test is honest because it scopes itself to `tests`; the
    ratification is not, and 10.11 extending it on that basis would detonate.

