  - id: AD2-1
    severity: medium
    resolution: >-
      **OPEN, AND CORRECTLY SO.** Untouched by @dev on this reviewer's round-1 instruction;
      `CompileReviewPanel.tsx`'s only change is three `data-testid` attributes and both
      `disabled={!confirmEnabled}` and `aria-busy` are byte-unchanged. Carried to `open_for_po`. It
