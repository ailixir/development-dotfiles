observations:
  - id: 'ARCH-OBS-1'
    severity: low
    finding: 'The harness now asserts auto-accept as an expected property (compile alone sets confirmed_revision_id and confirmed_by), which is what the user asked for. It would NOT hide a future fix toward C0-A3 (Run as the confirming act, trigger=RUN): compile would stop at AWAITING_CONFIRMATION, the helper would not find READY and legs 1 and 4-10 would go red with "did not become READY — compile_status is AWAITING_CONFIRMATION". Two caveats: (a) AWAITING_CONFIRMATION is not in the wait set, so that red arrives only after the 60 s timeout per leg (about 8 minutes total), not fast; (b) the helper javadoc (StudioCoRunIT.java:1555-1565) states the auto-accept as settled fact ("there is no AWAITING_CONFIRMATION step left") without pointing to the open @architect question (10.47 PO ruling 1), so a reader may take the harness as evidence that the contract is decided.'
    suggested_action: 'When @architect rules on C0-A3 vs the unconditional auto-accept, the fix story realigns this helper (per PO ruling 1). Optionally, in that or any later touch: add AWAITING_CONFIRMATION to the wait set as a failing terminal status (fails fast, still never accepted), and cite the open ruling in the javadoc.'
  - id: 'TEST-OBS-2'
