security_checks:
  value_never_logged_returned_persisted: PASS. The service logs only test, name and version. Error messages are fixed text, and parser messages are not echoed. The response DTO has no value field. ControllerIT checks logs, body and DB for the canary.
  idempotency_filter: PASS. IdempotencyFilter caches response bodies only (ContentCachingResponseWrapper). It never wraps or reads the request body. RateLimitFilter buffers only /checks/_bulk.
  authz_before_parse: PASS. The body is taken as @RequestBody(required=false) byte[] with no consumes, then findById and canWrite run, then parse. ServiceTest proves a malformed body from a non-member is 403 and the parser is never called (spy).
  403_vs_404: PASS. Absent, soft-deleted, quarantined and denied tests all get StudioAccessDeniedException, and ControllerIT asserts byte-identical refusals. A malformed UUID is 400 for every caller before any lookup, so it leaks nothing.
  path_traversal: PASS. name is ^[A-Za-z0-9_.-]{1,64}$ and not . or .. (one rule, StudioVaultProvider.isValidSecretName). testId is a UUID. segment() rejects / \ . .. and URL-encodes (% becomes %25, so an encoded dot cannot turn into ..). The template must not contain .., ? or #. The resolver refuses an invalid secretId (legacy vault://) before calling the provider.
  erase_discipline: PASS with residual (see QA-3). The body byte[] and value char[] are zero-filled in finally. The provider's ErasableBuffer zero-fills the arrays it leaves behind when it grows and is erased in finally, and a test observes this. The Jackson, servlet and HttpClient residual is stated in javadoc.
  frontend_redaction: PASS. See FE above. Browser devtools Network panel still shows the body, which is inherent.

findings:
  - id: QA-1
    severity: LOW
    type: correctness (pre-existing filter, newly reachable)
    location: backend/src/main/java/com/citi/put/checks/config/IdempotencyFilter.java:98
    basis: verified by reading
    issue: >-
      The idempotency cache key is `userId:Idempotency-Key`. It does not include the path or the
      body. A client that reuses one key for two different creates (another test or another name)
      gets back the first 201, with `Idempotent-Replayed: true`, and nothing is written to Vault.
    scenario: >-
      A future caller or script reuses the key for `POST /tests/B/secrets {name: X}` after
      `POST /tests/A/secrets {name: Y}`. It receives `201 {name: Y}` for test B. The step then
      fails at run time with UNKNOWN_REFERENCE. SecretInput sends no key (D13), so the UI cannot
      reach this today.
    recommendation: Key the cache on method and path as well, or refuse a key reused on a different path. This is a platform follow-up, not this story.

  - id: QA-2
    severity: LOW
    type: operability
    location: backend/src/main/java/com/citi/put/checks/config/ChecksExceptionHandler.java:179-187; studio/secrets/HashicorpStudioVaultProvider.java:159-160,190-192
    basis: verified by reading
    issue: >-
      VaultProviderUnavailableException carries the Vault status (for example "refused the secret
      write with status 403"). Neither the handler nor the provider logs it. The client sees only
      503 VAULT_UNAVAILABLE, and the server logs nothing.
    scenario: >-
      When V7 is connected with a token that lacks `create` or `list` (spec risk ASM-2, rated H/H),
      every create and list returns 503. Operators have no log line to tell a policy denial from a
      network outage.
    recommendation: Log the exception message (status only, never the body or URI) at WARN in the handler or the provider.

  - id: QA-3
    severity: LOW
    type: security (erase residual)
    location: backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsService.java:147-158
    basis: inferred from Jackson defaults (STRICT_DUPLICATE_DETECTION off; char[] allocated before a later field fails). Not executed.
    issue: >-
      If parsing fails after `value` has been deserialized (an unknown field that comes after
      `value`, or trailing tokens), `request` is never assigned, so the char[] Jackson built cannot
      be erased. With a duplicate `"value"` key, the first char[] is also dropped without being
      erased.
    scenario: '`{"name":"A","value":"s3cret","label":"x"}` returns 400 and leaves an unerased `s3cret` char[] until GC.'
    recommendation: >-
      Enable STRICT_DUPLICATE_DETECTION on the strict copy, and either accept this as part of the
      stated residual or parse with a streaming JsonParser so the service owns the char[]. The body
      byte[] is still zeroed.

  - id: QA-4
    severity: LOW
    type: correctness (edge case, external Vault semantics)
    location: backend/src/main/java/com/citi/put/checks/studio/secrets/HashicorpStudioVaultProvider.java:154-157,187-205; docs/runbooks/studio-runner.md (the line "fix it in Vault directly")
    basis: inferred from HashiCorp KV v2 documentation. No live Vault.
    issue: >-
      After a KV v2 soft delete (`vault kv delete`), the metadata remains. LIST still shows the key,
      a read of the latest version is 404, and a cas=0 write is refused. The three Studio answers
      then disagree with each other.
    scenario: >-
      An operator follows the runbook and "fixes" a secret by soft-deleting it. The picker still
      lists LOGIN_PW. A run fails with UNKNOWN_REFERENCE. Re-creating LOGIN_PW returns 409
      SECRET_ALREADY_EXISTS.
    recommendation: In the runbook, say that the fix is `vault kv put` (a new version) or `vault kv metadata delete`, not `vault kv delete`.

  - id: QA-5
    severity: INFO
    type: documentation accuracy
    location: backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsService.java:178-197
    basis: traced through SecretOrigins.parse (LinkedHashSet de-duplication). Not executed.
    issue: >-
      The javadoc says an entry containing a comma refuses the whole list. The size check can be
      met if one entry contains a comma and another entry repeats an origin: `["https://a.com,https://b.com","https://a.com"]`
      normalizes to [a, b] (size 2 = 2) and is accepted.
    scenario: No security impact. Every stored origin was supplied by the author and normalized. The javadoc is still wrong.
    recommendation: Reject any entry that contains `,`, or correct the javadoc.

  - id: QA-6
    severity: INFO
    type: ux
    location: frontend/src/components/studio/SecretInput.tsx:124,141-143; frontend/src/components/checks/wizard/configs/UiTestConfig.tsx:128-134
    basis: inferred from MUI Select behaviour. Not executed.
    issue: >-
      The select value is `value.id`, but the menu shows only names returned by the list. A value
      that is not in the list (a legacy UUID or vault:// id, a list that failed with 503, or the
      short gap while the list loads) renders blank and makes MUI log an out-of-range warning. In
      the wizard, an existing `kind: secret` row with the flag off has the same problem on its type
      select. The warning contains the id, never a value.
    recommendation: Render the stored id as a disabled "unknown" item, or show helper text.

  - id: QA-7
    severity: INFO
    type: data residual (operational)
    location: backend/src/main/resources/db/migration/V25__drop_plaintext_secrets.sql:8
    basis: known PostgreSQL behaviour
    issue: >-
      DROP TABLE removes the plaintext from the live schema only. Older copies may still exist in
      WAL archives, PITR backups and existing dev database dumps. Nothing in the migration or the
      runbook says so.
    recommendation: Add a note so that owners of environments that held real values can purge backups.

  - id: QA-8
    severity: INFO
    type: activation dependency (V6, by design)
    location: backend/src/main/java/com/citi/put/checks/studio/secrets/VaultStudioReferenceResolver.java (preflight/resolve mayUse)
    basis: verified by reading
    issue: >-
      With `hashicorp` connected, saving and listing work. Running a test still requires an entry in
      the dev `studio.secrets.entitlements` map (`principal|csi|env → name`). Without one the run
      fails with SECRET_USE_NOT_AUTHORIZED. This is the intended V6 "ready, blocked on PUT Core"
      state, but the V7 activation steps in the runbook should mention it so it is not reported as a
      bug.

  - id: QA-9
    severity: INFO
    type: performance bound
    location: backend/src/main/java/com/citi/put/checks/studio/secrets/HashicorpStudioVaultProvider.java:142-157,221-226
    basis: verified by reading
    issue: >-
      After a refused write, the create path makes a metadata GET. Each HTTP request has its own
      request timeout, so a refused create can take about twice the request timeout. The body-read
      deadline is shared, but the send timeouts are not.

