gate: PASS
status_reason: >-
  Every V-issue AC in spec §7 has code and a test behind it. The security properties I checked hold:
  the value is not logged, returned, persisted or put in the idempotency cache, authorization runs
  before parsing, and absent and denied tests give the same 403. The save path and the run path use
  the same Vault path. This is proven by an integration test run on Docker (not skipped) and by
  tracing the HashiCorp provider, where create, read and metadata-GET all go through one
  `render(template, kind, scope, name)` and every scope is built by `VaultScope.of(csi, env, UUID)`.
  V6 and V7 stay ready but off, with no invented production policy, as decided. All nine findings
  are LOW or INFO. None blocks merge.

