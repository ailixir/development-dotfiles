status_reason: >-
  **ROUND 1 (head `d274b0625`) — CONCERNS. Nothing blocking, and the concerns are real.**
  Every number this half reports about itself was re-measured rather than read, at both ends, and
  the baseline was measured in a **fresh detached worktree at `78cc634b2`** rather than inherited:
  `Test Files 2 failed | 19 passed (21); Tests 1 failed | 275 passed (276)` — reproduced **twice**,
  to the digit. @dev is right that the draft's inherited *"98 passed"* is another story's record and
  wrong for this branch. type-check at the base: exactly **2** errors, both `TS2307` on
  `@put/core-components`, at `ChecksLayout.tsx(6,33)` and `navigationSetup.ts(1,36)`. `npm run lint`
  at the base: **does not start**, zero files linted. All three reproduce identically at HEAD, and
  **no lint number is claimed in either direction**, which is @po's standing rule observed.

  **Eight of the twenty mutations were re-applied and every one reproduced exactly, including the
  sibling counts.** M10 turns `npm run type-check` non-zero on the derivation guard at
  `studioTypes.ts(63,3)` plus two `TS2741`s, exactly as recorded. **M17b is confirmed in full**: with
  the pins derived from the module they pin and `STALE`'s browser claim reworded to *"Everything is
  completely fine and nothing at all went wrong with anything anywhere"*, **198 of 200 stay green and
  only the provenance assertion reddens** — this reviewer's own 10.10 probe, transposed, with the
  same answer. M3 reddens **exactly 11 beyond its named test, 188 siblings green**, and the cause is
  the one @dev named: MSW answering `POST /api/v1/studio/validate-steps` under
  `onUnhandledRequest: 'error'`, quoted from the run.

  **The seventeenth shape is real and its repair works — and this reviewer measured both halves.**
  With M6 applied and the per-declared-code `not.toMatch(/no wording for/i)` **removed**, the suite is
  **15/15 green** while a sixth *declared* code renders the undeclared-code narrative. With the
  assertion present, M6 is red on exactly that line. @dev found a guard that could not fail by writing
  the table before running it, and closed it before it shipped. That is the behaviour this epic has
  been asking for.

  **What holds this at CONCERNS rather than PASS is four things, none of which is a wrong
  implementation.**
  **(1) An eighteenth vacuous-guard shape is live in this half's own AC-22 matrix** — deleting one
  required shape from `EXECUTION_FIXTURE_MATRIX` leaves the suite **green** (198 tests, 197 green, 1
  pre-existing red). Measured, not reasoned. **(2) The suite is timing-fragile and the reported
  after-numbers are not reproducible under load**: two full runs at load ~24–27 gave `8 failed | 369
  passed` and `4 failed | 373 passed` against @dev's `1 failed | 376 passed`, all with the same
  **377 / 26** totals; every extra failure is a 5000 ms test timeout, and the baseline suite never
  flaked in two runs at the same load. **(3) M17's collateral attribution is overstated** —
  `pageRunGate.test.tsx` fails **2 of 3 clean-tree runs** here, so *"the mutated module graph, not
  flake"* is not supported. **(4) The `timeoutSeconds` fix is real and unguarded.**

  **The `timeoutSeconds` change is a latent product defect fixed, and this reviewer ruled it against
  the contract and the backend rather than against @dev's reading.** `openapi.yaml`
  `TestConfiguration.timeoutSeconds` is `{type: integer, minimum: 1, maximum: 120}`, so the value the
  page used to send — `30000`, from `buildDefaultTestIR`'s `timeout: 30000` carried into a *seconds*
  field by `toConfiguration`'s `timeoutSeconds: legacy.timeout ?? 30` — was **1000× out of range**.
  The backend does **not** clamp it: `UITestRequest` rejects only `timeoutSeconds <= 0`, there is no
  `@Max` anywhere in `studio/dto/`, and `StudioDispatcher.deadlines()` computes
  `totalRuntimeMs = timeoutSeconds * 1000`, which for `30000` is **30,000,000 ms — 8 h 20 m** of
  browser runtime budget. The new value, `30`, is `defaultConfiguration()`'s and is the contract's own
  example. **Defect fixed, not a regression introduced.** It is disclosed rather than buried, which is
  the right call, and it should be recorded as a defect found. The one weakness is that **no test
  anywhere asserts the saved payload** — `grep timeoutSeconds` over every `*.test.ts(x)` returns
  nothing — so the fix has no guard and a merge can undo it silently. That matters more than usual
  because story 10.11b's page **still carries the legacy path**.

