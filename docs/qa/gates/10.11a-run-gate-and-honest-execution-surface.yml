new_vacuous_guard_shape:
  id: VAC-18
  name: >-
    A coverage matrix whose own required set is an editable literal, enumerated with `it.each` —
    deleting a requirement deletes its tests instead of failing one.
  measured: true
  probe: >-
    `AWAITING_CONFIRMATION` removed from the literal list that builds the `FX-RUNGATE-STATE-*` family
    in `EXECUTION_FIXTURE_MATRIX`.
  observed: >-
    `Tests 1 failed | 197 passed (198)` — **nothing red.** The total drops from 200 to 198 because the
    two `it.each` rows for that id simply cease to exist, and **no assertion reads the total**. The
    file's own floor is `expect(EXECUTION_FIXTURE_MATRIX.length).toBeGreaterThanOrEqual(20)` against
    **26** actual entries, so there is six rows of slack before even that notices; and the document-
    reading enumerations in `runGate.test.tsx` parse `openapi.yaml` themselves, so they stay green
    too.
  why_it_is_new: >-
    This is not catalogued shape 6 (*a pinned copy whose provenance nothing checks*) applied to an
    **assertion** — it is that shape applied to the **coverage requirement itself**, one level up, and
    the failure mode is *silent subtraction* rather than a false green. AC-22 exists to close exactly
    the hole @po named in 10.10's AC-20 (*"a green suite is indistinguishable from a covered one"*),
    and the matrix closes it for the *tests* while leaving it open for the *list*. @dev's M18
    falsified half 2 (a fixture id removed from test titles → red); nothing falsified half 1's **set
    membership**.
  where_it_bites_here: >-
    Two of the three enum-derived families are **transcribed literals, not read from the document**:
    `['STALE','COMPILING','AWAITING_CONFIRMATION','READY','NEEDS_REVISION']` and
    `['COMPILE_REQUIRED','RUNTIME_INCOMPATIBLE','IDEMPOTENCY_KEY_REUSED','TEST_DELETED','TEST_QUARANTINED']`
    — the latter written **twice**, once for the family and once inside `FX-EXECUTE-409-UNDECLARED`'s
    `satisfies()`. Only `EXECUTION_ERROR_CODES.map(...)` is derived from a carrier that is itself
    asserted against `openapi.yaml`, which is why that family is immune.
  remedy: >-
    One assertion in `executionFixtureMatrix.test.ts`, using the mechanism AC-5 already installed:
    `assertSameSet` the matrix's `FX-RUNGATE-STATE-*` suffixes against
    `components.schemas.TestDto.properties.compileStatus.enum`, and its `FX-EXECUTE-409-*` suffixes
    against `paths['/tests/{id}/execute'].post.responses['409']['x-conflict-codes']`, both directions.
    Small, and it makes the required set as document-bound as the assertions it guards.
  severity: medium
  owner: '@dev, in 10.11b or as a follow-up — not blocking this half'

