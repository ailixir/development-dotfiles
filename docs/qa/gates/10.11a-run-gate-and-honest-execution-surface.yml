top_issues:
  - id: ENV-TIMING-1
    severity: medium
    finding: >-
      The suite is timing-fragile and the story's reported after-numbers do not reproduce under load.
      Two full runs on the branch at load 24–27 gave 8 and 4 failing tests against the recorded 1,
      totals identical at 377/26, every extra failure a 5000 ms test timeout. The baseline suite did
      not flake in two runs at the same load, and the affected files pass in isolation.
      `pageRunGate.test.tsx` is the worst of them — its three tests run at ~2.7 s each against a 5 s
      default — and it is also the only page-level guard this half has.
    impact: >-
      A guard that fails intermittently gets loosened by whoever is unlucky. This one is the sole
      protection against a 10.11b merge reverting the page.
    recommendation: >-
      Give `pageRunGate.test.tsx` an explicit `testTimeout` (or a lighter render harness), and report
      a machine-load figure beside any suite number in this epic from here on.
    owner: '@dev'
    blocking: false
  - id: VAC-18
    severity: medium
    finding: >-
      An eighteenth vacuous-guard shape, measured: deleting one required shape from
      `EXECUTION_FIXTURE_MATRIX` leaves the suite green (198 tests, 197 green, 1 pre-existing red).
      Two of the matrix's three enum families are transcribed literals rather than document reads.
    impact: 'AC-22 closes the hole for the tests and leaves it open for the list the tests are measured against.'
    recommendation: >-
      `assertSameSet` the `FX-RUNGATE-STATE-*` and `FX-EXECUTE-409-*` id suffixes against the document,
      both directions, using the binding AC-5 already uses.
    owner: '@dev'
    blocking: false
  - id: TIMEOUT-GUARD-1
    severity: medium
    finding: >-
      The `timeoutSeconds` 30000 → 30 correction is a genuine latent-defect fix — the old value was
      1000× the contract maximum and would have been persisted and multiplied into an 8 h 20 m runtime
      budget — but **no test asserts the saved payload**.
    impact: >-
      An unguarded fix on a file that story 10.11b also edits, and whose 10.11b side still contains the
      code that produced the bad value.
    recommendation: >-
      One assertion on the observed `POST /tests` body — `configuration.timeoutSeconds === 30` and
      within the contract's `[1,120]` — in whichever half lands second. And record it in the epic as a
      **defect found**, not as a footnote.
    owner: '@dev / @po'
    blocking: false
  - id: M17-ATTRIBUTION-1
    severity: low
    finding: >-
      The Dev Agent Record attributes M17's page-test timeout to the mutated module graph on the
      strength of a 3/3 clean-tree run. The file fails 2 of 3 clean-tree runs here.
    impact: 'A small overclaim in an otherwise unusually honest record; it would mislead the next reader of that row.'
    recommendation: 'Restate the row as "timed out; the file is load-sensitive and the cause was not isolated".'
    owner: '@dev'
    blocking: false
  - id: DOC-PARSER-1
    severity: low
    finding: >-
      AC-21(a)'s literal wording *"no second parser"* is already false on this branch — seven test
      files parse `openapi.yaml` — and @dev's own honest note undercounts 10.10's share as two when it
      is three.
    impact: 'A future reviewer reads AC-21(a) literally and records a defect that is not one.'
    recommendation: 'Reword the epic constraint as *one assertion mechanism*, which is what §18.3 actually imposes and what this half satisfies.'
    owner: '@po'
