not_a_guard_removals_judged:
  - item: "The 'no second parser' constraint"
    verdict: ACCEPTED AS NOT-A-GUARD, and the honest note is stronger than @dev stated
    detail: >-
      Nothing in the suite can fail because a second `parseYaml` appeared, so removing it from the
      count is correct. @dev's disclosure is right in substance and **undercounts**: `parseYaml` of
      `openapi.yaml` appears in **seven** files, not the three implied — 10.10's `compileStates`,
      `confirmFlow` and `recompile`; this half's `refusals` and `runGate`; plus the shared binding in
      `studioContract.test.ts` and `studioEscalation.test.ts`. @dev's argument stands and is the right
      one: what §18.3 constrains is the single **assertion mechanism**, and there is exactly one —
      `assertSameSet` over the one binding — which AC-5 uses. **Recommendation to @po:** the epic
      should reword the constraint as *one assertion mechanism*, because AC-21(a)'s literal "no second
      parser" is already false on this branch and a future reviewer will read it as a defect.
  - item: "The byte-unchanged claim on studioEscalation.test.ts"
    verdict: ACCEPTED AS NOT-A-GUARD
    detail: >-
      A claim about a non-edit. SHA-256 is review evidence and nothing in the suite fails if a later
      story edits that file. Independently verified here. Named rather than counted is exactly how
      @po treated AC-31's equivalent.
  - item: "AC-3(a)(iii)'s import scan"
    verdict: ACCEPTED AS THE WEAKER HALF
    detail: >-
      The criterion names it weaker itself. The discriminating assertions are the rendering ones, and
      the structure now makes the scan nearly redundant in the right direction: `CodeTab` takes **no
      props**, so there is no channel for generator output to arrive through without an edit that M4
      and M20 catch. M20 was re-run here and reddens its named test; M4 was **not** re-run and is
      taken on trust with that structural reading stated.

