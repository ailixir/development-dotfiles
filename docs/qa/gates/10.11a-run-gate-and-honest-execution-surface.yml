inferences_judged:
  - inference: "The deployed API refuses an unconfirmed draft the way the mock now does"
    verdict: WELL-FOUNDED, CORRECTLY LABELLED
    detail: >-
      `ExecutionReadiness`, `ExecutionReadinessService` and `StudioAcceptanceService` all carry
      `COMPILE_REQUIRED` server-side, so 10.8's property exists in the tree. @dev matched it rather
      than re-verifying it end to end and said so. The mock change is argued from the right premise:
      a mock that accepts what the server refuses teaches the UI that the client's opinion is the
      gate, which is the defect this half removes.
  - inference: "RUNTIME_INCOMPATIBLE's remedy is lifted from architecture because the code has no row in the tests tag"
    verdict: VERIFIED TRUE AND CORRECTLY FLAGGED
    detail: >-
      The execute `409` description reasons about `COMPILE_REQUIRED`, `TEST_DELETED` and
      `TEST_QUARANTINED`; `RUNTIME_INCOMPATIBLE` appears only in `x-conflict-codes`, in one example,
      and in `x-runner-error-codes`. There is **no remedy row for it**. Deriving *"ask for a fresh
      translation and confirm the candidate that results"* from §4.2's ordinary recompile path is
      reasonable and is phrased as an available action rather than a promise. Flagging it rather than
      letting it be discovered is the correct call.
  - inference: "RETAINED_LOG_FIXTURE_CAP = 200 is the fixture's number, not a contract fact"
    verdict: CORRECT
    detail: >-
      `openapi.yaml` declares `logs` as a bounded retained buffer and `logsTruncated` as a plain
      boolean; no cap reaches any client. The constant is labelled in the fixture module as the
      corpus's own, chosen so a client-side window is observable, and AC-18's cap test asserts against
      that constant rather than against a contract claim. Honest.

conflicts_with_10_11b:
  severity: HIGH — read before merging the two halves
  detail: >-
    `story/10.11b` at `a41d55caf` was cut from the same base and its `ChecksStudioPage.tsx`
    **retains every path 10.11a retired**: `validation.isValid` as the run gate at line 288 and as the
    Run button's `disabled` at line 828; `buildDefaultTestIR` + `toTestRequest` on all three save paths
    (344/457-461, 840-842); `generatePythonFromIR` and the auto-sync effect (353, 1012, 1264); and its
    **own** `studioApi.executeTest(selectedScenarioData.id)` call at 295. 10.11a moved the execute call
    into `useRunGate` and deleted all of the above.
  the_hazard: >-
    A merge that takes 10.11b's side of the page reverts AC-1, AC-2 and AC-3(a) **and** silently
    restores `timeoutSeconds: 30000`. A merge that keeps both `executeTest` call sites ships **two**
    dispatch paths, one of them ungated — the precise defect this half exists to remove.
  what_must_survive_the_merge: >-
    (i) `RunControl` owns the gate and the `POST /execute`; the page's role is `beginRun(executionId)`.
    (ii) `beginRun` must open 10.11b's `subscribeToExecution` where 10.11a leaves the 700 ms interval —
    10.11a deliberately left it and said so. (iii) `stopPolling` (10.11a's `onStop`) and
    `closeSubscription` (10.11b's) are the same seam and must become one. (iv) The legacy imports
    `buildDefaultTestIR`/`toTestRequest`/`generatePythonFromIR` must **not** come back, or AC-3(a)(iii)
    regresses along with the timeout fix. (v) 10.11b's `:id`-route effect calling `handleScenarioSelect`
    sits beside 10.11a's `?autorun=1` → `setRunRequest` path in the same scenario-loading region;
    confirm a deep link does not both select and auto-run twice.
  the_uncomfortable_part: >-
    The **only** guard that would catch a page-level revert is `pageRunGate.test.tsx` —
    `runGate.test.tsx` exercises `RunControl` directly and stays green if the page stops using it — and
    `pageRunGate.test.tsx` is the flakiest file in the suite. Run it in isolation, more than once, on a
    quiet machine, after the merge.
  non_conflicts_confirmed: >-
    The filename reservation worked: 10.11a created `executionFixtures.ts` and 10.11b created
    `executionScenarios.ts`, no collision. `studioContract.test.ts` is appended by both in different
    describe blocks — mechanical only. 10.11b edits `vitest.config.ts` and `src/test/setup.ts`, which
    10.11a asserts absent from its **own** diff, which is the honest form of that claim.

