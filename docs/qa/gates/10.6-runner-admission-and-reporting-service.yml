# ─────────────────────────────────────────────────────────────────────────────
# Admission — the three outcomes
# ─────────────────────────────────────────────────────────────────────────────
admission:
  order_of_operations:
    finding: CORRECT
    proof: >-
      src/server/runCoordinator.ts submit() runs validateEnvelope -> validateArtifact ->
      pool.draining check -> pool.tryAcquire() -> admission.admit(). Every step before the acquire
      is synchronous, so there is no await between observing free capacity and holding the slot.
      Scratch creation, the browser launch and the evidence key all live in execute(), which is
      only reachable after outcome.kind === 'ADMITTED'.
  saturation_429:
    finding: >-
      NO NETWORK. tryAcquire() returning null returns 429 + Retry-After directly; the
      AdmissionClient is not constructed into that path at all. test/server/admission.test.ts
      asserts admissionRequests length 0 on the draining path and exactly 1 on the saturated path
      (the one held by the in-flight run), and the burst test asserts 1 admission for 8 submits.
  definite_refusals:
    finding: CORRECT
    detail: >-
      409/401/403 map to REFUSED; the coordinator releases the slot and returns 409 or 503 with no
      second call anywhere. Confirmed by inspection (no loop) and by the two-instance race, where
      the loser's admissionRequests has length 1 and its launches, scratch and event log are empty.
  ambiguous_never_resent:
    finding: CORRECT
    detail: >-
      timeout, transport loss, 5xx and 301/302/303/307/308 all map to AMBIGUOUS. The coordinator
      releases the slot and stops. Falsified by the reviewer — see falsification_rerun case 3.
  redirect_manual:
    finding: >-
      GENUINELY SET — src/reporting/httpClient.ts passes redirect: 'manual' to fetch, with the
      reason stated inline. A 307 therefore arrives as a status, never as a second POST. The AC-9
      suite covers 307 and 308 as their own cases and asserts http.requests length 1.
  retry_loop_search:
    command: grep for retry/for/while across src/reporting/** src/server/** src/main.ts
    finding: >-
      EXACTLY ONE retry loop exists in the package and it is deliberately scoped: the bounded
      terminal-delivery loop in src/reporting/reportClient.ts deliverTerminal. The HttpClient
      interface has no retry parameter, the admission client has no loop, and deliverProgress makes
      exactly one attempt. There is no retry anywhere on the admission path.

# ─────────────────────────────────────────────────────────────────────────────
# Exclusive ownership — the reviewer tried to break it
# ─────────────────────────────────────────────────────────────────────────────
ownership:
  design:
    finding: >-
      newAdmissionIdentity() is called once, inline, in submit(). There is deliberately no
      regenerate helper, so no code path can produce a second admissionId for one attemptId.
  probes:
    - probe: same attemptId submitted twice concurrently to ONE instance with POOL_SIZE=2
      result: >-
        ONE LAUNCH. Statuses [202, 409]; two distinct admissionIds were offered and the
        single-winner CAS refused the loser, which the runner obeyed. Capacity is not the thing
        protecting the attempt — obedience to the verdict is.
    - probe: three instances with distinct runnerInstanceIds contending for one attemptId
      result: >-
        ONE LAUNCH. Statuses [202, 409, 409]; each instance issued exactly one admission request
        and none re-attempted under any identity.
    - probe: neutralise obedience to the verdict (see falsification_rerun case 2)
      result: TWO LAUNCHES — the assertion is sensitive to the property, not to the fake CAS.
  verdict: >-
    The reviewer could not construct a case in which two instances own one attempt while the CAS
    behaves as a single-winner compare-and-set. The residual — an AMBIGUOUS outcome where the API
    may in fact have granted admission — is correctly left unresolved here and assigned to 10.7's
    reaper, which is the only component holding the state needed to resolve it.
  note: >-
    admissionId is built from Date.now() plus Math.random().toString(36).slice(2,12) rather than
    node:crypto randomUUID. Collision probability is negligible and the API CAS is authoritative,
    so this is not a correctness defect. Recorded as LOW-2.

# ─────────────────────────────────────────────────────────────────────────────
# Ready versus busy — four states
# ─────────────────────────────────────────────────────────────────────────────
ready_vs_busy:
  idle: /health 200, /ready 200 — verified
  saturated: >-
    /health 200, /ready 200 with ready:true, /v1/runs 429 with Retry-After — verified. Saturation
    alone does NOT flip readiness. src/server/routes.ts derives readiness from `!pool.draining`
    only; inUse is reported as a field, never as the verdict.
  draining: >-
    /health 200 with draining:true, /ready 503 with ready:false, /v1/runs 503 RUNNER_DRAINING and
    zero admission requests — verified.
  liveness_under_drain: /health stays 200 while draining — verified
  verdict: >-
    All four states correct and asserted as four distinct cases rather than one combined endpoint.
    No path exists by which capacity saturation can set readiness false.

# ─────────────────────────────────────────────────────────────────────────────
# Falsification — re-run by the reviewer against the PRODUCTION guards
# ─────────────────────────────────────────────────────────────────────────────
falsification_rerun:
  method: >-
    The suite's own two falsifications substitute a broken pool and a lying transport through
    existing DI seams, which proves the assertions are sensitive but leaves the production code
    untouched. The reviewer therefore neutralised the production guards themselves, ran the REAL
    assertions, captured the failure, and restored each file from a backup with git diff --quiet
    confirming byte-equality before moving on.
  cases:
    - guard: atomic acquire (AC-10) in src/server/capacity.ts
      mutation: >-
        `inUse += 1` moved out of the synchronous path into setImmediate, making tryAcquire a
        read-then-write
      target_test: Case 2 — "eight submits in one synchronous burst yield exactly one 202"
      result: RED — exit 1, "expected [ …(8) ] to have a length of 1 but got 8"
      restored: true
    - guard: obedience to the CAS verdict (AC-7b) in src/server/runCoordinator.ts
      mutation: the `outcome.kind === 'REFUSED'` branch disabled
      target_test: Case 3 — "one runner wins, the other gets 409, launches nothing"
      result: RED — exit 1, "expected [ 202, 202 ] to deeply equal [ 202, 409 ]" (two owners)
      restored: true
    - guard: no resend of an ambiguous admission (AC-9) in src/reporting/admissionClient.ts
      mutation: one resend added on timeout/transport
      target_test: AC-9 "issues exactly one admission request for %s and starts nothing"
      result: >-
        RED — exit 1, 2 failed (timeout and connection loss), "expected [ …, … ] to have a length
        of 1 but got 2". The 5xx and redirect cases stayed green, correctly, because the injected
        resend did not cover them.
      restored: true
    - guard: byte-identical terminal retry (AC-17) in src/reporting/reportClient.ts
      mutation: the FINAL body re-serialized per attempt with a per-attempt reportedAt
      target_test: AC-17 "re-sends the exact same bytes on every attempt, timestamps included"
      result: RED — exit 1, Object.is inequality on the serialized bodies
      restored: true
    - guard: the AC-22b named-module denylist in eslint.boundary-rules.js
      mutation: "'pg' removed from FORBIDDEN_MODULES"
      target_test: test/lint-boundary.test.ts
      result: >-
        STAYED GREEN — 76 passed. The suite iterates over FORBIDDEN_MODULES, so deleting an entry
        deletes its own test case. See MED-2.
      restored: true
    - guard: outbound redaction in src/reporting/reportClient.ts freezeBytes
      mutation: redactor.redact(...) removed from the serialization path
      target_test: the three AC-20 canary tests
      result: >-
        STAYED GREEN — 3 passed. The canary is already redacted upstream by the executor, so those
        tests never exercise the finished-bytes pass they are named for. See MED-1; the production
        property itself was verified separately and holds.
  tree_after: clean (git status --short --untracked-files=all empty; full suite re-run 564/3)

# ─────────────────────────────────────────────────────────────────────────────
# Reporting contract
# ─────────────────────────────────────────────────────────────────────────────
reporting:
  cumulative: >-
    VERIFIED — createRunSnapshot produces a full current-state snapshot per report; AC-16's test
    drops the first two deliveries and asserts every step still arrives correctly in the third with
    no step executed twice.
  identity_and_sequence: >-
    VERIFIED — every body carries executionId, attemptId, admissionId, runnerInstanceId, kind,
    reportedAt, runnerSequence, cumulative steps, bounded logs, runtimeVersions, and on FINAL the
    outcome and evidence state. runnerSequence is asserted strictly increasing within an attempt,
    restarting for a new attempt, never reused; STARTED's sequence is asserted lower than any
    step's.
  started_timing: >-
    VERIFIED (AC-14a) — reporter.browserStarted() is called after launcher.launch() resolves, not
    on admission and not when the HTTP call begins. A run whose adapter never reports a launch
    sends no STARTED.
  terminal_byte_identity: >-
    VERIFIED — freezeBytes() serializes, bounds and redacts once before the first send; every
    attempt re-sends that exact string. The per-delivery counter travels in the
    x-runner-delivery-attempt header and the test asserts the body never contains it. Falsified
    (case 4 above).
  stepreporter_seam: >-
    VERIFIED — src/reporting/reportingStepReporter.ts implements the StepReporter interface from
    src/executor/adapters/StepReporter.ts and is passed to the existing executeSteps({ reporter }).
    No parallel reporting mechanism exists; executeSteps was not modified.
  ownership_lost_409: >-
    VERIFIED (AC-18) — a 409 on any report sets stopped, emits one audit line plus
    runner.report.ownership_lost, and never escalates to a retry, a new admission or a relaunch.
  sensitivity_note: >-
    The harness pins wallClock to a fixed instant, so a regression that rebuilt the FINAL body per
    attempt from the snapshot would still serialize identically unless it also moved the sequence.
    The explicit-timestamp falsification above does exercise the byte comparison itself. LOW-3.

# ─────────────────────────────────────────────────────────────────────────────
# Redaction
# ─────────────────────────────────────────────────────────────────────────────
redaction:
  suite_canary: >-
    The suite plants canary-secret-value in resolvedSecrets, forces a step failure whose message
    embeds it, and asserts its absence in plain, encodeURIComponent, encodeURI, double-encoded and
    three base64 forms across every outbound body and every log line. Green.
  reviewer_canary: >-
    PLANTED INDEPENDENTLY. The reviewer built a FINAL body carrying a fresh canary
    (qa-probe-canary-9f3a) in outcome.errorMessage and evidence.videoKey — fields no redaction call
    site enumerates — handed it to a real createReportClient with a real createRedactor, and
    asserted on the bytes handed to the HttpClient. The canary appears in no form: plain, URL
    encoded, base64 and base64url all absent, REDACTED present. The finished-bytes property AC-20
    asks for is real. Probe file deleted; tree clean.
  logging: >-
    createLogger serializes the line and then redacts it (never the reverse), and
    logger.withRedactor(redactor) is wired into the report client per run. Request logging records
    only the AC-13 identity fields; asserted not to contain artifact source, resolvedSecrets or the
    target URL.
  caveat: >-
    The suite's own outbound-redaction guard is insensitive — see MED-1. The behaviour is correct;
    the test protecting it is not.

# ─────────────────────────────────────────────────────────────────────────────
# Deferrals — checked for honesty
# ─────────────────────────────────────────────────────────────────────────────
deferrals:
  AC-1:
    mechanism: it.skipIf(!CONTRACT_PRESENT) keyed on existsSync(docs/specs/studio/openapi.yaml)
    cannot_silently_pass: >-
      CONFIRMED — vitest reports it in the 3 skipped, never in the 564 passed. A companion test
      records the presence flag either way, so the absence is visible rather than silent.
    auto_enable_is_real: >-
      CONFIRMED BY EXPERIMENT — the reviewer created docs/specs/studio/openapi.yaml containing a
      minimal stub. The skipIf immediately flipped to running and FAILED ("expected 'openapi: 3.1.0
      \npaths: {}' to contain '/v1/validate'"). The stub was then removed and the directory pruned.
      The gate genuinely arms itself when 10.1 lands, and it does not pass on a spec that lacks the
      routes.
    quality_caveat: >-
      The armed assertion is substring containment over the raw YAML text, not conformance. AC-1
      also requires the request BODIES the runner sends to conform. See MED-3.
  AC-2b:
    mechanism: not attempted; ED-02 gates it; verified in story 10.18 through the real ingress
    honest: >-
      YES — AC-2a is genuinely verified here against a configured stub, on all four routes, for
      missing, blank, malformed and wrong credentials, with a constant-time comparison over sha256
      digests so a length mismatch is indistinguishable from a value mismatch. Nothing in this
      story depends on the backend's BffSessionAuthenticationFilter bypass.
  AC-14b:
    mechanism: it.skip naming story 10.12
    honest: >-
      YES — reported as skipped. No browser was installed or launched anywhere in this review; the
      default launcher in src/server/adapters.ts refuses loudly and has its own test.
  AC-12_sigkill:
    mechanism: it.skip with expect.unreachable in the body
    honest: >-
      YES, AND NOT FAKED — the body would throw if it ever ran, so the skip cannot decay into a
      vacuous pass. The comment states plainly that no assertion inside a process can observe that
      process being SIGKILLed and assigns recovery to 10.7's running reaper. The graceful SIGTERM
      drain IS asserted: readiness false, new runs 503, the in-flight run finishes and delivers its
      terminal report, scratch cleared, and a separate test covers the drain-deadline case rather
      than pretending completion.

# ─────────────────────────────────────────────────────────────────────────────
# Acceptance criteria
# ─────────────────────────────────────────────────────────────────────────────
ac_coverage:
  total: 24
  verified: 21
  deferred: 3
  unmet: 0
  detail:
    AC-1: DEFERRED to 10.1 — skipIf, reports as skipped, auto-enable proven by experiment. MED-3.
    AC-2a: >-
      PASS — identity checked on the request head before the body is read, on all four routes;
      missing/blank 401, malformed 401, wrong 403; sha256 digests compared with timingSafeEqual; a
      blank configured credential fails at construction. Bodies carry a code and no job detail.
    AC-2b: DEFERRED to 10.18 on ED-02 — not attempted, honestly recorded.
    AC-3: >-
      PASS — callbackUrl, callbackHost, callbackPort, reportUrl, webhookUrl and endpoint in a job
      body are each rejected 400 JOB_CALLBACK_NOT_PERMITTED with http.requests empty, so nothing
      leaves for the attacker's URL. The configured callback base URL is refused if it carries
      userinfo or a query string, and the credential travels in an Authorization header only.
    AC-4: >-
      PASS — /v1/validate is a browser-free wrapper over validateArtifact, never touches the pool,
      creates no scratch, bounds body/steps from DEFAULT_BOUNDS and reports a wall-clock overrun as
      503 rather than hiding it. Answers successfully while the single slot is held.
    AC-5: >-
      PASS — oversized 413 during upload (the cap is applied as chunks arrive), non-JSON 400,
      non-object 400, unknown key 400 with key names only. No stack trace, path or artifact echo.
    AC-6: >-
      PASS — order is envelope -> artifact -> capacity -> CAS -> 202, all of it synchronous up to
      the acquire. Zero adapter calls asserted for 409, 401, 403, timeout, transport loss and 5xx.
      Scratch is created inside execute(), which only the ADMITTED branch reaches.
    AC-7: >-
      PASS — runnerInstanceId is process-stable (configured or generated once); admissionId is
      minted once per submit by newAdmissionIdentity, which has no regenerate counterpart. LOW-2
      notes the randomness source.
    AC-7b: >-
      PASS — two instances, one single-winner CAS, the same attemptId, interleaved: [202, 409] and
      exactly one launch. The loser launched nothing, created no scratch, released its slot and
      issued exactly one admission request. Reviewer extended it to three instances with the same
      result, and falsified it to two launches by disabling the REFUSED branch.
    AC-8: >-
      PASS — 409/401/403 release the slot and answer 409 or 503 with no re-attempt under any
      identity.
    AC-9: >-
      PASS — timeout, transport loss, 5xx and 301/302/303/307/308 all resolve to AMBIGUOUS: slot
      released, nothing launched, one structured audit line plus runner.admission.ambiguous, and
      exactly one request issued. redirect: 'manual' is set on the fetch call. Falsified.
    AC-10: >-
      PASS — 429 with Retry-After, decided by a synchronous tryAcquire before the admission client
      is ever consulted. No await between observing capacity and holding the slot. Falsified: a
      read-then-write pool admits eight against a pool of one.
    AC-11: >-
      PASS — four distinct states verified; saturation keeps /ready 200, only draining sets it 503,
      /health stays 200 throughout.
    AC-12: >-
      PASS for the graceful path — SIGTERM sets draining, new runs get 503, the admitted run
      finishes and reports, scratch is cleared at startup and on the drain path, and main.ts binds
      SIGTERM and SIGINT to drain with no shell-form CMD in the Dockerfile so PID 1 receives the
      signal. SIGKILL is an honest, non-faked skip resting on 10.7.
    AC-13: >-
      PASS — full identity, kind, timestamps, strictly increasing per-attempt runnerSequence,
      cumulative step list, bounded logs, runtime versions from runtime-versions.json, and outcome
      plus evidence state on FINAL. Progress is a snapshot, not a delta.
    AC-14a: >-
      PASS — STARTED is emitted only after the launch resolves; no launch means no STARTED, and its
      sequence is lower than any step's.
    AC-14b: DEFERRED to 10.12 — it.skip, no browser installed or launched.
    AC-15: >-
      PASS — the 10.2 StepReporter seam is implemented, not bypassed; per-step PASSED/FAILED/
      SKIPPED outcomes and null timings for skipped steps reach the wire unchanged, and reporting
      is asynchronous to execution so a slow callback does not delay a step.
    AC-16: >-
      PASS — a failed STARTED/PROGRESS is dropped with a counter; the next cumulative snapshot
      repairs the gap and no step runs twice.
    AC-17: >-
      PASS — serialized once, re-sent byte for byte, nothing recomputed including timestamps, the
      attempt counter in a header, bounded count and window with jitter, stops on ack or deadline,
      sequence never incremented on a retry. Falsified. LOW-3 on harness sensitivity.
    AC-18: >-
      PASS — a 409 on any report stops reporting immediately, releases slot and scratch, records
      one audit line plus a counter, and never escalates.
    AC-19: >-
      PASS — one bounds source; max steps, max log entries, max entry length and max body size.
      logsTruncated is set and the oldest-dropped/newest-retained policy is asserted end to end
      through a real run, after the developer's own self-critique found the buffer was never
      populated during execution.
    AC-20: >-
      PASS on behaviour, verified independently by the reviewer's own canary in unanticipated
      fields. The suite's guard for the finished-bytes property is insensitive — MED-1.
    AC-21: >-
      PASS — resolved values live in a Map cleared on every exit path including drain and error;
      scratch is inspected after a failed run and is empty; no queued report body contains a value,
      resolvedVars or resolvedSecrets.
    AC-22: >-
      PASS — (a) allowlist over the resolved production closure, proven fail-closed against a real
      transitive install; (b) 32 named-module lint rules across database, vault, identity and
      gateway classes, each with its own fixture proven to fire, subject to MED-2; (c) the config
      loader enumerates its keys and refuses DATABASE_URL, VAULT_ADDR, CSI_ENDPOINT, LLM_GATEWAY_KEY,
      R2D2_ENDPOINT and an unpredicted key alike, naming the key and never the value.
    AC-23: >-
      PASS — all seven required cases present and genuinely concurrent: a held slot, eight
      interleaved HTTP requests with bodies delivered in halves, eight submits in one synchronous
      burst, two instances on one attempt, validate responsive under a held slot, SIGTERM mid-run,
      a FINAL retry racing the drain deadline with bytes compared, and an ambiguous admission racing
      SIGTERM. The burst form is the one that races two acquires inside a single event-loop turn and
      it is the one that goes red when the guard is removed.
    AC-24: >-
      PASS — every gate green from a clean npm ci, coverage on the two new directories pinned at the
      validator/executor thresholds and comfortably met, no new runtime dependency at all.

