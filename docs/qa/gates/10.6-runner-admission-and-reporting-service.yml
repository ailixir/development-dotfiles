status_reason: >-
  All 21 non-deferred acceptance criteria are implemented and independently verified from a clean
  install; npm ci, build, type-check, lint, test (564 passed, 3 skipped, 22 files), test:fixtures
  (58 passed, 1 skipped) and check:pins all exit 0. The reliability properties the rest of Epic 10
  rests on were falsified by the reviewer rather than read: neutralising the atomic acquire in
  src/server/capacity.ts turns the synchronous-burst test red with 8 admissions against a pool of
  one; neutralising obedience to the CAS verdict in src/server/runCoordinator.ts turns the
  two-instance race red with two 202s for one attempt; adding a single resend on an ambiguous
  admission in src/reporting/admissionClient.ts turns the AC-9 timeout and transport cases red;
  recomputing the FINAL timestamp per delivery turns the AC-17 byte-identity assertion red. The
  isolation allowlist is genuinely fail-closed: a real npm install of debug@4.3.4 made three
  assertions fail, including on its transitive ms. The playwright-core entry is correct — it is a
  direct dependency of playwright@1.63.0 pinned at exactly 1.63.0 and is not declared at the root.
  Zero production dependencies were added; package-lock.json is byte-unchanged from the epic base.
  Three medium findings keep this off PASS, all of them test-sensitivity rather than behaviour: the
  AC-20 "redacts a value added later" test stays green with outbound redaction removed, the AC-22b
  lint denylist silently shrinks if a name is deleted from FORBIDDEN_MODULES, and the AC-1
  auto-enabled assertion checks only that route strings appear in the YAML, not the body
  conformance AC-1 asks for. The production properties behind all three were verified directly by
  the reviewer and hold.

