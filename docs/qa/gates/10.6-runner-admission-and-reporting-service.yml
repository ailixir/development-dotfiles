top_issues:
  - id: MED-1
    severity: medium
    title: The AC-20 finished-bytes guard stays green with outbound redaction removed
    ac: AC-20
    finding: >-
      Deleting redactor.redact(...) from freezeBytes in src/reporting/reportClient.ts leaves all
      three AC-20 tests passing. The canary reaches the snapshot already redacted by the executor's
      own redaction of step failure text, so the outbound pass — the one AC-20 names as the reason a
      value cannot escape through a field nobody enumerated — is never the thing under test. The
      test literally titled "redacts a value added to the payload later, because it redacts the
      finished bytes" is the one that proves least.
    proof: >-
      Mutation applied and the AC-20 block re-run: 3 passed, 29 skipped, exit 0. File restored and
      verified byte-identical.
    impact: >-
      The behaviour is correct today — the reviewer proved it directly by handing a fresh canary to
      a real report client in outcome.errorMessage and evidence.videoKey and observing REDACTED on
      the wire. The risk is regression: a future refactor that moves redaction off the serialized
      string would ship green.
    suggested_action: >-
      Add one test that places a canary into a ReportBody field no upstream redactor touches and
      asserts on client.sentBodies, so the guard fails when the outbound pass is removed.
    owner: '@dev'
    blocking: false
    status: RESOLVED
    resolution: >-
      Resolved by @dev 2026-09-11: AC-20's finished-bytes case now asserts on a report client
      given a body no upstream redactor has seen, including an unenumerated field, and goes red
      when the outbound pass in freezeBytes is deleted.

  - id: MED-2
    severity: medium
    title: Deleting a name from FORBIDDEN_MODULES silently deletes its own test case
    ac: AC-22b
    finding: >-
      test/lint-boundary.test.ts derives ISOLATION_MODULES from FORBIDDEN_MODULES and asserts a
      fixture exists for each. The manifest is never asserted in the other direction, so removing
      an entry removes the iteration that would have caught the removal.
    proof: >-
      "'pg'" removed from eslint.boundary-rules.js and the suite re-run: 76 passed, exit 0. Restored
      and verified byte-identical.
    impact: >-
      Layer (a) remains genuinely fail-closed and is the layer the story itself designates as the
      one that catches the unpredicted case, so the security property does not rest on this. The
      narrow uncovered path is a client that enters through devDependencies — invisible to the
      production closure — whose lint rule someone has since deleted.
    suggested_action: >-
      Assert the manifest is a superset of ISOLATION_MODULES as well as a subset, or derive the
      expected module list from the manifest and assert both directions agree.
    owner: '@dev'
    blocking: false
    status: RESOLVED
    resolution: >-
      Resolved by @dev 2026-09-11: the covered set is now pinned by the denylist, the fixture
      manifest and the fixtures on disk, asserted to agree in both directions, so removing a name
      from FORBIDDEN_MODULES — with or without the manifest entry — fails.

  - id: MED-3
    severity: medium
    title: The AC-1 assertion that auto-enables checks route strings, not body conformance
    ac: AC-1
    finding: >-
      When docs/specs/studio/openapi.yaml lands, the skipIf arms an assertion that the six route
      strings and the word "internal" appear somewhere in the raw YAML. AC-1 also requires that
      "the request bodies it sends to the API's admission and progress routes conform to the
      internal-tagged section". Substring containment over the whole file neither scopes the check
      to the internal tag nor looks at a single request body field.
    proof: >-
      A stub openapi.yaml was created; the test armed and failed on the missing routes, confirming
      the auto-enable is real. Reading the armed assertion shows it is six toContain calls.
    impact: >-
      The deferral is honest and the arming works. The risk is that 10.1's landing will turn AC-1
      green on a check considerably weaker than AC-1 describes, and nobody will revisit it.
    suggested_action: >-
      Carry this as an explicit obligation on 10.1 or 10.7: parse the internal section and assert
      the admission and progress request-body shapes the runner actually serializes.
    owner: '@po'
    blocking: false
    status: RESOLVED
    resolution: >-
      Resolved by @dev 2026-09-11: the armed assertion parses the contract and checks the runner's
      real request and response bodies against the schemas of internal-tagged operations, proven
      red against a throwaway contract on a bad body, a bad response type and a missing internal
