code_review:
  R3_StudioDispatcher: 'PASS. DispatchAuthorization is a required constructor dependency. recheck runs after the pending-deadline close and before observed.binding, refreshRetry (grant minting), job/Vault read and send. AuthorizationRevokedException closes AUTHORIZATION_REVOKED with a value-free WARN. Other exceptions propagate. A NULL csi_id reaches ProvisionalDispatchAuthorization as null and is refused (csiId == null). Rows with no observed binding close DISPATCH_FAILED (no fallback family).'
  GuidedSessionService_stop: 'PASS. The stop targets the assignment only when the bootstrap is CONTEXT_PENDING without metadataAcknowledgement (or no context exists), and keeps the context if no assignment is found. It is monotone, and teardownStatus PENDING is set only when a target exists.'
  SecretMasker: 'PASS. Equivalence reasoned independently: "@" is outside the local-part class, so every start inside a run ends at the same run end, and the original can only match at the first scanned position of a run. The new (?:\G|(?<!cls))cls++@... tries exactly run starts plus the previous match end. The oracle test has 100k seeded cases plus a negative control, and it ran green in run5b.'
  DatabaseClock_R9: 'PASS. SELECT clock_timestamp() per call, uncached, fail-closed on DB error. It is constructed only in ObservedReplayConfiguration:21 and ObservedReplayRuntimeConfiguration:53 and is not a Spring Clock bean. The V15 trigger zero-tolerance clause is unchanged. ARCH-004 is the residual.'
  runCoordinator_launcher_R8_ADJ2: 'PASS. settled is captured before stop(), which kills the child. A child-sent errorCode wins, then CANCELLED (abort), then TIMEOUT (wait expired), then INTERNAL_ERROR (exit/violation). The LAUNCH_UNKNOWN literal has 0 hits. The recorded-vs-control-window stop source keeps a self-stop RUN_ERROR and lets a recorded cancel upgrade it to CANCELLED. QA re-run is green.'
  LocalEmbeddedPostgresConfig: 'PASS. A random port in 20000-32767 (below the Linux and macOS ephemeral ranges) with an exclusive probe on 127.0.0.1 and ::1 without SO_REUSEADDR, max 200 attempts, then IOException. The probe-then-bind TOCTOU window is inherent and the config is local-profile only (low, not raised).'
  IdempotencyFilter: 'PASS. The guided routes moved from /api/v3 (never covered by the filter) to /api/v1/studio/guided-sessions[/**], which is now explicitly excluded, so behaviour is preserved. GuidedHttpSecurityIT posts a 256-char non-UUID Idempotency-Key and expects 202, which pins the exclusion over HTTP (architect O-4 confirmed).'
