status_reason: >-
  Every VAL item marked fixed traces to code and a test. The targeted backend classes passed
  fresh (150/150), the runner unit tier passed (1153 pass, 29 skipped), and the live
  spot-checks matched the log for VAL-006, -012, -021, -022, -023, -029 and -030. No secret, URL
  query or fragment, or model text leaked in the paths I checked. The openapi anchor matches.
  It is not a PASS for three reasons. (1) The full frontend vitest suite, run for the first time
  today (VAL-003), is not green: 716/717 in two consecutive runs. One test, in a file this diff
  does not touch, times out under suite load. (2) No Docker integration test ran, including the
  ones that cover today's contract and save-path changes (StudioContractTest, ProgressCallbackIT,
  CompilePipelineIT, StudioApiIT). (3) The VAL-030 provider schema (anyOf) is unverified on the
  R2D2 proxy and has no fallback switch, so a proxy that rejects it would stop every compile.
  None of these is a known defect in today's code, so the verdict is CONCERNS rather than FAIL.
  Items 1 and 2 must be closed before push. Item 3 must be closed before any R2D2 deployment.

