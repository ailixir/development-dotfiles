  code_review:
    VAL-040_041: >-
      Reviewed studio-runner/src/run/playwrightAdapter.ts:527-639 (resolveActionTarget) and its
      callers at 807-921.
      Strictness: when visible matches are ≥2, the code raises the fixed strict failure with N equal
      to the visible count (line 592), and it never uses .first(). On the gate path, a swap that
      leaves ≥2 visible alternates is refused by Playwright's own strict mode on the `.or()` union.
      I infer this from Playwright semantics; it has no real-Chromium test (QA-F3).
      Assertions: expectVisible, expectContainText, expectValue, expectUrl and expectTitle use
      resolveHandle, which is unfiltered (lines 923-1004). adapter.test.ts:1429 and
      visible-only-resolution.test.ts:123 pin this.
      Whether it can act on an element the author didn't mean: the visible filter only removes
      elements that an action could not act on anyway, because every action except press requires
      visibility. The `.or()` gate (lines 601-604) can only match once the authored role has NO
      visible match on the page (`:root` hasNot authored). It then matches only text-entry roles
      in the closed set {textbox, searchbox, combobox}, with the same name, exact and disabled
      options, and the visibility filter still applies. That is the same equivalence VAL-031
      already ruled, minus the settle window. While the authored element is present, behaviour is
      identical to before. When both the old and the new control coexist, the authored one wins
      (rerender-resolution.test.ts:169). Residual risks are LOW and listed below as QA-F2 to QA-F4.
    VAL-035_039: >-
      VAL-039: useRunGate.ts creates one idempotency key per press before any await. Run returns
      early while inFlight is set. An accepted run holds the latch until isRunning has been shown
      and has ended, with a 3s safety release. Only the retry after a 409 refusal takes a new key.
      The design is sound. The root cause stays unconfirmed (mitigated, and the server dedupes the
      same key). VAL-036: Enter adds a step, Shift+Enter and IME composition do not
      (ChecksStudioPage.tsx:1045). saveDraft folds in pending text, so the text is not lost if the
      save is refused. VAL-035: formatEvidenceInstant falls back to the raw string for an
      unparseable value. VAL-037/038 are copy and layout changes, unit-tested. None of these is a
