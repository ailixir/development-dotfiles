  contract_class_ruling_check:
    recorded: Class A (ADR-002 §13 row 2026-10-04, VAL-027/VAL-024/QA-5, flagged "@architect to confirm")
    correct_class: C
    basis: >-
      ADR-002 §12 defines Class A as "defects no producer or consumer could ever have satisfied"
      (a truncated or malformed description, missing content, a bad servers base or $ref).
      The old 400 descriptions were satisfiable. They became incomplete because the server's
      behaviour changed. Class C is "routes, security schemes, tags, servers, status-code
      semantics, and anything on the public surface. Architect, always." POST /tests,
      PUT /tests/{id} and POST /tests/{id}/compile are public routes, and the edit records a
      status-code behaviour change for clients: timeoutSeconds 0 went from 201 (coerced to 30)
      to 400, and blank steps and over-bound drafts went from 201 to 400 at save. §12 sets
      authority by class of change, not by edit type, so "description text only" does not
      make it Class A. The edit is also not a loosening (the bounds were already declared), so
      the content itself is sound. What is missing is the @architect ruling.

