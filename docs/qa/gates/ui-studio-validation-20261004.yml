findings:
  - id: QA-1
    severity: MEDIUM
    owner: '@dev'
    type: test reliability (blocks a green full FE suite)
    location: frontend/src/pages/StudioTestsPage/StudioTestsPage.test.tsx:113
    basis: verified, 2 of 2 full-suite runs
    issue: >-
      "requires a registered system instead of silently sending a stale default" times out at
      5000ms in the full suite. It takes 2349ms alone. This is the same load-sensitivity class as
      VAL-002, in a file the diff does not touch. My inference is that it is pre-existing. I did
      not check it at HEAD without the diff.
    recommendation: Apply the VAL-002 remedy (userEvent.setup({delay:null}) and paste-based fill) to this test, then re-run the full suite to green.

  - id: QA-2
    severity: HIGH
    owner: '@dev + @devops (R2D2 owner)'
    type: release risk (availability)
    location: backend/src/main/java/com/citi/put/checks/studio/compile/gateway/GenAiLlmGatewayClient.java:310,450-477
    basis: verified by reading; the R2D2 behaviour itself is unknown
    issue: >-
      responseJsonSchema now sends a per-status anyOf on every call. No property switches it,
      because structured-output does not gate the schema. Whether the R2D2 proxy accepts anyOf is
      untested. If it rejects it, every compile on that path fails, and the only remedy is a code
      revert.
    recommendation: Before any R2D2 deployment, run one probe call through the proxy with the v2 schema. Alternatively, add a ProviderFeatures switch that falls back to the v1 schema. That fallback would bring back the VAL-030 refusal loss, so it is a degraded mode, not a fix.

  - id: QA-3
    severity: MEDIUM
    owner: '@qa / @devops'
    type: coverage gap
    location: backend ITs (see verification.not_run)
    basis: Docker down, verified
    issue: >-
      StudioContractTest parity for the closed RunnerLogEntry, ProgressCallbackIT end to end,
      CompilePipelineIT and the save-path ITs have not run against today's diff. ADR-002 §13
      records that parity was checked by reading only.
    recommendation: Run ./gradlew check with Docker up before @devops pushes. Treat any IT failure as a gate re-open.

  - id: QA-4
    severity: MEDIUM
    owner: '@devops'
    type: release constraint
    location: ADR-002 §33.3; backend RunnerLogEntry (ignoreUnknown=false)
    basis: ruling (inferred by @architect from ignoreUnknown=false; not executed)
    issue: >-
      A new runner talking to an old backend sends stepIndex. The old backend rejects every
      progress and final report, and runs get reaped. Nothing technical enforces the
      backend-first order.
    recommendation: Deploy the backend before studio-runner, or ship both in one release with the backend rolled out first. Put this in the release checklist.

  - id: QA-5
    severity: LOW
    owner: '@dev (@architect for the class call)'
    type: contract documentation drift
    location: docs/specs/studio/openapi.yaml (POST/PUT /tests 400, POST /tests/{id}/compile 400)
    basis: verified by grep
    issue: >-
      The openapi 400 descriptions do not list INVALID_STEPS on POST, PUT or compile. They mention
      INVALID_CONFIGURATION only for a non-chromium engine, not for timeoutSeconds outside 1..120.
      API behaviour changed for clients: timeoutSeconds 0 used to be coerced to 30 and is now 400.
      The schema already declared 1..120, so the server now conforms to it. This widens VAL-027.
    recommendation: Document the codes under VAL-027. Any openapi edit has to re-anchor BASE_SHA256 from shasum.

  - id: QA-6
    severity: LOW
    owner: '@dev'
    type: defence in depth
    location: backend/src/main/java/com/citi/put/checks/studio/compile/CompilePipeline.java (rejectionOutcome); DiagnosticsBounder.java:15
    basis: verified by reading
    issue: >-
      The model's UNSUPPORTED/CLARIFICATION message (up to 400 chars) is stored in
      compileDiagnostics and shown to the author. Nothing runs it through SecretMasker, and
      DiagnosticsBounder only bounds it, although its javadoc says "Bounds and redacts". The
      model's input is author source that has already passed the inline-credential screen, so my
      inference is that the real risk is low.
    recommendation: Pass the message through the same masker used for repair context, or correct the javadoc.

  - id: QA-7
    severity: INFO
    owner: '@dev (runner)'
    type: consistency
    location: studio-runner/src/executor/pageLocation.ts; studio-runner/src/run/playwrightAdapter.ts (describeLastReading)
    basis: verified by reading
    issue: >-
      The VAL-013 suffix keeps the non-URL part of the page title, which is page text. The
      assertion path still emits `last seen "<observed text>"`. The VAL-028 row says the assertion
      path "deliberately suppresses page text", but that is only true for Playwright error
      messages, not for the observed value. Both are bounded and redacted, and both are
      pre-existing or ruled design.
    recommendation: Correct the wording in the log. No code change is required.

  - id: QA-8
    severity: INFO
    owner: '@ux / user'
    type: behaviour note
    location: frontend/src/pages/ChecksStudioPage/ChecksStudioPage.tsx:573
    issue: >-
      Every UI save rewrites configuration.timeoutSeconds to 30. A value an API client set (for
      example the 10 on "VAL nav failure 2") is reset without notice. This is the user's VAL-017
      decision, recorded here so that it is not reported as a bug later.

  - id: QA-9
    severity: INFO
    owner: '@architect'
    type: doc consistency
    location: docs/architecture/ADR-002-internal-contract-surface.md §13 row 2026-10-04
    issue: The ADR names the stepIndex promotion item O-21. The ruling file names it O-17. One of them should be aligned.

  - id: QA-10
    severity: INFO
    owner: lead
    type: scope hygiene
    location: frontend/src/services/api/studioApi.ts (M), frontend/src/components/studio/list/ (new)
    basis: verified (mtime 23:21 local, during this gate)
    issue: >-
      These paths changed while the gate was running and are not in the VAL log. I did not review
      them. The second full FE run may have included them.
    recommendation: Gate them with their own story before the push.

