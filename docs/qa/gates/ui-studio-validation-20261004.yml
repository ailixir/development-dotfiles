      owner: 'author of the VAL-034 work (unattributed; not part of this validation)'
      type: production risk (performance), in-progress third-party work
      location: frontend/src/services/api/studioApi.ts:35-50,86-87; StudioRunsPage.tsx:45-51; StudioTestsPage.tsx:64
      basis: verified by reading
      issue: >-
        readAllPages walks every page (size 100) one after another, with no cap. The Runs page calls
        listAllExecutions() with no csiId filter and listAllTests() with no csiId filter, so it reads
        the whole executions table and every test across all CSIs on every mount. The requestId
        guard drops stale results but does not stop the walk: an unmount or CSI change leaves the
        remaining pages fetching. Offset paging over a list that grows during the walk can
        duplicate or skip rows. Each page also inherits apiClient's GET retry on 5xx. Load grows
        linearly with execution history.
      recommendation: >-
        Before production: server-side search/filter and paging (or a hard page cap with a
        "refine your search" notice), csiId scoping on the Runs page, and an AbortSignal. Gate it
        with its own story. This finding does not block this validation's verdict. It does block
