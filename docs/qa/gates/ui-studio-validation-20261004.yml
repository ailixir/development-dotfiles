  release_sequence:
    conflict: >-
      VAL-012 needs the backend first: the new runner sends RunnerLogEntry.stepIndex, and the old
      backend (ignoreUnknown=false) rejects every progress and final report. VAL-031 needs the
      runner first: the backend pin is recorded on provenance, and a 2.0.0 runner refuses
      2.1.0-provenance revisions with RUNTIME_INCOMPATIBLE. One backend artifact carries both the
      stepIndex acceptance and the 2.1.0 default pin, so neither "backend first" nor "runner first"
      is safe on its own.
    safe_sequence:
      - '1. Deploy the backend with STUDIO_RUNTIME_EXECUTOR_VERSION=2.0.0 (override; application.yml:415). The new code accepts stepIndex, and new revisions carry 2.0.0 provenance, which both runners accept.'
      - '2. Deploy studio-runner with executor 2.1.0. stepIndex is now accepted. Revisions with 2.0.0 provenance run on 2.1.0, because the executor is a backwardCompatibleMinor (compatibility.ts:64).'
      - '3. Remove the override, so the pin becomes 2.1.0, and restart the backend.'
      - 'Rollback in reverse: pin back to 2.0.0, then runner 2.0.0 (2.1.0-provenance revisions are refused until recompiled), then backend code.'
    cost: >-
      executorVersion is a fingerprint input (CompilePipeline.java:504), so step 3 changes the
      fingerprint a second time. A test compiled between steps 1 and 3 recompiles FULL twice. Run
      steps 1-3 in one window to keep that set small. Runbook §12(e) and gate QA-4 each state only
      half of this ordering and should be amended to this three-step form.
    other:
