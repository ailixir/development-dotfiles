top_issues:
  - id: QA-1
    severity: medium
    ac: 'AC-22 (MED-3), AC-20'
    finding: >-
      **AC-22''s own named falsification leaves the suite fully green, so the call-site guard the
      criterion exists to add does not exist.** The criterion states: *"A test enumerates every call
      site of `appendLog` / `createLogBuffer.append` reachable from a run and asserts each passes a
      message that has already been through the run''s redactor… A new producer added later that
      skips the redactor turns it red. **Falsification:** route one existing producer around the
      redactor -> red; restore."* I performed exactly that mutation — `reportingStepReporter.ts`''s
      step-result producer changed from `snapshot.appendLog({…})` to `snapshot.logs.append({…})`,
      a single-anchor edit, restored byte-identical — and the runner suite reported **43 files,
      886 passed, 10 skipped, 0 failed**. A throwaway probe confirms the consequence is real and not
      theoretical: appending through `snapshot.logs` puts the **whole** canary on the built
      `PROGRESS` body, and with the canary straddling `maxLogEntryLength` it leaves a raw
      12-character **fragment** — which matches no variant the outbound redactor can scrub. That is
      precisely the hazard AC-22 names in its own second test.
      The mutation @dev recorded as M9 (*remove the redactor from `appendLog`*) is a different and
      much easier mutation: it breaks the guard from the inside, where three tests watch. AC-22 asks
      for the guard to hold when a caller goes **around** it, and nothing watches that.
      `RunSnapshot.logs` is a public member of the interface — the AC-22 test suite itself reads it.
      This is **latent, not live**: `appendLog` is still the only caller of `logs.append` anywhere in
      `src/`, verified by grep, so nothing leaks today. That is exactly the state AC-22 was routed in
      from 10.13''s wave-4 gate to change, which is why the criterion may not stay ticked on the
      strength of M9.
    suggested_owner: '@dev, on this story before merge, or a named follow-up owned by 10.18'
    suggested_action: >-
      One of: (a) make `logs` inaccessible from outside the snapshot and expose only
      `logs.entries()` / a read-only view — the property then holds by construction and the test
      becomes a type-level fact; or (b) keep `logs` public and add the assertion the criterion names:
      append a canary through `snapshot.logs.append` directly and assert it is **refused or
      scrubbed**. Option (a) is smaller and is what the criterion''s own reasoning implies. Either
      way the recorded falsification in the Dev Agent Record should be the *reroute* mutation, not
      M9, and AC-22''s checkbox should not be ticked until the reroute is red.
  - id: MED-2
    severity: medium
    ac: 'none — infrastructure; reported rather than absorbed by the story, correctly'
    finding: >-
      **The `--tests "com.citi.put.checks.studio.*"` stall is a Testcontainers JDBC-driver liveness
      bug, and it is not slice-specific.** Reproduced exactly (142 passed, hung at 541 s, last line
      `StudioMigrationIT`). @dev inferred "a Spring context-cache/Testcontainers interaction that
      only a subset provokes" without taking a thread dump; I took one. The `Test worker` thread is
      **BLOCKED on an object monitor**, not sleeping: it is inside
      `ContainerDatabaseDriver.connect` starting the next context''s Flyway migration, waiting to
      lock `<0x…c1cef940> (a org.testcontainers.jdbc.ContainerDatabaseDriver)`. That monitor is held
      by a daemon thread named **`HikariPool-4 connection adder`** — a background connection adder
      belonging to an **already-finished** context''s pool — which is itself inside
      `JdbcDatabaseContainer.createConnection`''s retry-sleep loop against a container that has gone
      away. `ContainerDatabaseDriver.connect` is synchronised on one process-wide driver instance,
      so one stale pool''s retry window blocks *every* subsequent context''s first connection.
      **The half of the inference that is wrong matters:** the full suite is not immune. My *first*
      `./gradlew check --continue` hung with the identical stack (`Test worker` in
      `createConnection` under `FlywayMigrationInitializer`) after 612 tests and never recovered; I
      killed it and the re-run completed. So "the full suite does not [stall]" held for @dev''s two
      runs and does not hold in general.
      **Does it hide anything?** No test result is wrong because of it — it hides *liveness*, not
      correctness, and the two clean full runs agree exactly. But a CI job that hits it **hangs
      rather than fails**, which is the worse failure mode, and it makes the narrow studio feedback
      loop unusable for every story in this epic.
    suggested_owner: '@devops / epic-level, not this story'
    suggested_action: >-
      Set an explicit `minimumIdle`/`idleTimeout` or eager pool warm-up so contexts do not leave
      connection adders running past their own shutdown, or pin a `connectTimeout` on the
      Testcontainers JDBC URL. Record it as an epic infrastructure defect so the next agent that
      sees a 142-test hang does not re-derive it. Deferring it **was** the right call for this
      story; the characterisation should be corrected in the record.
  - id: LOW-1
    severity: low
    ac: 'AC-20 (the Dev Agent Record''s finding 1)'
    finding: >-
      **"Removing `logging.ts`''s redaction reddens nothing: 0 red, 13 green" is true only within
      `canary.test.ts`.** Over the full runner suite the same mutation reddens exactly one test —
