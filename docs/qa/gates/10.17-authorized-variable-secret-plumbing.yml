    suggested_action: >-
      Amend the finding to: *"reddens nothing **in the canary harness** (0/13); its falsification is
      `surface.test.ts > logging > serializes first and redacts second`, which is red under the same
      mutation."*
  - id: LOW-2
    severity: low
    ac: 'AC-16b'
    finding: >-
      **AC-16b''s gate-shut sibling watches a test fixture, not the contract surface it names.**
      `records why AC-16b cannot be implemented here rather than leaving it to be re-derived` states
