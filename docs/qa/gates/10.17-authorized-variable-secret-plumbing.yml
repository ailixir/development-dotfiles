# ─────────────────────────────────────────────────────────────────────────────
# AC-17 — do the permit companions ride the bypass?
# ─────────────────────────────────────────────────────────────────────────────
ac17_permit_companions:
  verdict: 'THEY RESIST IT. Verified, and the mechanism is structural rather than careful.'
  detail: >-
    @po named these as the tests most likely to quietly ride the bypass. They cannot, because
    **none of them issues an HTTP request**, and `isCoreServiceBypassed()` is a servlet filter.
    - `SecretUseAuthorizationTest` is a plain unit test over `VaultStudioReferenceResolver` +
      `ConfiguredSecretUseAuthorization`. The principal is a `String` parameter the seam reads.
      Spring Security is not on the stack at all.
    - Every refusal has a permit companion in the **same test method**, differing in exactly one
      variable: `refusesAPrincipalWhoMayExecuteTheCsiButIsNotEntitledToTheSecret` /
      `permitsTheEntitledPrincipalForTheSameSecretOnTheSameCsi`;
      `refusesTheSameSecretForADifferentCsiAndPermitsItForItsOwn`;
      `refusesAReferenceEntitledOnlyInAnotherEnvironmentAndPermitsItInItsOwn`;
      `refusesAnUnknownReferenceAndPermitsAKnownOne`;
      `refusesACrossedNameAndPermitsTheSameTwoNamesWhenTheyAreDistinct`. "Deny all secrets" fails
      five permits; `return canExecute(auth, csiId)` gives `OWNER` and `STRANGER` the same answer and
      fails the first pair. Both collapses are caught, which is the property AC-4 asks for.
    - The **integration** permit is `RevocationRotationIT.theSameExecutionWithTheEntitlementAndThe
      ReferenceIntactIsDispatched`, driven through `studioService.executeTest(testId, owner, null)`
      with `owner = StudioExecutionFixtures.identity(OWNER, CSI_ID, "owner")` — `roles = List.of()`,
      one `CsiOwnershipEntry`. No admin role, no filter, no bypass.
    - Production genuinely threads a real principal: `StudioAcceptanceService.accept` passes its
      `principal` argument to `references.preflight(...)`, and `StudioDispatcher` reads
      `row.get("principal")` from the execution row and passes it to `references.resolve(...)`. The
      seam is not called with a constant.
    - `ConfiguredSecretUseAuthorization` is fail-closed at every gap (null principal/CSI/environment/
      secret -> `false`; unknown key -> empty set -> `false`) and the three deployment profiles set
      `studio.secrets.vault.provider: fake` only for dev/local/test, with no default elsewhere.
  one_soft_spot: >-
    `theBypassRolesAreNotWhatMakesAnyPermitPass` drives the three admin role names as **principal
    strings**. That is true by construction — the seam takes no roles argument — so the assertion can
    only fail if someone keys the entitlement map by a role name. It is harmless and near-tautologous;
    the load-bearing non-vacuity is the five refusal/permit pairs, which are real. Not raised as a
    finding, recorded so it is not mistaken for the discriminator.

