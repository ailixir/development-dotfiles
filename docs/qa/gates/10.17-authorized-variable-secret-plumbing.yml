      and added the control (`still forwards every read the report builder needs …`). The AC-16b
      tripwire was modified, not added. +1, as claimed.

  qa1_closure:
    verdict: 'CLOSED. Verified four ways, not accepted.'
    is_append_unreachable_at_run_time:
      answer: 'YES — genuinely, not only at the type level.'
      evidence: >-
        Throwaway probe on the production object: `Object.keys(snapshot.logs)` is exactly
        `["entries","truncated","dropped"]`; `typeof view.append` is `undefined`;
        `'append' in view` is **false** (so not an own-property trick); the prototype chain beyond
        `Object.prototype` is **empty**, so nothing is inherited; and the forced call throws
        `TypeError: view.append is not a function`. The view is a fresh object literal forwarding
        three reads, exactly as the comment claims.
    the_named_falsification:
      answer: 'RED, two stages.'
      evidence: >-
        Plain reroute (`snapshot.appendLog(` -> `snapshot.logs.append(` in
        `reportingStepReporter.ts`) now fails `npm run type-check` with
        `src/reporting/reportingStepReporter.ts(133,21): error TS2339: Property 'append' does not
        exist on type 'LogView'`. Forced past the type system with a cast, the suite reports
        **16 failed / 871 passed / 10 skipped**, across `reporting.test.ts`, `evidence.test.ts`,
        `prelaunch.test.ts` and `timeline.test.ts`.
      one_precision_worth_recording: >-
        The 16 are **not 16 detectors**. With `append` absent the forced call throws, the step
        reporter dies and runs end `ERROR`, so those tests fail as collateral from a broken
        producer. That is *stronger* than a watcher, not weaker — the bypass cannot be written, and
        if forced, nothing runs. But the mutation-table entry should say which it is, because
        "16 red" reads as detection. @dev also kept an explicit assertion on the production object,
        which is the right belt-and-braces: **close the door AND keep a small check that it is
        still closed.**
    guard_is_discriminating:
      answer: 'YES, in both reopening directions, 1 red each.'
      evidence: >-
        `logs: logs` (hand the buffer out whole) -> **1 failed / 886 passed**, the failure being
        `offers no way into the bounded buffer except appendLog, on the production object (QA-1)`.
        `const logView: LogView = { ...logs }` — the exact shortcut @dev names as the trap ->
        **1 failed / 886 passed**, the same test. **@dev's claim that the spread would reopen the
        bypass is verified empirically, not taken on trust.**
    control_can_fail:
      answer: 'YES, and it is perfectly discriminating.'
      evidence: >-
        `entries: () => []` (a view that forwards nothing) -> **1 failed / 886 passed**, the failure
        being the control `still forwards every read the report builder needs, so the view is not
        merely a blockade`, and **not** the guard. So the pair separates cleanly: the guard watches
        the write surface, the control watches the read surface, and neither covers for the other.
        The control is real, not ceremonial.
    no_regression:
      evidence: >-
        M9 (redactor out of `appendLog`) still reddens 3 tests; M7 (relay retention) still reddens
        both AC-21 tests. The closure did not weaken anything already proven.
    any_other_surface_reaching_the_buffer:
      answer: 'One, and it is not the same defect. See LOW-6.'
      evidence: >-
        `createLogBuffer` is called in exactly **one** place in `src/` (`snapshot.ts:148`, inside
        the closure), so there is no second construction site feeding a report body. The remaining
        reach is that `LogBuffer.entries()` returns the **live internal array**.

  low2_low3_low4:
    low2:
      verdict: 'CLOSED and falsified.'
      detail: >-
        The tripwire now iterates the exported production `ACCEPTED_JOB_KEYS`. Adding `targetPolicy`
        to the real set reddens **exactly 1** test — `records why AC-16b cannot be implemented here
        rather than leaving it to be re-derived` — where the same mutation left **886 green** before.
      on_the_size_assertion: >-
        **Not brittle in a way that hides anything; mildly brittle in a way that misattributes.**
        `size === 14` cannot make a real change invisible — it is purely additive detection, and it
        fires on an addition *and* on a removal. The risk is the diagnostic: the test's message is
        about ADR-002 O-6 and AC-16b, so a legitimate, architect-ruled Class-B addition would fail
        it with a message pointing at the wrong cause, inviting a thoughtless 14 -> 15 bump.
        `has('resolvedSecrets')` is the assertion actually doing the non-vacuity work; `size === 14`
        is a second, weaker claim and is a **hand-written copy of a number the frozen document
        owns** — §15.6's own concern, in miniature. Non-blocking recommendation: derive the number
        from the document's `RunJob.required.length`, or drop it and keep the `has` check, or at
        minimum widen its failure message. Recorded as an observation, not a finding.
      adjacent_observation_not_this_story_s: >-
        Nothing on the runner side asserts that `ACCEPTED_JOB_KEYS` **is** the frozen `RunJob`'s
        property set. `contract.test.ts` validates the runner's outbound requests and served
        responses against the document; it does not pin the inbound default-deny key set. So the
        backend now validates producer bytes against the document while the runner's acceptor is
        hand-derived — the remaining half of the DEF-01 cause (*"the runner validates against the
        document, the backend validates against its own fixtures, and nothing compares the two"*).
        Out of this story's scope; belongs with 10.14's AC-24 / ADR-002. Named so it is not
        re-derived.
    low3:
      verdict: 'CLOSED, and better than my own probe.'
      detail: >-
        `ValidateRequest` is the registry's second member and the capture is **genuine**: it stands
        up the real `RunnerValidationClient` over a real `RestClient` with a
        `SimpleClientHttpRequestFactory` against the WireMock socket, calls the public
        `validate(...)` (not the package-private `requestBody`), asserts exactly one request
        reached the socket, and returns those bytes. My throwaway probe asserted `requestBody`
        directly; this is the stronger form and the one the class's own docstring argues for. The
        parameterized name now reports `RunJob` and `ValidateRequest` separately, so
        "every internal body" is a loop over more than one member.
    low4:
      verdict: 'CLOSED, and the overload widened nothing.'
      detail: >-
        The 4-argument `confirmRevision` is unchanged in signature and now delegates to a
        5-argument overload with `DEFAULT_CONFIGURATION`, so every existing call site keeps its
        exact previous behaviour — the change is strictly additive. The `DISPATCH_FAILED` branch is
        covered with a `'{}'` configuration written at INSERT (correct: the row is write-once), and
        it asserts `sendCount()` is zero. The **permit companion** asserts §8.5's real values
        (`admittedStartMs` 30 000, `totalRuntimeMs` 30 000), so a dispatcher that refused every
        revision fails it, and the deadline values are now asserted somewhere rather than nowhere.

  residual_findings:
    - id: LOW-6
      severity: low
      finding: >-
        **`LogBuffer.entries()` returns the live internal array, so the new test's name overclaims —
        but the AC-22 hazard does not transfer.** Verified: the same reference comes back from two
        calls, `body.logs === view.entries()`, and
        `(snapshot.logs.entries() as LogEntry[]).push(...)` lands an entry on the built body. So
        *"offers no way into the bounded buffer except `appendLog`"* is literally false — this is
        the sixteenth shape recurring inside its own fix, which is a lesson worth having.
        **I checked whether it is the second door rather than assuming:** the push skips the
        buffer's truncating `slice`, so the **whole** value reaches the body, and the whole value is
        exactly what the outbound redactor at the report client matches. Driving that mutation
        through the canary harness leaves it **fully green — 25 passed / 8 skipped**, no canary on
        any surface. What *does* transfer is the bounding guarantee: 250 entries survive a
        `maxLogEntries` of 200 with `truncated` still `false` and `dropped` still `0`. Pre-existing
        (`entries()`'s body is untouched by this commit), a bounding bypass rather than a redaction
        leak, and outside AC-22's subject.
      suggested_action: >-
        `return [...entries]` (the buffer is capped at 200 and read a handful of times per report,
        so the copy is free), **or** narrow the test's name to what it asserts — "exposes no
        `append`". The first is the honest close and makes the name true.
      blocking: false

  close_rather_than_watch:
    verdict: >-
      **It generalises, with one addition and one caution — it is not safe as an unconditional
      rule.**
    the_addition: >-
      **A closure is only as closed as everything it returns.** The corollary's own failure mode is
      the one I just probed: remove the mutator and the object still hands out its mutable interior.
      Here it cost nothing because the removed path also removed the fragmenting, but that was luck
      of mechanism, not design. So the rule is *close, then ask what the closed surface still hands
      out*, and keep a small assertion on the production object afterwards — which is what shipped
      and is better than closing alone, because a closure with no assertion has no way to announce
      that a later refactor reopened it.
    the_caution: >-
      **Where closing is unavailable, watching is not second-best; it is the whole of it**, and it
      must not be read as a smell. This epic has at least four: `INHERITED_ENV_KEYS`'s
      registry-redirecting class, where ADR-001 §4.2 *requires* `PLAYWRIGHT_BROWSERS_PATH` so the
      key cannot be removed (SEC-2); the `ED-02` bypass, whose removal is 10.18's, so until then a
      live sibling is the only instrument; `x-assigned-by` and the runner-error-code disjointness,
      which are documented properties with nothing to close; and `bounds.ts`'s truncate-before-
      redact residual itself — @po ruled against restructuring it, so the **ordering** is still
      watched and only the **access** got closed. For all of those the sixteenth-shape probe is what
      keeps the watcher honest.
    the_form_that_generalises: >-
      *Close when the bypass is removable without moving a responsibility to a module that should
      not hold it; otherwise watch, and point the watcher at the production symbol rather than at a
      stand-in.* Stated that way it is safe, and it is consistent with @po's ruling against the
      `bounds.ts` restructure.

  seventeenth_shape:
    answer: >-
      **None found. What I found instead is the sixteenth recurring inside its own fix**, which I am
      recording as a *lesson* rather than inflating into a new shape. The test written to close a
      guard whose **name** stated a universal structural property is itself named for a universal
      structural property — *"offers no way into the bounded buffer except `appendLog`"* — while its
      body checks that universal only for `append`, and another way in exists (LOW-6).
      **Lesson:** *the fix for a naming-overclaim shape is itself prone to the naming overclaim.
      After closing a bypass, re-read the new test's name as a literal universal claim and try to
      falsify the claim rather than the assertion.* This is the third epic entry of the "lesson, not
      a shape" kind, alongside the two from the 10.13 recheck.

  resolved_since_the_concerns:
    - 'QA-1 — closed by construction, falsified four ways, with a working control.'
    - 'LOW-2 — tripwire now on the production set, 1 red under the policy-key mutation.'
    - 'LOW-3 — registry has two members, both captured off a real socket.'
    - 'LOW-4 — throwing branch covered with a permit companion asserting real deadline values.'
    - 'LOW-1 and MED-2 — both corrections accepted by @dev with the scope and the mechanism stated.'

