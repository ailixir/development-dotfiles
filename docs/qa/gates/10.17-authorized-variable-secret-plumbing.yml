# The sixteenth vacuous-guard shape
# ─────────────────────────────────────────────────────────────────────────────
sixteenth_vacuous_guard:
  shape: >-
    **A guard whose name and comment state a structural property of a production symbol, while its
    body asserts only over a test-local stand-in — or re-asserts a sibling''s behavioural property
    under the structural name.** The structural claim lives in prose; nothing executes it. Such a
    guard survives ordinary mutation testing, because the *sibling* mechanism reddens it, and the
    red is then recorded as evidence for the structural claim it never made.
  why_it_is_new: >-
    Distinct from #1 (a source scan that at least scans), from #11 (a scan mis-keyed to the
    receiver''s name), from #14 (a scan over an artefact that quotes itself) and from #15 (an
    ordering assertion against a test-appended sentinel). Here there is **no scan and no structure
    read at all** — only its name. Nearest relative is #9: the comment reads as load-bearing and the
    assertion is not.
  instances_in_this_story:
    - 'AC-22: `enumerates the producers reachable from a run and finds one call site, which is the
      guard` enumerates nothing. It plants a canary through `appendLog` and reads it back off
      `snapshot.logs.entries()` — the same mechanism as the sibling three lines above it, which
      reads it off `build(''PROGRESS'').logs`. The claim "`appendLog` is the only caller of
      `logs.append`" is asserted in a comment. QA-1.'
    - 'AC-16b: `records why AC-16b cannot be implemented here…` says *"The assertion: the envelope''s
      accepted key set carries no policy field"* and then iterates `Object.keys(validJob())` — a
      hand-built fixture in `test/helpers/runner.ts` with no link to `ACCEPTED_JOB_KEYS`. LOW-2.'
  probe_shape: >-
    **For every test whose name contains a structural verb — "enumerates", "is the only", "carries
    no", "exactly one" — find the production symbol the name refers to and mutate *that symbol*, not
    the behaviour beside it.** If the suite stays green, the structural claim is prose.

