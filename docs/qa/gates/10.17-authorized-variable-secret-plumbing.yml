gate: PASS
status_reason: >-
  **RECHECK, commit `1ab4fb5e9`. QA-1 is closed by removing the door rather than watching it, and
  the closure is verified rather than accepted.** `RunSnapshot.logs` is now a read-only `LogView`
  with the buffer in the closure. I attacked it four ways. `append` is **genuinely absent at run
  time, not hidden by a type**: own keys are exactly `["entries","truncated","dropped"]`,
  `'append' in view` is `false`, the prototype chain beyond `Object.prototype` is **empty**, and
  calling it throws `TypeError: view.append is not a function`. The plain reroute is now
  `TS2339: Property 'append' does not exist on type 'LogView'` at `reportingStepReporter.ts:133`;
  forced past the type system with a cast it reddens **16 tests / 871 passed** where before it was
  0 red / 886 green. The new guard is discriminating in both directions — handing the buffer out
  whole (`logs: logs`) reddens **exactly 1** test, the new one, and so does the `{ ...logs }`
  shortcut @dev names as the trap, which confirms that claim empirically. **The control can fail:**
  a view forwarding `entries: () => []` reddens **exactly 1** test, the control itself, and not the
  guard. LOW-2, LOW-3 and LOW-4 are all closed and each is falsified — `targetPolicy` on the real
  `ACCEPTED_JOB_KEYS` now reddens exactly 1 named test where it previously left 886 green.
  Every number reproduced: backend **834 / 23 / 6**, same 14 classes, same counts, zero in
  `studio`; runner **43 / 887 / 10**; fixtures **5 / 85 / 7**; static gates `--rerun-tasks` and
  coverage both BUILD SUCCESSFUL with no threshold lowered and `studio.dispatch` up to 91.19 %;
  `openapi.yaml` and `BASE_SHA256` still `cbf07c99…`. **The +3 / +1 deltas are not arithmetic:** I
  diffed the test-name sets between my two backend runs and the difference is exactly
  `ValidateRequest`, `aRevisionWithNoUsableRuntimeBudget…` and `aRevisionWithAUsableBudget…`, with
  **nothing removed**. Both my corrections were taken accurately.
  **One residual, LOW-6, and I checked whether it is the second door before calling it low.**
  `LogBuffer.entries()` returns the **live internal array** (same reference across calls, and
  `body.logs === view.entries()`), so a producer can still write into the buffer via
  `(snapshot.logs.entries() as LogEntry[]).push(...)`. That makes the new test's *name* — *"offers
  no way into the bounded buffer except `appendLog`"* — literally false, which is the sixteenth
  shape recurring inside its own fix. **But the AC-22 hazard does not transfer**, and I established
  that rather than assuming it: the push skips the truncating `slice`, so the **whole** value lands
  on the body and the outbound redactor matches it. Driving that exact mutation through the canary
  harness leaves it **fully green, 25 passed / 8 skipped** — no canary escapes. What does transfer
  is the **bounding** guarantee: 250 entries survive a `maxLogEntries` of 200 with `truncated` still
  `false` and `dropped` still `0`. Pre-existing, not a redaction leak, not this story's subject.
  **Gate moves CONCERNS -> PASS.**
  ---
  **FIRST PASS, commit `841bfdd4d` (superseded, retained for the record).**
  **The story's own subject is verified and strong; one routed-in criterion is not met as written.**
  `DEF-01` is genuinely closed and the discipline around it held: `4c7abee4c` is one file, 218
  insertions, test-only, and the only change to it in the fix commit is the `.send(...)` argument
  swapped for `RunJobFixtures.conformingJob()` plus one now-unused import — the assertion body is
  byte-identical, exactly as @dev volunteered. The dispatcher now reads `resolved.variables()`,
  `resolved.secrets()` and `resolved.secretVersions()`; `callbackBaseUrl` is gone from
  `backend/src/main` except as the non-vacuity control's forbidden key. `FOC-05` is clean: neither
  `openapi.yaml` nor `test/run/confinement.test.ts` is in the diff, both are byte-unchanged against
  `50f770ed2`, and `shasum` returns the digest `BASE_SHA256` holds. Every number @dev reported
  reproduced **exactly** on my own runs — backend `831 / 23 failed / 6 skipped` twice, the same 14
  classes with the same counts and zero in `studio`; runner `43 / 886 / 10`; fixtures `5 / 85 / 7`.
  I re-ran **nine** mutations (M1, M2, M4, M5, M6, M7, M8, M9, M10 and the DEF-01 producer
  mutation) and every one produced the named red @dev recorded, including M10's four fixtures-tier
  reds with real Chromium pids under the process-table assertion.
  **What holds the gate at CONCERNS is QA-1.** AC-22's own stated falsification — *"route one
  existing producer around the redactor -> red; restore"* — leaves the runner suite **fully green,
  886 passed, 43/43 files**. `RunSnapshot.logs` is public, `snapshot.logs.append` bypasses the
  redactor, and a throwaway probe confirms a producer reaching the buffer that way leaks the whole
  value and, past the cut, a raw 12-character fragment. The test named
  *"enumerates the producers reachable from a run and finds one call site, which is the guard"*
  enumerates nothing — it re-asserts its sibling's planted-canary property under a structural name,
  and the structural claim lives only in a comment. AC-22 is ticked and the guard it promises does
  not exist. It is a **latent** trap, not a live leak (`appendLog` is still the only caller of
  `logs.append` in `src/`), which is why this is CONCERNS and not FAIL — but it is the same latent
  trap AC-22 was routed in from 10.13's gate to close, so it must carry an owner rather than a tick.
  **This is the epic's sixteenth vacuous-guard shape** and the story ships two instances of it: the
  second is AC-16b's gate-shut sibling, whose comment says *"the envelope's accepted key set carries
  no policy field"* while its body iterates `validJob()`, a hand-built test fixture. Adding
  `targetPolicy` to the real `ACCEPTED_JOB_KEYS` leaves 886 green.
  Three smaller corrections to the Dev Agent Record, all in the safe direction, are recorded below.
