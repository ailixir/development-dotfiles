post_gate_fixes:
  applied: "2026-09-10 — @dev (Dex), after the gate, on branch story/10.4"
  scope: "CompileStateService and its tests only; no migration, entity, DTO or endpoint change."
  issue_001: >-
    The publish transitions now name the revision pair they compiled against. publishCandidate,
    publishInvalid and publishError take the CompileRequest itself instead of (requestId,
    sourceRevision), and every guard — including publishCandidate's SELECT ... FOR UPDATE — adds
    "AND configuration_revision = ?". The alternative (nulling compile_request_id in updateTest) was
    rejected: it makes correctness depend on a companion write by a different class, so any future
    writer of the revision columns reintroduces the hole silently. The chosen guard is evaluated
    inside the conditional statement itself, and PostgreSQL re-evaluates that predicate against the
    committed row version once the row lock is granted, so no interleaving of editors and publishers
    can let a stale compile land. publishCandidate additionally rejects a CandidateRevision whose
    configurationRevision differs from the request's.
  issue_002: >-
    confirm's ui_tests UPDATE now carries "AND compile_status = 'AWAITING_CONFIRMATION'" as an
    explicit precondition on top of the exact-match body check, and publishError clears
    current_candidate_revision_id symmetrically with publishInvalid. STALE -> READY and
    COMPILING -> READY are both unreachable, and a recorded compile_error can no longer be cleared
    by a confirmation.
  issue_003: "Behaviour deliberately unchanged; carry-forward sharpened above for 10.8."
  tests_added:
    - "aConfigurationEditDuringAnInFlightCompileDiscardsEveryResultOfThatCompile — drives the real StudioService.updateTest, then asserts all three publish paths are discarded and leave STALE untouched."
    - "aPublishQueuedBehindAnUncommittedEditIsDiscardedWhenTheLockIsGranted — an editor holds the draft's row lock in an open transaction, the in-flight publish queues behind it on pg_stat_activity, the editor commits, and the publish is discarded on the lock grant."
    - "publishErrorLeavesNoConfirmableCandidateBehind — STALE -> READY is unreachable and the error survives."
    - "confirmRejectsADraftThatIsNotAwaitingConfirmation — a recompile leaves the reviewed candidate current but the draft is no longer offering it."
    - "aConfirmQueuedBehindAnUncommittedCompileFailureIsRejected — a compile failure holds the row lock, a stale tab's confirm queues behind it, and is rejected with STALE_CANDIDATE once the failure commits."
  interleavings_are_deterministic: >-
    Both interleaving cases hold one transaction open on a latch and poll pg_stat_activity until the
    other backend is genuinely queued on the ui_tests row lock, so the dangerous ordering is the one
    asserted rather than whichever ordering the scheduler happened to pick. A first, barrier-based
    draft of these cases was discarded precisely because it passed against the unfixed code.
  negative_control: >-
    With the three guard clauses neutralised in place (configuration_revision predicate disabled,
    AWAITING_CONFIRMATION precondition removed, publishError's candidate clear removed), all five new
    cases FAIL; with the fix in place all five PASS, repeated three times with no flake.
  evidence:
    - command: "./gradlew test --tests 'com.citi.put.checks.studio.*' --rerun"
      result: "BUILD SUCCESSFUL — 41 passed, 0 failed, 2 skipped (RevisionRetentionIT, AC-20 deferral unchanged)"
    - command: "./gradlew spotlessCheck checkstyleMain checkstyleTest spotbugsMain"
      result: "BUILD SUCCESSFUL"
    - command: "./gradlew check --continue"
      result: >-
        BUILD FAILED — 324 tests completed, 23 failed, 2 skipped. Same 23 failures and the same 14
        failing classes as the pre-fix baseline recorded above; zero failures in
        com.citi.put.checks.studio. Test count rose 319 -> 324 for the five new cases.
  re_adjudication: >-
    AC-8, AC-12 and AC-13 are still marked CONCERNS in ac_coverage above and the gate verdict is
    still CONCERNS. Re-scoring them is @qa's call, not the fixing developer's; this block records
    what changed and how it was verified.

