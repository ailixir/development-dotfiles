schema: 1
story: "10.4"
story_title: "Immutable revisions and compile state"
epic: "EPIC-10"
wave: 1
gate: CONCERNS
status_reason: >-
  Every non-deferred acceptance criterion is implemented and verified on this story's own surface:
  V12 is the only migration added, it applies on top of V11 against a real PostgreSQL 15, revision
  immutability is enforced by a database trigger (not only by Java), the optimistic PUT and the CSI
  immutability paths return the specified 409 codes under a real lost-update race, and quarantine
  preserves every authored test. Three medium state-machine defects remain: the three publish
  transitions are not conditional on configuration_revision and compile_request_id is not cleared
  when a revision increments, so a late compile result can overwrite the AC-8 STALE with an
  unconfirmable AWAITING_CONFIRMATION; confirm does not require AWAITING_CONFIRMATION, so a draft
  parked in STALE by publishError can still be driven straight to READY; and beginCompile is
  unconditional, so a failed recompile de-readies a previously confirmed draft. None of these breaks
  the safety invariant — an artifact the author did not review can still never be confirmed — so the
  story merges with follow-ups booked against 10.8/10.9. AC-20 is honestly deferred.
reviewer: "Quinn (Guardian) — @qa"
updated: "2026-09-10"

