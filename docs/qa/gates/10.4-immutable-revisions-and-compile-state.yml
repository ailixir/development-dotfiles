migration_review:
  only_migration_added: "V12__ui_test_revisions_and_compile_state.sql"
  v13_v14_absent: true
  applies_on_v11: "Verified — Flyway target=11, seed, target=12 against postgres:15-alpine"
  forward_only: "Yes — additive DDL plus one data UPDATE; no DROP of existing objects (section 8.1)"
  partitioning: >-
    ui_tests is a plain table (V1), so REFERENCES ui_tests(id) is valid. V12 adds no FK into the
    range-partitioned ui_test_executions (PK (id, started_at)) — that reference belongs to 10.1's
    V14. RevisionRetentionIT already addresses execution rows by the (id, started_at) pair.
  write_once_trigger: >-
    trg_ui_test_revisions_write_once enumerates all 15 immutable columns with IS DISTINCT FROM and
    blocks re-confirmation; ck_ui_test_revisions_confirmation_pair keeps confirmed_by/at in step.
    Proven by RevisionMigrationIT.rejectsAnyMutationOfAStoredArtifact and
    acceptsTheFirstConfirmationAndRejectsASecond. Java adds defence in depth: no setters,
    updatable=false on every column.
  quarantine_check: >-
    The DO block only UPDATEs quarantined_at. It never DELETEs and never writes csi_id, so the CHECK
    cannot be satisfied by discarding or reassigning an authored test (BRD section 9). Asserted by
    keepsQuarantinedRowsWithTheirOriginalCsiAndSteps.

