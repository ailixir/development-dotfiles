issues:
  - id: ISSUE-001
    severity: medium
    category: correctness
    ac: ["AC-8", "AC-11", "AC-12"]
    finding: >-
      publishCandidate, publishInvalid and publishError are conditional on
      (id, compile_request_id, source_revision) only, and StudioService.updateTest does not clear
      compile_request_id when it increments a revision. A configuration change made while a compile
      is in flight therefore does not stop that compile from publishing: the AC-8 STALE is
      overwritten with AWAITING_CONFIRMATION pointing at a revision whose configuration_revision is
      already superseded. Because confirm() does match configuration_revision, that candidate can
      never be confirmed, so the draft is parked in a terminal-looking state until someone
      recompiles. Empirically reproduced (see evidence).
    impact: >-
      No approval breach — an artifact the author did not review still cannot be confirmed or
      become READY. The defect is a wrong compile_status and a dead-end candidate.
    suggested_fix: >-
      Add "AND configuration_revision = ?" to the three publish WHERE clauses (passing
      CompileRequest.configurationRevision), or null compile_request_id whenever either revision
      increments in updateTest. Both are one-line changes; the second also covers publishInvalid and
      publishError.
    suggested_owner: dev
    status: resolved
    resolution: >-
      Fixed on story/10.4 (see post_gate_fixes) — all three publish transitions now condition on
      configuration_revision as well, taken from CompileRequest, so the guard is intrinsic to the
      statement instead of depending on updateTest clearing compile_request_id.
  - id: ISSUE-002
    severity: medium
    category: correctness
    ac: ["AC-12", "AC-13"]
    finding: >-
      publishError sets compile_status = 'STALE' with compile_error but, unlike publishInvalid, does
      not clear current_candidate_revision_id. confirm() does not require
      compile_status = 'AWAITING_CONFIRMATION'. A stale tab can therefore drive STALE -> READY
      directly, silently clearing the recorded compile_error.
    impact: >-
      The confirmed artifact is still exactly the one the author reviewed and still matches both
      revisions, so this is a state-machine inconsistency with Architecture v2.1 section 4 rather
      than a safety breach.
    suggested_fix: >-
      Either add "AND compile_status = 'AWAITING_CONFIRMATION'" to confirm's ui_tests UPDATE, or
      clear current_candidate_revision_id in publishError for symmetry with publishInvalid.
    suggested_owner: dev
    status: resolved
    resolution: >-
      Fixed on story/10.4 (see post_gate_fixes) — both remedies applied: confirm's ui_tests UPDATE
      now requires compile_status = 'AWAITING_CONFIRMATION', and publishError clears
      current_candidate_revision_id, so STALE -> READY is unreachable and no compile_error is
      silently discarded.
  - id: ISSUE-003
    severity: medium
    category: design
    ac: ["AC-10", "AC-12"]
    finding: >-
      beginCompile is unconditional on the current compile_status, so it moves a READY draft to
      COMPILING; if that compile then fails, publishError leaves it STALE. A previously confirmed,
      unedited test is thereby made non-runnable by a gateway outage on an optional recompile.
      AC-12 mandates the STALE, so this is AC-conforming, but it is a live hazard for the readiness
      gate.
    impact: "Downstream — 10.8 readiness enforcement and 10.9's repair loop."
    status: accepted-by-design
    suggested_fix: >-
      Not a defect and deliberately NOT changed in the 10.4 fix round: beginCompile must move the
      draft to COMPILING unconditionally and publishError must fall back to STALE, both of which
      AC-10 and AC-12 mandate. 10.8 therefore inherits it as a hard constraint, not as a bug to
      re-litigate.
    carry_forward_to_10_8: >-
      compile_status alone is NOT a runnability predicate. After this fix a failed optional
      recompile leaves a previously confirmed, unedited draft at STALE with compile_error set,
      confirmed_revision_id still populated and current_candidate_revision_id cleared by
      publishError. 10.8's readiness gate MUST therefore key on "confirmed_revision_id is non-null
      AND the revision it points at still carries the draft's current source_revision and
      configuration_revision", treating compile_status only as the compile-pipeline's own progress
      field. If 10.8 keys readiness on compile_status = 'READY', a gateway outage on an optional
      recompile makes a confirmed test non-runnable — the exact hazard recorded here. 10.9's repair
      loop must read the same predicate so it does not try to "repair" a draft that is already
      confirmed and runnable.
    suggested_owner: dev
  - id: ISSUE-004
    severity: low
    category: security
    ac: ["AC-4"]
    finding: >-
      V12 installs a BEFORE UPDATE trigger only. Nothing blocks DELETE on ui_test_revisions; only
      rows referenced by ui_tests.current_candidate_revision_id / confirmed_revision_id are
      FK-protected, and V14's executions.revision_id will extend that to executed rows. Historical
      unreferenced revisions remain deletable by direct SQL. AC-4 names UPDATE only.
    suggested_fix: "Consider a BEFORE DELETE trigger in a later migration, or accept and document."
  - id: ISSUE-005
    severity: low
    category: security
    ac: ["AC-9"]
    finding: >-
      ui_tests.csi_id immutability is enforced only in StudioService.updateTest. The V12 CHECK
      (csi_id IS NOT NULL OR quarantined_at IS NOT NULL) does not prevent direct SQL from
      reassigning a test to another registered CSI. Revision-level csi_id is DB-enforced by the
      write-once trigger, so historical evidence cannot move; only the draft can. AC-9 is
      API-scoped, so this is conforming.
  - id: ISSUE-006
    severity: low
    category: test-quality
    ac: ["AC-15"]
    finding: >-
      RevisionMigrationIT drops ui_tests_csi_id_fkey to seed the unregistered-CSI row and does not
      restore it for the remaining assertions in the container. The scenario cannot occur while the
      V1 FK is in place; the justification (restored dumps, retired CSIs) is documented in the test.
  - id: ISSUE-007
    severity: low
    category: design
    finding: >-
      insertOrReuseRevision's ON CONFLICT DO NOTHING reuse path returns an existing — possibly
      already confirmed — revision, carrying the earlier compile's created_by and provenance. The
      developer documented the consequence for 10.9 (confirm answers 409 STALE_CANDIDATE, which the
      repair loop must read as "already confirmed").
  - id: ISSUE-008
    severity: low
    category: completeness
    ac: ["AC-7"]
    finding: >-
      ConfigurationChangeClassifier does not yet cover target policy selection, which Architecture
      section 4.2 lists as execution-affecting. No such field exists on the contract yet; the
      javadoc records the obligation to add it with the destination policy work.
  - id: ISSUE-009
    severity: low
    category: security
    finding: >-
      publishInvalid accepts an unbounded diagnostics JSON string. The story explicitly defers the
      per-step message length and count limits to 10.8 section 4.3, so a hostile compile output can
      bloat compile_diagnostics until then.

