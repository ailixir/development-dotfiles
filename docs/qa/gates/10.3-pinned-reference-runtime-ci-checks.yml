# ─────────────────────────────────────────────────────────────────────────────
# Issues
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: MED-1
    severity: medium
    title: An omitted IMAGE_TAG build arg records image as "" and --require-image accepts it
    ac: AC-3
    finding: >-
      The Dockerfile declares `ARG IMAGE_TAG=` with an empty default and exports it as
      `ENV IMAGE_TAG=${IMAGE_TAG}`, so inside the image the variable is always defined. In
      write-runtime-versions.mjs the expression is `env.IMAGE_TAG ?? null`, which keeps the empty
      string. check-pins.mjs then tests `runtime[field] === null || undefined` and so does not
      raise NOT ASSERTED for an empty tag.
    proof: >-
      buildRuntimeVersions with env.IMAGE_TAG = '' yields image: "". With chromiumBuild populated
      and image set to "", `check-pins.mjs --require-image` exits 0 and prints "check:pins OK".
    impact: >-
      CI stage 6a is the stage that makes the browser build part of the pin. If the pipeline builds
      the image without --build-arg IMAGE_TAG — exactly the operator slip stage 6a exists to
      catch — the image field is silently recorded as empty and passes the gate that AC-3 says must
      never be a pass. No capability is gained; the risk is a deployed image whose recorded
      provenance cannot name itself.
    suggested_action: >-
      Coerce empty to null at the source (`env.IMAGE_TAG || null`) and additionally treat an empty
      string as unasserted in check-pins.mjs, with a test for the empty-tag case.
    owner: '@dev'
    blocking: false
    status: RESOLVED
    resolution: >-
      Fixed at both ends — `optionalEnv` in write-runtime-versions.mjs records an absent, empty or
      whitespace-only IMAGE_TAG as null, and `isAsserted` in check-pins.mjs treats all three as NOT
      ASSERTED for chromiumBuild and image. Falsified with chromiumBuild populated: unset, empty and
      whitespace all exit 1 naming "image is not asserted"; a real tag exits 0. Six tests added.

  - id: MED-2
    severity: medium
    title: The recorded Node version is never asserted against .nvmrc, contrary to ADR-001 §4.2
    ac: AC-1 (ADR-001 §4.2 obligation assigned to story 10.3)
    finding: >-
      ADR-001 §4.2 states "CI (story 10.3) asserts all four agree and that `node --version` inside
      the image matches `engines`/`.nvmrc`". check:pins asserts engines-floor vs .nvmrc and
      nodeMajorPin vs .nvmrc — both of which are copies of the declaration, not of reality — but
      never compares the recorded `node` field, which is the only value derived from the runtime
      that actually executed.
    proof: >-
      The image built from this Dockerfile reports node v24.20.0 while .nvmrc says 22 and
      ci/stages.md states "Node major must match .nvmrc (22)". Running the documented stage 6a
      against that image's runtime-versions.json exits 0 with "check:pins OK".
    impact: >-
      A live major-version drift between the declared Node and the Node the image runs is
      undetected by the check that exists to detect drift, and the hand-off document tells @devops
      something untrue about the image. The engines range does permit 24, so nothing breaks today;
      the defect is that the pin cannot tell.
    suggested_action: >-
      Assert semver-major of `runtime.node` against `.nvmrc` whenever the recorded copy is present,
      and reconcile .nvmrc / engines / ci/stages.md with the Node the pinned image actually ships
      (or pass ED-05 the requirement that it ship 22).
    owner: '@dev' (with @architect for the .nvmrc-vs-image reconciliation)
    blocking: false
    status: RESOLVED
    resolution: >-
      `.nvmrc` made authoritative for the Node major the image must ship (ADR-001 §4.2 scopes the
      obligation to the image; engines.node left at 10.2's deliberate range). check:pins now asserts
      the recorded node against engines.node everywhere and against the .nvmrc major whenever the
      record came from inside the image (evidenced by chromiumBuild, which --require-image makes
      non-strippable). Consequence accepted, not waived: the public base image's Node v24.20.0 now
      fails --require-image loudly; .nvmrc was not widened. Handed to ED-05 as ci/stages.md open
      item O-2a. Falsified: QA's in-image record replayed verbatim exits 1; node v22.11.0 exits 0;
      breaking it back to v23.10.0 exits 1. Nine tests added.

  - id: LOW-1
    severity: low
    title: check:pins exits 0 when dist/ is absent, leaving the fourth copy unasserted
    detail: >-
      Documented and printed as NOT ASSERTED, and --require-image catches it, but a plain-Node
      pipeline that runs stage 3 before stage 5 and never runs 6a asserts only three copies.
      ci/stages.md is explicit about this ordering, so it is a documentation-mitigated gap.
    owner: '@dev'
    blocking: false

  - id: LOW-2
    severity: low
    title: CR-002 residue — a new AST node kind still forces no fixture
    detail: >-
      Disclosed by the developer. Methods and option keys are now keyed on the validator surface;
      node kinds are not, because there is no registry to key on. Carry as an open CR-002
      remainder rather than closing CR-002.
    owner: '@dev'
    blocking: false

  - id: LOW-3
    severity: low
    title: Coverage figure in the story is slightly optimistic
    detail: >-
      The Dev Agent Record records scripts/** branches at 84.53%; the reviewer measured 83.67% on
      the same commit from a clean install. Both above the 80% gate. Correct the figure.
    owner: '@dev'
    blocking: false

