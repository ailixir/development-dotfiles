schema: 1
story: '10.3'
story_title: Pinned reference/runtime CI checks
epic: EPIC-10
wave: 1

gate: CONCERNS
status_reason: >-
  All 12 non-deferred acceptance criteria are implemented and independently verified from a clean
  install; npm ci, build, type-check, lint, test (308), check:pins and test:fixtures (58 passed,
  1 skipped) all exit 0. The pin check was falsified copy by copy: every one of the five asserted
  copies was deliberately broken in turn and check:pins exited 1 naming the offending copy each
  time. The manifest completeness test was falsified the same way and goes red naming the exact
  uncovered method or option key. AC-6b is a genuine deferral — an it.skip that reports as skipped
  and is recorded as "skipped — not passed" in ci/stages.md. Two medium findings keep this off
  PASS, both in the in-image half of the pin: an omitted IMAGE_TAG build arg records image as ""
  rather than null, which --require-image accepts as a pass; and the recorded Node version is
  never asserted against .nvmrc, which ADR-001 §4.2 assigns to this story — proven by a real image
  build that ships Node v24.20.0 against a .nvmrc of 22 while check:pins --require-image says OK.

reviewer: Quinn (@qa)
