# ─────────────────────────────────────────────────────────────────────────────
# Pin-check falsification — every copy broken in turn, then restored
# ─────────────────────────────────────────────────────────────────────────────
pin_check_falsification:
  method: >-
    Each copy mutated in the real package root, `npm run check:pins` run, exit code and message
    captured, then the file restored with `git checkout --` (or the package rebuilt for the
    generated copy). Working tree verified clean afterwards.
  cases:
    - copy: package.json dependencies.playwright
      mutation: 1.63.0 -> 1.99.0
      exit_code: 1
      named: >-
        "the Playwright pin disagrees across copies" listing package.json = 1.99.0 against the
        three copies at 1.63.0
      detected: true
    - copy: package-lock.json packages['node_modules/playwright'].version
      mutation: 1.63.0 -> 1.98.0
      exit_code: 1
      named: >-
        disagreement listed with the lockfile at 1.98.0, plus a second failure
        "runtime-versions.json playwrightLocked is stale"
      detected: true
    - copy: Dockerfile ARG PLAYWRIGHT_VERSION
      mutation: 1.63.0 -> 1.97.0
      exit_code: 1
      named: >-
        disagreement listed with the Dockerfile ARG at 1.97.0, plus
        "runtime-versions.json playwrightImageTag is stale"
      detected: true
    - copy: dist/runtime-versions.json playwright
      mutation: 1.63.0 -> 1.96.0
      exit_code: 1
      named: disagreement listed with the recorded copy at 1.96.0
      detected: true
    - copy: .nvmrc vs engines.node floor (direction A)
      mutation: .nvmrc 22 -> 24
      exit_code: 1
      named: >-
        "the Node major disagrees across copies" with the engines floor at 22 and .nvmrc at 24,
        plus "runtime-versions.json nodeMajorPin is stale"
      detected: true
    - copy: .nvmrc vs engines.node floor (direction B)
      mutation: engines.node ">=22.11.0 <25.0.0" -> ">=24.0.0 <25.0.0"
      exit_code: 1
      named: floor major 24 against .nvmrc 22
      detected: true
  additional_probes:
    - probe: declared pin expressed as a range (^1.63.0)
      exit_code: 1
      detail: '"is not an exact version. ADR-001 §4.2 requires an exact pin with no range operator."'
    - probe: --require-image with chromiumBuild and image null
      exit_code: 1
      detail: both NOT ASSERTED entries are promoted to failures and named individually
    - probe: --require-image with chromiumBuild and image populated
      exit_code: 0
      detail: passes, so the flag is not a blanket failure
    - probe: dist/ removed entirely
      exit_code: 0 plain / 1 under --require-image
      detail: >-
        reports "dist/runtime-versions.json is absent (run `npm run build` first)" as NOT ASSERTED.
        Documented behaviour, but the fourth copy is unasserted on a plain run — see LOW-1.
  verdict: >-
    The pin check provably fails on every broken copy and names the offending copy in each case.
    It is not a check that can only agree.

# ─────────────────────────────────────────────────────────────────────────────
# Completeness falsification — manifest keyed on the validator surface
# ─────────────────────────────────────────────────────────────────────────────
completeness_falsification:
  method: >-
    src/validator/language.ts mutated to permit something no fixture exercises, then
    `vitest run test/reference-manifest.test.ts` executed; file restored with git checkout --.
  cases:
    - mutation: added method toBeEnabled to LOCATOR_ASSERTIONS with no fixture
      exit_code: 1
      detected: true
      detail: >-
        two failures — "demonstrates every permitted method" naming ['toBeEnabled'] and
        "demonstrates every permitted option key" naming ['toBeEnabled.timeout'].
        2 failed | 38 passed.
    - mutation: added option key noWaitAfter to ACTION_METHODS.click with no fixture
      exit_code: 1
      detected: true
      detail: >-
        "demonstrates every permitted option key" names ['click.noWaitAfter'].
        1 failed | 39 passed.
  design_verified: >-
    The surface is read from the five tables in src/validator/language.ts at run time and each
    example's claimed coverage is re-derived from the typed operations validateArtifact produces
    for it, so a manifest entry cannot claim coverage it does not have. This is a real replacement
    for the textual `method(` search 10.2's CR-002 flagged, not a restatement of it.
  residual_gap:
    finding: >-
      A new AST *node kind* — as opposed to a permitted method or option key — still forces no
      fixture. There is no permitted-node-kind registry for the manifest to key on; ast.ts
      enumerates kinds in switch statements. Confirmed by inspection.
    judgement: >-
      ACCEPTABLE FOR THIS STORY, recorded as LOW-2. AC-4 asks for coverage of "the permitted method
      in the validator's surface schema", which is exactly what was delivered and falsified. The
      developer disclosed this residue unprompted in the Dev Agent Record. It should be carried as
      an explicit CR-002 remainder rather than closed silently.

