    result: NOT TREATED AS A FINDING
    detail: >-
      Deferred to 10.18 per @po's confirmed declination. The reviewer did not re-attack it. SEC-1
      was re-verified and is not regressed (see developer_claims_verified).

# ─────────────────────────────────────────────────────────────────────────────
# Findings
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: QA-1
    severity: HIGH
    title: The relay's no-newline overflow branch splits a resolved value before redacting it
    ac: AC-8, AC-7a
    file: studio-runner/src/run/outputRelay.ts:150-153
    finding: >-
      See eighth_vacuous_guard above for the full proof. Two independent reproductions: a direct
      unit probe over the real relay and the real redactor, and the story's own canary matrix with
      the trailing newline removed from the planted line (4 tests red across all three shapes).
    why_it_survived_review: >-
      The redact-before-truncate guard and the no-newline-bound guard each cover one half of the
      property and neither covers the intersection. Line coverage on the module is 98.68 %.
    action: >-
      Fix the split order and add one planted canary line without a trailing newline to the AC-7a
      matrix. The fix is contained to one `while` loop.

  - id: MED-1
    severity: MEDIUM
    title: AC-11a's launch-failure path has no real-browser observation and is not structurally covered
    ac: AC-11a, AC-11b
    finding: >-
      Four of six paths rest on `child.killed` / `pool.inUse` / `scratch.list()` against the fake
      spawner. Three of them (step failure, run fault, drain) reach the identical
      `signalProcessTree` that the two observed paths prove. Launch failure does not: no
      `session.run` exists, the coordinator throws before `terminate` is registered, and the reaping
      is the launcher's launchTimeout path.
    action: >-
      AC-11b (ED-05 / 10.18) must name the launch-failure path explicitly among the six it proves
      in-image, rather than leaving it inside "the same six paths".

  - id: LOW-1
    severity: LOW
    title: AC-14's derived bound equals vitest's default testTimeout, so it can never be the discriminator
    ac: AC-14
    finding: >-
      `config.validateTimeoutMs` defaults to 5 000 ms and vitest.config.ts sets no `testTimeout`,
      so the unit tier's default is also 5 000 ms. Under MH-4b the reviewer's run died with
      "Test timed out in 5000ms", NOT with `expect(elapsedMs).toBeLessThan(boundMs)`. Any violation
      large enough to trip the derived bound also trips the framework's timeout first, so the
      assertion the developer describes as "the bound is live, not decorative" is in fact strictly
      dominated. The *criterion* is still falsifiable — the test does go red — but the derived
      bound is not what makes it so. The developer's narrower claim (the test reads the config
      rather than restating the number) is true and was verified.
    action: >-
      Set `testTimeout` in vitest.config.ts above `validateTimeoutMs`, so the derived bound is the
      assertion that fires. One line.

  - id: LOW-2
    severity: LOW
    title: The "recorded before the signal" ordering is pinned for orderedStopCompleted but not for killReason
    ac: AC-3
    finding: >-
      Moving `killReason ??= reason` to after `await stop()` inside `SessionRun.kill` leaves the
      suite fully green (849 passed). What the suite pins is the resulting *value*
      (`total-timeout`), which M9b falsifies on 11 tests. The temporal property AC-3 states —
      "records the timeout kind before killing" — is therefore protected only by the shared-promise
      arrangement, not by an assertion. For `orderedStopCompleted` the temporal property IS
      load-bearing and IS falsifiable (M10), which is the case that mattered.
    action: Optional. Note it rather than add a timing assertion that would pin an implementation detail.

  - id: LOW-3
    severity: LOW
    title: Part of AC-7a's 408 is clean by construction on the kill path
    ac: AC-7a
    finding: >-
      On a killed run `outcome.errorMessage` is `KILL_MESSAGES['total-runtime']`, a module constant
      (src/run/launcher.ts:552-554 selects it whenever `killReason !== null`), so the child's
      canary-bearing `failureMessage` is discarded before it gets there; and `spawnArgs` is asserted
      `toEqual([])`. Those two surfaces cannot carry the canary on the path the matrix drives, so
      roughly 16 of the 136 assertions per shape are defensive rather than load-bearing. The control
      test ("the experiment is capable of failing") proves the relay surface and the scratch capture
      are genuinely reached, but not the other fifteen.
    not_a_defect_because: >-
      Every other surface IS reached with the canary — the child emits a `step-finished` carrying
      `leak.stepFailure`, writes `leak.stderr` on both streams, and the terminal retry is forced to
      three attempts so the byte-identical bodies are real. A defensive `not.toContain` over a
      constant is not wrong; it is simply not evidence. Recorded so "408" is read accurately.
    action: >-
      Extend the control test to assert the control value is found on each of the 17 surfaces it
      can reach, so the matrix's reach is measured rather than argued.

  - id: LOW-4
    severity: LOW
    title: confinement.test.ts's "child_process nowhere else" scan omits three top-level source files
    ac: AC-20
    finding: >-
      `SOURCE_DIRECTORIES` is the hardcoded list ['validator','executor','server','reporting',
      'compat']. `src/main.ts`, `src/index.ts` and `src/versions.ts` are not scanned, so a
      `node:child_process` import added to `src/main.ts` would pass that assertion.
    not_a_defect_because: >-
      The primary mechanism is eslint.boundary-rules.js `RUN_ONLY_MODULES`, which restricts
      child_process to `src/run/**` across the whole package including src/main.ts, and
      `npm run lint` exits 0. This is defence-in-depth with a gap, not an unguarded surface.
    action: Optional — derive SOURCE_DIRECTORIES from the filesystem minus 'run'.

