    not_live_claim:
      dev_position: >-
        "Not live today, because the only producer of `failure` is the child, whose `safeMessage`
        redacts before truncating." Labelled by @dev as **inferred, not verified** — it read the
        call sites and did not drive a real child that violates the invariant.
      reviewer_verdict: >-
        **CORRECT, AND I RAISE IT FROM INFERRED TO VERIFIED — one step further than @dev took it.**
        The claim as phrased is slightly imprecise (there are *two* producers, not one), but the
        conclusion is sound and the imprecision does not weaken it.
      what_i_verified:
        - >-
          `grep -rn stepFinished src/` gives exactly three paths into
          `reportingStepReporter.stepFinished`: `src/executor/executor.ts:99` and `:126` (the
          in-process path, via `runCoordinator.executeInProcess`), and `src/run/launcher.ts:782`
          (the parent forwarding the child's `step-finished` message).
        - >-
          Both executor call sites take `failure` from the **single** construction site
          `executor.ts:112` — `failure = safeMessage(error, redactor, maxMessage)`. There is no
          other place in `src/` that assigns a step `failure`.
        - >-
          `safeMessage` (`src/executor/redaction.ts:68-77`) redacts **then** truncates, which is
          the correct order.
        - >-
          `launcher.ts:782` is a pass-through: it forwards the string the child already produced
          through the same `safeMessage`.
        - >-
          The redactor at `executor.ts:83` is built from `options.resolver.knownValues()`, which is
          the same value set as the parent's `createRedactor(knownValuesOf(job))` — so there is no
          window in which the child's redactor is narrower than the parent's and a value slips
          through `safeMessage` unscrubbed. (`knownValuesOf` additionally filters empty strings,
          which is immaterial.)
      conclusion: >-
        `failure` is always redacted before it reaches `reportingStepReporter`, so `bounds.ts`
        cuts text that is already scrubbed. **Not live today — VERIFIED.** No second producer
        exists, so the routing is not too slow.
    what_remains: >-
      A **latent trap**, not a live defect: `createLogBuffer.append` will fragment any future
      caller's unredacted string longer than `maxLogEntryLength`. Recorded as MED-3.
    routing: >-
      @dev suggested 10.17 or a 10.6-area fix. **The 10.6-area fix is the better owner** —
      `bounds.ts` is 10.6's module and the right change is structural (redact inside `append`, or
      make the pre-redacted precondition a type rather than a convention), not dependent on real
      secret material arriving. 10.17 is the right *deadline*, because that is when the trap
      becomes reachable.

  ninth_vacuous_guard:
    found: TRUE — ONE, LOW SEVERITY, IN THE NEW MATERIAL
    id: LOW-5
    test: >-
      test/run/outputRelay.test.ts "drops a long newline-less buffer wholesale once released,
      rather than cutting it"
    the_overclaim: >-
      Its second half carries the comment *"If the first buffer had been **retained** rather than
      discarded, the accumulated text would still be sitting in the relay and **would surface on
      the next flush**"*, followed by a second write, a `close()` and
      `expect(sink.text).not.toContain('qqq')`.
    why_it_is_vacuous: >-
      It would **not** surface, and I measured that it does not. Once `redactor === null`,
      `deliver` drops unconditionally, so nothing retained can ever be emitted — a different guard
      upstream already prevents the surfacing this one claims to detect. Under MQ-3b the whole
      suite is green, which includes this test: it passes identically under the mutation its own
      comment says it would catch. The first half (`sink.lines` empty, `dropped > 0`) is fine; the
      second half is decorative.
    the_shape: >-
      New again, and worth adding to the catalogue: **an assertion whose stated discriminating
      mechanism is pre-empted by a different guard, so it reads as load-bearing and is not.** It is
      why MQ-3b survives, and @dev reported MQ-3b as surviving without connecting it to this
      comment.
    severity: LOW — a comment/assertion mismatch, not a product defect. No value reaches any sink.
    action: >-
      Either delete the second half and the claim, or add the `retained` getter suggested above and
      assert on it, which would make both the comment true and MQ-3b red.

  med_1_reading:
    verdict: ACCURATE — VERIFIED AGAINST THE SOURCE
    detail: >-
      `src/run/launcher.ts:442-449`: when `inbox.awaitReady(options.launchTimeoutMs)` returns a
      non-ready outcome the launcher calls `child.kill()`, closes and releases the relay, and
      throws `LaunchFailure`. The coordinator's own `try` around `launcher.launch`
      (runCoordinator.ts:413-428) converts it to a `RunFailure` **before** `terminate` is ever
      assigned or registered in `terminators`. So the skip body's statement is correct on every
      point: no `session.run`, the failure propagates before `terminate` registers, and the reaping
      is a different call site reached from `awaitReady` expiring rather than from a deadline.
    one_nuance: >-
      The *mechanism* does compose — `ChildProcessHandle.kill` is the same `signalProcessTree` call
      (launcher.ts:302). What does not compose is the **call site and the trigger**, which is the
      substantive point and is what the skip body says. Recording the phrase "does not compose" as
      accurate in the sense meant.
    placement: >-
      Put in AC-11b's `it.skip` body rather than in the criterion text, because @po owns acceptance
      criteria. Correct restraint, and the right place: whoever closes AC-11b reads that body.

