# ─────────────────────────────────────────────────────────────────────────────
# The eighth vacuous guard
# ─────────────────────────────────────────────────────────────────────────────
eighth_vacuous_guard:
  found: TRUE
  id: QA-1
  shape: >-
    NOT one of the five named prior shapes. A new one: **two guards each covering half of a
    property, with the branch that needs both never carrying the canary.** Line coverage reports
    98.68 % on the module and hides it, because the branch is exercised — just never with a value
    to scrub.
  the_two_halves:
    - >-
      test/run/outputRelay.test.ts "redacts **before** it truncates, so a cut cannot free half a
      value" plants the canary across the cut — but the planted line ends in `\n`, so it travels
      the *newline* delivery path, where the order genuinely is redact-then-truncate. This test is
      not vacuous; M5/MC-2 turn it red. It simply never reaches the other branch.
    - >-
      test/run/outputRelay.test.ts "bounds a stream that never writes a newline at all" is the one
      test that drives `write`'s overflow branch — and it is constructed with `values: []`, so the
      redactor has nothing to scrub and the test asserts only line lengths.
  the_defect: >-
    src/run/outputRelay.ts `write` lines 150-153:
    `while (buffer.length > maxLineLength) { deliver(stream, buffer.slice(0, maxLineLength)); ... }`.
    The slice happens **before** `deliver` calls `active.redact(raw)`. A known value straddling the
    cut is therefore split into two fragments, neither of which matches any variant `createRedactor`
    produces, and both are emitted. This contradicts the module's own header — *"Redacting the
    assembled line and bounding the result afterwards is the only order that holds"* — and it is
    not the honest limit the header concedes, because that one is about a value the **child** split
    across a newline; here the **relay itself** creates the split.
  proof_1_unit:
    method: >-
      Throwaway vitest file over the real `createOutputRelay` and the real `createRedactor`, with
      maxLineLength 400 and the chunk `'p'.repeat(385) + CANARY` and no newline.
    result: >-
      RED. Emitted line 1 ends `...pppCANARY-Zq7-p@ss` and line 2 is ` w0rd/+= trailing`. The
      `CANARY-Zq7-` fragment reached the sink verbatim.
  proof_2_end_to_end:
    method: >-
      Copied test/run/canary.test.ts and removed only the trailing `\n` from the three planted
      `${PAD}${CANARY} trailing` lines — the exact condition a killed child produces, since a child
      signalled mid-write does not terminate its line.
    result: >-
      RED, 4 failed / 3 passed. "the log sink carries a fragment of the canary" on shape 1, shape 2
      and shape 3, and "the log sink after the kill carries a fragment of the canary". The story's
      own harness catches it the moment the newline is removed.
  second_line_of_defence_does_not_help: >-
    INFERRED, not run. The coordinator's `diagnostics.write` hands the line to
    `logger.withRedactor(redactor)`, which serialises then redacts — but against the same known
    values, and a fragment matches none of them. The 10.6 sink cannot recover what the relay
    already split.
  severity: HIGH
  scope_of_impact: >-
    AC-8 and AC-7a, on the surface the epic's acceptance bullet names by hand ("Canary values never
    appear in **stdout**"). Today the values are planted canaries on `resolvedVars` /
    `resolvedSecrets`; story 10.17 replaces them with real vault material, at which point this
    becomes a real partial secret disclosure to persisted pod logs (§9.2).
  suggested_fix: >-
    Redact the buffer before the overflow split, or carry a `maxLineLength`-sized overlap across
    the cut so a value spanning it is still matchable, or refuse to split mid-buffer and instead
    drop-with-notice past the bound. Whichever is chosen, the canary matrix needs one planted line
    **without** a trailing newline, and the "bounds a stream that never writes a newline" test
    needs to stop running with `values: []`.

