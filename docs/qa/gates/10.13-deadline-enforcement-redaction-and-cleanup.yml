  residual_judgement:
    subject: >-
      @dev declares a residual: a value longer than a line that **also** spans a chunk boundary can
      still fragment, and removing it "would need the unbounded buffer the relay exists to prevent".
    is_it_real: YES — I REPRODUCED IT
    reproduction: >-
      A 1 022-character value (`SECRETBEGIN-` + 1 000 A + `-SECRETEND`) delivered as
      `'x'*100 + value.slice(0,900)` then `value.slice(900) + 'y'*50`, maxLineLength 400. The relay
      emits 2 lines and the first begins `xxx…SECRETBEGIN-AAAAAAAAAAAAAAAAAA` — roughly 300
      characters of the value, verbatim. PREFIX_LEAK=true.
    is_it_a_second_qa_1_wearing_a_disclaimer: >-
      **No — but the reason given for it is wrong, and that matters.** It is materially narrower
      than QA-1: QA-1 fired for *any* value near the relay's own deterministic cut, including a
      12-character one, on every newline-less overflow. This requires a value longer than
      `2 × maxLineLength` (800 characters by default) **and** a chunk boundary landing more than
      800 characters into it — non-deterministic, kernel-scheduled, and out of reach for ordinary
      secrets. I confirmed the *reducible* half is genuinely closed: a value shorter than a line,
      split across two chunks, now reassembles before anything is emitted (MQ-2 proves the tail is
      load-bearing), and a value longer than a line arriving whole in one chunk is scrubbed whole.
    but_the_justification_does_not_hold: >-
      "It cannot remove the general one without an unbounded buffer" is false. The buffer needed is
      bounded by the **longest known value**, which is a number the caller holds —
      `knownValuesOf(job)` in runCoordinator.ts:300 — and which the job envelope bounds. Retaining
      `max(maxLineLength, longestKnownValue)` instead of `2 × maxLineLength` closes the general
      case at bounded, declared memory. That is a smaller claim than unbounded, and it is available.
    why_it_is_not_blocking_here: >-
      Today every value is a planted canary of 12 to 23 characters, so the residual is unreachable
      on this story's own material. It becomes reachable when **10.17** substitutes real vault
      material, where a PEM key or a long JWT easily exceeds 800 characters. Recorded as MED-2 and
      routed there, with the fix named rather than left as "irreducible".
    and_it_has_no_guard: >-
      Stated because it is the shape that produced QA-1: **no test plants a value longer than
      `2 × maxLineLength` across a chunk boundary.** The limitation is documented in the module
      header and nowhere else. Whoever takes MED-2 should land the guard with the fix.

  bounds_ts_second_instance:
    routed_correctly: YES
    the_defect_shape: >-
      `reportingStepReporter.ts:139-141` builds `step {i} {status}: {failure}` and
      `createLogBuffer.append` in `src/reporting/bounds.ts` truncates it at `maxLogEntryLength`
      (400) **before** `reportClient` redacts the serialized body — the same cut-then-redact order
