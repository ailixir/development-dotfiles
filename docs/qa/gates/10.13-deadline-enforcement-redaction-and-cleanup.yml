    title: The relay's chunk-boundary residual is real, is unguarded, and its stated reason is wrong
    ac: AC-8, AC-7a
    owner: story 10.17 (deadline), 10.13-area fix
    finding: >-
      Reproduced: a 1 022-character value spanning a chunk boundary leaks ~300 characters of
      verbatim prefix. Unreachable on this story's 12-to-23-character planted canaries; reachable
      the moment 10.17 substitutes real vault material. The declared justification — that closing
      it needs an unbounded buffer — is false: the buffer needed is bounded by the longest known
      value, which `knownValuesOf(job)` already computes.
    action: >-
