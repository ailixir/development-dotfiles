final_decision:
  gate: PASS
  merge: SAFE
  statement: >-
    QA-1 is closed and I verified the closure three ways rather than accepting it: my own probe
    over the real relay now emits `…[REDACTED] tra…` where it emitted a value fragment before;
    MQ-1 turns exactly 6 tests red across both new guards, all three canary shapes and the AC-9
    post-kill test; and the guards genuinely straddle the cut, proven by putting the padding back
    to 385 and watching the guard pass. All gates reproduce at 853 / 2 / 41 and 80 / 7 / 4, the
    contract pin is still correctly un-anchored, and no threshold moved. The most valuable thing in
    this commit is not the fix: it is that @dev found my LOW-1 recommendation would have converted
    a framework failure into a silent pass, and I reproduced that — 6 051 ms, green. A reviewer's
    one-line suggestion was itself a vacuous-guard generator, and the story caught it. Two residuals
    stay open and are routed: the relay's chunk-boundary limit, which is real, reproduced, narrower
    than what it replaces, and justified for the wrong reason, and the latent truncate-before-redact
    in 10.6's `bounds.ts`, whose "not live" status I raised from inferred to verified. Neither is
    reachable on this story's own material. One ninth guard turned up — a comment claiming a
    mechanism a different guard pre-empts — and it is cosmetic. Nothing outstanding blocks. Merge.
