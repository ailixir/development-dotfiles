story_title: Deadline enforcement, redaction and cleanup
epic: EPIC-10
wave: 4

gate: CONCERNS
status_reason: >-
  Sixteen of the twenty non-deferred criteria were verified by running them, four criteria are
  honestly deferred as live `it.skip`s naming their owners, T-10.13.10 is correctly left undone
  and un-guessed, and one finding is new and is the reviewer's own. Every gate reproduces:
  `npm test` 849 passed / 2 skipped over 41 files exit 0, `npm run test:fixtures` against real
  pinned Chromium 80 passed / 7 skipped over 4 files exit 0, `lint`, `type-check`, `build` and
  `check:pins` all exit 0, `check:pins --require-image` exits 1 by design (ci/stages.md O-2a),
  `test/contract.test.ts` 14/14, `.nvmrc` reads 22. Coverage on `src/run/**` is 88.46 lines /
  87.62 branches against the 85/80 gate it declares and no threshold was lowered. The two defects
  @dev reports having found are real and the reviewer reproduced both mechanisms: replacing
  `signalProcessTree` with a complete no-op now turns the fixtures tier RED (the test hangs to its
  180 s bound on a SIGSTOPped Chromium that nothing reaches), and MT-1' and MT-2' each turn the
  unit tier red on 4 assertions and the fixtures tier red at the 30 s patience bound with a real
  orphaned browser. Both §17.4 counter-examples hold under M11. `docs/specs/studio/openapi.yaml`
  is byte-unchanged at 815aae9b… and the diff touches no `backend/**` file. The reconstructed
  `src/server/runCoordinator.ts` is clean, and the reviewer verified that against the base commit
  rather than against a green suite. What holds the gate at CONCERNS is QA-1: `outputRelay.write`'s
  no-newline overflow branch splits the buffer at `maxLineLength` **before** `deliver` redacts, so
  a resolved value straddling the cut reaches the pod log as two recognisable fragments. This is
  the eighth guard in this epic that could not fail — in a shape not yet on the named list — and
  the story's own canary harness proves it the moment the trailing newline is taken off the
  planted line.

