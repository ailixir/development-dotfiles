status_reason: >-
  **RECHECK, commit `4dc9516d4`.** QA-1 is closed and the closure was verified rather than
  accepted. My own probe over the real relay and the real redactor now emits one 400-character line
  ending `…[REDACTED] tra…` where it previously emitted `…pppCANARY-Zq7-p@ss` followed by
  ` w0rd/+= trailing`; both the whole-value and prefix flags are false. MQ-1 — restoring the
  shipped cut-then-redact order — turns **exactly 6** tests red: both new relay guards, all three
  canary shapes and the AC-9 post-kill test. I separately confirmed the guards genuinely straddle
  the cut rather than merely looking as though they do: with the padding put back to 385 and MQ-1
  still applied the guard **passes**, and at 394 it fails with line 0 ending `…qqqp@ss w` and line
  1 starting `0rd/+=rrr…`. The re-size is load-bearing and @dev's self-report of having repeated
  my own finding is accurate. MQ-2 is red on exactly 1 test. MQ-3b survives, and the "no public
  observable" characterisation is **verified**: I measured `emitted`, `dropped`, `released` and the
  emitted lines at three points under both versions and they are identical. All gates reproduce:
  `npm test` 853 passed / 2 skipped over 41 files, fixtures 80 / 7 over 4 files, lint, type-check,
  build and pins exit 0, `--require-image` exit 1 by design, contract 14/14, `openapi.yaml` still
  `815aae9b…`, `BASE_SHA256` untouched since the base commit, no `backend/**` file, `.nvmrc` 22.
  Coverage `src/run/**` 88.52 / 87.69, `outputRelay.ts` 98.82, against the unchanged 85/80 gate.
  **LOW-1 turned out to be deeper than I wrote it, and @dev corrected me.** My recommendation —
  raise the test timeout — would by itself have converted a framework failure into a *silent pass*,
  because the flood was pre-loaded before the clock started. I reproduced that: with the old
  pre-loaded arrangement and the new 20 000 ms timeout, a relay that blocks for six seconds makes
  the test **pass in 6 051 ms**. With the flood moved inside the measurement window the same
  mutation fails on the assertion itself — `expected 6002 to be less than 5000` — so `elapsedMs`
  is now the discriminator, which it never was. MED-1 is recorded accurately in AC-11b's skip body
  and I verified the reading against launcher.ts:442-449. The `bounds.ts` second instance is
  correctly routed and its "not live" claim is **verified**, one step further than @dev took it.
  Two residuals remain, both narrower than what they replace and both named rather than implied:
  the relay's chunk-boundary limit for values longer than `2 × maxLineLength` (MED-2, reproduced
  by me, and the stated justification for it is wrong even though the limitation is real), and the
  latent truncate-before-redact in `src/reporting/bounds.ts` (MED-3, out of this story's Scope).
  Neither blocks. Gate moves CONCERNS -> **PASS**.
  ---
  **FIRST PASS, commit `0ac098a58` (superseded, retained for the record).**
  Sixteen of the twenty non-deferred criteria were verified by running them, four criteria are
  honestly deferred as live `it.skip`s naming their owners, T-10.13.10 is correctly left undone
  and un-guessed, and one finding was new and mine: `outputRelay.write`'s no-newline overflow
  branch split the buffer at `maxLineLength` **before** `deliver` redacted, so a resolved value
  straddling the cut reached the pod log as two recognisable fragments — the eighth guard in this
  epic that could not fail, in a shape not then on the named list. The two defects @dev reported
  finding were real and I reproduced both mechanisms: a complete no-op kill turns the fixtures tier
  RED, and MT-1' and MT-2' each turn the unit tier red on 4 assertions and the fixtures tier red at
  the 30 s patience bound on a real orphaned browser. Both ADR-002 §17.4 counter-examples hold
  under M11.
