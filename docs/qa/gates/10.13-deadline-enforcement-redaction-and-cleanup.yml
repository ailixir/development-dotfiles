# ─────────────────────────────────────────────────────────────────────────────
# The reviewer's judgements the mission asked for
# ─────────────────────────────────────────────────────────────────────────────
mc5_judgement:
  claim_under_test: >-
    The developer claims MC-5 is "genuinely redundant: reportClient redacts the whole serialized
    body afterwards", and explicitly declines to claim a mutation proof for it.
  verdict: THE CLAIM IS CORRECT, AND THE HONESTY IS THE RIGHT CALL.
  evidence:
    - >-
      src/reporting/reportClient.ts:111 is `redactor.redact(serializeBounded(body, bounds))` — the
      whole serialized payload is redacted once, and the returned string IS the payload. Every
      field on the body, including `outcome.errorMessage`, is downstream of it.
    - >-
      test/run/canary.test.ts asserts `outcome.errorMessage` on
      `JSON.stringify(run.final.outcome)` where `run.final` is parsed from `bodies.at(-1)` — the
      bytes that were posted. So the surface the coordinator's field-level redaction would protect
      is already protected, on the same bytes, by the client.
    - >-
      The only consumer of the unredacted in-memory `outcome` object is the snapshot, which is
      serialized through the same client. No path reads it otherwise.
  characterisation: >-
    MC-5 is unfalsifiable **by construction**, not untested. That is a materially different thing
    from a guard that could not fail: there is no surface at which it could be observed, because
    the surface it would defend is defended twice. Leaving the call in place is correct — removing
    it would make wire redaction a single point of failure. No action required; the developer's
    refusal to claim a proof for it is the behaviour this epic wants.

ac_11a_partial_coverage_judgement:
  disclosure_under_test: >-
    Only success and runtime-deadline kill are observed by enumerating real pids. Step failure,
    launch failure, run fault and drain rely on unit-tier `child.killed` / `pool.inUse` /
    `scratch.list()` assertions — the same assertion shape that missed the vacuous kill.
  verdict: ACCEPTABLE, AS A NAMED CONCERNS ITEM — NOT A BLOCKER.
  reasoning:
    - >-
      The mechanism is shared and is now proven. `createForkSpawner`'s `ChildProcessHandle.kill`
      calls `signalProcessTree(pid, 'SIGKILL')` (src/run/launcher.ts:302), and every one of the six
      paths reaches the tree through `SessionRun.kill` or `session.close` -> `stop()` ->
      `child.kill()`. The defect the unit tier missed was in the *mechanism*, and the mechanism is
      falsified against real Chromium on two paths. `child.killed >= 1` on the other four is then
      a composition argument rather than an independent claim, and the composition is sound.
    - >-
      The one path where the composition is genuinely weaker is **launch failure**: there is no
      `session.run`, the coordinator throws before `terminate` is registered, and a half-started
      Chromium under a fork that never reported `ready` is reaped by the launcher's own
      launchTimeout path rather than by `signalProcessTree`. That path has no real-browser
      observation and is not structurally identical to the two that do.
  required_of: >-
    AC-11b (ED-05 / story 10.18) should name the launch-failure path explicitly among the six it
    proves in-image, rather than leaving it inside "the same six paths". Recorded as MED-1.

