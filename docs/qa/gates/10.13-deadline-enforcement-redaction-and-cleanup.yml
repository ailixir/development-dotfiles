final_decision:
  gate: CONCERNS
  merge: SAFE WITH QA-1 FIXED FIRST
  statement: >-
    This is a strong story. The two defects @dev found are real, were found by the tier that could
    see them, and the reviewer independently reproduced the mechanism of the more important one:
    a complete no-op kill now turns the fixtures tier red, which is precisely the failure the
    split hint named and which the epic has been hunting. The `partial` producer is correct, the
    §17.4 independence holds in both directions under mutation, the pin is correctly left alone,
    the reconstruction of runCoordinator.ts is clean against the base commit rather than merely
    against a green suite, and the developer's decision to report two surviving mutants rather
    than hide them is exactly the behaviour this epic wants. Against that, the reviewer found an
    eighth guard that could not fail, in a shape not yet on the list, and behind it a live
    fragment disclosure on the one surface the epic's acceptance bullet names by hand. It is one
    `while` loop and one planted newline. Fix QA-1 and this is a PASS.
