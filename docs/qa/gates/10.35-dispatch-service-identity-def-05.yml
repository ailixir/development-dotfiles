  The identity defect itself is verified fixed by running (AC-1, AC-2, AC-4, AC-5). The gate fails on
  AC-3, which the DoD makes the deciding criterion. @po may rule to close DEF-05 and track AC-3 as
  its own defect. That is a scope ruling for @po; this gate does not make it.
