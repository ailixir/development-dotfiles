top_issues:
  - id: TEST-001
    severity: medium
    finding: >-
      Shape #12. AC-2's hazard is PROCESSING rendering as absent or failed. Every AC-2/AC-20
      assertion imports its expected text from VIDEO_EVIDENCE_NARRATIVES, and the contract file only
      checks that the wordings are distinct and longer than 10 characters. Rewriting PROCESSING to
      say no recording exists left 161/161 green. The shipped wording is correct today.
    suggested_action: >-
      Pin one independent literal per state (e.g. PROCESSING /still being produced|not ready/i,
      FAILED /could not be produced|failed/i, UNAVAILABLE /no usable recording/i, EXPIRED
      /expired/i), and forbid the wrong-state words (PROCESSING must not match /no recording|
      failed|expired/i). Add the #13 provenance assertion so the pin file never imports the
      narratives module. Owner @dev.
  - id: TEST-002
    severity: medium
    finding: >-
      Shape #18. AC-6's two-base matrix (CASES in studioVideoUrl.test.tsx) guards nothing about its
      own rows. Deleting the cross-host row and applying M16 (resolve against the page origin) left
      145/145 green. The cross-host row is the only thing that tells the two cases apart, which is
      the point of AC-6.
    suggested_action: >-
      Assert on CASES itself: one path-only base and one absolute base whose origin differs from
      window.location.origin, e.g. expect(CASES.some(c => new URL(c.base, location.href).origin !==
      location.origin)).toBe(true). Owner @dev.
  - id: REL-001
    severity: medium
    finding: >-
      pageRunGate.test.tsx (10.11a) AC-2 is timing-fragile: a 1 s findAllByText on a heavy page
      render, inside a 5 s default timeout. The defect was already recorded as ENV-TIMING-1 and never
      fixed. 10.16a aggravates it by about +1.4 s in-suite (8 of 8 matched pairs), and it failed 2 of
      14 HEAD full runs against 0 of 10 base. Not introduced by this half; the page is not slower.
    suggested_action: >-
      On the epic branch, not in this half: give that wait and the test explicit bounds
      ({timeout: 5000} on the find, and a per-test timeout). Do not delete assertions. Owner
      orchestrator / @dev (10.11a's file).
  - id: REL-002
    severity: medium
    finding: >-
      ENV-2, suite-wide and pre-existing. store/index.ts fetches sources and features at import,
      before MSW listens, against jsdom's origin http://localhost:3000. On a host where anything
      answers there, both slices end up fulfilled with data undefined (verified), and a late landing
      crashes whichever page test is running. Only pageEvidence.test.tsx is protected.
    suggested_action: >-
      One suite-level fix instead of per-file remedies: pin jsdom's url in vitest.config.ts
      (environmentOptions.jsdom.url) to an origin nothing serves, or make the import-time bootstrap
      inert under test. Owner orchestrator / @devops. Not 10.16a's.
  - id: TEST-003
    severity: low
    finding: >-
      Shape #16. The test "the builders take videoPath and nothing else" asserts Function.length ===
      1, which a defaulted token parameter reading localStorage passes (161/161 green). AC-7 assigns
      the no-token-source half to review, and that review is clean today, so the gap is the test's
      name overclaiming.
    suggested_action: >-
      Seed localStorage/sessionStorage/document.cookie with an access_token before the key-set
      tests, which makes part of the review item executable, or rename the test to what it checks.
  - id: TEST-004
    severity: low
    finding: >-
      AC-14(c)'s guard "no fixture anywhere says partial: true without AVAILABLE/PROCESSING"
      enumerates mockExecutions, executionCorpus and ALL_SCENARIO_FRAMES. The snapshot handlers.ts
      builds on POST /execute is not covered (Q16 green).
    suggested_action: 'Narrow the name, or include the handler-built snapshot (e.g. by exercising POST /execute once).'
  - id: DOC-001
    severity: low
    finding: >-
      The Dev Agent Record says deleting studioSlice.videoUrl makes a re-introduced read "a type
      error as well as a test failure". It does not: the page reads the store through
      `(s: any)` selectors, and type-check stays at the 2 baseline errors (Q17). The source scan is
      the only guard, which the mutation table itself says correctly.
    suggested_action: 'Correct the sentence in the AC-21 row.'
  - id: REL-003
    severity: low
    finding: >-
      studioVideoUrl throws during render on a videoPath that is not a rooted, query-free path
      (developer's open question). The nearest boundary is the module-level ErrorBoundary
      (App.tsx / ChecksModule.tsx), so a non-conforming server would replace the whole Studio page,
      not just the evidence panel. A conforming server cannot reach this (contract regex, D-3), and
      the loud-failure choice mirrors AC-1's mandated throwing lookup.
    suggested_action: >-
      Not blocking. If a softer failure is wanted, wrap VideoEvidencePanel in a local boundary that
      renders a non-diagnostic "cannot show this recording" state. Decision @architect / @po.
  - id: MNT-001
    severity: low
    finding: >-
      AC-4's gate (AVAILABLE && videoPath !== null) exists twice: in VideoEvidencePanel and in the
      page's hasPlayableRecording. If they drift, seek controls appear with no player; seekToOffset
      then does nothing, so the failure is harmless but confusing.
    suggested_action: 'Export one predicate from components/studio/evidence and use it in both places.'
  - id: REQ-001
    severity: low
    finding: >-
      (Inferred from code, not rendered.) The Proof tab's in-flight "Recording…" indicator was
      retired with the legacy region. Between Run and the first frame, beginRun sets the snapshot to
      null, so the panel says "No run is on screen yet", which is untrue for that window.
    suggested_action: 'Optional wording/indicator tweak, or leave it for 10.19''s UX pass. Owner @dev / @ux.'

