final_decision:
  gate: CONCERNS
  merge: SAFE — with the story-document conflict resolved as above and the merged suite re-run
  rationale: >-
    The half does what its criteria say, and the guards the criteria name are guards: 16
    mutations re-applied, all red, hashes matching the developer's table, and both directions of
    AC-1 bound against the document. The two decisions the developer made alone trace to the
    criteria, and the third is harmless and guarded. AC-11 holds on review, and nothing parses a
    refusal body or invents a 401/403. What holds this at CONCERNS is two medium test gaps found by
    probing rather than reading (#12 on AC-2's meaning, #18 on AC-6's matrix) and one low naming
    overclaim (#16). Separately, a pre-existing flake is made measurably worse by this half's
    added suite work, and its fix belongs to the epic, not to this half.
