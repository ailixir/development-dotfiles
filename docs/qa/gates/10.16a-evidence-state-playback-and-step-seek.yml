  pageRunGate_determination:
    result: 'PRE-EXISTING latent defect, AGGRAVATED (not introduced) by 10.16a; this failure is timing, not the :3000 listener'
    detail: >-
      (1) The failure is timing. The failed run's DOM dump is a fully rendered page. The log has
      zero "reading 'find'" errors, and the :3000 clobber throws inside a selector, which would
      have unmounted the tree and logged that error. The test waits for the verdict with
      findAllByText's default 1000 ms. The verdict needs a 250 ms debounce, then
      POST /validate-steps, then a render of a heavy page. Shrinking that wait to 100 ms (probe
      T1) reproduces the identical message deterministically, 1 red / 3 green.
      (2) 10.16a aggravates it through suite composition, not through the page. In 4 interleaved
      base/head full-suite pairs at matched load (12.6–15.8), the AC-2 test took
      2225/2739/2628/2457 ms on base and 3813/3748/3941/4165 ms on HEAD, +1.4 s every time.
      Run alone, 4 interleaved pairs, it took 1060–1168 ms on base and 1087–1178 ms on HEAD,
      which is no difference. So the page code is not slower. The half adds 5 test files and 69
      tests, including the page-level pageEvidence.test.tsx (4.0–8.1 s per run), and that extra
      concurrent jsdom work pushes this test toward its 1 s inner wait and 5 s timeout.
      Counts: HEAD failed 2 of 14 full runs (orchestrator 1/4, this reviewer 1/10). Base failed
      0 of 10 (orchestrator 0/6 on w7, this reviewer 0/4). The sample is small, but the duration
      shift is consistent in all 8 pairs.
      (3) It is pre-existing and already recorded. 10.11a's gate filed it as ENV-TIMING-1
      ("bound the page test's timeout") and listed "do not relax pageRunGate by deleting
      assertions; bound its timeout instead". Nobody applied that.
      (4) The :3000 exposure (ENV-2) is real and is a separate mechanism. A temporary probe test
      (deleted afterwards) showed that with jsdom's origin at localhost:3000, the import-time
      bootstrap leaves sources = {fetched: true, error: null, data: undefined} within about
      160 ms: next-server (PID 33058, untouched) answers 307 → /login → 200 text/html. With the
      origin moved to a closed port (localhost:3999, via an untracked config overlay), the same
      bootstrap fails open to the 7-entry list. If that undefined lands after a test's
      beforeEach, the next selector throws "reading 'find'". Throttled stress (taskpolicy -b, 3
      concurrent copies ×2, each origin) gave 0 failures on either origin, so this reviewer did
      not observe the clobber mid-test. The mechanism is verified; that it happens mid-test in
      practice rests on the developer's 2-of-2 observation.
      A test whose outcome depends on an unrelated local process is a suite isolation defect
      (store/index.ts fetches at import, and jsdom's default origin is a commonly used dev port).
      It is not 10.16a's, 10.16a does not make it worse, and its own new page test carries a
      sound local remedy. It does not block this half.

