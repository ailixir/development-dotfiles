        recovery after a lost controller response without another collect. Lost callback
        acknowledgement conservatively stops the worker without replay. Identical duplicate
        keys/digests join or retrieve one result before stale-generation comparison; changed digest
        conflicts and later generation/action/stop supersedes cached authority. Unrelated legitimate
        observations supersede refresh intent without rolling state back. This command cannot answer
