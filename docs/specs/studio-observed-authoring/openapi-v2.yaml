        current owner and fence are mandatory. User/BFF tokens cannot call these routes.
    MutualTLS:
      type: mutualTLS
      description: Verified client certificate on configured mutually authenticated TLS; HTTPS or
        forwarded headers alone do not qualify.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: Route-scoped request identity; identical retries retrieve state, never fresh dispatch
        authority. No automatic mutating POST retry.
    OwnerFence:
      name: X-Owner-Fence
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
      description: Must match authenticated current owner and body. Claim uses expectedFence in its body
        instead.
  responses:
    RunnerUnauthenticated:
      description: Runner rejected service authentication. No payload details.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                  - AUTH_DENIED
                  - SCHEMA
                  - IDENTITY_MISMATCH
                  - CAPACITY
                  - CONTEXT_LOST
                  - ALREADY_CONSUMED
                  - BUSY
                  - TARGET_CHANGED
                  - PREPARATION_DENIED
                  - ADMISSION_DENIED
                  - BINDING_UNAVAILABLE
                  - BINDING_DENIED
                  - BINDING_ORDER
                  - ACTION_ORDER
                  - CONTEXT_REVISION
                  - INPUT_IDENTITY
                  - BUDGET_EXCEEDED
                  - POLICY_DENIED
                  - IDEMPOTENCY_CONFLICT
            required:
              - code
          example:
            code: AUTH_DENIED
    RunnerRefusal:
      description: Runner refused operation; bounded data-free code only. Never retry a browser effect
        automatically.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                  - AUTH_DENIED
                  - SCHEMA
                  - IDENTITY_MISMATCH
                  - CAPACITY
                  - CONTEXT_LOST
                  - ALREADY_CONSUMED
                  - BUSY
                  - TARGET_CHANGED
                  - PREPARATION_DENIED
                  - ADMISSION_DENIED
                  - BINDING_UNAVAILABLE
                  - BINDING_DENIED
                  - BINDING_ORDER
                  - ACTION_ORDER
                  - CONTEXT_REVISION
                  - INPUT_IDENTITY
                  - BUDGET_EXCEEDED
                  - POLICY_DENIED
                  - IDEMPOTENCY_CONFLICT
            required:
              - code
          example:
            code: POLICY_DENIED
    BackendRefusal:
      description: Backend refusal. Code does not grant retry permission for consumed browser work.
      content:
        application/json:
          schema:
            $ref: ./contracts/v2/error.schema.json
          example:
            schemaVersion: 2
            code: STALE_FENCE
            requestId: request-1
            retryable: false
            messageCode: STALE_FENCE
