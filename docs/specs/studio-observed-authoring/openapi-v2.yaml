  /internal/v2/studio/guided-sessions/{sessionId}/stop:
    post:
      operationId: runnerStop
      description: Stop this owned context and clear local values. Identity acknowledgement is sent after
        teardown. Backend cancellation acknowledgement alone cannot establish that an
        already-consumed effect was prevented. Assignment variant stops pending ownership/renewal
        before context exists, serializes cleanup against late grants/context, and returns STOPPED
        receipt after cleanup. Context variant also stops its assignment driver. Lost
        acknowledgement never proves an already-consumed effect was prevented.
      x-receiver: runner
      x-service-audience: studio-guided-runner
      x-service-role: backend-controller
      x-automatic-post-retry: false
      servers:
        - url: https://runner.example.invalid
