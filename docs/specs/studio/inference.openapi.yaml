openapi: 3.0.3
info:
  title: Studio inference authoring amendment
  version: 2.0.0
  description: "C0 contract; implemented behind disabled deployment gates. Canonical decisions:
    docs/architecture/studio-inference-contract-v1.md. Reuses existing services and execution
    routes; no second execution engine. Flags remain disabled pending their gates."
servers:
  - url: /api/v2/studio
paths:
  /tests:
    post:
      operationId: createStudioTestV2
      summary: Create a versioned draft; allocate IDs and save before optional compile
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWrite"
      responses:
        "201":
          description: Successful authorized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestView"
        "400": &a1
          description: Malformed/invalid input or authoring bounds. New codes INVALID_STEP_ID, INVALID_SCOPE;
            existing bound/configuration codes retained.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": &a2
          description: Denied CSI/test permission; no foreign identity/evidence disclosure.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
        "409": &a3
          description: Stale revision/candidate or immutable CSI/lifecycle conflict.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
          x-conflict-codes:
            - STALE_REVISION
            - STALE_CANDIDATE
            - CSI_IMMUTABLE
            - TEST_DELETED
            - TEST_QUARANTINED
  /tests/{id}:
    parameters:
      - &a4
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStudioTestV2
      summary: Read coherent draft/identity/compile review snapshot
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      responses:
        "200":
          description: Successful authorized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestView"
        "400": *a1
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": *a2
        "409": *a3
    put:
      operationId: updateStudioTestV2
      summary: Optimistic save with per-edit scope; no browser execution
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWrite"
      responses:
        "200":
          description: Successful authorized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestView"
        "400": *a1
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": *a2
        "409": *a3
  /tests/{id}/compile:
    parameters:
      - *a4
    post:
      operationId: compileStudioTestV2
      summary: Capture exact draft; AUTO planner or explicit FULL; no browser
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "202":
          description: Attempt identity captured; downstream saturation/error remains asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileAccepted"
        "400": *a1
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": *a2
        "409": *a3
  /tests/{id}/confirm-compile:
    parameters:
      - *a4
    post:
      operationId: confirmStudioCompileV2
      summary: Confirm exact current immutable candidate/request/snapshot
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: Successful authorized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestView"
        "400": *a1
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": *a2
        "409": *a3
  /tests/{id}/compiles/{compileRequestId}:
    parameters:
      - *a4
      - name: compileRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStudioCompileAttemptV2
      summary: Read authorized immutable attempt identity and bounded outcome telemetry
      tags:
        - studio-authoring-v2
      x-not-yet-implemented: false
      x-authorization: Existing trusted platform user identity plus same CSI/test permissions as
        corresponding v1 Studio route; never serviceIdentity.
      responses:
        "200":
          description: Successful authorized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileAttempt"
        "400": *a1
        "401":
          $ref: ./openapi.yaml#/components/responses/SessionUnauthorized
        "403": *a2
        "404":
          description: Authorized test/request not found.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
        "409": *a3
components:
  schemas:
    ScopeDeclaration:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - declaration
      properties:
        policyVersion:
          type: string
          enum:
            - 1.0.0
        declaration:
          type: string
          enum:
            - UNKNOWN
            - STEP_SCOPED
      description: "STEP_SCOPED is an explicit per-edit author-reviewed semantic assumption: own/prior
        steps and declared references only, no global or forward dependencies. The server supplies
        reviewer/time and binds this to the persisted snapshot. It is not deterministic proof.
        Missing/stale/global/forward scope selects FULL."
    StepInput:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        text:
          type: string
          minLength: 1
          maxLength: 500
      description: Omitted/null ID allocates a new server UUID; existing IDs must be unique and owned by
        this test.
    Step:
      type: object
      additionalProperties: false
      required:
        - id
        - text
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
    AuthoringSnapshot:
      type: object
      additionalProperties: false
      required:
        - version
        - steps
        - scope
      properties:
        version:
          type: integer
          enum:
            - 2
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
          minItems: 1
          maxItems: 100
        scope:
          $ref: "#/components/schemas/ScopeDeclaration"
    TestWrite:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - steps
        - scope
        - variables
        - configuration
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        csiId:
          type: string
          maxLength: 20
        environment:
          type: string
          maxLength: 50
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepInput"
          minItems: 1
          maxItems: 100
        scope:
          $ref: "#/components/schemas/ScopeDeclaration"
        variables:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/Variable
        configuration:
          $ref: ./openapi.yaml#/components/schemas/TestConfiguration
        sourceRevision:
          type: integer
          minimum: 1
        configurationRevision:
          type: integer
          minimum: 1
      description: csiId required on create and immutable on update; both revisions required on update and
        ignored on create. Same existing authorization/credential/byte bounds. Clients never supply
        code. Identity/scope-only changes increment sourceRevision. Valid new scope affirmation
        binds to this submitted snapshot, not a past revision.
    CompileRequest:
      type: object
      additionalProperties: false
      required:
        - mode
        - sourceRevision
        - configurationRevision
        - authoringHash
      properties:
        mode:
          type: string
          enum:
            - AUTO
            - FULL
        sourceRevision:
          type: integer
          minimum: 1
        configurationRevision:
          type: integer
          minimum: 1
        authoringHash:
          type: string
          pattern: ^[0-9a-f]{64}$
      description: No body on the v1 compile route keeps existing behavior but uses corrected FULL
        envelope. V2 requires all fields. AUTO never bypasses eligibility; FULL always regenerates.
        Idempotency uses the existing public mutation mechanism, not artifact hash.
    Plan:
      type: object
      additionalProperties: false
      required:
        - requestedMode
        - selectedMode
        - reason
        - compilationFingerprint
        - baselineRevisionId
        - baselineExecutionId
        - baselineExecutionStartedAt
        - writableStepIds
        - reusedStepIds
        - impactPolicyVersion
      properties:
        requestedMode:
          type: string
          enum:
            - AUTO
            - FULL
        selectedMode:
          type: string
          enum:
            - FULL
            - INCREMENTAL
            - REUSE
        reason:
          type: string
          enum:
            - EXPLICIT_FULL
            - INCREMENTAL_DISABLED
            - NO_ELIGIBLE_BASELINE
            - LEGACY_MAPPING
            - STRUCTURAL_CHANGE
            - FINGERPRINT_CHANGE
            - SCOPE_UNKNOWN
            - GLOBAL_OR_FORWARD_SCOPE
            - UNCHANGED_SOURCE
            - CONFIGURATION_ONLY
            - SCOPED_SUFFIX
            - ALL_STEPS_AFFECTED
        compilationFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        baselineRevisionId:
          type: string
          format: uuid
          nullable: true
        baselineExecutionId:
          type: string
          format: uuid
          nullable: true
        baselineExecutionStartedAt:
          type: string
          format: date-time
          nullable: true
        writableStepIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 100
        reusedStepIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 100
        impactPolicyVersion:
          type: string
          enum:
            - 1.0.0
      description: Server-owned immutable plan. writable and reused form a disjoint exact partition of
        current IDs. FULL writable=all; INCREMENTAL writable=affected suffix; REUSE writable=empty.
        Baseline execution ID/time are both present or both null. Config-only compatible reuse may
        use confirmed baseline without success evidence; inference reuse may not.
    CompileAccepted:
      type: object
      additionalProperties: false
      required:
        - compileRequestId
        - compileStatus
        - sourceRevision
        - configurationRevision
        - authoringHash
        - plan
      properties:
        compileRequestId:
          type: string
          format: uuid
        compileStatus:
          type: string
          enum:
            - COMPILING
        sourceRevision:
          type: integer
          minimum: 1
        configurationRevision:
          type: integer
          minimum: 1
        authoringHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        plan:
          $ref: "#/components/schemas/Plan"
    ConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - compileRequestId
        - revisionId
        - artifactHash
        - sourceRevision
        - configurationRevision
        - authoringHash
      properties:
        compileRequestId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        artifactHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceRevision:
          type: integer
          minimum: 1
        configurationRevision:
          type: integer
          minimum: 1
        authoringHash:
          type: string
          pattern: ^[0-9a-f]{64}$
    Usage:
      type: object
      additionalProperties: false
      required:
        - proposalCount
        - repairCount
        - transportAttemptCount
        - inputTokens
        - outputTokens
        - thinkingTokens
        - usageAvailable
        - finishReason
        - cancellationOutcome
        - elapsedMs
      properties:
        proposalCount:
          type: integer
          nullable: true
          minimum: 0
        repairCount:
          type: integer
          nullable: true
          minimum: 0
        transportAttemptCount:
          type: integer
          nullable: true
          minimum: 0
        inputTokens:
          type: integer
          minimum: 0
          nullable: true
        outputTokens:
          type: integer
          minimum: 0
          nullable: true
        thinkingTokens:
          type: integer
          minimum: 0
          nullable: true
        usageAvailable:
          type: boolean
        finishReason:
          type: string
          nullable: true
        cancellationOutcome:
          type: string
          nullable: true
        elapsedMs:
          type: integer
          nullable: true
          minimum: 0
      description: Cumulative counters include retries/repairs. Missing provider usage is null, never
        fabricated zero. Maximum proposals3/repair2/transport9 and shared deadline enforced
        independently. Additional sensitive input/output is never logged.
    CompileAttempt:
      type: object
      additionalProperties: false
      required:
        - compileRequestId
        - sourceRevision
        - configurationRevision
        - authoringHash
        - state
        - stage
        - plan
        - revisionId
        - artifactHash
        - errorCode
        - diagnostics
        - usage
      properties:
        compileRequestId:
          type: string
          format: uuid
        sourceRevision:
          type: integer
          minimum: 1
        configurationRevision:
          type: integer
          minimum: 1
        authoringHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        state:
          type: string
          enum:
            - RUNNING
            - CANDIDATE
            - NEEDS_REVISION
            - FAILED
            - DISCARDED
        stage:
          type: string
          enum:
            - CAPTURE
            - PLANNING
            - INFERENCE
            - VALIDATION
            - PUBLICATION
            - COMPLETE
        plan:
          $ref: "#/components/schemas/Plan"
        revisionId:
          type: string
          format: uuid
          nullable: true
        artifactHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        errorCode:
          type: string
          nullable: true
        diagnostics:
          $ref: ./openapi.yaml#/components/schemas/CompileDiagnostics
        usage:
          $ref: "#/components/schemas/Usage"
    TestView:
      type: object
      additionalProperties: false
      required:
        - test
        - authoring
        - authoringHash
        - scopeReviewedBy
        - scopeReviewedAt
        - compileAttempt
      properties:
        test:
          $ref: ./openapi.yaml#/components/schemas/TestDto
        authoring:
          oneOf:
            - $ref: "#/components/schemas/AuthoringSnapshot"
            - type: string
              nullable: true
              enum:
                - null
        authoringHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        scopeReviewedBy:
          type: string
          nullable: true
        scopeReviewedAt:
          type: string
          format: date-time
          nullable: true
        compileAttempt:
          oneOf:
            - $ref: "#/components/schemas/CompileAttempt"
            - type: string
              nullable: true
              enum:
                - null
      description: One coherent authorized snapshot. test is the existing DTO to preserve
        configuration/evidence fields; test.steps must equal authoring.steps.map(text).
        authoring=null denotes legacy unmapped content. Candidate fields in test refer to
        compileAttempt.revisionId for the current successful attempt. A new v2 write allocates real
        IDs; a GET never invents persisted identity.
