openapi: 3.0.3
info:
  title: Checks Studio API
  version: 1.0.0
  description: |
    Frozen contract for the Checks Studio UI-testing surface (story 10.1).

    Compiler amendment 2026-09-16: `docs/architecture/studio-inference-contract-v1.md`
    and sibling `inference.openapi.yaml` declare not-yet-implemented v2 authoring and
    corrected compiler behavior. Existing v1/internal shapes remain defined here;
    the separate inference proposal schema is never an executable runner artifact.

    Normative source: `docs/architecture/studio-execution.md` v2.1 — §4.4 (source artifact),
    §5 (execution and snapshot), §5.5 (SSE parity), §6.1 (evidence state), §8.2 (status
    vocabulary), §8.3 (public API and legacy adapters), §8.4 (internal contracts), and
    `docs/architecture/studio-sse-viability.md` (snapshot event shape, GET fallback).

    Routes tagged `internal` are not exposed through public ingress; they require a restricted
    service identity over encrypted transport. springdoc excludes them from the public UI; the
    contract test still covers them.

    **Two components serve the routes in this document.** The internal surface of §8.4 is split
    across the backend API and the separately deployed `studio-runner`, which has its own image,
    its own ClusterIP Service and no ingress at all (ADR-001 §9). An internal operation therefore
    never inherits the document-level `servers` entry: each declares its own base and carries
    exactly one of `runner` or `api-callback` next to `internal`, so the component that answers a
    route is readable without inference. See ADR-002 for the ruling and its alternatives.

    The bodies the runner produces and sends are declared closed (`additionalProperties: false`)
    and their optional fields are declared. A field the contract does not name is a conformance
    failure rather than a silent divergence — see ADR-002 §INT-4.

    **Every `409` declares its code set in `x-conflict-codes`.** `ErrorResponse.error` is a free
    string, so the codes a conflict can carry were previously conveyed by examples alone — and an
    example is decorative: no generator reads it and no test can assert it is complete. That is the
    same hazard as an open body (§INT-4), one level down. `x-conflict-codes` is the machine-readable
    form of the same fact, in the manner `x-served-by` already carries the serving component, and it
    is exhaustive for the operation: an implementation that answers `409` with a code outside the
    list, or that cannot produce one in it, is a conformance failure. See ADR-002 §14.

    **The terminal error-code vocabulary is declared in both directions.** `ExecutionErrorCode` is
    exhaustive for what the API persists and publishes, and `x-assigned-by` names the component
    that assigns each of its members; `RunOutcome.errorCode` stays an open string, because the
    runner owns that vocabulary, but `x-runner-error-codes` declares the set the pinned image can
    emit. The two sets intersect at `TIMEOUT` and `CANCELLED` and nowhere else, which is now a
    property a test on either side can read from this document rather than from a second copy of
    the list. Same
    mechanism as `x-conflict-codes`, and the same reason: an enum that does not say who fills it,
    and an open string that says nothing at all, are both facts no test can check. See ADR-002 §15.

    **Amending this document.** Freezing it in 10.1 requires that changes be recorded, not that
    they never happen — a wave gate has already proved it both incomplete and wrong about routes
    it did declare. Who may change what is ruled in ADR-002 §12: a story may repair a defect that
    no producer or consumer could ever have satisfied, in its own PR, logged in ADR-002 §13; a
    field added to, removed from, renamed on or redefined on a closed runner-produced body, and
    anything touching routes, security, tags, servers or the public surface, needs an architect's
    ruling first. Loosening a schema to admit what a producer happens to send is never a story's
    call. A story that finds a divergence leaves its contract test red and escalates.

    Routes marked `x-not-yet-implemented: true` are declared here so that dependent stories build
    against one frozen shape. Story 10.1 ships the contract, the schema and the snapshot DTO;
    dispatch (10.7), compilation (10.8) and confirmation (10.9) ship the behaviour.

    **Authoring context v2.** `AuthoringV2Request` is the frozen context-aware authoring body.
    It keeps stable step identity separate from array position, preserves `text` exactly and
    carries optional test-wide and step-local context. `LegacyAuthoringRequest` remains the input
    to the documented adapter: each ordered string is copied byte-for-byte into v2 `text`, an ID
    is assigned once at migration/save (never derived from array position), and both context
    scopes start empty. Mixed legacy/v2 arrays and duplicate or missing IDs are rejected. Reorder
    and edit retain IDs; insertion creates an ID; copy creates a fresh ID; deletion removes only
    the deleted step and its metadata.

    Explicit step intent/value takes precedence over step context, which takes precedence over
    global context; authorization, origin, secret-use and accepted-language policy always remains
    authoritative. A contradiction that precedence cannot resolve is published as a diagnostic,
    never silently substituted. Global context, step context, referenced nonsecret values and
    selected evidence references are execution-affecting revision inputs. A stale compile may not
    publish over a newer input identity, and any such edit requires a new candidate and explicit
    confirmation; persistence and state transitions are owned by later stories.

    Ordinary Compile remains browser-free. Run executes only an exactly confirmed artifact and is
    LLM-free. This contract adds no learning/capture endpoint or browser action. An author may
    select a `supplied` evidence reference only; `observed` provenance is minted by a future trusted
    capture boundary and cannot be asserted by an imported or user-authored request. A future
    Learn flow is page-aware at each changing step state: login-page evidence does not prove the
    authenticated page, and authenticated-page evidence does not prove the protected destination.
    Learn may use the applicable state to propose each step for review; after confirmation, normal
    execution runs the immutable artifact without an LLM. These are contract boundaries, not a
    claim that this story implements live observation or Learn behaviour.
servers:
  # Public, browser-facing base only. Every `internal`-tagged path item overrides this with its
  # own `servers` entry; none of them is served under `/api/v1/studio` (architecture §8.4).
  - url: /api/v1/studio
    description: Public Studio API
tags:
  - name: tests
    description: |
      Studio drafts (authoring).

      **The four `409` codes of the draft lifecycle are not interchangeable, and a caller must act
      differently on each.** They divide on two axes: whether the draft still exists, and who can
      clear the condition.

      | Code | The draft | Who clears it | What the caller does |
      |---|---|---|---|
      | `STALE_REVISION` | intact and compilable | the caller | reload and retry; the request was built against a revision that moved (§4.2) |
      | `STALE_CANDIDATE` | intact and compilable | the caller | recompile, then confirm the candidate that results (§4.2) |
      | `CSI_IMMUTABLE` | intact and compilable | the caller | correct the body; the CSI of a draft is never moved by an update (§9.1) |
      | `TEST_DELETED` | soft-deleted, history retained | the owner, out of band | stop; no retry of this request can succeed while the draft is deleted (§8.3) |
      | `TEST_QUARANTINED` | **intact and not lost**, withheld | an administrator or migration, out of band | stop and say so; the authored test still exists and returns when its CSI is resolved (BRD §9) |

      The first three are retriable by the caller after a local correction. The last two are
      definite refusals that no retry resolves, and they are separate codes because their remedies
      have different owners: a deleted draft was withdrawn by a principal's own action and can be
      restored by one, while a quarantined draft was withheld by the platform because its CSI is
      missing or unregistered, and only an administrator or an explicit migration can return it.
      Collapsing quarantine into `TEST_DELETED` would tell an author their work was deleted when
      BRD §9 guarantees no authored test is lost — a false statement that would drive a UI to offer
      a restore it cannot perform. See ADR-002 §14.
  - name: executions
    description: Execution history, live snapshots and evidence
  - name: internal
    description: |
      Service-to-service routes; never exposed through public ingress (architecture §8.4). Every
      internal operation also carries exactly one of `runner` or `api-callback`, and declares its
      own `servers` entry, so both the serving component and its base are explicit.
  - name: runner
    description: |
      Served by the `studio-runner` Deployment: its own image and ClusterIP Service, no Ingress
      and no HPA (ADR-001 §9). Reachable from worker and API pods only; the MFE never talks to
      the runner (architecture §3).
  - name: api-callback
    description: |
      Served by the backend API on its internal base, not under the public `/api/v1/studio`
      prefix. Called by the runner and by nothing else (architecture §8.4, §9.2). The callback
      destination is deployment configuration and is never job-supplied (§8.5).

paths:
  /tests:
    get:
      tags: [tests]
      operationId: listTests
      summary: List drafts visible to the caller
      description: |
        Results are filtered by the caller's readable CSIs **before** pagination, even when no
        `csiId` filter is supplied (architecture §9.1). Soft-deleted and quarantined drafts are
        never returned.

        **`compileDiagnostics`, `currentCandidateArtifact`, `currentCandidateArtifactHash`,
        `confirmedRevisionArtifact` and `confirmedRevisionArtifactHash` are always `null` on this route**.
        They are read from `GET /tests/{id}` and are the fields of
        `TestDto` this projection omits, and the reason is the same for all five: the diagnostics
        document is capped per draft at a configured byte limit (§8.5) and an artifact is capped
        at a hundred steps of generated source, so a page of drafts would be a multi-megabyte
        response carrying per-step reasons and executable code no list renders. `compileStatus`,
        `currentCandidateRevisionId` and `compileError` — the last a bounded code — are on this
        route, so nothing a caller needs in order to know that reasons or a candidate exist is
        hidden; only the reasons, the artifact and its hash are one read away (ADR-002 §16.5,
        §21.2).

        The hash is omitted here rather than kept because it is only meaningful beside the
        artifact it names and beside the revisions it is confirmed against: confirmation reads
        `GET /tests/{id}`, whose four fields come from one transaction (§21.3), and a hash carried
        on a list entry would invite a client to assemble that body out of two reads.
      parameters:
        - { $ref: '#/components/parameters/CsiIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Page of drafts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPage' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
    post:
      tags: [tests]
      operationId: createTest
      summary: Create a draft
      description: |
        `csiId` is required, must be a registered CSI, and can never be changed afterwards.
        Clients submit English steps only; the server generates the executable artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRequest' }
            examples:
              create:
                summary: Canonical create
                value:
                  name: Citi login smoke
                  description: Verifies the login page still accepts the pilot account
                  csiId: '60406'
                  environment: Production
                  steps:
                    - Go to "https://www.citi.com"
                    - Type "<secret LOGIN_PW>" in the "Password" field
                    - Check that the URL contains "dashboard"
                  variables:
                    - { name: USER_ID, kind: plain, value: pilot-user }
                    - { name: LOGIN_PW, kind: secretRef, secretId: vault://studio/pilot-pw }
                  configuration:
                    browser: chromium
                    viewport: { width: 1920, height: 1080 }
                    timeoutSeconds: 30
                    waitStrategy: networkidle
              legacyCreate:
                summary: Legacy adapter — JSON-string steps, flattened viewport, browser `chrome`
                description: |
                  Accepted for backward compatibility and normalized at the controller boundary
                  (architecture §8.3): JSON-string `steps`/`variables` become typed fields, the
                  flattened viewport becomes `configuration.viewport`, and `chrome` becomes
                  `chromium`. Any other engine is rejected with `400 INVALID_CONFIGURATION`.
                value:
                  name: Citi login smoke
                  description: legacy client payload
                  csiId: '60406'
                  environment: Production
                  steps: '["Go to \"https://www.citi.com\""]'
                  variables: '[]'
                  browser: chrome
                  viewportWidth: 1920
                  viewportHeight: 1080
                  timeoutSeconds: 30
                  waitStrategy: networkidle
              legacyTestIrCreate:
                summary: Legacy adapter — structured TestIR steps become ordered originalText
                value:
                  name: Citi login smoke
                  csiId: '60406'
                  environment: Production
                  steps:
                    - { index: 0, type: go_to, originalText: 'Go to "https://www.citi.com"', url: 'https://www.citi.com' }
                    - { index: 1, type: click, originalText: 'Click "Sign On"', targetText: Sign On }
                  configuration:
                    browser: chromium
                    viewport: { width: 1920, height: 1080 }
                    timeoutSeconds: 30
                    waitStrategy: networkidle
      responses:
        '201':
          description: Draft created
          headers:
            Location:
              schema: { type: string }
              description: Path of the created draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDto' }
        '400':
          description: Invalid payload, unregistered CSI, or rejected browser engine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidConfiguration:
                  value:
                    error: INVALID_CONFIGURATION
                    message: "browser 'firefox' is not supported; the canonical engine is 'chromium'"
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tests/{id}:
    parameters:
      - { $ref: '#/components/parameters/TestId' }
    get:
      tags: [tests]
      operationId: getTest
      summary: Read one draft
      description: |
        Authorized against the draft's CSI before anything is returned. An unknown id, a
        soft-deleted or quarantined draft, and a draft on a CSI the caller may not read all answer
        the same `403 STUDIO_FORBIDDEN` with no resource detail. This route never answers `404`;
        `400` is reserved for a malformed request (ADR-002 §27).
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDto' }
              examples:
                ready:
                  summary: A confirmed, runnable draft
                  value:
                    id: 11111111-1111-1111-1111-111111111111
                    name: Citi login smoke
                    description: Verifies the login page still accepts the pilot account
                    csiId: '60406'
                    environment: Production
                    steps:
                      - Go to "https://www.citi.com"
                      - Check that the URL contains "dashboard"
                    variables:
                      - { name: USER_ID, kind: plain, value: pilot-user }
                    configuration:
                      browser: chromium
                      viewport: { width: 1920, height: 1080 }
                      timeoutSeconds: 30
                      waitStrategy: networkidle
                    status: PAUSED
                    schedule: null
                    createdBy: pilot.user@citi.com
                    createdAt: '2026-09-01T09:00:00Z'
                    updatedAt: '2026-09-01T09:30:00Z'
                    lastRunAt: '2026-09-02T11:00:00Z'
                    lastRunStatus: PASSED
                    sourceRevision: 3
                    configurationRevision: 1
                    compileStatus: READY
                    currentCandidateRevisionId: 22222222-2222-2222-2222-222222222222
                    currentCandidateArtifactHash: 9f2c1d5b7a3e4c6f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                    # The value `confirm`'s request example sends back for this same revision.
                    # One read in, one conditional transaction out (ADR-002 §21.3).
                    currentCandidateArtifact:
                      version: 1
                      steps:
                        - stepIndex: 0
                          originalText: 'Go to "https://www.citi.com"'
                          code: "await page.goto('https://www.citi.com');"
                        - stepIndex: 1
                          originalText: 'Check that the URL contains "dashboard"'
                          code: 'await expect(page).toHaveURL(/dashboard/);'
                    confirmedRevisionId: 22222222-2222-2222-2222-222222222222
                    confirmedRevisionArtifactHash: 9f2c1d5b7a3e4c6f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                    confirmedRevisionArtifact:
                      version: 1
                      steps:
                        - stepIndex: 0
                          originalText: 'Go to "https://www.citi.com"'
                          code: "await page.goto('https://www.citi.com');"
                        - stepIndex: 1
                          originalText: 'Check that the URL contains "dashboard"'
                          code: 'await expect(page).toHaveURL(/dashboard/);'
                    compileError: null
                    compileDiagnostics: null
                needsRevision:
                  summary: The compiler could not make this draft runnable, and says why
                  description: |
                    `NEEDS_REVISION` after a bounded repair (§4.3, §4.7). One entry per original
                    step, index aligned, including the steps that were accepted. The second step
                    lost diagnostics to the per-step cap and says so; nothing here claims the
                    accepted steps do what their author meant (§4.5).
                  value:
                    id: 11111111-1111-1111-1111-111111111111
                    name: Citi login smoke
                    description: Verifies the login page still accepts the pilot account
                    csiId: '60406'
                    environment: Production
                    steps:
                      - Go to "https://www.citi.com"
                      - Wobble the sidebar until it feels right
                    variables: []
                    configuration:
                      browser: chromium
                      viewport: { width: 1920, height: 1080 }
                      timeoutSeconds: 30
                      waitStrategy: networkidle
                    status: PAUSED
                    schedule: null
                    createdBy: pilot.user@citi.com
                    createdAt: '2026-09-01T09:00:00Z'
                    updatedAt: '2026-09-01T09:30:00Z'
                    lastRunAt: null
                    lastRunStatus: null
                    sourceRevision: 4
                    configurationRevision: 1
                    compileStatus: NEEDS_REVISION
                    currentCandidateRevisionId: null
                    # No candidate, so no candidate artifact and no hash. Neither is ever
                    # returned without the revision id that says which revision it belongs to,
                    # and the hash is never returned without the artifact it names.
                    currentCandidateArtifactHash: null
                    currentCandidateArtifact: null
                    confirmedRevisionId: 22222222-2222-2222-2222-222222222222
                    compileError: null
                    compileDiagnostics:
                      validatorSchemaVersion: 1.0.0
                      artifact: []
                      steps:
                        - { stepIndex: 0, ok: true, diagnostics: [], truncated: false }
                        - stepIndex: 1
                          ok: false
                          diagnostics:
                            - code: UNSUPPORTED_ACTION
                              stepIndex: 1
                              message: 'No supported action matches "wobble"; the supported actions are listed in the syntax reference…[truncated]'
                              node: action
                              excerpt: 'Wobble the sidebar'
                          truncated: true
                      truncated: false
                      truncationReason: null
                      attempts: 3
                      exhausted: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [tests]
      operationId: updateTest
      summary: Save a draft under optimistic concurrency
      description: |
        `sourceRevision` and `configurationRevision` are required and carry the optimistic check.
        A mismatch is `409 STALE_REVISION` and changes nothing. A different `csiId` is
        `409 CSI_IMMUTABLE`.

        **Saving persists the draft and nothing else.** A source or configuration change bumps the
        revisions, clears the candidate and returns `compileStatus: STALE`; it does **not** start a
        compile. Preparing the saved revision is `POST /tests/{id}/compile`, which the Run action
        issues when the saved draft has no fresh artifact. Saving used to enqueue a compile, which
        spent a gateway call on work the author had not asked for and left a failed attempt with no
        way to retry it, because re-saving identical content is not a change.

        Only an owner or an explicitly authorized administrator of the draft's CSI may save. An
        unknown id, a soft-deleted or quarantined draft, and a draft on a CSI the caller may not
        write all answer the same `403 STUDIO_FORBIDDEN` before any revision is compared, and
        nothing is written. `400` is reserved for a malformed request (ADR-002 §27).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRequest' }
            examples:
              save:
                summary: Canonical save
                value:
                  name: Citi login smoke
                  description: Verifies the login page still accepts the pilot account
                  csiId: '60406'
                  environment: Production
                  steps:
                    - Go to "https://www.citi.com"
                    - Check that the URL contains "dashboard"
                  variables: []
                  configuration:
                    browser: chromium
                    viewport: { width: 1920, height: 1080 }
                    timeoutSeconds: 30
                    waitStrategy: networkidle
                  sourceRevision: 3
                  configurationRevision: 1
      responses:
        '200':
          description: Saved draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Stale revision or attempt to move the CSI.

            **No lifecycle code appears here, deliberately.** A soft-deleted or quarantined draft is
            not visible to this route's read at all — the single visibility predicate excludes it —
            so the save is refused `403 STUDIO_FORBIDDEN`, exactly as it is for an id that never
            existed or a draft on a CSI the caller may not write (ADR-002 §27).
            Refusal with `TEST_DELETED`/`TEST_QUARANTINED` belongs to
            compile, confirm-compile and execute, which are the three operations architecture §8.3
            and the quarantine migration name as having to *reject* rather than merely not see
            (ADR-002 §14 sweep).
          x-conflict-codes: [STALE_REVISION, CSI_IMMUTABLE]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                staleRevision:
                  value: { error: STALE_REVISION, message: 'Test is at sourceRevision 4/configurationRevision 1; reload before saving' }
                csiImmutable:
                  value: { error: CSI_IMMUTABLE, message: 'Test belongs to CSI 60406 and cannot be moved' }
    delete:
      tags: [tests]
      operationId: deleteTest
      summary: Soft delete a draft
      description: |
        Rejects new execute/compile; authorized history stays readable.

        Only an owner or an explicitly authorized administrator of the draft's CSI may delete. An
        unknown id, an already soft-deleted or quarantined draft, and a draft on a CSI the caller
        may not write all answer the same `403 STUDIO_FORBIDDEN`, and nothing is written. `400` is
        reserved for a malformed request (ADR-002 §27).
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tests/{id}/compile:
    post:
      tags: [tests]
      operationId: compileTest
      summary: Enqueue compilation of the current source
      description: |
        Order of refusal is part of the contract, because each stage decides what the next may
        observe. Identity and CSI authorization are evaluated first (`401`, `403`), so a caller who
        may not act on the draft's CSI never learns from a status code whether the draft exists.
        The lifecycle guard runs next (`409`). Authoring bounds and the inline-credential screen run
        last on the request thread (`400`), before any compile request identity is persisted: a
        draft that cannot be compiled must not first be moved to `COMPILING` and then failed.

        A candidate that passes validation is **accepted for the requesting principal and published
        `READY`** in one transaction: the author asked for this revision to be prepared by pressing
        Run, and a separate confirmation step would ask the same question twice. `POST
        /tests/{id}/confirm-compile` is retained for compatibility and is no longer used by the UI.

        `202` therefore means the attempt was *started*, not that it will succeed. Pool saturation
        and gateway failure surface asynchronously as `compileStatus: STALE` carrying
        `compileError`, never as a status code on this response (§4.3). `compileError` and, for an
        unrunnable result, `compileDiagnostics` are both read from `GET /tests/{id}` (ADR-002 §16).
      x-implemented-by: '10.8'
      parameters:
        - { $ref: '#/components/parameters/TestId' }
      responses:
        '202':
          description: Compilation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileAccepted' }
              examples:
                accepted:
                  value:
                    compileRequestId: 33333333-3333-3333-3333-333333333333
                    compileStatus: COMPILING
                    sourceRevision: 4
                    configurationRevision: 1
        '400':
          description: |
            The draft is over an authoring bound, or carries an inline credential. Refused on the
            request thread before the gateway is called and before any compile state moves
            (§4.3): `SOURCE_TOO_MANY_STEPS`, `SOURCE_LINE_TOO_LONG`, `SOURCE_TOO_LARGE`,
            `INLINE_CREDENTIAL`. The message names the offending step index, never its text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                tooManySteps:
                  value: { error: SOURCE_TOO_MANY_STEPS, message: 'This test has 61 steps; the maximum is 60. Split it into smaller tests before compiling.' }
                inlineCredential:
                  value: { error: INLINE_CREDENTIAL, message: 'Step 4 looks like it contains a credential; use a vault reference instead.' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The draft is not in a state that may be compiled. Architecture §8.3 requires a soft
            delete to reject new compile and execute (`TEST_DELETED`), and a draft whose CSI is
            missing or unregistered is withheld from compile, confirm and execute while it is
            quarantined (`TEST_QUARANTINED`, §9.1, BRD §9).

            Definite refusal of the draft as it stands: no compile request identity is persisted,
            `compileStatus` does not move, and no gateway call is paid for. Neither code is
            retryable without an out-of-band change — see the `tests` tag for how the two differ
            from each other and from the revision conflicts.
          x-conflict-codes: [TEST_DELETED, TEST_QUARANTINED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                testDeleted:
                  value: { error: TEST_DELETED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is deleted; compile and confirm are blocked' }
                testQuarantined:
                  value: { error: TEST_QUARANTINED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is quarantined pending CSI resolution; compile and confirm are blocked' }

  /tests/{id}/confirm-compile:
    post:
      tags: [tests]
      operationId: confirmCompile
      summary: Confirm the current compiled candidate (deprecated)
      deprecated: true
      description: |
        Retained for compatibility. `POST /tests/{id}/compile` now accepts a valid candidate for the
        requesting principal, so no draft is left in `AWAITING_CONFIRMATION` by the current flow and
        this route has no caller in the UI.
      x-implemented-by: '10.9'
      parameters:
        - { $ref: '#/components/parameters/TestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmCompileRequest' }
            examples:
              confirm:
                value:
                  revisionId: 22222222-2222-2222-2222-222222222222
                  artifactHash: 9f2c1d5b7a3e4c6f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                  sourceRevision: 4
                  configurationRevision: 1
      responses:
        '200':
          description: Candidate confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The candidate is no longer the current one (`STALE_CANDIDATE`, §4.2), or the draft is
            not in a state that may be confirmed at all.

            The same lifecycle guard that gates compile gates confirmation — it is one method on one
            service and confirmation calls it before touching a revision row — so this operation
            carries `TEST_DELETED` and `TEST_QUARANTINED` for the same reasons and with the same
            remedies. The difference that matters to a caller is retriability: `STALE_CANDIDATE`
            is cleared by recompiling and confirming again, the other two are not cleared by
            anything the caller can do.
          x-conflict-codes: [STALE_CANDIDATE, TEST_DELETED, TEST_QUARANTINED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                staleCandidate:
                  value: { error: STALE_CANDIDATE, message: 'The draft moved on; recompile before confirming' }
                testDeleted:
                  value: { error: TEST_DELETED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is deleted; compile and confirm are blocked' }
                testQuarantined:
                  value: { error: TEST_QUARANTINED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is quarantined pending CSI resolution; compile and confirm are blocked' }

  /tests/{id}/execute:
    post:
      tags: [tests]
      operationId: executeTest
      summary: Accept an execution
      description: |
        Durable, principal-scoped idempotency: the same `Idempotency-Key` with the same request
        digest returns the same `executionId` across API replicas; the same key with a different
        digest is `409 IDEMPOTENCY_KEY_REUSED`. The response is returned only after commit.

        Story 10.1 persists the accepted `PENDING` execution and its ledger row. Live dispatch
        arrives with 10.7. Any authenticated application user may start a Studio execution;
        CSI ownership and a separate execute entitlement are not required. Secret-reference use,
        when that capability is enabled, remains independently authorized.
      parameters:
        - { $ref: '#/components/parameters/TestId' }
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Must be a UUID: the platform idempotency filter rejects any other form with
            `400 INVALID_IDEMPOTENCY_KEY` before the request reaches Studio.
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Execution accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecuteAccepted' }
              examples:
                accepted:
                  value:
                    executionId: 44444444-4444-4444-4444-444444444444
                    status: PENDING
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Lifecycle, readiness, runtime or idempotency conflict. Refused before any dispatch
            effect: no execution row, no ledger row, no browser.

            The readiness predicate's first term is lifecycle, and it refuses a soft-deleted or
            quarantined draft with that draft's **own** code rather than folding it into
            `COMPILE_REQUIRED`. The distinction is not cosmetic: `COMPILE_REQUIRED` tells an author
            to confirm a candidate, which is work they can do and which would not help — a deleted
            or quarantined draft would refuse the compile too (§8.3, BRD §9).
          x-conflict-codes:
            [COMPILE_REQUIRED, RUNTIME_INCOMPATIBLE, IDEMPOTENCY_KEY_REUSED, TEST_DELETED, TEST_QUARANTINED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                compileRequired:
                  value: { error: COMPILE_REQUIRED, message: 'The draft changed since its last confirmation' }
                runtimeIncompatible:
                  value: { error: RUNTIME_INCOMPATIBLE, message: 'The confirmed revision is not compatible with the current runner runtime' }
                idempotencyKeyReused:
                  value: { error: IDEMPOTENCY_KEY_REUSED, message: 'This idempotency key was already used with a different request body' }
                testDeleted:
                  value: { error: TEST_DELETED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is deleted and cannot be executed' }
                testQuarantined:
                  value: { error: TEST_QUARANTINED, message: 'UI Test 11111111-1111-1111-1111-111111111111 is quarantined pending CSI resolution and cannot be executed' }
        '429':
          description: Pending quota exhausted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Execution disabled by the kill switch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                dispatchDisabled:
                  value: { error: DISPATCH_DISABLED, message: 'Studio execution is currently disabled' }

  /executions:
    get:
      tags: [executions]
      operationId: listExecutions
      summary: Paged execution history
      description: |
        `testId` is optional. Results are filtered by the caller's readable CSIs using the
        execution's own immutable `csiId` — never the parent test's — **before** pagination.
        Executions whose `csiId` is null (quarantined legacy history) are never returned.
      parameters:
        - name: testId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Page of execution snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }

  /executions/{id}:
    get:
      tags: [executions]
      operationId: getExecution
      summary: Current execution snapshot
      description: |
        The same payload the SSE `execution.snapshot` event carries (architecture §5.5). This is
        the recovery and fallback path when streaming is unavailable.
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '200':
          description: Current snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionSnapshot' }
              examples:
                pending:
                  summary: Accepted, not yet started
                  value: { $ref: '#/components/examples/SnapshotPending/value' }
                running:
                  summary: Browser running, video still processing
                  value: { $ref: '#/components/examples/SnapshotRunning/value' }
                passed:
                  summary: Terminal PASSED with available video
                  value: { $ref: '#/components/examples/SnapshotPassed/value' }
                failed:
                  summary: Terminal FAILED — later steps SKIPPED with null timings
                  value: { $ref: '#/components/examples/SnapshotFailed/value' }
                errorTimeout:
                  summary: Terminal ERROR/TIMEOUT (legacy `TIMEOUT` status maps here)
                  value: { $ref: '#/components/examples/SnapshotErrorTimeout/value' }
                evidenceFailed:
                  summary: Outcome known, evidence production failed
                  value: { $ref: '#/components/examples/SnapshotEvidenceFailed/value' }
                evidenceUnavailable:
                  summary: No usable recording was produced
                  value: { $ref: '#/components/examples/SnapshotEvidenceUnavailable/value' }
                evidenceExpired:
                  summary: Retention window elapsed
                  value: { $ref: '#/components/examples/SnapshotEvidenceExpired/value' }
                legacyRow:
                  summary: Pre-10.1 history — no fabricated confirmation metadata
                  value: { $ref: '#/components/examples/SnapshotLegacyRow/value' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /executions/{id}/cancel:
    post:
      tags: [executions]
      operationId: cancelExecution
      summary: Cancel an execution
      description: |
        Studio v1 WP4, ADR-002 §29. Authorized as a **write** on the execution's own immutable CSI,
        before anything else: an unknown id and a CSI the caller may not write answer the same
        `403`, so neither is an existence oracle. No body.

        One compare-and-set on the dispatch ledger decides the request, and the `202` carries the
        snapshot as committed:

        | The run was | What happens | The `202` snapshot |
        |---|---|---|
        | queued, not yet sent to a runner | closed at once; no runner is called and no browser starts | `ERROR` / `CANCELLED`, `streamComplete` per evidence |
        | sent, not yet admitted | the admission is refused; the execution ends `ERROR` / `CANCELLED` when the runner asks | unchanged |
        | admitted or running | the runner holding it stops it — it learns the cancel from the API itself within ~3 s, whichever pod it is on: the browser gets a bounded grace to close and finalize its recording, then its process tree is killed; the runner's final report ends it `ERROR` / `CANCELLED` with whatever evidence exists | unchanged |

        A cancel the runner does not finish is closed `ERROR` / `CANCELLED` by the API's running
        reaper after a bounded margin. The terminal snapshot arrives on `GET /executions/{id}` and
        on the stream like any other; a caller keeps following the run until then.
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '202':
          description: Cancel recorded. The body is the execution snapshot as committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nothing to cancel. `EXECUTION_TERMINAL`: the outcome is already known (the run is
            terminal or finalizing its evidence). `CANCEL_ALREADY_REQUESTED`: a cancel was already
            recorded and is in progress. Neither is retriable; follow the snapshot instead.
          x-conflict-codes: [EXECUTION_TERMINAL, CANCEL_ALREADY_REQUESTED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                executionTerminal:
                  value: { error: EXECUTION_TERMINAL, message: 'This execution has already reached its outcome' }
                cancelAlreadyRequested:
                  value: { error: CANCEL_ALREADY_REQUESTED, message: 'A cancel was already requested for this execution' }

  /executions/{id}/events:
    get:
      tags: [executions]
      operationId: streamExecution
      summary: SSE snapshot stream
      x-implemented-by: '10.7'
      description: |
        `text/event-stream`. Event type is `execution.snapshot`; the SSE `id` is the snapshot
        `revision`. Every event body is a complete `ExecutionSnapshot` — identical in shape to
        `GET /executions/{id}`. The client replaces current state, ignores older revisions, and
        closes on `streamComplete: true`.
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Snapshot stream
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                snapshotEvent:
                  summary: One `execution.snapshot` frame
                  value: |
                    id: 17
                    event: execution.snapshot
                    data: {"executionId":"44444444-4444-4444-4444-444444444444","revision":17,"status":"RUNNING","streamComplete":false}

        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /executions/{id}/video:
    get:
      tags: [executions]
      operationId: getExecutionVideo
      summary: Protected video stream
      x-implemented-by: '10.15'
      description: |
        Authorized against the execution's immutable CSI. Object storage keys are never exposed;
        `videoPath` on the snapshot is this API path.

        Refusal order (ADR-002 §§24, 25, 31): session authentication, execution/CSI authorization,
        evidence state, then object storage. An unknown execution and an unreadable CSI both
        answer `403 STUDIO_FORBIDDEN`, before any recording details are read. `404`, `410`,
        `416`, and the store's `503 VIDEO_STORE_UNAVAILABLE` occur only after authorization.
        An authentication-service `503` can instead occur before Studio authorization.

        Authentication errors use the nested platform envelope; Studio refusals use flat
        `ErrorResponse`. Clients use the HTTP status for behavior. Native video/download
        navigation does not expose an error body to the UI; it must not infer a specific cause.
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
        - name: download
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Full video
          content:
            video/webm:
              schema: { type: string, format: binary }
        '206':
          description: Range response
          headers:
            Content-Range:
              schema: { type: string }
              description: 'Inclusive window and the total, both measured from the stored object: `bytes a-b/S`.'
            Content-Length:
              schema: { type: integer, minimum: 0 }
              description: Bytes in this response, which is the requested window's length and never the object's.
          content:
            video/webm:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/SessionUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No evidence for this execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                noEvidence:
                  value: { error: VIDEO_UNAVAILABLE, message: 'No evidence for this execution' }
        '410':
          description: Evidence expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                expired:
                  value: { error: VIDEO_EXPIRED, message: 'The recording for this execution expired on 2026-08-15T10:04:12Z' }
        '416':
          description: Unsatisfiable range
          headers:
            Content-Range:
              schema: { type: string }
              description: 'The unsatisfied-range form carrying the measured object size: `bytes` `*` `/S`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsatisfiable:
                  value: { error: RANGE_NOT_SATISFIABLE, message: 'The requested range cannot be served' }
        '503':
          description: |
            VIDEO_STORE_UNAVAILABLE means the authorized request could not reach object storage;
            the recording's disposition is unknown. It is not missing evidence (404), and the
            body exposes no bucket, endpoint, or object key. The authentication filter can also
            answer 503 AUTH_TEMPORARILY_UNAVAILABLE before authorization, using the nested
            platform envelope. These are distinct producers of the same status (ADR-002 §31).
          headers:
            Retry-After:
              description: Present with value 5 on the authentication-service failure only; the store failure does not promise this header.
              schema: { type: integer, enum: [5] }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ErrorResponse' }
                  - { $ref: '#/components/schemas/PlatformErrorResponse' }
              examples:
                storeUnavailable:
                  value: { error: VIDEO_STORE_UNAVAILABLE, message: "The evidence store could not be reached; the recording's disposition is unknown" }
                authenticationUnavailable:
                  value:
                    error:
                      code: AUTH_TEMPORARILY_UNAVAILABLE
                      message: Authentication service temporarily unavailable
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # Internal surface, architecture §8.4, in the order that section tabulates it.
  #
  # Runner-served routes live on the `studio-runner` Service, not on `/api/v1/studio`. Each path
  # item states its own base so the two deployments can never be confused for one (ADR-002).
  # ────────────────────────────────────────────────────────────────────────────────────────────

  /v1/validate:
    servers:
      - url: '{runnerBaseUrl}'
        description: |
          The `studio-runner` ClusterIP Service (ADR-001 §9). The real value is deployment
          configuration — the worker's runner URL (§8.5); the default below is only the in-cluster
          shape this chart renders. The runner has no Ingress, so this is never a public host.
        variables:
          runnerBaseUrl:
            default: http://put-checks-studio-runner:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    post:
      tags: [internal, runner]
      operationId: runnerValidateArtifact
      summary: Browser-free schema, AST and policy validation with per-step diagnostics
      description: |
        Architecture §8.4 (runner `POST /v1/validate`) and §4.5. Launches nothing, takes no
        capacity slot and creates no scratch state, so a saturated runner still answers it
        (§4.5, "control/validation endpoints have separate bounded resources").

        The response carries diagnostics only: never source text and never the typed operation
        list, which stays inside the runner (§4.5, §9.2).
      x-internal: true
      x-served-by: studio-runner
      x-implemented-by: '10.6'
      security:
        - serviceIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: Validation ran. `ok` reports the verdict; a rejected artifact is still a 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
        '400':
          description: Body is not JSON, not an object, carries an undeclared key, or `source` is not a string array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
        '401': { $ref: '#/components/responses/RunnerUnauthenticated' }
        '403': { $ref: '#/components/responses/RunnerForbidden' }
        '413':
          description: Body or step count over the configured input bound (§4.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
        '503':
          description: Validation exceeded its bounded budget (§4.5)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }

  /v1/runs:
    servers:
      - url: '{runnerBaseUrl}'
        description: |
          The `studio-runner` ClusterIP Service (ADR-001 §9). Deployment configuration (§8.5).
        variables:
          runnerBaseUrl:
            default: http://put-checks-studio-runner:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    post:
      tags: [internal, runner]
      operationId: runnerAdmitRun
      summary: Short admission request for one dispatched attempt
      description: |
        Architecture §8.4 (runner `POST /v1/runs`) and §5.1.4–5.1.5. A **short** request: the
        runner reserves capacity, performs the admission CAS against the API and answers `202`;
        the browser starts afterwards, and `RUNNING` is written only by an authenticated
        `STARTED` report, never by this response.

        Status semantics the caller must obey (§5.1, closing paragraph):

        | Status | Meaning | Worker action |
        |---|---|---|
        | `202` | Admitted; exactly one attempt owner | Await reports |
        | `400` | Invalid job or artifact | Terminal; do not resend |
        | `401` / `403` | Unauthorized | Terminal; do not resend |
        | `409` | Competing or expired admission | Terminal; do not resend |
        | `429` | **Definite** non-acceptance: nothing durable, no browser | Retry with `Retry-After` and jitter inside the pending deadline |
        | `503` | Draining, or the admission handshake did not settle | Ambiguous unless the code says otherwise; consult admission/progress/manifest state |

        A timeout, transport loss or `5xx` is ambiguous, not a refusal: do not resend browser
        work, and disable automatic POST retries in clients and proxies (§5.1).
      x-internal: true
      x-served-by: studio-runner
      x-implemented-by: '10.6'
      security:
        - serviceIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunJob' }
      responses:
        '202':
          description: Admitted. Capacity reserved and the admission CAS committed; the browser has not started yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAccepted' }
        '400':
          description: Job envelope or artifact rejected. `detail` carries codes and key names only, never a value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
              examples:
                callbackNotPermitted:
                  summary: A job trying to name its own callback destination (§8.4, §8.5)
                  value:
                    code: JOB_INVALID
                    detail:
                      - { code: JOB_CALLBACK_NOT_PERMITTED, field: callbackUrl }
        '401': { $ref: '#/components/responses/RunnerUnauthenticated' }
        '403': { $ref: '#/components/responses/RunnerForbidden' }
        '409':
          description: |
            A competing or expired admission already owns the attempt (§5.1.4).

            `code` is the refusal code the API's admission callback returned, propagated unchanged,
            falling back to `ADMISSION_COMPETING` when that body is unreadable. It therefore carries
            no `x-conflict-codes`: the set is the callback's to close, and its producer is story
            10.7 (ADR-002 §14, O-9). Declaring a set here before that producer exists would be
            inventing one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
        '429':
          description: |
            Capacity saturated. Definite non-acceptance: no durable admission and no browser
            started, so this is the one status that is safe to retry (§5.1, §8.4).
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
              description: Seconds. Apply jitter and stay inside the pending deadline (§5.1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
        '503':
          description: |
            Draining (`RUNNER_DRAINING`), or the admission handshake was refused or left
            ambiguous by the API (`ADMISSION_REJECTED`, `ADMISSION_AMBIGUOUS_*`). No browser
            was started (§5.1.4, §5.4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }

  /v1/runs/{id}:
    servers:
      - url: '{runnerBaseUrl}'
        description: |
          The `studio-runner` ClusterIP Service (ADR-001 §9). Deployment configuration (§8.5).
        variables:
          runnerBaseUrl:
            default: http://put-checks-studio-runner:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    delete:
      tags: [internal, runner]
      operationId: runnerCancelRun
      summary: Stop one admitted run
      description: |
        Studio v1 WP4, ADR-002 §29. Relayed by the worker's dispatcher for a cancel the API
        recorded; authenticated exactly like `POST /v1/runs`, on the request head. `id` is the
        `executionId` of the admitted run. No body.

        The runner reuses its total-runtime deadline's stop path: it asks the browser to stop,
        allows a bounded grace (`STUDIO_RUNNER_BROWSER_STOP_TIMEOUT_MS`, default 5 s; the chart
        deploys 15 s, ADR-002 §29.3) for the context to close and the recording to finalize, then
        kills the whole process tree. A run cancelled before its browser started never starts one.
        The step in flight is reported `SKIPPED` with a fixed stop text, never `FAIL` (§29.5). Either way the run delivers its
        `FINAL` report with `outcome.result: ERROR` and `outcome.errorCode: CANCELLED`, and with
        whatever evidence it achieved.

        Idempotent. A second `DELETE` of a run already stopping answers `202` again and orders
        nothing new.

        | Status | Meaning | Worker action |
        |---|---|---|
        | `202` | The run is stopping; its `FINAL` report follows | Record the relay; do not send again |
        | `404` | This runner holds no such run — with more than one runner pod, usually because the Service routed the request to another pod | Not an acknowledgement. Retry on a later pass; the owning runner also learns the cancel from `readExecutionControl` and the progress acknowledgement, and the API's running reaper is the backstop |
        | `409` | The run already finished; its report stands | Record the relay; do not send again |
      x-internal: true
      x-served-by: studio-runner
      security:
        - serviceIdentity: []
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '202':
          description: The run is stopping. Its `FINAL` report carries `ERROR` / `CANCELLED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCancelAccepted' }
        '401': { $ref: '#/components/responses/RunnerUnauthenticated' }
        '403': { $ref: '#/components/responses/RunnerForbidden' }
        '404':
          description: This runner holds no run for this execution (`RUN_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }
        '409':
          description: The run already finished on this runner (`RUN_FINISHED`); nothing was stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProblem' }

  /internal/studio/executions/{id}/admission:
    servers:
      - url: '{apiInternalBaseUrl}'
        description: |
          The backend API's internal base — **not** the public `/api/v1/studio` prefix these
          paths would otherwise inherit. It is the runner's callback base, which is deployment
          configuration (§8.4, §8.5) and never job-supplied. The default below is only the
          in-cluster shape this chart renders; these paths are not exposed through ingress.
        variables:
          apiInternalBaseUrl:
            default: http://put-checks-api:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    post:
      tags: [internal, api-callback]
      operationId: claimAdmission
      summary: CAS exclusive ownership of an attempt
      description: |
        Architecture §8.4 (API `POST /internal/studio/executions/{id}/admission`) and §5.1.4.
        Compare-and-set on `(attemptId, runnerInstanceId, admissionId)`: at most one identity owns
        an attempt, a duplicate of the *same* identity is acknowledged idempotently, and a
        competing or expired one gets `409`. No browser starts without a successful CAS.

        The runner issues **exactly one** of these per run and never generates a second
        `admissionId` for the same `attemptId`. A timeout, transport loss or `5xx` here is
        ambiguous — admission may already have committed — so the runner stops rather than
        resending, and the API's reaper resolves it (§5.1, §5.4).
      x-implemented-by: '10.7'
      x-internal: true
      x-served-by: api
      security:
        - serviceIdentity: []
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdmissionRequest' }
            examples:
              admit:
                summary: The exact shape the runner sends — identity plus the runtime it will run on (§4.6)
                value:
                  executionId: 44444444-4444-4444-4444-444444444444
                  attemptId: 55555555-5555-5555-5555-555555555555
                  runnerInstanceId: studio-runner-0
                  admissionId: 66666666-6666-6666-6666-666666666666
                  runtimeVersions:
                    playwright: 1.63.0
                    node: v22.11.0
                    validatorSchema: 2.0.0
                    executor: 2.0.0
                    syntaxReference: 2.1.0
      responses:
        '200':
          description: Admission owned by this identity (duplicate identical admission is idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionResponse' }
        '400':
          description: Malformed admission body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            A competing or expired admission already owns the attempt. Definite refusal: the
            runner stops and never re-attempts (§5.1.4).

            No `x-conflict-codes` yet: this operation has no producer until story 10.7, and the
            runner propagates whatever `error` this body carries into its own `/v1/runs` refusal,
            so closing the set here closes it in two places at once. 10.7 declares it (ADR-002 §14,
            O-9).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/studio/executions/{id}/control:
    servers:
      - url: '{apiInternalBaseUrl}'
        description: |
          The backend API's internal base, as for the other two callbacks (§8.4, §8.5). Never a
          public hostname and never exposed through ingress.
        variables:
          apiInternalBaseUrl:
            default: http://put-checks-api:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    get:
      tags: [internal, api-callback]
      operationId: readExecutionControl
      summary: Whether the run this runner holds has been cancelled
      description: |
        Studio v1 WP4, ADR-002 §29. The pull half of cancel. The runner that holds an admitted run
        reads this every ~2 s from admission until the run's outcome is known, and on
        `cancelRequested: true` stops the run through the same path as `DELETE /v1/runs/{id}`.
        It reaches the owning pod with no routing at all, which is why a cancel does not depend on
        the relayed `DELETE` landing on the right pod. The progress acknowledgement carries the
        same flag.

        Read-only: it writes nothing and moves no state. Same service identity as the other two
        callbacks.
      x-internal: true
      x-served-by: api
      security:
        - serviceIdentity: []
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '200':
          description: The execution's control state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '400':
          description: The path id is not a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No execution with this id (`EXECUTION_UNKNOWN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/studio/executions/{id}/progress:
    servers:
      - url: '{apiInternalBaseUrl}'
        description: |
          The backend API's internal base — **not** the public `/api/v1/studio` prefix these
          paths would otherwise inherit. It is the runner's callback base, which is deployment
          configuration (§8.4, §8.5) and never job-supplied. The default below is only the
          in-cluster shape this chart renders; these paths are not exposed through ingress.
        variables:
          apiInternalBaseUrl:
            default: http://put-checks-api:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    post:
      tags: [internal, api-callback]
      operationId: reportProgress
      summary: Cumulative STARTED/PROGRESS/FINAL snapshot from the runner
      description: |
        Architecture §8.4 (API `POST /internal/studio/executions/{id}/progress`) and §5.3.

        Every report is **full current state, never a delta**, so two lost deliveries are
        recovered by the third and nothing has to be replayed. The API validates ownership,
        `runnerSequence` ordering, permitted transitions, redaction and limits; applies the change
        conditionally; increments its own snapshot `revision`; and acknowledges only after commit.
        A delayed report may never overwrite a finalized execution or another admission.

        A `409` on any report stops the runner reporting for that run — ownership lost, attempt
        superseded, or the execution already settled (§5.3).

        The body is `RunnerReport`, which is **not** `ExecutionSnapshot`. It is the runner's
        vocabulary, the runner's clock and the runner's knowledge; the API projects it onto the
        public snapshot. See the mapping table on `RunnerReport` and ADR-002.
      x-implemented-by: '10.7'
      x-internal: true
      x-served-by: api
      security:
        - serviceIdentity: []
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerReport' }
            examples:
              started:
                summary: Authenticated browser-start report — the only thing that writes RUNNING
                value:
                  executionId: 44444444-4444-4444-4444-444444444444
                  attemptId: 55555555-5555-5555-5555-555555555555
                  admissionId: 66666666-6666-6666-6666-666666666666
                  runnerInstanceId: studio-runner-0
                  kind: STARTED
                  runnerSequence: 1
                  reportedAt: '2026-09-10T10:00:02Z'
                  browserStartedAt: '2026-09-10T10:00:02Z'
                  steps: []
                  logs:
                    - { atMs: 0, level: info, message: browser started }
                  logsTruncated: false
                  runtimeVersions:
                    playwright: 1.63.0
                    node: v22.11.0
                    validatorSchema: 2.0.0
                    executor: 2.0.0
                    syntaxReference: 2.1.0
                  outcome: null
                  evidence: null
              final:
                summary: Terminal report; settles outcome and evidence together
                description: |
                  `atMs` is an offset on the run timeline, not a wall-clock instant: `0` is the
                  browser start, and the terminal line carries `null` because the runner holds no
                  reading at that point. An absolute instant is `browserStartedAt + atMs`.
                value:
                  executionId: 44444444-4444-4444-4444-444444444444
                  attemptId: 55555555-5555-5555-5555-555555555555
                  admissionId: 66666666-6666-6666-6666-666666666666
                  runnerInstanceId: studio-runner-0
                  kind: FINAL
                  runnerSequence: 9
                  reportedAt: '2026-09-10T10:00:39Z'
                  browserStartedAt: '2026-09-10T10:00:02Z'
                  steps:
                    - { stepIndex: 0, status: PASS, startedAtMs: 120, finishedAtMs: 4300, durationMs: 4180, failure: null }
                    - { stepIndex: 1, status: PASS, startedAtMs: 4300, finishedAtMs: 36900, durationMs: 32600, failure: null }
                  logs:
                    - { atMs: 0, level: info, message: browser started }
                    - { atMs: 36900, level: info, message: step 1 PASS }
                    - { atMs: null, level: info, message: run PASSED }
                  logsTruncated: false
                  runtimeVersions:
                    playwright: 1.63.0
                    node: v22.11.0
                    validatorSchema: 2.0.0
                    executor: 2.0.0
                    syntaxReference: 2.1.0
                  outcome: { result: PASSED, errorCode: null, errorMessage: null }
                  evidence:
                    videoKey: studio/60406/11111111-1111-1111-1111-111111111111/44444444-4444-4444-4444-444444444444/55555555-5555-5555-5555-555555555555.webm
                    manifestKey: studio/60406/11111111-1111-1111-1111-111111111111/44444444-4444-4444-4444-444444444444/55555555-5555-5555-5555-555555555555.result.json
                    state: STORED
      responses:
        '200':
          description: |
            Applied and committed. The acknowledgement is sent only after commit, because the
            runner retries a terminal report until it is acknowledged (§5.3).

            A duplicate delivery of an already-applied `(attemptId, runnerSequence)` from the
            exactly-matching identity is also `200`, with `applied: false` and nothing changed.
            It is not a `409`: on both internal routes `409` means a *competing* party, and
            10.6 AC-18 turns any `409` into stop-and-audit. A byte-identical re-delivery is the
            same owner obeying the retry-until-acknowledged rule this API imposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressAck' }
              examples:
                applied:
                  value:
                    executionId: 44444444-4444-4444-4444-444444444444
                    runnerSequence: 9
                    applied: true
                    revision: 18
                duplicate:
                  summary: The same identity and sequence re-delivered; nothing was applied
                  value:
                    executionId: 44444444-4444-4444-4444-444444444444
                    runnerSequence: 9
                    applied: false
                    revision: 18
        '400':
          description: Malformed report body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Ownership, sequence or transition conflict: this attempt no longer owns the
            execution, the sequence is not increasing, or the execution is already finalized.
            The runner stops reporting for this run on receipt (§5.3).

            No `x-conflict-codes` yet: the three conditions above are distinguishable and should
            each carry their own code, but the producer is story 10.7 and the runner branches on
            the status alone today. 10.7 declares the set (ADR-002 §14, O-9).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Report body over the configured callback bound (§5.4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /health:
    servers:
      - url: '{runnerBaseUrl}'
        description: |
          The `studio-runner` ClusterIP Service (ADR-001 §9). Deployment configuration (§8.5).
        variables:
          runnerBaseUrl:
            default: http://put-checks-studio-runner:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    get:
      tags: [internal, runner]
      operationId: runnerHealth
      summary: Liveness
      description: |
        Architecture §8.4 (runner `GET /health`). Liveness only: it stays `200` while the pool is
        saturated **and** while the pod is draining, because a draining pod that is finishing an
        admitted run must not be killed by the kubelet (§5.2, §5.4). Readiness, not liveness, is
        what removes a draining pod from service. Wired as the liveness probe (ADR-001 §9).
      x-internal: true
      x-served-by: studio-runner
      x-implemented-by: '10.6'
      security:
        - serviceIdentity: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '401': { $ref: '#/components/responses/RunnerUnauthenticated' }
        '403': { $ref: '#/components/responses/RunnerForbidden' }

  /ready:
    servers:
      - url: '{runnerBaseUrl}'
        description: |
          The `studio-runner` ClusterIP Service (ADR-001 §9). Deployment configuration (§8.5).
        variables:
          runnerBaseUrl:
            default: http://put-checks-studio-runner:8080
            description: Deployment configuration (§8.5). Never a public hostname.
    get:
      tags: [internal, runner]
      operationId: runnerReadiness
      summary: Ability to admit safely
      description: |
        Architecture §8.4 (runner `GET /ready`). **Capacity saturation alone keeps readiness
        true**: a saturated but healthy pod answers `200` here and refuses work with `429` on
        `POST /v1/runs`, because removing it from the Service would only move the same saturation
        onto its peers. Draining sets readiness false, which is how `preStop` takes a terminating
        pod out of rotation before the grace period runs (§5.2, §5.4, ADR-001 §9).
      x-internal: true
      x-served-by: studio-runner
      x-implemented-by: '10.6'
      security:
        - serviceIdentity: []
      responses:
        '200':
          description: Ready to admit. `inUse == size` is still ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '401': { $ref: '#/components/responses/RunnerUnauthenticated' }
        '403': { $ref: '#/components/responses/RunnerForbidden' }
        '503':
          description: 'Draining. Same body shape, with `ready` false.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }

components:
  securitySchemes:
    serviceIdentity:
      type: http
      scheme: bearer
      description: |
        Restricted service identity over encrypted transport, required on every `internal` route
        (architecture §8.4, §9.2). Presented as `Authorization: Bearer <token>`; the credential is
        never carried in a URL or a query string.

        It is not a platform user session and grants no CSI permission by itself: the runner holds
        no DB, vault, CSI or LLM credential (§9.2). Public routes use the platform gateway identity
        instead and are unaffected by this scheme.

  parameters:
    TestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsiIdQuery:
      name: csiId
      in: query
      required: false
      schema: { type: string, maxLength: 20 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: No authenticated identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SessionUnauthorized:
      description: |
        No authenticated user session on a public route. Answered by the platform authentication
        filter on every `/api/**` path before any Studio code runs, so the body is
        `PlatformErrorResponse` and **not** `ErrorResponse`: `error` is an object here and a
        string on every Studio refusal. Branch on the status. Unifying the two envelopes is
        outside this document (ADR-002 §25). The two internal callbacks keep `Unauthorized`,
        whose producer is the service-identity filter and whose body is `ErrorResponse`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformErrorResponse' }
          examples:
            sessionRequired:
              value: { error: { code: UNAUTHENTICATED, message: Session required, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 } }
    Forbidden:
      description: The identity may not act on this CSI
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RunnerUnauthenticated:
      description: |
        No service identity, or one the runner does not accept. Checked on the request head before
        anything else happens — before the body is read, before capacity is touched.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RunnerProblem' }
    RunnerForbidden:
      description: The service identity is not permitted to call the runner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RunnerProblem' }

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    PlatformErrorResponse:
      description: |
        The envelope the application's servlet filters write — authentication, rate limiting and
        idempotency — as opposed to a Studio handler's `ErrorResponse`. Backend spec §6.1
        (`CON-API-03`) and story 1.5 AC-5. `traceId` differs on every request and is absent from
        some filters' bodies.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string }

    Viewport:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, minimum: 320, maximum: 3840 }
        height: { type: integer, minimum: 240, maximum: 2160 }

    TestConfiguration:
      type: object
      required: [browser, viewport, timeoutSeconds, waitStrategy]
      properties:
        browser:
          type: string
          enum: [chromium]
          description: |
            Canonical engine. The legacy value `chrome` is normalized to `chromium` at the
            controller boundary; any other engine is rejected with `400 INVALID_CONFIGURATION`.
        viewport: { $ref: '#/components/schemas/Viewport' }
        # The PER-STEP timeout. The whole-run browser budget is server configuration
        # (`studio.execution.total-runtime`, 120s) and travels on `deadlines.totalRuntimeMs`.
        # The dispatcher used to derive the total from this value, which capped every run at the
        # step timeout and produced a recording that stopped mid-test.
        timeoutSeconds: { type: integer, minimum: 1, maximum: 120 }
        waitStrategy:
          type: string
          enum: [none, networkidle, domcontentloaded, load]

    Variable:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 64 }
        kind: { type: string, enum: [plain, secretRef] }
        value:
          type: string
          nullable: true
          description: Present for `plain` only.
        secretId:
          type: string
          nullable: true
          description: Present for `secretRef` only. A reference; a resolved secret is never carried on this contract.

    LegacyAuthoringRequest:
      type: object
      additionalProperties: false
      required: [steps]
      description: |
        The pre-v2 ordered authoring source. The adapter copies every string byte-for-byte into
        `AuthoringStep.text`, assigns a stable UUID once at migration/save and supplies no context.
        IDs must never be derived from array position, because reorder must not change identity.
      properties:
        steps:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 500 }

    AuthoringV2Request:
      type: object
      additionalProperties: false
      required: [authoringSchemaVersion, steps]
      description: |
        Canonical context-aware authoring source. The array is presentation order; `id` is
        identity. `globalContext` and each step's `context` are optional and semantically empty
        when absent. Unknown fields, mixed string/object steps, missing IDs and duplicate IDs are
        invalid. `x-unique-by` is a machine-readable cross-item invariant implemented by both
        pure-model validators because OpenAPI 3.0 `uniqueItems` cannot compare one object field.
      properties:
        authoringSchemaVersion: { type: integer, enum: [2] }
        globalContext: { $ref: '#/components/schemas/GlobalAuthoringContext' }
        steps:
          type: array
          maxItems: 100
          x-unique-by: id
          items: { $ref: '#/components/schemas/AuthoringStep' }

    AuthoringV2Response:
      type: object
      additionalProperties: false
      required: [authoringSchemaVersion, steps]
      description: |
        Round-tripped v2 authoring source plus optional immutable-revision and review projections.
        The source fields retain the same exact values and identity invariants as the request.
      properties:
        authoringSchemaVersion: { type: integer, enum: [2] }
        globalContext: { $ref: '#/components/schemas/GlobalAuthoringContext' }
        steps:
          type: array
          maxItems: 100
          x-unique-by: id
          items: { $ref: '#/components/schemas/AuthoringStep' }
        revisionInputs: { $ref: '#/components/schemas/AuthoringRevisionInputs' }
        review:
          type: array
          items: { $ref: '#/components/schemas/ResolvedStepReview' }

    AuthoringStep:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
          description: Stable identity. Retained on edit/reorder; fresh on insertion/copy.
        text:
          type: string
          maxLength: 500
          description: Exact authored source, including empty, Unicode and whitespace values.
        context: { $ref: '#/components/schemas/StepAuthoringContext' }

    GlobalAuthoringContext:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            oneOf:
              - { $ref: '#/components/schemas/ContextText' }
              - { $ref: '#/components/schemas/TargetHint' }
              - { $ref: '#/components/schemas/ContextualDefault' }
            discriminator:
              propertyName: kind
        evidenceReferences:
          type: array
          items: { $ref: '#/components/schemas/AuthoringEvidenceReference' }

    StepAuthoringContext:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            oneOf:
              - { $ref: '#/components/schemas/ContextText' }
              - { $ref: '#/components/schemas/LiteralInput' }
              - { $ref: '#/components/schemas/VariableReference' }
              - { $ref: '#/components/schemas/SecretReference' }
              - { $ref: '#/components/schemas/TargetHint' }
              - { $ref: '#/components/schemas/ContextualDefault' }
            discriminator:
              propertyName: kind
        evidenceReferences:
          type: array
          items: { $ref: '#/components/schemas/AuthoringEvidenceReference' }

    ContextText:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, enum: [text] }
        value: { type: string }

    LiteralInput:
      type: object
      additionalProperties: false
      required: [kind, value]
      description: Explicit step input. `value` is exact and may be empty.
      properties:
        kind: { type: string, enum: [literal] }
        value: { type: string }

    VariableReference:
      type: object
      additionalProperties: false
      required: [kind, referenceId]
      description: Opaque nonsecret value reference; the referenced value is a revision input.
      properties:
        kind: { type: string, enum: [variableRef] }
        referenceId: { type: string, minLength: 1 }

    SecretReference:
      type: object
      additionalProperties: false
      required: [kind, referenceId]
      description: Opaque secret reference permitted only as explicit step input.
      properties:
        kind: { type: string, enum: [secretRef] }
        referenceId: { type: string, minLength: 1 }

    TargetHint:
      type: object
      additionalProperties: false
      required: [kind, strategy, value]
      properties:
        kind: { type: string, enum: [targetHint] }
        strategy: { type: string, enum: [role, label, testId, text] }
        value: { type: string, minLength: 1 }
        scope: { type: string }
        exact: { type: boolean, default: false }

    ContextualDefault:
      type: object
      additionalProperties: false
      required: [kind, name, value]
      description: A nonsecret contextual default; explicit current-step input wins.
      properties:
        kind: { type: string, enum: [default] }
        name: { type: string, minLength: 1 }
        value:
          oneOf:
            - { $ref: '#/components/schemas/DefaultLiteralValue' }
            - { $ref: '#/components/schemas/DefaultVariableValue' }
          discriminator:
            propertyName: kind

    DefaultLiteralValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, enum: [literal] }
        value: { type: string }

    DefaultVariableValue:
      type: object
      additionalProperties: false
      required: [kind, referenceId]
      properties:
        kind: { type: string, enum: [variableRef] }
        referenceId: { type: string, minLength: 1 }

    AuthoringEvidenceReference:
      type: object
      additionalProperties: false
      required: [id, revision, source, csiId, environment, route, state, stepId, capturedAt, completeness, hash]
      description: |
        Evidence an author may select. `source` is deliberately restricted to `supplied`:
        imported/user-authored data cannot claim trusted observed provenance.
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        source: { type: string, enum: [supplied] }
        csiId: { type: string, maxLength: 20 }
        environment: { type: string, maxLength: 50 }
        route: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        stepId:
          type: string
          format: uuid
          x-reference-target: AuthoringV2Request.steps.id
        capturedAt: { type: string, format: date-time }
        completeness: { type: string, enum: [complete, partial, unknown] }
        hash: { type: string, pattern: '^[a-f0-9]{64}$' }

    EvidenceReference:
      type: object
      additionalProperties: false
      required: [id, revision, source, csiId, environment, route, state, stepId, capturedAt, completeness, hash]
      description: Server-held reference. Only a trusted capture boundary may mint `observed`.
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        source: { type: string, enum: [supplied, observed] }
        csiId: { type: string, maxLength: 20 }
        environment: { type: string, maxLength: 50 }
        route: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        stepId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        completeness: { type: string, enum: [complete, partial, unknown] }
        hash: { type: string, pattern: '^[a-f0-9]{64}$' }

    AuthoringRevisionInputs:
      type: object
      additionalProperties: false
      required: [contextDigest, globalContext, stepContexts, nonsecretReferencedValues, selectedEvidenceReferences]
      description: |
        The four execution-affecting context inputs included in configuration/context identity.
        Hashes bind exact canonical values without publishing referenced values. `contextDigest`
        covers the ordered stable step IDs/text plus all four collections. A change makes a
        candidate stale and requires matching recompile/reconfirmation.
      x-execution-affecting:
        [globalContext, stepContexts, nonsecretReferencedValues, selectedEvidenceReferences]
      properties:
        contextDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        globalContext: { type: string, pattern: '^[a-f0-9]{64}$' }
        stepContexts:
          type: array
          x-unique-by: stepId
          items:
            type: object
            additionalProperties: false
            required: [stepId, hash]
            properties:
              stepId: { type: string, format: uuid }
              hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        nonsecretReferencedValues:
          type: array
          x-unique-by: referenceId
          items:
            type: object
            additionalProperties: false
            required: [referenceId, valueHash]
            properties:
              referenceId: { type: string, minLength: 1 }
              valueHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        selectedEvidenceReferences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, revision, hash]
            properties:
              id: { type: string, format: uuid }
              revision: { type: integer, format: int64, minimum: 1 }
              hash: { type: string, pattern: '^[a-f0-9]{64}$' }

    ResolvedStepReview:
      type: object
      additionalProperties: false
      required: [stepId, operation, target, input, contextProvenance, diagnostics]
      properties:
        stepId: { type: string, format: uuid }
        operation: { $ref: '#/components/schemas/ResolvedOperation' }
        target: { $ref: '#/components/schemas/ResolvedTarget' }
        input: { $ref: '#/components/schemas/ResolvedInput' }
        contextProvenance:
          type: array
          items: { $ref: '#/components/schemas/ContextProvenance' }
        assertions:
          type: array
          items: { type: string }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/AuthoringDiagnostic' }

    ResolvedOperation:
      type: object
      nullable: true
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [navigate, click, fill, press, select, check, assert] }

    ResolvedTarget:
      type: object
      nullable: true
      additionalProperties: false
      required: [strategy, value]
      properties:
        strategy: { type: string, enum: [role, label, testId, text, url] }
        value: { type: string }
        exact: { type: boolean, default: false }
        evidenceReferenceId: { type: string, format: uuid, nullable: true }

    ResolvedInput:
      nullable: true
      oneOf:
        - { $ref: '#/components/schemas/ResolvedLiteralInput' }
        - { $ref: '#/components/schemas/ResolvedReferenceInput' }
      discriminator:
        propertyName: kind

    ResolvedLiteralInput:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, enum: [literal] }
        value: { type: string }

    ResolvedReferenceInput:
      type: object
      additionalProperties: false
      required: [kind, referenceId]
      properties:
        kind: { type: string, enum: [variableRef, secretRef] }
        referenceId: { type: string, minLength: 1 }

    ContextProvenance:
      type: object
      additionalProperties: false
      required: [field, scope, sourceKind]
      properties:
        field: { type: string, minLength: 1 }
        scope: { type: string, enum: [explicitStep, stepContext, globalContext, policy, evidence] }
        sourceKind: { type: string, enum: [user, supplied, observed, policy] }
        sourceId: { type: string, nullable: true }

    AuthoringDiagnostic:
      type: object
      additionalProperties: false
      required: [category, stepId, field, message]
      properties:
        category:
          type: string
          enum: [missingContext, conflictingValue, ambiguousTarget, incompatibleEvidence,
                 staleEvidence, literalMismatch, unsupportedOperation]
        stepId: { type: string, format: uuid, nullable: true }
        field: { type: string, nullable: true }
        message: { type: string }

    TestRequest:
      type: object
      required: [name, environment, steps, configuration]
      description: |
        Clients never submit executable code. The server generates the artifact from `steps`.
        `csiId` is required on create, immutable afterwards. `sourceRevision`/`configurationRevision`
        are required on update and ignored on create.

        This remains the live v1 route body while context persistence is implemented by a later
        story. `x-authoring-v2-request` points to the frozen successor component; consumers may
        build pure models against it but must not infer that the current controller accepts it.
      x-authoring-v2-request: '#/components/schemas/AuthoringV2Request'
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        csiId: { type: string, maxLength: 20, nullable: true }
        environment: { type: string, maxLength: 50 }
        steps:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 500 }
        variables:
          type: array
          items: { $ref: '#/components/schemas/Variable' }
        configuration: { $ref: '#/components/schemas/TestConfiguration' }
        sourceRevision: { type: integer, format: int64, nullable: true }
        configurationRevision: { type: integer, format: int64, nullable: true }

    TestDto:
      type: object
      required: [id, name, csiId, environment, steps, variables, configuration, sourceRevision, configurationRevision, compileStatus]
      description: |
        One Studio draft. `compileStatus`, `currentCandidateRevisionId`, `confirmedRevisionId`,
        `compileError` and `compileDiagnostics` are the compile-state projection of §4.2, read
        from the draft row in one transaction — so the diagnostics in a response are always
        index-aligned to the `steps` in the *same* response, and describe the `sourceRevision`
        and `configurationRevision` in the same response (ADR-002 §16.3).

        `currentCandidateArtifactHash` and `currentCandidateArtifact` belong to the revision
        `currentCandidateRevisionId` names and are read in that **same** transaction. That is
        what makes `ConfirmCompileRequest` a coherent conditional transaction: all four of its
        fields come from one read of this body, so the revision, the hash, the source revision
        and the configuration revision the client asserts are a set the draft actually held at
        one instant (ADR-002 §21.3).

        `compileError` and `compileDiagnostics` are **mutually exclusive** and at most one is
        ever non-null: a failed compile (`STALE`) carries a code, an unrunnable one
        (`NEEDS_REVISION`) carries per-step reasons, and every other transition clears both.

        This remains the live v1 response projection. `x-authoring-v2-response` points to the
        frozen context-aware successor without claiming that persistence/controller wiring ships
        in this contract-only story.
      x-authoring-v2-response: '#/components/schemas/AuthoringV2Response'
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        csiId: { type: string, nullable: true }
        environment: { type: string }
        steps:
          type: array
          items: { type: string }
        variables:
          type: array
          items: { $ref: '#/components/schemas/Variable' }
        configuration: { $ref: '#/components/schemas/TestConfiguration' }
        status: { type: string, nullable: true }
        schedule: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastRunStatus:
          type: string
          nullable: true
          enum: [PASSED, FAILED, ERROR, null]
        sourceRevision: { type: integer, format: int64 }
        configurationRevision: { type: integer, format: int64 }
        compileStatus:
          type: string
          enum: [STALE, COMPILING, AWAITING_CONFIRMATION, READY, NEEDS_REVISION]
        currentCandidateRevisionId: { type: string, format: uuid, nullable: true }
        currentCandidateArtifactHash:
          type: string
          minLength: 64
          maxLength: 64
          nullable: true
          description: |
            The canonical artifact hash of the revision `currentCandidateRevisionId` names, and
            the field `ConfirmCompileRequest.artifactHash` is read from. Null when there is no
            candidate.

            The name is qualified deliberately (ADR-002 §21.4): on a body that also carries
            `confirmedRevisionId`, a bare `artifactHash` would not say which revision it belongs
            to, and the one thing the confirmation body must never be ambiguous about is which
            revision the client is asserting. Always null on `GET /tests`.
        currentCandidateArtifact:
          type: object
          nullable: true
          description: |
            The candidate revision's immutable validated artifact. Null when there is no
            candidate, and always null on `GET /tests`.

            Declared opaque on purpose, exactly as `ValidateRequest.artifact` and `RunJob.artifact`
            are: its normative schema is `docs/specs/studio/artifact.schema.json`, held
            byte-identical against the backend copy by `ArtifactSchemaDriftTest`. Restating its
            shape here would create a second place for it to drift.

            This is the **candidate's** artifact and `steps` is the draft's current English. The
            review surface renders this when it claims to show what was validated; deriving that
            from `steps` would present the client's reading of the sentence as the validator's
            reading of the artifact (ADR-002 §21.7, architecture §4.7).
        confirmedRevisionId: { type: string, format: uuid, nullable: true }
        confirmedRevisionArtifactHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: |
            Canonical artifact hash of exactly confirmedRevisionId, read with the draft and its
            confirmed revision in one transaction (ADR-002 section 29). Independent of the current
            candidate. Null when no readable retained confirmed revision exists; always null on
            GET /tests. Never synthesized from draft steps or substituted from the candidate.
        confirmedRevisionArtifact:
          type: object
          nullable: true
          description: |
            Immutable validated artifact of exactly confirmedRevisionId, read in the same transaction
            as confirmedRevisionArtifactHash. Its normative schema is artifact.schema.json, as for
            currentCandidateArtifact. Null when no readable retained confirmed revision exists;
            always null on GET /tests. Edits and failed compiles do not replace this artifact with
            candidate source. A stale draft cannot execute merely because historical source exists.
        compileError: { $ref: '#/components/schemas/CompileError' }
        compileDiagnostics: { $ref: '#/components/schemas/CompileDiagnostics' }

    TestPage:
      type: object
      required: [data, page, size, totalElements, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TestDto' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    ExecutionStatus:
      type: string
      enum: [PENDING, RUNNING, PASSED, FAILED, ERROR]
      description: |
        Legacy values are adapted on read: `COMPLETED` becomes `PASSED`; `TIMEOUT` becomes
        `ERROR` with `errorCode: TIMEOUT`. A timeout is never a distinct execution status.

    ExecutionErrorCode:
      type: string
      nullable: true
      enum:
        [TIMEOUT, DISPATCH_FAILED, DISPATCH_UNKNOWN, START_TIMEOUT, STALE, DISPATCH_DISABLED,
         AUTHORIZATION_REVOKED, REFERENCE_UNAVAILABLE, CANCELLED, null]
      description: |
        The terminal code carried next to `status: ERROR`. Null on every other status, and null on
        an `ERROR` whose cause the API could not name.

        **Every value is assigned by the API** — by its dispatcher (§5.1.3), by its pending or
        running reaper (§5.4), by the cancel route and the admission CAS (ADR-002 §29), or by the
        two mappings the API applies to a runner's terminal report — §8.2's `TIMEOUT`, and
        `CANCELLED` against a recorded cancel. A runner never supplies one: `RunOutcome.errorCode` is an open string whose set
        intersects this one only at `TIMEOUT` and `CANCELLED`, and the API assigns each itself
        rather than copying it — `CANCELLED` only against a cancel it recorded (ADR-002 §6.1, §15,
        §29). The exhaustive per-code assigners are in `x-assigned-by`.

        The codes divide on **what a caller may conclude about the browser, and on who can clear the
        condition** — the same axis that separates the draft-lifecycle `409`s. None is a synonym for
        another:

        | Code | What the API observed | Browser | What clears it |
        |---|---|---|---|
        | `DISPATCH_DISABLED` | Execution was switched off platform-wide before this row was sent (§5.4) | never started | an operator re-enabling execution; affects every queued row, not this one |
        | `AUTHORIZATION_REVOKED` | The dispatcher's pre-send recheck found the principal's CSI execute permission revoked (§5.1.3) | never started | restoring that principal's entitlement, out of band; retrying cannot |
        | `REFERENCE_UNAVAILABLE` | A declared variable or secret reference that preflighted at acceptance no longer resolved at dispatch (§5.1.1, §5.1.3) | never started | restoring the reference or correcting the draft's declarations; retrying cannot |
        | `DISPATCH_FAILED` | The send was definitely refused and not retriable, or the pending deadline passed with no admission (§5.4) | definitely not started | a new execution |
        | `DISPATCH_UNKNOWN` | The send's outcome was ambiguous and no admission, progress or manifest resolved it (§5.4) | **unknown; a caller must assume neither** | investigation. §5.1 forbids resending browser work on an ambiguous outcome, so a new run is an explicit human decision |
        | `START_TIMEOUT` | Admitted, but the browser-start deadline passed with no start report and no reconciling manifest (§5.4) | admitted; start never confirmed | a new execution |
        | `STALE` | Ran past the fixed runtime plus its finalization and delivery margins with no reconciling manifest (§5.4) | started | a new execution |
        | `TIMEOUT` | The parent enforced the total runtime cap (§8.2) | started, then killed | a shorter test, or a higher configured cap within server limits |
        | `CANCELLED` | A principal cancelled the execution and it ended because of that (ADR-002 §29) | never started if cancelled before admission; otherwise stopped within a bounded grace, then killed | nothing: it is the outcome that was asked for. A new execution is a fresh decision, not a remedy |

        A step locator or assertion timeout is **not** `TIMEOUT`: it is a step `FAIL` and an
        execution `FAILED`, with no code at all (§8.2).

        `AUTHORIZATION_REVOKED` and `REFERENCE_UNAVAILABLE` were added by ADR-002 §15 for §5.1.3's
        two pre-send conditions, which §5.1.3 requires to be terminal with an explicit code and does
        not name. `CANCELLED` was added by ADR-002 §29 with the cancel route. The other six are
        10.1's.
      x-assigned-by:
        # Exhaustive, and the machine-readable form of the two facts the prose above states: which
        # component assigns each code, and that none of them is `studio-runner`. Keys are exactly
        # the non-null members of `enum`; a code with no assigner, or an assigner with no code, is a
        # conformance failure. Same mechanism as `x-conflict-codes` (§14) and `x-served-by` (§3.1):
        # a fact conveyed only by prose or by an example cannot fail a test.
        TIMEOUT: [report-projection]
        DISPATCH_FAILED: [dispatcher, pending-reaper]
        DISPATCH_UNKNOWN: [pending-reaper]
        START_TIMEOUT: [running-reaper]
        STALE: [running-reaper]
        DISPATCH_DISABLED: [dispatcher]
        AUTHORIZATION_REVOKED: [dispatcher]
        REFERENCE_UNAVAILABLE: [dispatcher]
        CANCELLED: [cancel-route, admission-cas, running-reaper, report-projection]

    StepStatus:
      type: string
      enum: [PENDING, RUNNING, PASS, FAIL, SKIPPED]

    StepResult:
      type: object
      required: [stepIndex, originalText, status]
      description: |
        One entry per original step. Skipped or unstarted steps carry null timings — except the
        step a cancel interrupted, which is `SKIPPED` with the start it had (`offsetMs`) and the
        runner's fixed stop text in `message` (ADR-002 §29.5).
      properties:
        stepIndex: { type: integer, minimum: 0 }
        originalText: { type: string }
        status: { $ref: '#/components/schemas/StepStatus' }
        offsetMs:
          type: integer
          format: int64
          nullable: true
          description: |
            Start offset on the recording timeline; null unless the step was attempted. It is the
            rounded `RunnerStepState.startedAtMs`: the reading arrives already on the recording
            timeline (§6.4), so the API rounds and persists it and performs no calibration of its
            own — in particular it never re-bases readings against the first one it sees (ADR-002
            §INT-5).
        durationMs: { type: integer, format: int64, nullable: true }
        message: { type: string, nullable: true }

    ExecutionLogEntry:
      type: object
      required: [at, level, message]
      description: |
        A log line as the **API publishes** it. The runner does not produce this shape: it posts
        `RunnerLogEntry`, whose `atMs` is an offset on the run timeline rather than an instant
        (§6.4). The API derives `at` as `browserStartedAt + atMs` and upper-cases `level`. That
        addition is the whole derivation: `atMs` is already zeroed on the recording origin, and
        `browserStartedAt` is the wall-clock reading of that same origin (ADR-002 §INT-5).

        `at` is null where the runner held no reading and the derivation therefore has no input.
        `stepIndex` has no runner-side source today and is null for runner-produced lines; it is
        retained for API-produced entries (reaper and evidence updates, §5.3). See ADR-002 §INT-1.
      properties:
        at: { type: string, format: date-time, nullable: true }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        message: { type: string, maxLength: 2000 }
        stepIndex: { type: integer, nullable: true }

    VideoStatus:
      type: string
      enum: [PROCESSING, AVAILABLE, FAILED, UNAVAILABLE, EXPIRED]
      description: |
        Evidence state is independent of the check outcome. `UNAVAILABLE` covers runs with no
        usable recording; `FAILED` covers evidence production or upload failure.

    VideoEvidence:
      type: object
      required: [status, partial]
      properties:
        status: { $ref: '#/components/schemas/VideoStatus' }
        error: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        partial:
          type: boolean
          description: True when an available recording covers only part of the run.

    RuntimeVersions:
      type: object
      description: Actual runtime versions recorded on the execution. Null for legacy history.
      properties:
        playwright: { type: string, nullable: true }
        chromium: { type: string, nullable: true }
        validator: { type: string, nullable: true }
        executor: { type: string, nullable: true }
        image: { type: string, nullable: true }

    ExecutionSnapshot:
      type: object
      description: |
        The single execution payload. `GET /executions/{id}`, the items of `GET /executions`, and
        the SSE `execution.snapshot` event all carry exactly this shape (architecture §5.5).
      required:
        [executionId, testId, csiId, revisionId, status, errorCode, acceptedAt, startedAt, endedAt,
         durationMs, stepResults, logs, logsTruncated, video, videoPath, runtime, revision,
         streamComplete]
      properties:
        executionId: { type: string, format: uuid }
        testId: { type: string, format: uuid }
        csiId:
          type: string
          nullable: true
          description: The execution's own immutable CSI, never the parent test's current value.
        revisionId:
          type: string
          format: uuid
          nullable: true
          description: Null for legacy history, which never had a confirmed revision.
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        errorCode: { $ref: '#/components/schemas/ExecutionErrorCode' }
        acceptedAt:
          type: string
          format: date-time
          description: Immutable acceptance instant; also the history partition key.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Browser start. Null until an authenticated runner start report is committed.
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs:
          type: integer
          format: int64
          nullable: true
          description: Browser execution time only. Queue time is not included.
        stepResults:
          type: array
          items: { $ref: '#/components/schemas/StepResult' }
        logs:
          type: array
          description: Bounded retained log buffer.
          items: { $ref: '#/components/schemas/ExecutionLogEntry' }
        logsTruncated: { type: boolean }
        video: { $ref: '#/components/schemas/VideoEvidence' }
        videoPath:
          type: string
          nullable: true
          description: Protected API path. Never an object storage key or a public URL.
        runtime: { $ref: '#/components/schemas/RuntimeVersions' }
        revision:
          type: integer
          format: int64
          description: Monotonic API snapshot revision; also the SSE event id.
        streamComplete:
          type: boolean
          description: True once outcome and evidence disposition are both settled.

    ExecutionPage:
      type: object
      required: [data, page, size, totalElements, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ExecutionSnapshot' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    CompileAccepted:
      type: object
      required: [compileRequestId, compileStatus]
      properties:
        compileRequestId: { type: string, format: uuid }
        compileStatus: { type: string }
        sourceRevision: { type: integer, format: int64 }
        configurationRevision: { type: integer, format: int64 }

    ConfirmCompileRequest:
      type: object
      required: [revisionId, artifactHash, sourceRevision, configurationRevision]
      properties:
        revisionId: { type: string, format: uuid }
        artifactHash: { type: string, minLength: 64, maxLength: 64 }
        sourceRevision: { type: integer, format: int64 }
        configurationRevision: { type: integer, format: int64 }

    CompileError:
      type: object
      nullable: true
      required: [code]
      description: |
        Why a compile attempt ended without a candidate, for a reason that is **not** the author's
        source (§4.7). Non-null only with `compileStatus: STALE`, and never non-null at the same
        time as `compileDiagnostics`.

        **A bounded code and nothing else.** No prompt, no gateway response body, no source text,
        no stack trace and no resolved value ever reaches this field (§4.3, §9.2). Every condition
        it names is retryable by the author with no loss: the draft is saved and unchanged, the
        confirmed revision still runs, and an explicit recompile is the whole remedy.

        `code` stays a free string for the same reason `ErrorResponse.error` does; the exhaustive
        set the deployed API can write is `x-compile-error-codes`, which is machine-readable for
        the same reason `x-conflict-codes` is (ADR-002 §14.6, §16.4).
      properties:
        code: { type: string }
      x-compile-error-codes:
        - COMPILE_POOL_SATURATED
        - COMPILE_BUDGET_EXCEEDED
        - VALIDATOR_UNAVAILABLE
        - COMPILE_INTERNAL_ERROR
        - GATEWAY_UNAVAILABLE
        - GATEWAY_BUSY
        - GATEWAY_TIMEOUT
        - GATEWAY_TRANSPORT
        - GATEWAY_PARSE_FAILURE
        - COMPILE_INPUT_TOO_LARGE
        - GATEWAY_OUTPUT_TOO_LARGE

    CompileDiagnostic:
      type: object
      required: [code, stepIndex, message, node, excerpt]
      description: |
        One validator rejection, bounded and redacted for publication (§4.5, §4.7). The same five
        fields as the internal `RunnerDiagnostic` the validator produces, declared separately
        because what reaches a user is the **bounded** copy: `message` and `excerpt` are clamped
        to deployment-configured caps (§8.5) and a clamped string ends with a visible truncation
        marker, so a cut diagnostic never reads as a complete one. The caps are configuration and
        are deliberately not frozen here as `maxLength`.

        Nothing here asserts that a step the validator accepted does what its author meant; static
        validation "cannot prove the locator matches the application or the assertion captures the
        user's intent" (§4.1, §4.5).
      properties:
        code: { type: string }
        stepIndex:
          type: integer
          nullable: true
          description: Null for artifact-level problems belonging to no single step.
        message: { type: string }
        node:
          type: string
          nullable: true
          description: Syntax kind of the offending node, when the problem is a node.
        excerpt:
          type: string
          nullable: true
          description: Bounded excerpt of the offending node only — never the whole step (§9.2).

    CompileStepDiagnostics:
      type: object
      required: [stepIndex, ok, diagnostics, truncated]
      description: |
        One entry per **original source step**, index aligned, present even where the validator
        returned nothing for that step (§4.4, "one entry per source line"). The entry count equals
        the length of `steps` on the same `TestDto`.
      properties:
        stepIndex: { type: integer }
        ok: { type: boolean }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/CompileDiagnostic' }
        truncated:
          type: boolean
          description: |
            True when this step had more diagnostics than the per-step cap, or when its
            diagnostics were shed to fit the document cap. "There were no more problems" and "we
            stopped telling you" are different facts, and this is the field that tells them apart.

    CompileDiagnostics:
      type: object
      nullable: true
      required: [validatorSchemaVersion, artifact, steps, truncated, attempts, exhausted]
      description: |
        Why the last compile produced nothing runnable, in the author's own step order (§4.7,
        "unsupported or ambiguous instructions receive actionable diagnostics"). Non-null only
        with `compileStatus: NEEDS_REVISION`, and never non-null at the same time as
        `compileError`.

        **Truncation is explicit at all three levels and never silent**: a clamped `message` or
        `excerpt` ends with a marker, a step that lost diagnostics carries `truncated: true`, and
        a document that had to shed whole steps' diagnostics to fit the byte cap carries a
        document-level `truncated: true` with a `truncationReason`. A client may therefore always
        distinguish "nothing more was wrong" from "we stopped telling you"; a client that renders
        this document without rendering those flags turns a bounded report into a false one.

        The document describes **the last attempt only**. Repair is bounded at two attempts
        (§4.3), so at most three attempts are made; `attempts` says how many happened and
        `exhausted` says whether the bound was reached with the artifact still invalid. Earlier
        attempts' diagnostics describe artifacts the author never saw and are not accumulated.

        **It is per draft, not per revision**, because the compile it describes produced no
        revision: an invalid candidate is never written to `ui_test_revisions` (§4.2, §8.1). It is
        also never stale against the draft it is returned with — every writer conditions on the
        draft's `source_revision` and `configuration_revision`, and any save that moves either
        clears it (ADR-002 §16.3).
      properties:
        validatorSchemaVersion: { type: string }
        artifact:
          type: array
          description: Artifact-level rejections belonging to no single step.
          items: { $ref: '#/components/schemas/CompileDiagnostic' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/CompileStepDiagnostics' }
        truncated:
          type: boolean
          description: True when whole steps' diagnostics were shed to fit the document byte cap.
        truncationReason:
          type: string
          nullable: true
          enum: [TOTAL_BYTES, null]
          description: Present only when `truncated` is true.
        attempts:
          type: integer
          minimum: 1
          description: |
            How many compile attempts this document describes the last of — 1 when the first
            attempt was invalid and no repair was made, at most `1 + the repair bound` (§4.3).
        exhausted:
          type: boolean
          description: |
            True when the repair bound was reached and the artifact was still invalid (§4.7,
            "Exhausted repair yields NEEDS_REVISION").

    ExecuteAccepted:
      type: object
      required: [executionId, status]
      properties:
        executionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }

    # ──────────────────────────────────────────────────────────────────────────────────────────
    # Internal surface schemas (architecture §8.4).
    #
    # Everything the runner produces or sends is declared **closed** (`additionalProperties:
    # false`) with every optional field named. That is deliberate: before ADR-002 the report
    # schema was open, so the runner could send `steps`/`outcome`/`evidence`/`runtimeVersions`
    # against a contract naming `stepResults`/`status`/`video`/`runtime` and no conformance check
    # could see it. An open schema over a wire body is not a contract, it is a suggestion.
    #
    # API-produced *response* bodies on the two callbacks stay open for now: story 10.7 has not
    # implemented them, so there is no producer to close them against. ADR-002 records that.
    # ──────────────────────────────────────────────────────────────────────────────────────────

    RunnerProblem:
      type: object
      additionalProperties: false
      required: [code]
      description: |
        The runner's error body. Codes and key names only — never a value, never an excerpt of a
        job, never a stack trace (§9.2, §4.7). Safe to log verbatim.
      properties:
        code:
          type: string
          description: Stable machine code. The caller branches on this, not on the HTTP status alone.
        fields:
          type: array
          maxItems: 10
          description: Offending key names, bounded. Present on undeclared-key rejections.
          items: { type: string }
        detail:
          type: array
          description: Per-problem code and key name. Present on job and artifact rejections.
          items:
            type: object
            additionalProperties: false
            required: [code, field]
            properties:
              code: { type: string }
              field: { type: string }

    ReferenceDeclarations:
      type: object
      additionalProperties: false
      required: [variables, secrets]
      description: |
        The declared reference names for a run (§4.5 "References", §9.2). Names only: a resolved
        secret never travels on a validation request, and a reference name alone grants nothing.
      properties:
        variables: { type: array, items: { type: string } }
        secrets: { type: array, items: { type: string } }

    RunnerDiagnostic:
      type: object
      additionalProperties: false
      required: [code, stepIndex, message, node, excerpt]
      description: |
        One validator rejection (§4.5). The code set is the runner's `DIAGNOSTIC_CODES`, which
        grows with the deny list; it is not enumerated here so that adding a denial does not
        require re-freezing this document.
      properties:
        code: { type: string }
        stepIndex:
          type: integer
          nullable: true
          description: Null for artifact-level problems belonging to no single step.
        message: { type: string }
        node:
          type: string
          nullable: true
          description: Syntax kind of the offending node, when the problem is a node.
        excerpt:
          type: string
          nullable: true
          description: |
            Bounded excerpt of the offending node only — never the whole step, and passed through
            redaction first (§9.2).

    ValidateRequest:
      type: object
      additionalProperties: false
      required: [artifact, source]
      description: |
        Candidate validation input (§4.5, §8.4). Key-set is closed on the runner too: an
        undeclared key is a `400`.
      properties:
        artifact:
          type: object
          description: |
            The source artifact of §4.4. Declared opaque on purpose: its normative schema is
            `docs/specs/studio/artifact.schema.json`, held byte-identical against the backend
            copy by `ArtifactSchemaDriftTest`. Restating its shape here would create a second
            place for it to drift.
        source:
          type: array
          description: The ordered original step lines the artifact claims to compile (§4.4).
          items: { type: string }
        references: { $ref: '#/components/schemas/ReferenceDeclarations' }
        referencePolicy: { $ref: '#/components/schemas/ReferencePolicy' }

    ReferencePolicy:
      type: object
      additionalProperties: false
      required: [version, steps]
      description: |
        ADR-SC-003 structural reference policy, derived by the backend from saved authoring data
        (never from English). One entry per source line. A `required` reference the step code
        does not use is `REFERENCE_MISSING`; a used reference outside `allowed` is
        `REFERENCE_EXTRA`; a malformed policy is `REFERENCE_POLICY_INVALID`. When absent (legacy
        revisions) each step's references must equal its `<var>`/`<secret>` source tokens.
      properties:
        version: { type: integer, enum: [2] }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stepIndex, required, allowed]
            properties:
              stepIndex: { type: integer, minimum: 0 }
              required: { $ref: '#/components/schemas/ReferencePolicySet' }
              allowed:
                allOf: [{ $ref: '#/components/schemas/ReferencePolicySet' }]
                description: Always a superset of `required`.

    ReferencePolicySet:
      type: object
      additionalProperties: false
      required: [variables, secrets]
      description: Sorted, de-duplicated reference names; never values.
      properties:
        variables:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        secrets:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }

    ValidateResponse:
      type: object
      additionalProperties: false
      required: [ok, validatorSchemaVersion, diagnostics, steps]
      description: |
        A rejected artifact is still a `200`: validation ran and produced a verdict. `ok: false`
        is the verdict, not a transport failure.
      properties:
        ok: { type: boolean }
        validatorSchemaVersion:
          type: string
          description: Pinned validator schema version, recorded on the revision's provenance (§4.3, §8.1).
        diagnostics:
          type: array
          description: Artifact-level diagnostics, belonging to no single step.
          items: { $ref: '#/components/schemas/RunnerDiagnostic' }
        steps:
          type: array
          description: |
            One entry per artifact step, index aligned. The typed operation list stays inside the
            runner and is never returned (§4.5, §9.2).
          items:
            type: object
            additionalProperties: false
            required: [stepIndex, ok, diagnostics]
            properties:
              stepIndex: { type: integer, minimum: 0 }
              ok: { type: boolean }
              diagnostics:
                type: array
                items: { $ref: '#/components/schemas/RunnerDiagnostic' }

    JobDeadlines:
      type: object
      additionalProperties: false
      required: [admittedStartMs, totalRuntimeMs]
      description: Server-issued deadlines (§8.5). The runner refuses to launch past them.
      properties:
        admittedStartMs:
          type: integer
          format: int64
          minimum: 1
          description: Admitted-start deadline in milliseconds (§8.5 starting value, 30 s).
        totalRuntimeMs:
          type: integer
          format: int64
          minimum: 1
          description: Total browser runtime cap in milliseconds, parent-enforced (§5.2, 120 s).

    RunJob:
      type: object
      additionalProperties: false
      required:
        [executionId, attemptId, revisionId, artifactHash, artifact, source, configuration, csi,
         references, resolvedVars, resolvedSecrets, deadlines, videoKey, manifestKey]
      description: |
        The dispatch envelope of §8.4 ("Job fields: ..."). The key set is closed here and on the
        runner, and that is a security control rather than tidiness: it is what stops a job from
        naming its own callback destination, which is deployment configuration and never
        job-supplied (§8.4, §8.5).
      properties:
        executionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        artifactHash:
          type: string
          description: Canonical artifact hash from the confirmed revision (§4.2, §8.1).
        artifact:
          type: object
          description: The immutable confirmed artifact (`artifact.schema.json`, §4.4).
        source:
          type: array
          items: { type: string }
        configuration: { $ref: '#/components/schemas/TestConfiguration' }
        csi:
          type: string
          description: The execution's own immutable CSI (§8.1, §9.1).
        references: { $ref: '#/components/schemas/ReferenceDeclarations' }
        resolvedVars:
          type: object
          additionalProperties: { type: string }
          description: |
            Ephemeral. Held in runner memory for the run and cleared on every exit path; never
            written to scratch, a retry buffer, a manifest or a report. **Scrubbed, with its
            tested encoded variants, from every outbound diagnostic before persistence** (§9.2:
            the runner scrubs *known values*, of which a resolved variable is one — ADR-002 §22).
        resolvedSecrets:
          type: object
          additionalProperties: { type: string }
          description: |
            Ephemeral. Held in runner memory for the run and cleared on every exit path; never
            written to scratch, a retry buffer, a manifest or a report. **Scrubbed, with its
            tested encoded variants, from every outbound diagnostic before persistence** (§9.2) —
            the same two clauses as `resolvedVars`, stated identically because the treatment is
            identical. What is additional to a secret is **vault-use authorization**: secret use is
            scoped to approved origins and action arguments, and a reference name alone grants no
            permission (§9.2, ADR-002 §22).
        deadlines: { $ref: '#/components/schemas/JobDeadlines' }
        videoKey:
          type: string
          description: |
            Server-derived key (§6.2). The runner writes only this prefix and never invents or
            accepts an arbitrary key.
        manifestKey:
          type: string
          description: Server-derived terminal result manifest key (§5.3, §6.2).
        referencePolicy: { $ref: '#/components/schemas/ReferencePolicy' }
        secretOrigins:
          type: object
          additionalProperties:
            type: array
            maxItems: 16
            items: { type: string, maxLength: 512 }
          description: |
            The origins each declared secret may be filled on, keyed by secret id. Not a secret.
            Read from the secret's own vault entry (`allowedOrigins`) at dispatch and normalized to
            the form `URL.origin` renders (`scheme://host[:port]`, lowercase, no default port);
            only `http` and `https` origins are carried. Before a `fill` whose value is a secret,
            the runner compares the page's origin against this list and refuses with
            `SECRET_ORIGIN_NOT_ALLOWED` when it is not listed. **Fail closed:** an absent map, a
            missing id or an empty list means the secret cannot be filled anywhere.

    RunAccepted:
      type: object
      additionalProperties: false
      required: [code]
      description: |
        Admitted. Capacity is reserved and the admission CAS has committed; the browser has not
        started. `RUNNING` is written by the `STARTED` report, never by this response (§5.1.5).
      properties:
        code: { type: string, enum: [ADMITTED] }

    RunCancelAccepted:
      type: object
      additionalProperties: false
      required: [code]
      description: |
        The run is stopping (ADR-002 §29). Nothing is terminal yet: the outcome is written by the
        run's `FINAL` report, never by this response.
      properties:
        code: { type: string, enum: [CANCELLING] }

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, draining]
      properties:
        status: { type: string, enum: [ok] }
        draining:
          type: boolean
          description: True after SIGTERM. Liveness stays `200` while draining so admitted work can finish (§5.2).

    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [ready, draining, inUse, size]
      description: |
        Capacity saturation alone keeps `ready` true; the pod refuses work with `429` instead.
        Draining is what makes it false (§8.4).
      properties:
        ready: { type: boolean }
        draining: { type: boolean }
        inUse: { type: integer, minimum: 0 }
        size:
          type: integer
          minimum: 0
          description: Configured pool size. Initially 1 per pod; measure before increasing (§5.2).

    AdmissionRequest:
      type: object
      additionalProperties: false
      required: [executionId, attemptId, runnerInstanceId, admissionId, runtimeVersions]
      description: |
        Issued **exactly once** per run. The runner never generates a second `admissionId` for the
        same `attemptId`, because that is the one way a single runner could compete with itself
        for an attempt it may already own (§5.1.4).
      properties:
        executionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        runnerInstanceId:
          type: string
          description: Stable for the life of the runner process. Part of the CAS identity (§5.1.4).
        admissionId: { type: string, format: uuid }
        runtimeVersions: { $ref: '#/components/schemas/ReportedRuntimeVersions' }

    AdmissionResponse:
      type: object
      additionalProperties: false
      required: [executionId, attemptId, admissionId, state, startDeadlineAt, runDeadlineAt]
      description: |
        Closed by story 10.7 (ADR-002 O-4). The contract left it open only because closing a schema
        against an *imagined* producer is how the INT-4 divergence happened; story 10.7 is the
        producer, so every field is now named and nothing unnamed may appear.

        The runner still reads only the HTTP status (§5.1.4). These fields are the API telling the
        runner what it was admitted under, not a second source of truth: the deadlines are enforced
        by the API's reapers and the runner enforces neither.
      properties:
        executionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        state:
          type: string
          description: |
            The dispatch ledger's state, never an outcome. `ADMITTED` on a fresh CAS; on an
            idempotent re-admission of the exact same identity it is whatever the run has reached
            since — `ADMITTED`, `RUNNING` or `FINALIZING`.
          enum: [ADMITTED, RUNNING, FINALIZING]
        startDeadlineAt:
          type: string
          format: date-time
          description: |
            Admitted-start deadline (§8.5, 30 s starting value), derived from the admission instant.
            A different origin from `pending_deadline_at`, which acceptance set from the acceptance
            instant: queue time and browser runtime are separate budgets.
        runDeadlineAt:
          type: string
          format: date-time
          description: |
            Browser runtime cap plus bounded finalization and delivery margins (§5.4). Heartbeats
            never extend it.

    ProgressAck:
      type: object
      additionalProperties: false
      required: [executionId, runnerSequence, applied, revision, cancelRequested]
      description: |
        Closed by story 10.7 (ADR-002 O-4). Sent only after the report's transaction has committed
        (§5.3, §8.4). `cancelRequested` added by ADR-002 §29 (Studio v1 WP4).
      properties:
        executionId: { type: string, format: uuid }
        runnerSequence: { type: integer, format: int64 }
        applied:
          type: boolean
          description: |
            False for a duplicate delivery of an already-applied `(attemptId, runnerSequence)` from
            the exactly-matching identity, which is acknowledged and changes nothing.
        revision:
          type: integer
          format: int64
          description: |
            The API's own snapshot revision after this report — never `runnerSequence`. The runner
            orders its own reports; the API assigns its own revision (§8.4).
        cancelRequested:
          type: boolean
          description: |
            True once a cancel is recorded for the execution (ADR-002 §29). The runner stops the
            run on it exactly as on `DELETE /v1/runs/{id}`; it never returns to false.

    ExecutionControl:
      type: object
      additionalProperties: false
      required: [executionId, cancelRequested]
      description: The body of `readExecutionControl` (ADR-002 §29).
      properties:
        executionId: { type: string, format: uuid }
        cancelRequested:
          type: boolean
          description: True once a cancel is recorded; it never returns to false.

    ReportedRuntimeVersions:
      type: object
      description: |
        Whatever the build recorded in `runtime-versions.json` (ADR-001 §4.2) — Playwright and
        Chromium builds, Node, validator schema, executor, syntax reference, image digest. Left
        open because the recorded set is the image's business and grows with the pin; the API
        keeps the §4.6 subset on the execution as `RuntimeVersions`.
      additionalProperties: true

    RunnerStepState:
      type: object
      additionalProperties: false
      required: [stepIndex, status, startedAtMs, finishedAtMs, durationMs, failure]
      description: |
        One entry per step the runner has **touched**. Steps not yet reached are absent rather
        than `PENDING`: the API holds the confirmed revision's ordered source (§4.4) and fills the
        gaps, so the persisted result still has one entry per original step (§8.2).

        `startedAtMs` and `finishedAtMs` are readings of the **run clock**, never wall clock
        (§6.4): one monotonic clock per run, whose zero is the recording origin — the instant the
        recording context became ready, which is also the instant `browserStartedAt` was read.
        The §6.4 recorder-origin calibration is therefore **already applied when the reading is
        taken**, by the only component that observes the recorder (ADR-002 §INT-5 / O-7). The wire
        carries exactly one origin and no calibration constant; a consumer applies none and adds
        none. Readings are non-negative by construction: nothing the runner observes precedes the
        origin, and an event with no reading carries `null`, never `0` and never a negative value.
      properties:
        stepIndex: { type: integer, minimum: 0 }
        status:
          $ref: '#/components/schemas/StepStatus'
        startedAtMs:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: |
            Offset of the step start from the recording origin. Null for a step that never started
            (`SKIPPED`). A step a cancel interrupted is also `SKIPPED`, but it did start and keeps
            this reading (ADR-002 §29.5). Fractional: the run clock is fractional and the raw difference crosses the
            wire unrounded. Rounding belongs to whoever **persists** `offsetMs`, which is the API;
            a runner that rounded here would spend precision the seek budget may later want, and
            rounding in both components would compound two errors over one measurement.
        finishedAtMs: { type: number, format: double, nullable: true, minimum: 0 }
        durationMs:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Browser time for this step. The public `StepResult.durationMs` is its rounded projection.
        failure:
          type: string
          nullable: true
          description: |
            Redacted failure text (§9.2). Null unless the status is `FAIL`, with one exception: the
            step a cancel interrupted is `SKIPPED` and carries the fixed, value-free text
            `The run was stopped before this step finished.` — never the error the closing browser
            raised in the step, which is not a verdict on it (ADR-002 §29.5).

    RunnerLogEntry:
      type: object
      additionalProperties: false
      required: [atMs, level, message]
      description: |
        A log line positioned on the **run timeline**, not on the wall clock.

        `atMs` is a reading of the same run clock, with the same recording origin, as
        `RunnerStepState.startedAtMs` (§6.4). That is the whole reason it is not a `date-time`:
        the runner holds exactly one wall-clock instant for a run — `browserStartedAt` — and a
        per-entry wall-clock stamp would introduce a second clock whose skew against the recording
        is unbounded, which is precisely what the 500 ms step-seek target of §6.4 cannot absorb.
        A consumer wanting an absolute instant computes `browserStartedAt + atMs`; the API does
        exactly that when it projects `ExecutionLogEntry.at`. There is nothing else to apply: the
        recording origin is already the zero of this scale (ADR-002 §INT-5).

        `atMs` is `null` where the runner genuinely holds no reading. **A zero is a position on
        the timeline — the browser start — not a missing value, and must never be used as one.**
        See ADR-002 §INT-1.
      properties:
        atMs:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: |
            Fractional, for the same reason as `RunnerStepState.startedAtMs`. `0` is the recording
            origin exactly, which is why the browser-start line carries a literal `0` rather than a
            reading.
        level:
          type: string
          enum: [info, warn, error]
          description: |
            The runner's levels. The API upper-cases them onto the public `ExecutionLogEntry.level`
            vocabulary, whose `DEBUG` has no runner-side producer.
        message: { type: string, maxLength: 2000 }

    RunOutcome:
      type: object
      nullable: true
      additionalProperties: false
      required: [result, errorCode, errorMessage]
      description: Null on `STARTED` and `PROGRESS`; set on `FINAL` (§5.3).
      properties:
        result:
          type: string
          enum: [PASSED, FAILED, ERROR]
          description: §8.2. A step locator or assertion timeout is `FAILED`; a parent-enforced total timeout is `ERROR`.
        errorCode:
          type: string
          nullable: true
          description: |
            A runner-assigned code. The `type` stays an open string — the runner owns this
            vocabulary and grows it with its own observable conditions — but the set is no longer
            undeclared: `x-runner-error-codes` below is exhaustive for the image this contract is
            pinned to, and it is what makes the disjointness rule assertable from one document
            instead of from two hand-maintained copies (ADR-002 §15).

            **The two sets intersect at `TIMEOUT` and `CANCELLED` and nowhere else.** Every member
            of `ExecutionErrorCode` is assigned by the API — see its `x-assigned-by` — and a runner
            must never emit one of the others. Where §8.2 fixes a runner-observable outcome it
            governs: a parent-enforced total runtime timeout is `ERROR` with `TIMEOUT`, and the API
            assigns its own `TIMEOUT` on receiving it rather than copying this field. A run stopped
            by `DELETE /v1/runs/{id}` is `ERROR` with `CANCELLED`, and the API assigns its own
            `CANCELLED` only when it recorded a cancel for the execution; without one, the value is
            treated like any other (ADR-002 §29). Any other value here is recorded in the bounded,
            redacted diagnostic text and never reaches `ExecutionSnapshot.errorCode`.
          x-runner-error-codes:
            # Exhaustive. Source: `studio-runner/src/run/errors.ts` `RUNNER_ERROR_CODES`, whose
            # `errorCodeFor` switches exhaustively over `RunFailureKind`, so a condition without a
            # code does not compile. A story that adds a condition may add its code here in the
            # same PR under the §14.7 narrowing; removing one, or adding a code the PR does not
            # emit, stays Class C.
            - ARTIFACT_REVALIDATION_FAILED
            - RUNTIME_INCOMPATIBLE
            - BROWSER_LAUNCH_FAILED
            - BROWSER_SANDBOX_UNAVAILABLE
            - START_DEADLINE_EXCEEDED
            - UNSUPPORTED_MULTI_PAGE
            - RECORDING_FAILED
            - STEP_FAILED
            - URL_SCHEME_NOT_PERMITTED
            - SECRET_ORIGIN_NOT_ALLOWED
            - TIMEOUT
            - CANCELLED
            - RUN_ERROR
        errorMessage:
          type: string
          nullable: true
          description: Redacted (§9.2).

    RunnerEvidence:
      type: object
      nullable: true
      additionalProperties: false
      required: [videoKey, manifestKey, state, partial]
      description: |
        What the runner knows about evidence: whether it stored the objects whose keys the job
        gave it. Deliberately **not** the public `VideoStatus` of §6.1, because two of those
        values are the API's judgment and not the runner's — `AVAILABLE` depends on retention, and
        `EXPIRED` the runner can never observe (it has no Get or List permission, §6.2).

        The API projects: `PENDING → PROCESSING`, `STORED → AVAILABLE`, `FAILED → FAILED`,
        `UNAVAILABLE → UNAVAILABLE`. `EXPIRED` is set by the API at `videoExpiresAt` and is never
        reported (§6.1, §6.2). Null on `STARTED` and `PROGRESS`.
      properties:
        videoKey:
          type: string
          nullable: true
          description: The server-derived key from the job, echoed back — never one the runner chose (§6.2).
        manifestKey: { type: string, nullable: true }
        state: { type: string, enum: [PENDING, STORED, FAILED, UNAVAILABLE] }
        partial:
          type: boolean
          description: |
            **Whether the recording the runner is reporting covers the whole browser session it
            was recording** — `true` when frames were lost because the recorder was not closed in
            an orderly way, typically after a parent-enforced deadline kill whose bounded stop
            grace expired (§5.2, §6.1, ADR-002 §17).

            It is a fact about the **recording**, never about the run: a test that failed at its
            second step has a complete recording of what happened, and `partial` stays `false`. It
            is therefore never derived from `outcome` in either direction, by either component —
            evidence state is independent of the check outcome (§6.1), and a deadline kill whose
            ordered stop *did* flush is not partial while a recorder that died on a passing run is.

            Only the runner can observe it. The API holds no fact from which it could be inferred,
            and it projects this value onto `VideoEvidence.partial` unchanged.

            **Required, and emitted on every report that carries evidence** (ADR-002 §20,
            closing O-14). The producer is the deadline kill of story 10.13, merged in wave 4 and
            also the first condition that can make it true; story 10.14 carries it through
            unchanged when it moves `state` to `STORED`. It is `null` on `STARTED` and `PROGRESS`,
            where `evidence` itself is null — never absent from an evidence object. Meaningful
            only with `state: PENDING` or `STORED`; `false` otherwise, because a recording that
            does not exist is not a partial one.

    RunnerReport:
      type: object
      additionalProperties: false
      required:
        [executionId, attemptId, admissionId, runnerInstanceId, kind, runnerSequence, reportedAt,
         browserStartedAt, steps, logs, logsTruncated, runtimeVersions, outcome, evidence]
      description: |
        The cumulative snapshot the runner posts (§5.3, §8.4 "Reports include ..."). Every report
        is full current state, never a delta, so two lost deliveries are recovered by the third
        and nothing has to be replayed — which is what lets progress delivery be best-effort from
        a component that holds no durable state.

        **This is not `ExecutionSnapshot`, and conflating them was the divergence ADR-002 §INT-4
        settles.** They are different surfaces with different producers: this one carries the
        runner's vocabulary, the runner's clock and the runner's knowledge; `ExecutionSnapshot` is
        what the API publishes after projecting it. The API translates:

        | `RunnerReport` | `ExecutionSnapshot` | Why they differ |
        |---|---|---|
        | `steps[]` | `stepResults[]` | The runner reports only the steps it touched; the API fills the rest from the revision's ordered source (§4.4, §8.2) |
        | `steps[].startedAtMs` | `stepResults[].offsetMs` | Same recording-timeline offset, fractional vs. rounded at persistence. The API applies no calibration and adds no origin (§6.4, ADR-002 §INT-5) |
        | — | `stepResults[].originalText` | The API holds the confirmed source; the runner does not resend it |
        | `logs[].atMs` | `logs[].at` | Run-timeline offset vs. `browserStartedAt + atMs` (§INT-1) |
        | `logs[].level` (lower) | `logs[].level` (upper) | Case normalized by the API |
        | `outcome.result` | `status` | Same vocabulary (§8.2); the API also owns `PENDING`/`RUNNING` |
        | `outcome.errorCode` | `errorCode` | Disjoint sets except `TIMEOUT` and `CANCELLED`: `ExecutionErrorCode` is API-assigned (§5.4); the API assigns `CANCELLED` only against a cancel it recorded (ADR-002 §29) |
        | `evidence.state` | `video.status` | The runner reports storage; the API reports availability (§6.1) |
        | `evidence.manifestKey` | — | Recorded by the API, not published (§5.3) |
        | `runtimeVersions` | `runtime` | Everything the image recorded vs. the §4.6 subset kept on the execution |
        | `runnerSequence` | `revision` | The runner orders its own reports; the API assigns its own snapshot revision (§8.4) |
      properties:
        executionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        runnerInstanceId:
          type: string
          description: Same identity as the admission CAS; the API checks ownership against it (§5.1.4, §5.3).
        kind: { type: string, enum: [STARTED, PROGRESS, FINAL] }
        runnerSequence:
          type: integer
          format: int64
          minimum: 1
          description: |
            Strictly increasing within an attempt, assigned when the report is **built** rather
            than when it is sent, because deliveries race by design. Starts fresh for a new
            attempt and is never reused or decremented, including on a retry (§5.3).
        reportedAt:
          type: string
          format: date-time
          description: |
            Describes the **run**, not the delivery: fixed when the report is built and unchanged
            across terminal retries, so a retried report is byte-identical (§5.3).
        browserStartedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            The single wall-clock instant the runner holds for a run, and the origin the API adds
            to `atMs` and to step readings. Null until the browser has actually started; its
            presence in a `STARTED` report is what writes `RUNNING` (§5.1.5, §8.2).

            **It is read at the same instant as the run clock's zero** — the recording-context
            readiness of §6.4 — not re-derived later and not taken at launch-call time. That
            pairing is what makes `browserStartedAt + atMs` an instant on the recording timeline
            rather than an approximation of one.

            It follows that a report carrying `browserStartedAt: null` carries no reading at all:
            every `atMs` is `null` and `steps` is empty. The runner never emits a value measured
            before the origin existed, which is what keeps one origin on this wire (ADR-002
            §INT-5).
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunnerStepState' }
        logs:
          type: array
          description: Bounded retained buffer; oldest entries drop first (§5.5).
          items: { $ref: '#/components/schemas/RunnerLogEntry' }
        logsTruncated:
          type: boolean
          description: True once the retained-log cap has dropped an entry; stays true (§5.5).
        runtimeVersions: { $ref: '#/components/schemas/ReportedRuntimeVersions' }
        outcome: { $ref: '#/components/schemas/RunOutcome' }
        evidence: { $ref: '#/components/schemas/RunnerEvidence' }
        payloadReduced:
          type: boolean
          description: |
            Present when bounding had to shed logs, then steps, to fit the configured callback
            body limit (§5.4). A terminal outcome the API can act on outranks the diagnostics
            attached to it, because a report rejected for size is a lost result the runner cannot
            replay.
