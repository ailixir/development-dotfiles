# ─────────────────────────────────────────────────────────────────────────────
# RULINGS. Step B1-0 copies this block into ADR-002 §35.1 (outline in `adr002Section35`).
# ─────────────────────────────────────────────────────────────────────────────
rulings:

  OQ-18a-class:
    question: "Class of the TestRequest change: optional `identityNameAcknowledgements`, new 400s `IDENTITY_NAME_ACK_REQUIRED` and `INVALID_IDENTITY_NAME_ACK` on POST/PUT /studio/tests."
    status: "RULED — Class C, AUTHORIZED prospectively (before any code)"
    ruling: >
      Class C under §12 and §34.1: it changes which requests receive 400 on two public routes (a
      request that introduces a matching plain-variable name without an entry moved from 200/201 to
      400). This is the first Class C amendment to follow §34.1's "ruling first" rule end to end:
      §35 lands as the first commit of STUDIO-DISC-002 with a §13 row `AUTHORIZED, NOT YET LANDED`,
      and the story replaces it with measured digests and counts.
    conditions:
      - "Grandfathering is part of the authorization: a stored non-secret name never requires an entry (FR-13, PO-6). An implementation that enforces on every save is NOT authorized."
      - "§35 behaviour table carries the B1 rows (see adr002Section35.35_2)."
      - "Consumer re-check: Checks frontend Studio page (`saveDraft`, `saveErrorMessage`), MSW Studio save handler (must mirror the rule; unlike §34.3 this is not left as a fidelity gap, because the drift-recovery UI is exercised in demo mode), wizard (not a consumer: Checks API, C21)."
      - "Release note line, owner @devops."
      - "Deploy order: frontend that sends the field first or in the same release. No server feature flag: a stale bundle fails only for a newly introduced identity name and recovers on reload (spec §7)."
    tradeOff:
      for: "Recorded server evidence on the live surface (PO-4) with zero change for existing tests."
      against: "A new 400 on the most-used Studio write route; mitigated by grandfathering and FE-first deploy."

  OQ-18b-vault-order:
    question: "Re-rule OQ-12's order (v1: 403 → parse → ack → name/value/origins → Vault)."
    status: "RE-RULED — D7 adopted: 403 → strict parse → name/value/origins → ack → Vault"
    supersedes: "plan v1 rulings.OQ-12 (order only). The 503 → 400 part of OQ-12 stands."
    ruling: >
      The ack check moves after the name/value/origins checks. v1 placed it first because the ack
      was unconditional and independent of the body content. It is now a function of the name
      (D7, PO-0/PO-1), so it must run on a name the server has already accepted
      (`^[A-Za-z0-9_.-]{1,64}$`). The v1 rationale still holds in substance: there is still one
      precedence rule ("403, then body 400s, then Vault"), and the ack is the last body 400.
    rationale:
      - "The matcher runs only on valid names: smaller input domain, no 'tick, resubmit, then get the name 400' double round trip."
      - "No SPI change (no `isConfigured()` probe); the v1 rejected alternative stays rejected."
      - "Authorization still decides first: a non-member learns nothing (T-BE-2)."
    conditions:
      - "With provider `none`: matching name without an accepted version → 400 SECRET_ACK_REQUIRED (was 503); non-matching name → 503 unchanged (T-BE-1, AC-11)."
      - "The ack check sits inside the existing try/finally so the value is still zero-filled on the new 400."

  OQ-18c-required-field:
    question: "Re-rule `new-required-field` (v1: `acknowledgedDisclaimerVersion` in `required` for every body)."
    status: "RE-RULED — optional in the schema, conditionally required by the server (D7 adopted, with one refinement)"
    supersedes: "plan v1 rulings.new-required-field"
    ruling: >
      v1's reason ("an optional acknowledgment is one any client may omit, which records nothing")
      was about a universal acknowledgment. Under PO-0/PO-1 the acknowledgment exists only for
      matching names, and the server — not the schema — decides when it is required, by running
      the same matcher. Requiredness is therefore enforced, just not expressible in JSON Schema
      `required`. Putting it in `required` would force the client to assert an acknowledgment the
      author never gave for non-matching names, which corrupts the evidence.
    refinement: >
      Schema `acknowledgedDisclaimerVersion: {type: string, maxLength: 64, nullable: true}`, NOT
      in `required`, and WITHOUT D7's `minLength: 1`. Reason: the server never refuses a blank
      version as a shape error — for a matching name it is `SECRET_ACK_REQUIRED`, for a
      non-matching name it is ignored — so `minLength: 1` would declare a bound the server does not
      enforce. Shape (strict parse, any name): non-string or > 64 chars → 400 INVALID_SECRET_REQUEST.
      This mirrors B1, where blank is allowed at shape and > 64 is a shape error. @pm folds this
      into D7 (pre-step P0).
    releaseConstraint: >
      new FE + old BE: the strict parser refuses the unknown field (400 INVALID_SECRET_REQUEST),
      but only for matching names (the FE omits the field otherwise). old FE + new BE: matching
      names get 400 SECRET_ACK_REQUIRED. Both are reachable only with `vaultSecrets=true` (CON-2):
      FE and BE ship before the flip; ordering between them is free while the flag is off.

  OQ-18d-structured-error:
    question: "Accept the `variableNames` extension of the error body for the two new codes, or the fallback (names in message only)."
    status: "RULED — ACCEPTED, with constraints"
    ruling: >
      Both B1 codes return `{error, message, variableNames}`. It is an additive extension:
      `ErrorResponse` (openapi.yaml:2487-2492) declares no `additionalProperties: false`, so the
      body still validates as `ErrorResponse` for every existing consumer. Without the list, a
      server-only match (matcher drift, stale MFE bundle) is unrecoverable except by renaming the
      variable, which is a correctness hole in a gate the author cannot see the reason for.
    shape:
      openapiSchema: >
        New flat schema `IdentityNameAckErrorResponse` {required: [error, message, variableNames];
        error: {type: string, enum: [IDENTITY_NAME_ACK_REQUIRED, INVALID_IDENTITY_NAME_ACK]};
        message: string; variableNames: {type: array, maxItems: 100, items: string}}. Flat (not
        `allOf`), because `StudioContractTest.schemaProperties` reads `properties` directly
        (StudioContractTest.java:628-635). POST/PUT /tests 400 responses keep `ErrorResponse` as
        their schema (superset-compatible) and gain a description sentence plus two examples
        naming `IdentityNameAckErrorResponse`.
      java: >
        Record `studio.credentials.IdentityNameAckErrorResponse(String error, String message,
        List<String> variableNames)`, pinned by a new `assertSchemaMatchesRecord`. Exception
        `StudioIdentityNameAckException extends StudioValidationException` (so existing catch sites
        still see a validation failure) carrying the names; its own `@ExceptionHandler` in
        `ChecksExceptionHandler` next to `handleStudioValidation` (Spring resolves the most
        specific type).
    constraints:
      - "Names only, never values; distinct, sorted (String natural order), at most 100. If more than 100 names qualify, the first 100 are returned and the message says 'and N more'."
      - "IDENTITY_NAME_ACK_REQUIRED: the required names lacking an accepted entry. INVALID_IDENTITY_NAME_ACK from step (2) reference errors: the offending entry names (already ≤ 64 after shape). INVALID_IDENTITY_NAME_ACK from step (1) shape errors: `variableNames: []` — the property is always present."
      - "Reflection: the list echoes only names the caller itself sent in the same request, serialized by Jackson as JSON (no HTML context). Body size is bounded by the request. Accepted; recorded under security."
      - "The FE never interpolates `variableNames` into HTML; it renders through React text nodes only."
    fallbackRejected: "Names in `message` only: makes drift unrecoverable and forces the FE to parse prose (saveErrorMessage branches on codes, never prose — §34.3)."

  OQ-18e-internal-path:
    question: "Confirm that the internal `updateTest(…, null)` path skips the policy."
    status: "RULED — CONFIRMED, with a guard"
    verified: >
      Main-code callers (grep, 2026-10-06): `StudioController.java:74` createAuthoringDraft, `:78`
      createTest(…, auth), `:105` updateAuthoringDraft, `:107` updateTest(…, auth). The only
      main-code call with `auth == null` is `StudioService.java:353` inside `updateAuthoringDraft`,
      which runs the policy itself before delegating. `saveAuthoring`, `updateAuthoring` and
      `adaptLegacyAuthoring` have no main-code caller and take no variables (AuthoringV2Request =
      authoringSchemaVersion, globalContext, steps), so they are not a bypass.
    ruling: >
      The policy runs exactly once per HTTP save, at the entry point holding the caller's
      `Authentication`: private `createTest` (after requireRegisteredCsi/requireWrite), `updateTest`
      when `auth != null` (after lock, refresh, STALE_REVISION, CSI_IMMUTABLE,
      AUTHORING_V2_REQUIRED; before `changeClassifier.classify`), `updateAuthoringDraft` (after
      lockForAuthoringWrite and CSI_IMMUTABLE; before `updateTest(id, metadataOnly, null)`).
    guard:
      - "Javadoc on `updateTest(UUID, UITestRequest)` and on the `auth == null` branch: 'never reached from HTTP except via updateAuthoringDraft, which evaluates the identity-name policy first; a new HTTP caller must run the policy'."
      - "T-BE-12 asserts exactly one evaluation per request on both v2 paths (spy on the policy)."
      - "Any future internal caller of `createTest` with an `Authentication` (template import, duplicate) gets the policy with `acks = null`: identity names in its payload need entries or must be stored first. Documented in the createTest javadoc."

  CRIT-25b-environment:
    question: "AckSubject.environment on update: request's or stored row's?"
    status: "RULED — the environment the row holds after the write (= `request.environment()` on every path)"
    ruling: >
      The audit line attests 'this identity name was introduced into test T, CSI C, environment E
      as saved'. `updateTest` writes `request.environment()` unconditionally (StudioService.java:561)
      and `metadataOnly` carries `metadata.environment()` on v2, so the post-write environment is the
      request's on create, v1 update and v2 update alike. Recording the pre-write value would
      describe a configuration the variable never ran under.
    divergence: "CRIT-25 suggested the stored row's environment 'for consistency with csiId'. csiId is immutable (CSI_IMMUTABLE), so stored == requested for it; consistency holds either way. Trade-off: a save that both changes environment and introduces a name logs only the new environment; the old one is in the row's history, not the audit line. Accepted."

  carriedFromV1:
    OQ-13: "Stands unchanged (three-way test pin; no production import of docs/). Re-checked against matcherVersion: the matcher version is pinned separately by identity-name-cases.json#matcherVersion (T-FE-14, T-BE-6); it is NOT added to credential-disclaimer-version.json, because copy and matcher version independently (D1 vs D13)."
    OQ-10: "Stands: one accepted version; first post-flip copy bump decides overlap (O-22). Now applies to both B1 and B2: the map is shared."
    OQ-2: "Not ruled here (InfoSec). Log line built; D12 only on an InfoSec 'DB' answer → STUDIO-DISC-004."
    ADR-002-§35-class-v1: "Superseded by OQ-18a/18c (the v1 class ruling was for a required field on the secrets route only)."

  autoDecisions:
    - "[AUTO-DECISION] UITestRequest gains a 10th component vs passing the raw node beside the record → 10th component `JsonNode identityNameAcknowledgements` plus a 9-arg compatibility constructor that passes null (reason: StudioContractTest:443 pins openapi TestRequest properties to the record's components, so the property must be a component; the compat constructor keeps all 29 existing 9-arg call sites — StudioService.java:342 and 28 in 16 test files — compiling unchanged, CRIT-25a. Trade-off: the compat constructor silently drops acks; acceptable because the only main-code caller is metadataOnly, which runs after the policy)."
    - "[AUTO-DECISION] Where the wizard ack state lives → lifted into CreateCheckPage (it owns step1Valid, Next and Create/Update) and passed down to UiTestConfig as props (reason: UiTestConfig is presentational for uiVariables today)."
    - "[AUTO-DECISION] Wizard gating mechanism → fold `pendingAckNames.length === 0` into `step1Valid` (CreateCheckPage.tsx:446,458,463,480) (reason: one predicate disables Next, Create/Update and also Test Connection, which runs the check with the variable; disabling it is consistent with PO-3. Flag to @po at validation: Test Connection is not named in FR-12)."
    - "[AUTO-DECISION] Ack lifecycle logic placement → a pure module `identityNameAcks.ts` shared by page and wizard (reason: ChecksStudioPage.tsx carries heavy WIP; pure functions keep page edits to wiring and are unit-testable without rendering)."
    - "[AUTO-DECISION] Story order for B-slices → B1 (live surface) first, carrying the shared package S; B2 second, before the vaultSecrets flip (reason: B1 produces evidence for authors today; B2's UI is dark)."
    - "[AUTO-DECISION] FU-1 recorded in ADR-002 as open item O-23 (reason: it is a contract requirement on a future UI_TEST check-configuration API, which is ADR-002's domain, not only a backlog line)."

# ─────────────────────────────────────────────────────────────────────────────
# ADR-002 §35 — proposed text outline. Landed by @architect as step B1-0 (first commit of
# STUDIO-DISC-002). This plan does not edit the ADR.
# ─────────────────────────────────────────────────────────────────────────────
adr002Section35:
  title: "## 35. Identity-name acknowledgment on Studio saves and secret create — STUDIO-DISC-002 / STUDIO-DISC-003 (2026-10-xx)"
  "35_1_ruling": >
    Copy `rulings` OQ-18a..e, CRIT-25b, and the carried OQ-13/OQ-10 lines verbatim. State
    explicitly that §35 supersedes the plan-v1 OQ-12 order and the required-field ruling, which
    never landed in this ADR (they lived only in the v1 plan), so no earlier § is amended.
  "35_2_behaviour":
    B1_rows:
      - "POST/PUT /tests, new or renamed non-secret variable whose name matches identity-names-1, no accepted entry: before 200/201 → now 400 IDENTITY_NAME_ACK_REQUIRED {variableNames}."
      - "Malformed identityNameAcknowledgements (non-array, > 100, bad item, > 64, entry naming an absent/secret variable, duplicate name): before ignored (v1) / 400 UNSUPPORTED_FIELD (v2) → now 400 INVALID_IDENTITY_NAME_ACK, always after 403/409."
      - "v2 body carrying the key: before 400 UNSUPPORTED_FIELD → now accepted."
      - "Stored names, non-matching names, value-only edits: unchanged."
    B2_rows:
      - "POST /tests/{id}/secrets, matching name, field missing/blank/unknown: before 503 (provider none) / 201 → now 400 SECRET_ACK_REQUIRED."
      - "Non-matching name, field absent: unchanged (503/201). Field present on a non-matching name: ignored."
      - "Field non-string or > 64: 400 INVALID_SECRET_REQUEST (message names four fields)."
      - "Non-member, any body: 403 unchanged."
  "35_3_consumers_and_release": >
    Checks frontend Studio page + saveErrorMessage; SecretInput + describeFailure; MSW Studio save
    handler (mirrors the rule); no MSW secrets handler exists (re-verify at landing); wizard is not
    a consumer (C21). Release-note lines (owner @devops) for both rows sets. Deploy order B1: FE
    first or same release. B2: both before the vaultSecrets flip.
  "35_4_contract_tests": >
    StudioContractTest: TestRequest↔UITestRequest parity (now 10 components), new parity pins for
    IdentityNameAcknowledgement and IdentityNameAckErrorResponse, CreateStudioSecretRequest parity
    (4 components), operation count stays 31 (no route added). BASE_SHA256 re-anchored once per
    landing story from `shasum -a 256` of the committed file; never transcribed from ADR text.
  "35_5_open_items": >
    O-22 (OQ-10 version overlap at first post-flip copy bump; owner: that story). O-23 (FU-1: the
    future UI_TEST check-configuration contract carries identityNameAcknowledgements with the D17
    shape and rules, surface CHECK_WIZARD_VARIABLE, plus checkId; owner: that story, @pm tracks).
  "35_6_evidence_semantics": >
    The audit line attests that an authenticated caller asserted acknowledgment of version V for
    name N; a human tick is not provable server-side (CRIT-6). Sufficiency is InfoSec's (OQ-2).
  "13_rows": "Two rows, one per landing story (STUDIO-DISC-002, STUDIO-DISC-003), each `AUTHORIZED, NOT YET LANDED` until measured."

