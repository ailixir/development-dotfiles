    - id: B2-1
      name: Request field and strict parse (D7; OQ-18c refinement)
      files:
        modified:
          - backend/src/main/java/com/citi/put/checks/studio/secrets/CreateStudioSecretRequest.java
          - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsService.java
      change:
        - "Record gains `String acknowledgedDisclaimerVersion` (last); toString/equals/hashCode still exclude the value."
        - "Strict parser admits the 4th key: absent/null → null; non-string or > 64 chars → 400 INVALID_SECRET_REQUEST."
        - "`invalidRequest()` text (:213) = 'The body must be a JSON object with name, value, allowedOrigins and, for a sign-in identity name, acknowledgedDisclaimerVersion' (constant, reused by the contract test)."

    - id: B2-2
      name: Ack check in the ruled order + audit (D7, D9; OQ-18b)
      dependsOn: [B2-1, S4]
      files:
        modified:
          - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsService.java
          - backend/src/test/java/com/citi/put/checks/studio/secrets/StudioSecretsServiceTest.java
      change:
        - "Order: 403 → strict parse → name/value/origins → `if (IdentityNameMatcher.match(name).isPresent() && !CredentialDisclaimerVersions.isAccepted(v)) throw StudioValidationException(\"SECRET_ACK_REQUIRED\", fixed message)` → vault.create → audit (VAULT_SECRET, CREATE_SECRET) only when matched → 201. Non-matching: field ignored, no audit line."
        - "Subject resolved after authorization and before vault.create: principal (local private BffAuthenticationToken→email helper, PF-6 v1), csiId/environment/testId from the loaded test row. Logger never throws, so a stored secret never becomes an error."
        - "All inside the existing try/finally (value zero-filled on the new 400)."
      tests: ["T-BE-1 (incl. non-matching without field → 503; matching + accepted → 503 with provider none; zero-fill)", "T-BE-2", "T-BE-3 (canary; one line; failed create → none; throwing logger → still 201)"]
      verify: [{ cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.secrets.*'", expect: "green; name SKIPPED ITs" }]

    - id: B2-3
      name: openapi secrets texts + contract test
      dependsOn: [B2-1]
      files: { modified: [docs/specs/studio/openapi.yaml, backend/src/test/java/com/citi/put/checks/studio/StudioContractTest.java] }
      change:
        - "CreateStudioSecretRequest (:3506): property {type: string, maxLength: 64, nullable: true}, NOT in required; additionalProperties: false stays."
        - "createTestSecret description (:812-814), 400 description and `invalidRequest` example (:851) name four fields, SECRET_ACK_REQUIRED and its position (after field codes, before Vault)."
        - "StudioContractTest: :456 parity (4 components); assert field NOT in required; 400 description contains SECRET_ACK_REQUIRED; example message equals the service constant."
      verify: [{ cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.StudioContractTest'", expect: "green with Docker" }]

    - id: B2-4
      name: Create Secret dialog (D2) and request body (D7 FE)
      files:
        modified:
          - frontend/src/services/api/secretsApi.ts
          - frontend/src/components/studio/SecretInput.tsx
          - frontend/src/components/studio/SecretInput.test.tsx
      change:
        - "secretsApi: optional `acknowledgedDisclaimerVersion?: string`; redactBody kept."
        - "SecretInput: when isIdentityName(newName) → Alert role=note id=identity-name-warning, Checkbox(ackLabel) aria-describedby 'identity-name-warning identity-ack-reason', FormHelperText id=identity-ack-reason while unticked; canCreate &&= (!matched || acknowledged); reset on open, closeCreate, failure branch and every Name change; body includes the version only when matched && ticked; describeFailure maps SECRET_ACK_REQUIRED (exact match before the INVALID_SECRET_ prefix branch). Never reads newValue for ack logic."
      tests: ["T-FE-5..T-FE-8", "T-FE-19 (SecretInput part)"]
      verify: [{ cmd: "cd frontend && pnpm exec vitest run src/components/studio/SecretInput.test.tsx", expect: green }]

