security:
  - "NFR-1: no new code path reads a value for ack purposes. Matcher, policy and logger signatures take names only; canary tests T-BE-3, T-BE-11, T-FE-8 are the proof, not review."
  - "Ack shape validation runs after authorization (403 first) on both B1 paths; B2 keeps 403 first."
  - "variableNames reflects only names the caller sent in the same request, as JSON; bounded at 100; rendered as React text (OQ-18d)."
  - "Audit written after commit only; principal always from the authenticated caller, never the body; disclaimerSha256 from the server map, never the client."
  - "The acknowledgment is an API assertion, not a provable human tick (§35.6, OQ-2)."
  - "Unchanged existing findings, keep visible in both B PRs: cookie-authenticated mutations have no CSRF control (runbook §10); wizard localStorage persists plain values (STUDIO-SEC-001)."
  - "Wizard acknowledgments are UI-only until FU-1 (PO-7): no server evidence for that surface."

tradeOffs:
  - { decision: "Three stories (A, B1+S, B2)", for: "Live UI gate ships without a contract change; B2 waits for its WIP without holding B1", against: "Shared package lands in B1; B2 rebases on it" }
  - { decision: "Optional, conditionally required Vault field", for: "Evidence only for names that triggered; no false assertions", against: "Requiredness lives in server logic, not in JSON Schema" }
  - { decision: "Ack after name/value/origins", for: "Matcher sees only valid names", against: "Diverges from the v1 ruling; documented in §35" }
  - { decision: "Structured variableNames", for: "Recoverable drift; FE branches on data, not prose", against: "One new schema + record + handler" }
  - { decision: "10th record component + compat constructor", for: "Parity test stays strict; zero churn in 29 call sites", against: "Compat constructor drops acks silently (only metadataOnly uses it in main)" }
  - { decision: "Environment = post-write value", for: "Line describes the saved configuration", against: "Pre-change environment not on the line" }

