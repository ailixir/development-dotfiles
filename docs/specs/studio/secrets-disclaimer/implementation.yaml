planFindings:
  - id: PF-1
    severity: HIGH
    finding: >
      Touched files still carry uncommitted WIP. Frontend modified: ChecksStudioPage.tsx,
      RunControl.tsx, useRunGate.ts, UiTestConfig.tsx, SecretInput.tsx(+test), secretsApi.ts,
      studioTypes.ts, apiClient.ts, studioApi.ts, mocks/studio/handlers.ts(+tests). Frontend
      untracked: UiTestConfig.test.tsx, pageAuthoringUx.test.tsx. Backend modified: StudioService.java,
      StudioController.java, UITestRequest.java, StudioAuthoringMapper.java, LegacyStudioAdapterTest,
      StudioContractTest, ChecksExceptionHandler.java. Backend untracked: StudioSecretsService.java,
      CreateStudioSecretRequest.java. Docs modified: openapi.yaml (HEAD c6b89138…1088, working tree
      5e5477fc…070ac = the current BASE_SHA256 pin), ADR-002 (HEAD lacks §32-§34). Clean today:
      CreateCheckPage.tsx, saveErrorMessage.ts(+test).
    handledIn: "blockers.B-1; baseline steps A0, B1-1, B2-0"
  - id: PF-2
    severity: MEDIUM
    finding: >
      `UITestRequest` is a 9-component record (UITestRequest.java:31-40). `new UITestRequest(` occurs
      30 times: the deserializer (:132), StudioService.java:342 (metadataOnly) and 28 in 16 test
      files (ConfigurationRevisionTest 5, LegacyStudioAdapterTest 3, TargetPolicyGapTest 3,
      StudioScheduleApiIT 3, StudioServiceWriteAuthorizationTest 2, CompilePipelineIT 2,
      ExactConfirmationIT 2, and 1 each in 9 more). The 13-arg legacy constructor delegates via
      `this(...)` (:72).
    handledIn: "autoDecisions[0]; step B1-2"
  - id: PF-3
    severity: MEDIUM
    finding: >
      RunControl renders `data-testid="run-blocked-reason"` in two independent branches (no steps,
      :268-277; waiting, :279-288). A third independent branch would let two elements share the test
      id. Also, programmatic activation (`runRequest`, :169) is gated by `runnable`; if
      `blockedReason` is not folded into `runnable`, `?autorun=1` / "Run again" would bypass the
      disabled button and fall through to the saveDraft guard. No co-located RunControl test exists
      (run/ has runGate.test.tsx and others).
    handledIn: "step A3"
  - id: PF-4
    severity: LOW
    finding: >
      `StudioAuthoringMapper.legacy()` runs `requireSaveable` and `validateForWrite` in the controller,
      before authorization, so existing body 400s already precede 403 on these routes. The ack
      shape check is deliberately after authorization (NFR-4). Two precedences coexist; T-BE-9 pins
      the ack one. Not changed by this work.
    handledIn: "step B1-6 (T-BE-9)"
  - id: PF-5
    severity: LOW
    finding: >
      v2 metadata reaches `UITestRequest` through `legacy(metadata)` on a deep copy of the body
      (StudioAuthoringMapper.java:91-94), so the raw ack node arrives in `write.metadata()` on v2
      once FIELDS admits the key. No separate v2 plumbing is needed.
    handledIn: "step B1-2"
  - id: PF-6
    severity: LOW
    finding: >
      Spec matcher walkthrough re-run by script (inference-free: a Python model of §3.5 steps 1-7 in
      the session scratchpad) for the CRIT-24 rows: USERETRY/useRef/focusError/TROUSERS/mouseRight/
      reuseResult → user; LOGINTERVAL/logInfo/BLOGINDEX/catalogInfo/dialogInput → login;
      VOICEMAIL/serviceMail → email; LOG_INTERVAL/INVOICE_MAIL/USE_RETRY/SOE_IDENTITY/E_MAILBOX → no.
      Matches critique.json autoFixes CRIT-24. The model is not the implementation; T-FE-14/T-BE-6
      are the proof.
    handledIn: "pre-step P0, step A1"
  - id: PF-7
    severity: LOW
    finding: "ADR-002's highest open item is O-21 (§33.4); O-22 (reserved by plan v1) never landed. §35 adds O-22 and O-23."
    handledIn: "step B1-0"

