        - { cmd: "cd frontend && pnpm exec tsc --noEmit && pnpm exec vitest run src/components/studio src/services", expect: green }
        - { cmd: "grep -n 'vaultSecrets' frontend/src/utils/config/studioCapabilities.ts", expect: "still false (CON-2)" }
