# Implementation plan — studio-vault-secrets
# Spec Pipeline phase 6 (Plan). Author: @architect (Aria), YOLO mode, 2026-09-22.
# Inputs: spec.md rev 2 (APPROVED 4.25), requirements.json, critique.json.
# Scope: V1–V8 plus the critique fixes (CRIT-1..CRIT-10). Nothing else. Rulings are in spec.md §9.

meta:
  storyId: studio-vault-secrets
  specVersion: 2
  planVersion: 1
  createdAt: "2026-09-22"
  createdBy: "@architect"
  executor: "@dev"
  status: READY_FOR_STORY   # @sm drafts the story from this plan; @po validates; @dev implements
  singlePr: true            # spec §8: one PR. The signature change and the contract re-anchor must not be split.
  branchRule: >
    Work from a fresh feature branch. CON-7: stage only the files listed in this plan.
    At planning time `git status --short` showed 2 untracked entries (`.aiox/`, `docs/specs/studio/vault-secrets/`);
    re-check before staging, and never use `git add -A`.

toolchain:
  backend:
    cwd: backend/
    compileMain: "./gradlew compileJava -q"
    compileTests: "./gradlew compileTestJava -q"
    note: >
      Gradle compiles the whole test source set before any test runs, so no test can run until
      every caller of the changed signatures compiles (steps P1-P2). Until then each step verifies
      with a compile only. `*IT` classes use Testcontainers with `disabledWithoutDocker = true`:
      a run without Docker reports them as SKIPPED, not passed. Docker 27.4.0 was reachable when
      this plan was written; confirm it before trusting an IT result.
  frontend:
    cwd: frontend/
    lockfile: package-lock.json   # verified: the frontend has no pnpm lockfile
    runTests: "pnpm exec vitest run <files>"
    typeCheck: "pnpm exec tsc --noEmit"
    lint: "pnpm exec eslint <files>"
    note: >
      The user's rule is pnpm, and the lockfile is npm's. `pnpm exec` runs the binaries already in
      node_modules/.bin and neither installs nor writes a lockfile, so it satisfies both. Do NOT run
      `pnpm install` here: it would create a pnpm lockfile beside package-lock.json.
  studioRunner:
    cwd: studio-runner/
    lockfile: package-lock.json
    runTests: "pnpm exec vitest run <files>"
    runDeployment: "pnpm exec vitest run --config vitest.deployment.config.ts <files>"
    note: "The deployment tier needs `helm` on PATH (present at /opt/homebrew/bin/helm when planned)."

# ─────────────────────────────────────────────────────────────────────────────
# Findings made during planning that the spec did not have. Each was verified in the code.
# ─────────────────────────────────────────────────────────────────────────────
planFindings:
  - id: PF-1
    severity: HIGH
    finding: >
      `studio-runner/test/run/confinement.test.ts:249` pins the SHA-256 of docs/specs/studio/openapi.yaml
      (`BASE_SHA256 = c6b89138…1088`, which matches the file today, measured with `shasum -a 256`).
      Any openapi.yaml edit turns it red. ADR-002 §19 says the story that edits the contract re-anchors
      the pin in the same PR. The spec's file list did not include it.
    handledIn: C4
  - id: PF-2
    severity: MEDIUM
    finding: >
      Every Studio route with a `UUID` path variable answers 400 for a malformed id before any handler
      code runs (`GET /tests/{id}` declares 200,400,401,403 for that reason). Spec §3.3 left 400 out of
      the GET status set. The contract would then be false for `GET /tests/not-a-uuid/secrets`.
    handledIn: "OQ-5 ruling R-5.2; C2"
  - id: PF-3
    severity: MEDIUM
    finding: >
      A Spring `@RequestBody byte[]` defaults to `required = true`, so an empty body is a 400 from
      argument resolution, before authorization. That breaks spec §3.3's "403 before 400" order. Adding
      `consumes = application/json` would also add a 415 before authorization, and 415 is not in the
      declared status set.
    handledIn: "R-6; B3"
  - id: PF-4
    severity: MEDIUM
    finding: >
      Spec §3.3 uses two response shapes: list items are `{name}` and the 201 body is
      `{name, version, allowedOrigins}`. One `StudioSecretDto` cannot serialize both without emitting
      `"version": null` in the list, and it cannot satisfy one `StudioSecret` schema-parity check.
    handledIn: "R-5.4; B1, C2, C3"
  - id: PF-5
    severity: LOW
    finding: >
      (Inference from HashiCorp's docs, not checked against a live Vault.) KV v2 runs an existence
      check on the data path. With a policy that grants `create` but not `update`, a `cas=0` write to an
      existing key can come back as 403 permission denied instead of 400. D4 checks metadata only on a
      400, so that case would read as an outage.
    handledIn: "R-7; A4"
  - id: PF-6
    severity: LOW
    finding: >
      `JobBodyLeakTest` and `StudioKillSwitchWiringTest` build `Resolved` directly or use a bare
      `mock(StudioReferenceResolver.class)` with no stubbing of preflight/resolve (grep). `StudioSecretFixtures`
      touches only `mayUse`. None of the three needs an edit. The spec listed them as "signature change".
    handledIn: P3 (verify-only)

# ─────────────────────────────────────────────────────────────────────────────
# Ordered steps. Order matters: P-steps keep main compiling; D1 is atomic; C4 runs after the last
# openapi.yaml byte is final.
# ─────────────────────────────────────────────────────────────────────────────
phases:

  - phase: P0
    name: Baseline (no edits)
    steps:
      - id: P0.1
        action: >
          Record the pre-change state so the §13 amendment row can report before and after
          measurements (ADR-002 §12 "Every amendment is recorded").
        verify:
          - cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.StudioContractTest'"
            expect: "green; 21 declared operations"
          - cmd: "shasum -a 256 docs/specs/studio/openapi.yaml"
            expect: "c6b891387d939131f38b68971e51cecccebfa6fd4b3af09ac34a121477171088 (value on 2026-09-22)"
          - cmd: "cd studio-runner && pnpm exec vitest run test/run/confinement.test.ts"
            expect: green

  - phase: P1
    name: Provider seam (main only; verify by compile)
    steps:
      - id: A1
        files:
          new:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/VaultScope.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/VaultNotConfiguredException.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/SecretAlreadyExistsException.java
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioVaultProvider.java
        change:
          - "`public record VaultScope(String csiId, String environment, String testId)`, plus the factory `static VaultScope of(String csiId, String environment, UUID testId)` that uses `testId.toString()` (canonical lowercase). Acceptance, dispatch and the endpoint all build it from a UUID, so every path renders the same bytes."
          - "StudioVaultProvider: `read(ReferenceKind, VaultScope, String referenceName)` replaces the 4-arg form (D8). Add `String create(VaultScope scope, String name, char[] value, List<String> origins)` (it returns the KV v2 version) and `List<String> listSecretNames(VaultScope scope)`. Update the javadoc: the scope is (execution CSI, snapshotted environment, test id)."
          - "Put the D3 name rule on the interface, so one definition serves the endpoint, the resolver and the provider: `Pattern SECRET_NAME = ^[A-Za-z0-9_.-]{1,64}$` and `static boolean isValidSecretName(String n)`, which is also false for `.` and `..`. The grammar deliberately equals VariableReferenceValidator.SECRET_TOKEN's capture group. Leave that validator untouched."
          - "VaultNotConfiguredException extends RuntimeException. It must NOT extend VaultProviderUnavailableException, because the handlers must stay distinct (NFR-5). SecretAlreadyExistsException extends RuntimeException and carries only the name."
        verify:
          - cmd: "cd backend && ./gradlew compileJava -q"
            expect: "fails only at the implementors and callers that A2-A5/B-P2 fix. Do not run tests yet."
      - id: A2
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/DisabledStudioVaultProvider.java
        change:
          - "read(kind, scope, name) → Optional.empty(). The behaviour is unchanged (edge case: none → UNKNOWN_REFERENCE at acceptance)."
          - "create and listSecretNames → throw new VaultNotConfiguredException(). Nothing else is touched (FR-7, AC-V7-2)."
      - id: A3
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsProperties.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioVaultConfiguration.java
        change:
          - "pathTemplateOrDefault() → `studio/{csiId}/{environment}/{testId}/{kind}/{referenceName}` (D1, AC-V3-1)."
          - "validateHashicorp: the required placeholders become {csiId},{environment},{testId},{kind},{referenceName}. The template must end with `/{referenceName}`, and that placeholder must occur exactly once (D2, AC-V3-2). Keep the existing relative-path, https/loopback, userinfo/query and token-file checks as they are."
          - "Expose `static String listPrefixTemplate(String template)` (the template minus `/{referenceName}`) for A4. A4 uses that one function, so save, list and read cannot drift."
      - id: A4
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/HashicorpStudioVaultProvider.java
        change:
          - "Class javadoc: it is no longer 'read-only'. It does bounded KV v2 read, create-only write, and metadata list (FR-10)."
          - "uri(): take VaultScope and replace {testId} via segment(scope.testId()). Add metadataUri(scope, name) and listUri(scope) (`…/v1/{mount}/metadata/{prefix}?list=true`, D7)."
          - "read(): the body is unchanged apart from the scope."
          - "create() (D4, D12): (1) serialize `{\"options\":{\"cas\":0},\"data\":{<valueKey>: value, \"allowedOrigins\": String.join(\",\", origins)}}` with objectMapper.getFactory().createGenerator(buffer, UTF8), writing the value with `writeString(char[],0,len)`. (2) `buffer` is a private ErasableBuffer extends ByteArrayOutputStream that exposes `erase()` (Arrays.fill(buf,(byte)0)) and publishes `ofByteArray(buf, 0, count)` with no toByteArray() copy. Pre-size it to `6*value.length + 16*513 + 256` so growth never leaves an orphaned copy. (3) POST with the same headers and timeout as read. 2xx → parse data.version (bounded read) and return it as a String. 400 or 403 → GET metadataUri (bounded): 200 → SecretAlreadyExistsException, anything else → VaultProviderUnavailableException (PF-5, R-7). Other statuses, IO errors and timeouts → VaultProviderUnavailableException. (4) `finally`: buffer.erase(). The caller-owned value[] is NOT erased here; the service owns it (B2)."
          - "listSecretNames() (D7): GET listUri with the same headers. 404 → List.of(). 2xx → bounded read, then data.keys. Skip keys ending in '/' and keys failing isValidSecretName. Return them sorted and immutable. Anything else → unavailable. The existing readBounded/deadline covers stalls and oversize (NFR-4)."
          - "Do not log a value, a URI containing a value, or a Vault response body. The name may be logged."
      - id: A5
        name: "Compile gate for P1"
        verify:
          - cmd: "cd backend && ./gradlew compileJava -q"
            expect: "remaining errors are only in VaultStudioReferenceResolver / StudioReferenceResolver callers (fixed in B-P2)"

  - phase: P2
    name: Resolver seam and its two callers (main)
    steps:
      - id: B1r
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/dispatch/StudioReferenceResolver.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/VaultStudioReferenceResolver.java
        change:
          - "Signatures (R-3): `preflight(String csiId, String environment, UUID testId, String principal, ReferenceDeclarations)` and the same for `resolve`. Use the UUID type, not String. The dispatch package must not import studio.secrets (secrets already depends on dispatch), so VaultScope is built inside the implementation."
          - "VaultStudioReferenceResolver: build `VaultScope.of(csiId, environment, testId)` once per call and pass it to every read."
          - "D9: for each declared secret, before mayUse and before any provider call, a name that fails StudioVaultProvider.isValidSecretName throws UnknownReferenceException(name) in preflight and ReferenceUnavailableException(name) in resolve. Leave variables unchanged: both callers pass secretsOnly(...)."
          - "Class javadoc: drop 'the global platform secrets table' as current-state wording (FR-10). Keep it as history only."
      - id: B2r
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/studio/dispatch/StudioAcceptanceService.java
            - backend/src/main/java/com/citi/put/checks/studio/dispatch/StudioDispatcher.java
        change:
          - "StudioAcceptanceService.java:230 → references.preflight(test.getCsiId(), test.getEnvironment(), test.getId(), principal, secretsOnly(declarations)). Use test.getId() (the locked row), not the method argument."
          - "StudioDispatcher.java:311 → references.resolve(csiId, environment, testId, principal, …). `testId` is already the execution row's `test_id` (line 264)."
        verify:
          - cmd: "cd backend && ./gradlew compileJava -q"
            expect: green

  - phase: P3
    name: Test doubles and every test caller (the wide, mechanical part)
    steps:
      - id: T1
        files:
          modified:
            - backend/src/test/java/com/citi/put/checks/studio/secrets/FakeStudioVaultProvider.java
            - backend/src/test/java/com/citi/put/checks/studio/secrets/SecretUseAuthorizationTest.java
            - backend/src/test/java/com/citi/put/checks/studio/dispatch/DispatcherIT.java
            - backend/src/test/java/com/citi/put/checks/studio/dispatch/RevocationRotationIT.java
            - backend/src/test/java/com/citi/put/checks/studio/compile/CompilePipelineIT.java
            - backend/src/test/java/com/citi/put/checks/studio/secrets/HashicorpStudioVaultProviderTest.java
            - backend/src/test/java/com/citi/put/checks/studio/secrets/VaultProviderSelectionTest.java
          verifyOnly:
            - backend/src/test/java/com/citi/put/checks/studio/dispatch/JobBodyLeakTest.java
            - backend/src/test/java/com/citi/put/checks/studio/dispatch/StudioKillSwitchWiringTest.java
            - backend/src/test/java/com/citi/put/checks/studio/secrets/StudioSecretFixtures.java
        change:
          - "FakeStudioVaultProvider: key = kind|csi|env|testId|name. rotate/bindOrigins/delete/key take (kind, VaultScope, name). Implement create (a present key → SecretAlreadyExistsException, cas=0 semantics; version \"1\"; origins through SecretOrigins.parse(String.join(\",\", …))), and listSecretNames (SECRET kind under the scope, sorted, D3-filtered). makeUnavailable → both throw VaultProviderUnavailableException. Record every create call's scope/name (never the value) so B5 can assert 'exactly one write'."
          - "Each IT seeds under `VaultScope.of(CSI_ID, ENVIRONMENT, <the seeded test id>)`. In DispatcherIT and RevocationRotationIT the id is already a local (`withReference`, `testId`). CompilePipelineIT.RecordingVault delegates the new signatures; its canary proof read at :1038 uses the seeded test's scope."
          - "SecretUseAuthorizationTest: pass a fixed TEST_ID UUID to every preflight/resolve. Add the D9 case: declared `vault://studio/pilot-pw` → UNKNOWN_REFERENCE at preflight and REFERENCE_UNAVAILABLE at resolve, with zero provider reads (spy or counter). Add the cross-test case: a secret under test A, same CSI/env, is UNKNOWN for test B (AC-V4-2 resolver side, AC-V3-3)."
          - "HashicorpStudioVaultProviderTest (stub HttpServer): existing reads now assert `/v1/secret/data/studio/60406/Production/<uuid>/secrets/LOGIN%20PW`. New cases: create POST path + body `options.cas=0` + value key + allowedOrigins + token header + canary absent from the URI; 400 then metadata 200 → SecretAlreadyExists; 400 then metadata 404 → unavailable; 403 then metadata 200 → SecretAlreadyExists (PF-5); 403 then metadata 403 → unavailable; 5xx and timeout → unavailable; the ErasableBuffer is zero after success and after failure (package-private hook or a captured buffer reference); list `?list=true` on the prefix, 404 → [], folder and invalid keys skipped, sorted, oversize and stalled body bounded (NFR-4)."
          - "VaultProviderSelectionTest (D2, AC-V3-2, AC-V7-3): reject a template without {testId}; reject one not ending in /{referenceName}; reject one with {referenceName} twice; reject the OLD default string. Accept the new default with only address + token file set. Also read `../helm-chart/put-checks/values.yaml` with SnakeYAML (StudioContractTest already loads YAML the same way) and assert `studioVault.pathTemplate` passes validateHashicorp. That makes the Helm/Java coupling (F17) a Java failure as well as a chart-test failure."
        verify:
          - cmd: "cd backend && ./gradlew compileTestJava -q"
            expect: green
          - cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.secrets.*'"
            expect: green
          - cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.dispatch.DispatcherIT' --tests 'com.citi.put.checks.studio.dispatch.RevocationRotationIT' --tests 'com.citi.put.checks.studio.compile.CompilePipelineIT' --tests 'com.citi.put.checks.studio.dispatch.JobBodyLeakTest' --tests 'com.citi.put.checks.studio.dispatch.StudioKillSwitchWiringTest'"
            expect: "green; report any SKIPPED IT as skipped, not passed"

  - phase: D
    name: Drop the plaintext store (one atomic step; F14, F15)
    steps:
      - id: D1
        atomic: true
        why: >
          Once V25 exists, the seed INSERT and SecretSmokeEntity break every fresh dev DB and every
          @SpringBootTest context (ddl-auto: validate). They must disappear in the same change.
        files:
          new:
            - backend/src/main/resources/db/migration/V25__drop_plaintext_secrets.sql
            - backend/src/test/java/com/citi/put/checks/studio/secrets/PlaintextSecretsDropMigrationIT.java
          modified:
            - backend/src/main/resources/db/seed/R__sample_data.sql
            - backend/src/test/java/com/citi/put/checks/smoke/SchemaSmokeTest.java
            - backend/src/test/java/com/citi/put/checks/smoke/IndexCatalogTest.java
          deleted:
            - backend/src/main/java/com/citi/put/checks/secrets/SecretsController.java
            - backend/src/main/java/com/citi/put/checks/secrets/SecretsService.java
            - backend/src/main/java/com/citi/put/checks/secrets/SecretsRepository.java
            - backend/src/main/java/com/citi/put/checks/secrets/entity/Secret.java
            - backend/src/main/java/com/citi/put/checks/secrets/dto/CreateSecretRequest.java
            - backend/src/main/java/com/citi/put/checks/secrets/dto/SecretDto.java
            - backend/src/test/java/com/citi/put/checks/smoke/entity/SecretSmokeEntity.java
        change:
          - "V25: a header comment (forward-only; purges plaintext rows by user decision 1 / ASM-3; indexes go with the table; no FK references it: V1/V4 are the only migrations that name it, grep-verified) + `DROP TABLE IF EXISTS secrets;`"
          - "R__sample_data.sql: delete section '10. Secrets' (lines ~315-328), header and INSERT. Do not renumber the other sections. The checksum change re-applies the seed once on existing dev DBs, which is harmless."
          - "SchemaSmokeTest: remove 'secrets' from the IN list; 14 → 13. IndexCatalogTest: remove idx_secrets_owner and idx_secrets_scope."
          - "PlaintextSecretsDropMigrationIT (pattern: compile/ReferencePolicyMigrationIT): migrate to target 24, insert one secrets row, migrate to 25, then assert to_regclass('public.secrets') IS NULL and that neither index exists."
        verify:
          - cmd: "cd backend && ./gradlew compileJava compileTestJava -q"
            expect: "green (grep first: `grep -rn 'checks\\.secrets\\.' backend/src` returns nothing)"
          - cmd: "cd backend && ./gradlew test --tests 'com.citi.put.checks.studio.secrets.PlaintextSecretsDropMigrationIT' --tests 'com.citi.put.checks.studio.StudioSeedIT' --tests 'com.citi.put.checks.smoke.SchemaSmokeTest' --tests 'com.citi.put.checks.smoke.IndexCatalogTest'"
            expect: "green (AC-V1-1, F14, F15)"

  - phase: B
    name: Test-scoped endpoint
    steps:
      - id: B1
        files:
          new:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/CreateStudioSecretRequest.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretDto.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretNameDto.java
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretListDto.java
        change:
          - "record CreateStudioSecretRequest(String name, char[] value, List<String> allowedOrigins). Override toString() to omit the value, and override equals/hashCode to exclude it as well (D12)."
          - "record StudioSecretDto(String name, String version, List<String> allowedOrigins) is the 201 body. record StudioSecretNameDto(String name) is a list item. record StudioSecretListDto(List<StudioSecretNameDto> data) is the 200 body (R-5.4, PF-4)."
      - id: B2
        files:
          new:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsService.java
        change:
          - "@Service @Profile(\"!worker\"). Collaborators: StudioRepository, CsiOwnershipEvaluator, StudioVaultProvider, the platform ObjectMapper. Build `strict = platformMapper.copy().enable(FAIL_ON_UNKNOWN_PROPERTIES)` once (F18). Also disable ALLOW_COERCION_OF_SCALARS for this mapper so a numeric `value` is refused, not coerced."
          - "Do not annotate with @Transactional: no DB connection is held across the Vault HTTP call. The only DB touch is studioRepository.findById, the same visibility-restricted lookup as StudioService.findTestById:279."
          - "list(UUID id, Authentication auth): load → absent → StudioAccessDeniedException; canRead(auth, csi) or 403 → provider.listSecretNames(VaultScope.of(test.getCsiId(), test.getEnvironment(), test.getId())) → StudioSecretListDto."
          - "create(UUID id, byte[] body, Authentication auth), in order (spec §3.3): (1) load + canWrite (403). (2) body null/empty or > 65536 bytes → StudioValidationException(INVALID_SECRET_REQUEST, fixed message) (R-6). (3) strict.readValue(body, CreateStudioSecretRequest.class) straight from bytes, never new String(body). Any JsonProcessingException/IOException → INVALID_SECRET_REQUEST with a fixed message, never e.getMessage(). (4) validate: name → INVALID_SECRET_NAME (D3); value null/empty/>8192 → INVALID_SECRET_VALUE (D6); origins null/empty/>16/any >512 chars, or SecretOrigins.parse(String.join(\",\", list)) empty or a different size (a dropped entry means malformed) → INVALID_SECRET_ORIGINS (D5). (5) provider.create(scope, name, value, normalized). (6) return StudioSecretDto(name, version, normalized)."
          - "`finally` on every path: Arrays.fill(body,(byte)0); if a request was parsed, Arrays.fill(request.value(),'\\0') (NFR-2). Javadoc names the residual: Jackson's recycled parse buffers and servlet/HttpClient transients (same stance as Resolved, AC-15)."
          - "Logging: at most INFO `Studio secret created: test={id} name={name} version={v}`. Never the body, the value, or the request object."
      - id: B3
        files:
          new:
            - backend/src/main/java/com/citi/put/checks/studio/secrets/StudioSecretsController.java
        change:
          - "@RestController @Profile(\"!worker\") @RequestMapping(\"/api/v1/studio\"). `@GetMapping(\"/tests/{id}/secrets\")` → 200. `@PostMapping(\"/tests/{id}/secrets\")` takes `@PathVariable UUID id, @RequestBody(required = false) byte[] body, Authentication auth` → ResponseEntity.status(201).body(dto), with no Location header."
          - "Set no `consumes`. That would add a pre-authorization 415 outside the declared status set (PF-3). ByteArrayHttpMessageConverter accepts every media type."
      - id: B4
        files:
          modified:
            - backend/src/main/java/com/citi/put/checks/config/ChecksExceptionHandler.java
        change:
          - "@ExceptionHandler(VaultNotConfiguredException) → 503 {error: VAULT_NOT_CONFIGURED, message: 'Vault is not connected for this environment'}."
          - "@ExceptionHandler(SecretAlreadyExistsException) → 409 {error: SECRET_ALREADY_EXISTS, message: 'A secret with this name already exists for this test'}."
          - "The existing VAULT_UNAVAILABLE, StudioValidationException (400 {error,message}) and StudioAccessDenied handlers already cover the rest (F10)."
      - id: B5
        files:
          new:
            - backend/src/test/java/com/citi/put/checks/studio/secrets/StudioSecretsServiceTest.java
            - backend/src/test/java/com/citi/put/checks/studio/secrets/StudioSecretsControllerIT.java
        change:
