security:
  - "NFR-1: the value is refused at four boundaries: the response DTOs (no value field), toString, fixed error messages, and the frontend redactBody. B5 and F5 test each with a canary; review alone is not accepted as proof."
  - "NFR-2: the stated residual is Jackson's recycled parser and generator buffers plus servlet/HttpClient transients. What is claimed: no retained reference after return. Zeroing of transient platform buffers is not claimed."
  - "NFR-3: 403 comes before any 400/409/503 because the body is parsed after authorization. The one earlier-than-authz 400 is a malformed UUID path variable, which answers identically for every caller and discloses nothing (the same stance as confirmCompile's @Valid note)."
  - "Existing finding, not fixed here: cookie-authenticated mutations have no CSRF control (runbook §10). This story adds one more such mutation, and this one writes to Vault. Keep it visible in the PR description."
  - "Inbound body size: the post-authz 64 KiB cap limits parsing, but Spring has already buffered the body. That matches every other public Studio JSON route; there is no global request-size limit in this service (grep)."

tradeOffs:
  - decision: "One PR"
    for: "The resolver signature, the V25 drop, the contract count and the digest pin are mutually dependent. Splitting them leaves main red or the contract lying."
    against: "Large review surface (~45 files)."
    mitigation: "Phase order above; each phase has its own narrow gate."
  - decision: "Name rule on the StudioVaultProvider interface, not a new utility class"
    for: "One definition shared by the endpoint, the resolver and the provider; no new file."
    against: "A static on an SPI is slightly unusual."
  - decision: "Separate list-item and create DTOs (R-5.4)"
    for: "Wire shapes stay exactly as §3.3 says, and schema parity holds."
    against: "Three small records instead of one."
  - decision: "Treat 403 on create as 'check metadata' (R-7)"
    for: "Works with a create-only token policy. A bad token still reads as unavailable, because the metadata read also returns 403."
    against: "One extra round trip on a genuine permission failure."

outOfScope:   # recorded as follow-ups, not built (spawn instruction; spec §1.2)
  - "OQ-1 rotate/replace/delete a secret from Studio → @pm."
  - "OQ-2 delete the Vault subtree when a test is deleted → follow-up; see the ruling in spec §9."
  - "OQ-3 MSW fixtures (fixtures.ts:62, compileFixtures.ts:90, pageSaveAndStop.test.tsx:251) and compileStates.test.tsx:301: unchanged."
  - "OQ-4 wizard check-level secret overrides → @po. D16's gate is applied and nothing else."
  - "Turning STUDIO_CAPABILITIES.vaultSecrets on (CON-1); production secret-use policy (V6); platform Vault connection (V7)."
  - "docs/stories/10.43-…/integration-design.md:59 quotes the old template. It is a historical story record; leave it."
