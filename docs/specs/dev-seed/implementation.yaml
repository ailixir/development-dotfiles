  - id: TASK-02
    title: "Create seed directory and R__dev_sample_data.sql"
    size: L
    estimate_hours: 3.0
    description: |
      Create backend/src/main/resources/db/seed/dev/R__dev_sample_data.sql with:

      1. Header comment with purpose, safety notes, trace refs
      2. Defensive partition creation (FEAS-01 resolution)
      3. Users: 5 rows (sso_id, name, email, department, is_active — NO role column per COMP-01)
      4. CSI Systems: 3 rows (CRITICAL/HIGH/MEDIUM, varied health stories)
      5. Checks: 15 rows (8 HTTP + 4 TCP + 3 UI_TEST type markers) with valid JSONB configs
      6. Schedules: 12 rows (various frequencies, cron expressions)
      7. Tags: 8 rows
      8. Check Tags: ~20 junction rows
      9. CSI Tags: ~6 junction rows
      10. Reports: 3 rows with JSONB schedule
      11. Report Executions: 9 rows
      12. Secrets: 2 rows (encrypted_value NULL)
      13. UI Tests: 3 rows with JSONB steps/variables
      14. UI Test Executions: 6 rows
      15. Execution Results: ~450 rows via generate_series with weighted status arrays
      16. REFRESH MATERIALIZED VIEW CONCURRENTLY csi_metrics_current

      All INSERTs use ON CONFLICT (pk) DO NOTHING for idempotency.
      FK ordering: users → csi → checks → schedules → tags → junctions → reports → report_execs → secrets → ui_tests → ui_test_execs → execution_results → REFRESH VIEW.
      Execution results inserted in started_at ASC order per check to ensure trigger propagates correct final status.
    files:
      - path: backend/src/main/resources/db/seed/dev/R__dev_sample_data.sql
        action: CREATE
    traces: [FR-DEV-03, FR-DEV-04, FR-DEV-06, FR-DEV-07, FR-DEV-08, CON-DEV-01 through CON-DEV-07]
    acceptance_criteria:
