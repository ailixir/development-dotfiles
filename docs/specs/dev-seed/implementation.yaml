critique_resolutions:
  - condition: "COMP-01: Remove 'role' from users seed data"
    resolution: "Confirmed — V1 users table has no role column. Seed SQL will use only: id, sso_id, name, email, department, created_at, last_login, is_active."

  - condition: "FEAS-01: Partition availability on first startup post-May 2026"
    resolution: |
      Option A selected — the seed SQL will include a defensive partition creation block
      before inserting execution_results:

        DO $$
        DECLARE
          partition_name TEXT;
          range_start   DATE;
          range_end     DATE;
        BEGIN
          partition_name := 'execution_results_' || to_char(CURRENT_DATE, 'YYYY_MM');
          range_start    := date_trunc('month', CURRENT_DATE);
          range_end      := date_trunc('month', CURRENT_DATE + INTERVAL '1 month');

          EXECUTE format(
            'CREATE TABLE IF NOT EXISTS %I PARTITION OF execution_results FOR VALUES FROM (%L) TO (%L)',
            partition_name, range_start, range_end
          );
        END $$;

      This is safe because:
      - CREATE TABLE IF NOT EXISTS is idempotent (no-op if PartitionScheduler already created it)
      - Uses the same naming convention as PartitionManager.java (execution_results_YYYY_MM)
      - Runs inside the same transaction as the seed data

