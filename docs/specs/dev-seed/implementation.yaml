      - "All 15 entity types have seed data"
      - "JSONB configurations match HttpConfiguration/TcpConfiguration contracts"
      - "All FK constraints satisfied by insertion order"
      - "ON CONFLICT DO NOTHING on every INSERT"
      - "Execution results use CURRENT_TIMESTAMP arithmetic (no hardcoded dates)"
      - "Defensive partition creation before execution_results INSERT"
      - "Materialized view refreshed at end"
