<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUT Platform - Complete App Shell Demo</title>
    
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    
    <!-- React Development Scripts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Material-UI Scripts -->
    <script src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.development.js"></script>
    
    <!-- PUT Core Components UMD Bundle -->
    <script src="/dist/put-components-umd.js"></script>
    
    <style>
        /* Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Helvetica Neue', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #eff5f7;
            color: #1A2332;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* App Container */
        #app {
            min-height: 100vh;
            background: linear-gradient(180deg, #eff5f7 0%, #EDF2F7 100%);
        }
        
        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 16px;
            color: #6B7280;
            flex-direction: column;
            gap: 16px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #E5E7EB;
            border-top: 3px solid #0056C7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Module Content Area */
        .module-content {
            padding-top: 114px; /* Account for fixed header (50px + 48px top margin + 16px extra) */
            margin-left: 200px; /* Account for sidebar when expanded (280px + 16px left margin + 48px spacing) */
            padding: 114px 24px 24px 24px; /* Top, Right, Bottom, Left padding */
            min-height: calc(100vh - 114px);
            transition: margin-left 300ms cubic-bezier(0.4, 0, 0.2, 1);
            background: #eff5f7;
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .module-content {
                margin-left: 0;
                padding: 114px 16px 24px 16px;
            }
            
            .module-content.sidebar-collapsed {
                margin-left: 0;
            }
        }
        
        @media (max-width: 768px) {
            .module-content {
                padding: 114px 12px 24px 12px;
            }
        }
        
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>Loading PUT Platform...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Material-UI Components
        const {
            AppBar,
            Toolbar,
            Typography,
            Button,
            Menu,
            MenuItem,
            Card,
            CardContent,
            CardActions,
            Chip,
            Badge,
            Avatar,
            Box,
            Container,
            Grid,
            Paper,
            Divider,
            List,
            ListItem
        } = MaterialUI;
        
        // Material-UI Icons (using material icons font)
        const HomeIcon = () => <span className="material-icons">home</span>;
        const HealthIcon = () => <span className="material-icons">favorite</span>;
        const CommsIcon = () => <span className="material-icons">campaign</span>;
        const DnsIcon = () => <span className="material-icons">language</span>;
        const CertIcon = () => <span className="material-icons">security</span>;
        const IncidentIcon = () => <span className="material-icons">warning</span>;
        const CatalogIcon = () => <span className="material-icons">apps</span>;
        const NotificationIcon = () => <span className="material-icons">notifications</span>;
        const ExpandMoreIcon = () => <span className="material-icons">expand_more</span>;
        const ExpandLessIcon = () => <span className="material-icons">expand_less</span>;
        const MenuIcon = () => <span className="material-icons">menu</span>;
        const DashboardIcon = () => <span className="material-icons">dashboard</span>;
        const MonitorIcon = () => <span className="material-icons">monitor_heart</span>;
        const SettingsIcon = () => <span className="material-icons">settings</span>;
        const ReportsIcon = () => <span className="material-icons">assessment</span>;
        const AlertsIcon = () => <span className="material-icons">notifications_active</span>;
        const ConfigIcon = () => <span className="material-icons">tune</span>;
        const LogsIcon = () => <span className="material-icons">article</span>;
        const UsersIcon = () => <span className="material-icons">people</span>;
        const DomainsIcon = () => <span className="material-icons">public</span>;
        const RecordsIcon = () => <span className="material-icons">dns</span>;
        const CertificatesIcon = () => <span className="material-icons">verified_user</span>;
        const RenewalIcon = () => <span className="material-icons">autorenew</span>;
        const DeployIcon = () => <span className="material-icons">cloud_upload</span>;
        const IncidentsListIcon = () => <span className="material-icons">list_alt</span>;
        const EscalationIcon = () => <span className="material-icons">trending_up</span>;
        const PlaybooksIcon = () => <span className="material-icons">book</span>;
        const TimelineIcon = () => <span className="material-icons">timeline</span>;
        const TeamIcon = () => <span className="material-icons">group</span>;

        // PUT Modules Configuration
        const PUT_MODULES = {
            HOME: {
                id: 'home',
                label: 'Dashboard',
                description: 'Platform overview and quick actions',
                icon: HomeIcon,
                color: '#1976d2'
            },
            HEALTH: {
                id: 'health',
                label: 'Health Monitoring',
                description: 'Monitor service health and performance across all environments',
                icon: HealthIcon,
                color: '#d32f2f'
            },
            COMMS: {
                id: 'comms',
                label: 'Communications',
                description: 'Manage incident communications and stakeholder notifications',
                icon: CommsIcon,
                color: '#ed6c02'
            },
            DNS: {
                id: 'dns',
                label: 'DNS Management',
                description: 'Self-service DNS record management and domain configuration',
                icon: DnsIcon,
                color: '#2e7d32'
            },
            CERTIFICATES: {
                id: 'certificates',
                label: 'Certificate Management',
                description: 'SSL/TLS certificate lifecycle management and deployment',
                icon: CertIcon,
                color: '#9c27b0'
            },
            INCIDENTS: {
                id: 'incidents',
                label: 'Incident Response',
                description: 'Streamlined incident tracking and resolution workflows',
                icon: IncidentIcon,
                color: '#f57c00'
            }
        };

        // Module Navigation Configuration
        // The sidebar content is defined by each module but rendered by the Platform Shell
        const MODULE_NAVIGATION = {
            home: [
                { id: 'dashboard', label: 'Dashboard', icon: DashboardIcon, path: '/' },
                { id: 'communications', label: 'Communications', icon: CommsIcon, path: '/communications' },
                { id: 'templates', label: 'Templates', icon: LogsIcon, path: '/templates' }
            ],
            health: [
                { id: 'dashboard', label: 'Health Dashboard', icon: DashboardIcon, path: '/health' },
                { id: 'monitors', label: 'Monitors', icon: MonitorIcon, path: '/health/monitors' },
                { id: 'alerts', label: 'Alerts', icon: AlertsIcon, path: '/health/alerts' },
                { id: 'reports', label: 'Reports', icon: ReportsIcon, path: '/health/reports' },
                { id: 'settings', label: 'Settings', icon: SettingsIcon, path: '/health/settings' }
            ],
            comms: [
                { id: 'dashboard', label: 'Dashboard', icon: DashboardIcon, path: '/comms' },
                { id: 'communications', label: 'Communications', icon: CommsIcon, path: '/comms/communications' },
                { id: 'templates', label: 'Templates', icon: LogsIcon, path: '/comms/templates' }
            ],
            dns: [
                { id: 'dashboard', label: 'DNS Dashboard', icon: DashboardIcon, path: '/dns' },
                { id: 'domains', label: 'Domains', icon: DomainsIcon, path: '/dns/domains' },
                { id: 'records', label: 'DNS Records', icon: RecordsIcon, path: '/dns/records' },
                { id: 'zones', label: 'Zone Management', icon: ConfigIcon, path: '/dns/zones' },
                { id: 'logs', label: 'Query Logs', icon: LogsIcon, path: '/dns/logs' }
            ],
            certificates: [
                { id: 'dashboard', label: 'Certificates', icon: DashboardIcon, path: '/certificates' },
                { id: 'active', label: 'Active Certificates', icon: CertificatesIcon, path: '/certificates/active' },
                { id: 'renewal', label: 'Auto Renewal', icon: RenewalIcon, path: '/certificates/renewal' },
                { id: 'deploy', label: 'Deployment', icon: DeployIcon, path: '/certificates/deploy' },
                { id: 'settings', label: 'Settings', icon: SettingsIcon, path: '/certificates/settings' }
            ],
            incidents: [
                { id: 'dashboard', label: 'Incident Center', icon: DashboardIcon, path: '/incidents' },
                { id: 'active', label: 'Active Incidents', icon: IncidentsListIcon, path: '/incidents/active' },
                { id: 'escalation', label: 'Escalation Rules', icon: EscalationIcon, path: '/incidents/escalation' },
                { id: 'playbooks', label: 'Playbooks', icon: PlaybooksIcon, path: '/incidents/playbooks' },
                { id: 'team', label: 'Response Team', icon: TeamIcon, path: '/incidents/team' }
            ]
        };

        // Get PlatformSidebar from PUT Core Components
        const { PlatformSidebar, navigationRegistry } = window.PUTComponents;
        
        // Helper function to extract icon name from React component
        const getIconName = (IconComponent) => {
            // Map icon components to material icon names
            const iconMap = {
                [HomeIcon]: 'home',
                [DashboardIcon]: 'dashboard',
                [MonitorIcon]: 'monitor_heart',
                [AlertsIcon]: 'notifications_active',
                [ReportsIcon]: 'assessment',
                [SettingsIcon]: 'settings',
                [CommsIcon]: 'campaign',
                [LogsIcon]: 'article',
                [DomainsIcon]: 'public',
                [RecordsIcon]: 'dns',
                [ConfigIcon]: 'tune',
                [CertificatesIcon]: 'verified_user',
                [RenewalIcon]: 'autorenew',
                [DeployIcon]: 'cloud_upload',
                [IncidentsListIcon]: 'list_alt',
                [EscalationIcon]: 'trending_up',
                [PlaybooksIcon]: 'book',
                [TimelineIcon]: 'timeline',
                [TeamIcon]: 'group'
            };
            return iconMap[IconComponent] || 'dashboard';
        };
        
        // Register module navigation configurations
        Object.keys(MODULE_NAVIGATION).forEach(moduleId => {
            const moduleData = PUT_MODULES[moduleId.toUpperCase()];
            if (moduleData && MODULE_NAVIGATION[moduleId]) {
                navigationRegistry.register({
                    moduleId,
                    moduleLabel: moduleData.label,
                    version: '1.0.0',
                    navigation: MODULE_NAVIGATION[moduleId].map(item => ({
                        id: item.id,
                        label: item.label,
                        path: item.path,
                        icon: getIconName(item.icon),
                        description: item.id === 'dashboard' ? 'Overview & analytics' :
                                   item.id === 'communications' ? 'Manage messages' :
                                   item.id === 'templates' ? 'Message templates' :
                                   item.id === 'alerts' ? 'Active notifications' :
                                   item.id === 'monitors' ? 'System monitoring' :
                                   item.id === 'reports' ? 'Analytics & reports' :
                                   'Configuration'
                    }))
                });
            }
        });

        // PlatformHeader Component (Full Implementation from core-components)
        const PlatformHeader = ({
            currentModule = 'home',
            onModuleChange,
            notifications = 3,
            user = { name: 'Bruno Buger', role: 'Senior Vice President' },
            platformTitle = 'Production Unified Toolkit'
        }) => {
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);
            const dropdownRef = useRef(null);
            const buttonRef = useRef(null);
            const userMenuRef = useRef(null);
            const userButtonRef = useRef(null);

            const modules = Object.values(PUT_MODULES);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 10);
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (
                        dropdownRef.current && 
                        !dropdownRef.current.contains(event.target) &&
                        !buttonRef.current?.contains(event.target)
                    ) {
                        setIsDropdownOpen(false);
                    }
                    
                    if (
                        userMenuRef.current &&
                        !userMenuRef.current.contains(event.target) &&
                        !userButtonRef.current?.contains(event.target)
                    ) {
                        setIsUserMenuOpen(false);
                    }
                };

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const currentModuleData = modules.find(m => m.id === currentModule);

            const headerStyles = {
                position: 'fixed',
                top: 0,
                left: 0,
                right: 0,
                height: '64px',
                background: isScrolled ? 'rgba(255, 255, 255, 0.98)' : '#FFFFFF',
                backdropFilter: isScrolled ? 'blur(20px) saturate(180%)' : 'none',
                borderBottom: '1px solid #E8EDF2',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                padding: '0 24px',
                zIndex: 1000,
                transition: 'all 300ms cubic-bezier(0.4, 0, 0.2, 1)',
                fontFamily: "'Helvetica Neue', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif",
                boxShadow: isScrolled ? '0 2px 8px rgba(0, 47, 114, 0.08)' : 'none'
            };

            return (
                <AppBar 
                    position="fixed" 
                    sx={{ 
                        background: '#FFFFFF',
                        backdropFilter: 'none',
                        borderBottom: 'none',
                        boxShadow: '0 2px 12px rgba(0, 0, 0, 0.08)',
                        transition: 'all 300ms cubic-bezier(0.4, 0, 0.2, 1)',
                        color: '#0F1419',
                        borderRadius: '20px 20px 20px 20px', // Fully rounded corners
                        mx: 2, // Add horizontal margin
                        mt: 2, // Add more top margin
                        width: 'calc(100% - 32px)', // Adjust width for margins
                        zIndex: 1100
                    }}
                >
                    <Toolbar sx={{ justifyContent: 'space-between', px: 3 }}>
                        {/* Brand Section */}
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, minWidth: '380px' }}>
                            {/* Citi Logo */}
                            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                <Box
                                    component="img"
                                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Citi.svg/1024px-Citi.svg.png"
                                    alt="Citi"
                                    sx={{
                                        width: 40,
                                        height: 'auto',
                                        filter: 'brightness(1.1)'
                                    }}
                                />
                                <Typography 
                                    variant="body2" 
                                    sx={{ 
                                        fontWeight: 600,
                                        color: '#1A2332',
                                        fontSize: '16px',
                                        fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
                                    }}
                                >
                                </Typography>
                            </Box>

                            {/* Vertical Separator */}
                            <Box sx={{ 
                                height: '24px', 
                                width: '1px', 
                                backgroundColor: '#E5E8EB',
                                mx: 1
                            }} />

                            {/* PUT Logo and Title */}
                            <Button
                                onClick={() => onModuleChange('home')}
                                sx={{ 
                                    display: 'flex', 
                                    alignItems: 'center', 
                                    gap: 2, 
                                    textTransform: 'none',
                                    color: 'inherit',
                                    '&:hover': { backgroundColor: 'transparent' }
                                }}
                            >
                                <Paper
                                    sx={{
                                        width: 40,
                                        height: 40,
                                        background: 'linear-gradient(135deg, #2359de 0%, #4D94FF 100%)',
                                        borderRadius: '12px',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        color: 'white',
                                        fontSize: '14px',
                                        fontWeight: 700,
                                        boxShadow: '0 4px 16px rgba(35, 89, 222, 0.3)',
                                        transition: 'transform 200ms ease',
                                        '&:hover': { transform: 'scale(1.05)' }
                                    }}
                                >
                                    PUT
                                </Paper>
                                <Typography 
                                    variant="h6" 
                                    sx={{ 
                                        fontWeight: 600,
                                        color: '#1A2332',
                                        letterSpacing: '-0.01em',
                                        fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
                                    }}
                                >
                                    Production Unified Toolkit
                                </Typography>
                            </Button>
                        </Box>

                        {/* Navigation */}
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, flex: 1, justifyContent: 'center' }}>
                            <Typography variant="body2" sx={{ color: '#6B7280', fontWeight: 500 }}>
                                Services ›
                            </Typography>
                            
                            <Box sx={{ position: 'relative' }}>
                                <Button
                                    ref={buttonRef}
                                    onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                                    variant="outlined"
                                    endIcon={isDropdownOpen ? <ExpandLessIcon /> : <ExpandMoreIcon />}
                                    sx={{
                                        minWidth: 250,
                                        py: 1.5,
                                        justifyContent: 'space-between',
                                        textTransform: 'none',
                                        borderColor: isDropdownOpen ? '#2359de' : '#E5E8EB',
                                        backgroundColor: isDropdownOpen ? '#F7FAFC' : 'transparent',
                                        color: '#1A2332',
                                        fontWeight: 500,
                                        borderRadius: 2,
                                        '&:hover': {
                                            borderColor: '#2359de',
                                            backgroundColor: '#F7FAFC'
                                        }
                                    }}
                                >
                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                        <Box sx={{ color: currentModuleData?.color, display: 'flex', alignItems: 'center' }}>
                                            {currentModuleData?.icon && <currentModuleData.icon />}
                                        </Box>
                                        <span>{currentModuleData?.label || 'Select Service'}</span>
                                    </Box>
                                </Button>

                                <Menu
                                    anchorEl={buttonRef.current}
                                    open={isDropdownOpen}
                                    onClose={() => setIsDropdownOpen(false)}
                                    sx={{
                                        '& .MuiPaper-root': {
                                            width: 380,
                                            borderRadius: 2,
                                            boxShadow: '0 8px 25px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.03)',
                                            border: '1px solid #E5E8EB',
                                            maxHeight: 450
                                        }
                                    }}
                                >
                                    {modules.map((module) => (
                                        <MenuItem
                                            key={module.id}
                                            onClick={() => {
                                                onModuleChange(module.id);
                                                setIsDropdownOpen(false);
                                            }}
                                            selected={currentModule === module.id}
                                            sx={{
                                                py: 2,
                                                px: 2,
                                                borderLeft: currentModule === module.id ? '3px solid #2359de' : '3px solid transparent'
                                            }}
                                        >
                                            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, width: '100%' }}>
                                                <Box sx={{ color: module.color, display: 'flex', alignItems: 'center', minWidth: 24 }}>
                                                    <module.icon />
                                                </Box>
                                                <Box sx={{ flex: 1 }}>
                                                    <Typography variant="body2" sx={{ fontWeight: 600, color: '#1A2332' }}>
                                                        {module.label}
                                                    </Typography>
                                                    <Typography variant="caption" sx={{ color: '#4A5568', lineHeight: 1.4 }}>
                                                        {module.description}
                                                    </Typography>
                                                </Box>
                                            </Box>
                                        </MenuItem>
                                    ))}
                                </Menu>
                            </Box>
                        </Box>

                        {/* Right Section */}
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, minWidth: '280px', justifyContent: 'flex-end' }}>
                            {/* Notifications */}
                            <Button
                                variant="text"
                                sx={{
                                    minWidth: 'auto',
                                    p: 1.25,
                                    borderRadius: '50%',
                                    color: '#4A5568',
                                    '&:hover': {
                                        backgroundColor: '#F7FAFC'
                                    }
                                }}
                            >
                                <Badge badgeContent={notifications} color="error">
                                    <NotificationIcon />
                                </Badge>
                            </Button>

                            {/* User Menu */}
                            <Box sx={{ position: 'relative' }}>
                                <Button
                                    ref={userButtonRef}
                                    onClick={() => setIsUserMenuOpen(!isUserMenuOpen)}
                                    sx={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 1.5,
                                        textTransform: 'none',
                                        color: '#1A2332',
                                        borderRadius: '12px',
                                        p: 1,
                                        minWidth: 'auto',
                                        backgroundColor: isUserMenuOpen ? 'rgba(35, 89, 222, 0.08)' : 'transparent',
                                        border: `1px solid ${isUserMenuOpen ? 'rgba(35, 89, 222, 0.2)' : 'transparent'}`,
                                        '&:hover': {
                                            backgroundColor: 'rgba(35, 89, 222, 0.04)'
                                        }
                                    }}
                                >
                                    <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', mr: 1 }}>
                                        <Typography variant="body2" sx={{ fontWeight: 600, fontSize: '14px', lineHeight: 1 }}>
                                            {user.name}
                                        </Typography>
                                        <Typography variant="caption" sx={{ color: '#4A5568', fontSize: '11px', lineHeight: 1.5 }}>
                                            {user.role}
                                        </Typography>
                                    </Box>
                                    <Avatar
                                        sx={{
                                            width: 32,
                                            height: 32,
                                            background: 'linear-gradient(135deg, #2359de 0%, #4D94FF 100%)',
                                            fontSize: '12px',
                                            fontWeight: 600
                                        }}
                                    >
                                        {user.name.split(' ').map(n => n[0]).join('').toUpperCase()}
                                    </Avatar>
                                    <span className="material-icons" style={{ fontSize: '18px', color: '#4A5568' }}>
                                        {isUserMenuOpen ? 'expand_less' : 'expand_more'}
                                    </span>
                                </Button>

                                {/* User Dropdown Menu */}
                                <Menu
                                    anchorEl={userButtonRef.current}
                                    open={isUserMenuOpen}
                                    onClose={() => setIsUserMenuOpen(false)}
                                    anchorOrigin={{
                                        vertical: 'bottom',
                                        horizontal: 'right',
                                    }}
                                    transformOrigin={{
                                        vertical: 'top',
                                        horizontal: 'right',
                                    }}
                                    sx={{
                                        '& .MuiPaper-root': {
                                            width: 240,
                                            borderRadius: 2,
                                            boxShadow: '0 8px 25px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.03)',
                                            border: '1px solid #E5E8EB',
                                            mt: 1
                                        }
                                    }}
                                >
                                    {/* User Profile Section */}
                                    <Box sx={{ p: 2, borderBottom: '1px solid #E5E8EB' }}>
                                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                                            <Avatar
                                                sx={{
                                                    width: 40,
                                                    height: 40,
                                                    background: 'linear-gradient(135deg, #2359de 0%, #4D94FF 100%)',
                                                    fontSize: '14px',
                                                    fontWeight: 600
                                                }}
                                            >
                                                {user.name.split(' ').map(n => n[0]).join('').toUpperCase()}
                                            </Avatar>
                                            <Box>
                                                <Typography variant="body2" sx={{ fontWeight: 600, color: '#1A2332' }}>
                                                    {user.name}
                                                </Typography>
                                                <Typography variant="caption" sx={{ color: '#4A5568' }}>
                                                    {user.role}
                                                </Typography>
                                            </Box>
                                        </Box>
                                    </Box>

                                    {/* Menu Items */}
                                    <MenuItem onClick={() => setIsUserMenuOpen(false)} sx={{ py: 1.5 }}>
                                        <span className="material-icons" style={{ marginRight: '12px', fontSize: '20px', color: '#4A5568' }}>person</span>
                                        My Profile
                                    </MenuItem>
                                    <MenuItem onClick={() => setIsUserMenuOpen(false)} sx={{ py: 1.5 }}>
                                        <span className="material-icons" style={{ marginRight: '12px', fontSize: '20px', color: '#4A5568' }}>settings</span>
                                        Settings
                                    </MenuItem>
                                    <MenuItem onClick={() => setIsUserMenuOpen(false)} sx={{ py: 1.5 }}>
                                        <span className="material-icons" style={{ marginRight: '12px', fontSize: '20px', color: '#4A5568' }}>help</span>
                                        Help & Support
                                    </MenuItem>
                                    <Divider />
                                    <MenuItem onClick={() => setIsUserMenuOpen(false)} sx={{ py: 1.5, color: '#DC2626' }}>
                                        <span className="material-icons" style={{ marginRight: '12px', fontSize: '20px', color: '#DC2626' }}>logout</span>
                                        Sign Out
                                    </MenuItem>
                                </Menu>
                            </Box>
                        </Box>
                    </Toolbar>
                </AppBar>
            );
        };

        // PlatformWelcome Component (Full Implementation from core-components)
        const PlatformWelcome = ({
            title = 'Get Started with Production Unified Toolkit',
            subtitle = 'Your one-stop platform for production operations, monitoring, and incident management.',
            modules = [],
            onModuleSelect,
            showStats = true

            const [visibleCards, setVisibleCards] = useState(0);

            const defaultModules = [
                {
                    id: 'health',
                    title: 'Health Monitoring',
                    description: 'Monitor service health, performance metrics, and system status across all environments.',
                    icon: HealthIcon,
                    color: '#d32f2f',
                    status: 'healthy',
                    available: true
                },
                {
                    id: 'comms',
                    title: 'Communications',
                    description: 'Manage incident communications, alerts, and stakeholder notifications.',
                    icon: CommsIcon,
                    color: '#ed6c02',
                    count: 3,
                    available: true
                },
                {
                    id: 'dns',
                    title: 'DNS Management',
                    description: 'Self-service DNS record management and domain configuration.',
                    icon: DnsIcon,
                    color: '#2e7d32',
                    available: true
                },
                {
                    id: 'certificates',
                    title: 'Certificate Management',
                    description: 'SSL/TLS certificate lifecycle management, renewal, and deployment.',
                    icon: CertIcon,
                    color: '#9c27b0',
                    available: true
                },
                {
                    id: 'incidents',
                    title: 'Incident Response',
                    description: 'Streamlined incident tracking, escalation, and resolution workflows.',
                    icon: IncidentIcon,
                    color: '#f57c00',
                    status: 'warning',
                    available: true
                },
                {
                    id: 'catalog',
                    title: 'Service Catalog',
                    description: 'Discover and manage all services and tools available in the platform.',
                    icon: CatalogIcon,
                    color: '#1976d2',
                    available: true
                }
            ];

            const moduleList = modules.length > 0 ? modules : defaultModules;

            useEffect(() => {
                const timer = setInterval(() => {
                    setVisibleCards(prev => {
                        if (prev < moduleList.length) {
                            return prev + 1;
                        }
                        clearInterval(timer);
                        return prev;
                    });
                }, 80);

                return () => clearInterval(timer);
            }, [moduleList.length]);

            return (
                <Box className="module-content" sx={{ mt: 2 }}>
                    {/* Hero Banner */}
                    <Container maxWidth="lg" sx={{ mb: 8 }}>
                        <Paper
                            sx={{
                                background: 'linear-gradient(135deg, #2359de 0%, #4D94FF 50%, #6B73FF 100%)',
                                borderRadius: 5,
                                py: 8,
                                px: 5,
                                color: 'white',
                                textAlign: 'center',
                                position: 'relative',
                                overflow: 'hidden',
                                boxShadow: '0 20px 40px rgba(35, 89, 222, 0.3)'
                            }}
                        >
                            <Box
                                sx={{
                                    position: 'absolute',
                                    top: 0, left: 0, right: 0, bottom: 0,
                                    background: 'url("data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.1"%3E%3Ccircle cx="7" cy="7" r="2"/%3E%3Ccircle cx="27" cy="7" r="2"/%3E%3Ccircle cx="47" cy="7" r="2"/%3E%3Ccircle cx="7" cy="27" r="2"/%3E%3Ccircle cx="27" cy="27" r="2"/%3E%3Ccircle cx="47" cy="27" r="2"/%3E%3Ccircle cx="7" cy="47" r="2"/%3E%3Ccircle cx="27" cy="47" r="2"/%3E%3Ccircle cx="47" cy="47" r="2"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")',
                                    pointerEvents: 'none'
                                }}
                            />
                            <Box sx={{ position: 'relative', zIndex: 1 }}>
                                <Typography
                                    variant="h3"
                                    sx={{
                                        fontWeight: 800,
                                        mb: 2,
                                        letterSpacing: '-0.02em',
                                        lineHeight: 1.1,
                                        fontFamily: "'Helvetica Neue', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif"
                                    }}
                                >
                                    {title}
                                </Typography>
                                <Typography
                                    variant="h6"
                                    sx={{
                                        fontWeight: 400,
                                        mb: 4,
                                        opacity: 0.95,
                                        maxWidth: 600,
                                        mx: 'auto',
                                        lineHeight: 1.6
                                    }}
                                >
                                    {subtitle}
                                </Typography>
                                <Button
                                    variant="outlined"
                                    size="large"
                                    onClick={() => onModuleSelect && onModuleSelect('health')}
                                    sx={{
                                        background: 'rgba(255, 255, 255, 0.2)',
                                        border: '1px solid rgba(255, 255, 255, 0.3)',
                                        borderRadius: 1.5,
                                        py: 1.75,
                                        px: 3.5,
                                        color: 'white',
                                        fontSize: '16px',
                                        fontWeight: 600,
                                        backdropFilter: 'blur(10px)',
                                        textTransform: 'none',
                                        '&:hover': {
                                            background: 'rgba(255, 255, 255, 0.3)',
                                            border: '1px solid rgba(255, 255, 255, 0.5)'
                                        }
                                    }}
                                >
                                    Explore Platform →
                                </Button>
                            </Box>
                        </Paper>
                    </Container>

                    {/* Stats Section */}
                    {showStats && (
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))',
                            gap: '24px',
                            margin: '0 24px 60px',
                            maxWidth: '1200px',
                            marginLeft: 'auto',
                            marginRight: 'auto'
                        }}>
                            {[
                                { value: '99.9%', label: 'Platform Uptime' },
                                { value: '2.3s', label: 'Avg Response Time' },
                                { value: '847', label: 'Services Monitored' },
                                { value: '24/7', label: 'Incident Response' }
                            ].map((stat, index) => (
                                <div key={index} style={{
                                    background: 'white',
                                    borderRadius: '16px',
                                    padding: '32px 24px',
                                    textAlign: 'center',
                                    border: '1px solid #E5E7EB',
                                    boxShadow: '0 4px 12px rgba(0, 0, 0, 0.05)',
                                    transition: 'transform 200ms ease'
                                }}
                                onMouseEnter={(e) => e.currentTarget.style.transform = 'translateY(-4px)'}
                                onMouseLeave={(e) => e.currentTarget.style.transform = 'translateY(0)'}
                                >
                                    <div style={{
                                        fontSize: '32px',
                                        fontWeight: '800',
                                        color: '#0F1419',
                                        margin: '0 0 8px 0'
                                    }}>{stat.value}</div>
                                    <div style={{
                                        fontSize: '14px',
                                        fontWeight: '500',
                                        color: '#6B7280',
                                        margin: 0
                                    }}>{stat.label}</div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Module Cards */}
                    <Container maxWidth="lg" sx={{ pb: 5 }}>
                        <Typography
                            variant="h4"
                            sx={{
                                fontWeight: 700,
                                color: '#0F1419',
                                mb: 4,
                                textAlign: 'center'
                            }}
                        >
                            Platform Services
                        </Typography>
                        
                        <Grid container spacing={3}>
                            {moduleList.map((module, index) => (
                                <Grid item xs={12} md={6} lg={4} key={module.id}>
                                    <Card
                                        sx={{
                                            height: '100%',
                                            transition: 'all 300ms cubic-bezier(0.4, 0, 0.2, 1)',
                                            cursor: module.available ? 'pointer' : 'default',
                                            transform: index < visibleCards ? 'translateY(0)' : 'translateY(20px)',
                                            opacity: index < visibleCards ? 1 : 0,
                                            transitionDelay: `${index * 80}ms`,
                                            '&:hover': module.available ? {
                                                transform: 'translateY(-8px)',
                                                boxShadow: '0 20px 40px rgba(0, 0, 0, 0.15)'
                                            } : {}
                                        }}
                                        onClick={() => {
                                            if (module.available && onModuleSelect) {
                                                onModuleSelect(module.id);
                                            }
                                            if (module.onClick) {
                                                module.onClick();
                                            }
                                        }}
                                    >
                                        <CardContent sx={{ p: 3, pb: 1 }}>
                                            <Box sx={{ display: 'flex', alignItems: 'flex-start', gap: 2, mb: 2 }}>
                                                <Paper
                                                    sx={{
                                                        width: 48,
                                                        height: 48,
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        backgroundColor: '#F8FAFC',
                                                        border: '1px solid #E5E7EB',
                                                        borderRadius: 1.5,
                                                        color: module.color
                                                    }}
                                                >
                                                    <module.icon />
                                                </Paper>
                                                <Box sx={{ flex: 1 }}>
                                                    <Typography variant="h6" sx={{ fontWeight: 700, color: '#0F1419', mb: 1 }}>
                                                        {module.title}
                                                    </Typography>
                                                    <Typography variant="body2" sx={{ color: '#6B7280', lineHeight: 1.5 }}>
                                                        {module.description}
                                                    </Typography>
                                                </Box>
                                                {module.count && (
                                                    <Chip
                                                        label={module.count}
                                                        color="error"
                                                        size="small"
                                                        sx={{ fontWeight: 600 }}
                                                    />
                                                )}
                                            </Box>
                                        </CardContent>
                                        
                                        <CardActions sx={{ pt: 0, px: 3, pb: 3, justifyContent: 'space-between' }}>
                                            <Chip
                                                label={
                                                    module.status === 'healthy' ? 'Operational' :
                                                    module.status === 'warning' ? 'Issues Detected' :
                                                    'Available'
                                                }
                                                color={
                                                    module.status === 'healthy' ? 'success' :
                                                    module.status === 'warning' ? 'warning' :
                                                    'primary'
                                                }
                                                size="small"
                                                variant="outlined"
                                            />
                                            
                                            {!module.available && (
                                                <Typography variant="caption" sx={{ color: '#6B7280', fontWeight: 500 }}>
                                                    Coming Soon
                                                </Typography>
                                            )}
                                        </CardActions>
                                    </Card>
                                </Grid>
                            ))}
                        </Grid>
                    </Container>
                </Box>
            );
        };

        // Module Content Components
        const ModuleContent = ({ moduleId }) => {
            const module = PUT_MODULES[moduleId.toUpperCase()];
            
            if (!module) return <div>Module not found</div>;

            return (
                <div className="module-content">
                    <div style={{
                        maxWidth: '1200px',
                        margin: '0 auto',
                        padding: '40px 24px',
                        textAlign: 'center'
                    }}>
                        <div style={{
                            fontSize: '48px',
                            marginBottom: '24px'
                        }}>
                            {module.icon}
                        </div>
                        <h1 style={{
                            fontSize: '32px',
                            fontWeight: '700',
                            color: '#002D72',
                            marginBottom: '16px'
                        }}>
                            {module.label}
                        </h1>
                        <p style={{
                            fontSize: '16px',
                            color: '#6B7280',
                            marginBottom: '32px',
                            maxWidth: '600px',
                            margin: '0 auto 32px'
                        }}>
                            {module.description}
                        </p>
                        <div style={{
                            background: 'white',
                            borderRadius: '16px',
                            padding: '40px',
                            border: '1px solid #E5E7EB',
                            boxShadow: '0 4px 12px rgba(0, 0, 0, 0.05)',
                            textAlign: 'left'
                        }}>
                            <h3 style={{
                                fontSize: '24px',
                                fontWeight: '600',
                                color: '#0F1419',
                                marginBottom: '16px'
                            }}>
                                Module Implementation
                            </h3>
                            <p style={{
                                fontSize: '14px',
                                color: '#6B7280',
                                lineHeight: '1.6',
                                marginBottom: '24px'
                            }}>
                                This module would be implemented as a separate micro-frontend and loaded dynamically. The app shell provides the navigation framework and consistent user experience across all modules.
                            </p>
                            <div style={{
                                background: '#F8FAFC',
                                borderRadius: '8px',
                                padding: '16px',
                                border: '1px solid #E5E7EB'
                            }}>
                                <h4 style={{
                                    fontSize: '16px',
                                    fontWeight: '600',
                                    color: '#0F1419',
                                    marginBottom: '8px'
                                }}>
                                    Key Features:
                                </h4>
                                <ul style={{
                                    margin: 0,
                                    paddingLeft: '20px',
                                    color: '#6B7280',
                                    fontSize: '14px',
                                    lineHeight: '1.6'
                                }}>
                                    <li>Micro-frontend architecture support</li>
                                    <li>Consistent design system integration</li>
                                    <li>Real-time data and notifications</li>
                                    <li>Role-based access control</li>
                                    <li>Comprehensive audit logging</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Module Page Content Component - Material-UI Style
        const ModulePageContent = ({ moduleId, currentPage, isCollapsed }) => {
            const module = PUT_MODULES[moduleId.toUpperCase()];
            const navigation = MODULE_NAVIGATION[moduleId] || [];
            const currentPageData = navigation.find(nav => nav.id === currentPage);

            if (!module || !currentPageData) {
                return (
                    <Container maxWidth="lg" sx={{ mt: 4 }}>
                        <Paper sx={{ p: 4, textAlign: 'center' }}>
                            <Typography variant="h4" sx={{ fontWeight: 700, color: '#1A2332', mb: 2 }}>
                                Page Not Found
                            </Typography>
                            <Typography variant="body1" color="text.secondary">
                                The requested page could not be found.
                            </Typography>
                        </Paper>
                    </Container>
                );
            }

            return (
                <Container maxWidth="lg" sx={{ mt: 4, mb: 6 }}>
                    {/* Page Header */}
                    <Box sx={{ mb: 4, pb: 3, borderBottom: '1px solid #E5E8EB' }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, mb: 1 }}>
                            <Box sx={{ 
                                display: 'flex', 
                                alignItems: 'center', 
                                justifyContent: 'center',
                                width: 48,
                                height: 48,
                                borderRadius: 2,
                                backgroundColor: 'rgba(35, 89, 222, 0.08)',
                                color: '#2359de'
                            }}>
                                {currentPageData.icon && React.createElement(currentPageData.icon)}
                            </Box>
                            <Typography variant="h4" sx={{ fontWeight: 700, color: '#1A2332' }}>
                                {currentPageData.label}
                            </Typography>
                        </Box>
                        <Typography variant="body1" color="text.secondary">
                            {module.label} › {currentPageData.label}
                        </Typography>
                    </Box>

                    {/* Content Grid */}
                    <Grid container spacing={3}>
                        <Grid item xs={12} md={6}>
                            <Card sx={{ height: '100%', transition: 'transform 200ms ease', '&:hover': { transform: 'translateY(-4px)' } }}>
                                <CardContent>
                                    <Typography variant="h6" sx={{ fontWeight: 600, color: '#1A2332', mb: 2 }}>
                                        {currentPageData.label} Overview
                                    </Typography>
                                    <Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.6 }}>
                                        This page would contain the actual {currentPageData.label.toLowerCase()} functionality 
                                        for the {module.label} module. Each page represents a specific workflow or feature 
                                        within the module, accessible through the sidebar navigation.
                                    </Typography>
                                </CardContent>
                            </Card>
                        </Grid>
                        
                        <Grid item xs={12} md={6}>
                            <Card sx={{ height: '100%', transition: 'transform 200ms ease', '&:hover': { transform: 'translateY(-4px)' } }}>
                                <CardContent>
                                    <Typography variant="h6" sx={{ fontWeight: 600, color: '#1A2332', mb: 2 }}>
                                        Quick Actions
                                    </Typography>
                                    <Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.6 }}>
                                        Common tasks and shortcuts for this page would be displayed here, 
                                        providing users with quick access to frequently used features.
                                    </Typography>
                                </CardContent>
                            </Card>
                        </Grid>
                        
                        <Grid item xs={12} md={6}>
                            <Card sx={{ height: '100%', transition: 'transform 200ms ease', '&:hover': { transform: 'translateY(-4px)' } }}>
                                <CardContent>
                                    <Typography variant="h6" sx={{ fontWeight: 600, color: '#1A2332', mb: 2 }}>
                                        Module Information
                                    </Typography>
                                    <Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.6 }}>
                                        <strong>Module:</strong> {module.label}<br/>
                                        <strong>Current Page:</strong> {currentPageData.label}<br/>
                                        <strong>Path:</strong> {currentPageData.path}
                                    </Typography>
                                </CardContent>
                            </Card>
                        </Grid>
                        
                        <Grid item xs={12} md={6}>
                            <Card sx={{ height: '100%', transition: 'transform 200ms ease', '&:hover': { transform: 'translateY(-4px)' } }}>
                                <CardContent>
                                    <Typography variant="h6" sx={{ fontWeight: 600, color: '#1A2332', mb: 2 }}>
                                        Available Pages
                                    </Typography>
                                    <Typography variant="body2" color="text.secondary" sx={{ mb: 2 }}>
                                        This module contains {navigation.length} pages:
                                    </Typography>
                                    <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 1 }}>
                                        {navigation.map((navItem) => (
                                            <Chip
                                                key={navItem.id}
                                                label={navItem.label}
                                                variant={currentPage === navItem.id ? "filled" : "outlined"}
                                                color={currentPage === navItem.id ? "primary" : "default"}
                                                size="small"
                                                sx={{ 
                                                    fontWeight: currentPage === navItem.id ? 600 : 400,
                                                    fontSize: '13px'
                                                }}
                                            />
                                        ))}
                                    </Box>
                                </CardContent>
                            </Card>
                        </Grid>
                    </Grid>
                </Container>
            );
        };

        // Main App Component with Sidebar Support
        const FullDemoApp = () => {
            const [currentModule, setCurrentModule] = useState('home');
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Simulate loading
                const timer = setTimeout(() => {
                    setLoading(false);
                }, 1000);

                return () => clearTimeout(timer);
            }, []);

            const handleModuleChange = (moduleId) => {
                console.log('Switching to module:', moduleId);
                setCurrentModule(moduleId);
                // Reset to first page when switching modules
                const navigation = MODULE_NAVIGATION[moduleId];
                if (navigation && navigation.length > 0) {
                    setCurrentPage(navigation[0].id);
                } else {
                    setCurrentPage('dashboard');
                }
            };

            const handlePageChange = (pageId, path) => {
                console.log('Switching to page:', pageId, 'at path:', path);
                setCurrentPage(pageId);
            };

            const handleToggleSidebar = (collapsed) => {
                setSidebarCollapsed(collapsed);
            };

            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <div>Loading PUT Platform...</div>
                    </div>
                );
            }

            // Layout Pattern 1: Home page - Header only (no sidebar)
            if (currentModule === 'home') {
                return (
                    <div style={{ minHeight: '100vh', backgroundColor: '#eff5f7' }}>
                        <PlatformHeader
                            currentModule={currentModule}
                            onModuleChange={handleModuleChange}
                            notifications={3}
                            user={{
                                name: 'Bruno Buger',
                                role: 'Senior Vice President'
                            }}
                            platformTitle="Production Unified Toolkit"
                        />
                        <main style={{ paddingTop: '102px' }}>
                            <PlatformWelcome
                                onModuleSelect={handleModuleChange}
                                showStats={true}
                            />
                        </main>
                    </div>
                );
            }

            // Layout Pattern 2: Module pages - Header + Sidebar + Content
            return (
                <div style={{ minHeight: '100vh', backgroundColor: '#eff5f7' }}>
                    <PlatformHeader
                        currentModule={currentModule}
                        onModuleChange={handleModuleChange}
                        notifications={3}
                        user={{
                            name: 'Bruno Buger',
                            role: 'Senior Vice President'
                        }}
                        platformTitle="Production Unified Toolkit"
                    />
                    <PlatformSidebar
                        currentModule={currentModule}
                        currentPage={currentPage}
                        onPageChange={handlePageChange}
                        isCollapsed={sidebarCollapsed}
                        onToggleCollapse={handleToggleSidebar}
                    />
                    <main className={`module-content ${sidebarCollapsed ? 'sidebar-collapsed' : ''}`}>
                        <ModulePageContent 
                            moduleId={currentModule}
                            currentPage={currentPage}
                            isCollapsed={sidebarCollapsed}
                        />
                    </main>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<FullDemoApp />);
    </script>
</body>
</html>
