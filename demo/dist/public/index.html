<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUT Platform - Core Components Demo</title>
    
    <!-- Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PUT Core Components -->
    <script src="../dist/put-components-umd.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #eff5f7;
            color: #1A2332;
        }
        
        #app {
            min-height: 100vh;
        }
        
        .page-content {
            padding: 2rem;
            background: white;
            border-radius: 16px;
            margin: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            min-height: calc(100vh - 150px);
        }
        
        .demo-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #F7FAFC;
            border: 1px solid #E5E8EB;
            border-radius: 12px;
        }
        
        .demo-section h3 {
            margin-bottom: 1rem;
            color: #1A2332;
            font-size: 1.125rem;
        }
        
        .demo-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .demo-button {
            padding: 0.5rem 1rem;
            border: 1px solid #E5E8EB;
            border-radius: 8px;
            background: white;
            color: #4A5568;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .demo-button:hover {
            border-color: #2359de;
            color: #2359de;
        }
        
        .demo-button.active {
            background: #2359de;
            border-color: #2359de;
            color: white;
        }
        
        .code-block {
            background: #1A202C;
            color: #E2E8F0;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.875rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 16px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading PUT Platform Demo...</div>
    </div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { PlatformHeader, PlatformSidebar, PUT_MODULES } = window.PUTComponents;

        // Simple icon components for demo
        const DashboardIcon = ({ size = 20, color = 'currentColor' }) => 
            React.createElement('div', { 
                style: { 
                    width: size, height: size, color, 
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: `${size * 0.8}px` 
                } 
            }, '📊');

        const MonitorsIcon = ({ size = 20, color = 'currentColor' }) => 
            React.createElement('div', { 
                style: { 
                    width: size, height: size, color, 
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: `${size * 0.8}px` 
                } 
            }, '📈');

        const AlertsIcon = ({ size = 20, color = 'currentColor' }) => 
            React.createElement('div', { 
                style: { 
                    width: size, height: size, color, 
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: `${size * 0.8}px` 
                } 
            }, '🚨');

        const SettingsIcon = ({ size = 20, color = 'currentColor' }) => 
            React.createElement('div', { 
                style: { 
                    width: size, height: size, color, 
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: `${size * 0.8}px` 
                } 
            }, '⚙️');

        const HeartIcon = ({ size = 20, color = 'currentColor' }) => 
            React.createElement('div', { 
                style: { 
                    width: size, height: size, color, 
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: `${size * 0.8}px` 
                } 
            }, '❤️');

        // Demo navigation data
        const demoNavigation = {
            health: [
                { id: 'dashboard', label: 'Dashboard', icon: DashboardIcon, description: 'Health overview' },
                { id: 'monitors', label: 'Monitors', icon: MonitorsIcon, description: 'Service monitoring' },
                { id: 'alerts', label: 'Alerts', icon: AlertsIcon, description: 'Alert configuration' },
                { id: 'settings', label: 'Settings', icon: SettingsIcon, description: 'Monitor settings' }
            ],
            comms: [
                { id: 'dashboard', label: 'Hub', icon: DashboardIcon, description: 'Communications hub' },
                { id: 'templates', label: 'Templates', icon: SettingsIcon, description: 'Message templates' }
            ],
            dns: [
                { id: 'dashboard', label: 'Dashboard', icon: DashboardIcon, description: 'DNS overview' },
                { id: 'records', label: 'Records', icon: SettingsIcon, description: 'DNS records' }
            ]
        };

        function DemoApp() {
            const [currentModule, setCurrentModule] = useState('health');
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

            const navigation = demoNavigation[currentModule] || [];
            const sidebarWidth = sidebarCollapsed ? 76 : 292;

            const handleModuleChange = (moduleId) => {
                setCurrentModule(moduleId);
                setCurrentPage('dashboard');
            };

            const handlePageChange = (pageId) => {
                setCurrentPage(pageId);
                console.log(`Navigation: ${currentModule} -> ${pageId}`);
            };

            const moduleInfo = useMemo(() => {
                const module = PUT_MODULES[currentModule.toUpperCase()];
                return module ? {
                    id: currentModule,
                    label: module.label,
                    icon: HeartIcon
                } : null;
            }, [currentModule]);

            return React.createElement('div', { 
                style: { display: 'flex', minHeight: '100vh' } 
            }, [
                // Sidebar
                navigation.length > 0 && React.createElement(PlatformSidebar, {
                    key: 'sidebar',
                    navigationItems: navigation,
                    activeItemId: currentPage,
                    onNavigationClick: (item) => handlePageChange(item.id),
                    isCollapsed: sidebarCollapsed,
                    onToggleCollapse: () => setSidebarCollapsed(!sidebarCollapsed),
                    moduleInfo: moduleInfo
                }),
                
                // Main content
                React.createElement('div', {
                    key: 'main',
                    style: {
                        marginLeft: navigation.length > 0 ? sidebarWidth : 0,
                        flex: 1,
                        display: 'flex',
                        flexDirection: 'column',
                        transition: 'margin-left 300ms ease'
                    }
                }, [
                    // Header
                    React.createElement(PlatformHeader, {
                        key: 'header',
                        currentModule: currentModule,
                        onModuleChange: handleModuleChange,
                        notifications: 3,
                        user: { name: 'Bruno Buger', role: 'Senior Vice President' }
                    }),
                    
                    // Page content
                    React.createElement('main', {
                        key: 'content',
                        style: { flex: 1, paddingTop: '94px' }
                    }, [
                        React.createElement('div', {
                            key: 'page',
                            className: 'page-content'
                        }, [
                            React.createElement('h1', { 
                                key: 'title',
                                style: { marginBottom: '1rem', fontSize: '2rem', fontWeight: 700 }
                            }, `${moduleInfo?.label || 'Module'} - ${navigation.find(n => n.id === currentPage)?.label || 'Page'}`),
                            
                            React.createElement('div', {
                                key: 'demo-controls',
                                className: 'demo-section'
                            }, [
                                React.createElement('h3', { key: 'title' }, '🎮 Demo Controls'),
                                React.createElement('div', {
                                    key: 'controls',
                                    className: 'demo-controls'
                                }, [
                                    React.createElement('button', {
                                        key: 'collapse',
                                        className: 'demo-button',
                                        onClick: () => setSidebarCollapsed(!sidebarCollapsed)
                                    }, sidebarCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'),
                                    ...navigation.map(item => 
                                        React.createElement('button', {
                                            key: item.id,
                                            className: `demo-button ${currentPage === item.id ? 'active' : ''}`,
                                            onClick: () => handlePageChange(item.id)
                                        }, item.label)
                                    )
                                ])
                            ]),
                            
                            React.createElement('div', {
                                key: 'features',
                                className: 'demo-section'
                            }, [
                                React.createElement('h3', { key: 'title' }, '✨ Key Features'),
                                React.createElement('ul', { 
                                    key: 'list',
                                    style: { marginLeft: '1.5rem', lineHeight: 1.6 }
                                }, [
                                    React.createElement('li', { key: '1' }, '🎯 Module-driven navigation - Each module defines its own navigation'),
                                    React.createElement('li', { key: '2' }, '⌨️ Full keyboard navigation - Arrow keys, Home, End, Enter, Escape'),
                                    React.createElement('li', { key: '3' }, '♿ WCAG 2.1 AA compliant - Screen reader support and ARIA labels'),
                                    React.createElement('li', { key: '4' }, '📱 Responsive design - Smooth collapse/expand animations'),
                                    React.createElement('li', { key: '5' }, '🚀 Router agnostic - Works with any routing solution')
                                ])
                            ]),
                            
                            React.createElement('div', {
                                key: 'usage',
                                className: 'demo-section'
                            }, [
                                React.createElement('h3', { key: 'title' }, '💻 Usage Example'),
                                React.createElement('div', {
                                    key: 'code',
                                    className: 'code-block'
                                }, `import { PlatformSidebar } from '@put/core-components';

function MyModule() {
  const [currentPage, setCurrentPage] = useState('dashboard');
  
  const navigation = [
    { id: 'dashboard', label: 'Dashboard', icon: DashboardIcon },
    { id: 'settings', label: 'Settings', icon: SettingsIcon }
  ];
  
  return (
    <PlatformSidebar
      navigationItems={navigation}
      activeItemId={currentPage}
      onNavigationClick={(item) => setCurrentPage(item.id)}
      moduleInfo={{ id: 'mymodule', label: 'My Module' }}
    />
  );
}`)
                            ])
                        ])
                    ])
                ])
            ]);
        }

        // Render the app
        ReactDOM.render(React.createElement(DemoApp), document.getElementById('app'));
    </script>
</body>
</html>
