<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUT Checks Modules</title>
    
    <!-- Material Icons -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/icon?family=Material+Icons" 
    />
    
    <!-- Inter Font -->
    <link 
      rel="preconnect" 
      href="https://fonts.googleapis.com"
    />
    <link 
      rel="preconnect" 
      href="https://fonts.gstatic.com" 
      crossorigin
    />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
      rel="stylesheet"
    />
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', 'Helvetica Neue', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #eff5f7;
        color: #1A2332;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading spinner styles */
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #eff5f7;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0e0e0;
        border-left-color: #2359de;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      /* PlatformSidebar Layout CSS */
      .module-content {
        margin-left: 280px;    /* Account for PlatformSidebar expanded width (280px) */
        padding: 24px 48px 24px 24px; /* More right padding for better alignment */
        transition: margin-left 300ms ease;
        min-height: 100vh;
      }

      .module-content.sidebar-collapsed {
        margin-left: 64px;     /* PlatformSidebar collapsed width (64px) */
        padding: 24px 64px 24px 24px;
      }

      @media (max-width: 1024px) {
        .module-content {
          margin-left: 0;
          padding: 24px;
        }
        
        .module-content.sidebar-collapsed {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <!-- Webpack will inject scripts via HtmlWebpackPlugin -->
  </body>
</html>
